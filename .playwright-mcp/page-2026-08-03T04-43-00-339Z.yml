        - text: ：完全避免聚集，每个关键字的探测序列不同。
      - heading "方法四：拉链法（Chaining）" [level=4] [ref=f12e2809]
      - paragraph [ref=f12e2810]:
        - strong [ref=f12e2811]: 大白话
        - text: ：每个哈希地址挂一个链表，冲突的元素放在链表后面。
      - paragraph [ref=f12e2812]:
        - strong [ref=f12e2813]: 例题 15
        - text: ：m=13，H(key)=key%13。插入：
