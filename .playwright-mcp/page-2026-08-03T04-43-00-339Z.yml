            - cell "记忆化，自底向上填表" [ref=f12e3699]
            - cell "子问题重叠" [ref=f12e3700]
            - cell "01背包、LCS" [ref=f12e3701]
          - row [ref=f12e3702]:
            - cell "贪心算法" [ref=f12e3703]
            - cell "每步选最优，不回退" [ref=f12e3704]
            - cell "需证明正确性" [ref=f12e3705]
            - cell "哈夫曼编码、最小生成树" [ref=f12e3706]
          - row [ref=f12e3707]:
            - cell "回溯法" [ref=f12e3708]
            - cell "DFS+剪枝" [ref=f12e3709]
            - cell "可求出所有解" [ref=f12e3710]
            - cell "N皇后、全排列" [ref=f12e3711]
          - row [ref=f12e3712]:
            - cell "分支限界法" [ref=f12e3713]
            - cell "BFS/优先队列+限界" [ref=f12e3714]
            - cell "只求最优解" [ref=f12e3715]
            - cell "旅行商、任务调度" [ref=f12e3716]
      - heading "9.7 易错陷阱" [level=3] [ref=f12e3717]
      - list [ref=f12e3718]:
        - listitem [ref=f12e3719]:
          - strong [ref=f12e3720]: 分治 vs DP
          - text: ：看子问题是否独立。归并排序的两个子数组互不干扰（分治），斐波那契 F(n-1) 和 F(n-2) 都依赖 F(n-3)（DP）。
        - listitem [ref=f12e3721]:
          - strong [ref=f12e3722]: 01 背包一维优化
          - text: ：j 必须从大到小，否则变成完全背包。高频考点！
        - listitem [ref=f12e3723]:
          - strong [ref=f12e3724]: 贪心不一定正确
          - text: ：必须验证贪心选择性质。经典反例：硬币找零（面值 1, 4, 5 找 8）。
        - listitem [ref=f12e3725]:
          - strong [ref=f12e3726]: 回溯法忘记恢复现场
          - text: ：递归返回时必须撤销修改，否则影响其他分支。
        - listitem [ref=f12e3727]:
          - strong [ref=f12e3728]: LCS 中"子序列"vs"子串"
          - text: ：子序列不要求连续，子串要求连续。
      - heading "9.8 记忆口诀" [level=3] [ref=f12e3729]
      - blockquote [ref=f12e3730]:
        - paragraph [ref=f12e3731]:
          - strong [ref=f12e3732]: 分治法
          - text: ：分治合，三步行。主定理，比大小，谁大听谁的，一样大就乘 log n。
          - strong [ref=f12e3733]: 动态规划
          - text: ：最优子结构，子问题重叠。定义状态→转移方程→初始化→填表序，四步走。
          - strong [ref=f12e3734]: 01 背包
          - text: ：选或不选取最大，一维倒序，二维正序。
          - strong [ref=f12e3735]: 贪心算法
          - text: ：每步最优，绝不回头。能用则快，用前先证。
          - strong [ref=f12e3736]: 回溯法
          - text: ：DFS 走到底，不通就回头。约束条件来剪枝，排列子集两张图。
          - strong [ref=f12e3737]: 区分口诀
          - text: ：独立用分治，重叠用 DP，贪心快但需证，回溯求所有，分支限界求最优。
      - heading "9.9 例题精讲" [level=3] [ref=f12e3738]
      - paragraph [ref=f12e3739]:
        - strong [ref=f12e3740]: 例题 22
        - text: ：以下哪个问题最适合用贪心算法解决？ A. 0/1 背包问题（每个物品只能选一次） B. 最短路径（Dijkstra） C. 斐波那契数列 D. N 皇后问题
      - blockquote [ref=f12e3741]:
        - paragraph [ref=f12e3742]:
          - strong [ref=f12e3743]: 答案：B
          - text: 。Dijkstra 算法每次选当前最近的顶点就是贪心策略，且被证明能得到全局最优。0/1 背包贪心不一定最优，斐波那契适合 DP，N 皇后用回溯。
      - paragraph [ref=f12e3744]:
        - strong [ref=f12e3745]: 例题 23
        - text: ：说到"自底向上填表"、"状态转移方程"这两个特征词，说的是哪个算法思想？ A. 分治 B. 贪心 C. 动态规划 D. 回溯
      - blockquote [ref=f12e3746]:
        - paragraph [ref=f12e3747]:
          - strong [ref=f12e3748]: 答案：C
          - text: 。DP 的两个标志性特征。
      - paragraph [ref=f12e3749]:
        - strong [ref=f12e3750]: 例题 24
        - text: ：以下关于分治法和动态规划的说法，
        - strong [ref=f12e3751]: 正确
        - text: 的是（ ） A. 分治法的子问题可以重叠，DP 的子问题不能重叠 B. 归并排序体现了 DP 的思想 C. 动态规划用自底向上填表，分治用自顶向下递归 D. 贪心算法比 DP 效率低
      - blockquote [ref=f12e3752]:
        - paragraph [ref=f12e3753]:
          - strong [ref=f12e3754]: 答案：C
          - text: 。A 说反了；B 归并是分治；D 贪心通常比 DP 快。
      - paragraph [ref=f12e3755]:
        - strong [ref=f12e3756]: 例题 25
        - text: ：01 背包问题用一维数组优化时，内层循环 j 应该（ ） A. 从小到大遍历 B. 从大到小遍历 C. 任意顺序 D. 不需要遍历
      - blockquote [ref=f12e3757]:
        - paragraph [ref=f12e3758]:
          - strong [ref=f12e3759]: 答案：B
          - text: 。从大到小保证每个物品只用一次。从小到大会变成完全背包。
