        - text: ：行优先和列优先公式混淆。看清题目用的是哪种存储方式，下标从 0 还是从 1 开始。
      - paragraph [ref=f12e1260]:
        - strong [ref=f12e1261]: 陷阱 2
        - text: ：对称矩阵压缩存储时，上三角元素要先用对称性转成下三角再套公式。
      - paragraph [ref=f12e1262]:
        - strong [ref=f12e1263]: 陷阱 3
        - text: ：next 数组下标从 0 还是从 1 开始？不同教材不一样（严蔚敏版从 1 开始，天勤/王道从 0 开始）。国网考试通常以王道为准（下标从 0 开始，next[0] = -1）。
      - paragraph [ref=f12e1264]:
        - strong [ref=f12e1265]: 陷阱 4
        - text: ：广义表的 Tail 永远返回广义表（带括号），即使只有一个元素也加括号。例如 Tail((a, b)) = (b)，不是 b。
      - paragraph [ref=f12e1266]:
        - strong [ref=f12e1267]: 陷阱 5
        - text: ：KMP 算法中 next[j] 看的是"j 之前的子串"，不包含 j 本身。例如求 next[3] 时看 T[0...2]。
