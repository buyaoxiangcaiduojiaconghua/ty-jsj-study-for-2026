      - paragraph [ref=f12e1970]:
        - strong [ref=f12e1971]: （1）Prim（普里姆）算法——"加点法"
      - paragraph [ref=f12e1972]:
        - strong [ref=f12e1973]: 核心思想
        - text: ：从任意一个顶点出发，每次选择与当前已选顶点集合距离最近的顶点加入。
      - paragraph [ref=f12e1974]:
        - strong [ref=f12e1975]: 算法步骤
        - text: （以具体例子说明）：
      - paragraph [ref=f12e1976]: "假设图 G 的顶点为 {A, B, C, D, E}，边权值为："
      - code [ref=f12e1978]: "A-B: 3, A-C: 7, A-D: 5, A-E: 10 B-C: 4, B-D: 2, B-E: 8 C-D: 6, C-E: 9 D-E: 1"
      - paragraph [ref=f12e1979]:
        - strong [ref=f12e1980]: Prim 算法执行过程
        - text: ：
      - code [ref=f12e1982]: "初始：选 A 为起点，已选集合 S = {A} 候选边：A-B(3), A-C(7), A-D(5), A-E(10) 第 1 步：选最小边 A-B(3)，S = {A, B}，MST 边 = {A-B} 候选边更新：B-C(4), B-D(2), B-E(8) 与原有的 A-C(7), A-D(5), A-E(10) 比较后 候选边：B-D(2), A-D(5), B-C(4), A-C(7), A-E(10), B-E(8) 第 2 步：选最小边 B-D(2)，S = {A, B, D}，MST 边 = {A-B, B-D} 候选边更新：加入 D-E(1), D-C(6)，候选边：D-E(1), B-C(4), D-C(6), A-C(7), A-E(10), B-E(8) 第 3 步：选最小边 D-E(1)，S = {A, B, D, E}，MST 边 = {A-B, B-D, D-E} 候选边更新：加入 E-C(9)，候选边：B-C(4), D-C(6), A-C(7), E-C(9) 第 4 步：选最小边 B-C(4)，S = {A, B, C, D, E}，MST 边 = {A-B, B-D, D-E, B-C} 所有顶点已选完，MST 总权值 = 3 + 2 + 1 + 4 = 10"
      - paragraph [ref=f12e1983]:
        - strong [ref=f12e1984]: 时间复杂度
        - text: ：朴素实现 O(n²)，堆优化 O((n+e)log n)
        - strong [ref=f12e1985]: 适合场景
        - text: ：稠密图（边数接近 n² 时，O(n²) 比 O(e log e) 更优）
      - paragraph [ref=f12e1986]:
        - strong [ref=f12e1987]: （2）Kruskal（克鲁斯卡尔）算法——"加边法"
      - paragraph [ref=f12e1988]:
        - strong [ref=f12e1989]: 核心思想
        - text: ：将边按权值从小到大排序，依次选择最小的边，如果加入后不形成环，就加入 MST。
      - paragraph [ref=f12e1990]:
        - strong [ref=f12e1991]: 算法步骤
        - text: （以同上图为例，边已按权值排序）：
      - code [ref=f12e1993]: "边排序结果：D-E(1), B-D(2), A-B(3), B-C(4), A-D(5), C-D(6), A-C(7), B-E(8), C-E(9), A-E(10) 第 1 步：选 D-E(1)，不形成环，加入。MST 边 = {D-E} 第 2 步：选 B-D(2)，不形成环，加入。MST 边 = {D-E, B-D} 第 3 步：选 A-B(3)，不形成环，加入。MST 边 = {D-E, B-D, A-B} 第 4 步：选 B-C(4)，不形成环，加入。MST 边 = {D-E, B-D, A-B, B-C} 此时已有 4 条边 = n-1 = 4，MST 完成！ 总权值 = 1 + 2 + 3 + 4 = 10 注意：第 5 步 A-D(5) 虽然排到了，但加入会形成环 A-B-D-A，所以跳过。"
      - paragraph [ref=f12e1994]:
        - strong [ref=f12e1995]: 判环方法
        - text: ：用并查集。判断要加入的边的两个端点是否已经在同一集合中，如果是则加入会形成环。
      - list [ref=f12e1996]:
        - listitem [ref=f12e1997]: 初始：每个顶点各自为一个集合
        - listitem [ref=f12e1998]: 选边 (u,v) 时：如果 Find(u) == Find(v)，则跳过；否则 Union(u,v) 并加入 MST
