        - text: ：
        - strong [ref=f12e2699]: "\"二次聚集\""
        - text: ——非同义词（本来 H(key) 不同的关键字）也会争抢同一个探测序列，导致冲突加剧。
      - heading "方法二：平方探测法（Quadratic Probing）" [level=4] [ref=f12e2700]
      - paragraph [ref=f12e2701]:
        - strong [ref=f12e2702]: 公式
        - text: ：Hi = (H(key) + i^2) % m（或 +-i^2），i = 0, 1, 2, ...
      - paragraph [ref=f12e2703]:
        - strong [ref=f12e2704]: 大白话
        - text: ：冲突后不是往后挪 1 步，而是往后挪 1^2, 2^2, 3^2... 步，跳跃式探测。
