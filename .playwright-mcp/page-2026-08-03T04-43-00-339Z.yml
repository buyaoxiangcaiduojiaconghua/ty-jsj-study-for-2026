            - cell "判断 i,j 是否相邻" [ref=f12e1871]
            - cell "O(1)" [ref=f12e1872]
            - cell "O(deg(i))" [ref=f12e1873]
          - row [ref=f12e1874]:
            - cell "找顶点 i 的所有邻居" [ref=f12e1875]
            - cell "O(n)" [ref=f12e1876]
            - cell "O(deg(i))" [ref=f12e1877]
          - row [ref=f12e1878]:
            - cell "找顶点 i 的所有入边" [ref=f12e1879]
            - cell "O(n)" [ref=f12e1880]
            - cell "O(n+e)（需遍历所有链表）" [ref=f12e1881]
          - row [ref=f12e1882]:
            - cell "适合什么图" [ref=f12e1883]
            - cell "稠密图（边接近 n²）" [ref=f12e1884]
            - cell "稀疏图（边远小于 n²）" [ref=f12e1885]
          - row [ref=f12e1886]:
            - cell "无向图对称性" [ref=f12e1887]
            - cell "天然保持" [ref=f12e1888]
            - cell "需要手动维护" [ref=f12e1889]
          - row [ref=f12e1890]:
