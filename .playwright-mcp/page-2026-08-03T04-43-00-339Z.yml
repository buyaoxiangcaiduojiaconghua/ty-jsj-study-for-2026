          - row [ref=f12e4447]:
            - cell "稳定性" [ref=f12e4448]
            - cell [ref=f12e4449]:
              - strong [ref=f12e4450]: 稳定
            - cell [ref=f12e4451]:
              - strong [ref=f12e4452]: 不稳定
              - text: （交换时可能打乱顺序）
          - row [ref=f12e4453]:
            - cell "适用场景" [ref=f12e4454]
            - cell "数据量大、要求稳定、外排序" [ref=f12e4455]
            - cell "数据量大、内存内排序、对稳定性无要求" [ref=f12e4456]
          - row [ref=f12e4457]:
            - cell "优化方法" [ref=f12e4458]
            - cell "非递归迭代实现减少栈开销" [ref=f12e4459]
            - cell "三数取中法/随机选主元避免最坏情况" [ref=f12e4460]
      - heading "真题 16（基础）" [level=4] [ref=f12e4461]
      - paragraph [ref=f12e4462]:
        - strong [ref=f12e4463]: "[题目]"
        - text: 在下列排序算法中，平均时间复杂度为 O(n log n)，且在最坏情况下时间复杂度仍为 O(n log n) 的算法是（ ）。
      - paragraph [ref=f12e4464]:
        - strong [ref=f12e4465]: "[选项]"
        - text: A. 快速排序 B. 堆排序 C. 冒泡排序 D. 希尔排序
      - paragraph [ref=f12e4466]:
        - strong [ref=f12e4467]: "[答案]"
        - text: B
      - paragraph [ref=f12e4468]:
        - strong [ref=f12e4469]: "[解析]"
      - list [ref=f12e4470]:
        - listitem [ref=f12e4471]: 快速排序最坏 O(n^2)，排除 A。
        - listitem [ref=f12e4472]: 冒泡排序平均 O(n^2)，排除 C。
        - listitem [ref=f12e4473]: 希尔排序最坏情况取决于增量序列，可能大于 O(n log n)，排除 D。
        - listitem [ref=f12e4474]: 堆排序无论最好、平均、最坏都是 O(n log n)，选 B。
      - heading "真题 17（进阶）" [level=4] [ref=f12e4475]
      - paragraph [ref=f12e4476]:
        - strong [ref=f12e4477]: "[题目]"
        - text: 关于排序算法，下列说法正确的是（ ）。
      - paragraph [ref=f12e4478]:
        - strong [ref=f12e4479]: "[选项]"
        - text: A. 归并排序的空间复杂度为 O(1)，因此适合内存受限的场景 B. 快速排序在待排序序列基本有序时效率最高 C. 归并排序是稳定排序，快速排序是不稳定排序 D. 归并排序和快速排序在最坏情况下的时间复杂度均为 O(n log n)
      - paragraph [ref=f12e4480]:
        - strong [ref=f12e4481]: "[答案]"
        - text: C
      - paragraph [ref=f12e4482]:
        - strong [ref=f12e4483]: "[解析]"
      - list [ref=f12e4484]:
        - listitem [ref=f12e4485]: A 错误：归并排序需要辅助数组，空间复杂度 O(n)，不是 O(1)。
        - listitem [ref=f12e4486]: B 错误：快速排序在基本有序时退化为 O(n^2)，效率最低。
        - listitem [ref=f12e4487]: C 正确：归并排序合并时保持相等元素的相对顺序，稳定；快速排序交换时可能打乱，不稳定。
        - listitem [ref=f12e4488]: D 错误：快速排序最坏为 O(n^2)。
      - separator [ref=f12e4489]
      - heading "九、图的拓扑排序和关键路径手工计算模板" [level=3] [ref=f12e4490]
      - heading "拓扑排序模板" [level=4] [ref=f12e4491]
      - paragraph [ref=f12e4492]:
        - strong [ref=f12e4493]: 第1步：
        - text: 统计每个顶点的入度。
      - paragraph [ref=f12e4494]:
        - strong [ref=f12e4495]: 第2步：
        - text: 将所有入度为 0 的顶点入队（或入栈）。
      - paragraph [ref=f12e4496]:
        - strong [ref=f12e4497]: 第3步：
        - text: 队首出队（输出），删除该顶点所有出边（即相邻顶点入度减 1），若相邻顶点入度变为 0 则入队。
      - paragraph [ref=f12e4498]:
        - strong [ref=f12e4499]: 第4步：
        - text: 重复第3步直到队列为空。若输出顶点数 < 总顶点数，则图中有环。
      - heading "关键路径模板" [level=4] [ref=f12e4500]
      - paragraph [ref=f12e4501]:
        - strong [ref=f12e4502]: 第1步：
        - text: 按拓扑序列计算每个顶点的最早发生时间 ve(i)：
      - list [ref=f12e4503]:
        - listitem [ref=f12e4504]: ve(源点) = 0
        - listitem [ref=f12e4505]: "ve(j) = max{ ve(i) + 边(i->j)的权值 }，i 为 j 的所有前驱"
      - paragraph [ref=f12e4506]:
        - strong [ref=f12e4507]: 第2步：
        - text: 按逆拓扑序列计算每个顶点的最晚发生时间 vl(i)：
      - list [ref=f12e4508]:
        - listitem [ref=f12e4509]: vl(汇点) = ve(汇点)
        - listitem [ref=f12e4510]: "vl(i) = min{ vl(j) - 边(i->j)的权值 }，j 为 i 的所有后继"
      - paragraph [ref=f12e4511]:
        - strong [ref=f12e4512]: 第3步：
        - text: 计算每条边（活动）的最早开始时间 e 和最晚开始时间 l：
      - list [ref=f12e4513]:
        - listitem [ref=f12e4514]: e(i->j) = ve(i)
        - listitem [ref=f12e4515]: l(i->j) = vl(j) - 边权值
      - paragraph [ref=f12e4516]:
        - strong [ref=f12e4517]: 第4步：
        - text: 若 e = l，则该活动是关键活动，由关键活动构成的路径即为关键路径。
      - heading "真题 18（拓扑排序）" [level=4] [ref=f12e4518]
      - paragraph [ref=f12e4519]:
        - strong [ref=f12e4520]: "[题目]"
        - text: 对下图进行拓扑排序，以下哪个序列不可能是拓扑排序的结果？（图：边为 A->B, A->C, B->D, C->D, D->E）
      - paragraph [ref=f12e4521]:
        - strong [ref=f12e4522]: "[选项]"
        - text: A. A, B, C, D, E B. A, C, B, D, E C. A, B, D, C, E D. B, A, C, D, E
      - paragraph [ref=f12e4523]:
        - strong [ref=f12e4524]: "[答案]"
        - text: D
      - paragraph [ref=f12e4525]:
        - strong [ref=f12e4526]: "[解析]"
      - list [ref=f12e4527]:
        - listitem [ref=f12e4528]: 入度：A=0, B=1, C=1, D=2, E=1
        - listitem [ref=f12e4529]: A 入度为 0，必须先输出；D 选项第一个输出 B，但 B 的入度为 1（A->B），A 还没输出，B 入度不为 0，不可能。选 D。
        - listitem [ref=f12e4530]: A、B、C 都合法：A 输出后 B 和 C 入度均为 0，先后顺序任意；D 在 B 和 C 都输出后入度为 0，E 最后。
      - heading "真题 19（关键路径）" [level=4] [ref=f12e4531]
      - paragraph [ref=f12e4532]:
        - strong [ref=f12e4533]: "[题目]"
        - text: 某 AOE 网包含 6 个顶点 V1~V6 和如下边：V1->V2(3), V1->V3(2), V2->V4(2), V2->V5(3), V3->V4(4), V3->V6(3), V4->V6(2), V5->V6(1)。其中括号内为活动持续时间。则关键路径的长度为（ ）。
      - paragraph [ref=f12e4534]:
        - strong [ref=f12e4535]: "[选项]"
        - text: A. 8 B. 9 C. 10 D. 7
      - paragraph [ref=f12e4536]:
        - strong [ref=f12e4537]: "[答案]"
        - text: A
      - paragraph [ref=f12e4538]:
        - strong [ref=f12e4539]: "[解析]"
      - list [ref=f12e4540]:
        - listitem [ref=f12e4541]: 拓扑序：V1, V2, V3, V4, V5, V6
        - listitem [ref=f12e4542]:
          - text: 计算 ve：
          - list [ref=f12e4543]:
            - listitem [ref=f12e4544]: ve(V1)=0
            - listitem [ref=f12e4545]: ve(V2)=ve(V1)+3=3
            - listitem [ref=f12e4546]: ve(V3)=ve(V1)+2=2
            - listitem [ref=f12e4547]: "ve(V4)=max{ve(V2)+2, ve(V3)+4}=max{5, 6}=6"
            - listitem [ref=f12e4548]: ve(V5)=ve(V2)+3=6
            - listitem [ref=f12e4549]: "ve(V6)=max{ve(V4)+2, ve(V5)+1, ve(V3)+3}=max{8, 7, 5}=8"
        - listitem [ref=f12e4550]: 关键路径长度 = ve(V6) = 8，路径为 V1->V2->V4->V6 或 V1->V3->V4->V6，长度均为 8。选 A。
      - separator [ref=f12e4551]
      - heading "十、折半查找判定树画法和 ASL 计算公式" [level=3] [ref=f12e4552]
      - heading "判定树画法模板" [level=4] [ref=f12e4553]
      - paragraph [ref=f12e4554]:
        - strong [ref=f12e4555]: 第1步：
        - text: 确定有序表长度 n，找到中间位置 mid = floor((1+n)/2)（或 ceil，看题目约定），mid 作为根节点。
      - paragraph [ref=f12e4556]:
        - strong [ref=f12e4557]: 第2步：
        - text: 左半部分 [1, mid-1] 递归构建左子树，右半部分 [mid+1, n] 递归构建右子树。
      - paragraph [ref=f12e4558]:
        - strong [ref=f12e4559]: 第3步：
        - text: 判定树本质是一棵
        - strong [ref=f12e4560]: 平衡二叉排序树
        - text: ，每个节点值代表该次比较的数组下标。
      - heading "ASL 计算公式" [level=4] [ref=f12e4561]
      - paragraph [ref=f12e4562]:
        - strong [ref=f12e4563]: ASL(成功) = 所有查找成功的比较次数之和 / 元素个数 n
        - text: = (1x1 + 2x2 + 4x3 + ... + 最后一层节点数x该层深度) / n
      - paragraph [ref=f12e4564]:
        - strong [ref=f12e4565]: 通用公式：
        - text: 对于长度为 n 的有序表，判定树高度 h = floor(log2 n) + 1，ASL(成功) 约等于 log2(n+1) - 1（近似值）。
      - paragraph [ref=f12e4566]:
        - strong [ref=f12e4567]: ASL(失败) = 所有外节点（失败节点）的比较次数之和 / 外节点个数
      - heading "真题 20（基础）" [level=4] [ref=f12e4568]
      - paragraph [ref=f12e4569]:
        - strong [ref=f12e4570]: "[题目]"
        - text: 对长度为 11 的有序表进行折半查找，查找成功的平均查找长度 ASL 约为（ ）。
      - paragraph [ref=f12e4571]:
        - strong [ref=f12e4572]: "[选项]"
        - text: A. 2 B. 3 C. 4 D. 5
      - paragraph [ref=f12e4573]:
        - strong [ref=f12e4574]: "[答案]"
        - text: B
      - paragraph [ref=f12e4575]:
        - strong [ref=f12e4576]: "[解析]"
        - text: n=11 的判定树：根=6，第二层=3和9，第三层=1,4,7,10，第四层=2,5,8,11。
      - list [ref=f12e4577]:
        - listitem [ref=f12e4578]: 深度1：1个节点(6)，比较1次
        - listitem [ref=f12e4579]: 深度2：2个节点(3,9)，各比较2次
        - listitem [ref=f12e4580]: 深度3：4个节点(1,4,7,10)，各比较3次
        - listitem [ref=f12e4581]: 深度4：4个节点(2,5,8,11)，各比较4次
        - listitem [ref=f12e4582]: ASL = (1x1 + 2x2 + 4x3 + 4x4) / 11 = (1+4+12+16)/11 = 33/11 = 3。选 B。
      - heading "真题 21（进阶）" [level=4] [ref=f12e4583]
      - paragraph [ref=f12e4584]:
        - strong [ref=f12e4585]: "[题目]"
        - text: 对长度为 15 的有序表进行折半查找，设每个元素查找概率相等。则查找成功时的 ASL 为（ ），查找失败时的 ASL 为（ ）。
      - paragraph [ref=f12e4586]:
        - strong [ref=f12e4587]: "[选项]"
        - text: A. 49/15, 64/16 B. 49/15, 59/16 C. 49/15, 4 D. 50/15, 4
      - paragraph [ref=f12e4588]:
        - strong [ref=f12e4589]: "[答案]"
        - text: C
      - paragraph [ref=f12e4590]:
        - strong [ref=f12e4591]: "[解析]"
        - text: n=15 的判定树为满二叉树（4层）：
      - list [ref=f12e4592]:
        - listitem [ref=f12e4593]: 深度1：1个节点，比较1次 -> 1
        - listitem [ref=f12e4594]: 深度2：2个节点，比较2次 -> 4
        - listitem [ref=f12e4595]: 深度3：4个节点，比较3次 -> 12
        - listitem [ref=f12e4596]: 深度4：8个节点，比较4次 -> 32
        - listitem [ref=f12e4597]: ASL成功 = (1+4+12+32)/15 = 49/15
      - paragraph [ref=f12e4598]: 失败节点（外节点）16个，均在判定树第5层（即在第4层叶子节点比较后，发现空指针），每个比较4次后失败：
      - list [ref=f12e4599]:
        - listitem [ref=f12e4600]: ASL失败 = 16x4/16 = 4 选 C。
