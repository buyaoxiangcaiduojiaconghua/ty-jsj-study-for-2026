              - strong [ref=f12e4440]: O(n^2)
              - text: （已有序/逆序时）
          - row [ref=f12e4441]:
            - cell "空间复杂度" [ref=f12e4442]
            - cell [ref=f12e4443]:
              - strong [ref=f12e4444]: O(n)
              - text: （需要辅助数组）
            - cell [ref=f12e4445]:
              - strong [ref=f12e4446]: O(log n)
