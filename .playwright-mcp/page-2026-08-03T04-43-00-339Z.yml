      - separator [ref=f12e3193]
      - heading "知识点 8：2 八大排序——同一序列演示每一趟过程" [level=3] [ref=f12e3194]
      - paragraph [ref=f12e3195]:
        - strong [ref=f12e3196]: 统一例题序列
        - text: ：
        - code [ref=f12e3197]: "[49, 38, 65, 97, 76, 13, 27, 49']"
        - text: （注意：有两个 49，后面用 49' 区分先出现的那个）
      - heading "1. 直接插入排序" [level=4] [ref=f12e3198]
      - paragraph [ref=f12e3199]:
        - strong [ref=f12e3200]: 大白话
        - text: ：像打牌理牌，从第 2 张牌开始，每张牌跟前面已排好的牌比，插到正确位置。
      - code [ref=f12e3202]: 初始： [49, 38, 65, 97, 76, 13, 27, 49'] 第 1 趟： [38, 49, 65, 97, 76, 13, 27, 49'] （38 插入到 49 前面） 第 2 趟： [38, 49, 65, 97, 76, 13, 27, 49'] （65 比 49 大，不动） 第 3 趟： [38, 49, 65, 97, 76, 13, 27, 49'] （97 比 65 大，不动） 第 4 趟： [38, 49, 65, 76, 97, 13, 27, 49'] （76 插入到 65 和 97 之间） 第 5 趟： [13, 38, 49, 65, 76, 97, 27, 49'] （13 插入到最前面） 第 6 趟： [13, 27, 38, 49, 65, 76, 97, 49'] （27 插入到 13 和 38 之间） 第 7 趟： [13, 27, 38, 49, 49', 65, 76, 97] （49' 插入到 49 和 65 之间）
      - paragraph [ref=f12e3203]:
        - strong [ref=f12e3204]: 稳定性
        - text: ：49 始终在 49' 前面，稳定。
      - heading "2. 希尔排序（增量序列：d=4, 2, 1）" [level=4] [ref=f12e3205]
      - paragraph [ref=f12e3206]:
        - strong [ref=f12e3207]: 大白话
        - text: ：把序列按间隔分组，每组内做插入排序，逐步缩小间隔。
      - code [ref=f12e3209]: "初始： [49, 38, 65, 97, 76, 13, 27, 49'] d=4 分组： 组1: 49, 76 -> 排序后 [49, 76] 组2: 38, 13 -> 排序后 [13, 38] 组3: 65, 27 -> 排序后 [27, 65] 组4: 97, 49' -> 排序后 [49', 97] 第 1 趟后：[49, 13, 27, 49', 76, 38, 65, 97] d=2 分组： 组1: 49, 27, 76, 65 -> 排序后 [27, 49, 65, 76] 组2: 13, 49', 38, 97 -> 排序后 [13, 38, 49', 97] 第 2 趟后：[27, 13, 49, 38, 65, 49', 76, 97] d=1（整体插入排序）： 第 3 趟后：[13, 27, 38, 49, 49', 65, 76, 97]"
      - paragraph [ref=f12e3210]:
        - strong [ref=f12e3211]: 稳定性
        - text: ：两个 49 的相对顺序在 d=4 时可能改变，不稳定。
      - heading "3. 冒泡排序" [level=4] [ref=f12e3212]
      - paragraph [ref=f12e3213]:
        - strong [ref=f12e3214]: 大白话
        - text: ：相邻两两比较，大的往后沉（像泡泡浮上去）。
      - code [ref=f12e3216]: 初始： [49, 38, 65, 97, 76, 13, 27, 49'] 第 1 趟： [38, 49, 65, 76, 13, 27, 49', 97] （97 沉底） 第 2 趟： [38, 49, 65, 13, 27, 49', 76, 97] （76 就位） 第 3 趟： [38, 49, 13, 27, 49', 65, 76, 97] （65 就位） 第 4 趟： [38, 13, 27, 49, 49', 65, 76, 97] （49' 就位） 第 5 趟： [13, 27, 38, 49, 49', 65, 76, 97] （38 就位，已有序） 第 6 趟： [13, 27, 38, 49, 49', 65, 76, 97] （无交换，提前结束）
      - paragraph [ref=f12e3217]:
        - strong [ref=f12e3218]: 稳定性
        - text: ：相邻交换不会跨过相等元素，稳定。
      - heading "4. 快速排序（pivot 取第一个元素）" [level=4] [ref=f12e3219]
      - paragraph [ref=f12e3220]:
        - strong [ref=f12e3221]: 大白话
        - text: ：选基准，左边都小于它，右边都大于它，递归。
      - code [ref=f12e3223]: 初始：[49, 38, 65, 97, 76, 13, 27, 49']，pivot=49 第 1 趟分区过程（挖坑法）： low=0(49), high=7(49') 从右往左找 < 49 的：27 < 49，把 27 放 low 位置 -> [27, 38, 65, 97, 76, 13, 27, 49'] 从左往右找 > 49 的：65 > 49，把 65 放 high 位置 -> [27, 38, 65, 97, 76, 13, 65, 49'] 从右往左找 < 49 的：13 < 49，把 13 放 low 位置 -> [27, 38, 13, 97, 76, 13, 65, 49'] 从左往右找 > 49 的：97 > 49，把 97 放 high 位置 -> [27, 38, 13, 97, 76, 97, 65, 49'] low=high=3，把 pivot 放入 -> [27, 38, 13, 49, 76, 97, 65, 49'] 第 1 趟后：[27, 38, 13, 49, 76, 97, 65, 49']（pivot=49 就位，但 49' 在右边） 递归左半 [27, 38, 13]，pivot=27：-> [13, 27, 38] 递归右半 [76, 97, 65, 49']，pivot=76：-> [49', 65, 76, 97] 最终：[13, 27, 38, 49, 49', 65, 76, 97]
      - paragraph [ref=f12e3224]:
        - strong [ref=f12e3225]: 稳定性
        - text: ：分区时会跨过相等元素，
        - strong [ref=f12e3226]: 不稳定
        - text: 。
      - heading "5. 简单选择排序" [level=4] [ref=f12e3227]
      - paragraph [ref=f12e3228]:
        - strong [ref=f12e3229]: 大白话
        - text: ：每轮从剩余元素中选最小的，放到最前面。
      - code [ref=f12e3231]: 初始： [49, 38, 65, 97, 76, 13, 27, 49'] 第 1 趟： [13, 38, 65, 97, 76, 49, 27, 49'] （13 最小，与 49 交换） 第 2 趟： [13, 27, 65, 97, 76, 49, 38, 49'] （27 最小，与 38 交换） 第 3 趟： [13, 27, 38, 97, 76, 49, 65, 49'] （38 最小，与 65 交换） 第 4 趟： [13, 27, 38, 49, 76, 97, 65, 49'] （49 最小，与 97 交换） 第 5 趟： [13, 27, 38, 49, 49', 97, 65, 76] （49' 最小，与 76 交换） 第 6 趟： [13, 27, 38, 49, 49', 65, 97, 76] （65 最小，与 97 交换） 第 7 趟： [13, 27, 38, 49, 49', 65, 76, 97] （76 最小，与 97 交换）
      - paragraph [ref=f12e3232]:
        - strong [ref=f12e3233]: 稳定性
        - text: ：第 1 趟 13 与 49 交换，假如中间有 49 的相等元素，顺序可能被打乱，所以
        - strong [ref=f12e3234]: 不稳定
        - text: 。
      - heading "6. 堆排序" [level=4] [ref=f12e3235]
      - paragraph [ref=f12e3236]:
        - strong [ref=f12e3237]: 大白话
        - text: ：先建大顶堆，然后反复取堆顶（最大值）放最后。
      - code [ref=f12e3239]: 初始：[49, 38, 65, 97, 76, 13, 27, 49'] 建大顶堆（从最后一个非叶子节点开始调整）： 最后一个非叶子节点：下标 3（值 97），左右孩子都是叶子，无需调整 下标 2（值 65）：孩子 13, 27，65 > 13 且 65 > 27，无需调整 下标 1（值 38）：孩子 97, 76，97 最大，交换 38<->97 -> [49, 97, 65, 38, 76, 13, 27, 49'] 下标 0（值 49）：孩子 97, 65，97 最大，交换 49<->97 -> [97, 49, 65, 38, 76, 13, 27, 49'] 继续调整 49 所在位置，孩子 38, 76，76 最大，交换 49<->76 -> [97, 76, 65, 38, 49, 13, 27, 49'] 建堆完成：[97, 76, 65, 38, 49, 13, 27, 49'] 第 1 趟：交换堆顶 97 和最后一个 49' -> [49', 76, 65, 38, 49, 13, 27, 97] 调整堆（97 出堆）-> [76, 49', 65, 38, 49, 13, 27, 97] 第 2 趟：交换堆顶 76 和 27 -> [27, 49', 65, 38, 49, 13, 76, 97] 调整堆 -> [65, 49', 27, 38, 49, 13, 76, 97] 第 3 趟：交换堆顶 65 和 13 -> [13, 49', 27, 38, 49, 65, 76, 97] 调整堆 -> [49', 49, 27, 38, 13, 65, 76, 97] 第 4 趟：交换堆顶 49' 和 13 -> [13, 49, 27, 38, 49', 65, 76, 97] 调整堆 -> [49, 38, 27, 13, 49', 65, 76, 97] 第 5 趟：交换堆顶 49 和 13 -> [13, 38, 27, 49, 49', 65, 76, 97] 调整堆 -> [38, 13, 27, 49, 49', 65, 76, 97] 第 6 趟：交换堆顶 38 和 27 -> [27, 13, 38, 49, 49', 65, 76, 97] 调整堆 -> [27, 13, 38, 49, 49', 65, 76, 97] 第 7 趟：交换堆顶 27 和 13 -> [13, 27, 38, 49, 49', 65, 76, 97]
      - paragraph [ref=f12e3240]:
        - strong [ref=f12e3241]: 稳定性
        - text: ：两个 49 在调整过程中可能交换位置，
        - strong [ref=f12e3242]: 不稳定
        - text: 。
      - heading "7. 归并排序（二路归并）" [level=4] [ref=f12e3243]
      - paragraph [ref=f12e3244]:
        - strong [ref=f12e3245]: 大白话
        - text: ：不断对半分，分到只剩一个元素，再两两合并有序序列。
      - code [ref=f12e3247]: 初始：[49, 38, 65, 97, 76, 13, 27, 49'] 拆分：分到单个元素 [49, 38, 65, 97] [76, 13, 27, 49'] [49, 38] [65, 97] [76, 13] [27, 49'] [49][38][65][97] [76][13][27][49'] 第 1 趟合并（2 个一组）： [38, 49] [65, 97] [13, 76] [27, 49'] 第 2 趟合并（4 个一组）： [38, 49, 65, 97] [13, 27, 49', 76] 第 3 趟合并（8 个一组）： [13, 27, 38, 49, 49', 65, 76, 97]
      - paragraph [ref=f12e3248]:
        - strong [ref=f12e3249]: 稳定性
        - text: ：合并时相等元素保留原顺序，所以
        - strong [ref=f12e3250]: 稳定
        - text: 。
      - heading "8. 基数排序（以最低位优先 LSD）" [level=4] [ref=f12e3251]
      - paragraph [ref=f12e3252]:
        - strong [ref=f12e3253]: 大白话
        - text: ：按个位排一次，按十位排一次，按百位排一次... 每次是稳定的。
      - code [ref=f12e3255]: "初始：[49, 38, 65, 97, 76, 13, 27, 49'] 第 1 趟（按个位排序，放入 0-9 号桶）： 桶 3: 13 桶 5: 65 桶 6: 76 桶 7: 97, 27 桶 8: 38 桶 9: 49, 49' 收集：[13, 65, 76, 97, 27, 38, 49, 49'] 第 2 趟（按十位排序）： 桶 1: 13 桶 2: 27 桶 3: 38 桶 4: 49, 49' 桶 6: 65 桶 7: 76 桶 9: 97 收集：[13, 27, 38, 49, 49', 65, 76, 97]"
      - paragraph [ref=f12e3256]:
        - strong [ref=f12e3257]: 稳定性
        - text: ：每次按位分配时保持先来后到，
        - strong [ref=f12e3258]: 稳定
        - text: 。
      - separator [ref=f12e3259]
      - heading "知识点 8：3 快速排序分区过程——不同 pivot 策略" [level=3] [ref=f12e3260]
      - paragraph [ref=f12e3261]:
        - strong [ref=f12e3262]: 例题 18
        - text: ：序列
        - code [ref=f12e3263]: "[5, 1, 9, 3, 7, 4, 8, 6, 2]"
        - text: ，分别用不同 pivot 策略做一次分区。
      - paragraph [ref=f12e3264]:
        - strong [ref=f12e3265]: 策略 1：固定取第一个元素
        - text: （pivot = 5）
      - code [ref=f12e3267]: 挖坑法： [5, 1, 9, 3, 7, 4, 8, 6, 2]，pivot=5 从右找 < 5：2 < 5 -> [2, 1, 9, 3, 7, 4, 8, 6, 2] 从左找 > 5：9 > 5 -> [2, 1, 9, 3, 7, 4, 8, 6, 9] 从右找 < 5：4 < 5 -> [2, 1, 4, 3, 7, 4, 8, 6, 9] 从左找 > 5：7 > 5 -> [2, 1, 4, 3, 7, 7, 8, 6, 9] 从右找 < 5：3 < 5，但 3 在 7 左边，low=high=4 放入 pivot：[2, 1, 4, 3, 5, 7, 8, 6, 9]
      - paragraph [ref=f12e3268]:
        - strong [ref=f12e3269]: 策略 2：三数取中法
        - text: （取头、中、尾的中间值）
      - code [ref=f12e3271]: 头=5, 中=7, 尾=2 -> 排序后 [2, 5, 7]，中间值=5，pivot=5 （和策略 1 结果相同）
      - paragraph [ref=f12e3272]:
        - strong [ref=f12e3273]: 策略 3：随机选取
        - text: （假设随机选到 a[3]=3，pivot=3）
      - code [ref=f12e3275]: "[5, 1, 9, 3, 7, 4, 8, 6, 2]，pivot=3 先把 pivot 换到第一个位置：[3, 1, 9, 5, 7, 4, 8, 6, 2] 分区后：[2, 1, 3, 5, 7, 4, 8, 6, 9]"
      - paragraph [ref=f12e3276]:
        - strong [ref=f12e3277]: 策略 4：固定取最后一个元素
        - text: （pivot = 2）
      - code [ref=f12e3279]: "[5, 1, 9, 3, 7, 4, 8, 6, 2]，pivot=2 分区后：[1, 2, 9, 3, 7, 4, 8, 6, 5]（极不平衡，退化为 O(n^2) 的典型情况）"
      - paragraph [ref=f12e3280]:
        - strong [ref=f12e3281]: 为什么优化 pivot 选择
        - text: ：如果每次 pivot 都是最小/最大值，分区极不平衡，递归树退化为链表，时间复杂度 O(n^2)。
      - separator [ref=f12e3282]
      - heading "知识点 8：4 堆排序建堆 O(n) 为什么——必考证明" [level=3] [ref=f12e3283]
      - paragraph [ref=f12e3284]:
        - strong [ref=f12e3285]: 问题
        - text: ：建堆明明是 n 个元素依次调整，为什么是 O(n) 而不是 O(n log n)？
      - paragraph [ref=f12e3286]:
        - strong [ref=f12e3287]: 直观理解
        - text: ：大部分节点在堆的底部，调整它们只需要很少的次数。
      - paragraph [ref=f12e3288]:
        - strong [ref=f12e3289]: 数学证明
        - text: ：
      - paragraph [ref=f12e3290]: n 个元素的完全二叉树，高度 h = floor(log2 n)。
      - list [ref=f12e3291]:
        - listitem [ref=f12e3292]: 第 h 层（最底层）：最多 2^h 个节点，每个调整 0 次 = 0
        - listitem [ref=f12e3293]: 第 h-1 层：最多 2^(h-1) 个节点，每个最多调整 1 次 = 2^(h-1) * 1
        - listitem [ref=f12e3294]: 第 h-2 层：最多 2^(h-2) 个节点，每个最多调整 2 次 = 2^(h-2) * 2
        - listitem [ref=f12e3295]: ...
        - listitem [ref=f12e3296]: 第 0 层（根）：最多 1 个节点，最多调整 h 次 = 1 * h
      - paragraph [ref=f12e3297]:
        - text: 总调整次数 S = 0
        - emphasis [ref=f12e3298]: 2^h + 1
        - text: 2^(h-1) + 2
        - emphasis [ref=f12e3299]: 2^(h-2) + ... + h
        - text: 2^0
      - paragraph [ref=f12e3300]:
        - text: 这是等差乘等比数列，求和得 S = 2^(h+1) - h - 2 = 2n - log2(n) =
        - strong [ref=f12e3301]: O(n)
      - paragraph [ref=f12e3302]:
        - strong [ref=f12e3303]: 用大白话总结
        - text: ：底层的叶子节点占了约一半，它们根本不需要调整。越往上节点越少，即使调整次数多，总的加起来也是 O(n)。
      - paragraph [ref=f12e3304]:
        - strong [ref=f12e3305]: 对比
        - text: ：如果每次插入后调整（自顶向下建堆），确实是 O(n log n)。但自底向上建堆（Floyd 算法）是 O(n)。
      - separator [ref=f12e3306]
      - heading "知识点 8：5 归并排序递归树" [level=3] [ref=f12e3307]
      - paragraph [ref=f12e3308]:
        - strong [ref=f12e3309]: 大白话
        - text: ：把归并排序的递归过程画成一棵树，每个节点代表一次归并操作。
      - paragraph [ref=f12e3310]:
        - strong [ref=f12e3311]: 例题 19
        - text: ：n=8 的递归树
      - code [ref=f12e3313]: "[1..8] 归并 <- 第 3 层，1 个节点 / \\ [1..4] 归并 [5..8] 归并 <- 第 2 层，2 个节点 / \\ / \\ [1..2]归并 [3..4]归并 [5..6]归并 [7..8]归并 <- 第 1 层，4 个节点 / \\ / \\ / \\ / \\ [1] [2] [3] [4] [5] [6] [7] [8] <- 第 0 层，8 个叶子"
      - paragraph [ref=f12e3314]:
        - strong [ref=f12e3315]: 递归树性质
        - text: ：
      - list [ref=f12e3316]:
        - listitem [ref=f12e3317]: 树的高度：ceil(log2 n)（n=8 时高度为 3）
        - listitem [ref=f12e3318]: 每层的工作量：每层都要合并所有 n 个元素，所以每层是 O(n)
        - listitem [ref=f12e3319]:
          - text: 总工作量：高度 * 每层工作量 = O(n) * O(log n) =
          - strong [ref=f12e3320]: O(n log n)
      - paragraph [ref=f12e3321]:
        - strong [ref=f12e3322]: 空间复杂度 O(n) 的原因
        - text: ：合并时需要临时数组，最大长度是 n（最后一次合并）。
      - separator [ref=f12e3323]
      - heading "知识点 8：6 基数排序详细过程" [level=3] [ref=f12e3324]
      - paragraph [ref=f12e3325]:
        - strong [ref=f12e3326]: 核心思想
        - text: ：不直接比较关键字大小，而是按关键字的各个位（个位、十位、百位...）分别排序。
      - paragraph [ref=f12e3327]:
        - strong [ref=f12e3328]: 关键前提
        - text: ：
      - list [ref=f12e3329]:
        - listitem [ref=f12e3330]:
          - text: 每次按位排序必须是
          - strong [ref=f12e3331]: 稳定的
        - listitem [ref=f12e3332]: 从**最低位（LSD）**开始，到最高位结束
        - listitem [ref=f12e3333]: 需要 r 个桶（十进制 r=10）
      - paragraph [ref=f12e3334]:
        - strong [ref=f12e3335]: 例题 20
        - text: ：基数排序
        - code [ref=f12e3336]: "[329, 457, 657, 839, 436, 720, 355]"
      - code [ref=f12e3338]: "第 1 趟（个位）： 桶 0: 720 桶 5: 355 桶 6: 436 桶 7: 457, 657 桶 9: 329, 839 收集：[720, 355, 436, 457, 657, 329, 839] 第 2 趟（十位）： 桶 2: 720, 329 桶 3: 436, 839 桶 5: 355, 457, 657 收集：[720, 329, 436, 839, 355, 457, 657] 第 3 趟（百位）： 桶 3: 329, 355 桶 4: 436, 457 桶 6: 657 桶 7: 720 桶 8: 839 收集：[329, 355, 436, 457, 657, 720, 839]"
      - paragraph [ref=f12e3339]:
        - strong [ref=f12e3340]: 时间复杂度
        - text: ：O(d(n+r))，d 是位数，n 是元素个数，r 是基数（桶数）。
      - paragraph [ref=f12e3341]:
        - strong [ref=f12e3342]: 空间复杂度
        - text: ：O(r)，需要 r 个桶。
      - paragraph [ref=f12e3343]:
        - strong [ref=f12e3344]: 适用场景
        - text: ：关键字取值范围有限，如整数排序、字符串排序。
      - separator [ref=f12e3345]
      - heading "知识点 8：7 排序算法稳定性——证明与反例" [level=3] [ref=f12e3346]
      - heading "稳定性的定义" [level=4] [ref=f12e3347]
      - paragraph [ref=f12e3348]:
        - text: 如果序列中有两个相等的元素 A 和 B（A 在 B 前面），排序后 A 仍然在 B 前面，则算法是
        - strong [ref=f12e3349]: 稳定的
        - text: 。
      - heading "各排序稳定性证明/反例" [level=4] [ref=f12e3350]
      - paragraph [ref=f12e3351]:
        - strong [ref=f12e3352]: 稳定排序
        - text: ：
      - list [ref=f12e3353]:
        - listitem [ref=f12e3354]:
          - strong [ref=f12e3355]: 冒泡排序
          - text: ：只在
          - code [ref=f12e3356]: a[j] > a[j+1]
          - text: 时才交换，相等时不交换，A 不会跨过 B，稳定。
        - listitem [ref=f12e3357]:
          - strong [ref=f12e3358]: 直接插入排序
          - text: ：只在
          - code [ref=f12e3359]: a[j] > key
          - text: 时才后移，相等时不后移，新元素插入到相等元素后面，稳定。
        - listitem [ref=f12e3360]:
          - strong [ref=f12e3361]: 归并排序
          - text: ：合并时，左半和右半相等时优先取左半的元素，A 始终在 B 前面，稳定。
        - listitem [ref=f12e3362]:
          - strong [ref=f12e3363]: 基数排序
          - text: ：每次按位分配时是稳定的（桶内先入先出），整体稳定。
      - paragraph [ref=f12e3364]:
        - strong [ref=f12e3365]: 不稳定排序
        - text: ：
      - list [ref=f12e3366]:
        - listitem [ref=f12e3367]:
          - paragraph [ref=f12e3368]:
            - strong [ref=f12e3369]: 快速排序（反例）
            - text: ：
            - code [ref=f12e3370]: "[5, 3, 4, 3', 8]"
            - text: ，pivot=5，分区时 3' 可能越过 3，不稳定。
        - listitem [ref=f12e3371]:
          - paragraph [ref=f12e3372]:
            - strong [ref=f12e3373]: 堆排序（反例）
            - text: ：
            - code [ref=f12e3374]: "[2, 2', 1]"
            - text: 建大顶堆后交换调整，两个 2 的相对顺序可能改变，不稳定。
        - listitem [ref=f12e3375]:
          - paragraph [ref=f12e3376]:
            - strong [ref=f12e3377]: 希尔排序（反例）
            - text: ：
            - code [ref=f12e3378]: "[2, 1, 2', 1']"
            - text: ，d=2 分组，可能打乱相等元素的相对顺序，不稳定。
        - listitem [ref=f12e3379]:
          - paragraph [ref=f12e3380]:
            - strong [ref=f12e3381]: 简单选择排序（反例）
            - text: ：
            - code [ref=f12e3382]: "[5, 8, 5', 2, 9]"
            - text: ，第一趟选最小 2，与第一个 5 交换 ->
            - code [ref=f12e3383]: "[2, 8, 5', 5, 9]"
            - text: ，两个 5 的相对顺序改变，不稳定。
      - heading "稳定性口诀" [level=4] [ref=f12e3384]
      - blockquote [ref=f12e3385]:
        - paragraph [ref=f12e3386]:
          - strong [ref=f12e3387]: "\"不稳快堆希，选来也不稳\""
          - text: （不稳定：快速、堆、希尔、选择。其余稳定：插入、冒泡、归并、基数）
      - separator [ref=f12e3388]
      - heading "知识点 8：8 外部排序基本概念" [level=3] [ref=f12e3389]
      - heading "什么是外部排序" [level=4] [ref=f12e3390]
      - paragraph [ref=f12e3391]:
        - strong [ref=f12e3392]: 大白话
        - text: ：数据量太大，内存放不下，只能放在磁盘上。排序时每次只能把一部分数据读入内存排序，再写回磁盘。
      - heading "外部排序的基本流程" [level=4] [ref=f12e3393]
      - paragraph [ref=f12e3394]:
        - strong [ref=f12e3395]: 核心思想
        - text: ：归并排序的外存版。
      - code [ref=f12e3397]: 1. 预处理阶段（生成初始归并段）： - 每次读入内存能容纳的数据量 - 在内存中排序（内部排序，如快速排序） - 写入磁盘，形成一个"归并段" - 重复直到所有数据处理完 2. 归并阶段（多路归并）： - 每次从 k 个归并段中各读一块数据到内存 - 在内存中进行 k 路归并 - 将结果写回磁盘 - 重复直到只剩一个归并段
      - paragraph [ref=f12e3398]:
        - strong [ref=f12e3399]: 举例
        - text: ：100GB 数据，内存只有 1GB。
      - list [ref=f12e3400]:
        - listitem [ref=f12e3401]: 先读 1GB 进内存，排好序，写回磁盘 -> 1 个归并段
        - listitem [ref=f12e3402]: 重复 100 次 -> 100 个归并段
        - listitem [ref=f12e3403]: 然后用 2 路归并，每次合并 2 个归并段 -> 50 个归并段 -> 25 个 -> ... -> 1 个
      - heading "关键概念" [level=4] [ref=f12e3404]
      - table [ref=f12e3405]:
        - rowgroup [ref=f12e3406]:
          - row [ref=f12e3407]:
            - columnheader "概念" [ref=f12e3408]
            - columnheader "解释" [ref=f12e3409]
        - rowgroup [ref=f12e3410]:
          - row [ref=f12e3411]:
            - cell [ref=f12e3412]:
              - strong [ref=f12e3413]: 归并段
            - cell "排好序后写到磁盘上的一个有序数据块" [ref=f12e3414]
          - row [ref=f12e3415]:
            - cell [ref=f12e3416]:
              - strong [ref=f12e3417]: k 路归并
            - cell "同时合并 k 个归并段（k 越大，归并趟数越少）" [ref=f12e3418]
          - row [ref=f12e3419]:
            - cell [ref=f12e3420]:
              - strong [ref=f12e3421]: 败者树
            - cell "用于 k 路归并时快速选出 k 个元素中的最小值，O(log k)" [ref=f12e3422]
          - row [ref=f12e3423]:
            - cell [ref=f12e3424]:
              - strong [ref=f12e3425]: 置换-选择排序
            - cell "生成初始归并段的优化算法，能生成比内存容量更大的归并段" [ref=f12e3426]
          - row [ref=f12e3427]:
            - cell [ref=f12e3428]:
              - strong [ref=f12e3429]: 最佳归并树
            - cell "类似哈夫曼树，归并段长度越小，越先合并，总 I/O 次数最少" [ref=f12e3430]
      - heading "外部排序的总时间" [level=4] [ref=f12e3431]
      - paragraph [ref=f12e3432]: 总时间 = 内部排序时间 + 外存读写时间 + 内部归并时间
      - paragraph [ref=f12e3433]:
        - text: 其中
        - strong [ref=f12e3434]: 外存读写时间
        - text: （I/O 时间）是最主要的开销，所以优化重点是
        - strong [ref=f12e3435]: 减少归并趟数
        - text: 。
      - paragraph [ref=f12e3436]:
        - strong [ref=f12e3437]: 减少归并趟数的方法
        - text: ：
      - list [ref=f12e3438]:
        - listitem [ref=f12e3439]: 增加归并路数 k（但 k 太大会增加内部归并时间）
        - listitem [ref=f12e3440]: 减少初始归并段数量（用置换-选择排序生成更长的归并段）
        - listitem [ref=f12e3441]: 用最佳归并树安排归并顺序
      - heading "易错陷阱" [level=4] [ref=f12e3442]
      - list [ref=f12e3443]:
        - listitem [ref=f12e3444]:
          - text: 外部排序和内部排序的
          - strong [ref=f12e3445]: 本质区别
          - text: ：数据是否全部在内存中。外部排序的核心瓶颈是
          - strong [ref=f12e3446]: 磁盘 I/O
          - text: 。
        - listitem [ref=f12e3447]:
          - strong [ref=f12e3448]: 归并趟数
          - text: = ceil(log_k r)，其中 r 是初始归并段数，k 是归并路数。
        - listitem [ref=f12e3449]:
          - text: 外部排序
          - strong [ref=f12e3450]: 必须使用归并排序
          - text: 的思想，因为只有归并排序能天然支持"分块排序+合并"。
      - heading "记忆口诀" [level=4] [ref=f12e3451]
      - blockquote [ref=f12e3452]:
        - paragraph [ref=f12e3453]: "\"外部排序数据大，归并思想是核心。先分块排生成段，再多路归并减趟数。败者树选最小值，最佳归并省 I/O。\""
      - separator [ref=f12e3454]
      - heading "知识点 8：9 排序算法统测题" [level=3] [ref=f12e3455]
      - paragraph [ref=f12e3456]:
        - strong [ref=f12e3457]: 自测题 11
        - text: ：以下哪种排序算法在最坏情况下时间复杂度为 O(n log n)？ A. 快速排序 B. 堆排序 C. 直接插入排序 D. 冒泡排序
      - blockquote [ref=f12e3458]:
        - paragraph [ref=f12e3459]:
          - strong [ref=f12e3460]: 答案
          - text: ：B。快排最差 O(n^2)，插入 O(n^2)，冒泡 O(n^2)，堆排稳定 O(n log n)。归并排序也是。
      - paragraph [ref=f12e3461]:
        - strong [ref=f12e3462]: 自测题 12
        - text: ：序列
        - code [ref=f12e3463]: "[3, 1, 4, 1, 5, 9, 2, 6]"
        - text: ，用稳定排序算法排序后，两个 1 的相对顺序会怎样？ A. 原第一个 1 仍在前面 B. 可能互换位置 C. 排到末尾
      - blockquote [ref=f12e3464]:
        - paragraph [ref=f12e3465]:
          - strong [ref=f12e3466]: 答案
          - text: ：A。稳定排序保持相等元素的相对顺序不变。
      - paragraph [ref=f12e3467]:
        - strong [ref=f12e3468]: 自测题 12b
        - text: ：数据序列
        - code [ref=f12e3469]: "[8, 9, 1, 7, 2, 3, 5, 4, 6, 0]"
        - text: ，用希尔排序（增量 d=5, 3, 1），经过 d=5 这一趟后，序列变为？ A.
        - code [ref=f12e3470]: "[3, 5, 1, 6, 0, 8, 9, 4, 7, 2]"
        - text: B.
        - code [ref=f12e3471]: "[3, 9, 1, 7, 2, 8, 5, 4, 6, 0]"
        - text: C.
        - code [ref=f12e3472]: "[0, 9, 1, 7, 2, 3, 5, 4, 6, 8]"
      - blockquote [ref=f12e3473]:
        - paragraph [ref=f12e3474]:
          - strong [ref=f12e3475]: 答案
          - text: ：A（d=5 分组后每组内排序得到）。
      - paragraph [ref=f12e3476]:
        - strong [ref=f12e3477]: 自测题 12c
        - text: ：在快速排序中，对 n 个元素进行第一次分区，需要进行多少次比较？ A. n-1 B. n C. n+1 D. n/2
      - blockquote [ref=f12e3478]:
        - paragraph [ref=f12e3479]:
          - strong [ref=f12e3480]: 答案
          - text: ：A。每个元素（除 pivot 外）都需要与 pivot 比较一次，共 n-1 次比较。
      - paragraph [ref=f12e3481]:
        - strong [ref=f12e3482]: 自测题 12d
        - text: ：以下关于堆排序建堆的叙述，正确的是？ A. 建堆时间复杂度为 O(n log n) B. 建堆必须从堆顶开始向下调整 C. 自底向上建堆可达到 O(n) D. 建堆过程不涉及元素交换
      - blockquote [ref=f12e3483]:
        - paragraph [ref=f12e3484]:
          - strong [ref=f12e3485]: 答案
          - text: ：C。Floyd 自底向上建堆算法的时间复杂度为 O(n)。
      - paragraph [ref=f12e3486]:
        - strong [ref=f12e3487]: 自测题 12e
        - text: ：外部排序中，减少归并趟数最有效的方法是？ A. 增加内部排序的速度 B. 增加归并路数 k C. 减少每个归并段的长度 D. 使用更快的磁盘
      - blockquote [ref=f12e3488]:
        - paragraph [ref=f12e3489]:
          - strong [ref=f12e3490]: 答案
          - text: ：B。归并趟数 = ceil(log_k r)，增加 k 直接减少趟数。
      - separator [ref=f12e3491]
      - heading "知识点 9：算法设计与分析基础" [level=2] [ref=f12e3492]
      - blockquote [ref=f12e3493]:
        - paragraph [ref=f12e3494]: ⭐中频 —— 分治/DP/贪心的区别和典型例题是概念辨析题常客
      - heading "9.1 分治法（Divide and Conquer）" [level=3] [ref=f12e3495]
      - paragraph [ref=f12e3496]:
        - strong [ref=f12e3497]: 一句话概括
        - text: ：把大问题拆成小问题，各自解决后把答案合并起来。
      - paragraph [ref=f12e3498]:
        - strong [ref=f12e3499]: 三步走
        - text: ：
      - list [ref=f12e3500]:
        - listitem [ref=f12e3501]:
          - strong [ref=f12e3502]: 分解（Divide）
          - text: ：将原问题分解为若干个规模较小、相互独立、与原问题形式相同的子问题
        - listitem [ref=f12e3503]:
          - strong [ref=f12e3504]: 解决（Conquer）
          - text: ：若子问题规模足够小则直接求解，否则递归解决
        - listitem [ref=f12e3505]:
          - strong [ref=f12e3506]: 合并（Combine）
          - text: ：将子问题的解合并为原问题的解
      - paragraph [ref=f12e3507]:
        - strong [ref=f12e3508]: 适用条件
        - text: ：子问题与原问题
        - strong [ref=f12e3509]: 同构
        - text: 、子问题之间
        - strong [ref=f12e3510]: 相互独立
        - text: （这点和 DP 完全不同）、子问题规模大致
        - strong [ref=f12e3511]: 相同
        - text: （平衡分割效率最高）。
      - paragraph [ref=f12e3512]:
        - strong [ref=f12e3513]: 主定理（Master Theorem）
        - text: ：求解
        - code [ref=f12e3514]: T(n) = aT(n/b) + f(n)
        - text: 形式的递归方程。
      - table [ref=f12e3515]:
        - rowgroup [ref=f12e3516]:
          - row [ref=f12e3517]:
            - columnheader "情况" [ref=f12e3518]
            - columnheader "条件" [ref=f12e3519]
            - columnheader "结论" [ref=f12e3520]
        - rowgroup [ref=f12e3521]:
          - row [ref=f12e3522]:
            - cell "情况1" [ref=f12e3523]
            - cell "f(n) 增长更慢" [ref=f12e3524]
            - cell "T(n) = Θ(n^(log_b a))" [ref=f12e3525]
          - row [ref=f12e3526]:
            - cell "情况2" [ref=f12e3527]
            - cell "两者同阶" [ref=f12e3528]
            - cell "T(n) = Θ(n^(log_b a) · log n)" [ref=f12e3529]
          - row [ref=f12e3530]:
            - cell "情况3" [ref=f12e3531]
            - cell "f(n) 增长更快" [ref=f12e3532]
            - cell "T(n) = Θ(f(n))" [ref=f12e3533]
      - paragraph [ref=f12e3534]:
        - strong [ref=f12e3535]: 口诀
        - text: ：谁大听谁的，一样大就乘 log n。
      - paragraph [ref=f12e3536]:
        - strong [ref=f12e3537]: 经典例子
        - text: ：
      - table [ref=f12e3538]:
        - rowgroup [ref=f12e3539]:
          - row [ref=f12e3540]:
            - columnheader "算法" [ref=f12e3541]
            - columnheader "递归方程" [ref=f12e3542]
            - columnheader "复杂度" [ref=f12e3543]
        - rowgroup [ref=f12e3544]:
          - row [ref=f12e3545]:
            - cell "二分查找" [ref=f12e3546]
            - cell "T(n) = T(n/2) + 1" [ref=f12e3547]
            - cell "Θ(log n)" [ref=f12e3548]
          - row [ref=f12e3549]:
            - cell "归并排序" [ref=f12e3550]
            - cell "T(n) = 2T(n/2) + n" [ref=f12e3551]
            - cell "Θ(n log n)" [ref=f12e3552]
          - row [ref=f12e3553]:
            - cell "快速排序(平均)" [ref=f12e3554]
            - cell "T(n) = 2T(n/2) + n" [ref=f12e3555]
            - cell "Θ(n log n)" [ref=f12e3556]
          - row [ref=f12e3557]:
            - cell "Karatsuba乘法" [ref=f12e3558]
            - cell "T(n) = 3T(n/2) + O(n)" [ref=f12e3559]
            - cell "Θ(n^1.585)" [ref=f12e3560]
      - heading "9.2 动态规划（DP）" [level=3] [ref=f12e3561]
      - paragraph [ref=f12e3562]:
        - strong [ref=f12e3563]: 一句话概括
        - text: ：记住已经算过的结果，避免重复计算。
      - paragraph [ref=f12e3564]:
        - strong [ref=f12e3565]: 两个核心要素
        - text: ：
      - list [ref=f12e3566]:
        - listitem [ref=f12e3567]:
          - strong [ref=f12e3568]: 最优子结构
          - text: ：问题的最优解包含其子问题的最优解
        - listitem [ref=f12e3569]:
          - strong [ref=f12e3570]: 重叠子问题
          - text: ：递归过程中反复遇到同样的子问题
      - paragraph [ref=f12e3571]:
        - strong [ref=f12e3572]: DP vs 分治的关键区别
        - text: ：分治的子问题相互独立，DP 的子问题大量重叠。
      - paragraph [ref=f12e3573]:
        - strong [ref=f12e3574]: 解题四步法
        - text: ：
      - list [ref=f12e3575]:
        - listitem [ref=f12e3576]: 定义状态（dp[i] 或 dp[i][j] 代表什么）
        - listitem [ref=f12e3577]: 找出状态转移方程
        - listitem [ref=f12e3578]: 初始化边界条件
        - listitem [ref=f12e3579]: 确定填表顺序
      - paragraph [ref=f12e3580]:
        - strong [ref=f12e3581]: 经典题：01 背包问题
      - list [ref=f12e3582]:
        - listitem [ref=f12e3583]:
          - text: 定义：
          - code [ref=f12e3584]: dp[i][j]
          - text: = 前 i 个物品，容量 j 时的最大价值
        - listitem [ref=f12e3585]:
          - text: 转移方程：
          - code [ref=f12e3586]: dp[i][j] = max(dp[i-1][j], dp[i-1][j-w[i]] + v[i])
        - listitem [ref=f12e3587]:
          - text: 空间优化：
          - code [ref=f12e3588]: dp[j] = max(dp[j], dp[j-w[i]] + v[i])
          - text: ，
          - strong [ref=f12e3589]: j 必须从大到小遍历
          - text: （否则变成完全背包）
      - paragraph [ref=f12e3590]:
        - strong [ref=f12e3591]: 01 背包 vs 完全背包
        - text: ：
      - list [ref=f12e3592]:
        - listitem [ref=f12e3593]: 01 背包：j 从大到小（每个物品最多用一次）
        - listitem [ref=f12e3594]: 完全背包：j 从小到大（每个物品可以无限用）
      - paragraph [ref=f12e3595]:
        - strong [ref=f12e3596]: 经典题：最长公共子序列（LCS）
      - list [ref=f12e3597]:
        - listitem [ref=f12e3598]:
          - text: 定义：
          - code [ref=f12e3599]: dp[i][j]
          - text: = X 的前 i 个字符和 Y 的前 j 个字符的 LCS 长度
        - listitem [ref=f12e3600]:
          - text: 转移：若 X[i]==Y[j]，
          - code [ref=f12e3601]: dp[i][j] = dp[i-1][j-1] + 1
          - text: ；否则
          - code [ref=f12e3602]: dp[i][j] = max(dp[i-1][j], dp[i][j-1])
      - heading "9.3 贪心算法（Greedy）" [level=3] [ref=f12e3603]
      - paragraph [ref=f12e3604]:
        - strong [ref=f12e3605]: 一句话概括
        - text: ：每一步都做当前最好的选择，绝不反悔。
      - paragraph [ref=f12e3606]:
        - strong [ref=f12e3607]: 正确性条件
        - text: （两者缺一不可）：
      - list [ref=f12e3608]:
        - listitem [ref=f12e3609]:
          - strong [ref=f12e3610]: 贪心选择性质
          - text: ：局部最优 → 全局最优
        - listitem [ref=f12e3611]:
          - strong [ref=f12e3612]: 最优子结构
          - text: ：和 DP 一样
      - paragraph [ref=f12e3613]:
        - strong [ref=f12e3614]: 贪心 vs DP
        - text: ：
      - table [ref=f12e3615]:
        - rowgroup [ref=f12e3616]:
          - row [ref=f12e3617]:
            - columnheader "维度" [ref=f12e3618]
            - columnheader "贪心" [ref=f12e3619]
            - columnheader "DP" [ref=f12e3620]
        - rowgroup [ref=f12e3621]:
          - row [ref=f12e3622]:
            - cell "决策方式" [ref=f12e3623]
            - cell "每步只选当前最优" [ref=f12e3624]
            - cell "考虑所有可能，综合比较" [ref=f12e3625]
          - row [ref=f12e3626]:
            - cell "计算量" [ref=f12e3627]
            - cell "小，通常 O(n log n)" [ref=f12e3628]
            - cell "大，通常 O(n²)" [ref=f12e3629]
          - row [ref=f12e3630]:
            - cell "是否反悔" [ref=f12e3631]
            - cell "否" [ref=f12e3632]
            - cell "隐式比较所有选择" [ref=f12e3633]
          - row [ref=f12e3634]:
            - cell "正确性" [ref=f12e3635]
            - cell "需要严格证明" [ref=f12e3636]
            - cell "天然正确" [ref=f12e3637]
      - paragraph [ref=f12e3638]:
        - strong [ref=f12e3639]: 经典反例
        - text: ：硬币找零（面值 1, 4, 5 找 8 角），贪心选 5+1+1+1=4 枚，实际最优是 4+4=2 枚。贪心不一定对！
      - heading "9.4 回溯法（Backtracking）" [level=3] [ref=f12e3640]
      - paragraph [ref=f12e3641]:
        - strong [ref=f12e3642]: 一句话概括
        - text: ：一条路走到黑，走不通就退回来换条路（DFS + 剪枝）。
      - paragraph [ref=f12e3643]:
        - strong [ref=f12e3644]: 核心概念
        - text: ：
      - list [ref=f12e3645]:
        - listitem [ref=f12e3646]:
          - strong [ref=f12e3647]: 解空间树
          - text: ：子集树（2^n 叶子）或排列树（n! 叶子）
        - listitem [ref=f12e3648]:
          - strong [ref=f12e3649]: 剪枝
          - text: ：约束函数（可行性剪枝）+ 限界函数（最优性剪枝）
      - paragraph [ref=f12e3650]:
        - strong [ref=f12e3651]: 经典题：N 皇后
      - list [ref=f12e3652]:
        - listitem [ref=f12e3653]: 每行放一个皇后，约束条件：不同列、不同主对角线（i-j 唯一）、不同副对角线（i+j 唯一）
        - listitem [ref=f12e3654]: 时间复杂度：最坏 O(N!)，剪枝后实际远小于此
      - heading "9.5 分支限界法（Branch and Bound）" [level=3] [ref=f12e3655]
      - paragraph [ref=f12e3656]:
        - strong [ref=f12e3657]: 一句话概括
        - text: ：用 BFS/优先队列，优先扩展"最有希望"的节点，尽早找到最优解。
      - paragraph [ref=f12e3658]:
        - strong [ref=f12e3659]: 回溯 vs 分支限界
        - text: ：
      - table [ref=f12e3660]:
        - rowgroup [ref=f12e3661]:
          - row [ref=f12e3662]:
            - columnheader "对比项" [ref=f12e3663]
            - columnheader "回溯法" [ref=f12e3664]
            - columnheader "分支限界法" [ref=f12e3665]
        - rowgroup [ref=f12e3666]:
          - row [ref=f12e3667]:
            - cell "搜索策略" [ref=f12e3668]
            - cell "DFS（深度优先）" [ref=f12e3669]
            - cell "BFS 或最佳优先" [ref=f12e3670]
          - row [ref=f12e3671]:
            - cell "目标" [ref=f12e3672]
            - cell "找所有解 / 任一解" [ref=f12e3673]
            - cell "找最优解" [ref=f12e3674]
          - row [ref=f12e3675]:
            - cell "数据结构" [ref=f12e3676]
            - cell "系统栈（递归）" [ref=f12e3677]
            - cell "队列（FIFO）或优先队列" [ref=f12e3678]
          - row [ref=f12e3679]:
            - cell "空间" [ref=f12e3680]
            - cell "存当前路径" [ref=f12e3681]
            - cell "需要存储所有活节点，空间大" [ref=f12e3682]
      - heading "9.6 五种算法对比总结" [level=3] [ref=f12e3683]
      - table [ref=f12e3684]:
        - rowgroup [ref=f12e3685]:
          - row [ref=f12e3686]:
            - columnheader "算法" [ref=f12e3687]
            - columnheader "核心策略" [ref=f12e3688]
            - columnheader "关键特征" [ref=f12e3689]
            - columnheader "典型问题" [ref=f12e3690]
        - rowgroup [ref=f12e3691]:
          - row [ref=f12e3692]:
            - cell "分治法" [ref=f12e3693]
            - cell "分而治之，递归合并" [ref=f12e3694]
            - cell "子问题独立" [ref=f12e3695]
            - cell "归并排序、快速排序" [ref=f12e3696]
          - row [ref=f12e3697]:
