      - separator [ref=f12e1325]
      - heading "知识点 5：2 二叉树——5条核心性质及其数学证明" [level=3] [ref=f12e1326]
      - paragraph [ref=f12e1327]:
        - strong [ref=f12e1328]: 定义
        - text: ：每个节点最多只有两个子节点的树。
      - paragraph [ref=f12e1329]:
        - strong [ref=f12e1330]: 性质 1
        - text: ：二叉树的第 i 层最多有
        - code [ref=f12e1331]: 2^(i-1)
        - text: 个节点（i ≥ 1）。
      - blockquote [ref=f12e1332]:
        - paragraph [ref=f12e1333]:
          - strong [ref=f12e1334]: 证明
          - text: （数学归纳法）：i=1 时，第 1 层只有根节点，1 = 2^(1-1) = 1，成立。假设第 i 层最多有 2^(i-1) 个节点，则第 i+1 层每个节点最多有 2 个子节点，所以第 i+1 层最多有 2 × 2^(i-1) = 2^i 个节点，得证。
      - paragraph [ref=f12e1335]:
        - strong [ref=f12e1336]: 性质 2
        - text: ：深度为 h 的二叉树最多有
        - code [ref=f12e1337]: 2^h - 1
        - text: 个节点（h ≥ 1）。
      - blockquote [ref=f12e1338]:
        - paragraph [ref=f12e1339]:
          - strong [ref=f12e1340]: 证明
          - text: ：等比数列求和。总节点数 ≤ 1 + 2 + 4 + ... + 2^(h-1) = (2^h - 1)/(2 - 1) = 2^h - 1。
      - paragraph [ref=f12e1341]:
        - strong [ref=f12e1342]: 性质 3
        - text: ：对于任意二叉树，叶子数 = 度为 2 的节点数 + 1，即
        - strong [ref=f12e1343]: n₀ = n₂ + 1
        - text: 。
      - blockquote [ref=f12e1344]:
        - paragraph [ref=f12e1345]:
          - strong [ref=f12e1346]: 证明
          - text: ：设总节点数为 n，度为 0 的节点数为 n₀，度为 1 的为 n₁，度为 2 的为 n₂。则 n = n₀ + n₁ + n₂。另一方面，除了根节点外每个节点都有一条边连向它（从父节点指向它），所以总边数 = n - 1。而每个度为 2 的节点贡献 2 条边，度为 1 的贡献 1 条边，度为 0 的贡献 0 条边。所以总边数 = 2n₂ + 1×n₁ + 0×n₀ = 2n₂ + n₁。因此 n - 1 = 2n₂ + n₁，代入 n = n₀ + n₁ + n₂，得 n₀ + n₁ + n₂ - 1 = 2n₂ + n₁，化简得 n₀ = n₂ + 1。
          - strong [ref=f12e1347]: 这是考试中出现频率最高的性质。
      - paragraph [ref=f12e1348]:
        - strong [ref=f12e1349]: 性质 4
        - text: ：具有 n 个节点的完全二叉树的深度为
        - code [ref=f12e1350]: ⌊log₂n⌋ + 1
        - text: 。
      - blockquote [ref=f12e1351]:
        - paragraph [ref=f12e1352]:
          - strong [ref=f12e1353]: 证明
          - text: ：设深度为 h，则第 h-1 层是满的，节点数 ≥ 2^(h-2)（至少第 h-1 层有 1 个节点），同时 ≤ 2^(h-1) - 1（最多 h-1 层全满）。所以 2^(h-1) ≤ n < 2^h，取对数得 h-1 ≤ log₂n < h，所以 h = ⌊log₂n⌋ + 1。
      - paragraph [ref=f12e1354]:
        - strong [ref=f12e1355]: 性质 5
        - text: ：对于完全二叉树，按层序编号（从 1 开始），编号为 i 的节点：
      - list [ref=f12e1356]:
        - listitem [ref=f12e1357]: 左孩子编号：2i（2i ≤ n 时存在）
        - listitem [ref=f12e1358]: 右孩子编号：2i+1（2i+1 ≤ n 时存在）
        - listitem [ref=f12e1359]: 父节点编号：⌊i/2⌋（i > 1）
      - paragraph [ref=f12e1360]:
        - strong [ref=f12e1361]: 满二叉树 vs 完全二叉树
        - text: ：
