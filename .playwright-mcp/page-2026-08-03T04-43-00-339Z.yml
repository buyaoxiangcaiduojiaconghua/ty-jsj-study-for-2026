      - separator [ref=f12e56]
      - heading "知识点 1：数据结构基本概念" [level=2] [ref=f12e57]
      - blockquote [ref=f12e58]:
        - paragraph [ref=f12e59]: ⭐中频 —— 基础知识，概念辨析题常见，时间复杂度计算是必会内容
      - heading "1.1 大白话理解" [level=3] [ref=f12e60]
      - paragraph [ref=f12e61]:
        - strong [ref=f12e62]: 数据结构
        - text: 就是"数据怎么存放"的方案。就像你搬家时，衣服可以叠放（栈）、挂起来（链表）、分类放抽屉（数组），不同的摆放方式会影响你找衣服的速度。
      - paragraph [ref=f12e63]:
        - strong [ref=f12e64]: 程序 = 数据结构 + 算法
        - text: 。数据结构解决"怎么存"，算法解决"怎么算"。两者缺一不可。
      - heading "1.2 数据结构三要素" [level=3] [ref=f12e65]
      - table [ref=f12e66]:
        - rowgroup [ref=f12e67]:
          - row [ref=f12e68]:
            - columnheader "要素" [ref=f12e69]
            - columnheader "含义" [ref=f12e70]
            - columnheader "生活类比" [ref=f12e71]
        - rowgroup [ref=f12e72]:
          - row [ref=f12e73]:
            - cell [ref=f12e74]:
              - strong [ref=f12e75]: 逻辑结构
            - cell "数据之间的逻辑关系（与计算机无关，是\"脑子里怎么想的\"）" [ref=f12e76]
            - cell "家族树——爷爷、爸爸、儿子之间是父子关系" [ref=f12e77]
          - row [ref=f12e78]:
            - cell [ref=f12e79]:
              - strong [ref=f12e80]: 存储结构（物理结构）
            - cell "数据在计算机内存里实际怎么存" [ref=f12e81]
            - cell "家族树在内存里可能存成连续格子（数组）或分散格子+指针（链表）" [ref=f12e82]
          - row [ref=f12e83]:
            - cell [ref=f12e84]:
              - strong [ref=f12e85]: 运算
            - cell "对数据能做什么操作" [ref=f12e86]
            - cell "增、删、改、查、排序、遍历" [ref=f12e87]
      - paragraph [ref=f12e88]:
        - strong [ref=f12e89]: 考试重点
        - text: ：三要素是什么，能区分逻辑结构和存储结构。同一种逻辑结构可以用不同存储结构实现——比如"线性表"这个逻辑结构，既可以用顺序存储（顺序表），也可以用链式存储（链表）。
      - heading "1.3 逻辑结构的四种类型" [level=3] [ref=f12e90]
      - table [ref=f12e91]:
        - rowgroup [ref=f12e92]:
          - row [ref=f12e93]:
            - columnheader "类型" [ref=f12e94]
            - columnheader "含义" [ref=f12e95]
            - columnheader "特点" [ref=f12e96]
            - columnheader "举例" [ref=f12e97]
        - rowgroup [ref=f12e98]:
          - row [ref=f12e99]:
            - cell [ref=f12e100]:
              - strong [ref=f12e101]: 集合
            - cell "元素属于同一组，没有其他关系" [ref=f12e102]
            - cell "松散" [ref=f12e103]
            - cell "全班同学花名册" [ref=f12e104]
          - row [ref=f12e105]:
            - cell [ref=f12e106]:
              - strong [ref=f12e107]: 线性结构
            - cell "元素一对一" [ref=f12e108]
            - cell "除首尾外每个元素有唯一前驱和后继" [ref=f12e109]
            - cell "排队买奶茶、数组、栈、队列" [ref=f12e110]
          - row [ref=f12e111]:
            - cell [ref=f12e112]:
              - strong [ref=f12e113]: 树形结构
            - cell "一对多，层次关系" [ref=f12e114]
            - cell "有根、分支、叶子" [ref=f12e115]
            - cell "公司组织架构、文件夹" [ref=f12e116]
          - row [ref=f12e117]:
            - cell [ref=f12e118]:
              - strong [ref=f12e119]: 图结构
            - cell "多对多" [ref=f12e120]
            - cell "任意两个节点都可以有关系" [ref=f12e121]
            - cell "地铁线路图、社交网络" [ref=f12e122]
      - heading "1.4 存储结构的四种类型" [level=3] [ref=f12e123]
      - table [ref=f12e124]:
        - rowgroup [ref=f12e125]:
          - row [ref=f12e126]:
            - columnheader "类型" [ref=f12e127]
            - columnheader "原理" [ref=f12e128]
            - columnheader "优点" [ref=f12e129]
            - columnheader "缺点" [ref=f12e130]
        - rowgroup [ref=f12e131]:
          - row [ref=f12e132]:
            - cell [ref=f12e133]:
              - strong [ref=f12e134]: 顺序存储
            - cell "所有元素放在连续的内存里（逻辑相邻=物理相邻）" [ref=f12e135]
            - cell "随机访问 O(1)，存储密度大" [ref=f12e136]
            - cell "插入/删除慢，要移动元素" [ref=f12e137]
          - row [ref=f12e138]:
            - cell [ref=f12e139]:
              - strong [ref=f12e140]: 链式存储
            - cell "每个元素存自己的值 + 下一个元素的地址（指针）" [ref=f12e141]
            - cell "插入/删除 O(1)，空间灵活" [ref=f12e142]
            - cell "不能随机访问，指针占额外空间" [ref=f12e143]
          - row [ref=f12e144]:
            - cell [ref=f12e145]:
              - strong [ref=f12e146]: 索引存储
            - cell "建一张索引表，存关键字→地址的映射" [ref=f12e147]
            - cell "查找快" [ref=f12e148]
            - cell "索引表占空间，增删要维护索引" [ref=f12e149]
          - row [ref=f12e150]:
            - cell [ref=f12e151]:
              - strong [ref=f12e152]: 散列存储
            - cell "通过哈希函数算出地址" [ref=f12e153]
            - cell "查找极快 O(1)" [ref=f12e154]
            - cell "可能冲突，不能顺序遍历" [ref=f12e155]
      - heading "1.5 时间复杂度详解" [level=3] [ref=f12e156]
      - paragraph [ref=f12e157]:
        - strong [ref=f12e158]: 大白话
        - text: ：时间复杂度是"数据量变大时，程序运行时间增长得多快"的衡量。不是精确秒数，而是
        - strong [ref=f12e159]: 增长趋势
        - text: 。
      - paragraph [ref=f12e160]:
        - strong [ref=f12e161]: 加法规则
        - text: ：T(n) = T1(n) + T2(n) = O(max(f(n), g(n)))
        - strong [ref=f12e162]: 乘法规则
        - text: ：T(n) = T1(n) × T2(n) = O(f(n) × g(n))
      - paragraph [ref=f12e163]:
        - strong [ref=f12e164]: 各类循环的时间复杂度计算方法
        - text: ：
      - paragraph [ref=f12e165]:
        - strong [ref=f12e166]: (a) 简单循环
        - text: ：
      - code [ref=f12e168]: for (i = 1; i <= n; i++) // 执行 n 次 x++; // 每次 O(1) // 总时间：O(n)
      - paragraph [ref=f12e169]:
        - strong [ref=f12e170]: (b) 嵌套循环
        - text: ：
      - code [ref=f12e172]: for (i = 1; i <= n; i++) // 执行 n 次 for (j = 1; j <= n; j++) // 每次执行 n 次 x++; // 总计 n×n 次 // 总时间：O(n²)
      - paragraph [ref=f12e173]:
        - strong [ref=f12e174]: (c) 内层循环依赖外层变量
        - text: （需要累加求和）：
      - code [ref=f12e176]: for (i = 1; i <= n; i++) // i 从 1 到 n for (j = 1; j <= i; j++) // j 执行 i 次 x++; // 总计 1+2+...+n = n(n+1)/2 // 总时间：O(n²)（n(n+1)/2 的最高次项是 n²）
      - paragraph [ref=f12e177]:
        - strong [ref=f12e178]: (d) 含 if 语句
        - text: ：取最坏分支的复杂度。
      - code [ref=f12e180]: for (i = 1; i <= n; i++) if (i % 2 == 0) x++; // 约 n/2 次 else y++; // 约 n/2 次 // 总时间：O(n)（取最坏情况）
      - paragraph [ref=f12e181]:
        - strong [ref=f12e182]: (e) 递归
        - text: ：
      - code [ref=f12e184]: "int fact(int n) { if (n <= 1) return 1; return n * fact(n - 1); // 递归调用 n-1 次 } // 递归次数 = n，每次 O(1)，总时间：O(n) int fib(int n) { if (n <= 1) return n; return fib(n-1) + fib(n-2); // 每个调用产生两个子调用 } // 递归树节点数约 2^n，总时间：O(2^n)"
      - paragraph [ref=f12e185]:
        - strong [ref=f12e186]: 常见时间复杂度大小顺序
        - text: ： O(1) < O(log n) < O(n) < O(n log n) < O(n²) < O(n³) < O(2^n) < O(n!) < O(n^n)
      - heading "1.6 空间复杂度" [level=3] [ref=f12e187]
      - paragraph [ref=f12e188]:
        - text: 空间复杂度是算法运行过程中
        - strong [ref=f12e189]: 额外占用的存储空间
        - text: 随 n 的增长趋势。
      - list [ref=f12e190]:
        - listitem [ref=f12e191]:
          - strong [ref=f12e192]: 原地工作
          - text: ：空间复杂度 O(1)，辅助空间不随 n 变化
        - listitem [ref=f12e193]: 若需要额外数组/栈等，需要计入
        - listitem [ref=f12e194]:
          - strong [ref=f12e195]: 递归算法的空间复杂度 = 递归深度
          - text: （每次递归调用占用的栈空间）
      - code [ref=f12e197]: "int fact(int n) { if (n <= 1) return 1; return n * fact(n - 1); } // 递归深度 = n，每次调用占 O(1) 空间，空间复杂度：O(n)"
      - heading "1.7 例题精讲" [level=3] [ref=f12e198]
      - paragraph [ref=f12e199]:
        - strong [ref=f12e200]: 例题 1
        - text: ：以下程序段的时间复杂度是（ ）
      - code [ref=f12e202]: for (i = 1; i <= n; i *= 2) for (j = 1; j <= n; j++) x++;
      - paragraph [ref=f12e203]: A. O(n) B. O(n log n) C. O(n²) D. O(log n)
      - blockquote [ref=f12e204]:
        - paragraph [ref=f12e205]:
          - strong [ref=f12e206]: 答案：B
          - text: 。外层循环 i = 1, 2, 4, 8... 执行 log₂n 次，内层循环每次 n 次，总计 n × log₂n。
      - paragraph [ref=f12e207]:
        - strong [ref=f12e208]: 例题 2
        - text: ：以下递归函数的时间复杂度是（ ）
      - code [ref=f12e210]: "void func(int n) { if (n <= 0) return; func(n / 2); func(n / 2); }"
      - paragraph [ref=f12e211]: A. O(log n) B. O(n) C. O(n log n) D. O(2^n)
      - blockquote [ref=f12e212]:
        - paragraph [ref=f12e213]:
          - strong [ref=f12e214]: 答案：B
          - text: 。T(n) = 2T(n/2) + O(1)，由主定理得 O(n)。直观：每次产生 2 个子调用，递归深度 log n，总节点数 1+2+4+...+2^(log n) = 2n-1 = O(n)。
      - paragraph [ref=f12e215]:
        - strong [ref=f12e216]: 例题 3
        - text: ：算法原地工作是指（ ） A. 不需要任何额外空间 B. 额外空间为常数 C. 不使用任何变量 D. 不需要输入数据
      - blockquote [ref=f12e217]:
        - paragraph [ref=f12e218]:
          - strong [ref=f12e219]: 答案：B
          - text: 。原地工作（in-place）指空间复杂度为 O(1)，即辅助空间为常数级。
      - paragraph [ref=f12e220]:
        - strong [ref=f12e221]: 例题 4
        - text: ：下列哪种结构属于逻辑结构而非存储结构（ ） A. 顺序表 B. 单链表 C. 哈希表 D. 栈
      - blockquote [ref=f12e222]:
        - paragraph [ref=f12e223]:
          - strong [ref=f12e224]: 答案：D
          - text: 。栈是一种逻辑结构（操作受限的线性表），顺序表、单链表、哈希表都是存储结构。
      - paragraph [ref=f12e225]:
        - strong [ref=f12e226]: 例题 5
        - text: ：以下程序段的时间复杂度是（ ）
      - code [ref=f12e228]: int sum = 0; for (i = 1; i <= n; i++) for (j = 1; j <= i; j++) for (k = 1; k <= j; k++) sum++;
      - paragraph [ref=f12e229]: A. O(n) B. O(n²) C. O(n³) D. O(n⁴)
      - blockquote [ref=f12e230]:
        - paragraph [ref=f12e231]:
          - strong [ref=f12e232]: 答案：C
          - text: 。三层嵌套，最内层执行次数 ≈ n³/6 = O(n³)。
      - heading "1.8 易错点与陷阱" [level=3] [ref=f12e233]
      - list [ref=f12e234]:
        - listitem [ref=f12e235]:
          - strong [ref=f12e236]: 陷阱
          - text: ：双重循环不一定是 O(n²)，要看内层循环边界是否依赖于 n。
          - code [ref=f12e237]: for(i=1;i<=n;i*=2) for(j=1;j<=n;j++)
          - text: 是 O(n log n)。
        - listitem [ref=f12e238]:
          - strong [ref=f12e239]: 陷阱
          - text: ：递归空间复杂度 = 递归深度，不是递归调用总次数。
        - listitem [ref=f12e240]:
          - strong [ref=f12e241]: 陷阱
          - text: ：逻辑结构是抽象概念，存储结构是物理实现，两者是不同层面的概念。
        - listitem [ref=f12e242]:
          - strong [ref=f12e243]: 陷阱
          - text: ：O(n²+n) 简化为 O(n²)，不能写成 O(n²+n)。
      - heading "1.9 记忆口诀" [level=3] [ref=f12e244]
      - blockquote [ref=f12e245]:
        - paragraph [ref=f12e246]:
          - strong [ref=f12e247]: 时间复杂度
          - text: ：常数对数线性，线性对数平方；指数之后是阶乘，一个比一个爆炸。
          - strong [ref=f12e248]: 逻辑 vs 存储
          - text: ：逻辑在脑中，存储在机中；逻辑定关系，存储定位置。
          - strong [ref=f12e249]: 空间复杂度
          - text: ：递归看深度，变量看数量；常数算原地，线性不算省。
      - separator [ref=f12e250]
      - heading "知识点 2：线性表" [level=2] [ref=f12e251]
      - blockquote [ref=f12e252]:
        - paragraph [ref=f12e253]: ⭐⭐高频 —— 顺序表插入删除的移动次数计算、链表基本操作是常考点
      - heading "2.1 什么是线性表" [level=3] [ref=f12e254]
      - paragraph [ref=f12e255]:
        - text: 大白话：线性表就是
        - strong [ref=f12e256]: "\"一个连一个\""
        - text: 的数据队列。每个元素有且只有一个前驱和一个后继（第一个和最后一个除外）。
      - paragraph [ref=f12e257]:
        - strong [ref=f12e258]: 逻辑结构
        - text: ：线性结构（一对一）。
      - heading "2.2 顺序表（数组实现）" [level=3] [ref=f12e259]
      - paragraph [ref=f12e260]:
        - strong [ref=f12e261]: 原理
        - text: ：用一块连续内存存放元素，逻辑相邻 = 物理相邻。
      - paragraph [ref=f12e262]:
        - strong [ref=f12e263]: 插入操作
        - text: （在第 i 个位置插入元素 x）：
      - paragraph [ref=f12e264]: 假设顺序表有 n 个元素，要在位置 i 插入新元素：
      - list [ref=f12e265]:
        - listitem [ref=f12e266]:
          - text: 将第 i 到第 n 个元素整体
          - strong [ref=f12e267]: 后移
          - text: 一位（
          - strong [ref=f12e268]: 从最后一个开始移
          - text: ，避免覆盖）
        - listitem [ref=f12e269]: 将 x 放入第 i 个位置
        - listitem [ref=f12e270]: 表长 +1
      - code [ref=f12e272]: 原数组：[a1, a2, a3, a4, a5] n=5 在 i=3 位置插入 x： 步骤1：a5 后移 → [a1, a2, a3, a4, _, a5] 步骤2：a4 后移 → [a1, a2, a3, _, a4, a5] 步骤3：a3 后移 → [a1, a2, _, a3, a4, a5] 步骤4：x 放入 → [a1, a2, x, a3, a4, a5] n=6
      - list [ref=f12e273]:
        - listitem [ref=f12e274]: 平均移动：n/2 个元素，时间复杂度 O(n)
        - listitem [ref=f12e275]: 移动元素个数：n - i + 1（第 i 到第 n 个元素都要后移）
      - paragraph [ref=f12e276]:
        - strong [ref=f12e277]: 删除操作
        - text: （删除第 i 个位置的元素）：
      - list [ref=f12e278]:
        - listitem [ref=f12e279]:
          - text: 将第 i+1 到第 n 个元素整体
          - strong [ref=f12e280]: 前移
          - text: 一位
        - listitem [ref=f12e281]: 表长 -1
      - code [ref=f12e283]: 原数组：[a1, a2, a3, a4, a5] n=5 删除 i=2（即 a2）： a3 前移 → [a1, a3, a3, a4, a5] a4 前移 → [a1, a3, a4, a4, a5] a5 前移 → [a1, a3, a4, a5, a5] 结果：[a1, a3, a4, a5] n=4
      - list [ref=f12e284]:
        - listitem [ref=f12e285]: 平均移动：(n-1)/2 个元素，时间复杂度 O(n)
      - paragraph [ref=f12e286]:
        - strong [ref=f12e287]: 考试重点
        - text: ：
      - list [ref=f12e288]:
        - listitem [ref=f12e289]: 插入：平均移动 n/2 个元素，O(n)
        - listitem [ref=f12e290]: 删除：平均移动 (n-1)/2 个元素，O(n)
        - listitem [ref=f12e291]: 查找（按下标）：O(1) —— 随机存取
        - listitem [ref=f12e292]: 查找（按值）：O(n)
      - blockquote [ref=f12e293]:
        - paragraph [ref=f12e294]:
          - strong [ref=f12e295]: 生活类比
          - text: ：电影院一排连着的座位。找第 5 个座位 O(1)，但要让人插到第 3 个位置，后面所有人都得往后挪 O(n)。
      - heading "2.3 单链表" [level=3] [ref=f12e296]
      - paragraph [ref=f12e297]:
        - strong [ref=f12e298]: 原理
        - text: ：每个节点存两样东西——自己的值（data）和下一个节点的地址（next 指针）。
      - code [ref=f12e300]: 头指针 → [a1|next] → [a2|next] → [a3|next] → NULL
      - paragraph [ref=f12e301]:
        - strong [ref=f12e302]: 头插法
        - text: （每次插在链表头部）：
      - code [ref=f12e304]: 步骤1：创建新节点 s，s.data = x 步骤2：s.next = head.next 步骤3：head.next = s
      - paragraph [ref=f12e305]:
        - text: → 头插法得到的链表顺序与插入顺序
        - strong [ref=f12e306]: 相反
        - text: 。
      - paragraph [ref=f12e307]:
        - strong [ref=f12e308]: 尾插法
        - text: （每次插在链表尾部）：
      - code [ref=f12e310]: 步骤1：创建新节点 s，s.data = x 步骤2：tail.next = s 步骤3：tail = s
      - paragraph [ref=f12e311]:
        - text: → 尾插法得到的链表顺序与插入顺序
        - strong [ref=f12e312]: 一致
        - text: 。需要维护尾指针。
      - paragraph [ref=f12e313]:
        - strong [ref=f12e314]: 中间插入
        - text: （在 p 节点之后插入 s）：
      - code [ref=f12e316]: 步骤1：s.next = p.next // 先连后继 步骤2：p.next = s // 再断前驱
      - paragraph [ref=f12e317]:
        - strong [ref=f12e318]: 关键原则
        - text: ：先连后断！顺序不能反，否则会丢失 p 后面的节点。
      - paragraph [ref=f12e319]:
        - strong [ref=f12e320]: 删除操作
        - text: （删除 p 的后继节点）：
      - code [ref=f12e322]: 步骤1：q = p.next // 记下要删的节点 步骤2：p.next = q.next // 跳过 q 步骤3：free(q) // 释放内存
      - paragraph [ref=f12e323]: 时间复杂度：查找需要 O(n)，删除本身 O(1)。
      - paragraph [ref=f12e324]:
        - strong [ref=f12e325]: 考试重点
        - text: ：
      - list [ref=f12e326]:
        - listitem [ref=f12e327]: 插入/删除：O(1)（已知位置），O(n)（需要先找到位置）
        - listitem [ref=f12e328]: 查找：O(n)，只能从头顺着找
        - listitem [ref=f12e329]: 头插法建表（逆序）、尾插法建表（顺序）
      - heading "2.4 双链表" [level=3] [ref=f12e330]
      - paragraph [ref=f12e331]: 每个节点存三样：前一个的地址（prior）+ 自己的值 + 下一个的地址（next）。
      - code [ref=f12e333]: NULL ← [prior|a1|next] ↔ [prior|a2|next] ↔ [prior|a3|next] → NULL
      - paragraph [ref=f12e334]:
        - strong [ref=f12e335]: 插入操作
        - text: （在 p 之后插入 s，需修改 4 条指针）：
      - code [ref=f12e337]: 步骤1：s.next = p.next 步骤2：s.prior = p 步骤3：p.next.prior = s // 若 p 不是最后一个节点 步骤4：p.next = s
      - paragraph [ref=f12e338]:
        - strong [ref=f12e339]: 删除操作
        - text: （删除 p 的后继节点 q）：
      - code [ref=f12e341]: 步骤1：p.next = q.next 步骤2：q.next.prior = p // 若 q 不是最后一个节点 步骤3：free(q)
      - paragraph [ref=f12e342]:
        - strong [ref=f12e343]: 优点
        - text: ：双向遍历，删除某节点时不需要单独找前驱节点（O(1) 即可）。
      - heading "2.5 循环链表" [level=3] [ref=f12e344]
      - paragraph [ref=f12e345]: 单循环：尾节点指向头节点。 双循环：头节点的 prior 指向尾节点，尾节点的 next 指向头节点。
      - paragraph [ref=f12e346]:
        - strong [ref=f12e347]: 判断为空
        - text: ：头节点的 next 指向自己（
        - code [ref=f12e348]: p.next == head
        - text: ）。
        - strong [ref=f12e349]: 优点
        - text: ：从任意节点出发都能遍历整个链表。
      - heading "2.6 静态链表" [level=3] [ref=f12e350]
      - paragraph [ref=f12e351]: 用数组模拟链表。数组元素里存数据 + 下一个元素的"下标"（而不是真正的地址指针）。
      - blockquote [ref=f12e352]:
        - paragraph [ref=f12e353]:
          - strong [ref=f12e354]: 使用场景
          - text: ：某些没有指针类型的早期语言（如早期 BASIC）中使用。
      - heading "2.7 顺序表 vs 链表——终极对比表" [level=3] [ref=f12e355]
      - table [ref=f12e356]:
        - rowgroup [ref=f12e357]:
          - row [ref=f12e358]:
            - columnheader "对比项" [ref=f12e359]
            - columnheader "顺序表（数组）" [ref=f12e360]
            - columnheader "链表" [ref=f12e361]
        - rowgroup [ref=f12e362]:
          - row [ref=f12e363]:
            - cell "存取方式" [ref=f12e364]
            - cell "随机存取 O(1)" [ref=f12e365]
            - cell "顺序存取 O(n)" [ref=f12e366]
          - row [ref=f12e367]:
            - cell "内存" [ref=f12e368]
            - cell "连续，需要一整块" [ref=f12e369]
            - cell "分散，用多少占多少" [ref=f12e370]
          - row [ref=f12e371]:
            - cell "查找（按下标）" [ref=f12e372]
            - cell "O(1)" [ref=f12e373]
            - cell "O(n)" [ref=f12e374]
          - row [ref=f12e375]:
            - cell "查找（按值）" [ref=f12e376]
            - cell "O(n)" [ref=f12e377]
            - cell "O(n)" [ref=f12e378]
          - row [ref=f12e379]:
            - cell "插入/删除" [ref=f12e380]
            - cell "O(n)，要挪位置" [ref=f12e381]
            - cell "O(1)（已知位置），实际需要 O(n) 查找" [ref=f12e382]
          - row [ref=f12e383]:
            - cell "存储密度" [ref=f12e384]
            - cell "高（≈100%，只存数据）" [ref=f12e385]
            - cell "低（< 100%，存数据+指针）" [ref=f12e386]
          - row [ref=f12e387]:
            - cell "空间" [ref=f12e388]
            - cell "可能浪费（预留空间）" [ref=f12e389]
            - cell "每个节点多占一个指针空间" [ref=f12e390]
          - row [ref=f12e391]:
            - cell "缓存友好" [ref=f12e392]
            - cell "是（连续存放，局部性好）" [ref=f12e393]
            - cell "否（分散存放）" [ref=f12e394]
          - row [ref=f12e395]:
            - cell "适合场景" [ref=f12e396]
            - cell "频繁查找/随机访问" [ref=f12e397]
            - cell "频繁插入/删除（尤其在头部）" [ref=f12e398]
      - paragraph [ref=f12e399]:
        - strong [ref=f12e400]: 选择原则
        - text: ：
      - list [ref=f12e401]:
        - listitem [ref=f12e402]: 频繁查找/随机访问 → 顺序表
        - listitem [ref=f12e403]: 频繁插入/删除 → 链表
        - listitem [ref=f12e404]: 空间大小不可预知 → 链表
        - listitem [ref=f12e405]: 需要缓存友好 → 顺序表
      - heading "2.8 例题精讲" [level=3] [ref=f12e406]
      - paragraph [ref=f12e407]:
        - strong [ref=f12e408]: 例题 6
        - text: ：在长度为 n 的顺序表中，在第 i 个位置（1 ≤ i ≤ n+1）插入一个新元素，需要移动的元素个数是（ ） A. n-i B. n-i+1 C. i D. n-1
      - blockquote [ref=f12e409]:
        - paragraph [ref=f12e410]:
          - strong [ref=f12e411]: 答案：B
          - text: 。插入位置 i 时，原来第 i 到第 n 个元素都需要后移，共 n-i+1 个。例如 n=5，i=3，需要移动 a3, a4, a5 共 3 个（5-3+1=3）。
      - paragraph [ref=f12e412]:
        - strong [ref=f12e413]: 例题 7
        - text: ：在一个长度为 n 的单链表中，删除第 i 个节点（1 ≤ i ≤ n）的时间复杂度是（ ） A. O(1) B. O(n) C. O(n²) D. 与 i 有关
      - blockquote [ref=f12e414]:
        - paragraph [ref=f12e415]:
          - strong [ref=f12e416]: 答案：B
          - text: 。虽然删除操作本身是 O(1)（修改指针），但需要先找到第 i-1 个节点，查找需要 O(n)。
      - paragraph [ref=f12e417]:
        - strong [ref=f12e418]: 例题 8
        - text: ：在单链表中，要将 s 所指节点插入到 p 所指节点之后，其语句为（ ） A.
        - code [ref=f12e419]: s->next = p+1; p->next = s;
        - text: B.
        - code [ref=f12e420]: p->next = s; s->next = p->next;
        - text: C.
        - code [ref=f12e421]: s->next = p->next; p->next = s;
        - text: D.
        - code [ref=f12e422]: p->next = s->next; s->next = p->next;
      - blockquote [ref=f12e423]:
        - paragraph [ref=f12e424]:
          - strong [ref=f12e425]: 答案：C
          - text: 。必须先让 s->next 指向 p 的后继节点，再让 p->next 指向 s。如果先执行 p->next = s，则 p 原来的后继节点会丢失。
      - paragraph [ref=f12e426]:
        - strong [ref=f12e427]: 例题 9
        - text: ：在双链表中，在 p 所指节点之后插入 s 所指节点，正确的操作是（ ） A.
        - code [ref=f12e428]: p->next = s; s->prior = p; p->next->prior = s; s->next = p->next;
        - text: B.
        - code [ref=f12e429]: s->prior = p; s->next = p->next; p->next->prior = s; p->next = s;
        - text: C.
        - code [ref=f12e430]: s->prior = p; s->next = p->next; p->next = s; p->next->prior = s;
        - text: D.
        - code [ref=f12e431]: p->next->prior = s; p->next = s; s->prior = p; s->next = p->next;
      - blockquote [ref=f12e432]:
        - paragraph [ref=f12e433]:
          - strong [ref=f12e434]: 答案：B
          - text: 。双链表插入需修改 4 条指针：先设置 s 的两个指针，再修改 p 的后继的前驱指针，最后修改 p 的 next。
      - heading "2.9 易错点与陷阱" [level=3] [ref=f12e435]
      - list [ref=f12e436]:
        - listitem [ref=f12e437]:
          - strong [ref=f12e438]: 陷阱
          - text: ：顺序表插入时，移动元素
          - strong [ref=f12e439]: 从后往前
          - text: 移；删除时
          - strong [ref=f12e440]: 从前向后
          - text: 移。顺序反了会覆盖数据。
        - listitem [ref=f12e441]:
          - strong [ref=f12e442]: 陷阱
          - text: ：单链表插入时，"先连后断"原则。先 s->next = p->next，再 p->next = s。
        - listitem [ref=f12e443]:
          - strong [ref=f12e444]: 陷阱
          - text: ：头插法生成的链表与输入顺序
          - strong [ref=f12e445]: 相反
          - text: ，尾插法顺序一致。经常考这个性质。
        - listitem [ref=f12e446]:
          - strong [ref=f12e447]: 陷阱
          - text: ：说"链表插入删除是 O(1)"不严谨，应该说"已知插入位置时 O(1)"。
        - listitem [ref=f12e448]:
          - strong [ref=f12e449]: 陷阱
          - text: ：循环链表判断表尾不是
          - code [ref=f12e450]: p->next == NULL
          - text: ，而是
          - code [ref=f12e451]: p->next == head
          - text: 。
      - heading "2.10 记忆口诀" [level=3] [ref=f12e452]
      - blockquote [ref=f12e453]:
        - paragraph [ref=f12e454]:
          - strong [ref=f12e455]: 顺序表
          - text: ：插入从后往前移，删除从前向后补；查找按下标 O(1)，按值要遍历 O(n)。
          - strong [ref=f12e456]: 链表
          - text: ：插前先连后不断，删前先记后不丢；头插倒序尾插顺，循环链表头尾绕。
          - strong [ref=f12e457]: 选型
          - text: ：频繁查找用顺序，频繁增删用链表；空间预知用顺序，动态变化用链表。
      - separator [ref=f12e458]
      - heading "知识点 3：栈和队列" [level=2] [ref=f12e459]
      - blockquote [ref=f12e460]:
        - paragraph [ref=f12e461]: ⭐⭐高频 —— 中缀转后缀、循环队列判空判满是经典考题
      - heading "3.1 栈（Stack）—— 后进先出（LIFO）" [level=3] [ref=f12e462]
      - paragraph [ref=f12e463]:
        - strong [ref=f12e464]: 大白话
        - text: ：栈就像一叠盘子，后放上去的先拿下来。或者像浏览器的"后退"按钮——最后看的页面最先回去。
      - paragraph [ref=f12e465]:
        - strong [ref=f12e466]: 简称
        - text: ：LIFO（Last In, First Out）
      - table [ref=f12e467]:
        - rowgroup [ref=f12e468]:
          - row [ref=f12e469]:
            - columnheader "操作" [ref=f12e470]
            - columnheader "含义" [ref=f12e471]
        - rowgroup [ref=f12e472]:
          - row [ref=f12e473]:
            - cell "push" [ref=f12e474]
            - cell "入栈（放盘子）" [ref=f12e475]
          - row [ref=f12e476]:
            - cell "pop" [ref=f12e477]
            - cell "出栈（拿盘子）" [ref=f12e478]
          - row [ref=f12e479]:
            - cell "peek/top" [ref=f12e480]
            - cell "看栈顶元素（不拿走）" [ref=f12e481]
      - paragraph [ref=f12e482]:
        - strong [ref=f12e483]: 顺序栈的实现
        - text: ：
      - code [ref=f12e485]: "#define MAXSIZE 100 typedef struct { int data[MAXSIZE]; int top; // 栈顶指针，-1 表示空栈 } SqStack; // 入栈：top++; data[top] = x; // 出栈：x = data[top]; top--; // 判空：top == -1 // 判满：top == MAXSIZE - 1"
      - paragraph [ref=f12e486]:
        - strong [ref=f12e487]: 链栈的实现
        - text: （用单链表，栈顶在链表头部）：
      - list [ref=f12e488]:
        - listitem [ref=f12e489]: 入栈 = 头插法，出栈 = 头删法
        - listitem [ref=f12e490]: 不需要头节点，top 指针指向栈顶节点
        - listitem [ref=f12e491]: 基本不会满（除非内存耗尽）
      - heading "3.2 队列（Queue）—— 先进先出（FIFO）" [level=3] [ref=f12e492]
      - paragraph [ref=f12e493]:
        - strong [ref=f12e494]: 大白话
        - text: ：队列就像排队买奶茶，先来的先买到。
      - paragraph [ref=f12e495]:
        - strong [ref=f12e496]: 简称
        - text: ：FIFO（First In, First Out）
      - table [ref=f12e497]:
        - rowgroup [ref=f12e498]:
          - row [ref=f12e499]:
            - columnheader "操作" [ref=f12e500]
            - columnheader "含义" [ref=f12e501]
        - rowgroup [ref=f12e502]:
          - row [ref=f12e503]:
            - cell "enqueue" [ref=f12e504]
            - cell "入队（排在队尾）" [ref=f12e505]
          - row [ref=f12e506]:
            - cell "dequeue" [ref=f12e507]
            - cell "出队（队头离开）" [ref=f12e508]
      - heading "3.3 循环队列——重点中的重点" [level=3] [ref=f12e509]
      - paragraph [ref=f12e510]:
        - strong [ref=f12e511]: 为什么需要循环队列
        - text: ：普通顺序队列出队后 front 前移，前面的空间被浪费（"假溢出"）。循环队列把数组头尾连成环，front 前面的空间可以复用。
      - paragraph [ref=f12e512]:
        - strong [ref=f12e513]: 核心设计——为什么牺牲一个位置？
      - paragraph [ref=f12e514]:
        - text: 队空和队满时，front 和 rear 的相对位置相同，无法区分。最常用的解决方案是
        - strong [ref=f12e515]: 牺牲一个存储单元
        - text: ：
      - list [ref=f12e516]:
        - listitem [ref=f12e517]:
          - strong [ref=f12e518]: 队空
          - text: ：
          - code [ref=f12e519]: front == rear
        - listitem [ref=f12e520]:
          - strong [ref=f12e521]: 队满
          - text: ：
          - code [ref=f12e522]: (rear + 1) % MaxSize == front
      - paragraph [ref=f12e523]:
        - strong [ref=f12e524]: 元素个数公式推导
        - text: ：
      - code [ref=f12e526]: 当 rear > front 时：元素个数 = rear - front 当 rear < front 时：元素个数 = MaxSize - front + rear 统一公式：(rear - front + MaxSize) % MaxSize
      - paragraph [ref=f12e527]:
        - strong [ref=f12e528]: 循环队列操作
        - text: ：
      - code [ref=f12e530]: // 入队 rear = (rear + 1) % MaxSize; data[rear] = x; // 出队 front = (front + 1) % MaxSize; x = data[front];
      - paragraph [ref=f12e531]:
        - strong [ref=f12e532]: 链队
        - text: ：链表实现，有 front 和 rear 指针，插入删除 O(1)，不会满。
      - heading "3.4 中缀表达式转后缀表达式（逆波兰表达式）—— 栈的经典应用" [level=3] [ref=f12e533]
      - paragraph [ref=f12e534]:
        - strong [ref=f12e535]: 基本概念
        - text: ：
      - list [ref=f12e536]:
        - listitem [ref=f12e537]:
          - strong [ref=f12e538]: 中缀表达式
          - text: ：
          - code [ref=f12e539]: a + b * c - d
          - text: （运算符在操作数中间，日常使用）
        - listitem [ref=f12e540]:
          - strong [ref=f12e541]: 后缀表达式
          - text: ：
          - code [ref=f12e542]: a b c * + d -
          - text: （运算符在操作数后面，计算机容易计算）
        - listitem [ref=f12e543]:
          - strong [ref=f12e544]: 前缀表达式
          - text: ：
          - code [ref=f12e545]: "- + a * b c d"
          - text: （运算符在操作数前面）
      - paragraph [ref=f12e546]:
        - strong [ref=f12e547]: 转换算法（中缀 → 后缀）
        - text: ：
      - code [ref=f12e549]: 初始化运算符栈 S，结果队列 Q 从左到右扫描中缀表达式： 1. 遇到操作数（数字/字母）→ 直接输出到 Q 2. 遇到左括号 '(' → 直接入栈 S 3. 遇到右括号 ')' → 弹出 S 中元素并输出到 Q，直到遇到 '(' 为止（括号不输出） 4. 遇到运算符： a. 若 S 为空 或 S 栈顶为 '(' → 直接入栈 b. 若当前运算符优先级 > 栈顶 → 直接入栈 c. 若当前运算符优先级 <= 栈顶 → 不断弹出栈顶并输出， 直到满足条件 a 或 b，然后将当前运算符入栈 5. 扫描完毕后，将 S 中剩余元素全部弹出输出到 Q
      - paragraph [ref=f12e550]:
        - strong [ref=f12e551]: 运算符优先级
        - text: ：
        - code [ref=f12e552]: "* /"
        - text: ">"
        - code [ref=f12e553]: + -
        - text: ，括号特殊处理。
      - paragraph [ref=f12e554]:
        - strong [ref=f12e555]:
          - text: 例题：中缀
