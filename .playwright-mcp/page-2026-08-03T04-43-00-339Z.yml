      - separator [ref=f12e3848]
      - heading "真题与考点补充" [level=2] [ref=f12e3849]
      - blockquote [ref=f12e3850]:
        - paragraph [ref=f12e3851]: 本章节基于国网计算机类笔试历年真题、高频考点和常见易错陷阱整理，重点关注排序、二叉树、哈希表三大核心模块。
      - separator [ref=f12e3852]
      - heading "一、典型真题（11道）" [level=3] [ref=f12e3853]
      - paragraph [ref=f12e3854]:
        - strong [ref=f12e3855]: 真题 1：二叉树遍历与重建
      - paragraph [ref=f12e3856]:
        - text: 已知一棵二叉树的中序遍历序列为
        - code [ref=f12e3857]: DBEAFCG
        - text: ，前序遍历序列为
        - code [ref=f12e3858]: ABDECFG
        - text: ，则该二叉树的后序遍历序列是什么？
      - paragraph [ref=f12e3859]:
        - text: A.
        - code [ref=f12e3860]: DEBFGCA
        - text: B.
        - code [ref=f12e3861]: DEBGFCA
        - text: C.
        - code [ref=f12e3862]: EDBFGCA
        - text: D.
        - code [ref=f12e3863]: EDBGFCA
      - blockquote [ref=f12e3864]:
        - paragraph [ref=f12e3865]:
          - strong [ref=f12e3866]: 解析
          - text: ：前序第一个 A 是根。中序中 A 左边
          - code [ref=f12e3867]: DBE
          - text: 是左子树（3 个节点），右边
          - code [ref=f12e3868]: FCG
          - text: 是右子树（3 个节点）。前序中对应左子树部分
          - code [ref=f12e3869]: BDE
          - text: ，B 是左子根；右子树部分
          - code [ref=f12e3870]: CFG
          - text: ，C 是右子根。递归构建后得到后序：
          - code [ref=f12e3871]: DEBFGCA
          - text: 。
          - strong [ref=f12e3872]: 答案：A。
      - paragraph [ref=f12e3873]:
        - strong [ref=f12e3874]: 真题 2：排序算法时间复杂度判断
      - paragraph [ref=f12e3875]: 以下排序算法中，在最坏情况下时间复杂度仍为 O(n log n) 的是：
      - paragraph [ref=f12e3876]: A. 快速排序 B. 希尔排序 C. 堆排序 D. 直接插入排序
      - blockquote [ref=f12e3877]:
        - paragraph [ref=f12e3878]:
          - strong [ref=f12e3879]: 解析
          - text: ：快排最坏 O(n²)（有序序列），希尔排序最坏 O(n²)，直接插入最坏 O(n²)。堆排序无论最好最坏平均都是 O(n log n)。归并排序也是。
          - strong [ref=f12e3880]: 答案：C。
      - paragraph [ref=f12e3881]:
        - strong [ref=f12e3882]: 真题 3：哈希表冲突处理
      - paragraph [ref=f12e3883]:
        - text: 设哈希表长度为 m=13，哈希函数为 H(key)=key%13，用线性探测法解决冲突。依次插入关键字序列
        - code [ref=f12e3884]: "[19, 14, 23, 01, 68, 20, 84, 27, 55, 11, 10, 79]"
        - text: ，查找关键字 84 时需要比较几次？
      - paragraph [ref=f12e3885]: A. 1 B. 2 C. 3 D. 4
      - blockquote [ref=f12e3886]:
        - paragraph [ref=f12e3887]:
          - strong [ref=f12e3888]: 解析
          - text: ：84%13=6。各关键字的存放位置：19→6，14→1，23→10，01→1(冲突)→2，68→3，20→7，84→6(冲突)→7(冲突)→8(冲突)→9。所以 84 在位置 9，比较了 4 次（位置 6, 7, 8, 9）。
          - strong [ref=f12e3889]: 答案：D。
      - paragraph [ref=f12e3890]:
        - strong [ref=f12e3891]: 真题 4：二叉排序树（BST）的性质
      - paragraph [ref=f12e3892]:
        - text: 以下关于二叉排序树的说法，
        - strong [ref=f12e3893]: 错误
        - text: 的是：
      - paragraph [ref=f12e3894]: A. 中序遍历二叉排序树可以得到有序序列 B. 二叉排序树的查找效率取决于树的高度 C. 在二叉排序树中插入新节点，新节点一定是叶子节点 D. 二叉排序树的平均查找长度是 O(log n)
      - blockquote [ref=f12e3895]:
        - paragraph [ref=f12e3896]:
          - strong [ref=f12e3897]: 解析
          - text: ：A 正确（BST 定义决定的）。B 正确（高度越小查找越快）。C 正确（插入时从根向下找，最终落在空位置，一定是叶子）。D 错误——BST 的平均查找长度在最坏情况下退化成 O(n)（如插入有序序列），只有平衡时才 O(log n)。
          - strong [ref=f12e3898]: 答案：D。
      - paragraph [ref=f12e3899]:
        - strong [ref=f12e3900]: 真题 5：排序算法稳定性判断
      - paragraph [ref=f12e3901]:
        - text: 已知一组数据
        - code [ref=f12e3902]: "[(张三, 85), (李四, 85), (王五, 90), (赵六, 75)]"
        - text: ，先按姓名排序，再按分数排序。如果第二次排序使用不稳定的排序算法，可能出现什么情况？
      - paragraph [ref=f12e3903]: A. 分数相同的张三和李四的相对顺序可能改变 B. 分数最高的王五会排到最前面 C. 排序结果中分数必然从高到低排列 D. 不会出现任何意外情况
      - blockquote [ref=f12e3904]:
        - paragraph [ref=f12e3905]:
          - strong [ref=f12e3906]: 解析
          - text: ：稳定性指的是值相等的元素在排序后保持原来的相对顺序。第一次按姓名排完后张三在李四前面。第二次按分数排，张三和李四都是 85 分，如果算法不稳定，张三和李四的相对顺序可能互换。
          - strong [ref=f12e3907]: 答案：A。
      - paragraph [ref=f12e3908]:
        - strong [ref=f12e3909]: 真题 6：堆与堆排序
      - paragraph [ref=f12e3910]:
        - text: 对序列
        - code [ref=f12e3911]: "[46, 79, 56, 38, 40, 84]"
        - text: 建立大顶堆，则建堆后的序列是：
      - paragraph [ref=f12e3912]:
        - text: A.
        - code [ref=f12e3913]: "[84, 79, 56, 38, 40, 46]"
        - text: B.
        - code [ref=f12e3914]: "[84, 79, 56, 46, 40, 38]"
        - text: C.
        - code [ref=f12e3915]: "[84, 56, 79, 38, 40, 46]"
        - text: D.
        - code [ref=f12e3916]: "[84, 46, 79, 38, 40, 56]"
      - blockquote [ref=f12e3917]:
        - paragraph [ref=f12e3918]:
          - strong [ref=f12e3919]: 解析
          - text: ：从最后一个非叶节点 56（下标 2）开始调整。56 与 84 交换→
          - code [ref=f12e3920]: "[46,79,84,38,40,56]"
          - text: ；然后 79 已是最大不调整；最后 46 先与 79 交换→
          - code [ref=f12e3921]: "[79,46,84,38,40,56]"
          - text: ，再与 56 交换→
          - code [ref=f12e3922]: "[84,46,79,38,40,56]"
          - text: 。
          - strong [ref=f12e3923]: 答案：D。
      - paragraph [ref=f12e3924]:
        - strong [ref=f12e3925]: 真题 7：排序时间复杂度判断题
      - paragraph [ref=f12e3926]: 以下排序算法中，在最好情况下时间复杂度为 O(n) 的有哪些？ I. 直接插入排序 II. 冒泡排序 III. 简单选择排序 IV. 快速排序
      - paragraph [ref=f12e3927]: A. 仅 I、II B. 仅 I、II、IV C. 仅 I、III D. I、II、III、IV
      - blockquote [ref=f12e3928]:
        - paragraph [ref=f12e3929]:
          - strong [ref=f12e3930]: 解析
          - text: ：直接插入排序最好情况 O(n)（基本有序，每趟只比较一次）；冒泡排序最好 O(n)（有序时一趟无交换提前结束）；简单选择排序最好/最坏/平均都是 O(n²)，不受初始顺序影响；快速排序最好 O(n log n)，不是 O(n)。
          - strong [ref=f12e3931]: 答案：A。
      - paragraph [ref=f12e3932]:
        - strong [ref=f12e3933]: 真题 8：不稳定排序判断题
      - paragraph [ref=f12e3934]: 以下属于不稳定排序的是： I. 希尔排序 II. 堆排序 III. 简单选择排序 IV. 快速排序 V. 归并排序
      - paragraph [ref=f12e3935]: A. 仅 I、II、IV B. I、II、III、IV C. I、III、IV、V D. II、III、IV、V
      - blockquote [ref=f12e3936]:
        - paragraph [ref=f12e3937]:
          - strong [ref=f12e3938]: 解析
          - text: ："不稳快堆希，选来也不稳"——不稳定的是：快速排序、堆排序、希尔排序、简单选择排序。归并排序是稳定的（合并时左边优先）。
          - strong [ref=f12e3939]: 答案：B。
      - paragraph [ref=f12e3940]:
        - strong [ref=f12e3941]: 真题 9：Dijkstra 算法手工计算题
      - paragraph [ref=f12e3942]:
        - text: 已知有向图 G 的顶点为
        - code [ref=f12e3943]: "{A, B, C, D, E}"
        - text: ，边权如下：A→B:10, A→D:5, B→C:1, B→D:2, C→E:4, D→B:3, D→C:9, D→E:2, E→A:7, E→C:6。用 Dijkstra 算法求 A 到各顶点的最短距离，则顶点 C 的最短距离是（ ）
      - paragraph [ref=f12e3944]: A. 8 B. 9 C. 10 D. 14
      - blockquote [ref=f12e3945]:
        - paragraph [ref=f12e3946]:
          - strong [ref=f12e3947]: 解析
          - text: ：第1轮：确定 A(dist=0)，更新 B=10, D=5。第2轮：确定 D(dist=5)，更新 B=min(10,5+3)=8, C=5+9=14, E=5+2=7。第3轮：确定 E(dist=7)，更新 C=min(14,7+6)=13。第4轮：确定 B(dist=8)，更新 C=min(13,8+1)=9。第5轮：确定 C(dist=9)。所以 A→C 的最短距离 = 9，路径为 A→D→B→C。
          - strong [ref=f12e3948]: 答案：B。
      - paragraph [ref=f12e3949]:
        - strong [ref=f12e3950]: 真题 10：B+ 树特性判断题
      - paragraph [ref=f12e3951]: 以下关于 B+ 树的描述，正确的是（ ）
      - paragraph [ref=f12e3952]: A. B+ 树的内部节点既存储索引键也存储数据记录 B. B+ 树的叶子节点之间没有链表连接，需要中序遍历实现范围查询 C. B+ 树的查找可能在内部节点命中并提前结束 D. B+ 树的叶子节点通过链表相连，支持高效的范围查询
      - blockquote [ref=f12e3953]:
        - paragraph [ref=f12e3954]:
          - strong [ref=f12e3955]: 解析
          - text: ：A 错——B+ 树只有叶子节点存数据记录（内部节点只存索引键）。B 错——B+ 树叶子节点通过双向链表相连，正是这个链表支持范围查询。C 错——B+ 树查找必须走到叶子节点才结束（即使内部节点匹配了也要向下走）。D 正确——叶子节点的链表是 B+ 树的核心优势，支持 O(log n + k) 的范围查询（k 为结果集大小）。
          - strong [ref=f12e3956]: 答案：D。
      - paragraph [ref=f12e3957]:
        - strong [ref=f12e3958]: 真题 11：哈希表线性探测 ASL 计算题
      - paragraph [ref=f12e3959]:
        - text: 设哈希表长度 m=13，哈希函数 H(key)=key%13，采用线性探测法解决冲突。依次插入关键字
        - code [ref=f12e3960]: "[19, 14, 23, 01, 68, 20, 84, 27, 55, 11, 10, 79]"
        - text: 共 12 个关键字后，等概率下查找成功的平均查找长度 ASL_success 为（ ）
      - paragraph [ref=f12e3961]: A. 1.5 B. 2.0 C. 2.5 D. 3.0
      - blockquote [ref=f12e3962]:
        - paragraph [ref=f12e3963]:
          - strong [ref=f12e3964]: 解析
          - text: ：各关键字比较次数：19(1次，位置6), 14(1次，位置1), 23(1次，位置10), 01(2次，探测1→2), 68(1次，位置3), 20(1次，位置7), 84(3次，探测6→7→8), 27(4次，探测1→2→3→4), 55(3次，探测3→4→5), 11(1次，位置11), 10(3次，探测10→11→12), 79(9次，探测1→2→3→4→5→6→7→8→9)。总比较次数 = 1+1+1+2+1+1+3+4+3+1+3+9 = 30。ASL_success = 30/12 = 2.5。详细计算过程见本笔记知识点 7.7 例题 16。
          - strong [ref=f12e3965]: 答案：C。
