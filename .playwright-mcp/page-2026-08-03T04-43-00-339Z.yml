      - code [ref=f12e2816]: "位置 0: 空 位置 1: 14 -> 1 -> 27 -> 79 位置 2: 空 位置 3: 68 -> 55 位置 4: 空 位置 5: 空 位置 6: 19 -> 84 位置 7: 20 位置 8: 空 位置 9: 空 位置 10: 23 -> 10 位置 11: 11 位置 12: 空"
      - paragraph [ref=f12e2817]:
        - strong [ref=f12e2818]: 优点
        - text: ：不会堆积，删除方便，alpha 可以大于 1。
        - strong [ref=f12e2819]: 缺点
        - text: ：需要额外指针空间。
