      - separator [ref=f12e2117]
      - heading "知识点 6：6 拓扑排序——详细实现步骤" [level=3] [ref=f12e2118]
      - paragraph [ref=f12e2119]:
        - strong [ref=f12e2120]: 问题
        - text: ：AOV 网（Activity On Vertex，顶点表示活动，边表示先后关系）中，找出一个满足所有先后关系的顶点序列。
      - paragraph [ref=f12e2121]:
        - strong [ref=f12e2122]: 实现步骤
        - text: ：
      - list [ref=f12e2123]:
        - listitem [ref=f12e2124]: 计算所有顶点的入度（指向该顶点的边数）
        - listitem [ref=f12e2125]: 将所有入度为 0 的顶点入队（或入栈）
        - listitem [ref=f12e2126]:
          - text: 当队列非空时：
          - list [ref=f12e2127]:
            - listitem [ref=f12e2128]: 出队一个顶点，输出它
            - listitem [ref=f12e2129]: 将该顶点的所有出边指向的顶点的入度减 1
            - listitem [ref=f12e2130]: 如果有顶点的入度变为 0，将其入队
        - listitem [ref=f12e2131]: 如果输出的顶点数 < 总顶点数，说明图中有环（拓扑排序不存在）
      - paragraph [ref=f12e2132]:
        - strong [ref=f12e2133]: 例题 22
        - text: ：对以下课程依赖关系进行拓扑排序：
      - code [ref=f12e2135]: C1 无先修，C2 依赖 C1，C3 依赖 C1/C2，C4 依赖 C2，C5 依赖 C3/C4
      - blockquote [ref=f12e2136]:
        - paragraph [ref=f12e2137]:
          - strong [ref=f12e2138]: 解
          - text: ：入度：C1=0, C2=1, C3=2, C4=1, C5=2。初始入队：C1(入度0)。输出 C1，C2入度减为0→入队，C3入度减为1。输出 C2，C3入度减为0→入队，C4入度减为0→入队。输出 C3/C4（顺序可交换），C5入度减为0→入队。输出 C5。拓扑序列：C1→C2→C3→C4→C5 或 C1→C2→C4→C3→C5。
      - paragraph [ref=f12e2139]:
        - strong [ref=f12e2140]: 时间复杂度
        - text: ：邻接表 O(n+e)，邻接矩阵 O(n²)
      - paragraph [ref=f12e2141]:
        - strong [ref=f12e2142]: 应用
        - text: ：
      - list [ref=f12e2143]:
        - listitem [ref=f12e2144]: 课程安排、任务调度
        - listitem [ref=f12e2145]: 判断图中是否有环（输出顶点数 < n 则有环）
      - separator [ref=f12e2146]
      - heading "知识点 6：7 关键路径——ve 和 vl 的详细计算方法" [level=3] [ref=f12e2147]
      - paragraph [ref=f12e2148]:
        - strong [ref=f12e2149]: 问题
        - text: ：AOE 网（Activity On Edge，边表示活动，顶点表示事件）中，找出决定工程最早完成时间的关键活动。
      - paragraph [ref=f12e2150]:
        - strong [ref=f12e2151]: 基本概念
        - text: ：
      - list [ref=f12e2152]:
        - listitem [ref=f12e2153]:
          - strong [ref=f12e2154]: 事件（顶点）的最早发生时间 ve(i)
          - text: ：从源点到该顶点的最长路径长度
        - listitem [ref=f12e2155]:
          - strong [ref=f12e2156]: 事件（顶点）的最晚发生时间 vl(i)
          - text: ：在不推迟总工期的前提下，该事件最晚必须发生的时间
        - listitem [ref=f12e2157]:
          - strong [ref=f12e2158]: 活动（边）的最早开始时间 e(i)
          - text: = 该边起点事件的 ve
        - listitem [ref=f12e2159]:
          - strong [ref=f12e2160]: 活动（边）的最晚开始时间 l(i)
          - text: = 该边终点事件的 vl - 该边的权值
        - listitem [ref=f12e2161]:
          - strong [ref=f12e2162]: 关键活动
          - text: ：e(i) == l(i) 的活动（一天都不能拖）
        - listitem [ref=f12e2163]:
          - strong [ref=f12e2164]: 关键路径
          - text: ：由关键活动组成的从源点到汇点的路径
      - paragraph [ref=f12e2165]:
        - strong [ref=f12e2166]: ve 和 vl 的计算步骤
        - text: ：
      - paragraph [ref=f12e2167]:
        - strong [ref=f12e2168]: （1）计算 ve（正向，从源点往后推）
        - text: ：
      - code [ref=f12e2170]: "ve[源点] = 0 对于其他顶点 j：ve[j] = max{ ve[i] + 边(i,j)的权值 }（所有指向 j 的边）"
      - paragraph [ref=f12e2171]: 按拓扑排序的顺序计算（确保计算 ve[j] 时所有前驱的 ve 都已算出）。
      - paragraph [ref=f12e2172]:
        - strong [ref=f12e2173]: （2）计算 vl（反向，从汇点往前推）
        - text: ：
      - code [ref=f12e2175]: "vl[汇点] = ve[汇点] 对于其他顶点 i：vl[i] = min{ vl[j] - 边(i,j)的权值 }（所有从 i 出发的边）"
      - paragraph [ref=f12e2176]: 按逆拓扑排序的顺序计算（确保计算 vl[i] 时所有后继的 vl 都已算出）。
      - paragraph [ref=f12e2177]:
        - strong [ref=f12e2178]: （3）计算每条边的 e 和 l
        - text: ：
      - code [ref=f12e2180]: 对于边 (i, j, 权值w)： e(i,j) = ve[i] l(i,j) = vl[j] - w 如果 e(i,j) == l(i,j)，则边 (i,j) 是关键活动
      - paragraph [ref=f12e2181]:
        - strong [ref=f12e2182]: 例题 23
        - text: "：AOE 网有顶点 {V1, V2, V3, V4, V5, V6}，V1 是源点，V6 是汇点。边及权值：V1→V2(3), V1→V3(2), V2→V4(2), V2→V5(3), V3→V4(4), V3→V5(1), V4→V6(2), V5→V6(1)。求关键路径。"
      - blockquote [ref=f12e2183]:
        - paragraph [ref=f12e2184]:
          - strong [ref=f12e2185]: 解
          - text: "： 拓扑序列：V1, V2, V3, V4, V5, V6 ve[1]=0, ve[2]=3, ve[3]=2, ve[4]=max(3+2, 2+4)=6, ve[5]=max(3+3, 2+1)=6, ve[6]=max(6+2, 6+1)=8 逆拓扑序列：V6, V5, V4, V3, V2, V1 vl[6]=8, vl[5]=8-1=7, vl[4]=8-2=6, vl[3]=min(7-1, 6-4)=2, vl[2]=min(7-3, 6-2)=4, vl[1]=min(4-3, 2-2)=0 边 e 和 l：V1→V2: e=0, l=4-3=1（不等）；V1→V3: e=0, l=2-2=0（关键！）；V3→V4: e=2, l=6-4=2（关键！）；V4→V6: e=6, l=8-2=6（关键！） 关键路径：V1→V3→V4→V6，总工期 8。"
      - separator [ref=f12e2186]
      - paragraph [ref=f12e2187]:
        - strong [ref=f12e2188]: 自测题 9
        - text: ：用 Kruskal 算法求最小生成树，第 3 步选出的边是什么？（边按权值升序：(AB,3)(CD,3)(AC,4)(BD,4)(BC,5)(AD,6)） A. AC B. BD C. BC D. AD
      - blockquote [ref=f12e2189]:
        - paragraph [ref=f12e2190]:
          - strong [ref=f12e2191]: 答案
          - text: ：A。第 1 步选 AB(3)，第 2 步选 CD(3)（与 AB 不连通），第 3 步选 AC(4)（连接两个集合）。BD(4) 和 AB、CD 形成环了！
      - paragraph [ref=f12e2192]:
        - strong [ref=f12e2193]: 自测题 9b
        - text: ：一个有 n 个顶点和 e 条边的有向图，用邻接表存储，拓扑排序的时间复杂度是： A. O(n) B. O(e) C. O(n+e) D. O(n×e)
      - blockquote [ref=f12e2194]:
        - paragraph [ref=f12e2195]:
          - strong [ref=f12e2196]: 答案
          - text: ：C。拓扑排序需要遍历每个顶点和每条边一次。
      - paragraph [ref=f12e2197]:
        - strong [ref=f12e2198]: 自测题 9c
        - text: ：Dijkstra 算法不能处理负权边的原因是什么？ A. 算法会陷入死循环 B. 贪心策略假设已确定的最短距离不会再被更新，负权边会打破这个假设 C. 算法时间复杂度会变成 O(n³) D. 负权边会导致并查集失效
      - blockquote [ref=f12e2199]:
        - paragraph [ref=f12e2200]:
          - strong [ref=f12e2201]: 答案
          - text: ：B。Dijkstra 每轮确定一个"当前未确定顶点中距离最小"的顶点，认为它的最短距离不会再变。负权边意味着后续可能通过一条负权边进一步缩短已确定顶点的距离，贪心策略失效。
      - paragraph [ref=f12e2202]:
        - strong [ref=f12e2203]: 自测题 9d
        - text: ：Floyd 算法中，三重循环的最外层循环是什么？ A. 起点 i B. 终点 j C. 中间顶点 k D. 任意顺序都可以
      - blockquote [ref=f12e2204]:
        - paragraph [ref=f12e2205]:
          - strong [ref=f12e2206]: 答案
          - text: ：C。k 必须在最外层，表示逐步放宽中间顶点的范围。如果 k 不在最外层，结果不正确。
      - heading "知识点 7：查找" [level=2] [ref=f12e2207]
      - blockquote [ref=f12e2208]:
        - paragraph [ref=f12e2209]: ⭐⭐高频 —— 哈希表ASL计算、B树与B+树对比是数据库和数据结构交叉考点
      - heading "知识点 7：1 顺序查找（带哨兵优化）" [level=3] [ref=f12e2210]
      - heading "原理解析" [level=4] [ref=f12e2211]
      - paragraph [ref=f12e2212]:
        - strong [ref=f12e2213]: 基本思想
        - text: ：从表的一端开始，逐个比较关键字，直到找到目标或遍历完整个表。
      - paragraph [ref=f12e2214]:
        - strong [ref=f12e2215]: 时间复杂度
        - text: ：O(n)。查找成功平均比较 (n+1)/2 次，查找失败比较 n 次。
      - heading "哨兵优化" [level=4] [ref=f12e2216]
      - paragraph [ref=f12e2217]:
        - strong [ref=f12e2218]: 大白话
        - text: ：在表头（或表尾）额外放一个"哨兵"，它的值等于要查找的关键字。这样每次循环时不需要判断"是否越界"，因为哨兵保证了循环一定会结束。
      - paragraph [ref=f12e2219]:
        - strong [ref=f12e2220]: 优化前
        - text: （每次循环要检查两个条件）：
      - code [ref=f12e2222]: "for (i = 0; i < n; i++) { // 条件1：i < n（越界检查） if (a[i] == key) break; // 条件2：找到了 }"
      - paragraph [ref=f12e2223]:
        - strong [ref=f12e2224]: 优化后
        - text: （哨兵法，只需要检查一个条件）：
      - code [ref=f12e2226]: a[0] = key; // 哨兵放在 a[0] for (i = n; a[i] != key; i--); // 只需要检查"找到了吗" // 如果 i > 0 说明找到了，i == 0 说明没找到（碰到哨兵）
      - paragraph [ref=f12e2227]:
        - strong [ref=f12e2228]: 哨兵优化的好处
        - text: ：每次循环少做一次比较（不需要判断 i < n），对于 n 很大时，大约节省一半的比较次数。
      - paragraph [ref=f12e2229]:
        - strong [ref=f12e2230]: ASL 推导
        - text: ：假设每个元素被查找的概率相等（1/n），查找成功时：
      - list [ref=f12e2231]:
        - listitem [ref=f12e2232]: 第 1 个元素比较 1 次，第 2 个元素比较 2 次，...，第 n 个元素比较 n 次
        - listitem [ref=f12e2233]: ASL_success = (1+2+...+n)/n = (n+1)/2
        - listitem [ref=f12e2234]: ASL_fail = n（遍历完整个表才能确定不存在）
      - heading "例题 1：顺序查找基本计算" [level=4] [ref=f12e2235]
      - paragraph [ref=f12e2236]: 对长度为 100 的顺序表进行顺序查找，在等概率情况下：
      - list [ref=f12e2237]:
        - listitem [ref=f12e2238]: 查找成功的 ASL = (100+1)/2 = 50.5
        - listitem [ref=f12e2239]: 查找失败的 ASL = 100
      - heading "例题 2：哨兵法" [level=4] [ref=f12e2240]
      - paragraph [ref=f12e2241]: 使用哨兵优化后的顺序查找，查找失败时需要进行多少次比较？ A. 0 次 B. 1 次 C. n 次 D. n+1 次
      - blockquote [ref=f12e2242]:
        - paragraph [ref=f12e2243]:
          - strong [ref=f12e2244]: 答案
          - text: ：D。哨兵放在 a[0]，查找失败时需要从 a[n] 一直比较到 a[0]（哨兵），共 n+1 次比较。如果哨兵放在 a[n+1]，则查找失败也是 n+1 次。
      - heading "易错陷阱" [level=4] [ref=f12e2245]
      - list [ref=f12e2246]:
        - listitem [ref=f12e2247]:
          - strong [ref=f12e2248]: 哨兵并没有减少比较次数
          - text: ，只是把"越界判断"和"是否找到"合并成一次判断，节省的是每次循环的"逻辑判断次数"，不是减少比较总次数。
        - listitem [ref=f12e2249]:
          - text: 顺序查找对
          - strong [ref=f12e2250]: 有序表和无序表
          - text: 都适用，但效率相同——都是 O(n)。
        - listitem [ref=f12e2251]:
          - text: 顺序查找
          - strong [ref=f12e2252]: 不需要数据有序
          - text: ，也不需要顺序存储，链表也能用。
      - heading "记忆口诀" [level=4] [ref=f12e2253]
      - blockquote [ref=f12e2254]:
        - paragraph [ref=f12e2255]: "\"逐个比较最简单，哨兵一放省判断。成功平均找半趟，失败需要 n 遍。\""
      - separator [ref=f12e2256]
      - heading "知识点 7：2 二分查找（折半查找）——必考重难点" [level=3] [ref=f12e2257]
      - heading "原理解析" [level=4] [ref=f12e2258]
      - paragraph [ref=f12e2259]:
        - strong [ref=f12e2260]: 前提条件
        - text: ：数据必须
        - strong [ref=f12e2261]: 有序
        - text: 且必须
        - strong [ref=f12e2262]: 顺序存储
        - text: （链表不能用二分查找）。
      - paragraph [ref=f12e2263]:
        - strong [ref=f12e2264]: 核心思想
        - text: ：每次取中间值 mid，如果 key < mid 则去左半区，如果 key > mid 则去右半区，每次排除一半数据。
      - paragraph [ref=f12e2265]:
        - strong [ref=f12e2266]: 时间复杂度
        - text: ：O(log₂n)
      - heading "二分查找判定树——必考！" [level=4] [ref=f12e2267]
      - paragraph [ref=f12e2268]:
        - strong [ref=f12e2269]: 大白话
        - text: ：判定树就是把二分查找的"比较过程"画成一棵树。树的根是第一次比较的 mid 元素，左子树是左半区元素，右子树是右半区元素。
      - paragraph [ref=f12e2270]:
        - strong [ref=f12e2271]: 判定树的画法
        - text: （以 n=11 有序序列 [5, 13, 19, 21, 37, 56, 64, 75, 80, 88, 92] 为例）：
      - code [ref=f12e2273]: mid = ⌊(low+high)/2⌋ = ⌊(0+10)/2⌋ = 5，即第 6 个元素（56） 56 / \ ⌊(0+4)/2⌋=2 ⌊(6+10)/2⌋=8 19 80 / \ / \ 1 3 7 9 13 21 75 88 / \ / \ / \ / \ 0 4 x x 6 x x 10 5 37 64 92
      - paragraph [ref=f12e2274]:
        - strong [ref=f12e2275]: 判定树性质（必记）
        - text: ：
      - list [ref=f12e2276]:
        - listitem [ref=f12e2277]:
          - text: 判定树是一棵
          - strong [ref=f12e2278]: 平衡二叉树
          - text: （左右子树高度差不超过 1）
        - listitem [ref=f12e2279]: 判定树的中序遍历就是原有序序列
        - listitem [ref=f12e2280]:
          - text: 查找成功时，比较次数 = 该节点在判定树中的
          - strong [ref=f12e2281]: 层数
          - text: （根节点层数为 1）
        - listitem [ref=f12e2282]:
          - text: 查找失败时，比较次数 = 到达失败节点（外部节点）经过的
          - strong [ref=f12e2283]: 内部节点数
      - heading "ASL（平均查找长度）手工计算" [level=4] [ref=f12e2284]
      - paragraph [ref=f12e2285]:
        - strong [ref=f12e2286]: 手工算法
        - text: ：按判定树，把每个元素的"层数"（即比较次数）累加，再除以元素个数 n。
      - paragraph [ref=f12e2287]:
        - strong [ref=f12e2288]: 例题 3：n=11 的 ASL 计算
      - paragraph [ref=f12e2289]: 判定树中，11 个元素所在的层数统计：
      - list [ref=f12e2290]:
        - listitem [ref=f12e2291]: 第 1 层：1 个元素（56），比较 1 次
        - listitem [ref=f12e2292]: 第 2 层：2 个元素（19, 80），比较 2 次
        - listitem [ref=f12e2293]: 第 3 层：4 个元素（13, 21, 75, 88），比较 3 次
        - listitem [ref=f12e2294]: 第 4 层：4 个元素（5, 37, 64, 92），比较 4 次
      - paragraph [ref=f12e2295]:
        - text: ASL_success = (1x1 + 2x2 + 4x3 + 4x4) / 11 = (1+4+12+16)/11 = 33/11 =
        - strong [ref=f12e2296]: "3"
      - paragraph [ref=f12e2297]:
        - strong [ref=f12e2298]: 例题 4：n=15 的 ASL 计算
      - paragraph [ref=f12e2299]: n=15 时判定树是一棵满二叉树（高度为 4）：
      - list [ref=f12e2300]:
        - listitem [ref=f12e2301]: 第 1 层：1 个元素，比较 1 次
        - listitem [ref=f12e2302]: 第 2 层：2 个元素，比较 2 次
        - listitem [ref=f12e2303]: 第 3 层：4 个元素，比较 3 次
        - listitem [ref=f12e2304]: 第 4 层：8 个元素，比较 4 次
      - paragraph [ref=f12e2305]:
        - text: ASL_success = (1x1 + 2x2 + 4x3 + 8x4) / 15 = (1+4+12+32)/15 = 49/15 =
        - strong [ref=f12e2306]: "3.27"
      - paragraph [ref=f12e2307]:
        - strong [ref=f12e2308]: 例题 5：n=12 的 ASL 计算
      - paragraph [ref=f12e2309]: n=12 时判定树不是满二叉树，需要先画出判定树：
      - code [ref=f12e2311]: 6 / \ 2 9 / \ / \ 1 4 8 11 / / \ / \ 0 3 5 7 10
      - list [ref=f12e2312]:
        - listitem [ref=f12e2313]: 第 1 层：1 个（6），比较 1 次
        - listitem [ref=f12e2314]: 第 2 层：2 个（2, 9），比较 2 次
        - listitem [ref=f12e2315]: 第 3 层：4 个（1, 4, 8, 11），比较 3 次
        - listitem [ref=f12e2316]: 第 4 层：5 个（0, 3, 5, 7, 10），比较 4 次
      - paragraph [ref=f12e2317]:
        - text: ASL_success = (1x1 + 2x2 + 4x3 + 5x4) / 12 = (1+4+12+20)/12 = 37/12 =
        - strong [ref=f12e2318]: "3.08"
      - paragraph [ref=f12e2319]:
        - strong [ref=f12e2320]: 公式速算
        - text: ：ASL_success = log₂(n+1) - 1（n 较大时近似）
      - paragraph [ref=f12e2321]:
        - strong [ref=f12e2322]: 例题 6：查找失败 ASL
      - paragraph [ref=f12e2323]: 对于 n=11 的判定树，有 12 个失败位置（外部节点）。ASL_fail = 经过内部节点数之和 / 失败位置数。
      - paragraph [ref=f12e2324]:
        - text: ASL_fail = (3x4 + 4x8) / 12 = (12+32)/12 = 44/12 =
        - strong [ref=f12e2325]: "3.67"
      - heading "易错陷阱" [level=4] [ref=f12e2326]
      - list [ref=f12e2327]:
        - listitem [ref=f12e2328]:
          - strong [ref=f12e2329]: mid 的计算
          - text: ：
          - code [ref=f12e2330]: mid = (low+high)/2
          - text: 向下取整。不同教材可能用
          - code [ref=f12e2331]: ⌊(low+high)/2⌋
          - text: 或
          - code [ref=f12e2332]: ⌈(low+high)/2⌉
          - text: ，判定树结构不同，但 ASL 相同。
        - listitem [ref=f12e2333]:
          - text: 二分查找
          - strong [ref=f12e2334]: 只适用于顺序存储结构
          - text: 的有序表，单链表不能用（因为无法 O(1) 定位到中间位置）。
        - listitem [ref=f12e2335]:
          - strong [ref=f12e2336]: 判定树的高度
          - text: ：log₂(n+1) 向上取整，即比较次数最多为树的高度。
        - listitem [ref=f12e2337]:
          - text: 查找失败时，比较次数不一定等于树的高度，而是等于
          - strong [ref=f12e2338]: 到达失败节点经过的内部节点数
          - text: 。
      - heading "记忆口诀" [level=4] [ref=f12e2339]
      - blockquote [ref=f12e2340]:
        - paragraph [ref=f12e2341]: "\"二分必须有序存，每次取半 log n。判定树画好，层数累加就是 ASL。\""
      - separator [ref=f12e2342]
      - heading "知识点 7：3 分块查找（索引顺序查找）" [level=3] [ref=f12e2343]
      - heading "原理解析" [level=4] [ref=f12e2344]
      - paragraph [ref=f12e2345]:
        - strong [ref=f12e2346]: 大白话
        - text: ：数据分块，块之间有序（前一块的最大值 < 后一块的最小值），块内可以无序。先查索引表确定在哪块，再在块内顺序查找。
      - paragraph [ref=f12e2347]:
        - strong [ref=f12e2348]: 核心思想
        - text: ：建立一张
        - strong [ref=f12e2349]: 索引表
        - text: ，每块对应一条索引记录（块内最大关键字 + 块起始地址）。
      - paragraph [ref=f12e2350]:
        - strong [ref=f12e2351]: ASL 计算
        - text: ：ASL = 查索引表的 ASL + 块内查找的 ASL
      - list [ref=f12e2352]:
        - listitem [ref=f12e2353]: 假设 n 个元素分为 b 块，每块 s 个元素（n = b * s）
        - listitem [ref=f12e2354]: 索引表查找用顺序查找：ASL_index = (b+1)/2
        - listitem [ref=f12e2355]: 块内查找用顺序查找：ASL_block = (s+1)/2
        - listitem [ref=f12e2356]: ASL_total = (b+1)/2 + (s+1)/2 = (b+s)/2 + 1
      - paragraph [ref=f12e2357]:
        - strong [ref=f12e2358]: 最佳块大小
        - text: ：当 b = s = √n 时，ASL_total = √n + 1，取得最小值。
      - blockquote [ref=f12e2359]:
        - paragraph [ref=f12e2360]:
          - strong [ref=f12e2361]: 结论
          - text: ：分块查找的最佳 ASL 约为 O(√n)，介于顺序查找 O(n) 和二分查找 O(log n) 之间。
      - paragraph [ref=f12e2362]:
        - strong [ref=f12e2363]: 索引表用二分查找
        - text: ：如果索引表有序且顺序存储，可以用二分查找加速索引查找。
      - list [ref=f12e2364]:
        - listitem [ref=f12e2365]: ASL_total = log₂(b+1) 向上取整 + (s+1)/2
      - heading "例题 7：分块查找 ASL 计算" [level=4] [ref=f12e2366]
      - paragraph [ref=f12e2367]: n=10000 个元素，等分为 100 块，每块 100 个元素。索引表用顺序查找。
      - list [ref=f12e2368]:
        - listitem [ref=f12e2369]:
          - text: ASL = (100+1)/2 + (100+1)/2 = 50.5 + 50.5 =
          - strong [ref=f12e2370]: "101"
      - paragraph [ref=f12e2371]: 如果索引表用二分查找：
      - list [ref=f12e2372]:
        - listitem [ref=f12e2373]:
          - text: ASL = log₂(101) + (100+1)/2 = 7 + 50.5 =
          - strong [ref=f12e2374]: "57.5"
      - paragraph [ref=f12e2375]:
        - strong [ref=f12e2376]: 例题 8
        - text: ：n=100 时，最佳块大小 s = √100 = 10，分 10 块。
      - list [ref=f12e2377]:
        - listitem [ref=f12e2378]: ASL = (10+1)/2 + (10+1)/2 = 11（顺序查索引）
        - listitem [ref=f12e2379]: ASL = log₂(11) + 5.5 = 3.5 + 5.5 = 9（二分查索引）
      - heading "易错陷阱" [level=4] [ref=f12e2380]
      - list [ref=f12e2381]:
        - listitem [ref=f12e2382]:
          - strong [ref=f12e2383]: 块之间必须有序
          - text: ，块内可以无序——这是分块查找的核心前提。
        - listitem [ref=f12e2384]:
          - text: 分块查找的
          - strong [ref=f12e2385]: 效率介于顺序查找和二分查找之间
          - text: ，适合数据量较大、又不想完全排序的场景。
        - listitem [ref=f12e2386]: 插入/删除时，只需要调整块内元素（或索引），不需要整体移动，比二分查找的插入更容易。
      - heading "记忆口诀" [level=4] [ref=f12e2387]
      - blockquote [ref=f12e2388]:
        - paragraph [ref=f12e2389]: "\"分块先查索引表，再进块里顺序找。最佳块数根号 n，ASL 就是根号 n+1。\""
      - separator [ref=f12e2390]
      - heading "知识点 7：4 B 树（多路平衡查找树）——重难点" [level=3] [ref=f12e2391]
      - heading "m 阶 B 树的定义（必背）" [level=4] [ref=f12e2392]
      - paragraph [ref=f12e2393]: 一棵 m 阶 B 树是满足以下性质的 m 叉查找树：
      - table [ref=f12e2394]:
        - rowgroup [ref=f12e2395]:
          - row [ref=f12e2396]:
            - columnheader "性质" [ref=f12e2397]
            - columnheader "内容" [ref=f12e2398]
        - rowgroup [ref=f12e2399]:
          - row [ref=f12e2400]:
            - cell "1. 孩子数上限" [ref=f12e2401]
            - cell [ref=f12e2402]:
              - text: 每个节点最多 m 个孩子，最多
              - strong [ref=f12e2403]: m-1
              - text: 个关键字
          - row [ref=f12e2404]:
            - cell "2. 关键字顺序" [ref=f12e2405]
            - cell "节点内关键字递增排列，K1 < K2 < ... < Kn" [ref=f12e2406]
          - row [ref=f12e2407]:
            - cell "3. 孩子子树范围" [ref=f12e2408]
            - cell "关键字 Ki 左边的子树所有值 < Ki，右边的子树所有值 > Ki" [ref=f12e2409]
          - row [ref=f12e2410]:
            - cell "4. 最小孩子数（除根外）" [ref=f12e2411]
            - cell [ref=f12e2412]:
              - text: 非根非叶子节点至少有
              - strong [ref=f12e2413]: ⌈m/2⌉
              - text: 个孩子（即至少 ⌈m/2⌉-1 个关键字）
          - row [ref=f12e2414]:
            - cell "5. 根节点" [ref=f12e2415]
            - cell "根至少 2 个孩子（除非是叶子），即至少 1 个关键字" [ref=f12e2416]
          - row [ref=f12e2417]:
            - cell "6. 叶子层" [ref=f12e2418]
            - cell [ref=f12e2419]:
              - text: 所有
              - strong [ref=f12e2420]: 叶子节点在同一层
              - text: （绝对平衡）
          - row [ref=f12e2421]:
            - cell "7. 叶子节点" [ref=f12e2422]
            - cell "叶子节点是空节点（外部节点），不存储实际数据" [ref=f12e2423]
      - paragraph [ref=f12e2424]:
        - strong [ref=f12e2425]: 理解
        - text: ：B 树是一棵"矮胖"的树，节点可以存很多关键字，减少树的高度，从而减少磁盘 I/O。
      - paragraph [ref=f12e2426]:
        - strong [ref=f12e2427]: 以 3 阶 B 树为例
        - text: （常称为 2-3 树）：
      - list [ref=f12e2428]:
        - listitem [ref=f12e2429]: 每个节点最多 2 个关键字，最多 3 个孩子
        - listitem [ref=f12e2430]: 除根外，每个节点至少 1 个关键字（⌈3/2⌉-1 = 1），至少 2 个孩子
      - paragraph [ref=f12e2431]:
        - strong [ref=f12e2432]: 以 5 阶 B 树为例
        - text: ：
      - list [ref=f12e2433]:
        - listitem [ref=f12e2434]: 每个节点最多 4 个关键字，最多 5 个孩子
        - listitem [ref=f12e2435]: 除根外，每个节点至少 2 个关键字（⌈5/2⌉-1 = 2），至少 3 个孩子
      - heading "B 树的插入过程（分裂）" [level=4] [ref=f12e2436]
      - paragraph [ref=f12e2437]:
        - strong [ref=f12e2438]: 核心规则
        - text: ：插入总是发生在
        - strong [ref=f12e2439]: 叶子节点
        - text: （最终端节点）。如果插入后关键字数超过 m-1，则
        - strong [ref=f12e2440]: 分裂
        - text: 。
      - paragraph [ref=f12e2441]:
        - strong [ref=f12e2442]: 例题 9：5 阶 B 树插入详细过程
      - paragraph [ref=f12e2443]:
        - text: 依次插入：
        - code [ref=f12e2444]: "[39, 22, 97, 41, 53, 13, 21, 52, 36, 12, 56, 58, 62, 90, 91, 100, 101]"
      - paragraph [ref=f12e2445]:
        - strong [ref=f12e2446]: 第 1 步
        - text: ：插入 39, 22, 97, 41（节点未满，5 阶最多 4 个关键字）
      - code [ref=f12e2448]: "节点: [22, 39, 41, 97]（4 个关键字，已满）"
      - paragraph [ref=f12e2449]:
        - strong [ref=f12e2450]: 第 2 步
        - text: ：插入 53，节点溢出（5 个关键字 > 4），需要
        - strong [ref=f12e2451]: 分裂
      - code [ref=f12e2453]: 分裂前：[22, 39, 41, 53, 97] 中间关键字（第 3 个）：41 提升到父节点 左半：[22, 39] 右半：[53, 97] 结果： [41] / \ [22, 39] [53, 97]
      - paragraph [ref=f12e2454]:
        - strong [ref=f12e2455]: 第 3 步
        - text: ：插入 13, 21, 52, 36
      - code [ref=f12e2457]: "[41] / \\ [13, 21, 22, 36, 39] [52, 53, 97]"
      - paragraph [ref=f12e2458]: 左节点溢出，22 提升：
      - code [ref=f12e2460]: "[22, 41] / | \\ [13, 21] [36, 39] [52, 53, 97]"
      - paragraph [ref=f12e2461]:
        - strong [ref=f12e2462]: 第 4 步
        - text: ：插入 12, 56, 58, 62, 90, 91, 100, 101
      - code [ref=f12e2464]: 一步步插入，最终得到： [22, 41, 58, 91] / | | | \ [12,13,21] [36,39] [52,53,56] [62,90] [97,100,101]
      - paragraph [ref=f12e2465]: 当 91 插入后根节点已满（4 个关键字），再插入会导致根分裂。
      - paragraph [ref=f12e2466]:
        - strong [ref=f12e2467]: 分裂的本质
        - text: ：把中间关键字"提升"到父节点，左右各分一半。如果父节点也满了，递归向上分裂，最坏情况一直分裂到根节点。
      - heading "B 树的删除过程（借位与合并）" [level=4] [ref=f12e2468]
      - paragraph [ref=f12e2469]:
        - strong [ref=f12e2470]: 例题 10：5 阶 B 树删除详细过程
      - paragraph [ref=f12e2471]: 假设已有如下 5 阶 B 树：
      - code [ref=f12e2473]: "[50] / \\ [20, 30] [60, 70, 80]"
      - paragraph [ref=f12e2474]:
        - strong [ref=f12e2475]: 情况 1：删除的节点在叶子中，且删除后关键字数 >= ⌈m/2⌉-1
      - paragraph [ref=f12e2476]: 删除 80（叶子节点 [60, 70, 80] 有 3 个关键字，删除后剩 2 个 >= 2，OK）：
      - code [ref=f12e2478]: "[50] / \\ [20, 30] [60, 70]"
      - paragraph [ref=f12e2479]:
        - strong [ref=f12e2480]: 情况 2：删除后关键字数 < ⌈m/2⌉-1，需要"借位"
      - paragraph [ref=f12e2481]: 删除 30（叶子节点 [20, 30] 只有 2 个关键字，删除后剩 1 个 < 2，不满足）：
      - list [ref=f12e2482]:
        - listitem [ref=f12e2483]:
          - text: 先看
          - strong [ref=f12e2484]: 左兄弟
          - text: ：没有左兄弟
        - listitem [ref=f12e2485]:
          - text: 再看
          - strong [ref=f12e2486]: 右兄弟
          - text: ：[60, 70] 有 2 个关键字，刚好 >= 2，可以借
        - listitem [ref=f12e2487]: 借位过程：用父节点 50 替换 30 的位置，用右兄弟的 60 替换父节点 50
      - code [ref=f12e2489]: "[60] / \\ [20] [70]"
      - paragraph [ref=f12e2490]:
        - strong [ref=f12e2491]: 情况 3：兄弟也不够借，需要"合并"
      - paragraph [ref=f12e2492]: 删除 20（叶子节点 [20] 只有 1 个关键字，删除后为 0 < 2，不满足）：
      - list [ref=f12e2493]:
        - listitem [ref=f12e2494]: 兄弟节点 [70] 也只有 1 个关键字，不够借
        - listitem [ref=f12e2495]: 合并：将父节点 60 拉下来，与 [70] 合并成 [60, 70]
      - code [ref=f12e2497]: "[60, 70]（变成新的根节点）"
      - heading "易错陷阱" [level=4] [ref=f12e2498]
      - list [ref=f12e2499]:
        - listitem [ref=f12e2500]:
          - strong [ref=f12e2501]: 根节点是个例外
          - text: ：根节点可以有少于 ⌈m/2⌉ 个孩子（最少 2 个孩子，除非是叶子）。
        - listitem [ref=f12e2502]:
          - strong [ref=f12e2503]: 分裂时中间关键字的选择
          - text: ：对于 m 阶 B 树，有 m 个关键字时取第 ⌈m/2⌉ 个上提（注意不同教材取法略有不同，但核心思想一致）。
        - listitem [ref=f12e2504]:
          - strong [ref=f12e2505]: 删除时优先借兄弟
          - text: ，兄弟不够才合并。
        - listitem [ref=f12e2506]:
          - strong [ref=f12e2507]: B 树的高度
          - text: ：h <= log_⌈m/2⌉((n+1)/2) + 1，所以 B 树很"矮"。
      - heading "记忆口诀" [level=4] [ref=f12e2508]
      - blockquote [ref=f12e2509]:
        - paragraph [ref=f12e2510]: "\"m 阶 B 树记三点：m 孩 m-1 键，半孩半键最少限，所有叶子齐一线。插入分裂往上提，删除借位再合并。\""
      - separator [ref=f12e2511]
      - heading "知识点 7：5 B+ 树与 B 树逐条对比——必考" [level=3] [ref=f12e2512]
      - table [ref=f12e2513]:
        - rowgroup [ref=f12e2514]:
          - row [ref=f12e2515]:
            - columnheader "对比维度" [ref=f12e2516]
            - columnheader "B 树" [ref=f12e2517]
            - columnheader "B+ 树" [ref=f12e2518]
        - rowgroup [ref=f12e2519]:
          - row [ref=f12e2520]:
            - cell [ref=f12e2521]:
              - strong [ref=f12e2522]: 关键字分布
            - cell "每个节点（内部节点+叶子）都存储关键字和对应的数据记录（或数据指针）" [ref=f12e2523]
            - cell [ref=f12e2524]:
              - strong [ref=f12e2525]: 只有叶子节点
              - text: 存储数据记录（或数据指针），内部节点仅存储关键字作为索引
          - row [ref=f12e2526]:
            - cell [ref=f12e2527]:
              - strong [ref=f12e2528]: 关键字重复
            - cell "每个关键字在整棵树中只出现一次" [ref=f12e2529]
            - cell [ref=f12e2530]:
              - text: 内部节点的关键字是"分界值"，会在叶子节点中
              - strong [ref=f12e2531]: 再次出现
              - text: （作为叶子节点的最大/最小关键字）
          - row [ref=f12e2532]:
            - cell [ref=f12e2533]:
              - strong [ref=f12e2534]: 叶子节点结构
            - cell [ref=f12e2535]:
              - text: 叶子节点之间
              - strong [ref=f12e2536]: 没有链接
              - text: ，是独立的
            - cell [ref=f12e2537]:
              - text: 所有叶子节点通过
              - strong [ref=f12e2538]: 链表指针
              - text: 串联起来，形成有序链表
          - row [ref=f12e2539]:
            - cell [ref=f12e2540]:
              - strong [ref=f12e2541]: 查找终点
            - cell "查找可能在任何一层（内部节点或叶子节点）命中并结束" [ref=f12e2542]
            - cell [ref=f12e2543]:
              - text: 查找
              - strong [ref=f12e2544]: 必须走到叶子节点
              - text: 才结束（即使内部节点匹配了，也要继续向下到叶子）
          - row [ref=f12e2545]:
            - cell [ref=f12e2546]:
              - strong [ref=f12e2547]: 范围查询效率
            - cell [ref=f12e2548]:
              - text: 范围查询需要
              - strong [ref=f12e2549]: 中序遍历
              - text: 整棵树，涉及回溯，效率低
            - cell [ref=f12e2550]:
              - text: 先找到起始值所在的叶子节点，然后沿
              - strong [ref=f12e2551]: 链表直接向后扫描
              - text: ，效率极高
          - row [ref=f12e2552]:
            - cell [ref=f12e2553]:
              - strong [ref=f12e2554]: 插入/删除
            - cell "内部节点存数据，调整更复杂" [ref=f12e2555]
            - cell "内部节点只存索引，调整相对简单，叶子节点分裂/合并规则更统一" [ref=f12e2556]
          - row [ref=f12e2557]:
            - cell [ref=f12e2558]:
              - strong [ref=f12e2559]: 节点利用率
            - cell "内部节点和叶子节点结构相同，都存关键字和数据" [ref=f12e2560]
            - cell "内部节点只存索引，可以存更多关键字，树更矮，磁盘 I/O 更少" [ref=f12e2561]
          - row [ref=f12e2562]:
            - cell [ref=f12e2563]:
              - strong [ref=f12e2564]: 主要用途
            - cell "文件系统（如 HFS+、NTFS 的部分索引结构）" [ref=f12e2565]
            - cell [ref=f12e2566]:
              - strong [ref=f12e2567]: 数据库索引
              - text: （MySQL InnoDB 的聚簇索引、非聚簇索引都是 B+ 树）
          - row [ref=f12e2568]:
            - cell [ref=f12e2569]:
              - strong [ref=f12e2570]: 等值查询
            - cell "可能在内部节点就命中，更快" [ref=f12e2571]
            - cell "必须到叶子节点，但数据库通常需要取完整记录，所以差别不大" [ref=f12e2572]
          - row [ref=f12e2573]:
            - cell [ref=f12e2574]:
              - strong [ref=f12e2575]: 叶子节点数据
            - cell "叶子节点存的是数据本身（或数据指针）" [ref=f12e2576]
            - cell "叶子节点存完整数据记录，内部节点只存索引键" [ref=f12e2577]
      - paragraph [ref=f12e2578]:
        - strong [ref=f12e2579]: 核心区别一句话
        - text: ：B 树是"数据分布在各层，哪层找到算哪层"，B+ 树是"数据只在叶子层，内部节点是路标"。
      - heading "例题 11：B+ 树查找" [level=4] [ref=f12e2580]
      - paragraph [ref=f12e2581]: 在 B+ 树中查找关键字 25，内部节点有关键字 25，但叶子节点中没有 25。会发生什么？
      - list [ref=f12e2582]:
        - listitem [ref=f12e2583]:
          - text: 查找会走到叶子节点，
          - strong [ref=f12e2584]: 不会因为内部节点有 25 就停止
          - text: 。最终在叶子节点中找不到 25，返回"不存在"。
        - listitem [ref=f12e2585]: 这与 B 树完全不同——B 树如果在内部节点找到 25 就直接返回了。
      - heading "易错陷阱" [level=4] [ref=f12e2586]
      - list [ref=f12e2587]:
        - listitem [ref=f12e2588]:
          - text: B+ 树内部节点的关键字
          - strong [ref=f12e2589]: 会重复出现在叶子节点
          - text: 中，B 树不重复。
        - listitem [ref=f12e2590]: B+ 树查找"必须走到叶子"，不是"找到就停"。
        - listitem [ref=f12e2591]: 数据库为什么用 B+ 树而不用 B 树？因为范围查询和磁盘 I/O 效率更高。
      - heading "记忆口诀" [level=4] [ref=f12e2592]
      - blockquote [ref=f12e2593]:
        - paragraph [ref=f12e2594]: "\"B 树到处有数据，B+ 叶子才真存。B+ 叶子有链表，范围查询一路扫。\""
      - separator [ref=f12e2595]
      - heading "知识点 7：6 哈希表（散列表）——冲突解决四种方法详解" [level=3] [ref=f12e2596]
      - heading "哈希表基本原理" [level=4] [ref=f12e2597]
      - paragraph [ref=f12e2598]:
        - strong [ref=f12e2599]: 核心思想
        - text: ：通过哈希函数 H(key) 把关键字直接映射到存储地址，理想情况下查找 O(1)。
      - paragraph [ref=f12e2600]:
        - strong [ref=f12e2601]: 装填因子 alpha
        - text: = 表中已存记录数 / 哈希表长度 m。alpha 越大，冲突越多，查找越慢。
      - paragraph [ref=f12e2602]:
        - strong [ref=f12e2603]: 哈希函数构造
        - text: ：最常用的是
        - strong [ref=f12e2604]: 除留余数法
        - text: ——
        - code [ref=f12e2605]: H(key) = key % p
        - text: （p 取不大于 m 的质数，如 m=13 时 p=13）。
      - heading "方法一：线性探测法（Linear Probing）" [level=4] [ref=f12e2606]
      - paragraph [ref=f12e2607]:
        - strong [ref=f12e2608]: 公式
        - text: ：Hi = (H(key) + i) % m，i = 0, 1, 2, ..., m-1
      - paragraph [ref=f12e2609]:
        - strong [ref=f12e2610]: 大白话
        - text: ：冲突了就往后找下一个位置，直到找到空位。
