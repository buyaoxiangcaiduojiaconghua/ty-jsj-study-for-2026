      - paragraph [ref=f12e1894]:
        - strong [ref=f12e1895]: （4）其他存储方式
      - list [ref=f12e1896]:
        - listitem [ref=f12e1897]:
          - strong [ref=f12e1898]: 十字链表
          - text: ：有向图的链式存储，结合邻接表和逆邻接表，方便同时找入边和出边
        - listitem [ref=f12e1899]:
          - strong [ref=f12e1900]: 邻接多重表
          - text: ：无向图的链式存储，每条边只存一次，删除边时不需要修改两个顶点的链表
        - listitem [ref=f12e1901]:
          - strong [ref=f12e1902]: 边集数组
          - text: ：只存所有边的 (起点, 终点, 权值)，适合 Kruskal 等以边为核心的算法
      - separator [ref=f12e1903]
      - heading "知识点 6：3 图的遍历——DFS 和 BFS 详解" [level=3] [ref=f12e1904]
      - paragraph [ref=f12e1905]:
        - strong [ref=f12e1906]: （1）DFS（深度优先搜索）
      - paragraph [ref=f12e1907]:
        - strong [ref=f12e1908]: 核心思想
        - text: ：一条路走到黑，走不通再回头。
      - paragraph [ref=f12e1909]:
        - strong [ref=f12e1910]: 算法步骤
        - text: （以邻接表为例）：
      - code [ref=f12e1912]: 1. 访问起始顶点 v，标记为已访问 2. 对于 v 的每个未访问的邻接顶点 w： - 递归地对 w 进行 DFS 3. 当 v 的所有邻接点都被访问后，回溯到上一层
      - paragraph [ref=f12e1913]:
        - strong [ref=f12e1914]: 执行过程示例
        - text: （无向图：A-B-C-D-E，A-B, B-C, B-D, C-E, D-E）：
      - code [ref=f12e1916]: "DFS(A): 访问 A → 选邻居 B（未访问）→ DFS(B) 访问 B → 选邻居 C（未访问）→ DFS(C) 访问 C → 选邻居 E（未访问）→ DFS(E) 访问 E → 选邻居 D（未访问）→ DFS(D) 访问 D → D 的邻居都访问过 → 回溯 回溯到 E → E 的邻居都访问过 → 回溯 回溯到 C → 回溯 回溯到 B → B 的邻居都访问过 → 回溯 回溯到 A → 结束 DFS 序列：A → B → C → E → D （注：邻接表顺序不同，遍历序列可能不同）"
      - paragraph [ref=f12e1917]:
        - strong [ref=f12e1918]: 时间复杂度
        - text: ：邻接矩阵 O(n²)，邻接表 O(n+e)
        - strong [ref=f12e1919]: 空间复杂度
        - text: ：O(n)（递归栈在最坏情况下深度为 n）
        - strong [ref=f12e1920]: 辅助数据结构
        - text: ：栈（递归本身是系统栈，非递归实现用显式栈）
      - paragraph [ref=f12e1921]:
        - strong [ref=f12e1922]: （2）BFS（广度优先搜索）
      - paragraph [ref=f12e1923]:
        - strong [ref=f12e1924]: 核心思想
        - text: ：像水波扩散，一层一层地访问。
      - paragraph [ref=f12e1925]:
        - strong [ref=f12e1926]: 算法步骤
        - text: ：
      - code [ref=f12e1928]: 1. 访问起始顶点 v，标记为已访问，v 入队 2. 当队列非空时： - 队首顶点出队 - 将其所有未访问的邻接顶点依次访问、标记、入队 3. 重复直到队列为空
      - paragraph [ref=f12e1929]:
        - strong [ref=f12e1930]: 执行过程示例
        - text: （同上图）：
      - code [ref=f12e1932]: "BFS(A): 访问 A，A 入队：[A] 出队 A → A 的邻居 B 未访问 → 访问 B，B 入队：[B] 出队 B → B 的邻居 C,D 未访问 → 访问 C,D，入队：[C, D] 出队 C → C 的邻居 E 未访问 → 访问 E，入队：[D, E] 出队 D → D 的邻居都访问过：[E] 出队 E → E 的邻居都访问过：[] BFS 序列：A → B → C → D → E"
