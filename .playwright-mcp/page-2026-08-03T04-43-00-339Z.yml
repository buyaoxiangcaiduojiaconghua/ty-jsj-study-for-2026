      - heading "3.5 双端队列（Deque）" [level=3] [ref=f12e648]
      - paragraph [ref=f12e649]:
        - text: 双端队列允许在
        - strong [ref=f12e650]: 两端
        - text: 都可以进行插入和删除。
      - paragraph [ref=f12e651]:
        - strong [ref=f12e652]: 两种受限双端队列
        - text: ：
      - list [ref=f12e653]:
        - listitem [ref=f12e654]:
          - strong [ref=f12e655]: 输入受限
          - text: ：只允许一端插入，但两端都可以删除
        - listitem [ref=f12e656]:
          - strong [ref=f12e657]: 输出受限
          - text: ：只允许一端删除，但两端都可以插入
      - heading "3.6 应用场景对比" [level=3] [ref=f12e658]
      - table [ref=f12e659]:
        - rowgroup [ref=f12e660]:
          - row [ref=f12e661]:
            - columnheader "数据结构" [ref=f12e662]
            - columnheader "典型应用场景" [ref=f12e663]
        - rowgroup [ref=f12e664]:
          - row [ref=f12e665]:
            - cell "栈" [ref=f12e666]
            - cell "函数调用（递归）、括号匹配、表达式求值、浏览器的后退、撤销操作（Ctrl+Z）" [ref=f12e667]
          - row [ref=f12e668]:
            - cell "队列" [ref=f12e669]
            - cell "排队系统、打印机任务队列、BFS（广度优先搜索）、消息队列、进程调度" [ref=f12e670]
      - heading "3.7 例题精讲" [level=3] [ref=f12e671]
      - paragraph [ref=f12e672]:
        - strong [ref=f12e673]: 例题 10
        - text: ：一个栈的入栈序列是 a, b, c, d, e，则栈的不可能的输出序列是（ ） A. edcba B. decba C. dceab D. abcde
      - blockquote [ref=f12e674]:
        - paragraph [ref=f12e675]:
          - strong [ref=f12e676]: 答案：C
          - text: 。栈是 LIFO。对于 C 选项 dceab：先出 d，说明 a,b,c 已入栈；c 出栈；再出 e，说明 e 入栈后立即出栈；此时栈内剩 a,b，接下来只能出 b 再出 a，不能出 a 再出 b。
      - paragraph [ref=f12e677]:
        - strong [ref=f12e678]: 例题 11
        - text: ：循环队列用数组 A[0..m-1] 存放元素，front 指向队头元素的前一个位置，rear 指向队尾元素，则队满条件是（ ） A. front == rear B. front == (rear+1)%m C. rear == (front+1)%m D. (rear+1)%m == front
      - blockquote [ref=f12e679]:
        - paragraph [ref=f12e680]:
          - strong [ref=f12e681]: 答案
          - text: ：D。不管 front 和 rear 的约定如何，牺牲一个位置的队满条件都是 (rear+1)%m == front。
      - paragraph [ref=f12e682]:
        - strong [ref=f12e683]: 例题 12
        - text: ：中缀表达式
        - code [ref=f12e684]: A + B * (C - D) - E / F
        - text: 的后缀表达式是（ ） A.
        - code [ref=f12e685]: ABCD-*+EF/-
        - text: B.
        - code [ref=f12e686]: ABC+D-*EF/-
        - text: C.
        - code [ref=f12e687]: AB+CD-*EF/-
        - text: D.
        - code [ref=f12e688]: ABCD-*+EF/-
      - blockquote [ref=f12e689]:
        - paragraph [ref=f12e690]:
          - strong [ref=f12e691]: 答案
          - text: ：A。按算法逐步转换即可验证。
      - paragraph [ref=f12e692]:
        - strong [ref=f12e693]: 例题 13
        - text: ：设循环队列的数组大小为 MAXSIZE = 6，front = 3，rear = 0，则队列中元素个数为（ ） A. 2 B. 3 C. 4 D. 5
      - blockquote [ref=f12e694]:
        - paragraph [ref=f12e695]:
          - strong [ref=f12e696]: 答案：B
          - text: 。rear < front，使用公式：(0 - 3 + 6) % 6 = 3。
      - heading "3.8 易错点与陷阱" [level=3] [ref=f12e697]
      - list [ref=f12e698]:
        - listitem [ref=f12e699]:
          - strong [ref=f12e700]: 陷阱
          - text: ：循环队列中 front 和 rear 的含义在不同教材中可能不同——有的 front 指向队头元素，有的 front 指向队头元素的前一个位置。做选择题时先看清约定。
        - listitem [ref=f12e701]:
          - strong [ref=f12e702]: 陷阱
          - text: ：循环队列"牺牲一个存储单元"的队满条件是
          - code [ref=f12e703]: (rear+1)%MAXSIZE == front
          - text: ，不是
          - code [ref=f12e704]: rear == front
          - text: （那是队空）。
        - listitem [ref=f12e705]:
          - strong [ref=f12e706]: 陷阱
          - text: ：中缀转后缀时，遇到右括号要弹出到左括号为止，
          - strong [ref=f12e707]: 括号不输出
          - text: 。
        - listitem [ref=f12e708]:
          - strong [ref=f12e709]: 陷阱
          - text: ：中缀转后缀中，当前运算符优先级
          - strong [ref=f12e710]: 等于
          - text: 栈顶时，也要弹出（左结合性）。但幂运算
          - code [ref=f12e711]: ^
          - text: 是右结合，处理不同。
        - listitem [ref=f12e712]:
          - strong [ref=f12e713]: 陷阱
          - text: ：栈的入栈和出栈序列问题，核心原则是"某一时刻栈内元素必须满足 LIFO"。
      - heading "3.9 记忆口诀" [level=3] [ref=f12e714]
      - blockquote [ref=f12e715]:
        - paragraph [ref=f12e716]:
          - strong [ref=f12e717]: 栈
          - text: ：先进后出像弹夹，入栈出栈都从顶；顺序链式都能存，判空判满要注意。
          - strong [ref=f12e718]: 循环队列
          - text: ：队空队满容易混，front rear 对半分；牺牲一个区分开，rear+1 等于 front 才是满。
          - strong [ref=f12e719]: 中缀转后缀
          - text: ：数字直接输出，符号看栈顶；括号特殊处理，右括号弹到左括号停。
          - strong [ref=f12e720]: 双端队列
          - text: ：两端都能插和删，受限类型考判断；输入受限制一端插，输出受限制一端删。
      - separator [ref=f12e721]
      - heading "知识点 4：数组、数组的压缩存储与字符串" [level=2] [ref=f12e722]
      - blockquote [ref=f12e723]:
        - paragraph [ref=f12e724]: ⭐⭐高频 —— 行优先/列优先地址计算、对称矩阵压缩存储是必会计算题
      - heading "知识点 4：1 数组的存储结构与地址计算" [level=3] [ref=f12e725]
      - paragraph [ref=f12e726]:
        - strong [ref=f12e727]: 一维数组的地址公式
        - text: ：
      - paragraph [ref=f12e728]: 一维数组在内存中连续存放，第 i 个元素的地址（下标从 0 开始）：
      - code [ref=f12e730]: LOC(a[i]) = LOC(a[0]) + i × L
      - paragraph [ref=f12e731]: 其中 L 是每个元素占用的字节数（sizeof(元素类型)）。
      - paragraph [ref=f12e732]:
        - strong [ref=f12e733]: 二维数组的行优先存储（Row-Major Order）
        - text: ：
      - paragraph [ref=f12e734]: 这是 C 语言、大多数编程语言采用的存储方式。按行存放，先把第一行存完，再存第二行...
      - paragraph [ref=f12e735]:
        - text: 假设数组声明为
        - code [ref=f12e736]: a[m][n]
        - text: （m 行 n 列），每个元素占 L 字节，起始地址为 LOC(a[0][0])：
      - code [ref=f12e738]: LOC(a[i][j]) = LOC(a[0][0]) + (i × n + j) × L
      - paragraph [ref=f12e739]:
        - strong [ref=f12e740]: 公式推导
        - text: （下标从 0 开始）：
      - list [ref=f12e741]:
        - listitem [ref=f12e742]: 元素 a[i][j] 前面有完整的 i 行（第 0 行到第 i-1 行），每行 n 个元素，共 i × n 个
        - listitem [ref=f12e743]: 再加上第 i 行中前面 j 个元素（第 0 列到第 j-1 列）
        - listitem [ref=f12e744]:
          - text: 所以 a[i][j] 前面共有
          - code [ref=f12e745]: i × n + j
          - text: 个元素
        - listitem [ref=f12e746]: 地址 = 起始地址 + (i × n + j) × 每个元素大小
      - paragraph [ref=f12e747]:
        - strong [ref=f12e748]: 二维数组的列优先存储（Column-Major Order）
        - text: ：
      - paragraph [ref=f12e749]: FORTRAN、MATLAB 采用列优先。按列存放，先把第一列存完，再存第二列...
      - code [ref=f12e751]: LOC(a[i][j]) = LOC(a[0][0]) + (j × m + i) × L
      - paragraph [ref=f12e752]:
        - strong [ref=f12e753]: 推导
        - text: ：a[i][j] 前面有完整的 j 列（第 0 列到第 j-1 列），每列 m 个元素，共 j × m 个；再加上第 j 列中前面 i 个元素，共 j × m + i 个。
      - paragraph [ref=f12e754]:
        - strong [ref=f12e755]: 如果下标从 1 开始
        - text: ，公式需要调整：
      - code [ref=f12e757]: 行优先（下标从 1 开始）：LOC(a[i][j]) = LOC(a[1][1]) + [(i-1) × n + (j-1)] × L 列优先（下标从 1 开始）：LOC(a[i][j]) = LOC(a[1][1]) + [(j-1) × m + (i-1)] × L
      - separator [ref=f12e758]
      - heading "知识点 4：2 特殊矩阵的压缩存储" [level=3] [ref=f12e759]
      - paragraph [ref=f12e760]:
        - strong [ref=f12e761]: 为什么要压缩存储
        - text: ：很多矩阵有大量重复元素或规律分布，完整存储浪费空间。利用规律，只存必要元素，同时能根据下标公式快速定位。
      - heading "4.2.1 对称矩阵的压缩存储" [level=4] [ref=f12e762]
      - paragraph [ref=f12e763]:
        - strong [ref=f12e764]: 定义
        - text: ：n 阶方阵中
        - code [ref=f12e765]: a[i][j] = a[j][i]
        - text: （1 ≤ i, j ≤ n）。只需存储下三角（含对角线）的元素即可。
      - paragraph [ref=f12e766]:
        - strong [ref=f12e767]: 存储元素个数
        - text: ：下三角（含对角线）的元素个数 =
        - code [ref=f12e768]: n(n+1)/2
      - paragraph [ref=f12e769]:
        - strong [ref=f12e770]: 存储方式
        - text: ：将下三角元素按行优先存入一维数组
        - code [ref=f12e771]: B[0 ... n(n+1)/2 - 1]
        - text: 。
      - paragraph [ref=f12e772]:
        - strong [ref=f12e773]: 下标映射公式
        - text: （下标从 1 开始的矩阵，存到下标从 0 开始的一维数组）：
      - paragraph [ref=f12e774]: 对于下三角元素（i ≥ j）：
      - code [ref=f12e776]: k = i(i-1)/2 + j - 1
      - paragraph [ref=f12e777]:
        - strong [ref=f12e778]: 公式推导
        - text: ：
      - list [ref=f12e779]:
        - listitem [ref=f12e780]: a[i][j] 前面有完整的 i-1 行（第 1 行到第 i-1 行）
        - listitem [ref=f12e781]: 第 1 行有 1 个元素，第 2 行有 2 个元素，...，第 i-1 行有 i-1 个元素
        - listitem [ref=f12e782]: 等差求和：1+2+...+(i-1) = i(i-1)/2
        - listitem [ref=f12e783]: 再加上第 i 行中前面的 j-1 个元素
        - listitem [ref=f12e784]: 所以 k = i(i-1)/2 + j - 1
      - paragraph [ref=f12e785]:
        - text: 对于上三角元素（i < j）：利用对称性，
        - code [ref=f12e786]: a[i][j] = a[j][i]
        - text: ，用下三角公式：
      - code [ref=f12e788]: k = j(j-1)/2 + i - 1
      - paragraph [ref=f12e789]:
        - strong [ref=f12e790]: 例题 1
        - text: ：有一个 5×5 的对称矩阵，按行优先将下三角元素存入一维数组 B，求 a[3][2] 和 a[2][3] 在 B 中的下标 k。
      - blockquote [ref=f12e791]:
        - paragraph [ref=f12e792]:
          - strong [ref=f12e793]: 解
          - text: ：a[3][2] 是下三角（i=3 ≥ j=2），k = 3×2/2 + 2 - 1 = 3 + 1 = 4。a[2][3] 是上三角（i=2 < j=3），利用对称性 k = 3×2/2 + 2 - 1 = 4。两者下标相同。
      - heading "4.2.2 三角矩阵的压缩存储" [level=4] [ref=f12e794]
      - paragraph [ref=f12e795]:
        - strong [ref=f12e796]: 下三角矩阵
        - text: ：上三角区域（不含对角线）全是同一个常数 c。存储策略与对称矩阵类似，下三角（含对角线）元素按行优先存入一维数组，额外在数组末尾加一个位置存常数 c。
      - paragraph [ref=f12e797]:
        - text: 存储元素个数：
        - code [ref=f12e798]: n(n+1)/2 + 1
      - paragraph [ref=f12e799]:
        - text: 对于下三角元素（i ≥ j）：
        - code [ref=f12e800]: k = i(i-1)/2 + j - 1
        - text: 对于上三角元素（i < j）：
        - code [ref=f12e801]: k = n(n+1)/2
        - text: （常数 c 的位置）
      - paragraph [ref=f12e802]:
        - strong [ref=f12e803]: 上三角矩阵
        - text: ：下三角区域（不含对角线）全是同一个常数 c。按行优先存储上三角（含对角线）。
      - paragraph [ref=f12e804]:
        - text: 存储元素个数：
        - code [ref=f12e805]: n(n+1)/2 + 1
      - paragraph [ref=f12e806]: 对于上三角元素（i ≤ j）：
      - code [ref=f12e808]: k = (i-1)×(2n-i+2)/2 + (j-i)
      - blockquote [ref=f12e809]:
        - paragraph [ref=f12e810]: 推导思路：第 1 行有 n 个上三角元素，第 2 行有 n-1 个，...，第 i 行有 n-i+1 个。前面 i-1 行共 (i-1)×(2n-i+2)/2 个，加上该行偏移 j-i。
      - heading "4.2.3 三对角矩阵（带状矩阵）的压缩存储" [level=4] [ref=f12e811]
      - paragraph [ref=f12e812]:
        - strong [ref=f12e813]: 定义
        - text: ：只有主对角线及其相邻的两条斜线上有非零元素，其余位置都是 0。即
        - code [ref=f12e814]: "|i - j| > 1"
        - text: 时
        - code [ref=f12e815]: a[i][j] = 0
        - text: 。
      - paragraph [ref=f12e816]:
        - strong [ref=f12e817]: 特点
        - text: ：第 1 行和第 n 行只有 2 个非零元素，其余行有 3 个非零元素。
      - paragraph [ref=f12e818]:
        - strong [ref=f12e819]: 存储元素个数
        - text: ：
        - code [ref=f12e820]: 3n - 2
      - paragraph [ref=f12e821]:
        - strong [ref=f12e822]: 按行优先存储的下标映射
        - text: ：
      - code [ref=f12e824]: k = 2×i + j - 3
      - paragraph [ref=f12e825]: （适用于 i 和 j 从 1 开始，且 |i-j| ≤ 1）
      - paragraph [ref=f12e826]:
        - strong [ref=f12e827]: 例题 2
        - text: ：10×10 的三对角矩阵，a[5][5]、a[5][4]、a[5][6] 在一维数组中的下标分别是多少？
      - blockquote [ref=f12e828]:
        - paragraph [ref=f12e829]:
          - strong [ref=f12e830]: 解
          - text: ：a[5][5]：k = 2×5 + 5 - 3 = 12；a[5][4]：k = 2×5 + 4 - 3 = 11；a[5][6]：k = 2×5 + 6 - 3 = 13。依次相邻，符合三对角矩阵"一行最多 3 个元素"的规律。
      - separator [ref=f12e831]
      - heading "知识点 4：3 稀疏矩阵的三元组表示与转置" [level=3] [ref=f12e832]
      - paragraph [ref=f12e833]:
        - strong [ref=f12e834]: 稀疏矩阵
        - text: ：非零元素个数远小于总元素个数（通常非零元素占比 < 5%）。
      - paragraph [ref=f12e835]:
        - strong [ref=f12e836]: 三元组表示
        - text: ：每个非零元素用
        - code [ref=f12e837]: (行号, 列号, 值)
        - text: 表示，所有三元组按行号优先排列。
      - paragraph [ref=f12e838]: 例如矩阵：
      - code [ref=f12e840]: 0 0 3 0 0 5 0 0 0 0 0 7 4 0 0 0
      - paragraph [ref=f12e841]:
        - text: 三元组表：
        - code [ref=f12e842]: "{(0,2,3), (1,1,5), (2,3,7), (3,0,4)}"
      - paragraph [ref=f12e843]:
        - strong [ref=f12e844]: 三元组转置算法
        - text: ：
      - paragraph [ref=f12e845]:
        - text: 转置操作：将 m×n 矩阵 A 转置为 n×m 矩阵 B，即
        - code [ref=f12e846]: B[j][i] = A[i][j]
        - text: 。
      - paragraph [ref=f12e847]:
        - strong [ref=f12e848]: 经典算法（O(n×t)，t 为非零元素个数）
        - text: ：
      - list [ref=f12e849]:
        - listitem [ref=f12e850]: 扫描 A 的三元组表，统计每列的非零元素个数（即 B 中每行的元素个数）
        - listitem [ref=f12e851]: 计算 B 中每行的起始位置（前缀和）
        - listitem [ref=f12e852]:
          - text: 再次扫描 A 的三元组表，每个元素
          - code [ref=f12e853]: (i, j, v)
          - text: 放到 B 中位置
          - code [ref=f12e854]: pos[j]
          - text: ，然后
          - code [ref=f12e855]: pos[j]++
      - paragraph [ref=f12e856]:
        - strong [ref=f12e857]: 例题 3
        - text: ：三元组表
        - code [ref=f12e858]: "{(0,0,1), (0,2,3), (1,1,5), (2,0,4), (2,2,2)}"
        - text: 的转置结果是？
      - blockquote [ref=f12e859]:
        - paragraph [ref=f12e860]:
          - strong [ref=f12e861]: 解
          - text: ：统计各列元素个数：col[0]=2, col[1]=1, col[2]=2。起始位置：pos[0]=0, pos[1]=2, pos[2]=3。转置后：
          - code [ref=f12e862]: "{(0,0,1), (0,2,4), (1,1,5), (2,0,3), (2,2,2)}"
          - text: 。
      - separator [ref=f12e863]
      - heading "知识点 4：4 字符串与 KMP 算法" [level=3] [ref=f12e864]
      - paragraph [ref=f12e865]:
        - strong [ref=f12e866]: 朴素模式匹配
        - text: ：主串 S 的每个位置作为起点，尝试匹配模式串 T。最坏时间复杂度 O(m×n)。
      - paragraph [ref=f12e867]:
        - strong [ref=f12e868]: KMP 算法核心思想
        - text: ：主串指针 i 不回溯，利用已经匹配的部分信息，通过 next 数组决定模式串指针 j 应该跳到哪个位置。时间复杂度 O(m+n)。
      - heading "4.4.1 next 数组的详细求解" [level=4] [ref=f12e869]
      - paragraph [ref=f12e870]:
        - strong [ref=f12e871]: next[j] 的含义
        - text: ：在模式串 T 中，第 j 个字符之前的子串（T[0...j-1]）中，最长相等前后缀的长度。
      - paragraph [ref=f12e872]:
        - strong [ref=f12e873]: 前缀
        - text: ：不包含最后一个字符的、以首字符开头的所有子串。
        - strong [ref=f12e874]: 后缀
        - text: ：不包含第一个字符的、以末字符结尾的所有子串。
      - paragraph [ref=f12e875]:
        - strong [ref=f12e876]: next 数组的手工计算步骤
        - text: （下标从 0 开始）：
      - list [ref=f12e877]:
        - listitem [ref=f12e878]: next[0] = -1（第一个字符前没有子串，特殊标记）
        - listitem [ref=f12e879]:
          - text: 对于位置 j（j ≥ 1），看 T[0...j-1] 这个子串：
          - list [ref=f12e880]:
            - listitem [ref=f12e881]: 列出所有前缀（不包括整个子串）
            - listitem [ref=f12e882]: 列出所有后缀（不包括整个子串）
            - listitem [ref=f12e883]: 找最长相等的"前缀"和"后缀"
            - listitem [ref=f12e884]: next[j] = 这个最长相等前后缀的长度
