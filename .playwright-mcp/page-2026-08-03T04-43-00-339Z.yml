        - text: ：不会产生"二次聚集"。
        - strong [ref=f12e2763]: 缺点
        - text: ：可能探测不到所有空位（需要表长 m 是 4k+3 形式的质数才能保证探测到所有位置）。
      - heading "方法三：双散列法（Double Hashing）" [level=4] [ref=f12e2764]
      - paragraph [ref=f12e2765]:
        - strong [ref=f12e2766]: 公式
        - text: ：Hi = (H1(key) + i * H2(key)) % m，i = 0, 1, 2, ...
      - paragraph [ref=f12e2767]:
        - strong [ref=f12e2768]: 大白话
        - text: ：用第二个哈希函数确定步长，不同关键字的步长不同，彻底避免聚集。
      - paragraph [ref=f12e2769]:
        - strong [ref=f12e2770]: 条件
        - text: ：H2(key) 必须与 m 互质，且 H2(key) != 0。
      - paragraph [ref=f12e2771]:
        - strong [ref=f12e2772]: 例题 14
        - text: ：m=13，H1(key)=key%13，H2(key)=7-(key%7)。插入：
