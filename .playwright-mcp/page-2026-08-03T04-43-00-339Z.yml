          - strong [ref=f12e1415]: 队列
          - text: 实现）
      - code [ref=f12e1417]: A / \ B C / \ / \ D E F G 前序：A B D E C F G 中序：D B E A F C G 后序：D E B F G C A 层次：A B C D E F G
      - paragraph [ref=f12e1418]:
        - strong [ref=f12e1419]: 非递归遍历算法（面试/笔试重点）
        - text: ：
      - paragraph [ref=f12e1420]:
        - strong [ref=f12e1421]: （1）前序遍历的非递归实现
        - text: （用栈）：
      - code [ref=f12e1423]: 1. 根节点入栈 2. 当栈非空时： - 弹出栈顶节点，访问它 - 先压入右孩子（如果存在） - 再压入左孩子（如果存在） （注意顺序：先右后左，这样左孩子先出栈，保证"根→左→右"的顺序）
      - paragraph [ref=f12e1424]:
        - strong [ref=f12e1425]: （2）中序遍历的非递归实现
        - text: （用栈）：
      - code [ref=f12e1427]: 1. 当前节点 p = 根节点 2. 当 p 非空 或 栈非空： - 如果 p 非空：p 入栈，p = p->左孩子（一直往左走到底） - 否则：弹出栈顶节点，访问它，p = p->右孩子（转向右子树）
      - paragraph [ref=f12e1428]:
        - strong [ref=f12e1429]: （3）后序遍历的非递归实现
        - text: （最复杂，用栈 + 标记）：
      - code [ref=f12e1431]: 1. 根节点入栈 2. 当栈非空时： - 取栈顶节点（不出栈） - 如果它的左右子树都已访问过（或都是叶子），则弹出并访问它 - 否则：先压入右孩子（如果存在且未访问），再压入左孩子（如果存在且未访问）
      - paragraph [ref=f12e1432]:
        - strong [ref=f12e1433]: 必考点
        - text: ：
      - list [ref=f12e1434]:
        - listitem [ref=f12e1435]: 给中序 + 前序/后序，能唯一画出二叉树
        - listitem [ref=f12e1436]:
          - strong [ref=f12e1437]: 前序+后序不能唯一确定二叉树
          - text: （无法区分左右孩子）
        - listitem [ref=f12e1438]:
          - text: 非递归遍历用
          - strong [ref=f12e1439]: 栈
          - text: 辅助，层次遍历用
          - strong [ref=f12e1440]: 队列
          - text: 辅助
      - paragraph [ref=f12e1441]:
        - strong [ref=f12e1442]: 例题 13
        - text: ：已知前序 ABCDEF，中序 CBAEDF，画出二叉树并写后序。
      - blockquote [ref=f12e1443]:
        - paragraph [ref=f12e1444]:
          - strong [ref=f12e1445]: 解
          - text: ：前序首字母 A 是根。中序中 A 左边 "CB" 是左子树（2 个节点），右边 "EDF" 是右子树（3 个节点）。前序中左子树部分 "BC"，所以 B 是左子根；右子树部分 "DEF"，所以 D 是右子根。中序中 B 左边 "C" 是 B 的左子树，B 右边无元素即 B 无右子树。中序中 D 左边 "E" 是 D 的左子树，右边 "F" 是 D 的右子树。后序：CBEFDA。
      - separator [ref=f12e1446]
      - heading "知识点 5：4 线索二叉树——构造过程详解" [level=3] [ref=f12e1447]
      - paragraph [ref=f12e1448]:
        - strong [ref=f12e1449]: 基本概念
        - text: ：n 个节点的二叉链表有 n+1 个空指针域。线索二叉树利用这些空指针指向遍历序列中的前驱和后继，从而加速遍历。
      - paragraph [ref=f12e1450]:
        - strong [ref=f12e1451]: 线索化标记
        - text: ：
      - table [ref=f12e1452]:
        - rowgroup [ref=f12e1453]:
          - row [ref=f12e1454]:
            - columnheader "标记" [ref=f12e1455]
            - columnheader "含义" [ref=f12e1456]
        - rowgroup [ref=f12e1457]:
          - row [ref=f12e1458]:
            - cell "ltag = 0" [ref=f12e1459]
            - cell "左指针指向左孩子" [ref=f12e1460]
          - row [ref=f12e1461]:
            - cell "ltag = 1" [ref=f12e1462]
            - cell "左指针指向前驱" [ref=f12e1463]
          - row [ref=f12e1464]:
            - cell "rtag = 0" [ref=f12e1465]
            - cell "右指针指向右孩子" [ref=f12e1466]
          - row [ref=f12e1467]:
            - cell "rtag = 1" [ref=f12e1468]
            - cell "右指针指向后继" [ref=f12e1469]
      - paragraph [ref=f12e1470]:
        - strong [ref=f12e1471]: 中序线索化的构造过程
        - text: （以中序序列 D-B-E-A-F-C-G 为例）：
      - code [ref=f12e1473]: 原始二叉树： 中序线索二叉树（虚线=线索，实线=孩子）： A A / \ / \ B C B C / \ / \ / \ / \ D E F G D E F G
      - paragraph [ref=f12e1474]:
        - strong [ref=f12e1475]: 构造步骤
        - text: ：在中序遍历过程中，用一个 pre 指针记录前一个访问的节点：
      - list [ref=f12e1476]:
        - listitem [ref=f12e1477]: 中序遍历到 D 时，pre=null，D 没有前驱
        - listitem [ref=f12e1478]: 访问 B 时，pre=D，D 无右孩子，D 的右指针指向 B（后继），B 的左指针指向 D（前驱）
        - listitem [ref=f12e1479]: 以此类推，每个节点检查自己是否有空指针，有就指向 pre（前驱）或让 pre 指向自己（后继）
      - paragraph [ref=f12e1480]:
        - strong [ref=f12e1481]: 线索二叉树的优点
        - text: ：遍历不需要递归/栈，直接沿着线索走，时间复杂度 O(n)，空间复杂度 O(1)。
      - separator [ref=f12e1482]
      - heading "知识点 5：5 树和森林转为二叉树——\"左孩子右兄弟\"详解" [level=3] [ref=f12e1483]
      - paragraph [ref=f12e1484]:
        - strong [ref=f12e1485]: 核心转换规则
        - text: （三步法）：
      - list [ref=f12e1486]:
        - listitem [ref=f12e1487]:
          - strong [ref=f12e1488]: 加线
          - text: ：同一父节点的所有兄弟节点之间加一条横线
        - listitem [ref=f12e1489]:
          - strong [ref=f12e1490]: 抹线
          - text: ：每个节点只保留它与第一个孩子之间的连线，抹掉与其他孩子之间的连线
        - listitem [ref=f12e1491]:
          - strong [ref=f12e1492]: 旋转
          - text: ：以根为轴心，顺时针旋转约 45 度，使原来水平的兄弟连线变成倾斜的右孩子链
      - paragraph [ref=f12e1493]:
        - strong [ref=f12e1494]: 详细示例
        - text: ：
      - code [ref=f12e1496]: "原始树： 步骤1: 加兄弟线 步骤2: 抹掉多余父子线 步骤3: 旋转（二叉树） A A A A /|\\ /|\\ / \\ B C D → B-C-D → B B | | \\ \\ E E C C \\ \\ D D / \\ E E"
      - paragraph [ref=f12e1497]:
        - strong [ref=f12e1498]: 转换后的二叉树特点
        - text: ：
      - list [ref=f12e1499]:
        - listitem [ref=f12e1500]: 原树的根 → 二叉树的根（没有右子树）
        - listitem [ref=f12e1501]: 原树中节点的第一个孩子 → 二叉树中该节点的左孩子
        - listitem [ref=f12e1502]: 原树中节点的兄弟 → 二叉树中该节点的右孩子（或右孩子链）
      - paragraph [ref=f12e1503]:
        - strong [ref=f12e1504]: 森林转二叉树
        - text: ：
      - list [ref=f12e1505]:
        - listitem [ref=f12e1506]: 先把森林中每棵树分别转成二叉树
        - listitem [ref=f12e1507]: 从第一棵开始，把后一棵二叉树的根作为前一棵二叉树根的右孩子
      - paragraph [ref=f12e1508]:
        - strong [ref=f12e1509]: 二叉树还原为树/森林
        - text: （逆过程）：
      - list [ref=f12e1510]:
        - listitem [ref=f12e1511]: 二叉树的根及其左子树 → 第一棵树（二叉树根的左孩子对应原树的第一个孩子，左孩子的右孩子链对应原树的兄弟）
        - listitem [ref=f12e1512]: 二叉树的根的右子树 → 森林中其余树
      - separator [ref=f12e1513]
      - heading "知识点 5：6 BST（二叉排序树/二叉查找树）——插入、删除、查找详解" [level=3] [ref=f12e1514]
      - paragraph [ref=f12e1515]:
        - strong [ref=f12e1516]: 定义
        - text: ：左子树所有节点值 < 根节点值 < 右子树所有节点值（中序遍历得到递增序列）。
      - paragraph [ref=f12e1517]:
        - strong [ref=f12e1518]: （1）查找操作
        - text: ：
      - code [ref=f12e1520]: 从根节点开始： - 如果 key == 当前节点值 → 找到，返回 - 如果 key < 当前节点值 → 去左子树找 - 如果 key > 当前节点值 → 去右子树找 - 如果走到空节点 → 不存在
      - paragraph [ref=f12e1521]: 时间复杂度：平均 O(log n)，最坏 O(n)（退化为单链表）。
      - paragraph [ref=f12e1522]:
        - strong [ref=f12e1523]: （2）插入操作
        - text: ：
      - code [ref=f12e1525]: 从根节点开始，按照查找的路径走： - 如果 key < 当前节点值 → 去左子树（如果左子树为空，插入为左孩子） - 如果 key > 当前节点值 → 去右子树（如果右子树为空，插入为右孩子） - 如果 key == 当前节点值 → 不插入（BST 通常不允许重复值）
      - paragraph [ref=f12e1526]:
        - strong [ref=f12e1527]: （3）删除操作（三种情况）
        - text: ：
      - table [ref=f12e1528]:
        - rowgroup [ref=f12e1529]:
          - row [ref=f12e1530]:
            - columnheader "情况" [ref=f12e1531]
            - columnheader "被删节点状态" [ref=f12e1532]
            - columnheader "操作" [ref=f12e1533]
        - rowgroup [ref=f12e1534]:
          - row [ref=f12e1535]:
            - cell "情况 1" [ref=f12e1536]
            - cell "叶子节点" [ref=f12e1537]
            - cell "直接删除，父节点对应指针置空" [ref=f12e1538]
          - row [ref=f12e1539]:
            - cell "情况 2" [ref=f12e1540]
            - cell "只有一个孩子" [ref=f12e1541]
            - cell "孩子顶替被删节点的位置" [ref=f12e1542]
          - row [ref=f12e1543]:
            - cell "情况 3" [ref=f12e1544]
            - cell "有两个孩子" [ref=f12e1545]
            - cell "找直接后继（右子树的最小值）或直接前驱（左子树的最大值），用它的值替换被删节点，然后删除那个后继/前驱节点（此时该节点至多只有一个孩子，转化为情况 1 或 2）" [ref=f12e1546]
      - paragraph [ref=f12e1547]:
        - strong [ref=f12e1548]: 例题 14
        - text: ：依次插入
        - code [ref=f12e1549]: "[50, 30, 20, 40, 70, 60, 80]"
        - text: 构建 BST，画出最终 BST，并写出删除 50 后的 BST。
      - blockquote [ref=f12e1550]:
        - paragraph [ref=f12e1551]:
          - strong [ref=f12e1552]: 解
          - text: ：构建后 BST 的中序为 20,30,40,50,60,70,80。删除 50（有两个孩子），找直接后继 60（右子树最小值），用 60 替换 50，删除原 60 节点（60 是叶子，直接删）。删除后 BST 中序：20,30,40,60,70,80。
      - paragraph [ref=f12e1553]:
        - strong [ref=f12e1554]: 例题 15
        - text: ：一个空的 BST，依次插入
        - code [ref=f12e1555]: "[5, 3, 7, 2, 4, 6, 8]"
        - text: ，中序序列是什么？如果插入顺序是
        - code [ref=f12e1556]: "[2, 3, 4, 5, 6, 7, 8]"
        - text: 呢？
      - blockquote [ref=f12e1557]:
        - paragraph [ref=f12e1558]:
          - strong [ref=f12e1559]: 解
          - text: ：第一种顺序的中序始终是 2,3,4,5,6,7,8（BST 中序永远递增）。第二种顺序插入后 BST 退化为一条右斜单链表，深度为 8，查找效率降为 O(n)。
      - separator [ref=f12e1560]
      - heading "知识点 5：7 AVL 树（平衡二叉树）——四种旋转的详细图解" [level=3] [ref=f12e1561]
      - paragraph [ref=f12e1562]:
        - strong [ref=f12e1563]: 平衡因子（BF）
        - text: = 左子树高度 - 右子树高度。|BF| ≤ 1 才算平衡。
      - paragraph [ref=f12e1564]:
        - strong [ref=f12e1565]: 四种失衡类型及旋转操作
        - text: ：
      - heading "（1）LL 型——右旋（单旋）" [level=4] [ref=f12e1566]
      - paragraph [ref=f12e1567]:
        - strong [ref=f12e1568]: 场景
        - text: ：在 A 的
        - strong [ref=f12e1569]: 左孩子的左子树
        - text: 中插入导致 A 失衡（BF = 2）。
      - code [ref=f12e1571]: 旋转前： 右旋后： A(2) B / / \ B(1) → C A / C
      - paragraph [ref=f12e1572]:
        - strong [ref=f12e1573]: 操作
        - text: ：B 成为新根，A 成为 B 的右孩子，B 的右子树成为 A 的左子树。
      - paragraph [ref=f12e1574]:
        - strong [ref=f12e1575]: 判断口诀
        - text: ：找"罪魁祸首"——从插入点向上找，第一个 BF=±2 的节点就是失衡点。LL 型表示在失衡点的左(L)子树的左(L)子树中插入。
      - heading "（2）RR 型——左旋（单旋）" [level=4] [ref=f12e1576]
      - paragraph [ref=f12e1577]:
        - strong [ref=f12e1578]: 场景
        - text: ：在 A 的
        - strong [ref=f12e1579]: 右孩子的右子树
        - text: 中插入导致 A 失衡（BF = -2）。
      - code [ref=f12e1581]: 旋转前： 左旋后： A(-2) B \ / \ B(-1) → A C \ C
      - paragraph [ref=f12e1582]:
        - strong [ref=f12e1583]: 操作
        - text: ：B 成为新根，A 成为 B 的左孩子，B 的左子树成为 A 的右子树。
      - heading "（3）LR 型——先左旋后右旋（双旋）" [level=4] [ref=f12e1584]
      - paragraph [ref=f12e1585]:
        - strong [ref=f12e1586]: 场景
        - text: ：在 A 的
        - strong [ref=f12e1587]: 左孩子的右子树
        - text: 中插入导致 A 失衡。
      - code [ref=f12e1589]: 旋转前： 第一步：左旋B 第二步：右旋A A(2) A(2) C / / / \ B(-1) → C(1) → B A \ / C B
      - paragraph [ref=f12e1590]:
        - strong [ref=f12e1591]: 操作
        - text: ：先对 B 做左旋（变成 LL 型），再对 A 做右旋。
      - heading "（4）RL 型——先右旋后左旋（双旋）" [level=4] [ref=f12e1592]
      - paragraph [ref=f12e1593]:
        - strong [ref=f12e1594]: 场景
        - text: ：在 A 的
        - strong [ref=f12e1595]: 右孩子的左子树
        - text: 中插入导致 A 失衡。
      - code [ref=f12e1597]: 旋转前： 第一步：右旋B 第二步：左旋A A(-2) A(-2) C \ \ / \ B(1) → C(-1) → A B / \ C B
      - paragraph [ref=f12e1598]:
        - strong [ref=f12e1599]: 操作
        - text: ：先对 B 做右旋（变成 RR 型），再对 A 做左旋。
      - paragraph [ref=f12e1600]:
        - strong [ref=f12e1601]: 记忆口诀
        - text: ：
        - strong [ref=f12e1602]: "\"LL 右旋，RR 左旋，LR 左右旋，RL 右左旋\""
        - text: ——两个字母时，旋转方向跟第二个字母相反。
      - paragraph [ref=f12e1603]:
        - strong [ref=f12e1604]: 例题 16
        - text: ：在 AVL 树中依次插入
        - code [ref=f12e1605]: "[20, 10, 30, 25, 5]"
        - text: ，第一次出现失衡是在插入哪个元素后？是什么类型的失衡？
      - blockquote [ref=f12e1606]:
        - paragraph [ref=f12e1607]:
          - strong [ref=f12e1608]: 解
          - text: ：插入 20,10,30,25 后平衡。插入 5 后，20 的 BF=2（左子树高度 2，右子树高度 1），20 的左孩子 10 的 BF=1（左子树有 5，右子树为空），是 LL 型，对 20 做右旋。
      - paragraph [ref=f12e1609]:
        - strong [ref=f12e1610]: 例题 17
        - text: ：AVL 树中插入
        - code [ref=f12e1611]: "[50, 30, 70, 20, 40, 60, 80, 65]"
        - text: ，请指出旋转类型。
      - blockquote [ref=f12e1612]:
        - paragraph [ref=f12e1613]:
          - strong [ref=f12e1614]: 解
          - text: ：插入 65 后，70 的 BF=-2（左子树高度 1，右子树高度 2），属于 RL 型（右孩子的左子树插入），对 70 先右旋再左旋。
      - separator [ref=f12e1615]
      - heading "知识点 5：8 哈夫曼树（最优二叉树）——构造与 WPL 计算" [level=3] [ref=f12e1616]
      - paragraph [ref=f12e1617]:
        - strong [ref=f12e1618]: 核心概念
        - text: ：
      - list [ref=f12e1619]:
        - listitem [ref=f12e1620]:
          - strong [ref=f12e1621]: 带权路径长度 WPL
          - text: = 所有叶子节点的 权值 × 到根的路径长度（边数）之和
        - listitem [ref=f12e1622]:
          - strong [ref=f12e1623]: 哈夫曼树
          - text: ：给定 n 个权值，构造一棵二叉树使得 WPL 最小
      - paragraph [ref=f12e1624]:
        - strong [ref=f12e1625]: 哈夫曼树的构造步骤
        - text: （贪心算法）：
      - list [ref=f12e1626]:
        - listitem [ref=f12e1627]: 将 n 个权值分别作为只有根节点的 n 棵二叉树，放入森林 F
        - listitem [ref=f12e1628]:
          - text: 从 F 中选出
          - strong [ref=f12e1629]: 根权值最小
          - text: 的两棵二叉树，作为左右子树构造一棵新二叉树，新二叉树的根权值为两棵子树根权值之和
        - listitem [ref=f12e1630]: 从 F 中删除选出的两棵二叉树，将新构造的二叉树加入 F
        - listitem [ref=f12e1631]: 重复步骤 2-3，直到 F 中只剩一棵二叉树
      - paragraph [ref=f12e1632]:
        - strong [ref=f12e1633]: 例题 18
        - text: ：给定权值
        - code [ref=f12e1634]: "{2, 3, 5, 7, 9}"
        - text: ，构造哈夫曼树并计算 WPL。
      - blockquote [ref=f12e1635]:
        - paragraph [ref=f12e1636]:
          - strong [ref=f12e1637]: 构造过程
          - text: ：
        - list [ref=f12e1638]:
          - listitem [ref=f12e1639]: "初始：{2, 3, 5, 7, 9}"
          - listitem [ref=f12e1640]: "第 1 步：选 2 和 3，合并为 5（新节点），F = {5, 5, 7, 9}"
          - listitem [ref=f12e1641]: "第 2 步：选 5 和 5，合并为 10，F = {7, 9, 10}"
          - listitem [ref=f12e1642]: "第 3 步：选 7 和 9，合并为 16，F = {10, 16}"
          - listitem [ref=f12e1643]: "第 4 步：选 10 和 16，合并为 26，F = {26}"
        - paragraph [ref=f12e1644]:
          - strong [ref=f12e1645]: WPL 计算
          - text: ：2×3 + 3×3 + 5×2 + 7×2 + 9×2 = 6 + 9 + 10 + 14 + 18 =
          - strong [ref=f12e1646]: "57"
      - paragraph [ref=f12e1647]:
        - strong [ref=f12e1648]: 哈夫曼编码
        - text: ：
      - list [ref=f12e1649]:
        - listitem [ref=f12e1650]: 从根到叶子，左分支标 0，右分支标 1
        - listitem [ref=f12e1651]: 每个叶子的编码就是路径上标记的拼接
        - listitem [ref=f12e1652]:
          - strong [ref=f12e1653]: 前缀编码
          - text: ：任何一个字符的编码都不是另一个字符编码的前缀（这是哈夫曼编码可唯一解码的保证）
      - paragraph [ref=f12e1654]:
        - strong [ref=f12e1655]: 例题 19
        - text: "：字符 a,b,c,d,e 的权值分别为 {4, 5, 2, 7, 8}，求哈夫曼编码和 WPL。"
      - blockquote [ref=f12e1656]:
        - paragraph [ref=f12e1657]:
          - strong [ref=f12e1658]: 解
          - text: ：构造过程：合并 2+4→6，合并 5+6→11，合并 7+8→15，合并 11+15→26。WPL = 2×3 + 4×3 + 5×3 + 7×2 + 8×2 = 6+12+15+14+16 = 63。
      - separator [ref=f12e1659]
      - heading "知识点 5：9 堆——插入、删除、建堆过程详解" [level=3] [ref=f12e1660]
      - paragraph [ref=f12e1661]:
        - strong [ref=f12e1662]: 定义
        - text: ：堆是一种
        - strong [ref=f12e1663]: 完全二叉树
        - text: ，分为大顶堆和小顶堆。
      - table [ref=f12e1664]:
        - rowgroup [ref=f12e1665]:
          - row [ref=f12e1666]:
            - columnheader "堆类型" [ref=f12e1667]
            - columnheader "条件" [ref=f12e1668]
            - columnheader "特点" [ref=f12e1669]
        - rowgroup [ref=f12e1670]:
          - row [ref=f12e1671]:
            - cell [ref=f12e1672]:
              - strong [ref=f12e1673]: 大顶堆
            - cell "每个节点 ≥ 其子节点" [ref=f12e1674]
            - cell "根节点最大" [ref=f12e1675]
          - row [ref=f12e1676]:
            - cell [ref=f12e1677]:
              - strong [ref=f12e1678]: 小顶堆
            - cell "每个节点 ≤ 其子节点" [ref=f12e1679]
            - cell "根节点最小" [ref=f12e1680]
      - paragraph [ref=f12e1681]:
        - strong [ref=f12e1682]: 堆的存储
        - text: ：用数组存储（完全二叉树的性质 5），下标从 0 开始：
      - list [ref=f12e1683]:
        - listitem [ref=f12e1684]: 节点 i 的左孩子：2i+1
        - listitem [ref=f12e1685]: 节点 i 的右孩子：2i+2
        - listitem [ref=f12e1686]: 节点 i 的父节点：(i-1)/2（向下取整）
      - paragraph [ref=f12e1687]:
        - strong [ref=f12e1688]: （1）插入操作（上浮）
        - text: ：
      - code [ref=f12e1690]: 1. 将新元素放在数组末尾（堆的最后一个位置） 2. 比较新元素与父节点： - 大顶堆：如果新元素 > 父节点，交换，继续向上比较 - 小顶堆：如果新元素 < 父节点，交换，继续向上比较 3. 直到满足堆的条件或到达根节点
      - paragraph [ref=f12e1691]: 时间复杂度：O(log n)
      - paragraph [ref=f12e1692]:
        - strong [ref=f12e1693]: （2）删除堆顶（下沉）
        - text: ：
      - code [ref=f12e1695]: 1. 取出堆顶元素（最大值/最小值） 2. 将最后一个元素移到堆顶 3. 从堆顶开始向下调整（下沉）： - 大顶堆：与较大的子节点比较，如果小于子节点，交换，继续下沉 - 小顶堆：与较小的子节点比较，如果大于子节点，交换，继续下沉 4. 直到满足堆的条件或到达叶子
      - paragraph [ref=f12e1696]: 时间复杂度：O(log n)
      - paragraph [ref=f12e1697]:
        - strong [ref=f12e1698]: （3）建堆（Floyd 建堆法）
        - text: ：
      - code [ref=f12e1700]: 从最后一个非叶节点开始，向前遍历到根节点（下标从 n/2-1 到 0），对每个节点做下沉调整。
      - paragraph [ref=f12e1701]:
        - strong [ref=f12e1702]: 为什么最后一个非叶节点下标是 n/2-1
        - text: ：n 个节点的完全二叉树，最后一个节点的下标是 n-1，它的父节点下标是 (n-2)/2 = n/2 - 1。
      - paragraph [ref=f12e1703]:
        - strong [ref=f12e1704]: 建堆时间复杂度
        - text: ：O(n)（不是 O(n log n)！这是高频考点）。
      - paragraph [ref=f12e1705]:
        - strong [ref=f12e1706]: 例题 20
        - text: ：对序列
        - code [ref=f12e1707]: "[46, 79, 56, 38, 40, 84]"
        - text: 建立大顶堆。
      - blockquote [ref=f12e1708]:
        - paragraph [ref=f12e1709]:
          - strong [ref=f12e1710]: 解
          - text: ：n=6，最后一个非叶节点下标 = 6/2 - 1 = 2（值为 56）。
        - list [ref=f12e1711]:
          - listitem [ref=f12e1712]:
            - text: 调整节点 56（下标 2）：与 84 比较，56 < 84，交换 →
            - code [ref=f12e1713]: "[46, 79, 84, 38, 40, 56]"
          - listitem [ref=f12e1714]: 调整节点 79（下标 1）：79 > 38, 79 > 40，不调整
          - listitem [ref=f12e1715]:
            - text: 调整节点 46（下标 0）：与左孩子 79 比较，46 < 79，交换 →
            - code [ref=f12e1716]: "[79, 46, 84, 38, 40, 56]"
            - text: ；46 在位置 1，检查孩子 38 和 40，均小于 46，不交换；但此时 79 在位置 0 不满足堆条件（右孩子 84 > 79），79 继续与 84 交换 →
            - code [ref=f12e1717]: "[84, 46, 79, 38, 40, 56]"
            - text: ；79 在位置 2，检查左孩子 56 < 79，满足堆条件
          - listitem [ref=f12e1718]:
            - text: 最终大顶堆：
            - code [ref=f12e1719]: "[84, 46, 79, 38, 40, 56]"
      - paragraph [ref=f12e1720]:
        - strong [ref=f12e1721]: 例题 21
        - text: ：在例题 20 的大顶堆中，删除堆顶 84，写出调整后的堆。
      - blockquote [ref=f12e1722]:
        - paragraph [ref=f12e1723]:
          - strong [ref=f12e1724]: 解
          - text: ：56 移到堆顶 →
          - code [ref=f12e1725]: "[56, 46, 79, 38, 40]"
          - text: 。56 下沉：与 79 比较，56 < 79，交换 →
          - code [ref=f12e1726]: "[79, 46, 56, 38, 40]"
          - text: 。56 与 40 比较，56 > 40，停止。调整后：
          - code [ref=f12e1727]: "[79, 46, 56, 38, 40]"
          - text: 。
      - separator [ref=f12e1728]
      - heading "知识点 5：10 并查集（Disjoint Set Union）" [level=3] [ref=f12e1729]
      - paragraph [ref=f12e1730]:
        - strong [ref=f12e1731]: 用途
        - text: ：快速判断两个元素是否属于同一个集合，合并两个集合（朋友圈问题、图的连通分量判断）。
      - paragraph [ref=f12e1732]:
        - strong [ref=f12e1733]: 基本操作
        - text: ：
      - list [ref=f12e1734]:
        - listitem [ref=f12e1735]:
          - code [ref=f12e1736]: Find(x)
          - text: ：找到 x 所属集合的代表（根节点），可配合路径压缩优化
        - listitem [ref=f12e1737]:
          - code [ref=f12e1738]: Union(x, y)
          - text: ：把 x 和 y 所在集合合并（将一个集合的根指向另一个集合的根）
      - paragraph [ref=f12e1739]:
        - strong [ref=f12e1740]: 优化策略
        - text: ：
      - list [ref=f12e1741]:
        - listitem [ref=f12e1742]:
          - strong [ref=f12e1743]: 路径压缩
          - text: ：Find 时把沿途节点直接指向根，使后续查找接近 O(1)
        - listitem [ref=f12e1744]:
          - strong [ref=f12e1745]: 按秩合并
          - text: ：Union 时把矮树挂到高树下，避免树过高
      - blockquote [ref=f12e1746]:
        - paragraph [ref=f12e1747]:
          - strong [ref=f12e1748]: 考试重点
          - text: ：理解概念，知道适合用于等价关系判断、图中连通分量判断、Kruskal 算法中判环。
      - separator [ref=f12e1749]
      - paragraph [ref=f12e1750]:
        - strong [ref=f12e1751]: 自测题 7
        - text: ：已知二叉树前序为 ABCDEF，中序为 CBAEDF，画出二叉树，并写出后序序列。
      - blockquote [ref=f12e1752]:
        - paragraph [ref=f12e1753]:
          - strong [ref=f12e1754]: 答案
          - text: ：后序为 CBEFDA。（前序第一个 A 是根，在中序里找到 A，左边 CB 是左子树，右边 EDF 是右子树，递归确定结构）
      - paragraph [ref=f12e1755]:
        - strong [ref=f12e1756]: 自测题 8
        - text: ：往下面这个序列依次插入构建 BST：
        - code [ref=f12e1757]: "[50, 30, 20, 40, 70, 60, 80]"
        - text: ，插入 60 后它位于哪个位置？ A. 50 的左子树 B. 50 的右子树 C. 70 的左子树 D. 80 的左子树
      - blockquote [ref=f12e1758]:
        - paragraph [ref=f12e1759]:
          - strong [ref=f12e1760]: 答案
          - text: ：C。50→右到 70→左到 60。
      - paragraph [ref=f12e1761]:
        - strong [ref=f12e1762]: 自测题 8b
        - text: ：给定权值
        - code [ref=f12e1763]: "{2, 4, 5, 8}"
        - text: ，构造的哈夫曼树的 WPL 为： A. 35 B. 36 C. 37 D. 38
      - blockquote [ref=f12e1764]:
        - paragraph [ref=f12e1765]:
          - strong [ref=f12e1766]: 答案
          - text: "：B。构造过程：合并 2+4→6，F={5,6,8}；合并 5+6→11，F={8,11}；合并 8+11→19。树结构：8 深度 1，5 深度 2，2 和 4 深度 3。WPL = 8×1 + 5×2 + 2×3 + 4×3 = 8+10+6+12 = 36。"
      - paragraph [ref=f12e1767]:
        - strong [ref=f12e1768]: 自测题 8c
        - text: ：在 AVL 树中插入后导致 LL 失衡，需要的旋转操作是： A. 左旋一次 B. 右旋一次 C. 先左旋后右旋 D. 先右旋后左旋
      - blockquote [ref=f12e1769]:
        - paragraph [ref=f12e1770]:
          - strong [ref=f12e1771]: 答案
          - text: ：B。LL 型单次右旋即可。
      - heading "知识点 6：图" [level=2] [ref=f12e1772]
      - blockquote [ref=f12e1773]:
        - paragraph [ref=f12e1774]: ⭐⭐⭐必考 —— Dijkstra手工计算、Prim/Kruskal对比、拓扑排序是核心得分点
