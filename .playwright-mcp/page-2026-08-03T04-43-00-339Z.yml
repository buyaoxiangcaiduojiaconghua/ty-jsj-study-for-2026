      - separator [ref=f12e2039]
      - heading "知识点 6：5 最短路径——Dijkstra 和 Floyd 算法详解" [level=3] [ref=f12e2040]
      - paragraph [ref=f12e2041]:
        - strong [ref=f12e2042]: （1）Dijkstra 算法——单源最短路径
      - paragraph [ref=f12e2043]:
        - strong [ref=f12e2044]: 问题
        - text: ：从起点 v₀ 出发，求到图中所有其他顶点的最短路径。
        - strong [ref=f12e2045]: 不能有负权边
        - text: 。
      - paragraph [ref=f12e2046]:
        - strong [ref=f12e2047]: 算法思想
        - text: ：贪心策略。每次从"未确定最短距离"的顶点中选出距离最小的顶点，确定其最短距离，然后用它更新其他顶点的距离。
      - paragraph [ref=f12e2048]:
        - strong [ref=f12e2049]: 手工计算步骤
        - text: （以具体例子说明）：
      - code [ref=f12e2051]: "图：顶点 {A, B, C, D, E} A→B: 10, A→D: 5 B→C: 1, B→D: 2 C→E: 4 D→B: 3, D→C: 9, D→E: 2 E→A: 7, E→C: 6 求 A 到各顶点的最短路径。"
      - paragraph [ref=f12e2052]:
        - strong [ref=f12e2053]: Dijkstra 手工计算过程
        - text: ：
      - code [ref=f12e2055]: "初始：dist[A]=0, dist[B]=∞, dist[C]=∞, dist[D]=∞, dist[E]=∞ S = {}（已确定最短路径的顶点集合） 第 1 轮：选距离最小的顶点 A（dist=0），加入 S = {A} 用 A 更新邻居：dist[B]=min(∞, 0+10)=10, dist[D]=min(∞, 0+5)=5 当前 dist：A=0, B=10, C=∞, D=5, E=∞ 第 2 轮：选距离最小的顶点 D（dist=5），加入 S = {A, D} 用 D 更新邻居：dist[B]=min(10, 5+3)=8, dist[C]=min(∞, 5+9)=14, dist[E]=min(∞, 5+2)=7 当前 dist：A=0, B=8, C=14, D=5, E=7 第 3 轮：选距离最小的顶点 E（dist=7），加入 S = {A, D, E} 用 E 更新邻居：dist[C]=min(14, 7+6)=13 当前 dist：A=0, B=8, C=13, D=5, E=7 第 4 轮：选距离最小的顶点 B（dist=8），加入 S = {A, D, E, B} 用 B 更新邻居：dist[C]=min(13, 8+1)=9 当前 dist：A=0, B=8, C=9, D=5, E=7 第 5 轮：选距离最小的顶点 C（dist=9），加入 S = {A, D, E, B, C} 所有顶点已确定，算法结束。 最短路径结果：A→A:0, A→B:8 (A→D→B), A→C:9 (A→D→B→C), A→D:5, A→E:7 (A→D→E)"
      - paragraph [ref=f12e2056]:
        - strong [ref=f12e2057]: 时间复杂度
        - text: ：朴素实现 O(n²)，堆优化 O((n+e)log n)
        - strong [ref=f12e2058]: 关键约束
        - text: ：
        - strong [ref=f12e2059]: 不能处理负权边
        - text: （因为贪心策略假设已确定的最短距离不会再被更新，负权边会打破这个假设）
      - paragraph [ref=f12e2060]:
        - strong [ref=f12e2061]: （2）Floyd 算法——所有点对最短路径
      - paragraph [ref=f12e2062]:
        - strong [ref=f12e2063]: 问题
        - text: ：求图中任意两点之间的最短路径。
      - paragraph [ref=f12e2064]:
        - strong [ref=f12e2065]: 核心思想
        - text: ：动态规划，逐步考虑"允许经过哪些中间顶点"。
      - paragraph [ref=f12e2066]:
        - strong [ref=f12e2067]: 核心递推公式
        - text: ：
      - code [ref=f12e2069]: dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])
      - paragraph [ref=f12e2070]:
        - strong [ref=f12e2071]: 三重循环的含义
        - text: ：
      - code [ref=f12e2073]: "for k = 0 to n-1: // 第一层：考虑把顶点 k 作为中间顶点 for i = 0 to n-1: // 第二层：起点 i for j = 0 to n-1: // 第三层：终点 j dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j])"
      - paragraph [ref=f12e2074]:
        - strong [ref=f12e2075]: 关键理解
        - text: ：k 循环在最外层！这意味着"逐步放宽中间顶点的范围"。
      - list [ref=f12e2076]:
        - listitem [ref=f12e2077]: k=0 时：只允许经过顶点 0，更新 dist
        - listitem [ref=f12e2078]: k=1 时：在 k=0 基础上的 dist，继续考虑经过顶点 1
        - listitem [ref=f12e2079]: ...
        - listitem [ref=f12e2080]: k=n-1 时：所有顶点都可以作为中间顶点，dist 就是最终的最短路径
      - paragraph [ref=f12e2081]:
        - strong [ref=f12e2082]: 特点
        - text: ：
      - list [ref=f12e2083]:
        - listitem [ref=f12e2084]: 时间复杂度：O(n³)
        - listitem [ref=f12e2085]: 可以处理负权边（但不能有负权回路）
        - listitem [ref=f12e2086]: 用邻接矩阵存储
        - listitem [ref=f12e2087]: 可以同时求出每对顶点之间经过哪些中间顶点（用 path 矩阵记录）
      - paragraph [ref=f12e2088]:
        - strong [ref=f12e2089]: （3）Dijkstra vs Floyd 对比
