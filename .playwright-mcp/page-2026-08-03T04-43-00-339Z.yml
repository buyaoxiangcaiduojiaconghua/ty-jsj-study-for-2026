      - heading "三、易错陷阱（13条）" [level=3] [ref=f12e4141]
      - paragraph [ref=f12e4142]:
        - strong [ref=f12e4143]: 陷阱 1："选择排序是最稳定的排序算法"
      - paragraph [ref=f12e4144]:
        - text: "\"选择排序的表现最稳定，无论什么数据都是 O(n²)\"——这句话里的\"稳定\"指的是"
        - strong [ref=f12e4145]: 时间复杂度稳定
        - text: ，不是
        - strong [ref=f12e4146]: 排序稳定性
        - text: 。选择排序是
        - strong [ref=f12e4147]: 不稳定
        - text: 的排序算法！比如
        - code [ref=f12e4148]: "[5, 5, 2]"
        - text: ，第一次选最小 2 与第一个 5 交换，两个 5 的相对顺序就变了。
      - paragraph [ref=f12e4149]:
        - strong [ref=f12e4150]: 陷阱 2：建堆的时间复杂度是 O(n) 不是 O(n log n)
      - paragraph [ref=f12e4151]: 很多人直觉认为建堆（一个个插入）是 O(n log n)。但实际上，Floyd 建堆法（从最后一个非叶节点向前逐个下沉）的时间复杂度是 O(n)。国网考试非常喜欢考这个区别。
      - paragraph [ref=f12e4152]:
        - strong [ref=f12e4153]: 陷阱 3：快速排序在"已经有序"时最慢，不是最快
      - paragraph [ref=f12e4154]:
        - text: 这是最常见的反直觉陷阱。快速排序在数据
        - strong [ref=f12e4155]: 随机分布
        - text: 时快（O(n log n)），在数据
        - strong [ref=f12e4156]: 已经有序
        - text: 时反而退化到 O(n²)。原因是每次 pivot 选到最小值或最大值，分区极不平衡。优化方法：随机选 pivot、三数取中法。
      - paragraph [ref=f12e4157]:
        - strong [ref=f12e4158]: 陷阱 4：归并排序空间复杂度 O(n)，不是 O(1)
      - paragraph [ref=f12e4159]: 归并排序在合并时需要临时数组存放结果，所以空间复杂度是 O(n)。很多人把它和快排（O(log n) 递归栈）、堆排（O(1)）搞混。考试中常考"哪种排序算法需要额外 O(n) 空间"。
      - paragraph [ref=f12e4160]:
        - strong [ref=f12e4161]: 陷阱 5：哈希表的"删除"在开放定址法中不能直接删
      - paragraph [ref=f12e4162]: 用开放定址法（线性探测、平方探测）解决冲突的哈希表，删除一个元素时不能直接置空。因为如果直接置空，后续查找时探测到这个空位就会误以为查找失败。正确做法是标记为"已删除"（惰性删除）。而拉链法的删除可以直接删。
      - paragraph [ref=f12e4163]:
        - strong [ref=f12e4164]: 陷阱 6：前序+后序不能唯一确定二叉树
      - paragraph [ref=f12e4165]:
        - text: 已知前序和中序、或后序和中序，可以唯一确定二叉树。但
        - strong [ref=f12e4166]: 前序+后序不能唯一确定
        - text: ！因为无法区分某个节点是左孩子还是右孩子。例如一棵二叉树只有根和左孩子，另一棵只有根和右孩子，它们的前序和后序序列完全相同。
      - paragraph [ref=f12e4167]:
        - strong [ref=f12e4168]: 陷阱 7：数组下标从 0 还是从 1 开始？
      - paragraph [ref=f12e4169]:
        - text: 行优先地址公式
        - code [ref=f12e4170]: LOC(a[i][j]) = LOC + (i×n+j)×L
        - text: 默认下标从 0 开始。如果题目说"下标从 1 开始"，公式变成
        - code [ref=f12e4171]: LOC + ((i-1)×n+(j-1))×L
        - text: 。一定要看清题意！
      - paragraph [ref=f12e4172]:
        - strong [ref=f12e4173]: 陷阱 8：对称矩阵压缩存储时，上三角元素要转换
      - paragraph [ref=f12e4174]:
        - text: 对于对称矩阵，上三角元素 a[i][j]（i<j）不能用下三角公式直接套，必须先用对称性换成 a[j][i] 再套
        - code [ref=f12e4175]: k = j(j-1)/2 + i - 1
        - text: 。
      - paragraph [ref=f12e4176]:
        - strong [ref=f12e4177]: 陷阱 9：KMP 算法 next 数组下标从 0 还是从 1 开始？
      - paragraph [ref=f12e4178]: 不同教材不一样。严蔚敏版下标从 1 开始（next[1]=0），天勤/王道版下标从 0 开始（next[0]=-1）。国网考试以王道为准（下标从 0 开始）。next[j] 看的是"j 之前的子串"，不包含 j 本身。
      - paragraph [ref=f12e4179]:
        - strong [ref=f12e4180]: 陷阱 10：广义表的 Tail 永远返回广义表
      - paragraph [ref=f12e4181]: Tail 运算的结果一定是广义表（带括号）。例如 Tail((a, b)) = (b)，不是 b。Tail((a)) = ()，不是 a。这是最容易错的地方。
      - paragraph [ref=f12e4182]:
        - strong [ref=f12e4183]: 陷阱 11：AVL 旋转方向判断
      - paragraph [ref=f12e4184]:
        - text: LL 型是"左子树的左边插入"，
        - strong [ref=f12e4185]: 右旋
        - text: 一次即可。很多人看到"左"就想左旋，这是错的。口诀：两个字母时，旋转方向跟第二个字母相反——LL 右旋，RR 左旋。
      - paragraph [ref=f12e4186]:
        - strong [ref=f12e4187]: 陷阱 12：Floyd 算法 k 循环必须在最外层
      - paragraph [ref=f12e4188]: 三重循环的顺序必须是 k-i-j，不能是 i-j-k 或 i-k-j。k 在最外层表示"逐步放宽中间顶点范围"，顺序错了结果不对。这是考试中常考的概念题。
      - paragraph [ref=f12e4189]:
        - strong [ref=f12e4190]: 陷阱 13：关键路径的 ve 和 vl 计算
      - paragraph [ref=f12e4191]:
        - text: ve 正向计算取
        - strong [ref=f12e4192]: 最大值
        - text: （因为要等所有前驱都完成），vl 反向计算取
        - strong [ref=f12e4193]: 最小值
        - text: （因为要让所有后继都来得及）。很多人把 ve 取 min、vl 取 max，方向刚好反了。记住：
        - strong [ref=f12e4194]: "\"ve 正向取最大，vl 反向取最小\""
        - text: 。
