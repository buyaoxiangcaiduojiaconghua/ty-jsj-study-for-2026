      - paragraph [ref=f12e4278]:
        - strong [ref=f12e4279]: 稳定性口诀
        - text: ：
        - strong [ref=f12e4280]: "\"不稳快堆希，选来也不稳\""
        - text: —— 不稳定的是：
        - strong [ref=f12e4281]: 快
        - text: 速排序、
        - strong [ref=f12e4282]: 堆
        - text: 排序、
        - strong [ref=f12e4283]: 希
        - text: 尔排序、
        - strong [ref=f12e4284]: 选
        - text: 择排序。其余（冒泡、插入、归并、基数）均为稳定。
      - separator [ref=f12e4285]
      - heading "五、考前速记清单" [level=3] [ref=f12e4286]
      - list [ref=f12e4287]:
        - listitem [ref=f12e4288]:
          - strong [ref=f12e4289]: 二叉树叶子数
          - text: ：n₀ = n₂ + 1（任何时候都成立，数学归纳法证明）
        - listitem [ref=f12e4290]:
          - strong [ref=f12e4291]: 二叉树第 k 层最多 2^(k-1) 个节点
          - text: ，深度 h 最多 2^h - 1 个节点
        - listitem [ref=f12e4292]:
          - strong [ref=f12e4293]: 完全二叉树深度
          - text: ：⌊log₂n⌋ + 1
        - listitem [ref=f12e4294]:
          - strong [ref=f12e4295]: 有序序列 BST 插入
          - text: ：退化成单链表，深度为 n，查找 O(n)
        - listitem [ref=f12e4296]:
          - strong [ref=f12e4297]: AVL 平衡因子
          - text: ：只允许 -1 / 0 / 1，绝对值超过 1 就要旋转
        - listitem [ref=f12e4298]:
          - strong [ref=f12e4299]: AVL 旋转口诀
          - text: ：LL 右旋，RR 左旋，LR 左右旋，RL 右左旋
        - listitem [ref=f12e4300]:
          - strong [ref=f12e4301]: 哈夫曼树
          - text: ：带权路径最短，前缀编码，每次合并最小两个权值
        - listitem [ref=f12e4302]:
          - strong [ref=f12e4303]: WPL
          - text: = 所有叶子的权值 × 路径长度之和
        - listitem [ref=f12e4304]:
          - strong [ref=f12e4305]: 堆的插入
          - text: ：末尾插入→上浮 O(log n)；
          - strong [ref=f12e4306]: 删除
          - text: ：堆顶换末尾→下沉 O(log n)；
          - strong [ref=f12e4307]: 建堆
          - text: ：Floyd 法 O(n)
        - listitem [ref=f12e4308]:
          - strong [ref=f12e4309]: B+ 树适合数据库索引
          - text: ：叶子链表串起来，支持范围查询
        - listitem [ref=f12e4310]:
          - strong [ref=f12e4311]: 哈希表 p 取质数
          - text: ：除留余数法中 p 取不大于表长的最大质数，减少冲突
        - listitem [ref=f12e4312]:
          - strong [ref=f12e4313]: Prim 加点 O(n²)
          - text: ：适合稠密图；
          - strong [ref=f12e4314]: Kruskal 加边 O(e log e)
          - text: ：适合稀疏图
        - listitem [ref=f12e4315]:
          - strong [ref=f12e4316]: Dijkstra 不能处理负权边
          - text: ：贪心策略假设已确定顶点不会再被更新
        - listitem [ref=f12e4317]:
          - strong [ref=f12e4318]: Floyd 三重循环顺序
          - text: ：k-i-j，k 必须在最外层
        - listitem [ref=f12e4319]:
          - strong [ref=f12e4320]: 拓扑排序
          - text: ：每次选入度为 0 的顶点，输出数 < n 则有环
        - listitem [ref=f12e4321]:
          - strong [ref=f12e4322]: 关键路径 ve 和 vl
          - text: ：ve 正向取最大，vl 反向取最小，e==l 是关键活动
        - listitem [ref=f12e4323]:
          - strong [ref=f12e4324]: 数组地址公式
          - text: ：行优先 i×n+j，列优先 j×m+i（下标从 0 开始）
        - listitem [ref=f12e4325]:
          - strong [ref=f12e4326]: 对称矩阵压缩
          - text: ：下三角 k=i(i-1)/2+j-1，上三角对调 ij
        - listitem [ref=f12e4327]:
          - strong [ref=f12e4328]: 三对角矩阵
          - text: ：k = 2i + j - 3
        - listitem [ref=f12e4329]:
          - strong [ref=f12e4330]: KMP next 数组
          - text: ：看前不看后，最长相等前后缀；next[0] = -1
        - listitem [ref=f12e4331]:
          - strong [ref=f12e4332]: 广义表 Tail
          - text: ：永远返回广义表，即使只有一个元素也要加括号
        - listitem [ref=f12e4333]:
          - strong [ref=f12e4334]: 比较类排序下界
          - text: ：O(n log n)，计数/桶/基数可以突破到 O(n)
        - listitem [ref=f12e4335]:
          - strong [ref=f12e4336]: 分治三步骤
          - text: ：分解→解决→合并；
          - strong [ref=f12e4337]: DP 两要素
          - text: ：最优子结构+重叠子问题
      - separator [ref=f12e4338]
      - heading "六、二叉树遍历重建（前序+中序→后序）万能解题模板" [level=3] [ref=f12e4339]
      - heading "解题模板" [level=4] [ref=f12e4340]
      - paragraph [ref=f12e4341]:
        - strong [ref=f12e4342]: 第1步：从前序找根。
        - text: 前序遍历的第一个节点就是整棵树的根节点。
      - paragraph [ref=f12e4343]:
        - strong [ref=f12e4344]: 第2步：在中序中切分左右子树。
        - text: 在中序遍历中找到根节点，根左边全是左子树节点，根右边全是右子树节点。
      - paragraph [ref=f12e4345]:
        - strong [ref=f12e4346]: 第3步：递归重复。
        - text: 对左子树部分和右子树部分，分别重复第1步和第2步，直到把所有节点都确定位置。
      - heading "真题 12（基础难度）" [level=4] [ref=f12e4347]
      - paragraph [ref=f12e4348]:
        - strong [ref=f12e4349]: "[题目]"
        - text: 已知一棵二叉树的前序遍历序列为 ABDEGCFH，中序遍历序列为 DBGEACHF，则该二叉树的后序遍历序列是（ ）。
      - paragraph [ref=f12e4350]:
        - strong [ref=f12e4351]: "[选项]"
        - text: A. DGEBHFCA B. GEDBHFCA C. ABCDEFGH D. DGEBFHCA
      - paragraph [ref=f12e4352]:
        - strong [ref=f12e4353]: "[答案]"
        - text: A
      - paragraph [ref=f12e4354]:
        - strong [ref=f12e4355]: "[解析]"
      - list [ref=f12e4356]:
        - listitem [ref=f12e4357]: "前序第一个是 A，A 是根；中序中 A 左边 {D,B,G,E} 是左子树，右边 {C,H,F} 是右子树。"
        - listitem [ref=f12e4358]: "左子树（前序 BDEG，中序 DBGE）：前序第一个 B 是左子树的根；中序中 B 左边 {D} 是左，右边 {G,E} 是右。D 是叶子。右子树 {G,E} 的前序是 EG，中序是 GE，所以 E 是根，G 是左孩子。"
        - listitem [ref=f12e4359]: "右子树（前序 CFH，中序 CHF）：前序第一个 C 是根；中序中 C 左边为空，右边 {H,F} 是右子树。{H,F} 前序 FH，中序 HF，所以 F 是根，H 是左孩子。"
        - listitem [ref=f12e4360]: 得到后序：D G E B H F C A，即 DGEBHFCA。
      - heading "真题 13（进阶难度）" [level=4] [ref=f12e4361]
      - paragraph [ref=f12e4362]:
        - strong [ref=f12e4363]: "[题目]"
        - text: 已知一棵二叉树的前序遍历序列为 ABCDEFGHI，中序遍历序列为 BCAEDGHFI，则该二叉树的后序遍历序列是（ ）。
      - paragraph [ref=f12e4364]:
        - strong [ref=f12e4365]: "[选项]"
        - text: A. CBEHGIFDA B. CBEHGFIDA C. CBEHIGFDA D. CBEHGFDAI
      - paragraph [ref=f12e4366]:
        - strong [ref=f12e4367]: "[答案]"
        - text: B
      - paragraph [ref=f12e4368]:
        - strong [ref=f12e4369]: "[解析]"
      - list [ref=f12e4370]:
        - listitem [ref=f12e4371]: "前序第一个 A 是根；中序中 A 左边 {B,C} 是左子树，右边 {E,D,G,H,F,I} 是右子树。"
        - listitem [ref=f12e4372]: 左子树（前序 BC，中序 BC）：B 是根，C 是右孩子（中序中 B 左边为空，C 在 B 右边）。
        - listitem [ref=f12e4373]: "右子树（前序 DEFGHI，中序 EDGHFI）：D 是根；中序中 D 左边 {E} 是左子树，右边 {G,H,F,I} 是右子树。E 是叶子。"
        - listitem [ref=f12e4374]: "右子树的右子树（前序 FGHI，中序 GHFI）：F 是根；中序中 F 左边 {G,H} 是左子树，右边 {I} 是右子树。I 是叶子。"
        - listitem [ref=f12e4375]: "{G,H}（前序 GH，中序 GH）：G 是根，H 是右孩子。"
        - listitem [ref=f12e4376]: 后序：C B E H G I F D A，即 CBEHGFIDA。
      - separator [ref=f12e4377]
      - heading "七、哈夫曼树 WPL 计算的完整步骤模板" [level=3] [ref=f12e4378]
      - heading "解题模板" [level=4] [ref=f12e4379]
      - paragraph [ref=f12e4380]:
        - strong [ref=f12e4381]: 第1步：排序。
        - text: 把所有权值从小到大排序。
      - paragraph [ref=f12e4382]:
        - strong [ref=f12e4383]: 第2步：选最小的两个合并。
        - text: 每次选取当前最小的两个权值，合并成一个新节点（新节点权值 = 两个权值之和），放回集合中。
      - paragraph [ref=f12e4384]:
        - strong [ref=f12e4385]: 第3步：重复直到只剩一个节点。
        - text: 每次合并时，将新节点的权值累加到 WPL 中（或者最后用公式：WPL = 所有叶子节点的权值 x 该叶子到根的路径长度 之和）。
      - paragraph [ref=f12e4386]:
        - strong [ref=f12e4387]: 快速公式：WPL = 所有非叶子节点（内部节点）的权值之和。
      - heading "真题 14（基础难度）" [level=4] [ref=f12e4388]
      - paragraph [ref=f12e4389]:
        - strong [ref=f12e4390]: "[题目]"
        - text: "给定权值集合 {2, 3, 4, 7, 8, 9}，构造哈夫曼树，则该哈夫曼树的带权路径长度 WPL 为（ ）。"
      - paragraph [ref=f12e4391]:
        - strong [ref=f12e4392]: "[选项]"
        - text: A. 80 B. 81 C. 82 D. 83
      - paragraph [ref=f12e4393]:
        - strong [ref=f12e4394]: "[答案]"
        - text: A
      - paragraph [ref=f12e4395]:
        - strong [ref=f12e4396]: "[解析]"
        - text: 建树过程：2+3=5，4+5=9，7+8=15，9+9=18，15+18=33。 内部节点权值和 = 5+9+15+18+33 = 80。 或者叶子路径法：2x4+3x4+4x3+7x2+8x2+9x2 = 8+12+12+14+16+18 = 80。
      - heading "真题 15（进阶难度）" [level=4] [ref=f12e4397]
      - paragraph [ref=f12e4398]:
        - strong [ref=f12e4399]: "[题目]"
        - text: "给定权值集合 {3, 5, 6, 9, 11, 14}，构造哈夫曼树，则 WPL 为（ ），权值为 14 的叶子节点在树中的深度（根深度为 0）为（ ）。"
      - paragraph [ref=f12e4400]:
        - strong [ref=f12e4401]: "[选项]"
        - text: A. WPL=118, 深度=2 B. WPL=120, 深度=1 C. WPL=118, 深度=1 D. WPL=116, 深度=2
      - paragraph [ref=f12e4402]:
        - strong [ref=f12e4403]: "[答案]"
        - text: A
      - paragraph [ref=f12e4404]:
        - strong [ref=f12e4405]: "[解析]"
      - list [ref=f12e4406]:
        - listitem [ref=f12e4407]: 建树过程：3+5=8 -> 6+8=14 -> 9+11=20 -> 14+14=28 -> 20+28=48
        - listitem [ref=f12e4408]: 内部节点：8, 14, 20, 28, 48，WPL = 8+14+20+28+48 = 118
        - listitem [ref=f12e4409]: 树结构：根48，左20(9,11)，右28(内部14(6,8(3,5)), 叶子14)。叶子14的深度=2（根->右->右）。
        - listitem [ref=f12e4410]: 验证叶子路径：3x4+5x4+6x3+9x2+11x2+14x2 = 12+20+18+18+22+28 = 118。选 A。
      - separator [ref=f12e4411]
      - heading "八、归并排序 vs 快速排序对比表格" [level=3] [ref=f12e4412]
      - table [ref=f12e4413]:
        - rowgroup [ref=f12e4414]:
          - row [ref=f12e4415]:
            - columnheader "对比维度" [ref=f12e4416]
            - columnheader "归并排序" [ref=f12e4417]
            - columnheader "快速排序" [ref=f12e4418]
        - rowgroup [ref=f12e4419]:
          - row [ref=f12e4420]:
            - cell "分治策略" [ref=f12e4421]
            - cell [ref=f12e4422]:
              - text: 先递归分解，再合并（
              - strong [ref=f12e4423]: 自底向上
              - text: ）
            - cell [ref=f12e4424]:
              - text: 先划分，再递归（
              - strong [ref=f12e4425]: 自顶向下
              - text: ）
          - row [ref=f12e4426]:
            - cell "时间复杂度-最好" [ref=f12e4427]
            - cell "O(n log n)" [ref=f12e4428]
            - cell "O(n log n)" [ref=f12e4429]
          - row [ref=f12e4430]:
            - cell "时间复杂度-平均" [ref=f12e4431]
            - cell [ref=f12e4432]:
              - strong [ref=f12e4433]: O(n log n)
            - cell [ref=f12e4434]:
              - strong [ref=f12e4435]: O(n log n)
          - row [ref=f12e4436]:
            - cell "时间复杂度-最坏" [ref=f12e4437]
            - cell "O(n log n)" [ref=f12e4438]
