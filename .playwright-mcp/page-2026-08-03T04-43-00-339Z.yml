      - heading "知识点 6：2 图的存储结构——邻接矩阵与邻接表详细对比" [level=3] [ref=f12e1828]
      - paragraph [ref=f12e1829]:
        - strong [ref=f12e1830]: （1）邻接矩阵
      - paragraph [ref=f12e1831]:
        - text: 用一个 n×n 的二维数组
        - code [ref=f12e1832]: edge[n][n]
        - text: 存储：
      - list [ref=f12e1833]:
        - listitem [ref=f12e1834]:
          - text: 无权图：
          - code [ref=f12e1835]: edge[i][j] = 1
          - text: 表示有边，
          - code [ref=f12e1836]: "0"
          - text: 表示无边
        - listitem [ref=f12e1837]:
          - text: 带权图（网）：
          - code [ref=f12e1838]: edge[i][j] = 权值
          - text: 表示有边，
          - code [ref=f12e1839]: ∞
          - text: 表示无边（对角线为 0）
      - code [ref=f12e1841]: 无向图邻接矩阵示例（A-B, B-C, A-C）： A B C A [ 0 1 1 ] B [ 1 0 1 ] C [ 1 1 0 ] 特点：无向图的邻接矩阵是对称矩阵（关于主对角线对称）
      - paragraph [ref=f12e1842]:
        - strong [ref=f12e1843]: 优缺点
        - text: ：
      - list [ref=f12e1844]:
        - listitem [ref=f12e1845]: 优点：判断 i, j 是否相邻 O(1)；方便计算度（行/列求和）
        - listitem [ref=f12e1846]: 缺点：空间 O(n²)，即使只有几条边也要 n² 空间；找所有邻居需要遍历一整行 O(n)
      - paragraph [ref=f12e1847]:
        - strong [ref=f12e1848]: （2）邻接表
      - paragraph [ref=f12e1849]: 每个顶点维护一个链表（或数组），存储它的所有邻居。
      - code [ref=f12e1851]: 同一个图的邻接表示例： A → [B, C] B → [A, C] C → [A, B] 带权图：链表中每个节点存储 (邻居, 权值) A → [(B, 5), (C, 3)]
      - paragraph [ref=f12e1852]:
        - strong [ref=f12e1853]: 优缺点
        - text: ：
      - list [ref=f12e1854]:
        - listitem [ref=f12e1855]: 优点：空间 O(n+e)，稀疏图省空间；找所有邻居快 O(deg)
        - listitem [ref=f12e1856]: 缺点：判断 i, j 是否相邻需要遍历链表 O(deg)；有向图计算入度需要遍历所有链表
      - paragraph [ref=f12e1857]:
        - strong [ref=f12e1858]: （3）邻接矩阵 vs 邻接表——终极对比
      - table [ref=f12e1859]:
        - rowgroup [ref=f12e1860]:
          - row [ref=f12e1861]:
            - columnheader "对比维度" [ref=f12e1862]
            - columnheader "邻接矩阵" [ref=f12e1863]
            - columnheader "邻接表" [ref=f12e1864]
        - rowgroup [ref=f12e1865]:
          - row [ref=f12e1866]:
            - cell "空间复杂度" [ref=f12e1867]
            - cell "O(n²)" [ref=f12e1868]
            - cell "O(n+e)" [ref=f12e1869]
