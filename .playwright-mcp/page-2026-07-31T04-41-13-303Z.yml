      - blockquote [ref=e4895]:
        - paragraph [ref=e4896]:
          - strong [ref=e4897]: 注意
          - text: ：前导码（8 字节）和帧间隙（12 字节）不计入帧长，帧长通常从目的 MAC 地址算到 FCS 尾。
      - separator [ref=e4898]
      - heading "5.5 协议栈（Protocol Stack）概念" [level=3] [ref=e4899]
      - paragraph [ref=e4900]:
        - strong [ref=e4901]: 协议栈
        - text: 就是把各层协议像搭积木一样堆叠起来，每一层使用下层提供的服务，同时向上层提供服务。
      - code [ref=e4903]: ┌──────────────────────────────────┐ │ HTTP │ FTP │ DNS │ SMTP │ ← 应用层协议栈 ├──────────────────────────────────┤ │ TCP │ UDP │ ← 传输层协议栈 ├──────────────────────────────────┤ │ IP │ ← 网络层（网际层） ├──────────────────────────────────┤ │ 以太网 │ WiFi │ PPP │ ← 数据链路层 + 物理层 └──────────────────────────────────┘
      - paragraph [ref=e4904]:
        - strong [ref=e4905]: 协议栈的核心特点：
      - list [ref=e4906]:
        - listitem [ref=e4907]:
          - text: 各层协议可以
          - strong [ref=e4908]: 独立替换
          - text: 。比如把 HTTP 替换成 HTTPS，下层 TCP/IP 完全不用改
        - listitem [ref=e4909]:
          - text: 下层为上层提供
          - strong [ref=e4910]: 服务
          - text: ，上层调用下层的服务接口
        - listitem [ref=e4911]:
          - text: 同层之间通过
          - strong [ref=e4912]: 协议
          - text: 通信（对等通信），实际上数据要经过下层传输
        - listitem [ref=e4913]:
          - text: 两个通信实体之间必须运行
          - strong [ref=e4914]: 相同的协议栈
      - separator [ref=e4915]
      - heading "核心性能指标" [level=3] [ref=e4916]
      - table [ref=e4917]:
        - rowgroup [ref=e4918]:
          - row [ref=e4919]:
            - columnheader "指标" [ref=e4920]
            - columnheader "含义" [ref=e4921]
            - columnheader "单位" [ref=e4922]
            - columnheader "备注" [ref=e4923]
        - rowgroup [ref=e4924]:
          - row [ref=e4925]:
            - cell "带宽" [ref=e4926]
            - cell "最大数据率（理论上限）" [ref=e4927]
            - cell "bps" [ref=e4928]
            - cell "\"水管粗细\"" [ref=e4929]
          - row [ref=e4930]:
            - cell "时延" [ref=e4931]
            - cell "发送+传播+处理+排队" [ref=e4932]
            - cell "秒" [ref=e4933]
            - cell "四个部分的和" [ref=e4934]
          - row [ref=e4935]:
            - cell "吞吐量" [ref=e4936]
            - cell "实际传输量" [ref=e4937]
            - cell "bps" [ref=e4938]
            - cell "≤带宽，受各种因素影响" [ref=e4939]
          - row [ref=e4940]:
            - cell "时延带宽积" [ref=e4941]
            - cell "管道能容纳多少 bit" [ref=e4942]
            - cell "比特" [ref=e4943]
            - cell "= 时延 × 带宽" [ref=e4944]
          - row [ref=e4945]:
            - cell "RTT" [ref=e4946]
            - cell "发送到收到确认的往返时间" [ref=e4947]
            - cell "秒" [ref=e4948]
            - cell "Round-Trip Time" [ref=e4949]
      - blockquote [ref=e4950]:
        - paragraph [ref=e4951]:
          - strong [ref=e4952]: 发送时延
          - text: = 数据长度 / 发送速率（自己控制）
          - strong [ref=e4953]: 传播时延
          - text: = 距离 / 传播速度（物理限制，光纤中约 2×10⁸ m/s）
          - strong [ref=e4954]: 处理时延
          - text: +
          - strong [ref=e4955]: 排队时延
          - text: = 路由器处理时间
      - paragraph [ref=e4956]:
        - strong [ref=e4957]: 时延带宽积
        - text: 的理解：相当于"管道里正在路上的数据量"。一条时延 20ms、带宽 100Mbps 的链路，时延带宽积 = 0.02 × 100×10⁶ = 2×10⁶ bit，意味着发送方发了 2M 数据后第一个 bit 才到接收方。
      - heading "时延计算例题" [level=4] [ref=e4958]
      - paragraph [ref=e4959]:
        - strong [ref=e4960]: 核心公式：总时延 = 发送时延 + 传播时延 + 处理时延 + 排队时延
      - paragraph [ref=e4961]: 其中：
      - list [ref=e4962]:
        - listitem [ref=e4963]: 发送时延 = 数据长度 / 发送速率
        - listitem [ref=e4964]: 传播时延 = 信道长度 / 电磁波传播速率
        - listitem [ref=e4965]: 处理时延：路由器分析数据包头部的时间，通常很小
        - listitem [ref=e4966]: 排队时延：数据包在路由器缓存队列中等待的时间，网络拥塞时可能很大
      - paragraph [ref=e4967]:
        - strong [ref=e4968]: 例题 1：发送时延计算
      - paragraph [ref=e4969]: 一台主机要通过一条带宽为 100Mbps 的链路发送一个 10MB 的文件，忽略其他时延，求发送时延。
      - paragraph [ref=e4970]:
        - strong [ref=e4971]: 解：
      - code [ref=e4973]: 发送时延 = 数据长度 / 发送速率 = (10 × 10^6 × 8) bit / (100 × 10^6) bps = 80 × 10^6 / 100 × 10^6 = 0.8 秒
      - blockquote [ref=e4974]:
        - paragraph [ref=e4975]: 注意：10MB = 10 × 10^6 字节 = 80 × 10^6 bit。考试中字节到比特的换算（×8）经常被漏掉！
      - paragraph [ref=e4976]:
        - strong [ref=e4977]: 例题 2：传播时延计算
      - paragraph [ref=e4978]: 光纤长度为 2000km，电磁波在光纤中的传播速率约为 2×10⁸ m/s，求传播时延。
      - paragraph [ref=e4979]:
        - strong [ref=e4980]: 解：
      - code [ref=e4982]: 传播时延 = 距离 / 传播速率 = 2000 × 10^3 m / (2 × 10^8 m/s) = 2 × 10^6 / 2 × 10^8 = 0.01 秒 = 10 ms
      - paragraph [ref=e4983]:
        - strong [ref=e4984]: 例题 3：总时延综合计算
      - paragraph [ref=e4985]: 主机 A 与主机 B 之间有一条 1000km 的光纤链路，带宽为 10Mbps，传播速率为 2×10⁸ m/s。A 向 B 发送一个 1MB 的文件，忽略处理时延和排队时延，求总时延。
      - paragraph [ref=e4986]:
        - strong [ref=e4987]: 解：
      - code [ref=e4989]: 步骤 1：计算发送时延 发送时延 = (1 × 10^6 × 8) / (10 × 10^6) = 8 × 10^6 / 10 × 10^6 = 0.8 秒 步骤 2：计算传播时延 传播时延 = (1000 × 10^3) / (2 × 10^8) = 10^6 / (2 × 10^8) = 0.005 秒 = 5 ms 步骤 3：总时延 总时延 = 发送时延 + 传播时延 = 0.8 + 0.005 = 0.805 秒
      - blockquote [ref=e4990]:
        - paragraph [ref=e4991]: 思考：哪种场景下发送时延是主导？哪种场景下传播时延是主导？
        - list [ref=e4992]:
          - listitem [ref=e4993]: 发送大文件、低带宽时 → 发送时延主导
          - listitem [ref=e4994]: 远距离（如卫星通信）、高带宽时 → 传播时延主导
      - heading "时延带宽积计算例题" [level=4] [ref=e4995]
      - paragraph [ref=e4996]:
        - strong [ref=e4997]: 例题
        - text: ：一条链路的传播时延为 30ms，带宽为 1Gbps，求时延带宽积。
      - paragraph [ref=e4998]:
        - strong [ref=e4999]: 解：
      - code [ref=e5001]: 时延带宽积 = 传播时延 × 带宽 = 30 × 10^(-3) × 1 × 10^9 = 30 × 10^6 bit = 30 Mbit
      - blockquote [ref=e5002]:
        - paragraph [ref=e5003]: 这意味着：发送方发出 30Mbit 数据后，第一个 bit 才到达接收方。这 30Mbit 就是"正在管道里飞的数据"。
      - heading "利用率（Utilization）" [level=4] [ref=e5004]
      - paragraph [ref=e5005]:
        - strong [ref=e5006]: 利用率 U
        - text: 表示信道被使用的程度。
      - list [ref=e5007]:
        - listitem [ref=e5008]:
          - strong [ref=e5009]: U = 0
          - text: ：信道完全空闲
        - listitem [ref=e5010]:
          - strong [ref=e5011]: U = 1
          - text: ：信道完全饱和（100% 利用）
        - listitem [ref=e5012]: 当 U 接近 1 时，时延急剧增大！
      - paragraph [ref=e5013]:
        - strong [ref=e5014]: 公式关系：
      - code [ref=e5016]: D0 = 信道空闲时的时延 D = 信道利用率为 U 时的实际时延 D = D0 / (1 - U)
      - paragraph [ref=e5017]:
        - strong [ref=e5018]: 直观理解
        - text: ：
      - list [ref=e5019]:
        - listitem [ref=e5020]: 当 U = 0.5（50% 利用率），D = D0 / 0.5 = 2D0，时延翻倍
        - listitem [ref=e5021]: 当 U = 0.9（90% 利用率），D = D0 / 0.1 = 10D0，时延变成 10 倍！
        - listitem [ref=e5022]: 当 U → 1（接近 100%），D → 无穷大，时延爆炸
      - blockquote [ref=e5023]:
        - paragraph [ref=e5024]: 这就是为什么网络不能满负荷运行——利用率越高，时延增长越快，最终导致网络拥塞崩溃。
      - paragraph [ref=e5025]:
        - strong [ref=e5026]: 例题
        - text: ：一条信道空闲时时延为 10ms，当利用率达到 80% 时，实际时延是多少？
      - paragraph [ref=e5027]:
        - strong [ref=e5028]: 解：
      - code [ref=e5030]: D = D0 / (1 - U) = 10 / (1 - 0.8) = 10 / 0.2 = 50 ms
      - blockquote [ref=e5031]:
        - paragraph [ref=e5032]: 利用率从 0 升到 80%，时延从 10ms 暴增到 50ms（5 倍），这就是拥塞控制要避免的情况。
      - heading "端到端 vs 点到点" [level=3] [ref=e5033]
      - list [ref=e5034]:
        - listitem [ref=e5035]:
          - strong [ref=e5036]: 端到端通信
          - text: ：A 主机逻辑上直接和 B 主机通信，中间不管经过多少跳。传输层及以上都是端到端。
        - listitem [ref=e5037]:
          - strong [ref=e5038]: 点到点通信
          - text: ：每一跳之间的通信（A→路由器1→路由器2→...→B）。网络层及以下都是点到点。
      - blockquote [ref=e5039]:
        - paragraph [ref=e5040]: 类比：你给朋友写信——端到端是你和朋友之间的通信；点到点是邮递员→分拣中心→运输司机每一段的交接。
      - separator [ref=e5041]
      - heading "考试真题精练" [level=3] [ref=e5042]
      - paragraph [ref=e5043]:
        - strong [ref=e5044]: 第 1 题（单选题）
        - text: ：OSI 参考模型中，负责为数据选择合适的传输路径的是哪一层？ A. 传输层 B. 网络层 C. 数据链路层 D. 物理层
      - paragraph [ref=e5045]:
        - strong [ref=e5046]: 答案：B
      - paragraph [ref=e5047]:
        - strong [ref=e5048]: 解析
        - text: ：网络层有两个核心功能——寻址（给每台主机分配 IP 地址）和选路（为数据包规划从源到目的地的路径）。传输层负责端到端的可靠传输，数据链路层负责相邻节点间传输，物理层负责比特流传输。选路功能（路由选择）是网络层的专属职责。
      - separator [ref=e5049]
      - paragraph [ref=e5050]:
        - strong [ref=e5051]: 第 2 题（单选题）
        - text: ：主机 A 向主机 B 发送数据，数据经过一个路由器转发。当数据从 A 发出、经过路由器、到达 B 的过程中，封装与解封装的变化是？
      - paragraph [ref=e5052]: A. A 封装所有层 → 路由器解封装到网络层再重新封装 → B 解封装所有层 B. A 封装到传输层 → 路由器逐层检查 → B 解封装 C. 数据在路由器中不需要解封装，直接转发 D. 路由器解封装到应用层，重新封装后再转发
      - paragraph [ref=e5053]:
        - strong [ref=e5054]: 答案：A
      - paragraph [ref=e5055]:
        - strong [ref=e5056]: 解析
        - text: ：路由器工作在网络层（第三层），所以它只解封装到网络层——剥离帧头帧尾，读取 IP 头部中的目的 IP 地址，查路由表决定从哪个接口转发，然后重新封装数据链路层帧头帧尾（因为源 MAC 和目的 MAC 变了）。它不会解封装 TCP/UDP 头部，更不会解封装到应用层。而交换机工作在第 2 层，只查 MAC 地址表，不解封装到网络层。
      - blockquote [ref=e5057]:
        - paragraph [ref=e5058]: 总结：路由器解封装到第 3 层（网络层），交换机解封装到第 2 层（数据链路层），集线器不解析任何头部（第 1 层）。
      - separator [ref=e5059]
      - paragraph [ref=e5060]:
        - strong [ref=e5061]: 第 3 题（计算题）
        - text: ：主机 A 与主机 B 之间的光纤链路长度为 3000km，带宽为 100Mbps，电磁波在光纤中的传播速率为 2×10⁸ m/s。A 向 B 发送一个 500KB 的文件，忽略处理时延和排队时延。求： （1）总时延是多少？ （2）时延带宽积是多少？
      - paragraph [ref=e5062]:
        - strong [ref=e5063]: 答案：
      - code [ref=e5065]: （1）发送时延 = (500 × 10^3 × 8) / (100 × 10^6) = 4 × 10^6 / 100 × 10^6 = 0.04 秒 = 40 ms 传播时延 = (3000 × 10^3) / (2 × 10^8) = 3 × 10^6 / 2 × 10^8 = 0.015 秒 = 15 ms 总时延 = 40 ms + 15 ms = 55 ms （2）时延带宽积 = 传播时延 × 带宽 = 0.015 × 100 × 10^6 = 1.5 × 10^6 bit = 1.5 Mbit
      - separator [ref=e5066]
      - paragraph [ref=e5067]:
        - strong [ref=e5068]: 第 4 题（单选题）
        - text: ：以下关于各层 PDU 名称的说法，正确的是？ A. 传输层的 PDU 称为帧 B. 数据链路层的 PDU 称为包 C. 网络层的 PDU 称为数据报 D. 物理层的 PDU 称为段
      - paragraph [ref=e5069]:
        - strong [ref=e5070]: 答案：C
      - paragraph [ref=e5071]:
        - strong [ref=e5072]: 解析
        - text: ：各层 PDU 的规范名称：
      - list [ref=e5073]:
        - listitem [ref=e5074]: 应用层 → 数据/消息（Data/Message）
        - listitem [ref=e5075]: 传输层 → 段（Segment，TCP）/ 数据报（Datagram，UDP）
        - listitem [ref=e5076]: 网络层 → 包/数据报（Packet/Datagram）
        - listitem [ref=e5077]: 数据链路层 → 帧（Frame）
        - listitem [ref=e5078]: 物理层 → 比特（Bit）
      - paragraph [ref=e5079]: 选项 A 错误，传输层是段不是帧；B 错误，数据链路层是帧不是包；D 错误，物理层是比特不是段。C 正确，网络层的 PDU 可以称为数据报（Datagram），IP 协议的数据单元就叫 IP 数据报。
      - separator [ref=e5080]
      - paragraph [ref=e5081]:
        - strong [ref=e5082]: 第 5 题（多选题）
        - text: ：以下关于 OSI 模型和 TCP/IP 模型的比较，正确的有？ A. OSI 是"先有协议后有模型"，TCP/IP 是"先有模型后有协议" B. OSI 的网络层既支持无连接也支持面向连接，TCP/IP 的网络层仅支持无连接 C. TCP/IP 将 OSI 的表示层和会话层合并到应用层 D. OSI 模型有 7 层，TCP/IP 模型有 5 层 E. TCP/IP 是互联网的实际标准，OSI 是理论参考模型
      - paragraph [ref=e5083]:
        - strong [ref=e5084]: 答案：B、C、E
      - paragraph [ref=e5085]:
        - strong [ref=e5086]: 解析
        - text: ：
      - list [ref=e5087]:
        - listitem [ref=e5088]: A 错误：说反了！OSI 是"先有模型后有协议"（理论先行），TCP/IP 是"先有协议后有模型"（实践总结）。
        - listitem [ref=e5089]: B 正确：OSI 的网络层设计支持两种服务，TCP/IP 的 IP 协议只提供无连接服务。
        - listitem [ref=e5090]: C 正确：TCP/IP 把 OSI 的应用层、表示层、会话层合并为"应用层"。
        - listitem [ref=e5091]: D 错误：TCP/IP 是 4 层模型（应用层、传输层、网际层、网络接口层），不是 5 层。5 层是教学用的折中模型。
        - listitem [ref=e5092]: E 正确：OSI 是 ISO 制定的理论标准，从未实际部署过；TCP/IP 是互联网的基石。
