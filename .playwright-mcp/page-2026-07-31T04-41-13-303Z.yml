      - heading "移动 IP 详解" [level=3] [ref=e14407]
      - blockquote [ref=e14408]:
        - paragraph [ref=e14409]: 手机从北京移动到上海，怎么还能用原来的 IP 收到数据？移动 IP 解决这个问题。
      - heading "移动 IP 的三个实体" [level=4] [ref=e14410]
      - table [ref=e14411]:
        - rowgroup [ref=e14412]:
          - row [ref=e14413]:
            - columnheader "实体" [ref=e14414]
            - columnheader "缩写" [ref=e14415]
            - columnheader "功能" [ref=e14416]
            - columnheader "类比" [ref=e14417]
        - rowgroup [ref=e14418]:
          - row [ref=e14419]:
            - cell [ref=e14420]:
              - strong [ref=e14421]: 移动节点
            - cell "MN" [ref=e14422]
            - cell "移动中的手机/设备" [ref=e14423]
            - cell "到处旅行的你" [ref=e14424]
          - row [ref=e14425]:
            - cell [ref=e14426]:
              - strong [ref=e14427]: 归属代理
            - cell "HA" [ref=e14428]
            - cell "记录移动节点的\"老家地址\"，收到发给 MN 的包后转发到当前所在地" [ref=e14429]
            - cell "家乡邮局，帮你转发信件" [ref=e14430]
          - row [ref=e14431]:
            - cell [ref=e14432]:
              - strong [ref=e14433]: 外地代理
            - cell "FA" [ref=e14434]
            - cell "移动节点当前所在地，提供临时地址（转交地址 CoA）" [ref=e14435]
            - cell "你现在住的酒店前台" [ref=e14436]
      - heading "关键地址概念" [level=4] [ref=e14437]
      - table [ref=e14438]:
        - rowgroup [ref=e14439]:
          - row [ref=e14440]:
            - columnheader "地址" [ref=e14441]
            - columnheader "含义" [ref=e14442]
            - columnheader "是否变化" [ref=e14443]
        - rowgroup [ref=e14444]:
          - row [ref=e14445]:
            - cell [ref=e14446]:
              - strong [ref=e14447]: 永久地址
              - text: （归属地址）
            - cell "移动节点在\"老家\"的 IP 地址，始终不变" [ref=e14448]
            - cell "不变" [ref=e14449]
          - row [ref=e14450]:
            - cell [ref=e14451]:
              - strong [ref=e14452]: 转交地址
              - text: （CoA，Care-of Address）
            - cell "移动节点在当前网络中的临时 IP 地址" [ref=e14453]
            - cell "随位置变化" [ref=e14454]
      - heading "移动 IP 三步走的详细过程" [level=4] [ref=e14455]
      - paragraph [ref=e14456]:
        - strong [ref=e14457]: 步骤 1：代理发现（Agent Discovery）
      - paragraph [ref=e14458]: 移动节点需要知道自己是不是在外地。
      - list [ref=e14459]:
        - listitem [ref=e14460]:
          - strong [ref=e14461]: 代理通告（Agent Advertisement）
          - text: ：外地代理（或归属代理）定期广播 ICMP 代理通告报文，告诉周围设备"我是代理，这里能提供转交地址"。移动节点收到后判断自己在外地还是在老家。
        - listitem [ref=e14462]:
          - strong [ref=e14463]: 代理请求（Agent Solicitation）
          - text: ：移动节点等不及定期广播时，可以主动发送 ICMP 代理请求报文，要求附近的代理回复。
      - paragraph [ref=e14464]:
        - strong [ref=e14465]: 步骤 2：注册（Registration）
      - paragraph [ref=e14466]: 移动节点向外地代理获得转交地址后，需要告知归属代理"我现在在哪儿"。
      - list [ref=e14467]:
        - listitem [ref=e14468]: 移动节点发送**注册请求（Registration Request）**给归属代理，包含永久地址和转交地址的绑定关系
        - listitem [ref=e14469]:
          - text: 归属代理验证后，记录绑定信息，回复
          - strong [ref=e14470]: 注册应答（Registration Reply）
        - listitem [ref=e14471]:
          - text: 注册过程中，归属代理会设置一个
          - strong [ref=e14472]: 隧道
          - text: ，把发给 MN 永久地址的包都转发到转交地址
      - paragraph [ref=e14473]:
        - strong [ref=e14474]: 步骤 3：隧道（Tunneling）
      - paragraph [ref=e14475]: 数据包怎么从通信对方（CN）到达移动节点？
      - code [ref=e14477]: 通信对方 CN │ │ 发送数据到 MN 的永久地址（MN 归属网络地址） ↓ 归属代理 HA │ │ 查绑定表：永久地址 → 转交地址 │ 进行 IP-in-IP 隧道封装： │ 外层 IP 头：目的地址=转交地址（CoA） │ 内层 IP 头：目的地址=永久地址（原始不变） │ 原始数据包被完整包裹在内 ↓ 外地代理 FA │ │ 解封装，取出内层原始数据包 ↓ 移动节点 MN │ │ 收到数据！MN 直接回复 CN（不需要经过 HA）
      - blockquote [ref=e14478]:
        - paragraph [ref=e14479]:
          - strong [ref=e14480]: IP-in-IP 隧道
          - text: ：把整个 IP 数据包当作另一个 IP 数据包的"数据载荷"封装起来。外层 IP 头的目的地址是转交地址（CoA），内层 IP 头的目的地址是永久地址。
      - heading "三角路由问题" [level=4] [ref=e14481]
      - paragraph [ref=e14482]:
        - strong [ref=e14483]: 为什么叫"三角路由"？
      - paragraph [ref=e14484]: 通信对方 CN 发给 MN 的数据包走的路径是：
      - code [ref=e14486]: CN → HA → FA → MN
      - paragraph [ref=e14487]: 这是一条"绕路"的路径，形成了一个三角形：CN → HA → MN。
      - paragraph [ref=e14488]: 而 MN 回复 CN 时，可以直接走：
      - code [ref=e14490]: MN → CN（直接路由，不经过 HA）
      - paragraph [ref=e14491]:
        - strong [ref=e14492]: 问题
        - text: ：
      - list [ref=e14493]:
        - listitem [ref=e14494]: 数据包从 CN 到 MN 绕了远路（如果 CN 和 MN 在同一个城市，但 HA 在北京，数据包就要先去北京再回来）
        - listitem [ref=e14495]: 增加了时延和网络开销
      - paragraph [ref=e14496]:
        - strong [ref=e14497]: 路由优化方案（IPv6 移动 IP 的改进）
        - text: ：
      - list [ref=e14498]:
        - listitem [ref=e14499]: CN 第一次发送时还是走 HA 转发
        - listitem [ref=e14500]: 但 MN 收到后，会发送**绑定更新（Binding Update）**报文直接告诉 CN："我现在在 CoA 这个地址，以后直接发到这里"
        - listitem [ref=e14501]: CN 缓存这个绑定信息，后续数据包直接发给 CoA，不再经过 HA
        - listitem [ref=e14502]: 这样三角路由就变成了"直接路由"（CN → MN 直连）
      - blockquote [ref=e14503]:
        - paragraph [ref=e14504]:
          - strong [ref=e14505]: IPv4 移动 IP vs IPv6 移动 IP
          - text: ：IPv6 移动 IP 原生支持路由优化，不需要外地代理（用 IPv6 自带的地址自动配置能力），安全性更好（IPsec 必选）。
      - heading "蓝牙与 NFC 详解" [level=3] [ref=e14506]
