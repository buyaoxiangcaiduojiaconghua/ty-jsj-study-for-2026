            - cell "高（全双工情况下）" [ref=e14037]
            - cell "较低（ACK 开销 + RTS/CTS 开销 + 退避等待）" [ref=e14038]
          - row [ref=e14039]:
            - cell "冲突处理" [ref=e14040]
