            - cell "发送窗口>1，接收窗口>1" [ref=e6230]
            - cell "逐帧确认" [ref=e6231]
            - cell "只重传出错帧" [ref=e6232]
      - blockquote [ref=e6233]:
        - paragraph [ref=e6234]: GBN 和 SR 的区别：GBN 接收方只接受按序到达的帧，"宁可错过不将就"；SR 接受方可以缓存失序帧，"来者不拒"。
      - heading "滑动窗口协议详细对比" [level=4] [ref=e6235]
      - paragraph [ref=e6236]:
        - strong [ref=e6237]: 1. 停等协议（Stop-and-Wait）
      - list [ref=e6238]:
        - listitem [ref=e6239]:
          - strong [ref=e6240]: 发送窗口大小
          - text: ：1
        - listitem [ref=e6241]:
          - strong [ref=e6242]: 接收窗口大小
          - text: ：1
        - listitem [ref=e6243]:
          - strong [ref=e6244]: 确认方式
          - text: ：每帧单独确认
        - listitem [ref=e6245]:
          - strong [ref=e6246]: 效率
          - text: ：极低，大部分时间在等待确认
        - listitem [ref=e6247]:
          - strong [ref=e6248]: 信道利用率
          - text: ：U = T发送 / (T发送 + 2T传播) = T发送 / (T发送 + RTT)
        - listitem [ref=e6249]:
          - strong [ref=e6250]: 优点
          - text: ：实现简单，不需要缓存
        - listitem [ref=e6251]:
          - strong [ref=e6252]: 缺点
          - text: ：信道利用率低，链路越长效率越低
        - listitem [ref=e6253]:
          - strong [ref=e6254]: 适用场景
          - text: ：短距离、低速率链路
      - paragraph [ref=e6255]:
        - strong [ref=e6256]: 2. GBN（Go-Back-N，后退 N 帧）
      - list [ref=e6257]:
        - listitem [ref=e6258]:
          - strong [ref=e6259]: 发送窗口大小
          - text: ：1 <= W发送 <= 2^n - 1（n 为帧序号位数）
        - listitem [ref=e6260]:
          - strong [ref=e6261]: 接收窗口大小
          - text: ：
          - strong [ref=e6262]: 固定为 1
        - listitem [ref=e6263]:
          - strong [ref=e6264]: 确认方式
          - text: ：
          - strong [ref=e6265]: 累积确认
          - text: （ACK n 表示 n 号及之前的所有帧都已正确收到）
        - listitem [ref=e6266]:
          - strong [ref=e6267]: 超时处理
          - text: ：超时后重传所有已发送但未确认的帧（从出错帧开始重传所有）
        - listitem [ref=e6268]:
          - strong [ref=e6269]: 接收方行为
          - text: ：只接收按序到达的帧，失序帧直接丢弃
        - listitem [ref=e6270]:
          - strong [ref=e6271]: 优点
          - text: ：发送方可连续发送，效率高于停等
        - listitem [ref=e6272]:
          - strong [ref=e6273]: 缺点
          - text: ：一个帧出错，所有后续帧都要重传，浪费带宽
        - listitem [ref=e6274]:
          - strong [ref=e6275]: 适用场景
          - text: ：误码率低、传播时延小的链路
      - paragraph [ref=e6276]:
        - strong [ref=e6277]: 3. SR（Selective Repeat，选择重传）
      - list [ref=e6278]:
        - listitem [ref=e6279]:
          - strong [ref=e6280]: 发送窗口大小
          - text: ：W发送 <= 2^(n-1)（n 为帧序号位数）
        - listitem [ref=e6281]:
          - strong [ref=e6282]: 接收窗口大小
          - text: ：W接收 > 1（通常 W接收 = W发送）
        - listitem [ref=e6283]:
          - strong [ref=e6284]: 确认方式
          - text: ：
          - strong [ref=e6285]: 逐帧确认
          - text: （对每个正确接收的帧单独发送 ACK）
        - listitem [ref=e6286]:
          - strong [ref=e6287]: 超时处理
          - text: ：只重传超时或出错的单个帧
        - listitem [ref=e6288]:
          - strong [ref=e6289]: 接收方行为
          - text: ：缓存失序帧，等缺失帧到齐后按序交付上层
        - listitem [ref=e6290]:
          - strong [ref=e6291]: 优点
          - text: ：只重传出错帧，带宽利用率高
        - listitem [ref=e6292]:
          - strong [ref=e6293]: 缺点
          - text: ：需要缓存和排序，实现复杂
        - listitem [ref=e6294]:
          - strong [ref=e6295]: 适用场景
          - text: ：误码率较高、传播时延大的链路
      - paragraph [ref=e6296]:
