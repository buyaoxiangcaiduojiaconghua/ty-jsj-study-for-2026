            - cell "224/256/384/512 位" [ref=e12642]
            - cell "安全" [ref=e12643]
            - cell "新一代标准" [ref=e12644]
          - row [ref=e12645]:
            - cell "SM3" [ref=e12646]
            - cell "256 位" [ref=e12647]
            - cell "安全" [ref=e12648]
            - cell "中国国密标准" [ref=e12649]
      - paragraph [ref=e12650]:
        - strong [ref=e12651]: 哈希函数特性：
      - list [ref=e12652]:
        - listitem [ref=e12653]: 单向性：从摘要反推原文不可能
        - listitem [ref=e12654]: 抗碰撞性：找不到两个不同原文产生相同摘要
        - listitem [ref=e12655]: 雪崩效应：原文改一个 bit，摘要至少一半 bit 改变
      - heading "6.2 消息认证码 MAC" [level=4] [ref=e12656]
      - list [ref=e12657]:
        - listitem [ref=e12658]: MAC = 消息 + 共享密钥 → 哈希 → 认证码
        - listitem [ref=e12659]: 接收方用相同密钥重新计算，比对是否一致
        - listitem [ref=e12660]: 验证：消息未被篡改（完整性）+ 消息来自共享密钥的人（认证）
        - listitem [ref=e12661]: HMAC：基于哈希函数的 MAC（如 HMAC-SHA256）
        - listitem [ref=e12662]: 局限：无法防止抵赖（双方都有密钥，无法证明谁发的）
      - heading "6.3 数字签名" [level=4] [ref=e12663]
      - paragraph [ref=e12664]:
        - strong [ref=e12665]: 数字签名详细过程：
      - list [ref=e12666]:
        - listitem [ref=e12667]: 发送方对原文计算哈希（摘要）
        - listitem [ref=e12668]:
          - text: 发送方用
          - strong [ref=e12669]: 自己的私钥
          - text: 加密摘要 → 数字签名
        - listitem [ref=e12670]: 发送方将原文 + 签名一起发给接收方
        - listitem [ref=e12671]: 接收方对原文计算哈希，得到摘要1
        - listitem [ref=e12672]:
          - text: 接收方用发送方的
          - strong [ref=e12673]: 公钥
          - text: 解密签名，得到摘要2
        - listitem [ref=e12674]: 比对摘要1 和摘要2：一致则验证通过
      - blockquote [ref=e12675]:
        - paragraph [ref=e12676]: 注意：数字签名是"私钥加密摘要"，不是"私钥加密原文"（加密全文太慢了）。
      - paragraph [ref=e12677]:
        - strong [ref=e12678]: 数字签名三大特性：
      - table [ref=e12679]:
        - rowgroup [ref=e12680]:
          - row [ref=e12681]:
            - columnheader "特性" [ref=e12682]
            - columnheader "原理" [ref=e12683]
            - columnheader "类比" [ref=e12684]
        - rowgroup [ref=e12685]:
          - row [ref=e12686]:
            - cell "防伪造" [ref=e12687]
            - cell "私钥只有签名者持有，别人造不出" [ref=e12688]
            - cell "只有你的笔迹别人模仿不了" [ref=e12689]
          - row [ref=e12690]:
            - cell "防篡改" [ref=e12691]
            - cell "改一个字，哈希就变了，签名对不上" [ref=e12692]
            - cell "合同改一个字，印章就失效" [ref=e12693]
          - row [ref=e12694]:
            - cell "防抵赖" [ref=e12695]
            - cell "私钥签名不可否认，公钥验证能证明" [ref=e12696]
            - cell "签了字就不能赖账" [ref=e12697]
      - paragraph [ref=e12698]:
        - strong [ref=e12699]: 数字签名的局限性：
        - text: 签名能证明"这个公钥对应的私钥签了名"，但不能证明"这个公钥确实属于王天宇"。需要一个权威机构来证明"公钥-身份"的绑定关系，这就是数字证书。
      - separator [ref=e12700]
      - heading "七、数字证书与 PKI" [level=3] [ref=e12701]
      - heading "7.1 数字证书 X.509 格式" [level=4] [ref=e12702]
      - paragraph [ref=e12703]: 数字证书 = 互联网上的"身份证"，由 CA 签发。
