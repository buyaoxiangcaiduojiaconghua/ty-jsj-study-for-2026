      - heading "Cookie 和 Session 机制详解" [level=4] [ref=e10896]
      - paragraph [ref=e10897]:
        - strong [ref=e10898]: 为什么需要 Cookie/Session？
        - text: HTTP 是无状态的，服务器不知道两次请求是不是同一个人发的。Cookie 和 Session 就是为了"记住你是谁"。
      - paragraph [ref=e10899]:
        - strong [ref=e10900]: Cookie 的工作方式
        - text: ：
      - list [ref=e10901]:
        - listitem [ref=e10902]:
          - text: 服务器在响应头中放一个
          - code [ref=e10903]: "Set-Cookie: user=abc123"
        - listitem [ref=e10904]: 浏览器保存这个 Cookie
        - listitem [ref=e10905]:
          - text: 下次请求同一个网站时，浏览器自动在请求头中带上
          - code [ref=e10906]: "Cookie: user=abc123"
        - listitem [ref=e10907]: 服务器读取 Cookie 就知道"哦，是你啊"
      - paragraph [ref=e10908]:
        - strong [ref=e10909]: Cookie 的属性
        - text: ：
      - table [ref=e10910]:
        - rowgroup [ref=e10911]:
          - row [ref=e10912]:
            - columnheader "属性" [ref=e10913]
            - columnheader "作用" [ref=e10914]
            - columnheader "示例" [ref=e10915]
        - rowgroup [ref=e10916]:
          - row [ref=e10917]:
            - cell [ref=e10918]:
              - strong [ref=e10919]: Domain
            - cell "指定 Cookie 在哪个域名下生效" [ref=e10920]
            - cell [ref=e10921]:
              - code [ref=e10922]: Domain=example.com
              - text: （含所有子域）
          - row [ref=e10923]:
            - cell [ref=e10924]:
              - strong [ref=e10925]: Path
            - cell "指定 Cookie 在哪个路径下生效" [ref=e10926]
            - cell [ref=e10927]:
              - code [ref=e10928]: Path=/admin
              - text: （只对 /admin 目录生效）
          - row [ref=e10929]:
            - cell [ref=e10930]:
              - strong [ref=e10931]: Expires / Max-Age
            - cell "Cookie 过期时间" [ref=e10932]
            - cell [ref=e10933]:
              - code [ref=e10934]: Expires=Wed, 21 Oct 2026 07:28:00 GMT
          - row [ref=e10935]:
            - cell [ref=e10936]:
              - strong [ref=e10937]: HttpOnly
            - cell "设为 true 时，JS 无法读取 Cookie" [ref=e10938]
            - cell "防止 XSS 攻击窃取 Cookie" [ref=e10939]
          - row [ref=e10940]:
            - cell [ref=e10941]:
              - strong [ref=e10942]: Secure
            - cell "设为 true 时，只在 HTTPS 下传输 Cookie" [ref=e10943]
            - cell "防止中间人截获 Cookie" [ref=e10944]
          - row [ref=e10945]:
            - cell [ref=e10946]:
              - strong [ref=e10947]: SameSite
            - cell "控制跨站请求是否携带 Cookie" [ref=e10948]
            - cell [ref=e10949]:
              - code [ref=e10950]: Strict
              - text: （同站才发）、
              - code [ref=e10951]: Lax
              - text: （部分跨站可发）、
              - code [ref=e10952]: None
              - text: （随便发）
      - paragraph [ref=e10953]:
        - strong [ref=e10954]: Session 的工作方式
        - text: ：
      - list [ref=e10955]:
        - listitem [ref=e10956]:
          - text: Cookie 把数据存在
          - strong [ref=e10957]: 浏览器
          - text: 端，Session 把数据存在
          - strong [ref=e10958]: 服务器
          - text: 端
        - listitem [ref=e10959]: 浏览器只存一个 Session ID（通常通过 Cookie 传递），服务器根据 ID 找到对应的用户数据
        - listitem [ref=e10960]: 比 Cookie 更安全（敏感数据不暴露给客户端），但服务器需要存储空间
      - paragraph [ref=e10961]:
