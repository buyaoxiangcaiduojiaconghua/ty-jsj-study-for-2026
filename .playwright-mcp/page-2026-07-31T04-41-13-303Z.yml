      - heading "TCP 流量控制" [level=3] [ref=e9461]
      - paragraph [ref=e9462]:
        - strong [ref=e9463]: 目的
        - text: ：防止发送方发太快，接收方处理不过来。
      - paragraph [ref=e9464]:
        - text: 通过
        - strong [ref=e9465]: 接收窗口 rwnd
        - text: 告诉发送方："我还能接收多少"。rwnd=0 时发送方暂停，定期发零窗口探测报文。
      - heading "流量控制详解" [level=3] [ref=e9466]
      - heading "滑动窗口机制详细说明" [level=4] [ref=e9467]
      - paragraph [ref=e9468]:
        - strong [ref=e9469]: 类比
        - text: ：发送方和接收方之间有一个"传送带"，窗口大小 = 传送带上能同时放多少货物。
      - code [ref=e9471]: 发送窗口（发送方维护）： ┌─────────────────────────────────────────────────┐ │ 已发送已确认 │ 已发送未确认 │ 允许发送但未发送 │ 不允许发送 │ │ (窗口外) │ ←── 发送窗口 ──→ │ (窗口外) │ └─────────────────────────────────────────────────┘ ↑ ↑ 窗口左沿 窗口右沿
      - paragraph [ref=e9472]:
        - strong [ref=e9473]: 接收窗口（接收方维护）
        - text: ：
      - code [ref=e9475]: 接收方缓冲区：4KB 应用已读取：1KB → 剩余空间：3KB 接收方在 ACK 报文中将 rwnd=3072（3KB）告诉发送方 发送方据此调整发送窗口，保证 swnd ≤ rwnd
      - paragraph [ref=e9476]:
        - strong [ref=e9477]: 滑动窗口的关键参数
        - text: ：
      - list [ref=e9478]:
        - listitem [ref=e9479]: 发送窗口大小 = min(cwnd, rwnd)，即取拥塞窗口和接收窗口的较小值
        - listitem [ref=e9480]: 窗口大小字段占 16 bit（最大 65535 字节），可通过窗口扩大因子扩展到更大
        - listitem [ref=e9481]: 每收到一个 ACK，窗口向前滑动
      - heading "零窗口探测（Zero Window Probe）" [level=4] [ref=e9482]
      - paragraph [ref=e9483]: 当接收方缓冲区满，rwnd=0，发送方暂停发送后：
      - list [ref=e9484]:
        - listitem [ref=e9485]:
          - text: 发送方启动
          - strong [ref=e9486]: 持续计时器
          - text: （Persist Timer）
        - listitem [ref=e9487]:
          - text: 计时器到期后，发送方发送一个
          - strong [ref=e9488]: 零窗口探测报文
          - text: （1 字节数据）
        - listitem [ref=e9489]: 接收方回复 ACK，告知新的 rwnd
        - listitem [ref=e9490]: 如果 rwnd 仍为 0，重新启动持续计时器
        - listitem [ref=e9491]: 如果 rwnd > 0，开始发送数据
      - blockquote [ref=e9492]:
        - paragraph [ref=e9493]: 为什么需要零窗口探测？因为接收方 rwnd 恢复为非零时的 ACK 可能丢失，发送方永远不知道可以继续发送了。探测报文可以打破这个僵局。
      - heading "糊涂窗口综合征（Silly Window Syndrome）" [level=4] [ref=e9494]
      - paragraph [ref=e9495]:
        - strong [ref=e9496]: 现象
        - text: ：接收方每次只腾出一点点空间（如 1 字节），发送方就立即发送一个很小的报文段（1 字节数据 + 40 字节首部），效率极低。
      - paragraph [ref=e9497]:
        - strong [ref=e9498]: 解决方案
        - text: ：
