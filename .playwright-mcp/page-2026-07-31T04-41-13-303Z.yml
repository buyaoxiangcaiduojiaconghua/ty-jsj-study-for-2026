            - cell "多个微微网" [ref=e14641]
      - paragraph [ref=e14642]:
        - strong [ref=e14643]: 微微网规则
        - text: ：
      - list [ref=e14644]:
        - listitem [ref=e14645]: 主设备（Master）控制跳频序列和时钟同步
        - listitem [ref=e14646]: 从设备（Slave）只能和主设备通信，不能直接从设备对从设备
        - listitem [ref=e14647]: 每个微微网有独立的跳频序列，互不干扰
        - listitem [ref=e14648]: 一个设备可以在一个微微网中做主设备，同时在另一个微微网中做从设备
