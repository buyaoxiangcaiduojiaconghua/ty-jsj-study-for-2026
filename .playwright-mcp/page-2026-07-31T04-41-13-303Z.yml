      - paragraph [ref=e6892]:
        - strong [ref=e6893]: 802.1Q 帧格式
      - paragraph [ref=e6894]: VLAN 标签插入在源 MAC 地址和类型/长度字段之间：
      - code [ref=e6896]: 普通以太网帧： 目的MAC(6) | 源MAC(6) | 类型/长度(2) | 数据(46-1500) | FCS(4) 802.1Q 帧（带 VLAN 标签）： 目的MAC(6) | 源MAC(6) | TPID(2) | TCI(2) | 类型/长度(2) | 数据(46-1500) | FCS(4) ↑ 新增 4 字节 VLAN 标签 ↑
