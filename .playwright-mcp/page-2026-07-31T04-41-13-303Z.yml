            - cell [ref=e15575]:
              - strong [ref=e15576]: 错！
              - text: OSI 是参考模型（理论），TCP/IP 才是协议栈（实际标准）
          - row [ref=e15577]:
            - cell "2" [ref=e15578]
            - cell "TCP/IP 是四层，OSI 是七层所以 TCP/IP 少实现了几层" [ref=e15579]
            - cell [ref=e15580]:
              - strong [ref=e15581]: 错！
              - text: TCP/IP 把 OSI 上三层合并为应用层，下两层合并为网络接口层，功能都有
          - row [ref=e15582]:
            - cell "3" [ref=e15583]
            - cell "物理层以上的设备叫\"物理层设备\"" [ref=e15584]
            - cell [ref=e15585]:
              - strong [ref=e15586]: 错！
              - text: 集线器和中继器是物理层设备；交换机是数据链路层；路由器是网络层
      - heading "5.2 子网划分" [level=4] [ref=e15587]
      - table [ref=e15588]:
        - rowgroup [ref=e15589]:
          - row [ref=e15590]:
            - columnheader "#" [ref=e15591]
            - columnheader "陷阱" [ref=e15592]
            - columnheader "正确理解" [ref=e15593]
        - rowgroup [ref=e15594]:
          - row [ref=e15595]:
            - cell "4" [ref=e15596]
            - cell "可用主机数 = 2^主机位数" [ref=e15597]
            - cell [ref=e15598]:
              - strong [ref=e15599]: 错！
              - text: 要减 2：2^h - 2（减去全 0 网络地址和全 1 广播地址）
          - row [ref=e15600]:
            - cell "5" [ref=e15601]
            - cell "子网越多，每个子网主机越多" [ref=e15602]
            - cell [ref=e15603]:
              - strong [ref=e15604]: 错！
              - text: 借位越多 → 子网越多 → 但主机位越少 → 每子网主机越少。此消彼长
          - row [ref=e15605]:
            - cell "6" [ref=e15606]
            - cell "192.168.1.0/24 的第一个可用 IP 是 192.168.1.0" [ref=e15607]
            - cell [ref=e15608]:
              - strong [ref=e15609]: 错！
              - text: 192.168.1.0 是网络地址，不能配给主机。第一个可用是 192.168.1.1
      - heading "5.3 TCP 三次握手与四次挥手" [level=4] [ref=e15610]
      - table [ref=e15611]:
        - rowgroup [ref=e15612]:
          - row [ref=e15613]:
            - columnheader "#" [ref=e15614]
            - columnheader "陷阱" [ref=e15615]
            - columnheader "正确理解" [ref=e15616]
        - rowgroup [ref=e15617]:
          - row [ref=e15618]:
            - cell "7" [ref=e15619]
            - cell "服务器 SYN+ACK 算两次握手" [ref=e15620]
            - cell [ref=e15621]:
              - strong [ref=e15622]: 错！
              - text: 服务器把 SYN 和 ACK 合并成一个报文，所以是三次握手（不是四次）
          - row [ref=e15623]:
            - cell "8" [ref=e15624]
            - cell "四次挥手可以合并成三次" [ref=e15625]
            - cell [ref=e15626]:
              - strong [ref=e15627]: 错！
              - text: 因为 TCP 是全双工，服务端 ACK 和 FIN 必须分开：先 ACK 表示"收到你关闭请求"，数据发完后再 FIN 表示"我也关了"
          - row [ref=e15628]:
            - cell "9" [ref=e15629]
            - cell "TIME_WAIT 在被动关闭方" [ref=e15630]
            - cell [ref=e15631]:
              - strong [ref=e15632]: 错！
              - text: TIME_WAIT 在
              - strong [ref=e15633]: 主动关闭方
              - text: （先发 FIN 的一方），持续 2MSL（约 4 分钟）
          - row [ref=e15634]:
            - cell "10" [ref=e15635]
            - cell "三次握手第三次可以省略" [ref=e15636]
            - cell [ref=e15637]:
              - strong [ref=e15638]: 错！
              - text: 第三次 ACK 防止已失效的 SYN 报文到达服务器造成资源浪费
      - heading "5.4 协议与端口" [level=4] [ref=e15639]
