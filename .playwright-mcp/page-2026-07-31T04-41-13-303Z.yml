            - cell "112/168 位" [ref=e12482]
            - cell "64 位" [ref=e12483]
            - cell "加密-解密-加密，三重 DES" [ref=e12484]
            - cell "中等" [ref=e12485]
            - cell "逐步淘汰" [ref=e12486]
          - row [ref=e12487]:
            - cell "AES" [ref=e12488]
            - cell "128/192/256 位" [ref=e12489]
            - cell "128 位" [ref=e12490]
            - cell "SP 结构（替代-置换网络）" [ref=e12491]
            - cell "安全" [ref=e12492]
            - cell "当前主流标准" [ref=e12493]
          - row [ref=e12494]:
            - cell "RC4" [ref=e12495]
            - cell "可变（40-2048 位）" [ref=e12496]
            - cell "流加密" [ref=e12497]
            - cell "伪随机密钥流" [ref=e12498]
            - cell "已破解" [ref=e12499]
            - cell "已禁用（WEP/TLS 已弃用）" [ref=e12500]
          - row [ref=e12501]:
            - cell "SM4" [ref=e12502]
            - cell "128 位" [ref=e12503]
            - cell "128 位" [ref=e12504]
            - cell "32 轮迭代" [ref=e12505]
            - cell "安全" [ref=e12506]
            - cell "中国国密标准" [ref=e12507]
      - paragraph [ref=e12508]:
        - strong [ref=e12509]: DES 详解：
      - list [ref=e12510]:
        - listitem [ref=e12511]: 64 位明文分组，56 位有效密钥（8 位奇偶校验）
        - listitem [ref=e12512]: 采用 Feistel 结构：每轮将数据分左右两半，右半经过轮函数 f 后与左半 XOR
        - listitem [ref=e12513]: 16 轮迭代，每轮使用不同的 48 位子密钥（由 56 位密钥生成）
      - paragraph [ref=e12514]:
        - strong [ref=e12515]: 3DES 详解：
      - list [ref=e12516]:
        - listitem [ref=e12517]: 加密过程：E(K1, D(K2, E(K3, 明文))) 即加密→解密→加密
        - listitem [ref=e12518]: 使用解密中间步骤是为了兼容 DES（K1=K2=K3 时退化为 DES）
        - listitem [ref=e12519]: 速度约为 DES 的 1/3
      - paragraph [ref=e12520]:
        - strong [ref=e12521]: AES 详解：
      - list [ref=e12522]:
        - listitem [ref=e12523]: 分组大小固定 128 位，密钥 128/192/256 位，轮数 10/12/14
        - listitem [ref=e12524]: 每轮包含：字节代换（S 盒）、行移位、列混合、轮密钥加
        - listitem [ref=e12525]: 最后一轮省略列混合
        - listitem [ref=e12526]: 不是 Feistel 结构，是 SP 结构（所有位都被处理，扩散更快）
      - paragraph [ref=e12527]:
        - strong [ref=e12528]: 对称加密的优缺点：
      - list [ref=e12529]:
        - listitem [ref=e12530]: 优点：速度快（比非对称快 100-1000 倍），适合加密大量数据
        - listitem [ref=e12531]: 缺点：密钥分发困难（如何安全地把密钥告诉对方？）
      - heading "5.2 非对称加密" [level=4] [ref=e12532]
      - paragraph [ref=e12533]: 加密和解密用不同密钥：公钥加密、私钥解密。公钥公开，私钥保密。
      - paragraph [ref=e12534]:
        - strong [ref=e12535]: RSA 详解：
      - list [ref=e12536]:
        - listitem [ref=e12537]: 基于大整数分解的数学难题：两个大素数相乘很容易，但把乘积分解回两个素数极难
        - listitem [ref=e12538]:
          - text: 密钥生成过程：
          - list [ref=e12539]:
            - listitem [ref=e12540]: 选两个大素数 p 和 q（通常 1024 位以上）
            - listitem [ref=e12541]: 计算 n = p×q，φ(n) = (p-1)(q-1)
            - listitem [ref=e12542]: 选 e（1 < e < φ(n)，且 e 与 φ(n) 互质），通常 e=65537
            - listitem [ref=e12543]: 计算 d = e⁻¹ mod φ(n)（d 是 e 的模逆元）
            - listitem [ref=e12544]: 公钥 = (e, n)，私钥 = (d, n)
        - listitem [ref=e12545]: 加密：c = m^e mod n
        - listitem [ref=e12546]: 解密：m = c^d mod n
        - listitem [ref=e12547]: 安全性依赖：已知 n 但无法分解出 p 和 q
      - paragraph [ref=e12548]:
        - strong [ref=e12549]: ECC 椭圆曲线加密：
      - list [ref=e12550]:
        - listitem [ref=e12551]: 基于椭圆曲线上的离散对数问题
        - listitem [ref=e12552]: 更短的密钥达到相同安全强度：256 位 ECC 安全性约等于 3072 位 RSA
        - listitem [ref=e12553]: 计算量小、存储空间小、带宽低，适合移动设备
        - listitem [ref=e12554]: 代表算法：ECDSA（数字签名）、ECDH（密钥交换）
        - listitem [ref=e12555]: SM2：中国国密标准的椭圆曲线算法
      - paragraph [ref=e12556]:
        - strong [ref=e12557]: 非对称加密的优缺点：
      - list [ref=e12558]:
        - listitem [ref=e12559]: 优点：解决密钥分发问题（公钥公开即可），支持数字签名
        - listitem [ref=e12560]: 缺点：速度慢，不适合加密大量数据
      - heading "5.3 对称加密 vs 非对称加密对比" [level=4] [ref=e12561]
      - table [ref=e12562]:
        - rowgroup [ref=e12563]:
