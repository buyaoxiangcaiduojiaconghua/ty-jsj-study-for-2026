          - row [ref=e9339]:
            - cell [ref=e9340]:
              - strong [ref=e9341]: SYN_RCVD
            - cell "已收 SYN，已发 SYN+ACK，等 ACK" [ref=e9342]
            - cell "服务端" [ref=e9343]
