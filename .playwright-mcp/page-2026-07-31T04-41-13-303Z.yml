      - separator [ref=e11971]
      - heading "DHCP 详解" [level=3] [ref=e11972]
      - paragraph [ref=e11973]:
        - strong [ref=e11974]: 作用
        - text: ：自动给主机分配 IP 地址、子网掩码、默认网关、DNS 服务器等网络配置。
      - paragraph [ref=e11975]:
        - strong [ref=e11976]: 类比
        - text: ：去酒店前台办入住——前台自动给你分配房号（IP 地址），告诉你 WiFi 密码（网关）、餐厅在哪（DNS）。你不需要自己带一个房间号。
      - heading "DHCP 工作过程（DORA 四步）" [level=4] [ref=e11977]
      - code [ref=e11979]: 客户端 DHCP 服务器 │ │ │──① Discover（广播）──────────────────────────>│ │ "谁是 DHCP 服务器？我要 IP！" │ │ （源 IP：0.0.0.0，目的 IP：255.255.255.255） │ │ │ │<─② Offer（单播）──────────────────────────────│ │ "我可以给你 192.168.1.100，租期 24 小时" │ │ │ │──③ Request（广播）───────────────────────────>│ │ "我就要 192.168.1.100 了！" │ │ （广播是为了告诉其他 DHCP 服务器"我选了别人"） │ │ │ │<─④ ACK（单播）────────────────────────────────│ │ "好的，192.168.1.100 归你了，租约开始" │ │ │
      - paragraph [ref=e11980]:
        - strong [ref=e11981]: DORA 记忆口诀
        - text: ：D（找）→ O（给）→ R（定）→ A（确认）。四个字母分别对应 Discover、Offer、Request、ACK。
      - heading "DHCP 报文类型" [level=4] [ref=e11982]
      - table [ref=e11983]:
        - rowgroup [ref=e11984]:
          - row [ref=e11985]:
            - columnheader "报文类型" [ref=e11986]
            - columnheader "方向" [ref=e11987]
            - columnheader "作用" [ref=e11988]
        - rowgroup [ref=e11989]:
          - row [ref=e11990]:
            - cell [ref=e11991]:
              - strong [ref=e11992]: DHCPDISCOVER
            - cell "客户端→服务器" [ref=e11993]
            - cell "客户端广播寻找 DHCP 服务器" [ref=e11994]
          - row [ref=e11995]:
            - cell [ref=e11996]:
              - strong [ref=e11997]: DHCPOFFER
            - cell "服务器→客户端" [ref=e11998]
            - cell "服务器提供 IP 地址" [ref=e11999]
          - row [ref=e12000]:
            - cell [ref=e12001]:
              - strong [ref=e12002]: DHCPREQUEST
            - cell "客户端→服务器" [ref=e12003]
            - cell "客户端请求使用某个 IP（或续租）" [ref=e12004]
          - row [ref=e12005]:
            - cell [ref=e12006]:
              - strong [ref=e12007]: DHCPACK
            - cell "服务器→客户端" [ref=e12008]
            - cell "服务器确认分配" [ref=e12009]
          - row [ref=e12010]:
            - cell [ref=e12011]:
              - strong [ref=e12012]: DHCPNAK
            - cell "服务器→客户端" [ref=e12013]
            - cell "服务器拒绝（如 IP 已被占用）" [ref=e12014]
          - row [ref=e12015]:
            - cell [ref=e12016]:
              - strong [ref=e12017]: DHCPDECLINE
            - cell "客户端→服务器" [ref=e12018]
            - cell "客户端发现 IP 已被占用（如通过 ARP 检测到冲突）" [ref=e12019]
          - row [ref=e12020]:
            - cell [ref=e12021]:
              - strong [ref=e12022]: DHCPRELEASE
            - cell "客户端→服务器" [ref=e12023]
            - cell "客户端主动释放 IP" [ref=e12024]
          - row [ref=e12025]:
            - cell [ref=e12026]:
              - strong [ref=e12027]: DHCPINFORM
            - cell "客户端→服务器" [ref=e12028]
            - cell "客户端已有 IP，只请求其他配置信息（如 DNS）" [ref=e12029]
      - heading "DHCP 租约更新过程" [level=4] [ref=e12030]
      - paragraph [ref=e12031]: IP 地址不是永久分配的，有"租期"：
      - list [ref=e12032]:
        - listitem [ref=e12033]:
          - strong [ref=e12034]: 租期到 50%
          - text: （T1）：客户端向原 DHCP 服务器单播 DHCPREQUEST，请求续租
        - listitem [ref=e12035]:
          - strong [ref=e12036]: 租期到 87.5%
          - text: （T2）：如果还没续上，客户端广播 DHCPREQUEST，向任何 DHCP 服务器续租
        - listitem [ref=e12037]:
          - strong [ref=e12038]: 租期到 100%
          - text: ：租约到期，客户端必须停止使用该 IP，重新开始 DORA 流程
      - blockquote [ref=e12039]:
        - paragraph [ref=e12040]:
          - strong [ref=e12041]: 类比
          - text: ：图书馆借书——到期前可以续借，到期了就必须还，想再看再借一次。
      - heading "为什么 DHCP 用 UDP 而不是 TCP" [level=4] [ref=e12042]
      - table [ref=e12043]:
        - rowgroup [ref=e12044]:
          - row [ref=e12045]:
            - columnheader "原因" [ref=e12046]
            - columnheader "说明" [ref=e12047]
        - rowgroup [ref=e12048]:
          - row [ref=e12049]:
            - cell [ref=e12050]:
              - strong [ref=e12051]: 客户端没有 IP
            - cell "DHCP 请求时客户端 IP 是 0.0.0.0，TCP 需要完整的 IP 地址才能建立连接" [ref=e12052]
          - row [ref=e12053]:
            - cell [ref=e12054]:
              - strong [ref=e12055]: 广播需求
            - cell "DHCP Discover 需要广播到整个局域网，TCP 是端到端的，不支持广播" [ref=e12056]
          - row [ref=e12057]:
            - cell [ref=e12058]:
              - strong [ref=e12059]: 简单高效
            - cell "DHCP 交互只有 4 步，数据量小，用 UDP 更轻量" [ref=e12060]
          - row [ref=e12061]:
            - cell [ref=e12062]:
              - strong [ref=e12063]: 无需可靠传输
            - cell "超时没收到响应，客户端会自动重发 DHCPDISCOVER，应用层自己保证可靠性" [ref=e12064]
      - blockquote [ref=e12065]:
        - paragraph [ref=e12066]:
          - strong [ref=e12067]: 端口号
          - text: ：DHCP 服务器监听
          - strong [ref=e12068]: "67"
          - text: 端口，客户端监听
          - strong [ref=e12069]: "68"
          - text: 端口。都是用 UDP。
      - separator [ref=e12070]
      - heading "Telnet" [level=3] [ref=e12071]
      - list [ref=e12072]:
        - listitem [ref=e12073]: 端口 23，远程登录协议
        - listitem [ref=e12074]:
          - strong [ref=e12075]: 明文传输
          - text: （用户名密码都不加密），已被 SSH（端口 22）替代
        - listitem [ref=e12076]: 考试主要问"不安全"
      - separator [ref=e12077]
      - heading "例题与解析" [level=3] [ref=e12078]
      - paragraph [ref=e12079]:
        - strong [ref=e12080]: 例题 1（DNS 查询过程）
        - text: ：用户在浏览器中输入
        - code [ref=e12081]: www.example.com
        - text: ，假设本地 DNS 缓存为空，以下关于 DNS 查询过程的描述，正确的是？
      - paragraph [ref=e12082]: A. 主机向本地 DNS 服务器发起迭代查询，本地 DNS 向根域名服务器发起递归查询B. 主机向本地 DNS 服务器发起递归查询，本地 DNS 向根域名服务器发起迭代查询C. 主机直接向根域名服务器发起递归查询D. 整个查询过程中只使用了递归查询，没有使用迭代查询
      - paragraph [ref=e12083]:
        - strong [ref=e12084]: 解析
        - text: ：
      - list [ref=e12085]:
        - listitem [ref=e12086]: A 错：主机向本地 DNS 是递归（让你帮我查到底），不是迭代。
        - listitem [ref=e12087]: B 对：主机 → 本地 DNS 是递归，本地 DNS → 根/顶级/权威 DNS 是迭代。
        - listitem [ref=e12088]: C 错：主机不直接和根域名服务器通信，而是通过本地 DNS 服务器。
        - listitem [ref=e12089]: D 错：递归和迭代都用到了。
      - paragraph [ref=e12090]:
        - strong [ref=e12091]: 答案：B
      - separator [ref=e12092]
      - paragraph [ref=e12093]:
        - strong [ref=e12094]: 例题 2（HTTP 状态码判断）
        - text: ：以下关于 HTTP 状态码的说法，错误的是？
      - paragraph [ref=e12095]: A. 301 表示永久重定向，浏览器可能将 POST 请求改为 GET 请求B. 304 表示资源未修改，客户端应继续使用本地缓存C. 401 和 403 含义相同，都表示客户端没有权限访问D. 502 表示网关从上游服务器收到了无效响应，504 表示网关在超时时间内未收到上游响应
      - paragraph [ref=e12096]:
        - strong [ref=e12097]: 解析
        - text: ：
      - list [ref=e12098]:
        - listitem [ref=e12099]: A 对：301 永久重定向，浏览器可能改变请求方法（POST → GET）。
        - listitem [ref=e12100]: B 对：304 用于协商缓存，表示资源未修改，用本地缓存。
        - listitem [ref=e12101]: C 错：401 是"未认证"（不知道你是谁），403 是"已认证但无权限"（知道你是谁但不让你访问），含义不同。
        - listitem [ref=e12102]: D 对：502 是收到无效响应，504 是没收到响应（超时），两者不同。
      - paragraph [ref=e12103]:
        - strong [ref=e12104]: 答案：C
      - separator [ref=e12105]
      - paragraph [ref=e12106]:
        - strong [ref=e12107]: 例题 3（HTTPS 握手过程）
        - text: ：以下关于 HTTPS TLS 握手过程的描述，正确的是？
      - paragraph [ref=e12108]: A. TLS 握手过程中，客户端和服务器全程使用对称加密B. 预主密钥由服务器生成，用客户端的公钥加密后发送给客户端C. 会话密钥由客户端随机数、服务器随机数和预主密钥共同生成D. 数字证书的作用是加密传输的数据
      - paragraph [ref=e12109]:
        - strong [ref=e12110]: 解析
        - text: ：
      - list [ref=e12111]:
        - listitem [ref=e12112]: A 错：握手阶段用非对称加密交换密钥，传输数据阶段才用对称加密。
        - listitem [ref=e12113]:
          - text: B 错：预主密钥由
          - strong [ref=e12114]: 客户端
          - text: 生成，用服务器的公钥加密后发送给服务器。
        - listitem [ref=e12115]: C 对：三个随机数（客户端随机数 + 服务器随机数 + 预主密钥）共同生成会话密钥。
        - listitem [ref=e12116]: D 错：数字证书的作用是证明"这个公钥确实属于这个网站"（身份认证），不是直接加密数据。
      - paragraph [ref=e12117]:
        - strong [ref=e12118]: 答案：C
      - separator [ref=e12119]
      - paragraph [ref=e12120]:
        - strong [ref=e12121]: 例题 4（FTP 主动/被动模式）
        - text: ：以下关于 FTP 主动模式和被动模式的说法，错误的是？
      - paragraph [ref=e12122]: A. 主动模式下，数据连接由服务器主动发起B. 被动模式下，数据连接由客户端主动发起C. 主动模式使用端口 21 建立数据连接，被动模式使用端口 20 建立数据连接D. 被动模式更适合客户端在防火墙/NAT 后面的场景
      - paragraph [ref=e12123]:
        - strong [ref=e12124]: 解析
        - text: ：
      - list [ref=e12125]:
        - listitem [ref=e12126]: A 对：主动模式（PORT）下，服务器从端口 20 主动连接客户端。
        - listitem [ref=e12127]: B 对：被动模式（PASV）下，客户端主动连接服务器随机端口。
        - listitem [ref=e12128]: C 错：端口 21 是控制连接（两种模式都用），端口 20 是主动模式下的数据连接端口。被动模式的数据连接端口是服务器随机开放的。
        - listitem [ref=e12129]: D 对：被动模式所有连接都由客户端发起，不会被防火墙拦截。
      - paragraph [ref=e12130]:
        - strong [ref=e12131]: 答案：C
      - separator [ref=e12132]
      - paragraph [ref=e12133]:
        - strong [ref=e12134]: 例题 5（邮件协议对比）
        - text: ：用户希望在手机、平板、电脑三台设备上同步查看邮件，应选择以下哪种协议？
      - paragraph [ref=e12135]: A. SMTPB. POP3C. IMAPD. DHCP
      - paragraph [ref=e12136]:
        - strong [ref=e12137]: 解析
        - text: ：
      - list [ref=e12138]:
        - listitem [ref=e12139]: A 错：SMTP 是发邮件协议，不管收邮件。
        - listitem [ref=e12140]: B 错：POP3 把邮件下载到本地，一台设备下载后其他设备看不到，不支持多设备同步。
        - listitem [ref=e12141]: C 对：IMAP 邮件始终留在服务器，多设备同步查看，支持部分下载，适合多设备场景。
        - listitem [ref=e12142]: D 错：DHCP 是分配 IP 地址的，和邮件无关。
      - paragraph [ref=e12143]:
        - strong [ref=e12144]: 答案：C
      - separator [ref=e12145]
      - heading "易错陷阱表" [level=3] [ref=e12146]
      - table [ref=e12147]:
        - rowgroup [ref=e12148]:
          - row [ref=e12149]:
            - columnheader "#" [ref=e12150]
            - columnheader "陷阱" [ref=e12151]
