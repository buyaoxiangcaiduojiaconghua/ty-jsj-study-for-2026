      - heading "2.1 常见网络攻击详解" [level=4] [ref=e12350]
      - paragraph [ref=e12351]:
        - strong [ref=e12352]: SQL 注入
        - text: ：攻击者在输入框输入恶意 SQL 代码，绕过验证直接操作数据库。
      - list [ref=e12353]:
        - listitem [ref=e12354]:
          - text: 原理：
          - code [ref=e12355]: SELECT * FROM users WHERE name='admin' AND pwd='' OR '1'='1'
        - listitem [ref=e12356]: 防御：参数化查询（预编译语句）、输入校验、最小权限原则
      - paragraph [ref=e12357]:
        - strong [ref=e12358]: XSS 跨站脚本攻击
        - text: ：攻击者把恶意脚本注入网页，当用户访问时自动执行。
      - table [ref=e12359]:
        - rowgroup [ref=e12360]:
          - row [ref=e12361]:
            - columnheader "类型" [ref=e12362]
            - columnheader "特点" [ref=e12363]
            - columnheader "典型场景" [ref=e12364]
        - rowgroup [ref=e12365]:
          - row [ref=e12366]:
            - cell "反射型 XSS" [ref=e12367]
            - cell "恶意脚本在 URL 参数中，一次性触发" [ref=e12368]
            - cell "点击钓鱼链接" [ref=e12369]
          - row [ref=e12370]:
            - cell "存储型 XSS" [ref=e12371]
            - cell "恶意脚本存储在服务器（如评论区），所有人访问时触发" [ref=e12372]
            - cell "论坛留言板" [ref=e12373]
          - row [ref=e12374]:
            - cell "DOM 型 XSS" [ref=e12375]
            - cell "纯前端问题，修改 DOM 结构触发" [ref=e12376]
            - cell "前端拼接 HTML" [ref=e12377]
      - list [ref=e12378]:
        - listitem [ref=e12379]: 防御：输出编码、CSP 内容安全策略、HttpOnly Cookie
      - paragraph [ref=e12380]:
        - strong [ref=e12381]: CSRF 跨站请求伪造
        - text: ：攻击者诱导用户点击链接，利用用户已登录的身份发请求。
      - list [ref=e12382]:
        - listitem [ref=e12383]: 类比：你登录了银行，攻击者骗你点击"转账"按钮，银行以为是你操作的
        - listitem [ref=e12384]: 防御：CSRF Token、SameSite Cookie、Referer 校验
      - paragraph [ref=e12385]:
        - strong [ref=e12386]: ARP 欺骗
        - text: ：攻击者冒充网关，告诉你的电脑"我是网关，把数据发给我"。
      - list [ref=e12387]:
        - listitem [ref=e12388]: 原理：ARP 协议无认证机制，收到 ARP 回复就更新缓存
        - listitem [ref=e12389]: 防御：静态 ARP 表、ARP 防火墙、交换机端口绑定
      - paragraph [ref=e12390]:
        - strong [ref=e12391]: DNS 劫持/污染
        - text: ：篡改 DNS 解析结果，把用户引导到假网站。
      - list [ref=e12392]:
        - listitem [ref=e12393]: DNS 劫持：攻击 DNS 服务器本身
        - listitem [ref=e12394]: DNS 污染（缓存投毒）：向 DNS 缓存注入错误记录
        - listitem [ref=e12395]: 防御：DNSSEC、使用可信 DNS 服务器
      - paragraph [ref=e12396]:
        - strong [ref=e12397]: 缓冲区溢出攻击
        - text: ：向程序输入超长数据，覆盖相邻内存区域，执行恶意代码。
      - list [ref=e12398]:
        - listitem [ref=e12399]:
          - text: 原理：C 语言中
          - code [ref=e12400]: strcpy()
          - text: 不检查边界，超出缓冲区就覆盖返回地址
        - listitem [ref=e12401]:
          - text: 防御：使用安全函数（
          - code [ref=e12402]: strncpy
          - text: ）、地址随机化（ASLR）、栈保护（Canary）
      - separator [ref=e12403]
