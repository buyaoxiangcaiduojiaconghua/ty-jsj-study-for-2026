      - blockquote [ref=e15169]:
        - paragraph [ref=e15170]: 以下内容基于国网笔试真题风格和高频考点整理，专为机考选择题/判断题设计。
      - separator [ref=e15171]
      - heading "一、子网划分真题计算题（3道典型题）" [level=3] [ref=e15172]
      - heading "真题1：已知IP和掩码求网络地址/广播地址" [level=4] [ref=e15173]
      - paragraph [ref=e15174]:
        - strong [ref=e15175]: 题目
        - text: ：某主机 IP 为
        - code [ref=e15176]: 192.168.15.130/27
        - text: ，求该主机所在子网的网络地址和广播地址。
      - paragraph [ref=e15177]:
        - strong [ref=e15178]: 解题步骤
        - text: ：
      - list [ref=e15179]:
        - listitem [ref=e15180]:
          - text: /27 = 掩码 255.255.255.224，块大小 = 256 - 224 =
          - strong [ref=e15181]: "32"
        - listitem [ref=e15182]:
          - text: 关键字节是最后一个（130），子网划分：0, 32, 64, 96,
          - strong [ref=e15183]: "128"
          - text: ", 160, 192, 224"
        - listitem [ref=e15184]: 130 落在 128~159 区间
        - listitem [ref=e15185]:
          - strong [ref=e15186]: 网络地址
          - text: = 192.168.15.128
        - listitem [ref=e15187]:
          - strong [ref=e15188]: 广播地址
          - text: = 192.168.15.159（下一个子网网络地址 - 1）
        - listitem [ref=e15189]: 可用 IP 范围 = 192.168.15.129 ~ 192.168.15.158（共 30 个）
      - blockquote [ref=e15190]:
        - paragraph [ref=e15191]:
          - strong [ref=e15192]: 速算技巧
          - text: ：用 IP 的关键字节 130 除以块大小 32，商 4 余 2。网络地址关键字节 = 4 × 32 = 128，广播地址 = 128 + 32 - 1 = 159。
      - separator [ref=e15193]
      - heading "真题2：根据需求反推子网掩码" [level=4] [ref=e15194]
      - paragraph [ref=e15195]:
        - strong [ref=e15196]: 题目
        - text: ：某公司有 5 个部门，每个部门最多 25 台主机。使用 C 类地址
        - code [ref=e15197]: 192.168.10.0/24
        - text: 划分子网，应使用的子网掩码是？
      - paragraph [ref=e15198]:
        - strong [ref=e15199]: 解题步骤
        - text: ：
      - list [ref=e15200]:
        - listitem [ref=e15201]: 先看主机需求：每个子网需要 25 台可用主机
        - listitem [ref=e15202]: 2^h - 2 >= 25 → h >= 5（2^5 - 2 = 30 >= 25）
        - listitem [ref=e15203]:
          - text: 主机位 = 5 位，网络位 = 32 - 5 =
          - strong [ref=e15204]: "27"
        - listitem [ref=e15205]:
          - text: 子网掩码 = /27 =
          - strong [ref=e15206]: 255.255.255.224
        - listitem [ref=e15207]: 验证子网数：借了 3 位（27 - 24 = 3），2^3 = 8 个子网 >= 5 个部门，满足
      - blockquote [ref=e15208]:
        - paragraph [ref=e15209]:
          - strong [ref=e15210]: 易错提醒
          - text: ：主机数需求优先于子网数需求！先算主机位够不够，再检验子网数够不够。很多人先算子网数导致主机位不够。
      - separator [ref=e15211]
      - heading "真题3：超网聚合（路由聚合）" [level=4] [ref=e15212]
      - paragraph [ref=e15213]:
        - strong [ref=e15214]: 题目
        - text: ：将以下 4 个网络聚合成一个超网：
        - code [ref=e15215]: 192.168.4.0/24
        - text: 、
        - code [ref=e15216]: 192.168.5.0/24
        - text: 、
        - code [ref=e15217]: 192.168.6.0/24
        - text: 、
        - code [ref=e15218]: 192.168.7.0/24
      - paragraph [ref=e15219]:
        - strong [ref=e15220]: 解题步骤
        - text: ：
      - list [ref=e15221]:
        - listitem [ref=e15222]:
          - text: 写出第三字节的二进制：
          - list [ref=e15223]:
            - listitem [ref=e15224]:
              - text: 4 = 000001
              - strong [ref=e15225]: "00"
            - listitem [ref=e15226]:
              - text: 5 = 000001
              - strong [ref=e15227]: "01"
            - listitem [ref=e15228]:
              - text: 6 = 000001
              - strong [ref=e15229]: "10"
            - listitem [ref=e15230]:
              - text: 7 = 000001
              - strong [ref=e15231]: "11"
        - listitem [ref=e15232]: 找共同前缀：前 22 位完全相同（192.168 的 16 位 + 第三字节前 6 位 = 22 位）
        - listitem [ref=e15233]:
          - text: 聚合结果 =
          - strong [ref=e15234]: 192.168.4.0/22
        - listitem [ref=e15235]: 掩码 = 255.255.252.0，块大小 = 256 - 252 = 4，覆盖 4.0 ~ 7.255
      - blockquote [ref=e15236]:
        - paragraph [ref=e15237]:
          - strong [ref=e15238]: 判断方法
          - text: ：N 个连续网络能聚合成一个超网，当且仅当 N 是 2 的幂且起始地址能被 N 整除。4 能被 4 整除，所以 4 个网络可以聚合。
      - separator [ref=e15239]
      - heading "二、TCP 拥塞控制计算题（典型题）" [level=3] [ref=e15240]
      - heading "真题：拥塞窗口变化全过程" [level=4] [ref=e15241]
      - paragraph [ref=e15242]:
        - strong [ref=e15243]: 题目
        - text: ：TCP 连接建立后，ssthresh 初始 = 16（MSS），cwnd 初始 = 1。假设所有报文段都成功发送直到第 7 轮（RTT），第 7 轮发送后发生
        - strong [ref=e15244]: 超时
        - text: 。请写出每轮发送时的 cwnd 值。
      - paragraph [ref=e15245]:
        - strong [ref=e15246]: 解题步骤
        - text: ：
      - table [ref=e15247]:
        - rowgroup [ref=e15248]:
          - row [ref=e15249]:
            - columnheader "轮次" [ref=e15250]
            - columnheader "cwnd（发送时）" [ref=e15251]
            - columnheader "阶段" [ref=e15252]
            - columnheader "说明" [ref=e15253]
        - rowgroup [ref=e15254]:
