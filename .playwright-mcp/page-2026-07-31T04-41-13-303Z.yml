      - heading "知识点 16：计算机网络体系结构" [level=2] [ref=e4303]
      - heading "计算机网络是什么？" [level=3] [ref=e4304]
      - paragraph [ref=e4305]: 把多台计算机用通信线路连起来，让它们能互相传数据。
      - paragraph [ref=e4306]:
        - text: 按覆盖范围分：
        - strong [ref=e4307]: 局域网 LAN
        - text: （一个楼内）、
        - strong [ref=e4308]: 城域网 MAN
        - text: （一个城市）、
        - strong [ref=e4309]: 广域网 WAN
        - text: （跨国家）。
      - heading "按拓扑结构分类" [level=4] [ref=e4310]
      - paragraph [ref=e4311]: 网络拓扑是指网络中各节点之间的物理连接方式，直接影响可靠性、成本、扩展性。
      - table [ref=e4312]:
        - rowgroup [ref=e4313]:
          - row [ref=e4314]:
            - columnheader "拓扑结构" [ref=e4315]
            - columnheader "特点" [ref=e4316]
