      - heading "蓝牙配对过程" [level=4] [ref=e14610]
      - paragraph [ref=e14611]: 蓝牙设备首次连接需要配对（Pairing），目的是建立安全密钥：
      - list [ref=e14612]:
        - listitem [ref=e14613]:
          - strong [ref=e14614]: 设备发现
          - text: ：手机扫描附近的蓝牙设备，蓝牙耳机广播自己的存在
        - listitem [ref=e14615]:
          - strong [ref=e14616]: 发起配对
          - text: ：用户点击连接，发起配对请求
        - listitem [ref=e14617]:
          - strong [ref=e14618]: 密钥交换
          - text: ：双方协商生成临时密钥（TK），再通过 TK 生成长期密钥（LTK）。配对方式取决于设备的 I/O 能力（有屏幕/无屏幕、有键盘/无键盘）
        - listitem [ref=e14619]:
          - strong [ref=e14620]: 密钥分发
          - text: ：长期密钥 LTK 生成后，后续连接使用 LTK 自动加密，不需要再次配对
      - blockquote [ref=e14621]:
        - paragraph [ref=e14622]:
          - text: 蓝牙 4.2 及以后版本使用
          - strong [ref=e14623]: LE Secure Connections
          - text: ，基于 ECDH（椭圆曲线 Diffie-Hellman）密钥交换，安全性大幅提升，能抵抗中间人攻击。
