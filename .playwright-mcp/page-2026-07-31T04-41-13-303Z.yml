        - paragraph [ref=e6717]:
          - strong [ref=e6718]: 设计思想
          - text: ：冲突越多说明网络越忙，退避范围越大，等待时间越长，降低再次冲突的概率。这叫"自适应退避"。
      - paragraph [ref=e6719]:
        - strong [ref=e6720]: 争用期计算例题
      - paragraph [ref=e6721]:
        - strong [ref=e6722]: 例题：已知两个站点 A 和 B 距离 1 km，信号传播速度 2 × 10^5 km/s，带宽 1 Gbps。求最短帧长。
      - paragraph [ref=e6723]:
        - strong [ref=e6724]: 解：
      - list [ref=e6725]:
        - listitem [ref=e6726]:
          - text: 端到端传播时延 τ = 距离 / 传播速度 = 1 km / (2 × 10^5 km/s) = 5 × 10^(-6) s =
          - strong [ref=e6727]: 5 μs
        - listitem [ref=e6728]:
          - text: 争用期 = 2τ =
          - strong [ref=e6729]: 10 μs
        - listitem [ref=e6730]:
          - text: 最短帧长 = 争用期 × 数据速率 = 10 × 10^(-6) s × 1 × 10^9 bps = 10,000 bit =
          - strong [ref=e6731]: 1250 字节
      - blockquote [ref=e6732]:
        - paragraph [ref=e6733]: 对比 10 Mbps 以太网（最短帧长 64 字节），带宽提高 100 倍，最短帧长也提高 100 倍。这就是为什么高速以太网需要更大的最短帧长——但实际标准帧长上限是 1500 字节（标准 MTU），所以高速以太网通过其他方式（如载波扩展）处理。
      - paragraph [ref=e6734]:
        - strong [ref=e6735]: 碰撞检测时机计算
      - paragraph [ref=e6736]:
        - strong [ref=e6737]: 例题：A 和 B 距离 2 km，传播速度 2 × 10^5 km/s。A 在 t=0 时刻开始发送数据。求：
      - list [ref=e6738]:
        - listitem [ref=e6739]: B 在什么时刻之前可以发送数据而不发生碰撞？
        - listitem [ref=e6740]: A 在什么时刻之前能检测到和最远站点的碰撞？
      - paragraph [ref=e6741]:
        - strong [ref=e6742]: 解：
      - list [ref=e6743]:
        - listitem [ref=e6744]:
          - paragraph [ref=e6745]: B 感知到 A 的信号需要 τ = 2 km / (2 × 10^5 km/s) = 10 μs
          - list [ref=e6746]:
            - listitem [ref=e6747]: t < 10 μs 时，B 检测不到 A 的信号，可能发送数据 → 发生碰撞
            - listitem [ref=e6748]: t >= 10 μs 时，B 检测到信道忙，不会发送
            - listitem [ref=e6749]: 答案：B 在 10 μs 之前发送会碰撞
        - listitem [ref=e6750]:
          - paragraph [ref=e6751]: 最坏情况：B 在 τ 时刻刚好发完（即 t=10μs 时 B 发送），碰撞信号传回 A 需要 τ = 10 μs
          - list [ref=e6752]:
            - listitem [ref=e6753]: A 在 t = 2τ = 20 μs 时检测到碰撞
            - listitem [ref=e6754]: 答案：A 在 20 μs 内能检测到碰撞
      - heading "交换机 vs 网桥" [level=3] [ref=e6755]
      - table [ref=e6756]:
        - rowgroup [ref=e6757]:
          - row [ref=e6758]:
            - columnheader "对比" [ref=e6759]
            - columnheader "网桥" [ref=e6760]
            - columnheader "交换机" [ref=e6761]
        - rowgroup [ref=e6762]:
          - row [ref=e6763]:
            - cell "端口数" [ref=e6764]
            - cell "少（2-4个）" [ref=e6765]
            - cell "多（几十个）" [ref=e6766]
          - row [ref=e6767]:
            - cell "转发方式" [ref=e6768]
            - cell "软件转发" [ref=e6769]
            - cell "硬件转发（快）" [ref=e6770]
          - row [ref=e6771]:
            - cell "本质" [ref=e6772]
            - cell "交换机就是多端口网桥" [ref=e6773]
            - cell [ref=e6774]
          - row [ref=e6775]:
            - cell "工作方式" [ref=e6776]
            - cell "自学习地址表（MAC表） → 查表 → 转发/过滤/泛洪" [ref=e6777]
            - cell [ref=e6778]
      - paragraph [ref=e6779]:
        - strong [ref=e6780]: 交换机自学习
        - text: ：收到帧时，记录源 MAC 和到达端口 → 查目的 MAC → 有记录就转发到对应端口，没记录就泛洪（除收到端口外的所有端口广播）
      - heading "交换机详细" [level=4] [ref=e6781]
      - paragraph [ref=e6782]:
        - strong [ref=e6783]: 交换机自学习算法详细流程
      - code [ref=e6785]: 收到帧 ↓ ① 从帧中提取源 MAC 地址和接收端口 ↓ ② 将 (源MAC, 端口, 时间戳) 写入 MAC 地址表 ↓ ③ 从帧中提取目的 MAC 地址 ↓ ④ 在 MAC 地址表中查找目的 MAC ↓ ├── 找到 → │ ├── 目的端口 = 接收端口 → 丢弃（同一端口，无需转发） │ └── 目的端口 ≠ 接收端口 → 从目的端口转发 │ └── 未找到 → 向除接收端口外的所有端口泛洪（Flooding）
      - paragraph [ref=e6786]:
        - strong [ref=e6787]: MAC 地址表老化机制
        - text: ：
      - list [ref=e6788]:
        - listitem [ref=e6789]: 每条表项有老化时间（通常 300 秒）
        - listitem [ref=e6790]: 时间戳超过老化时间未更新 → 自动删除
        - listitem [ref=e6791]: 目的：适应网络拓扑变化（设备移动后 MAC 地址对应的端口变了）
      - paragraph [ref=e6792]:
        - strong [ref=e6793]: 三种转发方式对比
      - table [ref=e6794]:
        - rowgroup [ref=e6795]:
          - row [ref=e6796]:
            - columnheader "转发方式" [ref=e6797]
            - columnheader "原理" [ref=e6798]
            - columnheader "延迟" [ref=e6799]
            - columnheader "可靠性" [ref=e6800]
            - columnheader "适用场景" [ref=e6801]
        - rowgroup [ref=e6802]:
          - row [ref=e6803]:
            - cell [ref=e6804]:
              - strong [ref=e6805]: 存储转发
            - cell "接收完整帧 → CRC 校验 → 查表转发" [ref=e6806]
            - cell "大（整帧时延）" [ref=e6807]
            - cell "高（过滤错误帧）" [ref=e6808]
            - cell "可靠性要求高" [ref=e6809]
          - row [ref=e6810]:
            - cell [ref=e6811]:
              - strong [ref=e6812]: 直通转发
            - cell "收到目的 MAC（前 6 字节）→ 立即转发" [ref=e6813]
            - cell "极小（固定时延）" [ref=e6814]
            - cell "低（不校验）" [ref=e6815]
            - cell "低延迟要求" [ref=e6816]
          - row [ref=e6817]:
            - cell [ref=e6818]:
              - strong [ref=e6819]: 无碎片转发
            - cell "读取前 64 字节 → 转发" [ref=e6820]
            - cell "中等" [ref=e6821]
            - cell "中（过滤碎片）" [ref=e6822]
            - cell "折中方案" [ref=e6823]
      - blockquote [ref=e6824]:
        - paragraph [ref=e6825]:
          - strong [ref=e6826]: 直通转发的优点
          - text: ：延迟极小（约 10-20 μs），因为只读 6 字节目的 MAC 就开始转发。
          - strong [ref=e6827]: 直通转发的缺点
          - text: ：不校验 CRC，可能转发错误帧；两端速率必须相同（不能在不同速率端口间使用）。
          - strong [ref=e6828]: 无碎片转发
          - text: 的思路：冲突碎片一般小于 64 字节，先读 64 字节过滤掉碎片，再开始转发。是存储转发和直通转发的折中。
      - paragraph [ref=e6829]:
        - strong [ref=e6830]: 交换机广播风暴
      - paragraph [ref=e6831]: 当网络中存在环路时，广播帧会在环路中无限循环，导致带宽耗尽。
      - code [ref=e6833]: 例如：交换机 A ←→ 交换机 B ←→ 交换机 C ←→ 交换机 A（形成三角环路） 广播帧从 A 发出 → B 泛洪 → C 泛洪 → 回到 A → A 又泛洪 → ...
      - paragraph [ref=e6834]:
        - strong [ref=e6835]: 生成树协议 STP（Spanning Tree Protocol）概述
      - list [ref=e6836]:
        - listitem [ref=e6837]:
          - strong [ref=e6838]: 目的
          - text: ：消除二层环路，防止广播风暴
        - listitem [ref=e6839]:
          - strong [ref=e6840]: 原理
          - text: ：通过阻塞某些端口，将物理上有环的网络变成逻辑上无环的树形结构
        - listitem [ref=e6841]:
          - strong [ref=e6842]: 工作过程
          - text: ：
          - list [ref=e6843]:
            - listitem [ref=e6844]: 选举根桥（Root Bridge）：Bridge ID 最小的交换机
            - listitem [ref=e6845]: 每个非根桥选举根端口：到根桥路径最短的端口
            - listitem [ref=e6846]: 每个网段选举指定端口：到根桥路径最短的端口
            - listitem [ref=e6847]: 阻塞其余端口（既不是根端口也不是指定端口的端口）
        - listitem [ref=e6848]:
          - strong [ref=e6849]: IEEE 标准
          - text: ：802.1D（STP）、802.1w（RSTP 快速生成树）、802.1s（MSTP 多生成树）
      - heading "VLAN" [level=3] [ref=e6850]
      - paragraph [ref=e6851]: 虚拟局域网：把一台物理交换机逻辑上分成多个独立广播域。同一个 VLAN 内的主机可以通信，不同 VLAN 间需要通过路由器才能通信。
      - blockquote [ref=e6852]:
        - paragraph [ref=e6853]: 优点：隔离广播、提高安全性、灵活分组。
      - heading "VLAN 深入" [level=4] [ref=e6854]
