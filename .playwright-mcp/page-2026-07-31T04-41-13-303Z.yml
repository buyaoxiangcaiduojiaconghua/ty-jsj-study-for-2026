      - heading "TCP 三次握手（高频！）" [level=3] [ref=e9210]
      - code [ref=e9212]: 客户端 服务器 | | |--- SYN, seq=x --------------->| ① SYN：我要连接 | | |<-- SYN+ACK, seq=y, ack=x+1 --| ② SYN+ACK：收到，同意 | | |--- ACK, seq=x+1, ack=y+1 --->| ③ ACK：好的，连接建立 | |
      - paragraph [ref=e9213]:
        - strong [ref=e9214]: 状态变化
        - text: ：
      - list [ref=e9215]:
        - listitem [ref=e9216]: 客户端：CLOSED → SYN_SENT → ESTABLISHED
        - listitem [ref=e9217]: 服务端：CLOSED → LISTEN → SYN_RCVD → ESTABLISHED
      - paragraph [ref=e9218]:
        - strong [ref=e9219]: 为什么是三次不是两次？
        - text: 因为要防止
        - strong [ref=e9220]: 已失效的连接请求
        - text: 到达服务器。假设第一次握手的 SYN 由于网络延迟很久后才到服务器，如果只有两次握手，服务器收到后直接建立连接分配资源，但客户端已经不认这个连接了，服务器资源就浪费了。三次握手让客户端再确认一次。
      - heading "三次握手状态转换详解" [level=3] [ref=e9221]
      - heading "客户端状态转换（完整版）" [level=4] [ref=e9222]
      - code [ref=e9224]: CLOSED（初始状态，没有连接） ↓ 客户端主动调用 connect()，发送 SYN SYN_SENT（已发送 SYN，等待服务器确认） ↓ 收到服务器的 SYN+ACK，发送 ACK ESTABLISHED（连接已建立，可以收发数据）
      - paragraph [ref=e9225]:
        - strong [ref=e9226]: 客户端状态详解
        - text: ：
      - list [ref=e9227]:
        - listitem [ref=e9228]:
          - strong [ref=e9229]: CLOSED
          - text: ：起始状态，没有连接存在
        - listitem [ref=e9230]:
          - strong [ref=e9231]: SYN_SENT
          - text: ：客户端发送 SYN 后进入此状态，等待服务器的 SYN+ACK。此状态非常短暂，如果长时间停留说明服务器不可达
        - listitem [ref=e9232]:
          - strong [ref=e9233]: ESTABLISHED
          - text: ：收到 SYN+ACK 并回复 ACK 后进入，双方可以正常通信
      - heading "服务端状态转换（完整版）" [level=4] [ref=e9234]
      - code [ref=e9236]: CLOSED（初始状态） ↓ 服务端调用 listen()，被动打开 LISTEN（监听状态，等待客户端连接请求） ↓ 收到客户端 SYN，回复 SYN+ACK SYN_RCVD（已收到 SYN，已发送 SYN+ACK，等待客户端 ACK） ↓ 收到客户端 ACK ESTABLISHED（连接建立完成）
      - paragraph [ref=e9237]:
        - strong [ref=e9238]: 服务端状态详解
        - text: ：
      - list [ref=e9239]:
        - listitem [ref=e9240]:
          - strong [ref=e9241]: LISTEN
          - text: ：服务器调用 listen() 后进入，等待客户端的 SYN 报文
        - listitem [ref=e9242]:
          - strong [ref=e9243]: SYN_RCVD
          - text: ：收到 SYN 并回复 SYN+ACK 后进入，等待客户端最后的 ACK。此状态也是半连接状态
        - listitem [ref=e9244]:
          - strong [ref=e9245]: ESTABLISHED
          - text: ：收到最后的 ACK 后进入
      - heading "SYN Flood 攻击原理和防御" [level=4] [ref=e9246]
      - paragraph [ref=e9247]:
        - strong [ref=e9248]: SYN Flood 攻击
        - text: （SYN 泛洪攻击）：
      - list [ref=e9249]:
        - listitem [ref=e9250]: 攻击者伪造大量不存在的 IP 地址，向服务器发送 SYN 报文
        - listitem [ref=e9251]:
          - text: 服务器回复 SYN+ACK，进入
          - strong [ref=e9252]: SYN_RCVD
          - text: 状态，分配资源等待 ACK
        - listitem [ref=e9253]: 因为源 IP 是伪造的，ACK 永远不会到达
        - listitem [ref=e9254]:
          - text: 服务器维护大量半连接，耗尽资源（
          - strong [ref=e9255]: 半连接队列被打满
          - text: ），无法响应正常请求
      - paragraph [ref=e9256]:
        - strong [ref=e9257]: 防御措施
        - text: ：
      - list [ref=e9258]:
        - listitem [ref=e9259]:
          - strong [ref=e9260]: SYN Cookie
          - text: ：服务器收到 SYN 时不立即分配资源，而是根据 SYN 报文信息计算一个 Cookie 作为初始序号。只有收到合法的 ACK（含正确 Cookie）时才分配资源
        - listitem [ref=e9261]:
          - strong [ref=e9262]: 缩短 SYN Timeout
          - text: ：减少半连接的超时时间
        - listitem [ref=e9263]:
          - strong [ref=e9264]: 增大半连接队列
          - text: ：提高容量上限
        - listitem [ref=e9265]:
          - strong [ref=e9266]: 防火墙/代理
          - text: ：在边界过滤可疑流量
      - heading "为什么是三次握手——完整论证" [level=4] [ref=e9267]
      - paragraph [ref=e9268]:
        - strong [ref=e9269]: 论证一：防止已失效的连接请求（经典例子）
      - paragraph [ref=e9270]: 假设 client 发出的第一个 SYN 在网络中滞留了很久：
      - code [ref=e9272]: 时刻1：client 发 SYN(seq=90) ──→ 网络延迟，未到达 时刻2：client 等不及，超时重发 SYN(seq=100) → 正常建立连接，传完数据，关闭 时刻3：滞留的 SYN(seq=90) 终于到达 server
      - list [ref=e9273]:
        - listitem [ref=e9274]:
          - text: 如果只有两次握手：server 收到滞留的 SYN(seq=90) → 回复 SYN+ACK → 直接进入 ESTABLISHED，分配资源。但 client 已经关闭了，不会理这个 SYN+ACK。
          - strong [ref=e9275]: server 的资源白白浪费
        - listitem [ref=e9276]:
          - text: 有三次握手：server 收到滞留的 SYN(seq=90) → 回复 SYN+ACK → 进入 SYN_RCVD 等待。client 收到 SYN+ACK(ack=91) 后发现不对（自己没发过 seq=90 的连接请求），回复 RST 拒绝。
          - strong [ref=e9277]: server 收到 RST 后释放资源，不会浪费
      - paragraph [ref=e9278]:
        - strong [ref=e9279]: 论证二：同步双方的初始序号
      - paragraph [ref=e9280]: TCP 通信需要双方都知道对方的初始序号（ISN）。三次握手正好完成：
      - list [ref=e9281]:
        - listitem [ref=e9282]: 第一次：client 告诉 server 自己的初始序号 x
        - listitem [ref=e9283]: 第二次：server 告诉 client 自己的初始序号 y，同时确认收到了 x
        - listitem [ref=e9284]: 第三次：client 确认收到了 y
      - blockquote [ref=e9285]:
        - paragraph [ref=e9286]: 两次握手无法完成双向序号同步，四次握手没有必要（SYN+ACK 可以合并）。
      - heading "如果第三次握手 ACK 丢失会怎样？" [level=4] [ref=e9287]
      - list [ref=e9288]:
        - listitem [ref=e9289]: client 发送 ACK 后直接进入 ESTABLISHED，开始发送数据
        - listitem [ref=e9290]: server 在 SYN_RCVD 状态等待 ACK，超时后重传 SYN+ACK
        - listitem [ref=e9291]: 此时 client 已经在发数据了，收到重复的 SYN+ACK 后会再次回复 ACK
        - listitem [ref=e9292]: 如果 client 发出的数据报文先到达 server（数据报文本身就带 ACK 标志），server 也能据此进入 ESTABLISHED
      - blockquote [ref=e9293]:
        - paragraph [ref=e9294]:
          - text: 所以第三次 ACK 丢失
          - strong [ref=e9295]: 不会导致连接建立失败
          - text: ，只是会多一次重传的延迟。
      - heading "TCP 四次挥手" [level=3] [ref=e9296]
      - code [ref=e9298]: 客户端 服务器 | | |--- FIN, seq=u --------------->| ① 客户端：我没数据要发了 | | |<-- ACK, seq=v, ack=u+1 ------| ② 服务器：收到（但服务端可能还有数据要发） | | |<-- FIN, seq=w, ack=u+1 ------| ③ 服务器：我也没数据了，关闭 | | |--- ACK, seq=u+1, ack=w+1 --->| ④ 客户端：好的，关闭 | |
      - paragraph [ref=e9299]:
        - strong [ref=e9300]: 状态变化
        - text: ：
      - list [ref=e9301]:
        - listitem [ref=e9302]: 客户端：ESTABLISHED → FIN_WAIT_1 → FIN_WAIT_2 → TIME_WAIT → CLOSED
        - listitem [ref=e9303]: 服务端：ESTABLISHED → CLOSE_WAIT → LAST_ACK → CLOSED
      - paragraph [ref=e9304]:
        - strong [ref=e9305]: TIME_WAIT 为什么等 2MSL？
      - list [ref=e9306]:
        - listitem [ref=e9307]: 确保最后一个 ACK 能到达服务器（如果丢了服务器会重传 FIN，客户端还能收到再回 ACK）
        - listitem [ref=e9308]: 让本次连接所有报文都在网络中消散，不影响下一次新连接
      - blockquote [ref=e9309]:
        - paragraph [ref=e9310]: MSL（报文最大生存时间）通常为 2 分钟，所以 TIME_WAIT 约 4 分钟。
      - heading "四次挥手状态转换详解（含完整11个状态）" [level=3] [ref=e9311]
      - paragraph [ref=e9312]:
        - text: TCP 连接共有
        - strong [ref=e9313]: 11 种状态
        - text: ，全部列出来：
      - table [ref=e9314]:
