      - separator [ref=e8541]
      - heading "IPv6 详解" [level=3] [ref=e8542]
      - heading "为什么需要 IPv6？" [level=4] [ref=e8543]
      - paragraph [ref=e8544]: IPv4 只有 32 位（约 43 亿个地址），2011 年已经分配完毕。IPv6 用 128 位，地址数量是 2¹²⁸ ≈ 3.4×10³⁸ 个，相当于地球上每粒沙子都能分到一个 IP。
      - heading "IPv6 地址格式" [level=4] [ref=e8545]
      - list [ref=e8546]:
        - listitem [ref=e8547]: 128 位，分为 8 组，每组 4 位十六进制数，用冒号分隔
        - listitem [ref=e8548]:
          - text: 例：
          - code [ref=e8549]: 2001:0db8:0000:0000:0000:ff00:0042:8329
      - paragraph [ref=e8550]:
        - strong [ref=e8551]: 省略规则
        - text: ：
      - list [ref=e8552]:
        - listitem [ref=e8553]:
          - strong [ref=e8554]: 前导零省略
          - text: ：每组中的前导零可以省略。如
          - code [ref=e8555]: "0042"
          - text: →
          - code [ref=e8556]: "42"
          - text: ，
          - code [ref=e8557]: 0db8
          - text: →
          - code [ref=e8558]: db8
        - listitem [ref=e8559]:
          - strong [ref=e8560]: 连续零压缩
          - text: ：一段或多段连续的 0 可以用
          - code [ref=e8561]: "::"
          - text: 代替（
          - strong [ref=e8562]: 只能出现一次
          - text: ，否则无法还原）
        - listitem [ref=e8563]:
          - text: 省略后：
          - code [ref=e8564]: 2001:db8::ff00:42:8329
      - paragraph [ref=e8565]:
        - strong [ref=e8566]: 省略规则练习题
        - text: ：
      - list [ref=e8567]:
        - listitem [ref=e8568]:
          - text: 原始：
          - code [ref=e8569]: 2001:0db8:0000:0000:0000:0000:0000:0001
          - text: → 压缩后：
          - code [ref=e8570]: 2001:db8::1
        - listitem [ref=e8571]:
          - text: 原始：
          - code [ref=e8572]: fe80:0000:0000:0000:0a00:27ff:fe8e:3b6c
          - text: → 压缩后：
          - code [ref=e8573]: fe80::a00:27ff:fe8e:3b6c
        - listitem [ref=e8574]:
          - text: 原始：
          - code [ref=e8575]: 0000:0000:0000:0000:0000:0000:0000:0001
          - text: → 压缩后：
          - code [ref=e8576]: ::1
          - text: （回环地址）
      - blockquote [ref=e8577]:
        - paragraph [ref=e8578]:
          - strong [ref=e8579]: 陷阱
          - text: ：
          - code [ref=e8580]: "::"
          - text: 只能出现一次！如果
          - code [ref=e8581]: 2001::1::2
          - text: 这种写法是错误的，因为无法判断中间省略了几个 0 段。
      - heading "IPv6 地址类型" [level=4] [ref=e8582]
      - table [ref=e8583]:
        - rowgroup [ref=e8584]:
          - row [ref=e8585]:
