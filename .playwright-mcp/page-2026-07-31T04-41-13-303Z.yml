      - heading "附录：考试实战补充" [level=1] [ref=e13259]
      - blockquote [ref=e13260]:
        - paragraph [ref=e13261]: 以下内容基于国网笔试真题和高频考点整理，配合记忆口诀和计算技巧
      - heading "🧮 子网划分快速计算法（块大小法）" [level=2] [ref=e13262]
      - heading "二、子网划分 -- 快速计算技巧与例题" [level=2] [ref=e13263]
      - heading "2.1 核心概念" [level=3] [ref=e13264]
      - paragraph [ref=e13265]: 子网掩码（Subnet Mask）的左边是连续的 1（网络位），右边是连续的 0（主机位）。
      - paragraph [ref=e13266]:
        - strong [ref=e13267]: CIDR 表示法
        - text: ：
        - code [ref=e13268]: 192.168.1.0/24
        - text: ，其中
        - code [ref=e13269]: /24
        - text: 表示前 24 位是网络位，后 8 位是主机位。
      - heading "2.2 核心公式" [level=3] [ref=e13270]
      - list [ref=e13271]:
        - listitem [ref=e13272]:
          - strong [ref=e13273]: 可用主机数
          - text: = 2^h - 2（h = 主机位数，减去全 0 的网络地址和全 1 的广播地址）
        - listitem [ref=e13274]:
          - strong [ref=e13275]: 子网数
          - text: = 2^n（n = 从主机位借给网络位的位数，即子网位数）
        - listitem [ref=e13276]:
          - strong [ref=e13277]: 块大小（Block Size）
          - text: = 256 - 掩码中非 255 的那个字节的值
      - heading "2.3 快速计算技巧：块大小法" [level=3] [ref=e13278]
      - paragraph [ref=e13279]: 这是最实用的方法，不需要转二进制。
      - paragraph [ref=e13280]:
        - strong [ref=e13281]: 步骤：
      - list [ref=e13282]:
        - listitem [ref=e13283]: 找到掩码中不是 255 的那个字节，用 256 减去它，得到"块大小"（即每个子网的大小）
        - listitem [ref=e13284]: 从 0 开始，每次加块大小，得到每个子网的网络地址
        - listitem [ref=e13285]: 广播地址 = 下一个子网网络地址 - 1
        - listitem [ref=e13286]: 可用 IP 范围 = 网络地址 + 1 到 广播地址 - 1
      - heading "2.4 常见掩码速查表" [level=3] [ref=e13287]
      - table [ref=e13288]:
        - rowgroup [ref=e13289]:
          - row [ref=e13290]:
            - columnheader "CIDR" [ref=e13291]
            - columnheader "子网掩码" [ref=e13292]
            - columnheader "块大小" [ref=e13293]
            - columnheader "可用主机数" [ref=e13294]
            - columnheader "主机位数" [ref=e13295]
        - rowgroup [ref=e13296]:
          - row [ref=e13297]:
            - cell "/24" [ref=e13298]
            - cell "255.255.255.0" [ref=e13299]
            - cell "256" [ref=e13300]
            - cell "254" [ref=e13301]
            - cell "8" [ref=e13302]
          - row [ref=e13303]:
            - cell "/25" [ref=e13304]
            - cell "255.255.255.128" [ref=e13305]
            - cell "128" [ref=e13306]
            - cell "126" [ref=e13307]
            - cell "7" [ref=e13308]
          - row [ref=e13309]:
            - cell "/26" [ref=e13310]
            - cell "255.255.255.192" [ref=e13311]
            - cell "64" [ref=e13312]
            - cell "62" [ref=e13313]
            - cell "6" [ref=e13314]
          - row [ref=e13315]:
            - cell "/27" [ref=e13316]
            - cell "255.255.255.224" [ref=e13317]
            - cell "32" [ref=e13318]
            - cell "30" [ref=e13319]
            - cell "5" [ref=e13320]
          - row [ref=e13321]:
            - cell "/28" [ref=e13322]
            - cell "255.255.255.240" [ref=e13323]
            - cell "16" [ref=e13324]
            - cell "14" [ref=e13325]
            - cell "4" [ref=e13326]
          - row [ref=e13327]:
            - cell "/29" [ref=e13328]
            - cell "255.255.255.248" [ref=e13329]
            - cell "8" [ref=e13330]
            - cell "6" [ref=e13331]
            - cell "3" [ref=e13332]
          - row [ref=e13333]:
            - cell "/30" [ref=e13334]
            - cell "255.255.255.252" [ref=e13335]
            - cell "4" [ref=e13336]
            - cell "2" [ref=e13337]
            - cell "2" [ref=e13338]
          - row [ref=e13339]:
            - cell "/31" [ref=e13340]
            - cell "255.255.255.254" [ref=e13341]
            - cell "2" [ref=e13342]
            - cell "2（点对点,无网络/广播地址）" [ref=e13343]
            - cell "1" [ref=e13344]
          - row [ref=e13345]:
            - cell "/32" [ref=e13346]
            - cell "255.255.255.255" [ref=e13347]
            - cell "1" [ref=e13348]
            - cell "1（单主机）" [ref=e13349]
            - cell "0" [ref=e13350]
      - paragraph [ref=e13351]:
        - strong [ref=e13352]: 记忆技巧
        - text: ：掩码中特殊字节的值 = 256 - 2^(8 - CIDR后缀)
      - paragraph [ref=e13353]:
        - text: 例如
        - code [ref=e13354]: /26
        - text: ：8 - 2（26-24）= 2，2^2 = 4，256 - 4 = 252... 不对，让我重新算。
      - paragraph [ref=e13355]:
        - text: 实际上
        - code [ref=e13356]: /26
        - text: 借了 2 位（26-24=2），块大小 = 2^(8-2) = 2^6 = 64，掩码 = 256 - 64 = 192。
      - paragraph [ref=e13357]:
        - strong [ref=e13358]: 更简单的记忆
        - text: ：记住块大小 = 2^(8 - 借位数)，掩码 = 256 - 块大小。
      - heading "2.5 例题详解" [level=3] [ref=e13359]
      - paragraph [ref=e13360]:
        - strong [ref=e13361]: 例题 1：
        - text: 将
        - code [ref=e13362]: 192.168.1.0/24
        - text: 划分为 4 个子网，求每个子网的网络地址、广播地址、可用 IP 范围。
      - paragraph [ref=e13363]:
        - strong [ref=e13364]: 解：
      - list [ref=e13365]:
        - listitem [ref=e13366]: 4 个子网需要借 log2(4) = 2 位，新掩码 = /24 + 2 = /26
        - listitem [ref=e13367]: 掩码 = 255.255.255.192，块大小 = 256 - 192 = 64
      - table [ref=e13368]:
        - rowgroup [ref=e13369]:
          - row [ref=e13370]:
            - columnheader "子网" [ref=e13371]
            - columnheader "网络地址" [ref=e13372]
            - columnheader "广播地址" [ref=e13373]
            - columnheader "可用 IP 范围" [ref=e13374]
        - rowgroup [ref=e13375]:
          - row [ref=e13376]:
            - cell "1" [ref=e13377]
            - cell "192.168.1.0" [ref=e13378]
            - cell "192.168.1.63" [ref=e13379]
            - cell "192.168.1.1 ~ 192.168.1.62" [ref=e13380]
          - row [ref=e13381]:
            - cell "2" [ref=e13382]
            - cell "192.168.1.64" [ref=e13383]
            - cell "192.168.1.127" [ref=e13384]
            - cell "192.168.1.65 ~ 192.168.1.126" [ref=e13385]
          - row [ref=e13386]:
            - cell "3" [ref=e13387]
            - cell "192.168.1.128" [ref=e13388]
            - cell "192.168.1.191" [ref=e13389]
            - cell "192.168.1.129 ~ 192.168.1.190" [ref=e13390]
          - row [ref=e13391]:
            - cell "4" [ref=e13392]
            - cell "192.168.1.192" [ref=e13393]
            - cell "192.168.1.255" [ref=e13394]
            - cell "192.168.1.193 ~ 192.168.1.254" [ref=e13395]
      - paragraph [ref=e13396]:
        - strong [ref=e13397]: 例题 2：
        - text: 某部门需要 30 个可用 IP，应使用什么掩码？
      - paragraph [ref=e13398]:
        - strong [ref=e13399]: 解：
      - list [ref=e13400]:
        - listitem [ref=e13401]: 30 个可用 IP，需要 2^h - 2 >= 30，即 h >= 5（2^5 - 2 = 30）
        - listitem [ref=e13402]: 主机位 5 位，网络位 = 32 - 5 = 27
        - listitem [ref=e13403]: 掩码 = /27，即 255.255.255.224，块大小 = 32
      - paragraph [ref=e13404]:
        - strong [ref=e13405]: 例题 3：
        - code [ref=e13406]: 172.16.0.0/16
        - text: 需要划分 512 个子网，每个子网最大主机数是多少？
      - paragraph [ref=e13407]:
        - strong [ref=e13408]: 解：
      - list [ref=e13409]:
        - listitem [ref=e13410]: 512 个子网需要借 9 位（2^9 = 512），新掩码 = /16 + 9 = /25
        - listitem [ref=e13411]: 主机位 = 32 - 25 = 7 位
        - listitem [ref=e13412]: 可用主机数 = 2^7 - 2 = 126 台
      - heading "2.6 常见陷阱" [level=3] [ref=e13413]
      - list [ref=e13414]:
        - listitem [ref=e13415]:
          - strong [ref=e13416]: 忘记减 2
          - text: ：可用主机数 = 2^h - 2，不是 2^h。全 0 是网络地址，全 1 是广播地址，都不能配给主机。
        - listitem [ref=e13417]:
          - strong [ref=e13418]: 子网数和主机数的取舍方向
          - text: ：借位越多，子网越多，但每个子网的主机越少。这是此消彼长的关系。
        - listitem [ref=e13419]:
          - strong [ref=e13420]: /31 掩码的特殊性
          - text: ：点对点链路中，/31 不需要减 2，两个地址都可以用。
        - listitem [ref=e13421]:
          - strong [ref=e13422]: 非连续子网掩码
          - text: ：实际中不常见，但理论上子网掩码的 1 不一定是连续的（考试中一般只考虑连续的情况）。
      - separator [ref=e13423]
      - separator [ref=e13424]
      - heading "📐 奈奎斯特与香农定理计算技巧" [level=2] [ref=e13425]
      - heading "三、奈奎斯特与香农定理 -- 计算题公式与解题步骤" [level=2] [ref=e13426]
      - heading "3.1 两个定理的区别" [level=3] [ref=e13427]
      - table [ref=e13428]:
        - rowgroup [ref=e13429]:
          - row [ref=e13430]:
            - columnheader [ref=e13431]
            - columnheader "奈奎斯特定理（Nyquist）" [ref=e13432]
            - columnheader "香农定理（Shannon）" [ref=e13433]
        - rowgroup [ref=e13434]:
          - row [ref=e13435]:
            - cell [ref=e13436]:
              - strong [ref=e13437]: 适用场景
            - cell "理想信道，无噪声" [ref=e13438]
            - cell "实际信道，有噪声" [ref=e13439]
          - row [ref=e13440]:
            - cell [ref=e13441]:
              - strong [ref=e13442]: 核心变量
            - cell "带宽 W，码元状态数 V" [ref=e13443]
            - cell "带宽 W，信噪比 S/N" [ref=e13444]
          - row [ref=e13445]:
            - cell [ref=e13446]:
              - strong [ref=e13447]: 公式
            - cell "C = 2W * log2(V)" [ref=e13448]
            - cell "C = W * log2(1 + S/N)" [ref=e13449]
          - row [ref=e13450]:
            - cell [ref=e13451]:
              - strong [ref=e13452]: 单位
            - cell "C = bps，W = Hz" [ref=e13453]
            - cell "C = bps，W = Hz" [ref=e13454]
          - row [ref=e13455]:
            - cell [ref=e13456]:
              - strong [ref=e13457]: 本质
            - cell "码元速率上限" [ref=e13458]
            - cell "信道容量极限" [ref=e13459]
      - heading "3.2 公式详解" [level=3] [ref=e13460]
      - paragraph [ref=e13461]:
        - strong [ref=e13462]: 奈奎斯特定理（无噪声）：
      - code [ref=e13464]: 最大数据传输速率 C = 2W * log2(V)
      - list [ref=e13465]:
        - listitem [ref=e13466]: W：信道带宽（单位：Hz）
        - listitem [ref=e13467]: V：码元的状态数（离散电平数），如二进制 V=2，四进制 V=4
        - listitem [ref=e13468]: 当 V=2 时，C = 2W（这也是最常见的考察形式）
      - paragraph [ref=e13469]:
        - strong [ref=e13470]: 香农定理（有噪声）：
      - code [ref=e13472]: 信道容量 C = W * log2(1 + S/N)
      - list [ref=e13473]:
        - listitem [ref=e13474]: W：信道带宽（单位：Hz）
        - listitem [ref=e13475]:
          - text: S/N：信噪比，是
          - strong [ref=e13476]: 比值（无单位）
          - text: ，不是 dB
        - listitem [ref=e13477]:
          - text: 如果题目给的是 dB，需要先转换：
          - strong [ref=e13478]: S/N = 10^(dB/10)
      - paragraph [ref=e13479]:
        - strong [ref=e13480]: 注意：
        - text: 实际最大速率取两者中较小的那个。
      - heading "3.3 信噪比 dB 转换（重点）" [level=3] [ref=e13481]
      - paragraph [ref=e13482]: 题目经常给信噪比为 30dB，需要换算成比值：
      - code [ref=e13484]: S/N = 10^(dB/10) 例如：30dB → S/N = 10^(30/10) = 10^3 = 1000 20dB → S/N = 10^(20/10) = 10^2 = 100 10dB → S/N = 10^(10/10) = 10^1 = 10
      - paragraph [ref=e13485]:
        - strong [ref=e13486]: 记忆技巧
        - text: ：dB 值每增加 10，S/N 比值乘以 10；每增加 3，S/N 比值约乘以 2。
      - heading "3.4 例题详解" [level=3] [ref=e13487]
      - paragraph [ref=e13488]:
        - strong [ref=e13489]: 例题 1（香农定理）：
        - text: 一个带宽为 3kHz 的信道，信噪比为 30dB，求最大数据传输速率。
      - paragraph [ref=e13490]:
        - strong [ref=e13491]: 解：
      - code [ref=e13493]: 步骤 1：将 dB 转换为比值 S/N = 10^(30/10) = 10^3 = 1000 步骤 2：代入香农公式 C = W * log2(1 + S/N) = 3000 * log2(1 + 1000) = 3000 * log2(1001) ≈ 3000 * 10 （因为 log2(1001) ≈ log2(1024) = 10） ≈ 30000 bps ≈ 30 kbps
      - paragraph [ref=e13494]:
        - strong [ref=e13495]: 例题 2（奈奎斯特+香农结合）：
        - text: 一个带宽为 4kHz 的信道，信噪比为 30dB，使用 4 种码元状态（V=4），求最大数据传输速率。
      - paragraph [ref=e13496]:
        - strong [ref=e13497]: 解：
      - code [ref=e13499]: 步骤 1：先算奈奎斯特上限 C_nyquist = 2W * log2(V) = 2 * 4000 * log2(4) = 8000 * 2 = 16000 bps 步骤 2：再算香农上限 S/N = 10^(30/10) = 1000 C_shannon = W * log2(1 + S/N) = 4000 * log2(1001) ≈ 4000 * 10 = 40000 bps 步骤 3：取较小值 C = min(16000, 40000) = 16000 bps = 16 kbps
      - paragraph [ref=e13500]:
        - strong [ref=e13501]: 例题 3（纯奈奎斯特）：
        - text: 一条无噪声信道带宽为 6MHz，使用 QPSK 调制（4 种相位状态，V=4），求最大速率。
      - paragraph [ref=e13502]:
        - strong [ref=e13503]: 解：
      - code [ref=e13505]: C = 2W * log2(V) = 2 * 6*10^6 * log2(4) = 12*10^6 * 2 = 24 Mbps
      - heading "3.5 常见陷阱" [level=3] [ref=e13506]
      - list [ref=e13507]:
        - listitem [ref=e13508]:
          - strong [ref=e13509]: dB 忘记转换
          - text: ：最常见的错误！题目给的是"dB"，代入公式前必须换算成比值。
        - listitem [ref=e13510]:
          - strong [ref=e13511]: log2 近似值
          - text: ：考试中 log2(1001) 通常近似为 log2(1024) = 10，这是合理的近似。
        - listitem [ref=e13512]:
          - strong [ref=e13513]: 取最小值
          - text: ：如果同时给了奈奎斯特和香农的条件，要取两者中较小的。因为实际速率受限于最严格的那个条件。
        - listitem [ref=e13514]:
          - strong [ref=e13515]: 单位换算
          - text: ：带宽常用 kHz 或 MHz，结果单位是 bps（或 kbps/Mbps）。3kHz 要写成 3000Hz 代入公式。
        - listitem [ref=e13516]:
          - strong [ref=e13517]: V 的含义
          - text: ：V 是码元状态数，不是比特数。二进制 V=2，QPSK 的 V=4，16QAM 的 V=16。
