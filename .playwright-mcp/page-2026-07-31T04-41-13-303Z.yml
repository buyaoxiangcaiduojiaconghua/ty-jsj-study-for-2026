            - cell "Basic Service Set" [ref=e13945]
            - cell "一个AP覆盖的范围（基本服务集）" [ref=e13946]
          - row [ref=e13947]:
            - cell "ESS" [ref=e13948]
            - cell "Extended Service Set" [ref=e13949]
            - cell "多个BSS通过有线网络互联（扩展服务集）" [ref=e13950]
          - row [ref=e13951]:
            - cell "DS" [ref=e13952]
            - cell "Distribution System" [ref=e13953]
            - cell "分布式系统，连接多个 AP 的有线骨干网" [ref=e13954]
      - blockquote [ref=e13955]:
        - paragraph [ref=e13956]:
          - strong [ref=e13957]: BSS vs ESS
          - text: ：BSS 是一个 AP 覆盖的范围（像一个小房间），ESS 是多个 AP 通过有线骨干网连接起来覆盖整栋楼（像一个大楼）。手机在 ESS 内移动时，可以从一个 AP 漫游到另一个 AP，IP 不变、连接不断。
      - heading "CSMA/CA vs CSMA/CD" [level=3] [ref=e13958]
      - blockquote [ref=e13959]:
        - paragraph [ref=e13960]: 无线网络为什么不直接用 CSMA/CD？因为无线环境检测碰撞很难（发送时自己的信号太强，听不到别人的）。
      - heading "为什么无线网络不能用 CSMA/CD？" [level=4] [ref=e13961]
      - paragraph [ref=e13962]: 三个核心原因：
      - table [ref=e13963]:
        - rowgroup [ref=e13964]:
          - row [ref=e13965]:
            - columnheader "原因" [ref=e13966]
            - columnheader "详细解释" [ref=e13967]
        - rowgroup [ref=e13968]:
          - row [ref=e13969]:
            - cell [ref=e13970]:
              - strong [ref=e13971]: 信号强度差异
            - cell "无线信号随距离衰减很快。站点 A 发送时，自己的信号强度是满格的（比如 100dBm），而远处站点 C 发来的信号可能在 A 处只有 1dBm。A 的信号瞬间把 C 的信号\"淹没\"了，根本听不到碰撞。就像你戴着耳机听摇滚乐，根本听不到别人在隔壁说话。" [ref=e13972]
          - row [ref=e13973]:
            - cell [ref=e13974]:
              - strong [ref=e13975]: 隐藏终端问题
            - cell "有线以太网中，所有站点连在同一根线上，信号互相都能听到。无线网络中，A 和 C 都能和中间 AP 通信，但 A 和 C 之间物理距离太远或有障碍物，互相听不到对方。如果 A 和 C 同时发，在 AP 处就会碰撞——但 A 和 C 都检测不到这个碰撞。这是有线网络中不存在的问题。" [ref=e13976]
          - row [ref=e13977]:
            - cell [ref=e13978]:
              - strong [ref=e13979]: 硬件限制
            - cell "实现全双工碰撞检测需要收发同时工作在同一频率上，这在无线设备中成本极高且效果差（天线既要发又要收，信号自干扰严重）。所以 Wi-Fi 是半双工的——同一时刻只能发或收，不能同时。" [ref=e13980]
      - heading "CSMA/CD vs CSMA/CA 10+维度对比表" [level=4] [ref=e13981]
      - table [ref=e13982]:
        - rowgroup [ref=e13983]:
          - row [ref=e13984]:
            - columnheader "对比维度" [ref=e13985]
            - columnheader "CSMA/CD（有线）" [ref=e13986]
            - columnheader "CSMA/CA（无线）" [ref=e13987]
        - rowgroup [ref=e13988]:
          - row [ref=e13989]:
            - cell "全称" [ref=e13990]
            - cell [ref=e13991]:
              - text: Carrier Sense Multiple Access with
              - strong [ref=e13992]: Collision Detection
            - cell [ref=e13993]:
              - text: Carrier Sense Multiple Access with
              - strong [ref=e13994]: Collision Avoidance
          - row [ref=e13995]:
            - cell "中文" [ref=e13996]
            - cell [ref=e13997]:
              - text: 载波侦听多路访问/
              - strong [ref=e13998]: 碰撞检测
            - cell [ref=e13999]:
              - text: 载波侦听多路访问/
              - strong [ref=e14000]: 碰撞避免
          - row [ref=e14001]:
            - cell "使用环境" [ref=e14002]
            - cell "有线以太网（802.3）" [ref=e14003]
            - cell "无线局域网 WLAN（802.11）" [ref=e14004]
          - row [ref=e14005]:
            - cell "碰撞检测" [ref=e14006]
            - cell [ref=e14007]:
              - strong [ref=e14008]: 能检测
              - text: （边发边听，比较收发信号）
            - cell [ref=e14009]:
              - strong [ref=e14010]: 无法检测
              - text: （无线信号自身太强，遮蔽了碰撞）
          - row [ref=e14011]:
            - cell "策略" [ref=e14012]
            - cell "检测到碰撞 → 立即停止 → 随机后退" [ref=e14013]
            - cell [ref=e14014]:
              - strong [ref=e14015]: 信道空闲 → 等待随机时间 → 发送 → 等 ACK 确认
          - row [ref=e14016]:
