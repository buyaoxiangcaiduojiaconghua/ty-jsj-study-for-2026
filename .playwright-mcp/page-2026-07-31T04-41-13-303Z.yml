        - rowgroup [ref=e10629]:
          - row [ref=e10630]:
            - cell [ref=e10631]:
              - strong [ref=e10632]: A
            - cell "Address" [ref=e10633]
            - cell "域名 → IPv4 地址" [ref=e10634]
            - cell [ref=e10635]:
              - code [ref=e10636]: www.example.com → 93.184.216.34
          - row [ref=e10637]:
            - cell [ref=e10638]:
              - strong [ref=e10639]: AAAA
            - cell "Quad-A" [ref=e10640]
            - cell "域名 → IPv6 地址" [ref=e10641]
