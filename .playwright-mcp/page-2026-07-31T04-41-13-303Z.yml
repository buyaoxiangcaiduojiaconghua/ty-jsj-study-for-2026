              - text: ，替代 WPA2 的 PSK
          - row [ref=e14996]:
            - cell "防暴力破解" [ref=e14997]
            - cell "每次密码猜测都要和 AP 交互，无法离线抓包破解" [ref=e14998]
          - row [ref=e14999]:
            - cell "前向安全" [ref=e15000]
            - cell "即使密码被破解，历史通信仍无法解密" [ref=e15001]
          - row [ref=e15002]:
            - cell "公共 Wi-Fi 安全" [ref=e15003]
            - cell "OWE（机会无线加密），开放网络也能加密，不需要密码" [ref=e15004]
          - row [ref=e15005]:
            - cell "192 位安全" [ref=e15006]
            - cell "企业版支持 192 位加密，满足政府和国防要求" [ref=e15007]
      - blockquote [ref=e15008]:
        - paragraph [ref=e15009]:
          - strong [ref=e15010]: SAE vs PSK
          - text: ：WPA2 的 PSK 方式是抓包后可以离线跑字典暴力破解；WPA3 的 SAE 方式是每次密码猜测都在线交互，猜错一次就要重新握手，暴力破解难度极大增加。
      - heading "例题与解析" [level=3] [ref=e15011]
      - paragraph [ref=e15012]:
        - strong [ref=e15013]: 例题 1（CSMA/CD vs CSMA/CA 区别）
        - text: ：以下关于 CSMA/CD 和 CSMA/CA 的说法，错误的是？
      - paragraph [ref=e15014]: A. CSMA/CD 用于有线以太网，CSMA/CA 用于无线局域网B. CSMA/CD 采用碰撞检测策略，CSMA/CA 采用碰撞避免策略C. CSMA/CA 不需要 ACK 确认，因为无线环境碰撞概率低D. CSMA/CA 使用 RTS/CTS 机制解决隐藏终端问题
      - paragraph [ref=e15015]:
        - strong [ref=e15016]: 解析
        - text: ：C 错误。CSMA/CA
        - strong [ref=e15017]: 需要 ACK 确认
        - text: ，这是无线网络的特点——因为无法检测碰撞，只能通过"是否收到 ACK"来判断是否发送成功。CSMA/CD 因为边发边听能检测碰撞，反而可以不用 ACK。
      - paragraph [ref=e15018]:
        - strong [ref=e15019]: 答案：C
      - separator [ref=e15020]
      - paragraph [ref=e15021]:
        - strong [ref=e15022]: 例题 2（隐藏终端/暴露终端场景判断）
        - text: ：站点 A 和 B 在一个 BSS 内，站点 C 和 AP 在另一个 BSS 内。A 正在给 B 发送数据，此时 C 想给 AP 发送数据。C 监听信道发现信道忙（能听到 A 的信号），于是 C 不发送。但实际上 C 给 AP 发数据并不会干扰 B 的接收。这个现象属于？
      - paragraph [ref=e15023]: A. 隐藏终端问题B. 暴露终端问题C. 远近效应D. 信道衰落
      - paragraph [ref=e15024]:
        - strong [ref=e15025]: 解析
        - text: ：C 能听到 A 的信号，但 C→AP 并不干扰 B 的接收，这是典型的
        - strong [ref=e15026]: 暴露终端
        - text: 问题——C 属于"该发发不了"，白白浪费了信道。隐藏终端是"该发却在发"导致碰撞。
      - paragraph [ref=e15027]:
        - strong [ref=e15028]: 答案：B
      - separator [ref=e15029]
      - paragraph [ref=e15030]:
        - strong [ref=e15031]: 例题 3（移动 IP 三角路由）
        - text: ：关于移动 IP 的三角路由问题，以下说法正确的是？
      - paragraph [ref=e15032]: A. 三角路由是指 CN→MN→HA→CN 的路径B. 通信对方 CN 发给 MN 的包总是先到 HA，再由 HA 通过隧道发给 MN 的转交地址C. MN 回复 CN 的包也必须经过 HAD. 三角路由问题在 IPv6 移动 IP 中没有得到解决
      - paragraph [ref=e15033]:
        - strong [ref=e15034]: 解析
        - text: ：B 正确。三角路由的核心是 CN→HA→MN 这条绕路路径。A 错误，路径是 CN→HA→MN（不是 CN→MN→HA→CN）。C 错误，MN 可以直接回复 CN (不需要经过 HA)。D 错误，IPv6 移动 IP 通过绑定更新机制优化了三角路由。
      - paragraph [ref=e15035]:
        - strong [ref=e15036]: 答案：B
      - separator [ref=e15037]
      - paragraph [ref=e15038]:
        - strong [ref=e15039]: 例题 4（5G 三大场景匹配）
        - text: ：将以下 5G 应用场景与对应的三大场景（eMBB/uRLLC/mMTC）匹配：
      - paragraph [ref=e15040]: （1）AR/VR 全息直播（2）远程手术（3）智能电表抄表（4）8K 超高清视频（5）自动驾驶（6）环境监测传感器网络
      - paragraph [ref=e15041]: A. (1)(4)→eMBB、(2)(5)→uRLLC、(3)(6)→mMTCB. (1)(2)→eMBB、(3)(4)→uRLLC、(5)(6)→mMTCC. (1)(3)→eMBB、(2)(4)→uRLLC、(5)(6)→mMTCD. (1)(5)→eMBB、(2)(3)→uRLLC、(4)(6)→mMTC
      - paragraph [ref=e15042]:
        - strong [ref=e15043]: 解析
        - text: ：eMBB 强调高速率，对应 AR/VR 和 8K 视频；uRLLC 强调低时延高可靠，对应远程手术和自动驾驶；mMTC 强调海量连接，对应智能电表和环境监测。
      - paragraph [ref=e15044]:
        - strong [ref=e15045]: 答案：A
      - separator [ref=e15046]
      - paragraph [ref=e15047]:
        - strong [ref=e15048]: 例题 5（蓝牙/NFC 参数对比）
        - text: ：以下关于蓝牙和 NFC 的说法，正确的是？
      - paragraph [ref=e15049]: A. 蓝牙和 NFC 都工作在 2.4GHz 频段B. 蓝牙微微网（Piconet）最多支持 1 个主设备和 8 个活跃从设备C. NFC 的三种工作模式分别是卡模拟模式、读写器模式、点对点模式D. 蓝牙 5.0 的 BLE 传输速率是 10Mbps
      - paragraph [ref=e15050]:
        - strong [ref=e15051]: 解析
        - text: ：C 正确。A 错误，蓝牙工作在 2.4GHz，NFC 工作在 13.56MHz。B 错误，微微网最多 1 主 + 7 活跃从设备（不是 8 个）。D 错误，蓝牙 5.0 的 BLE 速率是 2Mbps（不是 10Mbps）。
      - paragraph [ref=e15052]:
        - strong [ref=e15053]: 答案：C
      - separator [ref=e15054]
      - heading "易错陷阱" [level=3] [ref=e15055]
      - table [ref=e15056]:
        - rowgroup [ref=e15057]:
          - row [ref=e15058]:
            - columnheader "#" [ref=e15059]
            - columnheader "陷阱" [ref=e15060]
            - columnheader "正确理解" [ref=e15061]
        - rowgroup [ref=e15062]:
          - row [ref=e15063]:
            - cell "1" [ref=e15064]
            - cell "CSMA/CA 和 CSMA/CD 都用了碰撞检测" [ref=e15065]
            - cell [ref=e15066]:
              - strong [ref=e15067]: 错！
              - text: CSMA/CA 用的是
              - strong [ref=e15068]: 碰撞避免
              - text: （Avoidance），因为无线环境无法检测碰撞（信号自身太强，掩盖了远端的碰撞信号）
          - row [ref=e15069]:
            - cell "2" [ref=e15070]
            - cell "无线网络用 ACK 只是为了可靠性" [ref=e15071]
            - cell [ref=e15072]:
              - strong [ref=e15073]: 不完全对！
              - text: 无线网络用 ACK 还有一个更重要的原因——
              - strong [ref=e15074]: 替代碰撞检测
              - text: 。因为无法检测碰撞，只能通过"收没收到 ACK"来判断发送是否成功
          - row [ref=e15075]:
            - cell "3" [ref=e15076]
            - cell "RTS/CTS 是 CSMA/CA 的必选机制" [ref=e15077]
            - cell [ref=e15078]:
              - strong [ref=e15079]: 错！
              - text: RTS/CTS 是
              - strong [ref=e15080]: 可选
              - text: 机制，通常只在长帧传输时开启。短帧直接用基本 CSMA/CA 更高效，因为 RTS/CTS 本身也有开销
          - row [ref=e15081]:
            - cell "4" [ref=e15082]
            - cell "隐藏终端和暴露终端是同一个问题" [ref=e15083]
            - cell [ref=e15084]:
              - strong [ref=e15085]: 错！
              - text: 隐藏终端是"该发不敢发导致碰撞"（A 和 C 听不到彼此，同时发给 B 导致碰撞）；暴露终端是"敢发不能发导致浪费"（C 听到 A 就不敢发，但其实 C 发给 D 不干扰 B）
          - row [ref=e15086]:
            - cell "5" [ref=e15087]
            - cell "RTS/CTS 能完美解决隐藏终端和暴露终端" [ref=e15088]
            - cell [ref=e15089]:
              - strong [ref=e15090]: 错！
              - text: RTS/CTS 能解决隐藏终端，但
              - strong [ref=e15091]: 不能完全解决暴露终端
              - text: 。暴露终端在基本 CSMA/CA 框架下没有完美解决方案
          - row [ref=e15092]:
            - cell "6" [ref=e15093]
            - cell "移动 IP 的三角路由中，MN 回复 CN 也必须经过 HA" [ref=e15094]
            - cell [ref=e15095]:
              - strong [ref=e15096]: 错！
              - text: MN 回复 CN 可以直接发送（不经过 HA），只有 CN 发给 MN 的数据才需要经过 HA 转发。所以是"三角"（CN→HA→MN，MN→CN 直接）
          - row [ref=e15097]:
            - cell "7" [ref=e15098]
            - cell "蓝牙 4.0 的 BLE 是经典蓝牙的升级版" [ref=e15099]
            - cell [ref=e15100]:
              - strong [ref=e15101]: 错！
              - text: BLE 和经典蓝牙使用
              - strong [ref=e15102]: 不同的物理层和协议栈
              - text: ，两者互不兼容但可以共存于同一芯片。BLE 是全新的低功耗方案，不是经典蓝牙的升级
          - row [ref=e15103]:
            - cell "8" [ref=e15104]
            - cell "NFC = RFID" [ref=e15105]
            - cell [ref=e15106]:
              - strong [ref=e15107]: 错！
              - text: NFC 是 RFID 的
              - strong [ref=e15108]: 一个子集
              - text: ，工作在 13.56MHz（HF 频段），通信距离 < 10cm。RFID 范围更广，还包括低频和超高频
          - row [ref=e15109]:
            - cell "9" [ref=e15110]
            - cell "WPA2 是绝对安全的" [ref=e15111]
            - cell [ref=e15112]:
              - strong [ref=e15113]: 不完全是！
              - text: WPA2 的 PSK 模式存在离线暴力破解漏洞（KRACK 攻击），WPA3 引入 SAE 握手解决了这个问题
          - row [ref=e15114]:
            - cell "10" [ref=e15115]
            - cell "5G 就是为了让手机上网更快" [ref=e15116]
            - cell [ref=e15117]:
              - strong [ref=e15118]: 不全面！
              - text: 5G 有三大场景，eMBB 是"更快"（给人用的），uRLLC 是"更可靠更低延迟"（给机器用的），mMTC 是"更多连接"（给物联网用的）。后两者才是 5G 的革命性所在
      - heading "记忆口诀" [level=3] [ref=e15119]
      - paragraph [ref=e15120]:
        - strong [ref=e15121]: 802.11 协议族演进：
      - code [ref=e15123]: b → g → n → ac → ax → be 爸 哥 你 爱看 爱学习 必赢 速率从 11M 到 54M 到 600M 到 6.9G 到 9.6G 到 46G
      - paragraph [ref=e15124]:
