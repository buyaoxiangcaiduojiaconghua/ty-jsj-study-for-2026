            - cell "7" [ref=e10397]
            - cell "11" [ref=e10398]
            - cell "快恢复阶段" [ref=e10399]
      - paragraph [ref=e10400]:
        - strong [ref=e10401]: 答案
        - text: ：第 7 轮发送时 cwnd = 11。
      - separator [ref=e10402]
      - heading "例题 3：流量控制窗口题" [level=4] [ref=e10403]
      - paragraph [ref=e10404]:
        - strong [ref=e10405]: 题目
        - text: ：主机 A 向主机 B 发送数据。A 的发送窗口为 4000 字节，A 已发送但未收到确认的数据为 2000 字节。此时 B 发来 ACK，确认号为 1001，rwnd=3000。求 A 新的发送窗口大小和还可以发送的字节数。
      - paragraph [ref=e10406]:
        - strong [ref=e10407]: 解题
        - text: ：
      - list [ref=e10408]:
        - listitem [ref=e10409]: A 收到 ACK=1001，说明字节 1~1000 已被确认，窗口向前滑动
        - listitem [ref=e10410]: 新的发送窗口 = min(cwnd, rwnd) = min(4000, 3000) = 3000 字节
        - listitem [ref=e10411]:
          - text: 已发送但未确认的 2000 字节中，字节 1
          - deletion [ref=e10412]: 1000 已确认，剩余 1001
          - text: 2000 未确认 = 1000 字节
        - listitem [ref=e10413]: 还可以发送 = 新窗口 - 已发送未确认 = 3000 - 1000 = 2000 字节
      - paragraph [ref=e10414]:
        - strong [ref=e10415]: 答案
        - text: ：新发送窗口 = 3000 字节，还可以发送 2000 字节。
      - separator [ref=e10416]
      - heading "例题 4：TCP 首部字段识别题" [level=4] [ref=e10417]
      - paragraph [ref=e10418]:
        - strong [ref=e10419]: 题目
        - text: ：以下是 TCP 首部中的一些字段，哪些字段用于流量控制？（多选）
      - paragraph [ref=e10420]: A. 序号 B. 确认号 C. 窗口大小 D. 紧急指针 E. 校验和
      - paragraph [ref=e10421]:
        - strong [ref=e10422]: 答案
        - text: ：C
      - paragraph [ref=e10423]:
        - strong [ref=e10424]: 解析
        - text: ：
      - list [ref=e10425]:
        - listitem [ref=e10426]: 窗口大小（16 bit）是 TCP 流量控制的核心字段，接收方通过它告诉发送方"我还能接收多少数据"
        - listitem [ref=e10427]:
          - text: 序号和确认号用于
          - strong [ref=e10428]: 可靠传输
          - text: （保证数据有序、不丢、不重）
        - listitem [ref=e10429]:
          - text: 校验和用于
          - strong [ref=e10430]: 差错检测
        - listitem [ref=e10431]:
          - text: 紧急指针用于
          - strong [ref=e10432]: 紧急数据
          - text: 定位
      - separator [ref=e10433]
      - heading "例题 5：综合判断题" [level=4] [ref=e10434]
      - paragraph [ref=e10435]:
        - strong [ref=e10436]: 题目
        - text: ：以下关于 TCP 的描述，正确的是？（多选）
      - paragraph [ref=e10437]: A. TCP 提供面向连接的可靠字节流服务 B. TCP 的拥塞控制包括慢开始、拥塞避免、快重传和快恢复 C. 在 TCP 连接中，主动关闭连接的一方会进入 TIME_WAIT 状态 D. TCP 首部中的确认号是指"已经收到的最后一个字节的序号" E. TCP 的滑动窗口机制既用于流量控制也用于拥塞控制
      - paragraph [ref=e10438]:
        - strong [ref=e10439]: 答案
        - text: ：A、B、C
      - paragraph [ref=e10440]:
        - strong [ref=e10441]: 解析
        - text: ：
      - list [ref=e10442]:
        - listitem [ref=e10443]: A 正确：TCP 是面向连接的，提供可靠字节流传输
        - listitem [ref=e10444]: B 正确：四个阶段完整
        - listitem [ref=e10445]: C 正确：TIME_WAIT 在主动关闭方（先发 FIN 的一方），持续 2MSL
        - listitem [ref=e10446]:
          - text: D 错误：确认号是
          - strong [ref=e10447]: 期望收到的下一个字节的序号
          - text: ，不是"已经收到的最后一个字节"。如果已收到 1~1000，确认号 = 1001（期望下一次从 1001 开始）
        - listitem [ref=e10448]:
          - text: E 错误：滑动窗口用于
          - strong [ref=e10449]: 流量控制
          - text: （rwnd），拥塞控制用的是
          - strong [ref=e10450]: 拥塞窗口
          - text: （cwnd）。虽然最终发送窗口取 min(cwnd, rwnd)，但这是两个不同的机制
      - separator [ref=e10451]
      - heading "易错陷阱表" [level=3] [ref=e10452]
      - table [ref=e10453]:
        - rowgroup [ref=e10454]:
          - row [ref=e10455]:
            - columnheader "#" [ref=e10456]
            - columnheader "陷阱" [ref=e10457]
            - columnheader "正确理解" [ref=e10458]
        - rowgroup [ref=e10459]:
          - row [ref=e10460]:
            - cell "1" [ref=e10461]
            - cell "TIME_WAIT 在被动关闭方" [ref=e10462]
            - cell [ref=e10463]:
              - strong [ref=e10464]: 错！
              - text: TIME_WAIT 在
              - strong [ref=e10465]: 主动关闭方
              - text: （先发 FIN 的一方），持续 2MSL
          - row [ref=e10466]:
            - cell "2" [ref=e10467]
            - cell "确认号 = 已收到的最后一个字节序号" [ref=e10468]
            - cell [ref=e10469]:
              - strong [ref=e10470]: 错！
              - text: 确认号 =
              - strong [ref=e10471]: 期望收到的下一个字节序号
              - text: 。收到 1~1000，确认号 = 1001
          - row [ref=e10472]:
            - cell "3" [ref=e10473]
            - cell "三次握手第三次可以省略" [ref=e10474]
            - cell [ref=e10475]:
              - strong [ref=e10476]: 错！
              - text: 第三次 ACK 防止已失效的 SYN 报文到达服务器造成资源浪费（SYN Flood 就是利用这个）
          - row [ref=e10477]:
            - cell "4" [ref=e10478]
            - cell "四次挥手可以合并成三次" [ref=e10479]
            - cell [ref=e10480]:
              - strong [ref=e10481]: 错！
              - text: TCP 全双工，ACK 和 FIN 必须分开：先 ACK 表示"收到关闭请求"，数据发完后再 FIN 表示"我也关了"
          - row [ref=e10482]:
            - cell "5" [ref=e10483]
            - cell "快重传后 cwnd 从 1 开始" [ref=e10484]
            - cell [ref=e10485]:
              - strong [ref=e10486]: 错！
              - text: 快重传（3个重复ACK）后 cwnd = cwnd/2 + 3，进入快恢复，不是从 1 开始。只有
              - strong [ref=e10487]: 超时
              - text: 才 cwnd=1
          - row [ref=e10488]:
            - cell "6" [ref=e10489]
            - cell "UDP 校验和必选" [ref=e10490]
            - cell [ref=e10491]:
              - strong [ref=e10492]: 错！
              - text: UDP 校验和在 IPv4 中
              - strong [ref=e10493]: 可选
              - text: （可填 0），TCP 校验和必选
          - row [ref=e10494]:
            - cell "7" [ref=e10495]
            - cell "DNS 只使用 TCP 53 端口" [ref=e10496]
            - cell [ref=e10497]:
              - strong [ref=e10498]: 错！
              - text: DNS 默认使用
              - strong [ref=e10499]: UDP
              - text: 53 端口（常规查询），区域传送时使用 TCP 53
          - row [ref=e10500]:
            - cell "8" [ref=e10501]
            - cell "滑动窗口 = 拥塞控制" [ref=e10502]
            - cell [ref=e10503]:
              - strong [ref=e10504]: 错！
              - text: 滑动窗口是
              - strong [ref=e10505]: 流量控制
              - text: 机制（rwnd），拥塞控制是另一个机制（cwnd）。最终发送窗口 = min(cwnd, rwnd)
      - separator [ref=e10506]
      - heading "记忆口诀" [level=3] [ref=e10507]
      - paragraph [ref=e10508]:
        - strong [ref=e10509]: 三次握手
        - text: ：
      - code [ref=e10511]: SYN 先发来问路， SYN+ACK 回应同步， 最后 ACK 确认无误， 三次握手连接筑。
      - paragraph [ref=e10512]:
        - strong [ref=e10513]: 四次挥手
        - text: ：
      - code [ref=e10515]: FIN 先说要关闭， ACK 回应先别急， FIN 我也没数据， ACK 收到就关闭。
      - paragraph [ref=e10516]:
        - strong [ref=e10517]: 拥塞控制四阶段
        - text: ：
      - code [ref=e10519]: 慢开始指数翻， 拥塞避免线性攀， 快重传不等超时判， 快恢复减半继续干。
      - paragraph [ref=e10520]:
        - strong [ref=e10521]: 超时 vs 3个重复ACK
        - text: ：
      - code [ref=e10523]: 超时最严重，cwnd 回到 1，重新慢开始； 三个重复 ACK，不算太严重，cwnd 减半接着跑。
      - paragraph [ref=e10524]:
        - strong [ref=e10525]: 各种计时器
        - text: ：
      - code [ref=e10527]: 重传计时等确认，持续计时探零窗， 保活计时看生死，TIME_WAIT 等消散。
      - paragraph [ref=e10528]:
        - strong [ref=e10529]: 标志位口诀
        - text: ：
      - code [ref=e10531]: SYN 建连接，FIN 关连接， ACK 表确认，RST 出异常， PSH 快交付，URG 插队忙。
      - separator [ref=e10532]
      - separator [ref=e10533]
      - heading "知识点 21：应用层" [level=2] [ref=e10534]
      - blockquote [ref=e10535]:
        - paragraph [ref=e10536]: 应用层是用户直接接触的层，所有网络应用都在这层。考试重点是 DNS、HTTP、HTTPS、FTP、邮件协议、DHCP 的原理对比和端口号。
      - heading "DNS 域名解析" [level=3] [ref=e10537]
      - paragraph [ref=e10538]:
        - strong [ref=e10539]: 作用
        - text: ：把域名（如
        - link "www.baidu.com）翻译成" [ref=e10540] [cursor=pointer]:
          - /url: http://www.baidu.com%EF%BC%89%E7%BF%BB%E8%AF%91%E6%88%90
        - text: IP 地址。人记域名，机器认 IP，DNS 就是"翻译官"。
      - paragraph [ref=e10541]:
        - strong [ref=e10542]: 类比
        - text: ：DNS 就像手机通讯录——你输入"老妈"，手机帮你找到对应的电话号码。你不需要记住号码，只需要记住名字。
      - heading "域名空间结构" [level=4] [ref=e10543]
      - paragraph [ref=e10544]: 域名的组织方式是一棵倒过来的树，从上到下依次是：
      - code [ref=e10546]: 根域（.） │ ┌─────────────┼─────────────┐ com cn org ← 顶级域（TLD） │ │ │ baidu.com gov.cn wikipedia.org ← 二级域 │ │ www.baidu.com beijing.gov.cn ← 子域（三级域）
      - paragraph [ref=e10547]:
        - strong [ref=e10548]: 域名层级
        - text: （从右往左层级越来越高）：
      - list [ref=e10549]:
        - listitem [ref=e10550]:
          - strong [ref=e10551]: 根域
          - text: ：用
          - code [ref=e10552]: .
          - text: 表示，是整棵树的根。全球共 13 组根域名服务器（A 到 M）。
        - listitem [ref=e10553]:
          - strong [ref=e10554]: 顶级域（TLD）
          - text: ：
          - code [ref=e10555]: .com
          - text: 、
          - code [ref=e10556]: .cn
          - text: 、
          - code [ref=e10557]: .org
          - text: 等，由国家或组织管理。
        - listitem [ref=e10558]:
          - strong [ref=e10559]: 二级域
