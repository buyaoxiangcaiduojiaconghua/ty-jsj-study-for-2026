              - code [ref=e10671]: 93.184.216.34 → www.example.com
          - row [ref=e10672]:
            - cell [ref=e10673]:
              - strong [ref=e10674]: SOA
            - cell "Start of Authority" [ref=e10675]
            - cell "域的管理信息（主 DNS、管理员邮箱、序列号等）" [ref=e10676]
            - cell "每个域只有一条 SOA 记录" [ref=e10677]
          - row [ref=e10678]:
            - cell [ref=e10679]:
              - strong [ref=e10680]: TXT
            - cell "Text" [ref=e10681]
            - cell "任意文本，常用于验证" [ref=e10682]
