            - cell "—" [ref=e7989]
            - cell "8" [ref=e7990]
            - cell [ref=e7991]:
              - strong [ref=e7992]: 回显请求
            - cell "PING 发送的报文" [ref=e7993]
          - row [ref=e7994]:
            - cell "查询" [ref=e7995]
            - cell "—" [ref=e7996]
            - cell "0" [ref=e7997]
            - cell [ref=e7998]:
              - strong [ref=e7999]: 回显应答
            - cell "PING 收到的回复" [ref=e8000]
          - row [ref=e8001]:
            - cell "查询" [ref=e8002]
            - cell "—" [ref=e8003]
            - cell "13/14" [ref=e8004]
            - cell "时间戳请求/应答" [ref=e8005]
            - cell "测网络时延" [ref=e8006]
      - paragraph [ref=e8007]:
        - strong [ref=e8008]: 重要规则
        - text: ：以下情况
        - strong [ref=e8009]: 不发送
        - text: ICMP 差错报告报文：
      - list [ref=e8010]:
        - listitem [ref=e8011]: 对 ICMP 差错报文本身不再发送差错报文（防止无限嵌套）
        - listitem [ref=e8012]: 对广播/组播地址的数据报不发送差错报告
        - listitem [ref=e8013]: 对分片后的数据报，只对第一个分片发送
        - listitem [ref=e8014]: 对源地址为 0.0.0.0、127.x.x.x、组播地址的数据报不发送
      - heading "终点不可达（类型 3）" [level=4] [ref=e8015]
      - paragraph [ref=e8016]: 当路由器或主机无法交付数据报时，丢弃该数据报并向源站发送 ICMP 终点不可达报文。其"代码"字段进一步说明原因：
      - table [ref=e8017]:
        - rowgroup [ref=e8018]:
          - row [ref=e8019]:
            - columnheader "代码" [ref=e8020]
            - columnheader "含义" [ref=e8021]
        - rowgroup [ref=e8022]:
          - row [ref=e8023]:
            - cell "0" [ref=e8024]
            - cell "网络不可达" [ref=e8025]
          - row [ref=e8026]:
            - cell "1" [ref=e8027]
            - cell "主机不可达" [ref=e8028]
          - row [ref=e8029]:
            - cell "2" [ref=e8030]
            - cell "协议不可达" [ref=e8031]
          - row [ref=e8032]:
            - cell "3" [ref=e8033]
            - cell "端口不可达（UDP 常见，TCP 用 RST）" [ref=e8034]
          - row [ref=e8035]:
            - cell "4" [ref=e8036]
            - cell "需要分片但 DF 标志置位" [ref=e8037]
          - row [ref=e8038]:
            - cell "13" [ref=e8039]
            - cell "通信被管理性禁止（防火墙拦截）" [ref=e8040]
      - heading "超时（类型 11）" [level=4] [ref=e8041]
      - paragraph [ref=e8042]: 当路由器收到 TTL=1 的数据报时，将 TTL 减 1 后变为 0，丢弃该数据报并向源站发送 ICMP 超时报文。
      - blockquote [ref=e8043]:
        - paragraph [ref=e8044]: Traceroute 就是巧妙利用了这个机制，依次发送 TTL=1, 2, 3... 的包，让每跳路由器都返回超时报文，从而追踪路径。
      - heading "Traceroute 工作原理详解" [level=4] [ref=e8045]
      - paragraph [ref=e8046]:
        - strong [ref=e8047]: 目的
        - text: ：追踪从源主机到目标主机经过了哪些路由器（路径发现）。
      - paragraph [ref=e8048]:
        - strong [ref=e8049]: 工作过程
        - text: （以 Windows 的 tracert 为例，使用 ICMP）：
      - list [ref=e8050]:
        - listitem [ref=e8051]: 源主机发送 TTL=1 的 UDP 包（或 ICMP Echo Request），目标端口为不可达端口
        - listitem [ref=e8052]: 第一跳路由器收到后 TTL 减为 0，丢弃并返回 ICMP 超时报文
        - listitem [ref=e8053]: 源主机记录第一跳路由器的 IP 和 RTT
        - listitem [ref=e8054]: 源主机发送 TTL=2 的包...
        - listitem [ref=e8055]: 重复直到：收到目标主机的 ICMP 端口不可达报文（说明到达了目标），或超过最大跳数（默认 30）
      - blockquote [ref=e8056]:
        - paragraph [ref=e8057]: Linux 的 traceroute 默认使用 UDP（高端口），Windows 的 tracert 使用 ICMP Echo Request。
      - heading "PING 的详细工作过程" [level=4] [ref=e8058]
      - paragraph [ref=e8059]:
        - strong [ref=e8060]: PING 是测试网络连通性的最常用工具，整个过程分四步
        - text: ：
      - list [ref=e8061]:
        - listitem [ref=e8062]: 源主机构建 ICMP 回显请求报文（类型 8，代码 0），包含一个序列号和可选数据
        - listitem [ref=e8063]: 目标主机收到后，构建 ICMP 回显应答报文（类型 0，代码 0），原样返回数据
        - listitem [ref=e8064]: 源主机收到应答，计算 RTT（往返时间）= 收到时间 - 发送时间
        - listitem [ref=e8065]: 统计结果：发送包数、收到包数、丢包率、最小/最大/平均 RTT
      - blockquote [ref=e8066]:
        - paragraph [ref=e8067]: PING 不通不代表目标一定不在线——可能是防火墙拦截了 ICMP 报文。PING 的结果中 TTL 值可以粗略判断目标操作系统（Linux 默认 TTL=64，Windows 默认 TTL=128）。
      - separator [ref=e8068]
      - heading "DHCP 协议" [level=3] [ref=e8069]
      - paragraph [ref=e8070]:
        - strong [ref=e8071]: 作用
        - text: ：自动给主机分配 IP 地址、子网掩码、默认网关、DNS 服务器等配置。
      - paragraph [ref=e8072]:
        - strong [ref=e8073]: 四步走（DORA）
        - text: ：
      - list [ref=e8074]:
        - listitem [ref=e8075]:
          - strong [ref=e8076]: Discover
          - text: ：主机广播"谁给我 IP？"（源 IP 为 0.0.0.0，目的 IP 为 255.255.255.255）
        - listitem [ref=e8077]:
          - strong [ref=e8078]: Offer
          - text: ：DHCP 服务器回复"我可以给你这个 IP"（提供 IP 地址和租约）
        - listitem [ref=e8079]:
          - strong [ref=e8080]: Request
          - text: ：主机确认"我就要这个了"（如果多台 DHCP 服务器都回复了，选第一个）
        - listitem [ref=e8081]:
          - strong [ref=e8082]: ACK
          - text: ：服务器确认"好，租约给你，有效期 xx 秒"
      - blockquote [ref=e8083]:
        - paragraph [ref=e8084]: DHCP 基于 UDP，服务端端口 67，客户端端口 68。租约到期前需要续约（Renew），通常到 50% 租期时开始尝试续约。
      - separator [ref=e8085]
      - heading "路由选择协议" [level=3] [ref=e8086]
      - paragraph [ref=e8087]:
        - strong [ref=e8088]: 静态路由 vs 动态路由
        - text: ：
      - list [ref=e8089]:
        - listitem [ref=e8090]: 静态路由：手动配置，简单但不灵活，适合小型网络
        - listitem [ref=e8091]: 动态路由：自动学习，适应网络变化，适合中大型网络
      - paragraph [ref=e8092]: "**自治系统（AS）**的概念：一个组织管理下的一组路由器的集合，使用统一的内部路由策略。AS 内部用 IGP（如 RIP、OSPF），AS 之间用 EGP（如 BGP）。"
