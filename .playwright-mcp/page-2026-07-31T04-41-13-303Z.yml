            - cell "内部路由 + 一条默认路由" [ref=e8352]
            - cell "Cisco 专有，比末梢更精简" [ref=e8353]
          - row [ref=e8354]:
            - cell [ref=e8355]:
              - strong [ref=e8356]: NSSA（非完全末梢）
            - cell "可引入少量外部路由（7 类 LSA）" [ref=e8357]
            - cell "内部路由 + 少量外部路由" [ref=e8358]
            - cell "需要连接外部网络但又想精简路由" [ref=e8359]
      - paragraph [ref=e8360]:
        - strong [ref=e8361]: 各类 LSA 说明
        - text: ：
      - list [ref=e8362]:
        - listitem [ref=e8363]: 1 类（Router LSA）：每个路由器产生，描述自己的链路状态
        - listitem [ref=e8364]: 2 类（Network LSA）：DR 产生，描述广播网络中的路由器
        - listitem [ref=e8365]: 3 类（Summary LSA）：ABR 产生，汇总其他区域的路由
        - listitem [ref=e8366]: 4 类（ASBR Summary LSA）：ABR 产生，告诉其他区域 ASBR 的位置
        - listitem [ref=e8367]: 5 类（External LSA）：ASBR 产生，引入外部路由
        - listitem [ref=e8368]: 7 类（NSSA External LSA）：NSSA 区域的 ASBR 产生，类似 5 类但在 NSSA 内使用
      - heading "OSPF 邻居状态机" [level=4] [ref=e8369]
      - paragraph [ref=e8370]: OSPF 路由器建立邻居关系要经过 8 个状态：
      - table [ref=e8371]:
        - rowgroup [ref=e8372]:
          - row [ref=e8373]:
            - columnheader "状态" [ref=e8374]
            - columnheader "含义" [ref=e8375]
            - columnheader "说明" [ref=e8376]
        - rowgroup [ref=e8377]:
          - row [ref=e8378]:
            - cell [ref=e8379]:
              - strong [ref=e8380]: Down
            - cell "初始状态" [ref=e8381]
            - cell "未收到 Hello 报文" [ref=e8382]
          - row [ref=e8383]:
            - cell [ref=e8384]:
              - strong [ref=e8385]: Init
            - cell "收到 Hello" [ref=e8386]
            - cell "收到邻居的 Hello，但自己的 Router ID 不在邻居列表中" [ref=e8387]
          - row [ref=e8388]:
            - cell [ref=e8389]:
              - strong [ref=e8390]: 2-Way
            - cell "双向通信" [ref=e8391]
            - cell "双方都收到了对方的 Hello，邻居关系建立（DR/BDR 选举在此状态）" [ref=e8392]
          - row [ref=e8393]:
            - cell [ref=e8394]:
              - strong [ref=e8395]: ExStart
            - cell "开始交换" [ref=e8396]
            - cell "协商主从关系，确定 DD 序列号" [ref=e8397]
          - row [ref=e8398]:
            - cell [ref=e8399]:
              - strong [ref=e8400]: Exchange
            - cell "交换 DD" [ref=e8401]
            - cell "交换数据库描述报文（DD），了解对方有哪些 LSA" [ref=e8402]
          - row [ref=e8403]:
            - cell [ref=e8404]:
              - strong [ref=e8405]: Loading
            - cell "加载 LSA" [ref=e8406]
            - cell "请求对方有而自己没有的 LSA（LSR/LSU/LSAck）" [ref=e8407]
          - row [ref=e8408]:
            - cell [ref=e8409]:
              - strong [ref=e8410]: Full
            - cell "完全邻接" [ref=e8411]
            - cell "LSDB 完全同步，邻接关系建立完成" [ref=e8412]
      - blockquote [ref=e8413]:
        - paragraph [ref=e8414]: 注意：邻居（Neighbor）和邻接（Adjacency）不同。所有路由器在 2-Way 状态都是邻居，但只有达到 Full 状态才算建立了邻接关系。在广播网络中，非 DR/BDR 之间只停留在 2-Way 状态。
      - heading "DR/BDR 选举过程" [level=4] [ref=e8415]
      - paragraph [ref=e8416]:
        - strong [ref=e8417]: 为什么需要 DR/BDR？
        - text: 在广播网络（如以太网）中，如果 n 个路由器都两两建立邻接关系，需要 n(n-1)/2 个邻接关系，LSA 泛洪量巨大。DR 作为"班长"，所有路由器只和 DR 建立邻接，LSA 由 DR 统一转发，将邻接数降为 n-1。
      - paragraph [ref=e8418]:
        - strong [ref=e8419]: 选举规则
        - text: （按优先级）：
      - list [ref=e8420]:
        - listitem [ref=e8421]:
          - text: 比较
          - strong [ref=e8422]: 优先级
          - text: （Priority，0~255），越大越优先（0 表示不参与选举）
        - listitem [ref=e8423]:
          - text: 优先级相同则比较
          - strong [ref=e8424]: Router ID
          - text: ，越大越优先
        - listitem [ref=e8425]: DR 选举出来后，再选 BDR（备份 DR）
        - listitem [ref=e8426]:
          - strong [ref=e8427]: 选举是非抢占的
          - text: ：新的路由器加入不会抢占已有的 DR/BDR，除非 DR 或 BDR 失效
