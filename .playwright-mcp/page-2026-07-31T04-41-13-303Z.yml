            - cell "相邻节点间可靠传输、组帧" [ref=e4496]
            - cell "MAC、交换机、网桥" [ref=e4497]
            - cell "帧" [ref=e4498]
          - row [ref=e4499]:
            - cell "1" [ref=e4500]
            - cell "物理层" [ref=e4501]
            - cell "传输 0/1 比特流" [ref=e4502]
            - cell "网线、光纤、集线器" [ref=e4503]
            - cell "比特" [ref=e4504]
      - blockquote [ref=e4505]:
        - paragraph [ref=e4506]:
          - strong [ref=e4507]: 上 4 层
          - text: （应用/表示/会话/传输）→ 端到端
          - strong [ref=e4508]: 下 3 层
          - text: （网络/数据链路/物理）→ 点到点
      - heading "各层详细解析" [level=4] [ref=e4509]
      - paragraph [ref=e4510]:
        - strong [ref=e4511]: 第 7 层——应用层
      - paragraph [ref=e4512]: 解决什么问题：用户如何使用网络。应用层是离用户最近的一层，为用户的应用进程提供网络服务。
      - paragraph [ref=e4513]: 核心设计思想：
      - list [ref=e4514]:
        - listitem [ref=e4515]: 不同的应用对应不同的协议（浏览网页用 HTTP，传文件用 FTP，发邮件用 SMTP）
        - listitem [ref=e4516]: 应用层协议定义的是"应用进程之间交换的报文格式和交互顺序"
        - listitem [ref=e4517]: 每个应用层协议都是为了解决某一类具体应用问题而设计的
      - paragraph [ref=e4518]: 与其他层的交互：
      - list [ref=e4519]:
        - listitem [ref=e4520]: 向下：调用传输层提供的端到端通信服务（TCP 或 UDP 的端口）
        - listitem [ref=e4521]: 向上：直接面向用户，不需要再向上提供服务
      - separator [ref=e4522]
      - paragraph [ref=e4523]:
        - strong [ref=e4524]: 第 6 层——表示层
      - paragraph [ref=e4525]: 解决什么问题：不同系统之间数据的"语言不通"问题。比如 Windows 用 GBK 编码，Linux 用 UTF-8 编码，它们之间怎么互相理解？表示层来做翻译。
      - paragraph [ref=e4526]: 核心设计思想：
      - list [ref=e4527]:
        - listitem [ref=e4528]: 数据格式转换（编码转换、数据压缩、加密解密）
        - listitem [ref=e4529]: 让应用层不用关心数据在物理上怎么表示，只管内容
        - listitem [ref=e4530]: 像一个"翻译官"，不管你说什么语言，都能翻译成对方能理解的
      - paragraph [ref=e4531]: 与其他层的交互：
      - list [ref=e4532]:
        - listitem [ref=e4533]: 从会话层接收数据 → 进行格式转换/加密/压缩 → 交给会话层
        - listitem [ref=e4534]: 典型代表：SSL/TLS 加密、JPEG 图片压缩、ASCII 字符编码
      - blockquote [ref=e4535]:
        - paragraph [ref=e4536]: 注意：SSL/TLS 常被归为表示层，但其实它横跨会话层和表示层，因为它既加密数据（表示层功能），又管理会话密钥（会话层功能）。
      - separator [ref=e4537]
      - paragraph [ref=e4538]:
        - strong [ref=e4539]: 第 5 层——会话层
      - paragraph [ref=e4540]: 解决什么问题：两个应用进程之间的"对话管理"。什么时候开始说话、什么时候结束、谁先说、说错了怎么回滚。
      - paragraph [ref=e4541]: 核心设计思想：
      - list [ref=e4542]:
        - listitem [ref=e4543]: 建立、维护、终止会话（Session）
        - listitem [ref=e4544]: 会话同步：在长对话中插入"检查点"（checkpoint），断线后可以从中断点继续，而不是从头开始
        - listitem [ref=e4545]: 会话控制：决定通信方式是单工、半双工还是全双工
      - paragraph [ref=e4546]: 与其他层的交互：
      - list [ref=e4547]:
        - listitem [ref=e4548]: 利用传输层提供的可靠连接来管理会话
        - listitem [ref=e4549]: 为表示层提供稳定的对话环境
      - blockquote [ref=e4550]:
        - paragraph [ref=e4551]: 类比：打电话——先拨号建立连接（建立会话），通话中（维持会话），挂电话（终止会话）。如果在隧道里信号不好断了，可以接着刚才的话题继续聊，不用从头"你好"开始（检查点恢复）。
      - separator [ref=e4552]
      - paragraph [ref=e4553]:
        - strong [ref=e4554]: 第 4 层——传输层
      - paragraph [ref=e4555]: 解决什么问题：两台主机上的进程之间怎么可靠地传输数据。网络层只负责把数据从一台主机送到另一台主机，但传输层负责"从哪个进程发出，送到哪个进程"。
      - paragraph [ref=e4556]: 核心设计思想：
      - list [ref=e4557]:
        - listitem [ref=e4558]:
          - strong [ref=e4559]: 端到端
          - text: ：只关心起点和终点，不关心中间经过哪些路由器
        - listitem [ref=e4560]:
          - strong [ref=e4561]: 复用和分用
          - text: ：多个应用进程可以同时使用同一个传输层协议（通过端口号区分）
        - listitem [ref=e4562]: TCP 提供可靠传输（确认、重传、排序、流量控制、拥塞控制）
        - listitem [ref=e4563]: UDP 提供尽力而为的传输（快但不保证可靠）
      - paragraph [ref=e4564]: 与其他层的交互：
      - list [ref=e4565]:
        - listitem [ref=e4566]: 向下：使用网络层提供的"主机到主机"通信服务
        - listitem [ref=e4567]: 向上：为应用层提供"进程到进程"的通信服务（通过端口号定位进程）
      - blockquote [ref=e4568]:
        - paragraph [ref=e4569]: 传输层是第一个也是唯一一个"端到端"的层，以上三层也是端到端，但它们的端到端能力依赖传输层。
      - separator [ref=e4570]
      - paragraph [ref=e4571]:
        - strong [ref=e4572]: 第 3 层——网络层
      - paragraph [ref=e4573]:
        - text: 解决什么问题：数据怎么从源主机经过网络中的多个路由器到达目的主机。核心是两个任务：
        - strong [ref=e4574]: 寻址
        - text: （给每台主机一个唯一地址，IP 地址）和
        - strong [ref=e4575]: 选路
        - text: （规划从源到目的的路径）。
      - paragraph [ref=e4576]: 核心设计思想：
      - list [ref=e4577]:
        - listitem [ref=e4578]: 每个数据包独立寻址和转发（IP 是无连接的，数据报方式）
        - listitem [ref=e4579]: 路由协议负责构建和维护路由表（RIP、OSPF、BGP）
        - listitem [ref=e4580]: 尽力而为服务（Best Effort）：不保证一定送达，不保证不乱序，不保证不重复
      - paragraph [ref=e4581]: 与其他层的交互：
      - list [ref=e4582]:
        - listitem [ref=e4583]: 向下：使用数据链路层提供的"相邻节点间"传输服务
        - listitem [ref=e4584]: 向上：为传输层提供"主机到主机"的通信服务
      - blockquote [ref=e4585]:
        - paragraph [ref=e4586]: 网络层是第一个处理"跨网络"通信的层，数据链路层只管"相邻节点"，网络层管"全程路径"。
      - separator [ref=e4587]
      - paragraph [ref=e4588]:
        - strong [ref=e4589]: 第 2 层——数据链路层
      - paragraph [ref=e4590]: 解决什么问题：相邻两个节点之间怎么可靠地传输数据帧。比如你的电脑到路由器之间、路由器到路由器之间。
      - paragraph [ref=e4591]: 核心设计思想：
      - list [ref=e4592]:
        - listitem [ref=e4593]:
          - strong [ref=e4594]: 封装成帧
          - text: ：将网络层的 IP 数据报加上帧头帧尾，界定帧的边界
        - listitem [ref=e4595]:
          - strong [ref=e4596]: 透明传输
          - text: ：数据中如果出现了和帧定界符一样的比特序列，需要转义处理
        - listitem [ref=e4597]:
          - strong [ref=e4598]: 差错检测
          - text: ：使用 CRC 校验检测传输过程中是否出错（注意：只能检测，不能纠错）
        - listitem [ref=e4599]:
          - strong [ref=e4600]: 流量控制
          - text: ：协调发送方和接收方的速度（在数据链路层和传输层都有流量控制，但范围不同）
      - paragraph [ref=e4601]: 与其他层的交互：
      - list [ref=e4602]:
        - listitem [ref=e4603]: 向下：使用物理层提供的比特流传输能力
        - listitem [ref=e4604]: 向上：为网络层提供"相邻节点间"的无差错帧传输服务
      - blockquote [ref=e4605]:
        - paragraph [ref=e4606]:
          - text: 数据链路层又分为两个子层：
          - strong [ref=e4607]: MAC 子层
          - text: （介质访问控制，控制谁先发）和
          - strong [ref=e4608]: LLC 子层
          - text: （逻辑链路控制，负责差错和流量控制）。
      - separator [ref=e4609]
      - paragraph [ref=e4610]:
        - strong [ref=e4611]: 第 1 层——物理层
      - paragraph [ref=e4612]: 解决什么问题：怎么把 0/1 比特变成物理信号（电信号、光信号、无线电波）传出去，以及在接收端怎么把信号还原成比特。
      - paragraph [ref=e4613]: 核心设计思想：
      - list [ref=e4614]:
        - listitem [ref=e4615]: 定义物理接口的机械特性（接口形状、尺寸、引脚数）
        - listitem [ref=e4616]: 定义电气特性（电压范围、信号速率）
        - listitem [ref=e4617]: 定义功能特性（每个引脚干什么用）
        - listitem [ref=e4618]: 定义规程特性（信号之间的时序关系）
      - paragraph [ref=e4619]: 与其他层的交互：
      - list [ref=e4620]:
        - listitem [ref=e4621]: 向下：直接操作物理介质（网线、光纤、无线电）
        - listitem [ref=e4622]: 向上：为数据链路层提供比特流传输服务
      - blockquote [ref=e4623]:
        - paragraph [ref=e4624]: 物理层不关心数据内容，不关心比特组成的含义，只管"怎么把比特发出去"。物理层以下的传输介质（网线、光纤）本身不属于物理层，物理层是规范"怎么使用这些介质"。
      - separator [ref=e4625]
      - heading "TCP/IP 四层模型（实际标准，互联网用的就是这个）" [level=3] [ref=e4626]
      - table [ref=e4627]:
