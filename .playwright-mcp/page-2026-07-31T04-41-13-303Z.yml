      - paragraph [ref=e4652]:
        - strong [ref=e4653]: OSI vs TCP/IP 对比
        - text: ：OSI 是理论模型（先有模型后有协议），TCP/IP 是实际标准（先有协议后有模型）。OSI 分层更细但复杂，TCP/IP 分层更粗但实用。
