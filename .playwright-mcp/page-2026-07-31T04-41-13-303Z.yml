          - strong [ref=e4826]: 第 N 层的 PDU = 第 N-1 层的 SDU + 第 N-1 层的头部/尾部
      - separator [ref=e4827]
      - heading "5.2 封装与解封装流程" [level=3] [ref=e4828]
      - heading "发送方（封装过程）" [level=4] [ref=e4829]
      - code [ref=e4831]: 应用层数据 ↓ 传输层：添加 TCP/UDP 头部（源端口、目的端口、序号等） → TCP 段 / UDP 数据报 ↓ 网络层：添加 IP 头部（源 IP、目的 IP、TTL、协议号等） → IP 数据报 ↓ 数据链路层：添加帧头部（MAC 地址）和帧尾部（FCS 校验） → 以太网帧 ↓ 物理层：转换为比特流（0/1 信号） → 比特流在线路上传输
      - heading "接收方（解封装过程）" [level=4] [ref=e4832]
      - code [ref=e4834]: 物理层：接收比特流 ↓ 数据链路层：检查 FCS，去除帧头帧尾，提取 IP 数据报 ↓ 网络层：检查 IP 头部校验和，去除 IP 头部，提取 TCP 段 ↓ 传输层：检查 TCP 校验和，按序号重组，去除 TCP 头部，提取应用数据 ↓ 应用层：获得原始数据
      - separator [ref=e4835]
      - heading "5.3 封装过程图示" [level=3] [ref=e4836]
      - code [ref=e4838]: 应用层 | [ 原始数据 ] | 传输层 | [ TCP头 | 原始数据 ] ← TCP 段 (Segment) | ↓ 网络层 | [ IP头 | TCP头 | 原始数据 ] ← IP 数据报 (Packet) | ↓ 链路层 | [ 帧头 | IP头 | TCP头 | 原始数据 | FCS尾 ] ← 以太网帧 (Frame) | ↓ 物理层 | 101100101011010010101... ← 比特流 (Bits)
      - paragraph [ref=e4839]:
        - strong [ref=e4840]: 各层添加的关键信息：
      - table [ref=e4841]:
        - rowgroup [ref=e4842]:
