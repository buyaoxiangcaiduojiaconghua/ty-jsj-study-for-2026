          - row [ref=e6381]:
            - cell "3" [ref=e6382]
            - cell "0~7" [ref=e6383]
            - cell "7 (2^3-1)" [ref=e6384]
            - cell "4 (2^(3-1))" [ref=e6385]
          - row [ref=e6386]:
            - cell "4" [ref=e6387]
            - cell "0~15" [ref=e6388]
            - cell "15 (2^4-1)" [ref=e6389]
            - cell "8 (2^(4-1))" [ref=e6390]
      - blockquote [ref=e6391]:
        - paragraph [ref=e6392]:
          - strong [ref=e6393]: 为什么 GBN 发送窗口最大是 2^n - 1？
          - text: 如果发送窗口 = 2^n，接收方无法区分新帧和重传的旧帧（帧序号循环使用后，序号 0 可能代表新帧也可能是前一轮的重传帧）。
        - paragraph [ref=e6394]:
          - strong [ref=e6395]: 为什么 SR 发送窗口最大是 2^(n-1)？
          - text: SR 接收窗口也 > 1，如果发送窗口过大会导致序号混淆。例如 n=3，序号范围 0
          - deletion [ref=e6396]: 7，如果发送窗口 = 5，接收窗口 = 5，可能出现发送方发送序号 0
          - text: 4，接收方收到但 ACK 全部丢失，发送方重传序号 0~4，接收方无法区分新帧和重传帧。
      - heading "信道利用率计算例题" [level=4] [ref=e6397]
      - paragraph [ref=e6398]:
        - strong [ref=e6399]: 例题：假定信号传播速度为 2 × 10^8 m/s，链路长度 2000 km，带宽 1 Gbps，帧长 1000 字节。使用停等协议，求信道利用率。
      - paragraph [ref=e6400]:
        - strong [ref=e6401]: 解：
      - list [ref=e6402]:
        - listitem [ref=e6403]:
          - text: 发送时延 T发送 = 帧长 / 带宽 = (1000 × 8 bit) / (1 × 10^9 bps) = 8 × 10^(-6) s =
          - strong [ref=e6404]: 8 μs
        - listitem [ref=e6405]:
          - text: 传播时延 T传播 = 链路长度 / 传播速度 = 2000 × 10^3 m / (2 × 10^8 m/s) = 0.01 s =
          - strong [ref=e6406]: 10 ms
        - listitem [ref=e6407]:
          - text: RTT = 2 × T传播 =
          - strong [ref=e6408]: 20 ms
        - listitem [ref=e6409]:
          - text: 信道利用率 U = T发送 / (T发送 + RTT) = 8 μs / (8 μs + 20 ms) ≈ 8 / 20008 ≈
          - strong [ref=e6410]: 0.04%
      - blockquote [ref=e6411]:
        - paragraph [ref=e6412]: 信道利用率极低，几乎全部时间都在等待！这就是为什么停等协议只适用于短距离链路，长距离链路必须用滑动窗口协议。
      - paragraph [ref=e6413]:
        - strong [ref=e6414]: 提高利用率的方法
        - text: ：增大发送窗口。如果发送窗口为 W，则连续发送 W 个帧后才等待确认：
      - list [ref=e6415]:
        - listitem [ref=e6416]: U = (W × T发送) / (T发送 + RTT)
        - listitem [ref=e6417]: 当 W × T发送 >= T发送 + RTT 时，U = 100%
      - heading "MAC 地址" [level=3] [ref=e6418]
