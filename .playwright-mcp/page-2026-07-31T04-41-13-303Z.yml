            - cell "SIFS + 2 个时隙" [ref=e14081]
            - cell "普通数据帧发送前等待" [ref=e14082]
            - cell "低" [ref=e14083]
          - row [ref=e14084]:
            - cell [ref=e14085]:
              - strong [ref=e14086]: EIFS
            - cell "Extended InterFrame Space" [ref=e14087]
            - cell "最长（不等，用于错误恢复）" [ref=e14088]
            - cell "收到错误帧后使用，防止干扰重传" [ref=e14089]
            - cell [ref=e14090]:
              - strong [ref=e14091]: 最低
      - blockquote [ref=e14092]:
        - paragraph [ref=e14093]:
          - strong [ref=e14094]: 时隙（Slot Time）
          - text: ：802.11b/g 中为 20μs，802.11a 中为 9μs。一个时隙是无线信道中的最小时间单位。
        - paragraph [ref=e14095]:
          - strong [ref=e14096]: 为什么 SIFS 最短？
          - text: ACK 和 CTS 帧需要立即响应，不能有延迟——如果 ACK 也去竞争信道，效率就太低了。所以给控制帧最高的优先级（等待时间最短）。
      - paragraph [ref=e14097]:
        - strong [ref=e14098]: IFS 时长关系：
      - code [ref=e14100]: SIFS < PIFS < DIFS < EIFS （越短优先级越高，越能优先抢到信道） SIFS = 10μs（802.11g） 时隙 = 20μs PIFS = SIFS + 1时隙 = 30μs DIFS = SIFS + 2时隙 = 50μs
      - heading "随机退避算法详解（二进制指数退避）" [level=4] [ref=e14101]
      - paragraph [ref=e14102]: 无线网络中的退避算法和有线以太网的原理类似，但有一些区别：
      - paragraph [ref=e14103]:
        - strong [ref=e14104]: 退避过程：
      - list [ref=e14105]:
        - listitem [ref=e14106]: 从竞争窗口 [0, CW-1] 中随机选一个整数作为退避计数器
        - listitem [ref=e14107]: 每经过一个空闲时隙，计数器减 1
        - listitem [ref=e14108]:
          - text: 如果信道变忙，
          - strong [ref=e14109]: 冻结计数器
          - text: （暂停倒计时），等信道再次空闲 DIFS 时间后继续
        - listitem [ref=e14110]: 计数器归零时，立即发送
      - paragraph [ref=e14111]:
        - strong [ref=e14112]: CW（竞争窗口）变化：
      - list [ref=e14113]:
        - listitem [ref=e14114]: 初始 CW = CW_min（通常为 31）
        - listitem [ref=e14115]: 每次重传失败：CW = 2 × (CW + 1) - 1（即 CW 翻倍）
        - listitem [ref=e14116]: CW 上限 = CW_max（通常为 1023）
        - listitem [ref=e14117]: 发送成功：CW 重置为 CW_min
      - table [ref=e14118]:
        - rowgroup [ref=e14119]:
          - row [ref=e14120]:
            - columnheader "重传次数" [ref=e14121]
            - columnheader "CW 值" [ref=e14122]
            - columnheader "退避范围" [ref=e14123]
            - columnheader "说明" [ref=e14124]
        - rowgroup [ref=e14125]:
          - row [ref=e14126]:
            - cell "第 1 次发送" [ref=e14127]
            - cell "31" [ref=e14128]
            - cell "0~31" [ref=e14129]
            - cell "初始 CW_min" [ref=e14130]
          - row [ref=e14131]:
            - cell "第 1 次重传" [ref=e14132]
            - cell "63" [ref=e14133]
            - cell "0~63" [ref=e14134]
            - cell "CW 翻倍" [ref=e14135]
          - row [ref=e14136]:
            - cell "第 2 次重传" [ref=e14137]
            - cell "127" [ref=e14138]
            - cell "0~127" [ref=e14139]
            - cell "CW 再翻倍" [ref=e14140]
          - row [ref=e14141]:
            - cell "第 3 次重传" [ref=e14142]
            - cell "255" [ref=e14143]
            - cell "0~255" [ref=e14144]
            - cell [ref=e14145]
          - row [ref=e14146]:
            - cell "第 4 次重传" [ref=e14147]
            - cell "511" [ref=e14148]
            - cell "0~511" [ref=e14149]
            - cell [ref=e14150]
          - row [ref=e14151]:
            - cell "第 5 次重传" [ref=e14152]
            - cell "1023" [ref=e14153]
            - cell "0~1023" [ref=e14154]
            - cell "达到 CW_max，不再增加" [ref=e14155]
          - row [ref=e14156]:
            - cell "超过重传上限" [ref=e14157]
            - cell "—" [ref=e14158]
            - cell "—" [ref=e14159]
            - cell "放弃发送" [ref=e14160]
      - blockquote [ref=e14161]:
        - paragraph [ref=e14162]:
          - strong [ref=e14163]: 关键区别
          - text: ：无线退避计数器在信道忙时会
          - strong [ref=e14164]: 冻结
          - text: （有线是不冻结的），因为无线网络中的信道占用时间更长（一个数据帧 + ACK 的时间），如果继续倒计时，退避机制就失效了。
      - heading "虚拟载波监听：NAV（网络分配向量）" [level=4] [ref=e14165]
      - paragraph [ref=e14166]: 物理载波监听（实际监听信道）只能检测到"信道是否忙"，但无法知道"信道还要忙多久"。NAV 解决了这个问题。
      - paragraph [ref=e14167]:
        - strong [ref=e14168]: NAV 的工作机制：
      - list [ref=e14169]:
        - listitem [ref=e14170]: 每个 802.11 帧的"持续时间"字段告诉其他站点：本次传输（包括 ACK 等后续帧）需要占用信道多久
        - listitem [ref=e14171]: 其他站点听到这个帧后，在自己的 NAV 中记录这个时间
        - listitem [ref=e14172]: NAV > 0 时，站点认为信道"忙"，不发送数据
        - listitem [ref=e14173]: NAV 随时间递减，减到 0 时认为信道空闲
      - blockquote [ref=e14174]:
        - paragraph [ref=e14175]:
          - strong [ref=e14176]: 类比
          - text: ：NAV 就像在信道门口贴了一张便条："我要占用 5 分钟，别进来"。其他站点看到便条后，设个闹钟 5 分钟后响，闹钟响之前不去打扰。
      - paragraph [ref=e14177]:
        - strong [ref=e14178]: 物理载波监听 + 虚拟载波监听（NAV）两者结合
        - text: ，任何一个判断为"忙"，站点就不发送。
      - heading "RTS/CTS 机制详细过程" [level=4] [ref=e14179]
      - paragraph [ref=e14180]:
        - text: RTS/CTS 是解决隐藏终端问题的核心机制，但它是
        - strong [ref=e14181]: 可选的
        - text: （通常只在长帧传输时使用，短帧直接用基本 CSMA/CA 更高效）。
      - paragraph [ref=e14182]:
        - strong [ref=e14183]: RTS/CTS 时序图：
      - code [ref=e14185]: 发送方 A 接收方 B 其他站点 C（隐藏于A但能听到B） | | | | DIFS 等待 | | |──RTS──────────────────→ | | | | SIFS 后 | | ←────────────────CTS── | | | | | 听到 CTS → 设 NAV，闭嘴 | SIFS 后 | | |──DATA─────────────────→ | | | | SIFS 后 | | ←────────────────ACK── | | | | | NAV 归零，可以发送了
      - paragraph [ref=e14186]:
        - strong [ref=e14187]: 过程详解：
      - list [ref=e14188]:
        - listitem [ref=e14189]:
          - text: 发送方 A 等 DIFS 时间后，发送
          - strong [ref=e14190]: RTS（请求发送）
          - text: 帧，其中包含"持续时间"（预计占用信道多久）
        - listitem [ref=e14191]:
          - text: 接收方 B 等 SIFS 时间后，回复
          - strong [ref=e14192]: CTS（允许发送）
          - text: 帧，也包含"持续时间"
        - listitem [ref=e14193]:
          - strong [ref=e14194]: 听到 RTS 的站点
          - text: ：知道 A 要发送，闭嘴（设 NAV）
        - listitem [ref=e14195]:
          - strong [ref=e14196]: 听到 CTS 的站点
          - text: ：知道 B 要接收，闭嘴（设 NAV）。即使听不到 A（隐藏终端），也能通过 CTS 知道有人要发数据给 B
        - listitem [ref=e14197]: A 发送 DATA 帧，B 回 ACK
      - blockquote [ref=e14198]:
        - paragraph [ref=e14199]:
          - strong [ref=e14200]: RTS/CTS 的代价
          - text: ：RTS 和 CTS 帧本身也是开销，对于短数据帧，RTS/CTS 的开销占比太大，不合算。所以实际中会设置一个
          - strong [ref=e14201]: RTS 阈值
          - text: ，只有帧长超过阈值时才使用 RTS/CTS。
      - paragraph [ref=e14202]:
        - strong [ref=e14203]: RTS 阈值
        - text: ：通常为 2346 字节（等于最大帧长），意味着默认不启用 RTS/CTS。如果调低阈值（比如 500 字节），则所有大于 500 字节的帧都先 RTS/CTS 握手再发送。
      - heading "隐藏终端与暴露终端详解" [level=3] [ref=e14204]
      - heading "隐藏终端问题" [level=4] [ref=e14205]
      - paragraph [ref=e14206]:
        - strong [ref=e14207]: 场景
        - text: ：A 和 C 都能和中间的 B 通信，但 A 和 C 之间距离太远或有障碍物，互相听不到。
      - code [ref=e14209]: A B C ┌─────┐ ┌─────┐ ┌─────┐ │ │ ← 能通信 → │ │ ← 能通信 → │ │ │ │ │ │ │ │ └─────┘ └─────┘ └─────┘ ↑ ↑ └────── 互相听不到（距离太远或有墙） ─────────┘
      - paragraph [ref=e14210]:
        - strong [ref=e14211]: 问题
        - text: ：A 正在给 B 发数据，C 也想给 B 发数据。C 监听信道，发现"空闲"（因为 C 听不到 A 的信号），于是 C 也开始发送。结果 A 和 C 的信号在 B 处
        - strong [ref=e14212]: 碰撞
        - text: ，B 什么也收不到。A 和 C 都不知道发生了碰撞，因为 A 听不到 C，C 也听不到 A。
      - paragraph [ref=e14213]:
        - strong [ref=e14214]: 解决方案
        - text: ：RTS/CTS 机制。
      - list [ref=e14215]:
        - listitem [ref=e14216]: A 先发 RTS 给 B
        - listitem [ref=e14217]: B 回复 CTS，C 能听到这个 CTS（因为 C 在 B 的通信范围内）
        - listitem [ref=e14218]: C 听到 CTS 后知道 B 正在接收别人的数据，设 NAV 闭嘴
        - listitem [ref=e14219]: 这样碰撞就被避免了
      - heading "暴露终端问题" [level=4] [ref=e14220]
      - paragraph [ref=e14221]:
        - strong [ref=e14222]: 场景
        - text: ：A 正在给 B 发数据，C 想给 D 发数据。C 能听到 A 的信号，但 C → D 的传输并不会干扰 B 的接收（因为 D 离 B 很远）。
      - code [ref=e14224]: A ←──→ B C ←──→ D ┌─────┐ ┌─────┐ ┌─────┐ ┌─────┐ │ │ │ │ │ │ │ │ └─────┘ └─────┘ └─────┘ └─────┘ ↑ ↑ ↑ ↑ └─── 能通信 ──┘ └─── 能通信 ──┘ ↑ ↑ └── C 能听到 A ──┘（但 C→D 不干扰 B）
      - paragraph [ref=e14225]:
        - strong [ref=e14226]: 问题
        - text: ：A 正在给 B 发送数据，C 想给 D 发数据。C 监听信道，发现信道忙（因为 C 能听到 A 的信号），于是 C 不发送。但实际上，C 给 D 发数据并不会干扰 B 的接收（因为 D 在 B 的范围之外）。C 白白浪费了发送机会。
      - paragraph [ref=e14227]:
        - strong [ref=e14228]: RTS/CTS 为什么不能完全解决暴露终端？
      - list [ref=e14229]:
        - listitem [ref=e14230]: C 发送 RTS 给 D，但 C 能听到 A 的信号，认为信道忙
        - listitem [ref=e14231]: 即使 C 发了 RTS，D 回复 CTS 也可能被 A 的信号干扰
        - listitem [ref=e14232]: 所以暴露终端问题在基本 CSMA/CA 框架下没有完美解决方案
      - blockquote [ref=e14233]:
        - paragraph [ref=e14234]:
          - strong [ref=e14235]: 隐藏终端 vs 暴露终端总结
          - text: ：
        - list [ref=e14236]:
          - listitem [ref=e14237]: 隐藏终端：该发不敢发 → 导致碰撞 → 用 RTS/CTS 解决
          - listitem [ref=e14238]: 暴露终端：敢发不能发 → 导致信道浪费 → 没有完美解决方案
          - listitem [ref=e14239]: 两者的本质都是"载波监听的信号范围不等于实际干扰范围"
      - heading "移动通信网络演进" [level=3] [ref=e14240]
