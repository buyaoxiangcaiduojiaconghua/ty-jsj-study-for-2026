            - cell "1" [ref=e15256]
            - cell "1" [ref=e15257]
            - cell "慢开始" [ref=e15258]
            - cell "初始 cwnd=1" [ref=e15259]
          - row [ref=e15260]:
            - cell "2" [ref=e15261]
            - cell "2" [ref=e15262]
            - cell "慢开始" [ref=e15263]
            - cell "指数增长：1→2" [ref=e15264]
          - row [ref=e15265]:
            - cell "3" [ref=e15266]
            - cell "4" [ref=e15267]
            - cell "慢开始" [ref=e15268]
            - cell "指数增长：2→4" [ref=e15269]
          - row [ref=e15270]:
            - cell "4" [ref=e15271]
            - cell "8" [ref=e15272]
            - cell "慢开始" [ref=e15273]
            - cell "指数增长：4→8" [ref=e15274]
          - row [ref=e15275]:
            - cell "5" [ref=e15276]
            - cell "16" [ref=e15277]
            - cell "慢开始" [ref=e15278]
            - cell "指数增长：8→16，达到 ssthresh=16" [ref=e15279]
          - row [ref=e15280]:
            - cell "6" [ref=e15281]
            - cell "17" [ref=e15282]
            - cell "拥塞避免" [ref=e15283]
