            - cell "每部分数据的含义，该做什么动作" [ref=e4419]
            - cell "\"这个数据是什么意思？\"" [ref=e4420]
            - cell "HTTP 状态码 200 表示成功，404 表示找不到" [ref=e4421]
          - row [ref=e4422]:
            - cell [ref=e4423]:
              - strong [ref=e4424]: 同步
            - cell "事件发生的先后顺序" [ref=e4425]
            - cell "\"谁先说话，什么时候说？\"" [ref=e4426]
            - cell "TCP 三次握手：先 SYN，再 SYN+ACK，最后 ACK" [ref=e4427]
      - blockquote [ref=e4428]:
        - paragraph [ref=e4429]: 类比：写信的协议——语法是"收件人→地址→正文→落款"的格式；语义是"收件人"字段表示信寄给谁；同步是"你先写→我收到→我回信"的顺序。
      - heading "为什么要分层？" [level=3] [ref=e4430]
      - paragraph [ref=e4431]:
        - strong [ref=e4432]: 类比
        - text: ：盖房子不会把地基、墙体、水电混在一起干，而是分层施工，每层独立负责一件事。
      - paragraph [ref=e4433]: 三个好处：
      - list [ref=e4434]:
        - listitem [ref=e4435]:
          - strong [ref=e4436]: 各层独立
          - text: ：改一层不影响其他层（HTTP 1.1 → HTTP/2 不关网线的事）
        - listitem [ref=e4437]:
          - strong [ref=e4438]: 灵活性好
          - text: ：每层可以选不同的实现方案
        - listitem [ref=e4439]:
          - strong [ref=e4440]: 易于标准化
          - text: ：每层有明确的接口和协议
      - paragraph [ref=e4441]:
        - strong [ref=e4442]: 分层的核心原则
        - text: ：
      - list [ref=e4443]:
        - listitem [ref=e4444]:
          - text: 每层只使用下层提供的
          - strong [ref=e4445]: 服务
          - text: ，向上层提供
          - strong [ref=e4446]: 服务
        - listitem [ref=e4447]:
          - text: 对等层之间通过
          - strong [ref=e4448]: 协议
          - text: 进行"虚拟通信"（实际上数据通过下层传输）
        - listitem [ref=e4449]:
          - text: 层与层之间通过
          - strong [ref=e4450]: 接口
          - text: （SAP，服务访问点）交互
      - heading "OSI 七层模型（理论标准）" [level=3] [ref=e4451]
      - paragraph [ref=e4452]:
        - strong [ref=e4453]: 口诀
        - text: ：应→表→会→传→网→数→物
      - table [ref=e4454]:
        - rowgroup [ref=e4455]:
          - row [ref=e4456]:
            - columnheader "层次" [ref=e4457]
