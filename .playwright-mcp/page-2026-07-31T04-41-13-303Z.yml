      - heading "递归查询过程详解" [level=4] [ref=e10602]
      - paragraph [ref=e10603]:
        - strong [ref=e10604]: 递归查询
        - text: ：DNS 服务器替你跑腿，要么返回最终结果，要么报错说"找不到"。
      - paragraph [ref=e10605]:
        - strong [ref=e10606]: 完整步骤
        - text: （以查询
        - code [ref=e10607]: www.example.com
        - text: 为例）：
      - code [ref=e10609]: 步骤 1：用户在浏览器输入 www.example.com 步骤 2：浏览器查自己的 DNS 缓存 → 有就用，没有继续 步骤 3：查操作系统 hosts 文件 → 有就用，没有继续 步骤 4：主机向本地 DNS 服务器发起递归查询 步骤 5：本地 DNS 查自己的缓存 → 有就返回，没有则向根域名服务器发起迭代查询 步骤 6：根域名服务器返回 .com 顶级域名服务器的地址 步骤 7：本地 DNS 向 .com 顶级域名服务器查询，返回 example.com 的权威域名服务器地址 步骤 8：本地 DNS 向 example.com 权威域名服务器查询，得到 www.example.com 的 IP 地址 步骤 9：本地 DNS 把 IP 地址返回给主机，并缓存结果
      - blockquote [ref=e10610]:
        - paragraph [ref=e10611]:
          - strong [ref=e10612]: 关键
          - text: ：主机 → 本地 DNS 是递归（你帮我查到底）；本地 DNS → 各级域名服务器是迭代（我给你指路，你自己去问）。
      - heading "迭代查询过程详解" [level=4] [ref=e10613]
      - paragraph [ref=e10614]:
        - strong [ref=e10615]: 迭代查询
        - text: ：DNS 服务器不替你跑腿，而是告诉你"去找谁"，你（或你的本地 DNS）一个个去问。
      - code [ref=e10617]: 本地 DNS 问根域："www.example.com 在哪？" 根域回答："我不知道，但 .com 的服务器在 1.2.3.4，你去问它" 本地 DNS 问 .com 服务器："www.example.com 在哪？" .com 回答："我不知道，但 example.com 的服务器在 5.6.7.8，你去问它" 本地 DNS 问 example.com 服务器："www.example.com 在哪？" example.com 回答："IP 地址是 93.184.216.34"
      - blockquote [ref=e10618]:
        - paragraph [ref=e10619]:
          - strong [ref=e10620]: 实际网络中的做法
          - text: ：本地 DNS 到根/顶级/权威 DNS 通常用迭代查询，用户主机到本地 DNS 用递归查询。这样本地 DNS 承担了大部分工作，用户端只管发一次请求。
      - heading "DNS 记录类型详解" [level=4] [ref=e10621]
      - table [ref=e10622]:
        - rowgroup [ref=e10623]:
          - row [ref=e10624]:
