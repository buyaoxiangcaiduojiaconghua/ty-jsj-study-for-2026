          - row [ref=e9351]:
            - cell [ref=e9352]:
              - strong [ref=e9353]: FIN_WAIT_1
            - cell "主动关闭方发了 FIN，等 ACK" [ref=e9354]
            - cell "主动关闭方" [ref=e9355]
