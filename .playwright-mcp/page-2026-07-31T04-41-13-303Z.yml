      - heading "编码与调制技术" [level=3] [ref=e5390]
      - paragraph [ref=e5391]:
        - strong [ref=e5392]: 编码和调制的区别：
      - list [ref=e5393]:
        - listitem [ref=e5394]:
          - strong [ref=e5395]: 编码
          - text: ：把数字数据变成数字信号（纯 0/1 方波信号），用在数字信道上
        - listitem [ref=e5396]:
          - strong [ref=e5397]: 调制
          - text: ：把数字数据变成模拟信号（连续波），用在模拟信道上
      - blockquote [ref=e5398]:
        - paragraph [ref=e5399]:
          - strong [ref=e5400]: 类比
          - text: ：编码就像用开关灯发送摩斯密码（只有开和关两种状态）；调制就像用不同的口哨音调传递消息（音调可以连续变化）。
      - heading "数字编码方法" [level=4] [ref=e5401]
      - paragraph [ref=e5402]:
        - strong [ref=e5403]: （1）不归零编码（NRZ：Non-Return to Zero）
      - list [ref=e5404]:
        - listitem [ref=e5405]: 规则：低电平 = 0，高电平 = 1（或反过来），整个 bit 周期内电平保持不变
        - listitem [ref=e5406]: 波形特点：连续 1 时一直高电平，连续 0 时一直低电平，没有中间跳变
        - listitem [ref=e5407]:
          - strong [ref=e5408]: 致命缺点
          - text: ：没有同步时钟！如果发送方和接收方时钟有微小偏差，连续 16 个 1 在接收方可能被当成 15 个或 17 个。必须有额外的时钟线或使用含时钟的编码方式。
      - code [ref=e5410]: "数据： 1 0 1 1 0 0 1 NRZ: ─┐ ┌┐ ─┐ ┌┐ │ ││ ││ ││ │ ││ ││ ││ ─┘ └┘ ─┘────────────────┘┘ 高电平=1, 低电平=0, 整个bit周期不变"
      - paragraph [ref=e5411]:
        - strong [ref=e5412]: （2）曼彻斯特编码（Manchester）
      - list [ref=e5413]:
        - listitem [ref=e5414]:
          - text: 规则：
          - strong [ref=e5415]: 每个 bit 中间一定有一次跳变
          - text: 。上跳（低→高）= 0，下跳（高→低）= 1（或反过来，取决于定义）
        - listitem [ref=e5416]: 波形特点：每个 bit 中间都有跳变，所以接收方可以从跳变中提取时钟信号
        - listitem [ref=e5417]:
          - strong [ref=e5418]: 优点
          - text: ：自带同步时钟（自同步），不需要额外的时钟线
        - listitem [ref=e5419]:
          - strong [ref=e5420]: 缺点
          - text: ：带宽利用率低，信号跳变频率是数据速率的两倍（波特率是比特率的两倍）
      - code [ref=e5422]: "数据： 1 0 1 1 0 0 1 Manchester: ─┐ ┌─┐ ─┐ ─┐ ┌─┐ ┌─┐ ─┐ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ │ ─┘ ┘ └─ ─┘ ─┘ ┘ └─ ┘ └─ 上跳(低→高)=0, 下跳(高→低)=1 每个bit中间必有跳变！"
      - paragraph [ref=e5423]:
        - strong [ref=e5424]: （3）差分曼彻斯特编码（Differential Manchester）
      - list [ref=e5425]:
        - listitem [ref=e5426]:
          - text: 规则：
