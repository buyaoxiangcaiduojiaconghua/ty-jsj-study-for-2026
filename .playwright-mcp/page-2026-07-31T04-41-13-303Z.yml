          - row [ref=e9369]:
            - cell [ref=e9370]:
              - strong [ref=e9371]: LAST_ACK
            - cell "被动关闭方发了 FIN，等最后的 ACK" [ref=e9372]
            - cell "被动关闭方" [ref=e9373]
            - cell "很短" [ref=e9374]
          - row [ref=e9375]:
            - cell [ref=e9376]:
              - strong [ref=e9377]: TIME_WAIT
            - cell "主动关闭方收到 FIN，发了最后 ACK，等待 2MSL" [ref=e9378]
            - cell "主动关闭方" [ref=e9379]
            - cell "2MSL（约4分钟）" [ref=e9380]
          - row [ref=e9381]:
            - cell [ref=e9382]:
              - strong [ref=e9383]: CLOSING
            - cell "双方同时关闭，都发了 FIN 但还没收到 ACK" [ref=e9384]
            - cell "双方" [ref=e9385]
            - cell "短暂（少见）" [ref=e9386]
      - paragraph [ref=e9387]:
        - strong [ref=e9388]: 完整状态转换图
        - text: ：
      - code [ref=e9390]: 客户端（主动关闭方） 服务器（被动关闭方） ESTABLISHED ESTABLISHED ↓ 应用层调用 close() ↓ 收到 FIN FIN_WAIT_1 ──FIN──→ CLOSE_WAIT ──ACK──→ ↓ 收到 ACK ↓ 应用层调用 close() FIN_WAIT_2 LAST_ACK ──FIN──→ ↓ 收到 FIN ↓ 收到 ACK TIME_WAIT (等 2MSL) CLOSED ↓ 2MSL 超时 CLOSED
      - heading "TIME_WAIT = 2MSL 的详细论证" [level=4] [ref=e9391]
      - paragraph [ref=e9392]:
        - strong [ref=e9393]: MSL（Maximum Segment Lifetime）
        - text: ：报文段在网络中存活的最长时间。RFC 793 建议为 2 分钟，实际实现中通常为 30 秒 ~ 2 分钟。
      - paragraph [ref=e9394]:
        - strong [ref=e9395]: 为什么是 2MSL？
      - paragraph [ref=e9396]:
        - strong [ref=e9397]: 原因一：保证最后一个 ACK 能到达服务器
      - code [ref=e9399]: 情况：客户端发出最后一个 ACK ↓ ACK 在网络中丢失 ↓ 服务器超时，重传 FIN ↓ 这个重传的 FIN 从服务器到客户端最长时间 = 1 MSL ↓ 客户端收到重传 FIN，再次回复 ACK ↓ ACK 从客户端到服务器最长时间 = 1 MSL ↓ 总计 = 2 MSL
      - paragraph [ref=e9400]: 如果 TIME_WAIT 小于 2MSL，客户端在收到重传 FIN 之前就已经关闭了，无法回复 ACK，服务器会一直重传 FIN 无法关闭。
      - paragraph [ref=e9401]:
        - strong [ref=e9402]: 原因二：让旧连接的所有报文消散
      - code [ref=e9404]: 旧连接：client(IP_A:Port_X) ↔ server(IP_B:Port_Y) 新连接：client(IP_A:Port_X) ↔ server(IP_B:Port_Y) ← 四元组完全相同！
      - paragraph [ref=e9405]: 如果 TIME_WAIT 不够长，旧连接延迟的报文可能在新连接建立后到达，被误认为是新连接的数据，导致数据错乱。等待 2MSL 后，旧连接的所有报文（无论正向反向）都已从网络中消失。
      - heading "为什么 TIME_WAIT 在主动关闭方？" [level=4] [ref=e9406]
      - list [ref=e9407]:
        - listitem [ref=e9408]: 只有主动关闭方才需要确保最后一个 ACK 到达
        - listitem [ref=e9409]: 被动关闭方发出 FIN 后进入 LAST_ACK，收到 ACK 就直接 CLOSED，不需要等
        - listitem [ref=e9410]: 如果被动关闭方也等 TIME_WAIT，双方都等，资源浪费更严重
      - blockquote [ref=e9411]:
        - paragraph [ref=e9412]:
          - strong [ref=e9413]: 类比
          - text: ：你给朋友打电话说"挂了吧"，你说完挂断（主动关闭），但你要等几秒确认朋友也听到了。朋友听到你说"挂了吧"后直接挂（被动关闭），不需要等。
      - heading "CLOSE_WAIT 状态大量出现说明什么问题？" [level=4] [ref=e9414]
      - paragraph [ref=e9415]:
        - strong [ref=e9416]: CLOSE_WAIT
        - text: 是服务器收到对方的 FIN 并回复 ACK 后进入的状态，意味着
        - strong [ref=e9417]: 对方已经关闭了，但我方应用层还没调用 close()
        - text: 。
      - paragraph [ref=e9418]: 大量 CLOSE_WAIT 说明：
      - list [ref=e9419]:
        - listitem [ref=e9420]:
          - strong [ref=e9421]: 应用程序有 Bug
          - text: ：收到 FIN 后没有调用 close() 关闭连接
        - listitem [ref=e9422]:
          - strong [ref=e9423]: 文件描述符泄漏
          - text: ：进程忘记关闭 socket，连接被"晾"在那里
        - listitem [ref=e9424]: 最终会耗尽文件描述符，导致无法建立新连接
      - blockquote [ref=e9425]:
        - paragraph [ref=e9426]: 这是真实的线上故障场景！排查方向：检查应用代码中是否处理了连接关闭逻辑。
      - heading "三次挥手可以吗？为什么不可以？" [level=4] [ref=e9427]
      - paragraph [ref=e9428]:
        - strong [ref=e9429]: 不可以
        - text: 。因为 TCP 是
        - strong [ref=e9430]: 全双工
        - text: 通信——数据可以同时在两个方向传输。
      - code [ref=e9432]: 假设只挥三次： 客户端 → FIN → ← ACK+FIN ← （合并第二步和第三步） 客户端 → ACK → 问题：服务器收到 FIN 后，可能还有数据没发完！ 如果把 ACK 和 FIN 合并，服务器就没机会发完剩余数据了。
      - paragraph [ref=e9433]:
        - strong [ref=e9434]: 正确做法（四次挥手）
        - text: ：
      - list [ref=e9435]:
        - listitem [ref=e9436]: 第二步 ACK：告诉对方"我知道你要关了，但我可能还有数据要发"
        - listitem [ref=e9437]: 第三步 FIN：发完剩余数据后，"我也要关了"
        - listitem [ref=e9438]:
          - text: 两次之间，服务器可以继续发送剩余数据（
          - strong [ref=e9439]: 半关闭状态
          - text: ）
      - blockquote [ref=e9440]:
        - paragraph [ref=e9441]: 类比：A 对 B 说"我说完了" → B 说"知道了"（但 B 可能还要说几句）→ B 说"我也说完了" → A 说"好的"。如果 B 把"知道了"和"我也说完了"合并，B 就没机会说剩下的话了。
      - heading "TCP 可靠传输机制" [level=3] [ref=e9442]
      - table [ref=e9443]:
        - rowgroup [ref=e9444]:
          - row [ref=e9445]:
            - columnheader "机制" [ref=e9446]
            - columnheader "作用" [ref=e9447]
