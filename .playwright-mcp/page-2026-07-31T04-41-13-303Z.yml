          - strong [ref=e6071]: 第 1 位（最低位）为 1
          - text: 的位置 → 1, 3, 5, 7, 9, 11...
        - listitem [ref=e6072]:
          - text: P2 负责：位置编号二进制表示中，
          - strong [ref=e6073]: 第 2 位为 1
