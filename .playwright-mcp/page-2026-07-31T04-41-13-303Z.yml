            - cell "302 Found" [ref=e11381]
            - cell "301 Moved Permanently" [ref=e11382]
          - row [ref=e11383]:
            - cell [ref=e11384]:
              - strong [ref=e11385]: 方法不变
            - cell "307 Temporary Redirect" [ref=e11386]
            - cell "308 Permanent Redirect" [ref=e11387]
      - paragraph [ref=e11388]:
        - strong [ref=e11389]: "Q2: 401 vs 403 的区别？"
      - list [ref=e11390]:
        - listitem [ref=e11391]:
          - text: 401：用户
          - strong [ref=e11392]: 未认证
          - text: （不知道你是谁），需要登录
        - listitem [ref=e11393]:
          - text: 403：用户
          - strong [ref=e11394]: 已认证但无权限
          - text: （知道你是谁但不让你访问）
      - paragraph [ref=e11395]:
        - strong [ref=e11396]: "Q3: 502 vs 504 的区别？"
      - list [ref=e11397]:
        - listitem [ref=e11398]:
          - text: 502：网关收到上游服务器的
          - strong [ref=e11399]: 无效响应
        - listitem [ref=e11400]:
          - text: 504：网关在超时时间内
          - strong [ref=e11401]: 未收到
          - text: 上游响应
      - paragraph [ref=e11402]:
        - strong [ref=e11403]: "Q4: 304 Not Modified 的工作原理？"
        - text: 用于缓存验证。客户端发送带
        - code [ref=e11404]: If-Modified-Since
        - text: 或
        - code [ref=e11405]: If-None-Match
        - text: 的条件请求，若资源未变化，服务器返回 304（无响应体），客户端继续使用本地缓存。
      - paragraph [ref=e11406]:
        - strong [ref=e11407]: "Q5: RESTful API 状态码最佳实践？"
