        - paragraph [ref=e13834]: 为什么需要四个地址？因为无线帧可能经过 AP 转发：从 STA1 到 AP（地址2=STA1, 地址1=AP, 地址3=最终目的），再从 AP 到 STA2（地址2=AP, 地址1=STA2, 地址3=最终目的）。地址4 只在 WDS（无线分布式系统，AP 之间桥接）时使用。
