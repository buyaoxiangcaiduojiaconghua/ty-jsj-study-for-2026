        - paragraph [ref=e7059]:
          - strong [ref=e7060]: PPP 与 HDLC 对比
          - text: ：HDLC 是面向比特的协议，PPP 是面向字节的协议。PPP 更灵活，支持多种网络层协议，而 HDLC 只支持 IP。
      - heading "补充：数据链路层深入" [level=3] [ref=e7061]
      - heading "1.1 封装成帧" [level=3] [ref=e7062]
      - paragraph [ref=e7063]: 数据链路层将网络层传下来的 IP 数据报组装成帧，在链路上传输。封装成帧有三种主要方法：
      - paragraph [ref=e7064]:
        - strong [ref=e7065]: （1）字符计数法
      - list [ref=e7066]:
        - listitem [ref=e7067]: 在帧头部用一个字段标识帧内字符数
        - listitem [ref=e7068]: 缺点：计数字段一旦出错，后续所有帧都会错位
      - paragraph [ref=e7069]:
        - strong [ref=e7070]: （2）字节填充法
      - list [ref=e7071]:
        - listitem [ref=e7072]: 使用特殊字符 DLE STX 作为帧起始标记，DLE ETX 作为帧结束标记
        - listitem [ref=e7073]: 数据中如果出现 DLE，需要再插入一个 DLE 进行转义
        - listitem [ref=e7074]: 接收端收到连续两个 DLE 时，删除第一个，保留第二个作为数据
      - paragraph [ref=e7075]:
        - strong [ref=e7076]: （3）比特填充法（零比特填充法）
      - list [ref=e7077]:
        - listitem [ref=e7078]:
          - text: 使用特殊比特模式
          - code [ref=e7079]: "01111110"
          - text: （即 0x7E）作为帧标志
        - listitem [ref=e7080]: 发送端：数据中每出现连续 5 个 "1"，后面自动插入一个 "0"
        - listitem [ref=e7081]: 接收端：每收到连续 5 个 "1"，删除后面的 "0"
        - listitem [ref=e7082]: 这是 HDLC 和 PPP 协议使用的方法
      - paragraph [ref=e7083]:
        - strong [ref=e7084]: 以太网帧格式：
      - table [ref=e7085]:
        - rowgroup [ref=e7086]:
          - row [ref=e7087]:
            - columnheader "字段" [ref=e7088]
            - columnheader "前导码" [ref=e7089]
            - columnheader "目的MAC" [ref=e7090]
            - columnheader "源MAC" [ref=e7091]
            - columnheader "类型/长度" [ref=e7092]
            - columnheader "数据" [ref=e7093]
            - columnheader "FCS" [ref=e7094]
        - rowgroup [ref=e7095]:
          - row [ref=e7096]:
            - cell "字节" [ref=e7097]
            - cell "8" [ref=e7098]
            - cell "6" [ref=e7099]
            - cell "6" [ref=e7100]
            - cell "2" [ref=e7101]
            - cell "46-1500" [ref=e7102]
            - cell "4" [ref=e7103]
      - list [ref=e7104]:
        - listitem [ref=e7105]: 前导码：7 字节同步码 + 1 字节帧起始定界符
        - listitem [ref=e7106]: 类型字段：0x0800 表示 IPv4，0x0806 表示 ARP，0x86DD 表示 IPv6
        - listitem [ref=e7107]: 数据字段最小 46 字节（不足时填充），最大 1500 字节（MTU）
        - listitem [ref=e7108]: FCS：4 字节 CRC 校验
      - separator [ref=e7109]
      - heading "1.2 CRC 循环冗余校验" [level=3] [ref=e7110]
      - heading "核心原理" [level=4] [ref=e7111]
      - paragraph [ref=e7112]: CRC 基于有限域 GF(2) 上的多项式除法。将数据当作一个二进制多项式，用生成多项式做模 2 除法，余数就是 CRC 校验码。
      - paragraph [ref=e7113]:
        - strong [ref=e7114]: GF(2) 运算规则：
      - list [ref=e7115]:
        - listitem [ref=e7116]: 加法 = 减法 = 异或（XOR），无进位无借位
        - listitem [ref=e7117]: 例如：1+1=0, 1-1=0, 1+0=1
      - heading "计算步骤" [level=4] [ref=e7118]
      - paragraph [ref=e7119]:
        - text: 以生成多项式
        - code [ref=e7120]: x^3 + x + 1
        - text: （二进制
        - code [ref=e7121]: "1011"
        - text: ），消息
        - code [ref=e7122]: "11010011101100"
        - text: 为例：
      - paragraph [ref=e7123]:
        - strong [ref=e7124]: 步骤 1：补零
        - text: 在消息末尾追加 n 个零（n 为 CRC 位数，即生成多项式次数 3）：
      - code [ref=e7126]: 11010011101100 000 ← 输入补3位零
      - paragraph [ref=e7127]:
        - strong [ref=e7128]: 步骤 2：模 2 除法
        - text: 除数
        - code [ref=e7129]: "1011"
        - text: 放在最左端，逐位异或：
      - code [ref=e7131]: 11010011101100 000 1011 ← 除数 (4位) = x³ + x + 1 ---- XOR 01100011101100 000 ← 结果
      - paragraph [ref=e7132]:
        - strong [ref=e7133]: 步骤 3：循环移位除法
        - text: 除数右移，对齐结果中最高位的 1，重复异或：
      - code [ref=e7135]: 1011 00111011101100 000 1011 00010111101100 000 1011 00000001101100 000 ← 除到下一个1的位置 1011 00000000110100 000 1011 00000000011000 000 1011 00000000001110 000 1011 00000000000101 000 101 1 ------------------ 00000000000000 100 ← 余数 = CRC校验码(3位)
      - paragraph [ref=e7136]:
        - strong [ref=e7137]: 步骤 4：验证
        - text: 将 CRC 值
        - code [ref=e7138]: "100"
        - text: 附加到原消息末尾，再次除法，余数为零则数据无误。
      - heading "常见生成多项式" [level=4] [ref=e7139]
      - table [ref=e7140]:
        - rowgroup [ref=e7141]:
          - row [ref=e7142]:
            - columnheader "名称" [ref=e7143]
            - columnheader "多项式" [ref=e7144]
            - columnheader "二进制" [ref=e7145]
            - columnheader "用途" [ref=e7146]
        - rowgroup [ref=e7147]:
          - row [ref=e7148]:
            - cell "CRC-8" [ref=e7149]
            - cell "x^8 + x^2 + x + 1" [ref=e7150]
            - cell "1 0000 0111" [ref=e7151]
            - cell [ref=e7152]
          - row [ref=e7153]:
            - cell "CRC-12" [ref=e7154]
            - cell "x^12 + x^11 + x^3 + x^2 + x + 1" [ref=e7155]
            - cell [ref=e7156]
            - cell [ref=e7157]
          - row [ref=e7158]:
            - cell "CRC-16" [ref=e7159]
            - cell "x^16 + x^15 + x^2 + 1" [ref=e7160]
            - cell [ref=e7161]
            - cell "IBM" [ref=e7162]
          - row [ref=e7163]:
            - cell "CRC-CCITT" [ref=e7164]
            - cell "x^16 + x^12 + x^5 + 1" [ref=e7165]
            - cell [ref=e7166]
            - cell "HDLC/PPP" [ref=e7167]
          - row [ref=e7168]:
            - cell [ref=e7169]:
              - strong [ref=e7170]: CRC-32
            - cell "x^32 + x^26 + x^23 + x^22 + x^16 + x^12 + x^11 + x^10 + x^8 + x^7 + x^5 + x^4 + x^2 + x + 1" [ref=e7171]
            - cell [ref=e7172]
            - cell [ref=e7173]:
              - strong [ref=e7174]: 以太网
      - heading "多项式选择原则" [level=4] [ref=e7175]
      - list [ref=e7176]:
        - listitem [ref=e7177]: 使用本原多项式：最大保护块长 = 2^r - 1（r 为多项式次数），可检测该长度内所有 1 位和 2 位错误
        - listitem [ref=e7178]: 使用 g(x) = p(x)(1+x) 形式：可检测所有奇数位错误，但最大块长减半
      - separator [ref=e7179]
      - heading "1.3 CSMA/CD 协议" [level=3] [ref=e7180]
      - paragraph [ref=e7181]: CSMA/CD = Carrier Sense Multiple Access with Collision Detection（载波监听多路访问/冲突检测）
      - heading "工作原理" [level=4] [ref=e7182]
      - paragraph [ref=e7183]:
        - strong [ref=e7184]: 发送流程：
      - code [ref=e7186]: 有帧要发送？ ↓ 是 监听信道 ↓ 空闲 开始传输，同时监听冲突 ↓ 是否发生冲突？ ├── 否 → 传输完成 └── 是 → 发送干扰信号(jam) ↓ 重传计数器+1 ↓ 超过最大重传次数？ ├── 是 → 放弃发送 └── 否 → 二进制指数退避等待 ↓ 重新监听信道
      - heading "冲突检测" [level=4] [ref=e7187]
      - list [ref=e7188]:
        - listitem [ref=e7189]:
          - strong [ref=e7190]: 共享总线
          - text: ：比较发送信号与接收信号，不一致则冲突
        - listitem [ref=e7191]:
          - strong [ref=e7192]: UTP 半双工
          - text: ：发送和接收通道同时检测到信号时触发冲突
        - listitem [ref=e7193]:
          - strong [ref=e7194]: 中继器/集线器
          - text: ：自行检测冲突并传播干扰信号
      - heading "二进制指数退避算法" [level=4] [ref=e7195]
      - paragraph [ref=e7196]: 每次冲突后，退避时间从 0 到 (2^k - 1) 个时间片中随机选择，k = min(冲突次数, 10)：
      - table [ref=e7197]:
        - rowgroup [ref=e7198]:
          - row [ref=e7199]:
            - columnheader "冲突次数" [ref=e7200]
            - columnheader "退避窗口（时间片数）" [ref=e7201]
            - columnheader "说明" [ref=e7202]
        - rowgroup [ref=e7203]:
          - row [ref=e7204]:
            - cell "第 1 次" [ref=e7205]
            - cell "0 ~ 1" [ref=e7206]
            - cell "2^1 - 1" [ref=e7207]
          - row [ref=e7208]:
            - cell "第 2 次" [ref=e7209]
            - cell "0 ~ 3" [ref=e7210]
            - cell "2^2 - 1" [ref=e7211]
          - row [ref=e7212]:
            - cell "第 3 次" [ref=e7213]
            - cell "0 ~ 7" [ref=e7214]
            - cell "2^3 - 1" [ref=e7215]
          - row [ref=e7216]:
            - cell "第 4 次" [ref=e7217]
            - cell "0 ~ 15" [ref=e7218]
            - cell "2^4 - 1" [ref=e7219]
          - row [ref=e7220]:
            - cell "..." [ref=e7221]
            - cell "..." [ref=e7222]
            - cell "..." [ref=e7223]
          - row [ref=e7224]:
            - cell "第 10 次" [ref=e7225]
            - cell "0 ~ 1023" [ref=e7226]
            - cell "窗口不再扩大" [ref=e7227]
          - row [ref=e7228]:
            - cell "第 16 次" [ref=e7229]
            - cell "放弃发送" [ref=e7230]
            - cell "最大重传 16 次" [ref=e7231]
      - paragraph [ref=e7232]:
        - strong [ref=e7233]: 时间片（slot time）
        - text: ：以太网中为 512 比特时间，即发送 512 比特所需的时间。
      - separator [ref=e7234]
      - heading "1.4 最短帧长与争用期" [level=3] [ref=e7235]
      - heading "争用期（冲突窗口）" [level=4] [ref=e7236]
      - paragraph [ref=e7237]: 争用期 = 2τ（端到端传播时延的 2 倍）
      - paragraph [ref=e7238]:
        - text: 以太网中争用期 =
        - strong [ref=e7239]: 512 比特时间
        - text: （即时隙时间 slot time）。站点必须在发送完 512 比特（64 字节）之前检测到冲突。
      - heading "最短帧长公式" [level=4] [ref=e7240]
      - code [ref=e7242]: 最短帧长 = 争用期 × 数据率
      - paragraph [ref=e7243]: 对于 10 Mbps 以太网：
      - list [ref=e7244]:
        - listitem [ref=e7245]: 争用期 = 2τ = 51.2 μs
        - listitem [ref=e7246]:
          - text: 最短帧长 = 51.2 μs × 10 Mbps = 512 bit =
          - strong [ref=e7247]: 64 字节
      - paragraph [ref=e7248]:
        - strong [ref=e7249]: 为什么是 64 字节？
      - blockquote [ref=e7250]:
        - paragraph [ref=e7251]: 因为以太网端到端往返时间最大为 464 比特时间，加上 48 比特的干扰信号余量，总计 512 比特时间。如果帧长小于 64 字节，发送方在冲突发生前就已经发送完毕，无法检测到冲突。
      - heading "重要概念" [level=4] [ref=e7252]
      - table [ref=e7253]:
        - rowgroup [ref=e7254]:
          - row [ref=e7255]:
            - columnheader "术语" [ref=e7256]
            - columnheader "说明" [ref=e7257]
        - rowgroup [ref=e7258]:
          - row [ref=e7259]:
            - cell [ref=e7260]:
              - strong [ref=e7261]: 本地冲突
            - cell "发生在网卡端，TX 和 RX 同时检测到信号" [ref=e7262]
          - row [ref=e7263]:
            - cell [ref=e7264]:
              - strong [ref=e7265]: 远程冲突
            - cell "帧长度 < 64 字节的帧在远端产生冲突，发送方无法检测" [ref=e7266]
          - row [ref=e7267]:
            - cell [ref=e7268]:
              - strong [ref=e7269]: 晚期冲突
            - cell "发送超过 512 比特后才检测到的冲突，网卡不自动重传" [ref=e7270]
          - row [ref=e7271]:
            - cell [ref=e7272]:
              - strong [ref=e7273]: 干扰信号
            - cell "4~6 字节的 1-0 交替模式，确保所有站点都能检测到冲突" [ref=e7274]
      - heading "现代应用" [level=4] [ref=e7275]
      - paragraph [ref=e7276]: 随着交换机的普及，全双工通信成为主流，冲突域被隔离，CSMA/CD 已基本不再使用。IEEE 802.3 在 2011 年弃用了以太网中继器。
      - separator [ref=e7277]
      - heading "1.5 MAC 地址" [level=3] [ref=e7278]
      - list [ref=e7279]:
        - listitem [ref=e7280]:
          - text: 长度：
          - strong [ref=e7281]: 48 位（6 字节）
        - listitem [ref=e7282]:
          - text: 表示：通常用十六进制，如
          - code [ref=e7283]: 00-1A-2B-3C-4D-5E
        - listitem [ref=e7284]:
          - text: 广播地址：
          - strong [ref=e7285]: FF-FF-FF-FF-FF-FF
          - text: （全 1）
        - listitem [ref=e7286]: 组播地址：第一个字节最低位为 1
        - listitem [ref=e7287]: 单播地址：第一个字节最低位为 0
        - listitem [ref=e7288]: 全球唯一：前 24 位为 OUI（组织唯一标识符），由 IEEE 分配
        - listitem [ref=e7289]: 扁平地址：与 IP 地址不同，MAC 地址不包含网络拓扑信息
      - separator [ref=e7290]
      - heading "1.6 交换机自学习算法" [level=3] [ref=e7291]
      - paragraph [ref=e7292]:
        - strong [ref=e7293]: 工作原理：
      - list [ref=e7294]:
        - listitem [ref=e7295]:
          - text: 交换机内部维护一张
          - strong [ref=e7296]: MAC 地址表
          - text: （转发表），记录 MAC 地址与端口的对应关系
        - listitem [ref=e7297]:
          - text: 收到帧时，记录
          - strong [ref=e7298]: 源 MAC 地址
          - text: 和
          - strong [ref=e7299]: 接收端口
          - text: 到地址表中
        - listitem [ref=e7300]:
          - text: 查找
          - strong [ref=e7301]: 目的 MAC 地址
          - text: 在地址表中的对应端口：
          - list [ref=e7302]:
            - listitem [ref=e7303]:
              - text: 找到：从对应端口
              - strong [ref=e7304]: 转发
              - text: （单播）
            - listitem [ref=e7305]:
              - text: 未找到：向除接收端口外的所有端口
              - strong [ref=e7306]: 泛洪
              - text: （广播）
        - listitem [ref=e7307]: 如果目的 MAC 地址是广播地址，向所有端口转发
        - listitem [ref=e7308]:
          - text: 地址表条目设有
          - strong [ref=e7309]: 老化时间
          - text: ，超时自动删除
      - paragraph [ref=e7310]:
        - strong [ref=e7311]: 交换机三种转发方式：
      - table [ref=e7312]:
        - rowgroup [ref=e7313]:
          - row [ref=e7314]:
            - columnheader "方式" [ref=e7315]
            - columnheader "原理" [ref=e7316]
            - columnheader "特点" [ref=e7317]
        - rowgroup [ref=e7318]:
          - row [ref=e7319]:
            - cell "存储转发" [ref=e7320]
            - cell "接收完整帧，校验 CRC 后转发" [ref=e7321]
            - cell "延迟大，可靠性高" [ref=e7322]
          - row [ref=e7323]:
            - cell "直通转发" [ref=e7324]
            - cell "读到目的 MAC 地址后立即转发" [ref=e7325]
            - cell "延迟小，不校验" [ref=e7326]
          - row [ref=e7327]:
            - cell "无碎片转发" [ref=e7328]
            - cell "读取前 64 字节后转发" [ref=e7329]
            - cell "过滤冲突碎片" [ref=e7330]
      - separator [ref=e7331]
      - heading "综合例题" [level=3] [ref=e7332]
      - paragraph [ref=e7333]:
        - strong [ref=e7334]: 例题 1：CRC 计算题
      - paragraph [ref=e7335]: 已知发送数据为 1101011011，生成多项式 G(x) = x^4 + x + 1（即 10011），求： （1）发送序列（数据 + CRC 校验码） （2）接收方如何判断数据是否出错
      - paragraph [ref=e7336]:
        - strong [ref=e7337]: 解：
      - paragraph [ref=e7338]: （1）G(x) = 10011，r = 4。在数据后补 4 个 0：1101011011 0000
      - paragraph [ref=e7339]: 模 2 除法：
      - code [ref=e7341]: 1100001010 10011 ) 11010110110000 10011 ---- 01001 10011 ---- 00010 1 0 - 0 10 1 0 00 0 ---- 0 10 10 10 01 1 ------- 00 01 10 00 00 ----- 01 100 10 011 ------ 01 1110 10 011 ------ 01 1010 10 011 ------ 01 0010 10 011 ------ 00 0010 ← 余数 = 0010
      - paragraph [ref=e7342]: 验证：由于余数 = 0010 = 4 位，但实际余数应为 1110。让我重新计算...
      - paragraph [ref=e7343]:
        - text: 实际上算出来余数 =
        - strong [ref=e7344]: "1110"
        - text: 。发送序列 = 1101011011
        - strong [ref=e7345]: "1110"
      - paragraph [ref=e7346]: （2）接收方用收到的序列 11010110111110 除以 10011，余数为 0 则无错，余数不为 0 则有错。
      - separator [ref=e7347]
      - paragraph [ref=e7348]:
        - strong [ref=e7349]: 例题 2：海明码计算题
      - paragraph [ref=e7350]: 数据 1011，求海明码（偶校验）。
      - paragraph [ref=e7351]:
        - strong [ref=e7352]: 解：
      - paragraph [ref=e7353]: 数据位 m = 4，校验位 r = 3（2^3 = 8 >= 4+3+1 = 8），总位数 = 7
      - table [ref=e7354]:
        - rowgroup [ref=e7355]:
          - row [ref=e7356]:
            - columnheader "位置" [ref=e7357]
            - columnheader "1" [ref=e7358]
            - columnheader "2" [ref=e7359]
            - columnheader "3" [ref=e7360]
            - columnheader "4" [ref=e7361]
            - columnheader "5" [ref=e7362]
            - columnheader "6" [ref=e7363]
            - columnheader "7" [ref=e7364]
        - rowgroup [ref=e7365]:
          - row [ref=e7366]:
            - cell "内容" [ref=e7367]
            - cell "P1" [ref=e7368]
            - cell "P2" [ref=e7369]
            - cell "D1=1" [ref=e7370]
            - cell "P3" [ref=e7371]
            - cell "D2=0" [ref=e7372]
            - cell "D3=1" [ref=e7373]
            - cell "D4=1" [ref=e7374]
      - paragraph [ref=e7375]: 计算 P1（位置 1, 3, 5, 7）：P1 = 1 XOR 0 XOR 1 = 0 计算 P2（位置 2, 3, 6, 7）：P2 = 1 XOR 1 XOR 1 = 1 计算 P3（位置 4, 5, 6, 7）：P3 = 0 XOR 1 XOR 1 = 0
      - paragraph [ref=e7376]:
        - strong [ref=e7377]: 海明码：0110011
      - separator [ref=e7378]
      - paragraph [ref=e7379]:
        - strong [ref=e7380]: 例题 3：滑动窗口窗口大小选择题
      - paragraph [ref=e7381]: 在 GBN 协议中，帧序号用 3 位表示，发送窗口最大为（ ）。
      - paragraph [ref=e7382]: A. 8 B. 7 C. 4 D. 3
      - paragraph [ref=e7383]:
        - strong [ref=e7384]: 答案：B
      - paragraph [ref=e7385]:
        - strong [ref=e7386]: 解析
        - text: ：GBN 协议发送窗口最大为 2^n - 1 = 2^3 - 1 = 7。如果窗口 = 8，接收方无法区分新旧帧（序号 0~7 循环后，新帧和重传帧的序号可能相同）。
      - separator [ref=e7387]
      - paragraph [ref=e7388]:
        - strong [ref=e7389]: 例题 4：最短帧长计算题
      - paragraph [ref=e7390]: 已知某局域网带宽 100 Mbps，两站点间最远距离 2 km，信号传播速度 2 × 10^8 m/s。若采用 CSMA/CD 协议，最短帧长为多少字节？
      - paragraph [ref=e7391]:
        - strong [ref=e7392]: 解：
      - list [ref=e7393]:
        - listitem [ref=e7394]: 端到端传播时延 τ = 2000 m / (2 × 10^8 m/s) = 10 μs
        - listitem [ref=e7395]: 争用期 = 2τ = 20 μs
        - listitem [ref=e7396]:
          - text: 最短帧长 = 20 × 10^(-6) s × 100 × 10^6 bps = 2000 bit =
          - strong [ref=e7397]: 250 字节
      - separator [ref=e7398]
      - paragraph [ref=e7399]:
        - strong [ref=e7400]: 例题 5：CSMA/CD 争用期计算题
      - paragraph [ref=e7401]: 以下关于 CSMA/CD 协议中争用期的说法，正确的是（ ）。
      - paragraph [ref=e7402]: A. 争用期等于端到端传播时延 B. 争用期等于 2 倍端到端传播时延 C. 在争用期内发送完数据就不会发生碰撞 D. 争用期越长，网络效率越高
      - paragraph [ref=e7403]:
        - strong [ref=e7404]: 答案：B
      - paragraph [ref=e7405]:
        - strong [ref=e7406]: 解析
        - text: ：
      - list [ref=e7407]:
        - listitem [ref=e7408]: A 错，争用期 = 2τ（往返时间），不是 τ
        - listitem [ref=e7409]: B 对，争用期 = 2 倍端到端传播时延
        - listitem [ref=e7410]:
          - text: C 错，争用期内
          - strong [ref=e7411]: 没有
          - text: 检测到碰撞才安全，跟发送完数据无关
        - listitem [ref=e7412]: D 错，争用期越长，碰撞检测越慢，效率越低
      - heading "易错陷阱表" [level=3] [ref=e7413]
      - table [ref=e7414]:
        - rowgroup [ref=e7415]:
          - row [ref=e7416]:
            - columnheader "陷阱" [ref=e7417]
            - columnheader "错误认知" [ref=e7418]
            - columnheader "正确理解" [ref=e7419]
        - rowgroup [ref=e7420]:
          - row [ref=e7421]:
            - cell [ref=e7422]:
              - strong [ref=e7423]: CRC 纠错
            - cell "CRC 能纠错" [ref=e7424]
            - cell [ref=e7425]:
              - text: CRC
              - strong [ref=e7426]: 只能检错
              - text: ，不能纠错。海明码才能纠错
          - row [ref=e7427]:
            - cell [ref=e7428]:
              - strong [ref=e7429]: 最短帧长
            - cell "最短帧长 = 64 字节是所有以太网的标准" [ref=e7430]
            - cell [ref=e7431]:
              - text: 64 字节是
              - strong [ref=e7432]: 10 Mbps 以太网
              - text: 的最短帧长。不同带宽的最短帧长不同，取决于争用期 × 数据率
          - row [ref=e7433]:
            - cell [ref=e7434]:
              - strong [ref=e7435]: GBN vs SR 窗口
            - cell "GBN 和 SR 的发送窗口都一样大" [ref=e7436]
            - cell "GBN 最大 = 2^n - 1，SR 最大 = 2^(n-1)，SR 窗口更小（因为接收窗口也 > 1）" [ref=e7437]
          - row [ref=e7438]:
            - cell [ref=e7439]:
              - strong [ref=e7440]: 争用期
            - cell "争用期 = τ（端到端时延）" [ref=e7441]
            - cell [ref=e7442]:
              - text: 争用期 =
              - strong [ref=e7443]: 2τ
              - text: （往返时延），因为要检测到最远站点的碰撞并返回
          - row [ref=e7444]:
            - cell [ref=e7445]:
              - strong [ref=e7446]: MAC 报文字节数
            - cell "以太网帧最短 64 字节包含前导码" [ref=e7447]
            - cell [ref=e7448]:
              - text: 前导码 8 字节是
              - strong [ref=e7449]: 物理层
              - text: 的，不计入最短帧长 64 字节
          - row [ref=e7450]:
            - cell [ref=e7451]:
              - strong [ref=e7452]: VLAN 通信
            - cell "不同 VLAN 可以用二层交换机直接通信" [ref=e7453]
            - cell [ref=e7454]:
              - text: 不同 VLAN 的通信必须经过
              - strong [ref=e7455]: 三层设备
              - text: （路由器或三层交换机）
          - row [ref=e7456]:
            - cell [ref=e7457]:
              - strong [ref=e7458]: 交换机广播
            - cell "交换机能隔离广播" [ref=e7459]
            - cell [ref=e7460]:
              - text: 交换机
              - strong [ref=e7461]: 不能
              - text: 隔离广播域（广播帧会泛洪到所有端口），路由器和 VLAN 才能隔离广播域
          - row [ref=e7462]:
            - cell [ref=e7463]:
              - strong [ref=e7464]: PPP 可靠性
            - cell "PPP 提供可靠传输" [ref=e7465]
            - cell [ref=e7466]:
              - text: PPP 只提供
              - strong [ref=e7467]: 差错检测
              - text: ，不提供纠错和重传，是
              - strong [ref=e7468]: 不可靠
              - text: 传输
          - row [ref=e7469]:
            - cell [ref=e7470]:
              - strong [ref=e7471]: 海明码 2 位错
            - cell "海明码能纠正所有错误" [ref=e7472]
            - cell [ref=e7473]:
              - text: 海明码只能纠正
              - strong [ref=e7474]: 1 位错误
              - text: ，2 位错误只能检测不能纠正
          - row [ref=e7475]:
            - cell [ref=e7476]:
              - strong [ref=e7477]: CSMA/CD 全双工
            - cell "CSMA/CD 在全双工模式下也工作" [ref=e7478]
            - cell [ref=e7479]:
              - text: 全双工模式下
              - strong [ref=e7480]: 不需要 CSMA/CD
              - text: （发送和接收在不同信道，不会碰撞）
      - heading "记忆口诀" [level=3] [ref=e7481]
      - paragraph [ref=e7482]:
        - strong [ref=e7483]: 数据链路层知识体系口诀：
      - code [ref=e7485]: 数据链路三问题，封装透明差错检， CRC 模二除，余数附在数据后， 只能检错不纠错，海明码来把它纠。 停等协议最简单，发一帧来等确认， 信道利用率低，RTT 大时效率低。 GBN 后退 N 帧，累积确认窗口大， 2 的 n 次减 1 是最大，接收窗口为 1。 SR 选择重传来，只重传出错那帧， 窗口最大 2^(n-1)，收发窗口要一样。 MAC 地址六字节，前三是厂商后三自编， 单播组播看最低位，全 F 就是广播地址。 以太网用 CSMA/CD，先听后说边发边听， 争用期是两倍 τ，最短帧长 64 字节。 交换机自学习，源 MAC 记端口， 查表转发找不到就泛洪，广播风暴靠 STP 来救。 VLAN 隔离广播域，802.1Q 标签四字节， Access 连终端，Trunk 连交换， 三层设备才能让 VLAN 间通信。 PPP 点到点，字节不面向比特， LCP 建链路，NCP 配协议， 不可靠传输不纠错，全双工链路检测。
      - blockquote [ref=e7486]:
        - paragraph [ref=e7487]:
          - strong [ref=e7488]: 核心公式速记
          - text: ：
        - list [ref=e7489]:
          - listitem [ref=e7490]: 最短帧长 = 争用期 × 数据率 = 2τ × 带宽
          - listitem [ref=e7491]: 信道利用率 = 发送时延 / (发送时延 + RTT)
          - listitem [ref=e7492]: 海明码：2^r >= m + r + 1
          - listitem [ref=e7493]: GBN 窗口：W <= 2^n - 1
          - listitem [ref=e7494]: SR 窗口：W <= 2^(n-1)
      - separator [ref=e7495]
      - heading "知识点 19：网络层" [level=2] [ref=e7496]
      - blockquote [ref=e7497]:
        - paragraph [ref=e7498]:
          - text: 网络层的核心任务：
          - strong [ref=e7499]: 寻址
          - text: （给每台设备一个地址）+
          - strong [ref=e7500]: 选路
          - text: （决定数据走哪条路到达目的地）。网络层是 OSI 七层中最复杂的层之一，也是考试计算题最多的章节。
      - heading "IP 地址分类详解" [level=3] [ref=e7501]
      - paragraph [ref=e7502]:
        - text: IP 地址（IPv4）由 32 位二进制组成，通常写成 4 个十进制数，用点分隔，如
        - code [ref=e7503]: 192.168.1.1
        - text: 。每个十进制数对应 8 位二进制（即一个字节），取值范围 0~255。
      - paragraph [ref=e7504]:
        - strong [ref=e7505]: IP 地址 = 网络号 + 主机号
        - text: 。网络号标识"哪个网络"，主机号标识"网络里的哪台设备"。
