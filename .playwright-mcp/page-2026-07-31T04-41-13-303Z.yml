        - paragraph [ref=e6625]:
          - strong [ref=e6626]: 注意
          - text: ：前导码 + 帧起始定界符共 8 字节属于物理层，不计入最短帧长的 64 字节。64 字节 = 目的MAC(6) + 源MAC(6) + 类型(2) + 数据(46) + FCS(4)。
      - paragraph [ref=e6627]:
        - strong [ref=e6628]: 最短帧长 64 字节的数学推导
      - code [ref=e6630]: 最短帧长 = 争用期 × 数据传输速率 对于 10 Mbps 以太网（最经典的标准）： - 争用期（2τ） = 51.2 μs - 数据速率 = 10 Mbps = 10 × 10^6 bps - 最短帧长 = 51.2 × 10^(-6) s × 10 × 10^6 bps = 512 bit = 64 字节
      - paragraph [ref=e6631]: 反推：如果帧长小于 64 字节（比如 40 字节），发送时间 = 40 × 8 / 10M = 32 μs < 51.2 μs（争用期）。可能出现的情况：A 发送完 40 字节后，B 才检测到信道空闲并开始发送，但 A 发送的帧已经到达 B，B 发送的帧也到达 A——双方都检测不到碰撞，但实际上碰撞发生了！
      - blockquote [ref=e6632]:
        - paragraph [ref=e6633]:
          - strong [ref=e6634]: 关键理解
          - text: ：最短帧长确保"在发送完整个帧之前，一定能检测到最远距离的碰撞"。如果帧太短，发完了还没检测到碰撞，发送方就会误以为发送成功。
      - heading "CSMA/CD 详细计算" [level=4] [ref=e6635]
      - paragraph [ref=e6636]:
        - strong [ref=e6637]: 二进制指数退避算法详细过程
      - code [ref=e6639]: "1. 确定基本退避时间 = 2τ（争用期，以太网为 51.2 μs） 2. 第 k 次冲突后，从 {0, 1, 2, ..., 2^k - 1} 中随机选一个数 r 其中 k = min(冲突次数, 10) 3. 退避等待时间 = r × 2τ 4. 第 16 次冲突仍失败，放弃发送，向上层报告错误"
