            - cell "服务端" [ref=e9331]
            - cell "服务运行期间一直保持" [ref=e9332]
          - row [ref=e9333]:
            - cell [ref=e9334]:
              - strong [ref=e9335]: SYN_SENT
            - cell "已发 SYN，等 SYN+ACK" [ref=e9336]
            - cell "客户端" [ref=e9337]
