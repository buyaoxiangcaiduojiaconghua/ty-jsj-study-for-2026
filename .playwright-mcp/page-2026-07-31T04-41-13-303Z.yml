      - heading "两大定理（考试必考计算 + 概念辨析）" [level=3] [ref=e5657]
      - paragraph [ref=e5658]:
        - strong [ref=e5659]: 奈奎斯特定理
        - text: （理想、无噪声）：
      - blockquote [ref=e5660]:
        - paragraph [ref=e5661]: C = 2W × log₂V
      - list [ref=e5662]:
        - listitem [ref=e5663]: W = 带宽（Hz），V = 离散电平数（码元状态数，信号有几个等级）
        - listitem [ref=e5664]: 二元信号（V=2）时：C = 2W
        - listitem [ref=e5665]:
          - text: 含义：
          - strong [ref=e5666]: 在无噪声的理想信道中，码元速率上限为 2W 波特
        - listitem [ref=e5667]:
          - strong [ref=e5668]: 波特率（码元传输速率）上限 = 2W
          - text: ，比特率 = 波特率 × log₂V
      - paragraph [ref=e5669]:
        - strong [ref=e5670]: 香农定理
        - text: （现实、有噪声）：
      - blockquote [ref=e5671]:
        - paragraph [ref=e5672]: C = W × log₂(1 + S/N)
      - list [ref=e5673]:
        - listitem [ref=e5674]:
          - text: S/N = 信噪比（信号功率/噪声功率），是
          - strong [ref=e5675]: 比值，无单位
        - listitem [ref=e5676]:
          - text: 常用单位 dB：
          - strong [ref=e5677]: 信噪比(dB) = 10 × log₁₀(S/N)
        - listitem [ref=e5678]: 如 30dB → S/N = 10^(30/10) = 1000 → C = W × log₂(1+1000) ≈ W × 10
      - paragraph [ref=e5679]:
        - strong [ref=e5680]: 考试易错
        - text: ：
      - list [ref=e5681]:
        - listitem [ref=e5682]:
          - text: 奈奎斯特给的是
          - strong [ref=e5683]: 码元速率上限
          - text: （波特率），香农给的是
          - strong [ref=e5684]: 信息传输速率上限
          - text: （比特率）
        - listitem [ref=e5685]:
          - text: 实际最大速率 =
          - strong [ref=e5686]: min(奈奎斯特上限, 香农上限)
          - text: ，两者取小的那个
        - listitem [ref=e5687]:
          - text: 香农定理说明：
          - strong [ref=e5688]: 只要传输速率 ≤ 信道容量，就一定存在某种编码方法实现无差错传输
        - listitem [ref=e5689]:
          - text: 提高带宽 W 是
          - strong [ref=e5690]: 线性增长
          - text: （W 翻倍 → C 翻倍），提高信噪比 S/N 是
          - strong [ref=e5691]: 对数增长
          - text: （S/N 翻倍 → C 增幅渐小）。但实际中噪声功率随带宽增大而增大（N = N₀W），所以带宽也不能无限增加
      - paragraph [ref=e5692]:
        - strong [ref=e5693]: dB 转换速查表：
      - table [ref=e5694]:
        - rowgroup [ref=e5695]:
          - row [ref=e5696]:
            - columnheader "dB 值" [ref=e5697]
            - columnheader "S/N 比值" [ref=e5698]
            - columnheader "近似 log₂(1+S/N)" [ref=e5699]
        - rowgroup [ref=e5700]:
          - row [ref=e5701]:
            - cell "10dB" [ref=e5702]
            - cell "10" [ref=e5703]
            - cell "≈ 3.46" [ref=e5704]
          - row [ref=e5705]:
            - cell "20dB" [ref=e5706]
            - cell "100" [ref=e5707]
            - cell "≈ 6.66" [ref=e5708]
          - row [ref=e5709]:
            - cell "30dB" [ref=e5710]
            - cell "1000" [ref=e5711]
            - cell "≈ 10（最常考！）" [ref=e5712]
          - row [ref=e5713]:
            - cell "40dB" [ref=e5714]
            - cell "10000" [ref=e5715]
            - cell "≈ 13.29" [ref=e5716]
          - row [ref=e5717]:
            - cell "50dB" [ref=e5718]
            - cell "100000" [ref=e5719]
            - cell "≈ 16.61" [ref=e5720]
      - blockquote [ref=e5721]:
        - paragraph [ref=e5722]:
          - strong [ref=e5723]: 记忆技巧
          - text: ：dB 每增加 10，S/N 比值乘以 10。30dB = 1000 是最高频考点，log₂(1001) ≈ log₂(1024) = 10。
      - heading "奈奎斯特与香农定理 - 计算例题详解" [level=4] [ref=e5724]
      - paragraph [ref=e5725]:
        - strong [ref=e5726]: 例题 1（纯奈奎斯特）：
        - text: 一条无噪声信道带宽为 4kHz，使用 4 种码元状态（V=4），求最大数据传输速率。
      - paragraph [ref=e5727]:
        - strong [ref=e5728]: 解：
      - code [ref=e5730]: 步骤 1：确认公式 奈奎斯特：C = 2W × log₂V 步骤 2：代入数值 W = 4kHz = 4000Hz V = 4（4 种码元状态，每个码元表示 2 bit） 步骤 3：计算 C = 2 × 4000 × log₂4 = 8000 × 2 = 16000 bps = 16 kbps 答案：16 kbps
      - paragraph [ref=e5731]:
        - strong [ref=e5732]: 例题 2（纯香农）：
        - text: 一个带宽为 3kHz 的信道，信噪比为 30dB，求信道容量（最大数据传输速率）。
      - paragraph [ref=e5733]:
        - strong [ref=e5734]: 解：
      - code [ref=e5736]: 步骤 1：dB 转比值 S/N = 10^(30/10) = 10^3 = 1000 步骤 2：代入香农公式 C = W × log₂(1 + S/N) = 3000 × log₂(1 + 1000) = 3000 × log₂(1001) 步骤 3：近似计算 log₂(1001) ≈ log₂(1024) = 10 C ≈ 3000 × 10 = 30000 bps = 30 kbps 答案：约 30 kbps
      - paragraph [ref=e5737]:
        - strong [ref=e5738]: 例题 3（奈奎斯特 + 香农结合）：
        - text: 一个带宽为 4kHz 的信道，信噪比为 30dB，使用 4 种码元状态（V=4），求实际最大数据传输速率。
      - paragraph [ref=e5739]:
        - strong [ref=e5740]: 解：
      - code [ref=e5742]: 步骤 1：先算奈奎斯特上限 C_nyquist = 2W × log₂V = 2 × 4000 × log₂4 = 8000 × 2 = 16000 bps 步骤 2：再算香农上限 S/N = 10^(30/10) = 1000 C_shannon = 4000 × log₂(1001) ≈ 4000 × 10 = 40000 bps 步骤 3：取最小值 C = min(16000, 40000) = 16000 bps = 16 kbps 答案：16 kbps（瓶颈在奈奎斯特，码元状态数太少限制了速率）
      - paragraph [ref=e5743]:
        - strong [ref=e5744]: 例题 4（反推信噪比）：
        - text: 一个带宽为 4kHz 的信道，要求信道容量不低于 40 kbps，求至少需要多大的信噪比（用 dB 表示）。
      - paragraph [ref=e5745]:
        - strong [ref=e5746]: 解：
      - code [ref=e5748]: 步骤 1：代入香农公式 C = W × log₂(1 + S/N) 40000 = 4000 × log₂(1 + S/N) 步骤 2：解出 log₂(1 + S/N) log₂(1 + S/N) = 40000 / 4000 = 10 1 + S/N = 2^10 = 1024 S/N = 1023 步骤 3：转为 dB 信噪比(dB) = 10 × log₁₀(1023) ≈ 10 × log₁₀(1000) ≈ 10 × 3 = 30 dB 答案：至少需要约 30 dB 的信噪比
      - paragraph [ref=e5749]:
        - strong [ref=e5750]: 例题 5（综合 - 电话线路）：
        - text: 电话线路带宽为 3.1kHz，信噪比为 35dB，使用 64QAM（V=64）调制。求：① 奈奎斯特最大速率；② 香农信道容量；③ 实际最大速率。
      - paragraph [ref=e5751]:
        - strong [ref=e5752]: 解：
      - code [ref=e5754]: 步骤 1：首先计算奈奎斯特上限 V = 64（64QAM，每个码元表示 log₂64 = 6 bit） C_nyquist = 2W × log₂V = 2 × 3100 × 6 = 6200 × 6 = 37200 bps ≈ 37.2 kbps 步骤 2：计算香农信道容量 S/N = 10^(35/10) = 10^3.5 ≈ 3162 C_shannon = 3100 × log₂(1 + 3162) = 3100 × log₂(3163) log₂(3163) ≈ log₂(2048) + 余量 ≈ 11 + 0.63 ≈ 11.63 （更精确：log₂(3163) ≈ 11.63） C_shannon ≈ 3100 × 11.63 ≈ 36053 bps ≈ 36.1 kbps 步骤 3：取最小值 C = min(37.2, 36.1) = 36.1 kbps 答案：① 37.2 kbps；② 36.1 kbps；③ 实际最大约 36.1 kbps（瓶颈在香农）
      - blockquote [ref=e5755]:
        - paragraph [ref=e5756]:
          - strong [ref=e5757]: 核心结论
          - text: ：奈奎斯特决定"码元能跑多快"，香农决定"信噪比条件下最多能传多少"。两者谁小听谁的。一旦 V 够大，瓶颈通常转到香农定理。
      - heading "例题与解析" [level=3] [ref=e5758]
      - paragraph [ref=e5759]:
        - strong [ref=e5760]: 例题 1（编码波形识别）：
        - text: 以下关于曼彻斯特编码和差分曼彻斯特编码的说法，正确的是？
      - paragraph [ref=e5761]: A. 曼彻斯特编码每个 bit 开始处有跳变表示 1，无跳变表示 0B. 差分曼彻斯特编码中间跳变用于表示数据，开始处跳变用于同步C. 曼彻斯特编码自带同步时钟，差分曼彻斯特编码不自带同步时钟D. 差分曼彻斯特编码中，bit 开始处有跳变表示 0，无跳变表示 1，中间跳变仅用于同步
      - paragraph [ref=e5762]:
        - strong [ref=e5763]: 解析：
      - list [ref=e5764]:
        - listitem [ref=e5765]: A 错：这是差分曼彻斯特的规则，不是曼彻斯特。曼彻斯特是中间跳变表示数据（上跳=0，下跳=1）。
        - listitem [ref=e5766]: B 错：差分曼彻斯特正好相反——中间跳变用于同步，开始处跳变用于表示数据。
        - listitem [ref=e5767]: C 错：两种编码都自带同步时钟（都有中间跳变）。
        - listitem [ref=e5768]: D 对：差分曼彻斯特编码的规则就是"bit 开始处有跳变=0，无跳变=1，中间跳变仅用于同步"。
      - paragraph [ref=e5769]:
        - strong [ref=e5770]: 答案：D
      - paragraph [ref=e5771]:
        - strong [ref=e5772]: 例题 2（奈奎斯特计算）：
        - text: 一条无噪声信道带宽为 8kHz，使用 16 种码元状态，最大数据传输速率是多少？
      - paragraph [ref=e5773]:
        - strong [ref=e5774]: 解析：
      - code [ref=e5776]: C = 2W × log₂V = 2 × 8000 × log₂16 = 16000 × 4 = 64000 bps = 64 kbps
      - paragraph [ref=e5777]:
        - strong [ref=e5778]: 答案：64 kbps
      - paragraph [ref=e5779]:
        - strong [ref=e5780]: 例题 3（香农计算）：
        - text: 带宽为 6kHz，信噪比为 20dB，求信道容量。
      - paragraph [ref=e5781]:
        - strong [ref=e5782]: 解析：
      - code [ref=e5784]: S/N = 10^(20/10) = 100 C = 6000 × log₂(1 + 100) = 6000 × log₂(101) log₂(101) ≈ log₂(128) ≈ 7（近似） C ≈ 6000 × 7 = 42000 bps = 42 kbps
      - paragraph [ref=e5785]:
        - strong [ref=e5786]: 答案：约 42 kbps
      - paragraph [ref=e5787]:
        - strong [ref=e5788]: 例题 4（两种定理结合）：
        - text: 带宽为 3kHz，信噪比为 30dB，使用 8 种码元状态。实际最大速率是多少？
      - paragraph [ref=e5789]:
        - strong [ref=e5790]: 解析：
      - code [ref=e5792]: 奈奎斯特：C₁ = 2 × 3000 × log₂8 = 6000 × 3 = 18000 bps 香农：S/N = 10³ = 1000，C₂ = 3000 × log₂(1001) ≈ 3000 × 10 = 30000 bps 实际 = min(18000, 30000) = 18000 bps = 18 kbps
      - paragraph [ref=e5793]:
        - strong [ref=e5794]: 答案：18 kbps
      - paragraph [ref=e5795]:
        - strong [ref=e5796]: 例题 5（信道复用判断）：
        - text: 以下关于信道复用技术的说法，错误的是？
      - paragraph [ref=e5797]: A. FDM 频分复用让不同用户用不同频率同时传输B. 统计时分复用 STDM 的时隙分配是固定的C. WDM 波分复用是光纤通信中 FDM 的变种D. CDM 码分复用可以实现同时同频传输
      - paragraph [ref=e5798]:
        - strong [ref=e5799]: 解析：
      - list [ref=e5800]:
        - listitem [ref=e5801]: A 对：FDM 就是按频率划分。
        - listitem [ref=e5802]:
          - text: B 错：STDM 的时隙分配是
          - strong [ref=e5803]: 动态的
          - text: （按需分配），不是固定的。同步 TDM 时隙才是固定的。
        - listitem [ref=e5804]: C 对：WDM 本质就是光域的 FDM。
        - listitem [ref=e5805]: D 对：CDM 通过不同编码实现同时同频传输。
      - paragraph [ref=e5806]:
        - strong [ref=e5807]: 答案：B
      - heading "易错陷阱表" [level=3] [ref=e5808]
      - table [ref=e5809]:
        - rowgroup [ref=e5810]:
          - row [ref=e5811]:
            - columnheader "#" [ref=e5812]
            - columnheader "陷阱" [ref=e5813]
