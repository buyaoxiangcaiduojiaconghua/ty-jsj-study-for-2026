          - row [ref=e15285]:
            - cell "7" [ref=e15286]
            - cell "18" [ref=e15287]
            - cell "拥塞避免" [ref=e15288]
            - cell [ref=e15289]:
              - text: 线性增长：17+1=18，
              - strong [ref=e15290]: 本轮发送后超时
          - row [ref=e15291]:
            - cell "—" [ref=e15292]
            - cell "—" [ref=e15293]
            - cell "—" [ref=e15294]
            - cell "超时后：ssthresh = 18/2 = 9，cwnd = 1" [ref=e15295]
          - row [ref=e15296]:
            - cell "8" [ref=e15297]
            - cell "1" [ref=e15298]
            - cell "慢开始（重来）" [ref=e15299]
            - cell "重新从慢开始" [ref=e15300]
      - blockquote [ref=e15301]:
        - paragraph [ref=e15302]:
          - strong [ref=e15303]: 关键区分
          - text: ：
        - list [ref=e15304]:
          - listitem [ref=e15305]:
            - strong [ref=e15306]: 超时
            - text: → cwnd = 1，ssthresh = cwnd(旧)/2，回到慢开始
          - listitem [ref=e15307]:
            - strong [ref=e15308]: 3个重复ACK
            - text: （快重传）→ cwnd = cwnd(旧)/2，ssthresh = cwnd(新)，进入拥塞避免（不是慢开始！）
      - separator [ref=e15309]
      - heading "补充：快重传+快恢复示例" [level=4] [ref=e15310]
      - paragraph [ref=e15311]:
        - strong [ref=e15312]: 题目
        - text: ：某时刻 cwnd = 24，ssthresh = 16，发送方收到 3 个重复 ACK。求快重传和快恢复后的 cwnd。
      - paragraph [ref=e15313]:
        - strong [ref=e15314]: 解
        - text: ：
      - list [ref=e15315]:
        - listitem [ref=e15316]: 快重传：ssthresh = 24/2 = 12，cwnd = 12
        - listitem [ref=e15317]:
          - text: 快恢复：cwnd = ssthresh + 3 = 12 + 3 =
          - strong [ref=e15318]: "15"
        - listitem [ref=e15319]: 再收到重复 ACK 时：cwnd += 1（如 15→16→17...）
        - listitem [ref=e15320]: 收到新数据 ACK 后：cwnd = ssthresh = 12，进入拥塞避免
