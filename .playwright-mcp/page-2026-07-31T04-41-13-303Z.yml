            - cell "1" [ref=e6173]
            - cell "1" [ref=e6174]
            - cell "0" [ref=e6175]
            - cell "1" [ref=e6176]
            - cell "0" [ref=e6177]
            - cell "1" [ref=e6178]
      - paragraph [ref=e6179]:
        - strong [ref=e6180]: 步骤 2：重新计算每个校验组
      - list [ref=e6181]:
        - listitem [ref=e6182]:
          - strong [ref=e6183]: G1
          - text: （P1 组，位置 1, 3, 5, 7）：1 XOR 1 XOR 1 XOR 1 = 0（偶校验正确 → G1=0）
        - listitem [ref=e6184]:
          - strong [ref=e6185]: G2
          - text: （P2 组，位置 2, 3, 6, 7）：1 XOR 1 XOR 0 XOR 1 = 1（出错 → G2=1）
        - listitem [ref=e6186]:
          - strong [ref=e6187]: G3
          - text: （P3 组，位置 4, 5, 6, 7）：0 XOR 1 XOR 0 XOR 1 = 0（偶校验正确 → G3=0）
      - paragraph [ref=e6188]:
        - strong [ref=e6189]: 步骤 3：确定出错位置
        - text: 出错位置 = G3 G2 G1 = 010（二进制）=
        - strong [ref=e6190]: 2（十进制）
      - paragraph [ref=e6191]:
        - strong [ref=e6192]: 第 2 位出错！
        - text: 将第 2 位的 1 纠正为 0，正确海明码为 1010101。
      - blockquote [ref=e6193]:
        - paragraph [ref=e6194]:
          - strong [ref=e6195]: 考点总结
          - text: ：
        - list [ref=e6196]:
          - listitem [ref=e6197]:
            - text: 纠错公式：
            - strong [ref=e6198]: 出错位置 = 校验组的二进制组合
          - listitem [ref=e6199]: G1=0, G2=1, G3=0 → 010 → 位置 2 出错
          - listitem [ref=e6200]: 如果全为 0（000），说明没有错误
          - listitem [ref=e6201]:
            - text: 海明码只能纠正
            - strong [ref=e6202]: 1 位错误
            - text: ，如果有 2 位同时出错则无法正确纠错
      - heading "停等协议与滑动窗口" [level=3] [ref=e6203]
      - paragraph [ref=e6204]:
        - strong [ref=e6205]: 停等协议
        - text: ：发一帧 → 等确认 → 再发下一帧。简单但效率低。
      - blockquote [ref=e6206]:
        - paragraph [ref=e6207]: 信道利用率 = 发送时延 / (发送时延 + RTT)，RTT 远大于发送时延时，利用率极低。
      - paragraph [ref=e6208]:
        - strong [ref=e6209]: 滑动窗口机制
        - text: ：
      - table [ref=e6210]:
        - rowgroup [ref=e6211]:
          - row [ref=e6212]:
            - columnheader "协议" [ref=e6213]
            - columnheader "窗口大小" [ref=e6214]
            - columnheader "确认方式" [ref=e6215]
            - columnheader "特点" [ref=e6216]
        - rowgroup [ref=e6217]:
          - row [ref=e6218]:
            - cell "停等" [ref=e6219]
            - cell "发送窗口=1，接收窗口=1" [ref=e6220]
            - cell "每帧确认" [ref=e6221]
            - cell "效率最低" [ref=e6222]
          - row [ref=e6223]:
            - cell "GBN（后退N帧）" [ref=e6224]
            - cell "发送窗口>1，接收窗口=1" [ref=e6225]
            - cell "累积确认" [ref=e6226]
            - cell "出错重传 N 帧" [ref=e6227]
          - row [ref=e6228]:
