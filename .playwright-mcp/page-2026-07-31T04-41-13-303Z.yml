            - cell "简单（公钥公开）" [ref=e12580]
          - row [ref=e12581]:
            - cell "代表算法" [ref=e12582]
            - cell [ref=e12583]:
              - text: DES（已淘汰）、
              - strong [ref=e12584]: AES
              - text: 、SM4
            - cell [ref=e12585]:
