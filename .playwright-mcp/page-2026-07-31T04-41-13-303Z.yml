      - heading "详细说明" [level=3] [ref=e8276]
      - heading "RIP 防环机制详解" [level=4] [ref=e8277]
      - paragraph [ref=e8278]: RIP 的距离矢量算法天生容易形成路由环路，需要使用以下机制来防止：
      - table [ref=e8279]:
        - rowgroup [ref=e8280]:
          - row [ref=e8281]:
            - columnheader "防环机制" [ref=e8282]
            - columnheader "原理" [ref=e8283]
            - columnheader "效果" [ref=e8284]
        - rowgroup [ref=e8285]:
          - row [ref=e8286]:
            - cell [ref=e8287]:
              - strong [ref=e8288]: 最大跳数
            - cell "限制最大跳数为 15，16 跳 = 不可达" [ref=e8289]
            - cell "阻止环路无限循环" [ref=e8290]
          - row [ref=e8291]:
            - cell [ref=e8292]:
              - strong [ref=e8293]: 水平分割
            - cell "从某个接口学到的路由，不再从该接口发回去" [ref=e8294]
            - cell "防止相邻路由器之间环路" [ref=e8295]
          - row [ref=e8296]:
            - cell [ref=e8297]:
              - strong [ref=e8298]: 毒性反转
            - cell "把不可达路由的跳数设为 16（毒性），主动通告" [ref=e8299]
            - cell "比水平分割更激进，让对方立即知道路由失效" [ref=e8300]
          - row [ref=e8301]:
            - cell [ref=e8302]:
              - strong [ref=e8303]: 触发更新
            - cell "路由变化时立即发送更新，不等 30 秒周期" [ref=e8304]
            - cell "加速全网收敛，减少不一致窗口" [ref=e8305]
          - row [ref=e8306]:
            - cell [ref=e8307]:
              - strong [ref=e8308]: 抑制计时器
            - cell "路由失效后一段时间内不接受同一路由的更新" [ref=e8309]
            - cell "防止\"翻动\"路由导致全网不稳定" [ref=e8310]
      - paragraph [ref=e8311]:
        - strong [ref=e8312]: "\"计数到无穷\"问题"
        - text: ：
      - list [ref=e8313]:
        - listitem [ref=e8314]: 场景：A 和 B 相邻，A 到网络 X 的路由（1 跳）突然失效
        - listitem [ref=e8315]: A 把 X 设为 16 跳（不可达），但还没来得及告诉 B
        - listitem [ref=e8316]: B 发来更新："我可以通过 A 到达 X，2 跳"
        - listitem [ref=e8317]: A 想："B 能到 X（2 跳），那我经过 B 也能到，3 跳"
        - listitem [ref=e8318]: 如此循环，跳数不断增加直到 16
        - listitem [ref=e8319]: 这期间数据包在 A 和 B 之间来回转发，浪费带宽
      - heading "OSPF 区域类型详解" [level=4] [ref=e8320]
      - paragraph [ref=e8321]: OSPF 将网络分成多个区域（Area），减少路由表大小和 LSA 泛洪范围。
