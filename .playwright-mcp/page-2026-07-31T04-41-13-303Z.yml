          - code [ref=e10560]: baidu.com
          - text: 中的
          - code [ref=e10561]: baidu
          - text: ，由个人或公司注册。
        - listitem [ref=e10562]:
          - strong [ref=e10563]: 子域
          - text: ：
          - code [ref=e10564]: www.baidu.com
          - text: 中的
          - code [ref=e10565]: www
          - text: ，由二级域所有者自行划分。
      - paragraph [ref=e10566]:
        - strong [ref=e10567]: 顶级域名分类
        - text: ：
      - table [ref=e10568]:
        - rowgroup [ref=e10569]:
          - row [ref=e10570]:
            - columnheader "分类" [ref=e10571]
            - columnheader "例子" [ref=e10572]
            - columnheader "说明" [ref=e10573]
        - rowgroup [ref=e10574]:
          - row [ref=e10575]:
