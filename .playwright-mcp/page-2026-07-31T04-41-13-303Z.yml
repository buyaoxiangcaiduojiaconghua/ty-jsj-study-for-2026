      - code [ref=e12215]: A 记录域名转 IPv4，AAAA 就是 IPv6 CNAME 别名指规范，MX 邮件服务器 NS 权威 DNS，PTR 反向解析 SOA 管域信息，TXT 做验证
      - paragraph [ref=e12216]:
        - strong [ref=e12217]: HTTP 方法口诀
        - text: ：
      - code [ref=e12219]: GET 查，POST 增，PUT 全改 PATCH 部改 DELETE 删，HEAD 只看头，OPTIONS 问支持啥 GET PUT DELETE 是幂等，POST PATCH 不是
      - paragraph [ref=e12220]:
        - strong [ref=e12221]: HTTP 状态码口诀
        - text: ：
      - code [ref=e12223]: 1xx 收到请继续，2xx 成功笑嘻嘻 3xx 重定向去别处，4xx 客户端出问题 5xx 服务器扛不住，200 301 404 500 最常考
      - paragraph [ref=e12224]:
        - strong [ref=e12225]: HTTPS 握手口诀
        - text: ：
      - code [ref=e12227]: ClientHello 打招呼，ServerHello 选算法 证书里面带公钥，预主密钥加密发 三个随机数合成会话密钥，对称加密传数据 非对称慢只握手，对称快才传数据
      - paragraph [ref=e12228]:
        - strong [ref=e12229]: FTP 模式口诀
        - text: ：
      - code [ref=e12231]: 主动模式：服务器追着客户端跑，端口 20 连过来 被动模式：客户端追着服务器跑，PASV 命令问端口 防火墙挡主动，被动模式才通用 21 控制不下线，20 数据传完关
      - paragraph [ref=e12232]:
        - strong [ref=e12233]: 邮件协议对比口诀
        - text: ：
      - code [ref=e12235]: SMTP 发，发发发，端口 25 传天下 POP3 收，下载到本地，110 端口取回家 IMAP 收，在线管，143 端口多设备同步佳 POP3 像取信回家，IMAP 像在邮局看
      - paragraph [ref=e12236]:
        - strong [ref=e12237]: DHCP 口诀
        - text: ：
