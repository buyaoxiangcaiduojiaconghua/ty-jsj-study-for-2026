              - strong [ref=e11772]: 二进制模式
            - cell "原样传输，不做任何转换" [ref=e11773]
            - cell "图片、视频、压缩包、可执行文件等所有非文本文件" [ref=e11774]
      - blockquote [ref=e11775]:
        - paragraph [ref=e11776]:
          - strong [ref=e11777]: 考试要点
          - text: ：二进制文件（图片、程序）用 ASCII 模式传输会被损坏，必须用二进制模式。
      - separator [ref=e11778]
      - heading "邮件协议" [level=3] [ref=e11779]
      - table [ref=e11780]:
        - rowgroup [ref=e11781]:
          - row [ref=e11782]:
            - columnheader "协议" [ref=e11783]
