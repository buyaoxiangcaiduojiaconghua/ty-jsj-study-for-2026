      - paragraph [ref=e11444]:
        - strong [ref=e11445]: "Q6: 418 I'm a teapot 是什么？"
        - text: 来自 1998 年愚人节 RFC 2324（HTCPCP 超文本咖啡壶控制协议），规定茶壶拒绝煮咖啡时应返回此状态码。是 HTTP 文化中的经典彩蛋。
