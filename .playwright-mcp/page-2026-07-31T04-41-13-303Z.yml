      - heading "HTTPS" [level=3] [ref=e11489]
      - paragraph [ref=e11490]: HTTPS = HTTP + SSL/TLS（加密层）。端口 443。
      - paragraph [ref=e11491]:
        - strong [ref=e11492]: 类比
        - text: ：HTTP 是明信片（谁都能看），HTTPS 是上了锁的保险箱（只有收件人打得开）。
      - paragraph [ref=e11493]:
        - strong [ref=e11494]: TLS 握手过程（简化）
        - text: ：
      - list [ref=e11495]:
        - listitem [ref=e11496]: 客户端发送支持的加密算法列表
        - listitem [ref=e11497]: 服务器选一个算法，发回数字证书（含公钥）
        - listitem [ref=e11498]: 客户端验证证书，生成随机密钥，用公钥加密发给服务器
        - listitem [ref=e11499]: 之后双方用这个密钥对称加密通信
      - blockquote [ref=e11500]:
        - paragraph [ref=e11501]: HTTPS 混合使用非对称加密（交换密钥）+ 对称加密（传输数据），因为非对称加密太慢了。
      - heading "TLS 握手完整过程（详细每一步）" [level=4] [ref=e11502]
      - paragraph [ref=e11503]: TLS 1.2 握手（最常见的版本）共需要 2 个 RTT（往返时间）：
      - code [ref=e11505]: 客户端 服务器 │ │ │──① ClientHello ──────────────────────────────>│ │ （支持的加密算法列表 + 随机数1） │ │ │ │<─② ServerHello + 证书 + ServerHelloDone ──────│ │ （选定的加密算法 + 随机数2 + 数字证书） │ │ │ │──③ ClientKeyExchange + ChangeCipherSpec ─────>│ │ （用公钥加密的预主密钥 + 通知开始加密） │ │ │ │<─④ ChangeCipherSpec + Finished ───────────────│ │ （通知开始加密 + 握手完成确认） │ │ │ │──────────────── 加密通信开始 ──────────────────>│
      - paragraph [ref=e11506]:
        - strong [ref=e11507]: 每一步发生了什么
        - text: ：
      - list [ref=e11508]:
        - listitem [ref=e11509]:
          - strong [ref=e11510]: ClientHello
          - text: ：客户端告诉服务器"我能用这些加密算法"，并发送第一个随机数
        - listitem [ref=e11511]:
          - strong [ref=e11512]: ServerHello + 证书
          - text: ：服务器选一个算法，发送第二个随机数，并把包含公钥的数字证书发给客户端
        - listitem [ref=e11513]:
          - strong [ref=e11514]: ClientKeyExchange
          - text: ：客户端生成"预主密钥"（第三个随机数），用服务器的公钥加密后发送。此时双方都有三个随机数，各自算出相同的"会话密钥"
        - listitem [ref=e11515]:
          - strong [ref=e11516]: ChangeCipherSpec + Finished
          - text: ：双方确认"加密模式已开启"，握手完成
      - blockquote [ref=e11517]:
        - paragraph [ref=e11518]:
          - strong [ref=e11519]: 三个随机数
          - text: ：客户端随机数 + 服务端随机数 + 预主密钥 → 会话密钥。这样做的好处是即使某个随机数不够随机，三个合在一起也很难被猜到。
      - heading "数字证书验证流程" [level=4] [ref=e11520]
      - paragraph [ref=e11521]:
        - strong [ref=e11522]: 数字证书
        - text: ：由 CA（证书认证中心）颁发的"数字身份证"，证明"这个公钥确实属于这个网站"。
      - paragraph [ref=e11523]:
        - strong [ref=e11524]: 浏览器验证证书的步骤
        - text: ：
      - list [ref=e11525]:
        - listitem [ref=e11526]: 检查证书是否在有效期内
        - listitem [ref=e11527]: 检查证书是否被吊销（通过 CRL 或 OCSP）
        - listitem [ref=e11528]: 检查证书的域名是否匹配当前访问的域名
        - listitem [ref=e11529]: 用 CA 的公钥验证证书的签名（CA 的私钥签的名，只能用 CA 的公钥解）
      - blockquote [ref=e11530]:
        - paragraph [ref=e11531]:
          - strong [ref=e11532]: CA 的信任链
          - text: ：根 CA → 中间 CA → 网站证书。浏览器信任根 CA，根 CA 信任中间 CA，中间 CA 给网站发证书。就像"我相信派出所，派出所相信你，所以我相信你"。
      - heading "对称加密 vs 非对称加密在 HTTPS 中的应用" [level=4] [ref=e11533]
      - table [ref=e11534]:
        - rowgroup [ref=e11535]:
          - row [ref=e11536]:
            - columnheader "阶段" [ref=e11537]
            - columnheader "使用的加密" [ref=e11538]
            - columnheader "原因" [ref=e11539]
        - rowgroup [ref=e11540]:
          - row [ref=e11541]:
            - cell "TLS 握手阶段" [ref=e11542]
            - cell [ref=e11543]:
              - strong [ref=e11544]: 非对称加密
              - text: （RSA/ECDHE）
            - cell "安全地交换密钥，不需要双方事先共享密钥" [ref=e11545]
          - row [ref=e11546]:
            - cell "数据传输阶段" [ref=e11547]
            - cell [ref=e11548]:
              - strong [ref=e11549]: 对称加密
              - text: （AES）
            - cell "速度快，适合大量数据加密" [ref=e11550]
          - row [ref=e11551]:
            - cell "完整性校验" [ref=e11552]
            - cell [ref=e11553]:
              - strong [ref=e11554]: 消息认证码（MAC）
            - cell "确保数据没有被篡改" [ref=e11555]
      - blockquote [ref=e11556]:
        - paragraph [ref=e11557]:
          - strong [ref=e11558]: 为什么不全用非对称加密？
          - text: 非对称加密（RSA）比对称加密（AES）慢 100~1000 倍。传一个网页用 RSA 可能卡到不行，用 AES 就没问题。所以 HTTPS 只让 RSA 在握手时交换密钥，实际数据用 AES 传。
      - heading "中间人攻击和 HTTPS 如何防御" [level=4] [ref=e11559]
      - paragraph [ref=e11560]:
        - strong [ref=e11561]: 中间人攻击（MITM）
        - text: ：攻击者站在你和服务器之间，假装是服务器（对客户端），假装是客户端（对服务器），从而窃听或篡改所有通信。
      - paragraph [ref=e11562]:
        - strong [ref=e11563]: 类比
        - text: ：你去银行办业务，有人冒充银行工作人员坐在你面前，所有你说的话他先转述给银行，银行的话他也转述给你。你以为是和银行说话，其实是和骗子说话。
      - paragraph [ref=e11564]:
        - strong [ref=e11565]: HTTPS 如何防御中间人攻击
        - text: ：
      - list [ref=e11566]:
        - listitem [ref=e11567]:
          - strong [ref=e11568]: 证书验证
          - text: ：攻击者无法伪造正规 CA 签发的证书（除非攻破 CA 或你的电脑被植入假 CA 根证书）
        - listitem [ref=e11569]:
          - strong [ref=e11570]: 公钥加密
          - text: ：即使攻击者截获了带公钥的证书，他没有私钥，无法解密客户端发来的预主密钥
        - listitem [ref=e11571]:
          - strong [ref=e11572]: 完整性校验
          - text: ：每个数据包都有 MAC 签名，篡改会被发现
      - blockquote [ref=e11573]:
        - paragraph [ref=e11574]:
          - strong [ref=e11575]: HSTS
          - text: （HTTP 严格传输安全）：服务器告诉浏览器"以后只准用 HTTPS 访问我"。即使有人在局域网用 HTTP 劫持，浏览器也不会中招。
      - separator [ref=e11576]
      - heading "HTTP 版本演进" [level=3] [ref=e11577]
      - table [ref=e11578]:
        - rowgroup [ref=e11579]:
          - row [ref=e11580]:
            - columnheader "版本" [ref=e11581]
            - columnheader "特点" [ref=e11582]
        - rowgroup [ref=e11583]:
          - row [ref=e11584]:
