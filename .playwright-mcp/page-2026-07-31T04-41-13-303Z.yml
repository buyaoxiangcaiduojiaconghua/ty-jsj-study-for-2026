        - rowgroup [ref=e12153]:
          - row [ref=e12154]:
            - cell "1" [ref=e12155]
            - cell "DNS 默认用 TCP 53 端口" [ref=e12156]
            - cell [ref=e12157]:
              - strong [ref=e12158]: 错！
              - text: DNS 常规查询默认用
              - strong [ref=e12159]: UDP
              - text: 53 端口。只有区域传送（主从 DNS 同步）和响应超过 512 字节时用 TCP 53
          - row [ref=e12160]:
            - cell "2" [ref=e12161]
            - cell "主机向本地 DNS 是迭代查询" [ref=e12162]
            - cell [ref=e12163]:
              - strong [ref=e12164]: 错！
              - text: 主机 → 本地 DNS 是
              - strong [ref=e12165]: 递归
              - text: 查询（你帮我查到底）；本地 DNS → 根/顶级/权威 DNS 是
              - strong [ref=e12166]: 迭代
              - text: 查询（我指路你自己去）
          - row [ref=e12167]:
            - cell "3" [ref=e12168]
            - cell "HTTP 状态码 401 和 403 意思一样" [ref=e12169]
            - cell [ref=e12170]:
              - strong [ref=e12171]: 错！
              - text: 401 = 未认证（没登录/不知道你是谁），403 = 已认证但没权限（知道你是谁但不让你访问）
          - row [ref=e12172]:
            - cell "4" [ref=e12173]
            - cell "502 和 504 都是网关错误，没区别" [ref=e12174]
            - cell [ref=e12175]:
              - strong [ref=e12176]: 错！
              - text: 502 = 网关收到了上游服务器的
              - strong [ref=e12177]: 无效响应
              - text: （响应了但内容不对）；504 = 网关
              - strong [ref=e12178]: 没收到
              - text: 上游响应（超时了）
          - row [ref=e12179]:
            - cell "5" [ref=e12180]
            - cell "HTTPS 全程用非对称加密" [ref=e12181]
            - cell [ref=e12182]:
              - strong [ref=e12183]: 错！
              - text: 握手阶段用非对称加密（交换密钥），数据传输阶段用对称加密（快）。HTTPS = 非对称 + 对称的混合方案
          - row [ref=e12184]:
            - cell "6" [ref=e12185]
            - cell "FTP 被动模式是服务器主动连客户端" [ref=e12186]
            - cell [ref=e12187]:
              - strong [ref=e12188]: 错！
              - text: 恰好相反——
              - strong [ref=e12189]: 主动
              - text: 模式是服务器主动连客户端；
              - strong [ref=e12190]: 被动
              - text: 模式是客户端主动连服务器。名字容易记反
          - row [ref=e12191]:
            - cell "7" [ref=e12192]
            - cell "POP3 和 IMAP 都可以在多设备上同步邮件" [ref=e12193]
            - cell [ref=e12194]:
              - strong [ref=e12195]: 错！
              - text: 只有 IMAP 支持多设备同步。POP3 下载到本地后服务器上的邮件可能删除，其他设备看不到
          - row [ref=e12196]:
            - cell "8" [ref=e12197]
            - cell "DHCP 工作过程是 Discover → Offer → Request → Confirm" [ref=e12198]
            - cell [ref=e12199]:
              - strong [ref=e12200]: 错！
              - text: 最后一步是
              - strong [ref=e12201]: ACK
              - text: （DHCPACK），不是 Confirm。DORA = Discover、Offer、Request、ACK
      - separator [ref=e12202]
