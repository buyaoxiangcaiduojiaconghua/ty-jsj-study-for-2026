            - cell "网络层+传输层" [ref=e12426]
            - cell "跟踪连接状态表，动态判断" [ref=e12427]
            - cell "比包过滤更安全、效率高" [ref=e12428]
            - cell "仍然不检查应用层内容" [ref=e12429]
            - cell "门卫记住谁进来过" [ref=e12430]
          - row [ref=e12431]:
            - cell "应用层网关（代理防火墙）" [ref=e12432]
            - cell "应用层" [ref=e12433]
            - cell "检查应用层数据内容" [ref=e12434]
            - cell "最安全，深度检查" [ref=e12435]
            - cell "慢、每种应用需单独代理" [ref=e12436]
            - cell "安检员开箱检查" [ref=e12437]
      - blockquote [ref=e12438]:
        - paragraph [ref=e12439]: 包过滤只看"信封"（IP/端口），代理防火墙还看"信的内容"（应用数据）。
      - heading "3.2 防火墙部署策略" [level=4] [ref=e12440]
      - list [ref=e12441]:
        - listitem [ref=e12442]:
          - strong [ref=e12443]: DMZ（非军事区）
          - text: ：在外部网络和内部网络之间的隔离区，放对外服务的服务器（Web、邮件），两头受限。
        - listitem [ref=e12444]:
          - strong [ref=e12445]: 边界防火墙
          - text: ：部署在内外网边界，防护外部威胁。
        - listitem [ref=e12446]:
          - strong [ref=e12447]: 内部防火墙
          - text: ：部署在内网不同区域之间，隔离重要网段。
      - blockquote [ref=e12448]:
        - paragraph [ref=e12449]: DMZ 的典型规则：外网可访问 DMZ、DMZ 不能主动访问内网、内网可访问 DMZ 和外网。
      - separator [ref=e12450]
      - heading "四、VPN 虚拟专用网" [level=3] [ref=e12451]
      - paragraph [ref=e12452]: 在公共网络（互联网）上建一条加密的"专用隧道"，远程办公的典型场景。
      - list [ref=e12453]:
        - listitem [ref=e12454]: 核心原理：隧道技术 + 加密 + 认证
        - listitem [ref=e12455]: 常见协议：IPSec VPN、SSL VPN、L2TP
        - listitem [ref=e12456]: IPSec VPN 工作在网络层，SSL VPN 工作在传输层/应用层
      - separator [ref=e12457]
      - heading "五、加密技术详解" [level=3] [ref=e12458]
      - heading "5.1 对称加密" [level=4] [ref=e12459]
      - paragraph [ref=e12460]: 加密和解密用同一把密钥，就像两个人共用一把钥匙开门。
      - paragraph [ref=e12461]:
        - strong [ref=e12462]: 常用对称加密算法：
      - table [ref=e12463]:
        - rowgroup [ref=e12464]:
          - row [ref=e12465]:
            - columnheader "算法" [ref=e12466]
            - columnheader "密钥长度" [ref=e12467]
