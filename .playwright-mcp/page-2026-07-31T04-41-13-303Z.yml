            - cell "RESTful API 登录" [ref=e11006]
            - cell "分布式系统、微服务认证" [ref=e11007]
      - blockquote [ref=e11008]:
        - paragraph [ref=e11009]:
          - strong [ref=e11010]: JWT（JSON Web Token）
          - text: ：三段式字符串
