      - heading "以太网与 CSMA/CD" [level=3] [ref=e6505]
      - paragraph [ref=e6506]:
        - strong [ref=e6507]: 以太网帧格式
        - text: ：目的MAC(6字节) | 源MAC(6字节) | 类型(2字节) | 数据(46~1500字节) | FCS(4字节)
      - blockquote [ref=e6508]:
        - paragraph [ref=e6509]: 最短帧长 = 64 字节。为什么？因为 CSMA/CD 要求在发送完最短帧之前检测到碰撞。
      - paragraph [ref=e6510]:
        - strong [ref=e6511]: CSMA/CD
        - text: （载波侦听多路访问/碰撞检测）：
      - list [ref=e6512]:
        - listitem [ref=e6513]:
          - strong [ref=e6514]: 先听后说
          - text: ：发之前先侦听，信道空闲才发
        - listitem [ref=e6515]:
          - strong [ref=e6516]: 边发边听
          - text: ：发送的同时也在监听，检测是否有碰撞
        - listitem [ref=e6517]:
          - strong [ref=e6518]: 碰撞则停
          - text: ：一旦检测到碰撞，立即停止发送
        - listitem [ref=e6519]:
          - strong [ref=e6520]: 随机后退
          - text: ：等待随机时间后重试（二进制指数退避算法）
      - blockquote [ref=e6521]:
        - paragraph [ref=e6522]:
          - strong [ref=e6523]: 争用期
          - text: = 2τ（两倍端到端传播时延），以太网规定为 51.2μs（对应 512 bit 时间 = 64 字节）
          - strong [ref=e6524]: 为什么最短帧长是 64 字节？
          - text: 因为要在争用期内检测到碰撞，发送 64 字节的时间 = 争用期
