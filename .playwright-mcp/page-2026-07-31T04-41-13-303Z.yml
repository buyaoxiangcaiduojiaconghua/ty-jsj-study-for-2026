            - cell [ref=e11642]:
              - strong [ref=e11643]: HPACK 压缩
            - cell [ref=e11644]:
              - strong [ref=e11645]: QPACK 压缩
          - row [ref=e11646]:
            - cell [ref=e11647]:
              - strong [ref=e11648]: 服务器推送
            - cell "无" [ref=e11649]
            - cell "无" [ref=e11650]
            - cell "支持（Server Push）" [ref=e11651]
            - cell "支持" [ref=e11652]
          - row [ref=e11653]:
            - cell [ref=e11654]:
              - strong [ref=e11655]: 队头阻塞
            - cell "有（每连接）" [ref=e11656]
            - cell "有（管道化）" [ref=e11657]
            - cell "有（TCP 层）" [ref=e11658]
            - cell [ref=e11659]:
              - strong [ref=e11660]: 无
              - text: （基于 UDP，每个流独立）
          - row [ref=e11661]:
            - cell [ref=e11662]:
              - strong [ref=e11663]: 安全性
            - cell "可选" [ref=e11664]
            - cell "可选" [ref=e11665]
            - cell "通常要求 TLS" [ref=e11666]
            - cell "内置 TLS 1.3" [ref=e11667]
          - row [ref=e11668]:
            - cell [ref=e11669]:
              - strong [ref=e11670]: 连接建立
            - cell "TCP 三次握手" [ref=e11671]
            - cell "TCP 三次握手" [ref=e11672]
            - cell "TCP 三次握手 + TLS 握手" [ref=e11673]
            - cell [ref=e11674]:
              - strong [ref=e11675]: 0-RTT
              - text: （QUIC 内置加密）
      - heading "HTTP/2.0 多路复用原理" [level=4] [ref=e11676]
      - paragraph [ref=e11677]:
        - strong [ref=e11678]: 问题
        - text: ：HTTP/1.1 虽然支持持久连接，但在同一个连接上请求是串行的（管道化），一个请求卡住，后面的都等（队头阻塞）。
      - paragraph [ref=e11679]:
        - strong [ref=e11680]: HTTP/2.0 的解决方案
        - text: ：
      - list [ref=e11681]:
        - listitem [ref=e11682]:
          - text: 把数据分成一个个
          - strong [ref=e11683]: 帧（Frame）
          - text: ，每个帧标上流 ID（属于哪个请求）
        - listitem [ref=e11684]: 同一个连接上可以同时发送不同请求的帧，交错发送
        - listitem [ref=e11685]: 接收方根据流 ID 重新组装
      - paragraph [ref=e11686]:
        - strong [ref=e11687]: 类比
        - text: ：HTTP/1.1 是多辆卡车排队走单车道 → 一辆堵了全堵；HTTP/2.0 是把货物拆成小包裹，标上编号，多车道同时跑，到目的地再组装。
      - blockquote [ref=e11688]:
        - paragraph [ref=e11689]:
          - strong [ref=e11690]: HTTP/2.0 的队头阻塞
          - text: ：虽然解决了 HTTP 层的队头阻塞，但 TCP 层的队头阻塞依然存在——TCP 要求数据按序到达，如果一个 TCP 包丢了，后面的包都得等它重传。HTTP/3.0 用 UDP 彻底解决了这个问题。
      - heading "HTTP/3.0 基于 QUIC 的优势" [level=4] [ref=e11691]
      - paragraph [ref=e11692]:
        - strong [ref=e11693]: QUIC（Quick UDP Internet Connections）
        - text: ：Google 开发的基于 UDP 的传输协议，HTTP/3.0 运行在 QUIC 之上。
      - paragraph [ref=e11694]:
        - strong [ref=e11695]: 核心优势
        - text: ：
      - table [ref=e11696]:
        - rowgroup [ref=e11697]:
          - row [ref=e11698]:
            - columnheader "特性" [ref=e11699]
            - columnheader "说明" [ref=e11700]
        - rowgroup [ref=e11701]:
          - row [ref=e11702]:
            - cell [ref=e11703]:
              - strong [ref=e11704]: 0-RTT 连接
            - cell "首次连接 1-RTT，再次连接 0-RTT（直接发数据，不用等握手）" [ref=e11705]
          - row [ref=e11706]:
            - cell [ref=e11707]:
              - strong [ref=e11708]: 无队头阻塞
            - cell "基于 UDP，每个流独立，丢包只影响一个流，不影响其他流" [ref=e11709]
          - row [ref=e11710]:
            - cell [ref=e11711]:
              - strong [ref=e11712]: 连接迁移
            - cell "从 WiFi 切换到 4G，连接不会断（QUIC 用连接 ID 而非 IP+端口来标识连接）" [ref=e11713]
          - row [ref=e11714]:
            - cell [ref=e11715]:
              - strong [ref=e11716]: 内置 TLS 1.3
            - cell "加密不是选配，而是标配" [ref=e11717]
      - blockquote [ref=e11718]:
        - paragraph [ref=e11719]:
          - strong [ref=e11720]: 为什么 QUIC 用 UDP 而不是重新发明一个协议？
          - text: 因为互联网上的路由器、防火墙、NAT 设备已经大量部署，改 TCP 协议栈几乎不可能。UDP 是"最薄的传输层"，QUIC 在应用层实现所有高级功能，不需要操作系统和网络设备配合。
      - separator [ref=e11721]
      - heading "FTP 协议" [level=3] [ref=e11722]
      - list [ref=e11723]:
        - listitem [ref=e11724]:
          - text: 使用两个 TCP 连接：
          - strong [ref=e11725]: 控制连接
          - text: （端口 21，传命令）+
          - strong [ref=e11726]: 数据连接
          - text: （端口 20，传文件）
        - listitem [ref=e11727]: 主动模式：服务器主动连接客户端的数据端口
        - listitem [ref=e11728]: 被动模式：客户端主动连接服务器的数据端口（更常用，不受客户端防火墙限制）
      - heading "为什么 FTP 需要两个连接" [level=4] [ref=e11729]
      - paragraph [ref=e11730]:
        - strong [ref=e11731]: 类比
        - text: ：像对讲机有两个频道——频道 1 用来发指令（"前进、后退"），频道 2 用来传货物。控制与数据分离，互不干扰。
      - paragraph [ref=e11732]:
        - strong [ref=e11733]: 两个连接的分工
        - text: ：
      - list [ref=e11734]:
        - listitem [ref=e11735]:
          - strong [ref=e11736]: 控制连接（端口 21）
          - text: ：在整个 FTP 会话期间一直保持，传输登录、切换目录、获取文件列表等命令
        - listitem [ref=e11737]:
          - strong [ref=e11738]: 数据连接（端口 20）
          - text: ：每次传输文件或目录列表时临时建立，传完就关。下次传文件再建新的
      - heading "FTP 主动模式（PORT）详细过程" [level=4] [ref=e11739]
      - code [ref=e11741]: 客户端 服务器 │ │ │──① 建立控制连接 → 端口 21 ────────────────>│ │ │ │──② PORT 命令（告诉服务器"我的 IP 是 X，端口 Y 开着等你"）──>│ │ │ │<─③ 服务器从端口 20 → 主动连接客户端端口 Y ──│ │ │ │<──────④ 数据传输 ────────────────────────>│
      - paragraph [ref=e11742]:
        - strong [ref=e11743]: 问题
        - text: ：如果客户端在防火墙/NAT 后面，服务器主动连接客户端会被防火墙拦截。这就是为什么主动模式经常失败。
      - heading "FTP 被动模式（PASV）详细过程" [level=4] [ref=e11744]
      - code [ref=e11746]: 客户端 服务器 │ │ │──① 建立控制连接 → 端口 21 ────────────────>│ │ │ │──② PASV 命令（"请给我一个端口，我来连你"）───>│ │ │ │<─③ 服务器回复"端口 Z 已打开，你来连"────────│ │ │ │──④ 客户端主动连接服务器端口 Z ─────────────>│ │ │ │<──────⑤ 数据传输 ────────────────────────>│
      - paragraph [ref=e11747]:
        - strong [ref=e11748]: 优势
        - text: ：所有连接都由客户端发起，不会触发防火墙拦截。所以现代 FTP 几乎都用被动模式。
      - blockquote [ref=e11749]:
        - paragraph [ref=e11750]:
          - strong [ref=e11751]: 主动 vs 被动总结
          - text: ：主动模式 = 服务器追着客户端跑（服务器用 20 连客户端）；被动模式 = 客户端追着服务器跑（客户端连服务器随机端口）。
      - heading "FTP 数据传输模式" [level=4] [ref=e11752]
      - table [ref=e11753]:
        - rowgroup [ref=e11754]:
          - row [ref=e11755]:
            - columnheader "模式" [ref=e11756]
            - columnheader "传输方式" [ref=e11757]
            - columnheader "适用场景" [ref=e11758]
        - rowgroup [ref=e11759]:
          - row [ref=e11760]:
            - cell [ref=e11761]:
              - strong [ref=e11762]: ASCII 模式
            - cell [ref=e11763]:
              - text: 按文本文件传输，会自动转换换行符（Windows
              - code [ref=e11764]: \r\n
              - text: ↔ Unix
