      - heading "CSMA/CA 详细流程" [level=3] [ref=e14047]
      - heading "完整的 CSMA/CA 发送流程" [level=4] [ref=e14048]
      - code [ref=e14050]: 有帧要发送？ ↓ 是 监听信道 ↓ 信道空闲 + 持续 DIFS 时间？ ├── 否 → 信道忙，进入退避等待 │ ↓ │ 等待信道空闲 + DIFS │ ↓ │ 从 [0, CW-1] 中随机选一个退避值 │ ↓ │ ┌─ 信道空闲一个时隙？── 否 → 冻结倒计时，等信道再次空闲 + DIFS 后继续 │ │ ↓ 是 │ │ 退避值 - 1 │ │ ↓ │ └─ 退避值 = 0？ │ ↓ 是 └──────────────→ 发送 RTS（可选） ↓ 收到 CTS？ ├── 否 → 重传 └── 是 → 发送数据帧 ↓ 收到 ACK？ ├── 否 → 重传（CW 加倍） └── 是 → 发送成功！CW 重置为最小值
      - heading "帧间间隔（IFS）详解" [level=4] [ref=e14051]
      - paragraph [ref=e14052]: 802.11 定义了多种帧间间隔，不同优先级的帧等待不同的时间，等待时间越短优先级越高：
      - table [ref=e14053]:
        - rowgroup [ref=e14054]:
