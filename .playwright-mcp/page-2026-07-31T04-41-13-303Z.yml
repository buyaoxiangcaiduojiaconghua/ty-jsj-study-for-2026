      - code [ref=e15127]: 有线 CD 能检测，无线 CA 只能避 CD 边发边听不用 ACK，CA 发完等 ACK 确认 无线信号太强盖住碰撞，RTS/CTS 解决隐藏终端
      - paragraph [ref=e15128]:
        - strong [ref=e15129]: IFS 优先级：
      - code [ref=e15131]: SIFS 最短 ACK 和 CTS PIFS 中间 PCF 轮询 DIFS 普通数据要等久 EIFS 错误恢复最慢
      - paragraph [ref=e15132]:
        - strong [ref=e15133]: 5G 三大场景：
      - code [ref=e15135]: eMBB 快如闪电（增强移动宽带，20Gbps） uRLLC 准时可靠（超可靠低时延，1ms 99.999%） mMTC 海量连接（大规模机器通信，100 万/km²）
      - paragraph [ref=e15136]:
        - strong [ref=e15137]: 隐藏终端 vs 暴露终端：
      - code [ref=e15139]: 隐藏终端：该发却发 → 碰撞（A 和 C 听不到彼此，同时发给 B） 暴露终端：该发不发 → 浪费（C 听到 A 就不敢发，但 C 发 D 不干扰） RTS/CTS 解决隐藏，暴露终端没有完美方案
      - paragraph [ref=e15140]:
        - strong [ref=e15141]: 蓝牙微微网：
      - code [ref=e15143]: 1 主 7 从 255 休眠 主控频率和时钟 从只跟主通信
      - paragraph [ref=e15144]:
        - strong [ref=e15145]: 移动 IP 三角路由：
      - code [ref=e15147]: CN 发 MN 先到 HA（绕路） HA 隧道转到 FA（转发） MN 回复直接走（不绕） 三角路由浪费资源 IPv6 绑定更新直接优化
      - paragraph [ref=e15148]:
        - strong [ref=e15149]: 无线安全演进：
      - code [ref=e15151]: WEP 已淘汰（RC4 漏洞，几分钟破解） WPA 临时过渡（TKIP 补丁） WPA2 主流标准（AES 加密，但 PSK 可离线破解） WPA3 最新标准（SAE 握手，防暴力破解）
