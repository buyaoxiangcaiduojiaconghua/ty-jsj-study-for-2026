      - heading "TCP 拥塞控制（高频！）" [level=3] [ref=e9545]
      - paragraph [ref=e9546]:
        - strong [ref=e9547]: 目的
        - text: ：防止网络中流量过大导致拥塞。
      - paragraph [ref=e9548]: 四个算法阶段：
      - table [ref=e9549]:
        - rowgroup [ref=e9550]:
          - row [ref=e9551]:
            - columnheader "阶段" [ref=e9552]
            - columnheader "cwnd 变化" [ref=e9553]
            - columnheader "触发条件" [ref=e9554]
        - rowgroup [ref=e9555]:
          - row [ref=e9556]:
            - cell "慢开始" [ref=e9557]
            - cell [ref=e9558]:
              - text: cwnd 从 1 开始，每轮
              - strong [ref=e9559]: 翻倍
            - cell "新建连接 / 超时后" [ref=e9560]
          - row [ref=e9561]:
            - cell "拥塞避免" [ref=e9562]
            - cell "cwnd 每轮**+1**" [ref=e9563]
            - cell "cwnd >= ssthresh" [ref=e9564]
          - row [ref=e9565]:
            - cell "快重传" [ref=e9566]
            - cell "收到 3 个重复 ACK，立即重传" [ref=e9567]
            - cell "个别报文丢失" [ref=e9568]
          - row [ref=e9569]:
            - cell "快恢复" [ref=e9570]
            - cell "ssthresh = cwnd/2, cwnd = ssthresh" [ref=e9571]
            - cell "快重传后" [ref=e9572]
      - blockquote [ref=e9573]:
        - paragraph [ref=e9574]:
          - strong [ref=e9575]: ssthresh
          - text: （慢开始门限）：cwnd < ssthresh 用慢开始，cwnd >= ssthresh 用拥塞避免。 超时后：ssthresh = cwnd/2，cwnd = 1，重新慢开始。 快重传后（收到3个重复ACK）：ssthresh = cwnd/2，cwnd = ssthresh，进入快恢复（不是从1开始！）。
      - heading "UDP" [level=3] [ref=e9576]
      - list [ref=e9577]:
        - listitem [ref=e9578]: 首部仅 8 字节（源端口、目的端口、长度、校验和）
        - listitem [ref=e9579]: 无连接、无确认、不排序
        - listitem [ref=e9580]: 适合实时应用：DNS、视频直播、VoIP、在线游戏
      - blockquote [ref=e9581]:
        - paragraph [ref=e9582]: 为什么 DNS 用 UDP？请求和响应都很短（一个包搞定），用 TCP 的三次握手开销太大。
      - heading "补充：TCP 拥塞控制详解" [level=3] [ref=e9583]
      - heading "核心概念" [level=3] [ref=e9584]
      - list [ref=e9585]:
        - listitem [ref=e9586]:
          - strong [ref=e9587]: 拥塞窗口 cwnd
          - text: ：发送方根据网络拥塞程度动态维护的状态变量
        - listitem [ref=e9588]:
          - strong [ref=e9589]: 慢开始门限 ssthresh
          - text: ：慢开始与拥塞避免的分界线
        - listitem [ref=e9590]:
          - strong [ref=e9591]: 发送窗口
          - text: ：swnd = min(cwnd, rwnd)，rwnd 为接收方通告窗口
        - listitem [ref=e9592]:
          - strong [ref=e9593]: 判断拥塞的依据
          - text: ：发送方发生超时重传
      - separator [ref=e9594]
      - heading "2.1 慢开始 Slow Start" [level=3] [ref=e9595]
      - paragraph [ref=e9596]:
        - strong [ref=e9597]: 触发时机：
        - text: 连接建立后，或发生超时重传后重新开始。
      - paragraph [ref=e9598]:
        - strong [ref=e9599]: 核心规则：
        - text: 每收到一个 ACK，cwnd 加 1（MSS 为单位）。
      - paragraph [ref=e9600]:
        - strong [ref=e9601]: 增长特性：
        - strong [ref=e9602]: 指数增长
        - text: 。
      - code [ref=e9604]: cwnd=1 → 收到1个ACK → cwnd=2 → 收到2个ACK → cwnd=4 → 收到4个ACK → cwnd=8 → 收到8个ACK → cwnd=16
      - paragraph [ref=e9605]:
        - strong [ref=e9606]: 状态转换：
        - text: 当 cwnd >= ssthresh 时，切换为拥塞避免算法。
      - separator [ref=e9607]
      - heading "2.2 拥塞避免 Congestion Avoidance" [level=3] [ref=e9608]
      - paragraph [ref=e9609]:
        - strong [ref=e9610]: 触发时机：
        - text: cwnd 达到或超过 ssthresh 时进入。
      - paragraph [ref=e9611]:
        - strong [ref=e9612]: 核心规则：
        - text: 每收到一个 ACK，cwnd 增加 1/cwnd（即一轮 RTT 后 cwnd 加 1）。
      - paragraph [ref=e9613]:
        - strong [ref=e9614]: 增长特性：
        - strong [ref=e9615]: 线性增长
        - text: （从指数增长变为线性增长，增长速度放缓）。
      - code [ref=e9617]: cwnd=8 → 一轮RTT后收到8个ACK，各增1/8 → cwnd=9 → 一轮RTT后收到9个ACK，各增1/9 → cwnd=10
      - paragraph [ref=e9618]:
        - strong [ref=e9619]: 状态转换：
        - text: 当发生丢包时，进入拥塞发生阶段。
      - separator [ref=e9620]
      - heading "2.3 快重传 Fast Retransmit" [level=3] [ref=e9621]
      - paragraph [ref=e9622]:
        - strong [ref=e9623]: 触发条件：
        - text: 发送方连续收到
        - strong [ref=e9624]: 3 个重复 ACK
        - text: （共 4 个相同 ACK），不等超时就立即重传。
      - paragraph [ref=e9625]:
        - strong [ref=e9626]: 工作原理：
      - list [ref=e9627]:
        - listitem [ref=e9628]: 接收方收到失序报文段时，立即发送重复 ACK（期望的下一个序号）
        - listitem [ref=e9629]: 发送方收到 3 个重复 ACK 后，推断该报文段丢失，立即重传
      - paragraph [ref=e9630]:
        - strong [ref=e9631]: 参数变化：
      - list [ref=e9632]:
        - listitem [ref=e9633]: cwnd = cwnd / 2
        - listitem [ref=e9634]: ssthresh = cwnd（即与原 cwnd/2 相同）
        - listitem [ref=e9635]: 进入快速恢复算法
      - separator [ref=e9636]
      - heading "2.4 快恢复 Fast Recovery" [level=3] [ref=e9637]
      - paragraph [ref=e9638]: 快重传和快恢复同时使用，进入前 cwnd 和 ssthresh 已更新为原先的一半。
      - paragraph [ref=e9639]:
        - strong [ref=e9640]: 算法步骤：
      - table [ref=e9641]:
        - rowgroup [ref=e9642]:
          - row [ref=e9643]:
            - columnheader "步骤" [ref=e9644]
            - columnheader "操作" [ref=e9645]
            - columnheader "说明" [ref=e9646]
        - rowgroup [ref=e9647]:
          - row [ref=e9648]:
            - cell "1" [ref=e9649]
            - cell "cwnd = ssthresh + 3" [ref=e9650]
            - cell "3 代表确认有 3 个数据包已被接收" [ref=e9651]
          - row [ref=e9652]:
