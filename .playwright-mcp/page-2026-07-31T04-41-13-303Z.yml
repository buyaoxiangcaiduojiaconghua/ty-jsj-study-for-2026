      - heading "十二、例题精讲" [level=3] [ref=e13031]
      - heading "例题 1：对称加密 vs 非对称加密" [level=4] [ref=e13032]
      - paragraph [ref=e13033]:
        - strong [ref=e13034]: 题目
        - text: ：以下关于对称加密和非对称加密的说法，正确的是（ ）
      - paragraph [ref=e13035]: A. 对称加密用公钥加密、私钥解密 B. RSA 是对称加密算法的代表 C. 对称加密速度快，适合加密大量数据；非对称加密速度慢，适合加密密钥和数字签名 D. 非对称加密的密钥分发比对称加密更困难
      - paragraph [ref=e13036]:
        - strong [ref=e13037]: 答案：C
      - paragraph [ref=e13038]:
        - strong [ref=e13039]: 解析：
      - list [ref=e13040]:
        - listitem [ref=e13041]: A 错：公钥加密私钥解密是非对称加密；对称加密用同一把密钥
        - listitem [ref=e13042]: B 错：RSA 是非对称加密的代表
        - listitem [ref=e13043]: C 正确：这正是混合加密的思想
        - listitem [ref=e13044]: D 错：非对称加密的公钥公开即可，密钥分发更简单
      - heading "例题 2：数字签名原理" [level=4] [ref=e13045]
      - paragraph [ref=e13046]:
        - strong [ref=e13047]: 题目
        - text: ：以下关于数字签名的说法，错误的是（ ）
      - paragraph [ref=e13048]: A. 数字签名可以防止发送方抵赖 B. 数字签名是发送方用私钥对原文全文加密 C. 数字签名具有防伪造、防篡改、防抵赖三大特性 D. 数字签名通过哈希函数生成消息摘要，再对摘要签名
      - paragraph [ref=e13049]:
        - strong [ref=e13050]: 答案：B
      - paragraph [ref=e13051]:
        - strong [ref=e13052]: 解析：
      - list [ref=e13053]:
        - listitem [ref=e13054]: B 错误：数字签名是对"消息摘要"签名，不是对原文全文加密（那样太慢且不必要）
        - listitem [ref=e13055]: A、C、D 均正确
      - heading "例题 3：防火墙类型应用题" [level=4] [ref=e13056]
      - paragraph [ref=e13057]:
        - strong [ref=e13058]: 题目
        - text: ：某公司内网有一台 Web 服务器需要对外提供服务，同时要保证内网其他服务器的安全。以下部署方案最合理的是（ ）
      - paragraph [ref=e13059]: A. 将 Web 服务器放在内网，通过路由器端口映射 B. 将 Web 服务器放在 DMZ 区，防火墙限制 DMZ 只能访问外网，不能主动访问内网 C. 将 Web 服务器放在外网，取消防火墙 D. 将 Web 服务器和内网服务器放在同一网段
      - paragraph [ref=e13060]:
        - strong [ref=e13061]: 答案：B
      - paragraph [ref=e13062]:
        - strong [ref=e13063]: 解析：
      - list [ref=e13064]:
        - listitem [ref=e13065]: A 有一定风险，端口映射让外网流量直接进入内网
        - listitem [ref=e13066]: B 正确：DMZ 是隔离区，Web 服务器被攻破也不会影响内网
        - listitem [ref=e13067]: C 完全无保护
        - listitem [ref=e13068]: D 内网服务器直接暴露在风险中
      - heading "例题 4：网络安全协议匹配题" [level=4] [ref=e13069]
      - paragraph [ref=e13070]:
        - strong [ref=e13071]: 题目
        - text: ：将以下安全协议与其工作层次/端口匹配：
      - table [ref=e13072]:
        - rowgroup [ref=e13073]:
          - row [ref=e13074]:
            - columnheader "协议" [ref=e13075]
            - columnheader "工作层次/端口" [ref=e13076]
        - rowgroup [ref=e13077]:
          - row [ref=e13078]:
            - cell "IPSec" [ref=e13079]
            - cell "① 传输层 / 443 端口" [ref=e13080]
          - row [ref=e13081]:
            - cell "SSL/TLS" [ref=e13082]
            - cell "② 应用层 / 22 端口" [ref=e13083]
          - row [ref=e13084]:
            - cell "SSH" [ref=e13085]
            - cell "③ 网络层" [ref=e13086]
          - row [ref=e13087]:
            - cell "HTTPS" [ref=e13088]
            - cell "④ 传输层" [ref=e13089]
      - paragraph [ref=e13090]: 正确的匹配是（ ）
      - paragraph [ref=e13091]: A. IPSec-③, SSL/TLS-④, SSH-②, HTTPS-① B. IPSec-④, SSL/TLS-③, SSH-①, HTTPS-② C. IPSec-③, SSL/TLS-①, SSH-②, HTTPS-④ D. IPSec-①, SSL/TLS-④, SSH-②, HTTPS-③
      - paragraph [ref=e13092]:
        - strong [ref=e13093]: 答案：A
