      - heading "7.2 CA 证书认证中心" [level=4] [ref=e12743]
      - list [ref=e12744]:
        - listitem [ref=e12745]: CA 用自己的私钥给用户证书签名，证明"这个公钥确实属于这个人"
        - listitem [ref=e12746]: 根 CA 自签名（自己给自己签），信任的起点
        - listitem [ref=e12747]: 浏览器/操作系统预装根 CA 证书（信任锚点）
      - heading "7.3 证书链验证过程" [level=4] [ref=e12748]
      - code [ref=e12750]: 根 CA 证书（自签名，预装在系统中） ↓ 用根 CA 私钥签名 中间 CA 证书 ↓ 用中间 CA 私钥签名 服务器证书（网站用的）
      - paragraph [ref=e12751]: 验证时：用根 CA 公钥验证中间 CA 证书 → 用中间 CA 公钥验证服务器证书 → 信任链成立。
      - blockquote [ref=e12752]:
        - paragraph [ref=e12753]: 类比：你要证明你是你，你爸（中间 CA）给你担保，你爷爷（根 CA）给你爸担保，大家都信你爷爷。
