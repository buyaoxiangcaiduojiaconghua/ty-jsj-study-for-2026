      - blockquote [ref=e4757]:
        - paragraph [ref=e4758]:
          - text: 五层模型的优势：既保留了 OSI 中数据链路层和物理层的独立性（方便理解底层原理），又避免了表示层和会话层在实际中几乎为空的问题。
          - strong [ref=e4759]: 国网考试中，如果题目问"计算机网络体系结构分几层"，只要不明确指定 OSI 或 TCP/IP，一般按五层或七层回答都可以。但建议优先记 OSI 七层和 TCP/IP 四层，五层是教学用的。
      - heading "数据封装与解封装" [level=3] [ref=e4760]
      - paragraph [ref=e4761]:
        - strong [ref=e4762]: 类比
        - text: ：寄快递——物品放进快递盒 → 贴快递单 → 装车 → 发车。收件时反过来拆。
      - code [ref=e4764]: 发送端（封装）： 接收端（解封装）： 应用层：你好 应用层：拿到"你好" ↓ 加 HTTP 头 ↑ 去 HTTP 头 传输层：[TCP头|你好] 传输层 ↓ 加 TCP 头 ↑ 去 TCP 头 网络层：[IP头|TCP头|你好] 网络层 ↓ 加 IP 头 ↑ 去 IP 头 数据链路层：[帧头|IP头|TCP头|你好|帧尾] 数据链路层 ↓ ↑ 物理层：010101... → 网线 → 物理层：010101...
      - blockquote [ref=e4765]:
        - paragraph [ref=e4766]:
          - text: 考试重点：每层只认自己的"头"。下层不认识上层数据叫什么，统称为"
          - strong [ref=e4767]: 数据载荷
          - text: "\"（Payload）。"
