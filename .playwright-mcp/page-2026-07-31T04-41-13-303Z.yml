            - cell "最短（10μs @ 802.11g）" [ref=e14066]
            - cell "ACK、CTS、数据分片后的后续帧" [ref=e14067]
            - cell [ref=e14068]:
              - strong [ref=e14069]: 最高
          - row [ref=e14070]:
            - cell [ref=e14071]:
              - strong [ref=e14072]: PIFS
            - cell "PCF InterFrame Space" [ref=e14073]
            - cell "SIFS + 1 个时隙" [ref=e14074]
            - cell "PCF 模式下 AP 轮询" [ref=e14075]
            - cell "中" [ref=e14076]
          - row [ref=e14077]:
