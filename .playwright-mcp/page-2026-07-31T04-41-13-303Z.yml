      - heading "关联过程：Wi-Fi 连接的三步走" [level=4] [ref=e13899]
      - paragraph [ref=e13900]: 你手机连 Wi-Fi 时，并不是瞬间连上的，而是要经历三个步骤：
      - code [ref=e13902]: 站点（你的手机） AP（路由器） | | | ① 扫描（发现 AP） | | ├─ 被动扫描：监听 Beacon 帧 | AP 定期广播 Beacon（信标）帧 | └─ 主动扫描：发送 Probe Request 帧 → 等待 Probe Response 帧 | | | ② 认证（802.11 开放系统认证） | | ── Authentication Request ──→ | | ←── Authentication Response ─ | | | | ③ 关联（建立连接） | | ── Association Request ──→ | | ←── Association Response ── | | | | 连接建立！ |
      - paragraph [ref=e13903]:
        - strong [ref=e13904]: 步骤详解：
      - list [ref=e13905]:
        - listitem [ref=e13906]:
          - paragraph [ref=e13907]:
            - strong [ref=e13908]: 扫描（Scanning）
            - text: ：
          - list [ref=e13909]:
            - listitem [ref=e13910]:
              - strong [ref=e13911]: 被动扫描
              - text: ：站点监听 AP 定期广播的 Beacon（信标）帧，帧中包含 SSID、支持速率、安全配置等信息。省电但慢（可能要等几个 Beacon 周期）。
            - listitem [ref=e13912]:
              - strong [ref=e13913]: 主动扫描
              - text: ：站点主动发送 Probe Request（探测请求）帧，指定想连的 SSID，AP 回复 Probe Response（探测响应）。快但耗电。
            - listitem [ref=e13914]: 实际中：手机通常两种方式结合使用。
        - listitem [ref=e13915]:
          - paragraph [ref=e13916]:
            - strong [ref=e13917]: 认证（Authentication）
            - text: ：
          - list [ref=e13918]:
            - listitem [ref=e13919]: 802.11 标准定义的是"开放系统认证"，本质上是空操作（双方互发确认即可），真正的安全认证在后面的 WPA/WPA2 四步握手阶段完成。
            - listitem [ref=e13920]: 注意：802.11 的认证不等于 WPA 密码验证，不要混淆。
        - listitem [ref=e13921]:
          - paragraph [ref=e13922]:
            - strong [ref=e13923]: 关联（Association）
            - text: ：
          - list [ref=e13924]:
            - listitem [ref=e13925]: 站点向 AP 发送关联请求，AP 分配关联 ID（AID）并回复关联响应。
            - listitem [ref=e13926]: 关联建立后，站点正式成为该 BSS 的成员，可以收发数据了。
      - heading "无线局域网基本架构" [level=3] [ref=e13927]
