        - listitem [ref=e7686]: 借 n 位 → 子网数 = 2ⁿ
        - listitem [ref=e7687]: 主机位数 = 32 - 网络号位数
        - listitem [ref=e7688]: 每个子网可用主机数 = 2^主机位数 - 2（减去全 0 网络地址和全 1 广播地址）
      - paragraph [ref=e7689]:
        - strong [ref=e7690]: 例题
        - text: ：192.168.1.0/26，求每个子网的主机数？
      - list [ref=e7691]:
        - listitem [ref=e7692]: /26 = 子网掩码 255.255.255.192
        - listitem [ref=e7693]: 主机位数 = 32 - 26 = 6
        - listitem [ref=e7694]: 每子网主机 = 2⁶ - 2 = 62 台
        - listitem [ref=e7695]: 子网数 = 2² = 4 个（原本 /24，借了 26-24=2 位）
      - heading "子网划分详细例题（3 道）" [level=4] [ref=e7696]
      - paragraph [ref=e7697]:
        - strong [ref=e7698]: 例题 1：给定 192.168.10.0/24，需要 5 个子网，每个子网至少 30 台主机，求子网掩码和每个子网范围
      - paragraph [ref=e7699]: 解题步骤：
      - list [ref=e7700]:
        - listitem [ref=e7701]: 先看主机需求：每个子网需要至少 30 台可用主机
        - listitem [ref=e7702]: 2^h - 2 >= 30 → h >= 5（因为 2⁵ - 2 = 30，刚好满足）
        - listitem [ref=e7703]: 主机位 = 5 位，网络位 = 32 - 5 = 27
        - listitem [ref=e7704]: 子网掩码 = /27 = 255.255.255.224
        - listitem [ref=e7705]: 验证子网数：借了 27 - 24 = 3 位，2³ = 8 个子网 >= 5 个，满足
        - listitem [ref=e7706]: 块大小 = 256 - 224 = 32
      - table [ref=e7707]:
        - rowgroup [ref=e7708]:
          - row [ref=e7709]:
            - columnheader "子网" [ref=e7710]
            - columnheader "网络地址" [ref=e7711]
            - columnheader "可用 IP 范围" [ref=e7712]
            - columnheader "广播地址" [ref=e7713]
        - rowgroup [ref=e7714]:
          - row [ref=e7715]:
            - cell "1" [ref=e7716]
            - cell "192.168.10.0" [ref=e7717]
            - cell "192.168.10.1 ~ 192.168.10.30" [ref=e7718]
            - cell "192.168.10.31" [ref=e7719]
          - row [ref=e7720]:
            - cell "2" [ref=e7721]
            - cell "192.168.10.32" [ref=e7722]
            - cell "192.168.10.33 ~ 192.168.10.62" [ref=e7723]
            - cell "192.168.10.63" [ref=e7724]
          - row [ref=e7725]:
            - cell "3" [ref=e7726]
            - cell "192.168.10.64" [ref=e7727]
            - cell "192.168.10.65 ~ 192.168.10.94" [ref=e7728]
            - cell "192.168.10.95" [ref=e7729]
          - row [ref=e7730]:
            - cell "4" [ref=e7731]
            - cell "192.168.10.96" [ref=e7732]
            - cell "192.168.10.97 ~ 192.168.10.126" [ref=e7733]
            - cell "192.168.10.127" [ref=e7734]
          - row [ref=e7735]:
            - cell "5" [ref=e7736]
            - cell "192.168.10.128" [ref=e7737]
            - cell "192.168.10.129 ~ 192.168.10.158" [ref=e7738]
            - cell "192.168.10.159" [ref=e7739]
      - blockquote [ref=e7740]:
        - paragraph [ref=e7741]: 虽然划分出 8 个子网，但只需要 5 个，剩余的 3 个子网（160~223）可以留给未来扩展。
      - paragraph [ref=e7742]:
        - strong [ref=e7743]: 例题 2：给定 172.16.0.0/16，划分 500 个子网，求新掩码、每子网主机数
      - paragraph [ref=e7744]: 解题步骤：
      - list [ref=e7745]:
        - listitem [ref=e7746]:
          - text: 500 个子网需要借多少位？2^8 = 256 < 500，2^9 = 512 >= 500，所以借
          - strong [ref=e7747]: 9 位
        - listitem [ref=e7748]: 新掩码 = /16 + 9 = /25（即 255.255.255.128）
        - listitem [ref=e7749]: 主机位 = 32 - 25 = 7 位
        - listitem [ref=e7750]:
          - text: 每子网可用主机数 = 2⁷ - 2 =
          - strong [ref=e7751]: 126 台
        - listitem [ref=e7752]: 实际子网数 = 2⁹ = 512 个（前 500 个可用）
      - blockquote [ref=e7753]:
        - paragraph [ref=e7754]: 块大小法：掩码最后字节 128，块大小 = 256 - 128 = 128。每个子网 128 个地址，减去网络地址和广播地址，可用 126 个。
      - paragraph [ref=e7755]:
        - strong [ref=e7756]: 例题 3：给定 IP 172.16.88.55/20，求网络地址、广播地址、可用 IP 范围
      - paragraph [ref=e7757]: 解题步骤：
      - list [ref=e7758]:
        - listitem [ref=e7759]: /20 的掩码 = 255.255.240.0
        - listitem [ref=e7760]:
          - text: 关键字节是第三个字节：172.16.
          - strong [ref=e7761]: "88"
          - text: ".55"
        - listitem [ref=e7762]: 块大小 = 256 - 240 = 16（第三个字节的块大小）
        - listitem [ref=e7763]: 172.16.88.55 的第三个字节 88：88 / 16 = 5 余 8
        - listitem [ref=e7764]:
          - text: 网络地址第三个字节 = 5 × 16 =
          - strong [ref=e7765]: "80"
        - listitem [ref=e7766]:
          - text: 广播地址第三个字节 = 80 + 16 - 1 =
          - strong [ref=e7767]: "95"
        - listitem [ref=e7768]:
          - text: 网络地址 =
          - strong [ref=e7769]: 172.16.80.0
        - listitem [ref=e7770]:
          - text: 广播地址 =
          - strong [ref=e7771]: 172.16.95.255
        - listitem [ref=e7772]: 可用 IP 范围 = 172.16.80.1 ~ 172.16.95.254（共 2¹² - 2 = 4094 台）
      - separator [ref=e7773]
      - heading "CIDR 无分类编址" [level=3] [ref=e7774]
      - paragraph [ref=e7775]: 不再按 A/B/C 分类，而是用"网络前缀/前缀长度"表示。
      - blockquote [ref=e7776]:
        - paragraph [ref=e7777]: 192.168.1.0/24 = 前 24 位是网络前缀，后 8 位是主机号
      - paragraph [ref=e7778]:
        - strong [ref=e7779]: 路由聚合（超网）
        - text: ：把多个连续网段合并成一个更大的网段。前缀相同的路由可以聚合成一条，减少路由表条目。
      - paragraph [ref=e7780]:
        - strong [ref=e7781]: 聚合判断方法
        - text: ：N 个连续网络能聚合成一个超网，当且仅当 N 是 2 的幂且起始地址的网络号能被 N 整除。
      - heading "CIDR 路由聚合例题（3 道）" [level=4] [ref=e7782]
      - paragraph [ref=e7783]:
        - strong [ref=e7784]: 例题 1：聚合 192.168.0.0/24、192.168.1.0/24、192.168.2.0/24、192.168.3.0/24
      - paragraph [ref=e7785]: 解题步骤：
      - list [ref=e7786]:
        - listitem [ref=e7787]: 4 个网络，第三个字节分别是 0、1、2、3
        - listitem [ref=e7788]:
          - text: 写出第三个字节的二进制：
          - list [ref=e7789]:
            - listitem [ref=e7790]:
              - text: 0 = 000000
              - strong [ref=e7791]: "00"
            - listitem [ref=e7792]:
              - text: 1 = 000000
              - strong [ref=e7793]: "01"
            - listitem [ref=e7794]:
              - text: 2 = 000000
              - strong [ref=e7795]: "10"
            - listitem [ref=e7796]:
              - text: 3 = 000000
              - strong [ref=e7797]: "11"
        - listitem [ref=e7798]: 找共同前缀：前 6 位相同（000000），后 2 位不同
        - listitem [ref=e7799]: 192.168 占 16 位 + 第三字节前 6 位 = 22 位共同前缀
        - listitem [ref=e7800]:
          - text: 聚合结果 =
          - strong [ref=e7801]: 192.168.0.0/22
        - listitem [ref=e7802]: 掩码 = 255.255.252.0，覆盖 192.168.0.0 ~ 192.168.3.255
      - blockquote [ref=e7803]:
        - paragraph [ref=e7804]: 验证：4 是 2 的幂，且起始地址 0 能被 4 整除，满足聚合条件。
      - paragraph [ref=e7805]:
        - strong [ref=e7806]: 例题 2：聚合 172.16.32.0/24、172.16.33.0/24、172.16.34.0/24、172.16.35.0/24
      - paragraph [ref=e7807]: 解题步骤：
      - list [ref=e7808]:
        - listitem [ref=e7809]: 4 个网络，第三个字节分别是 32、33、34、35
        - listitem [ref=e7810]:
          - text: 写出二进制：
          - list [ref=e7811]:
            - listitem [ref=e7812]:
              - text: 32 = 001000
              - strong [ref=e7813]: "00"
            - listitem [ref=e7814]:
              - text: 33 = 001000
              - strong [ref=e7815]: "01"
            - listitem [ref=e7816]:
              - text: 34 = 001000
              - strong [ref=e7817]: "10"
            - listitem [ref=e7818]:
              - text: 35 = 001000
              - strong [ref=e7819]: "11"
        - listitem [ref=e7820]: 共同前缀：前 6 位相同（001000），后 2 位不同
        - listitem [ref=e7821]:
          - text: 聚合结果 =
          - strong [ref=e7822]: 172.16.32.0/22
        - listitem [ref=e7823]: 掩码 = 255.255.252.0，覆盖 172.16.32.0 ~ 172.16.35.255
      - paragraph [ref=e7824]:
        - strong [ref=e7825]: 例题 3：聚合 10.1.4.0/24、10.1.5.0/24、10.1.6.0/24、10.1.7.0/24
      - paragraph [ref=e7826]: 解题步骤：
      - list [ref=e7827]:
        - listitem [ref=e7828]:
          - text: 第三个字节：4 = 000001
          - strong [ref=e7829]: "00"
          - text: ，5 = 000001
          - strong [ref=e7830]: "01"
          - text: ，6 = 000001
          - strong [ref=e7831]: "10"
          - text: ，7 = 000001
          - strong [ref=e7832]: "11"
        - listitem [ref=e7833]: 共同前缀：前 6 位相同（000001），后 2 位不同
        - listitem [ref=e7834]:
          - text: 聚合结果 =
          - strong [ref=e7835]: 10.1.4.0/22
        - listitem [ref=e7836]: 掩码 = 255.255.252.0，覆盖 10.1.4.0 ~ 10.1.7.255
      - separator [ref=e7837]
      - heading "ARP 协议详解（Address Resolution Protocol）" [level=3] [ref=e7838]
      - paragraph [ref=e7839]:
        - strong [ref=e7840]: 作用
        - text: ：根据 IP 地址找出对应的 MAC 地址。ARP 解决的是"在同一局域网内，我知道目标 IP，但不知道目标 MAC"的问题。
      - paragraph [ref=e7841]:
        - strong [ref=e7842]: 基本工作过程
        - text: ：
      - list [ref=e7843]:
        - listitem [ref=e7844]: 主机 A 要发包给 IP-B，但不知道 B 的 MAC 地址
        - listitem [ref=e7845]: A 广播一个 ARP 请求报文："谁是 IP-B？告诉我你的 MAC 地址"
        - listitem [ref=e7846]: B 收到后单播回复 ARP 应答："我是 IP-B，我的 MAC 是 xxx"
        - listitem [ref=e7847]: A 把 IP-MAC 映射缓存到 ARP 表中，后续直接查表
      - blockquote [ref=e7848]:
        - paragraph [ref=e7849]:
          - text: ARP 请求是
          - strong [ref=e7850]: 广播
          - text: （目的 MAC 为 FF-FF-FF-FF-FF-FF），ARP 应答是
          - strong [ref=e7851]: 单播
          - text: 。ARP 只在
          - strong [ref=e7852]: 本局域网
          - text: 内有效。跨网段时，源主机把数据帧发给网关路由器的 MAC，由路由器继续转发。
      - heading "ARP 报文格式" [level=4] [ref=e7853]
      - paragraph [ref=e7854]: ARP 报文直接封装在以太网帧中（不属于 IP 层），帧类型字段为 0x0806。
      - table [ref=e7855]:
        - rowgroup [ref=e7856]:
          - row [ref=e7857]:
            - columnheader "字段" [ref=e7858]
            - columnheader "长度" [ref=e7859]
            - columnheader "说明" [ref=e7860]
        - rowgroup [ref=e7861]:
          - row [ref=e7862]:
            - cell "硬件类型" [ref=e7863]
            - cell "2 字节" [ref=e7864]
            - cell "以太网为 1" [ref=e7865]
          - row [ref=e7866]:
            - cell "协议类型" [ref=e7867]
            - cell "2 字节" [ref=e7868]
            - cell "IPv4 为 0x0800" [ref=e7869]
          - row [ref=e7870]:
            - cell "硬件地址长度" [ref=e7871]
            - cell "1 字节" [ref=e7872]
            - cell "MAC 地址 = 6" [ref=e7873]
          - row [ref=e7874]:
            - cell "协议地址长度" [ref=e7875]
            - cell "1 字节" [ref=e7876]
            - cell "IP 地址 = 4" [ref=e7877]
          - row [ref=e7878]:
            - cell "操作码" [ref=e7879]
            - cell "2 字节" [ref=e7880]
            - cell "1=请求，2=应答" [ref=e7881]
          - row [ref=e7882]:
            - cell "发送方 MAC" [ref=e7883]
            - cell "6 字节" [ref=e7884]
            - cell "源 MAC" [ref=e7885]
          - row [ref=e7886]:
            - cell "发送方 IP" [ref=e7887]
            - cell "4 字节" [ref=e7888]
            - cell "源 IP" [ref=e7889]
          - row [ref=e7890]:
            - cell "目标 MAC" [ref=e7891]
            - cell "6 字节" [ref=e7892]
            - cell "请求时为全 0，应答时为目标 MAC" [ref=e7893]
          - row [ref=e7894]:
            - cell "目标 IP" [ref=e7895]
            - cell "4 字节" [ref=e7896]
            - cell "目标 IP" [ref=e7897]
      - heading "ARP 缓存和老化时间" [level=4] [ref=e7898]
      - list [ref=e7899]:
        - listitem [ref=e7900]:
          - text: 每台主机维护一张
          - strong [ref=e7901]: ARP 缓存表
          - text: （arp -a 命令可查看）
        - listitem [ref=e7902]:
          - text: 动态条目有
          - strong [ref=e7903]: 老化时间
          - text: （通常 2~20 分钟），超时自动删除
        - listitem [ref=e7904]: 静态条目可以手动配置，不会老化
        - listitem [ref=e7905]: 每次收到 ARP 应答或 gratuitous ARP 时刷新对应的缓存条目
      - heading "免费 ARP（Gratuitous ARP）" [level=4] [ref=e7906]
      - paragraph [ref=e7907]:
        - text: 免费 ARP 是一种特殊的 ARP 请求——主机
        - strong [ref=e7908]: 以自己的 IP 地址作为目标 IP
        - text: 发送 ARP 请求。
      - paragraph [ref=e7909]:
        - strong [ref=e7910]: 两个主要作用
        - text: ：
      - list [ref=e7911]:
        - listitem [ref=e7912]:
          - strong [ref=e7913]: IP 地址冲突检测
          - text: ：主机启动时发送免费 ARP，如果收到应答，说明网络中已经有人用了这个 IP，操作系统会提示"IP 地址冲突"
        - listitem [ref=e7914]:
          - strong [ref=e7915]: 更新其他主机的 ARP 缓存
          - text: ：当主机更换网卡（MAC 变了但 IP 不变）或做故障切换时，发送免费 ARP 让局域网内其他主机更新 ARP 表
      - blockquote [ref=e7916]:
        - paragraph [ref=e7917]: 类比：搬了新家但电话号码不变，免费 ARP 就是群发消息"我的新地址是 xxx，以后找我请来新地址"。
      - heading "代理 ARP（Proxy ARP）" [level=4] [ref=e7918]
      - paragraph [ref=e7919]: 代理 ARP 允许一台路由器代替另一个网络中的主机回复 ARP 请求。
      - paragraph [ref=e7920]:
        - strong [ref=e7921]: 场景
        - text: ：主机 A（192.168.1.10/16）以为自己和主机 B（192.168.2.10/16）在同一个网段（因为掩码是 /16），实际上它们被路由器分隔在不同的 /24 子网中。当 A 广播 ARP 请求 B 的 MAC 时，路由器代为回复自己的 MAC，之后 A 的数据都发给路由器，路由器再转发给 B。
      - blockquote [ref=e7922]:
        - paragraph [ref=e7923]: 代理 ARP 让子网划分对主机"透明"——主机不需要知道子网的存在。
      - heading "ARP 欺骗攻击（ARP Spoofing）" [level=4] [ref=e7924]
      - paragraph [ref=e7925]:
        - text: 攻击者发送
        - strong [ref=e7926]: 伪造的 ARP 应答
        - text: ，将合法 IP 映射到攻击者的 MAC 地址，实现中间人攻击。
      - paragraph [ref=e7927]:
        - strong [ref=e7928]: 攻击过程
        - text: ：
      - list [ref=e7929]:
        - listitem [ref=e7930]: 攻击者 C 向 A 发送伪造 ARP："网关 IP 的 MAC 是我 C"
        - listitem [ref=e7931]: 攻击者 C 向网关发送伪造 ARP："A 的 MAC 是我 C"
        - listitem [ref=e7932]: A 和网关之间的通信都经过 C，C 可以窃听、篡改数据
      - paragraph [ref=e7933]:
        - strong [ref=e7934]: 防御措施
        - text: ：静态 ARP 绑定、DAI（动态 ARP 检测）、ARP 防火墙。
      - separator [ref=e7935]
      - heading "ICMP 协议详解" [level=3] [ref=e7936]
      - paragraph [ref=e7937]:
        - strong [ref=e7938]: 作用
        - text: ：报告网络层的差错和控制信息。ICMP 是 IP 层的辅助协议，ICMP 报文封装在 IP 数据报中（协议号为 1）。
      - blockquote [ref=e7939]:
        - paragraph [ref=e7940]:
          - text: PING 用的是 ICMP 协议，
          - strong [ref=e7941]: 不是应用层协议
          - text: ！ICMP 和 IP 同属网络层。
      - heading "ICMP 报文类型分类" [level=4] [ref=e7942]
      - paragraph [ref=e7943]:
        - text: ICMP 报文分为两大类：
        - strong [ref=e7944]: 差错报告报文
        - text: 和
        - strong [ref=e7945]: 查询报文
        - text: 。
      - table [ref=e7946]:
        - rowgroup [ref=e7947]:
          - row [ref=e7948]:
            - columnheader "类型" [ref=e7949]
            - columnheader "报文分类" [ref=e7950]
            - columnheader "类型编号" [ref=e7951]
            - columnheader "名称" [ref=e7952]
            - columnheader "说明" [ref=e7953]
        - rowgroup [ref=e7954]:
          - row [ref=e7955]:
            - cell "差错报告" [ref=e7956]
            - cell "—" [ref=e7957]
            - cell "3" [ref=e7958]
            - cell [ref=e7959]:
              - strong [ref=e7960]: 终点不可达
            - cell "包无法到达目的地" [ref=e7961]
          - row [ref=e7962]:
            - cell "差错报告" [ref=e7963]
            - cell "—" [ref=e7964]
            - cell "4" [ref=e7965]
            - cell "源点抑制" [ref=e7966]
            - cell "让发送方降低发送速率（已废弃）" [ref=e7967]
          - row [ref=e7968]:
            - cell "差错报告" [ref=e7969]
            - cell "—" [ref=e7970]
            - cell "5" [ref=e7971]
            - cell "重定向" [ref=e7972]
            - cell "告诉发送方有更好的路由" [ref=e7973]
          - row [ref=e7974]:
            - cell "差错报告" [ref=e7975]
            - cell "—" [ref=e7976]
            - cell "11" [ref=e7977]
            - cell [ref=e7978]:
              - strong [ref=e7979]: 超时
            - cell "TTL 减到 0，包被丢弃" [ref=e7980]
          - row [ref=e7981]:
            - cell "差错报告" [ref=e7982]
            - cell "—" [ref=e7983]
            - cell "12" [ref=e7984]
            - cell "参数问题" [ref=e7985]
            - cell "IP 头部有错误" [ref=e7986]
          - row [ref=e7987]:
