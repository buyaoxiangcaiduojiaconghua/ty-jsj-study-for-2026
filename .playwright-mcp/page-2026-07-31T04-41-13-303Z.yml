      - heading "海明码纠错例题：收到 1110101，判断哪一位出错" [level=4] [ref=e6154]
      - paragraph [ref=e6155]:
        - strong [ref=e6156]: 步骤 1：确定结构
        - text: 总位数 7，校验位 3（位置 1, 2, 4），数据位 4（位置 3, 5, 6, 7）
      - paragraph [ref=e6157]: 收到的数据：
