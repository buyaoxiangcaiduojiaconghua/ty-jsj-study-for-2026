      - heading "协议的三要素" [level=4] [ref=e4399]
      - paragraph [ref=e4400]: 协议（Protocol）是通信双方约定的规则。一个协议包含三个要素：
      - table [ref=e4401]:
        - rowgroup [ref=e4402]:
