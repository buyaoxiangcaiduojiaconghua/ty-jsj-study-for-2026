            - columnheader "缺点" [ref=e4318]
            - columnheader "适用场景" [ref=e4319]
        - rowgroup [ref=e4320]:
          - row [ref=e4321]:
            - cell [ref=e4322]:
              - strong [ref=e4323]: 星型
            - cell "所有节点连到中心节点" [ref=e4324]
            - cell "单点故障不影响其他节点，易管理" [ref=e4325]
            - cell "中心节点故障全网瘫痪" [ref=e4326]
            - cell "局域网（交换机为中心）" [ref=e4327]
          - row [ref=e4328]:
            - cell [ref=e4329]:
              - strong [ref=e4330]: 总线型
            - cell "所有节点共用一条线路" [ref=e4331]
            - cell "布线简单，成本低" [ref=e4332]
            - cell "线路故障全网瘫痪，同一时刻只能一个节点发送" [ref=e4333]
            - cell "早期以太网" [ref=e4334]
          - row [ref=e4335]:
