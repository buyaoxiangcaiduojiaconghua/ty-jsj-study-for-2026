        - text: ：
      - paragraph [ref=e10124]:
        - strong [ref=e10125]: （1）重传计时器（Retransmission Timer）
      - list [ref=e10126]:
        - listitem [ref=e10127]: 每个报文段发送后启动一个重传计时器
        - listitem [ref=e10128]: 超时时间 RTO（Retransmission Time-Out）通过 RTT 动态计算
        - listitem [ref=e10129]:
          - text: 采用
          - strong [ref=e10130]: 自适应算法
          - text: ：RTO = RTT_S + 4 x RTT_D（RTT_S 是平滑 RTT，RTT_D 是 RTT 偏差）
        - listitem [ref=e10131]:
          - strong [ref=e10132]: Karn 算法
          - text: ：重传的报文段不参与 RTT 计算（因为无法区分 ACK 是对原件还是重传件的确认）
      - paragraph [ref=e10133]:
        - strong [ref=e10134]: （2）持续计时器（Persist Timer）
      - list [ref=e10135]:
        - listitem [ref=e10136]: 接收方 rwnd=0 后，发送方启动持续计时器
        - listitem [ref=e10137]: 防止死锁：接收方窗口恢复的 ACK 丢失后，发送方永远不知道可以继续发了
        - listitem [ref=e10138]: 发送方定期发送 1 字节的零窗口探测报文
      - paragraph [ref=e10139]:
        - strong [ref=e10140]: （3）保活计时器（Keepalive Timer）
      - list [ref=e10141]:
        - listitem [ref=e10142]: 连接空闲超过 2 小时后启动
        - listitem [ref=e10143]: 发送探测报文，如果连续 10 次（每次间隔 75 秒）无响应，认为对方已崩溃，关闭连接
        - listitem [ref=e10144]: 不是 TCP 规范强制要求，但多数实现提供
      - paragraph [ref=e10145]:
        - strong [ref=e10146]: （4）TIME_WAIT 计时器
      - list [ref=e10147]:
        - listitem [ref=e10148]: 进入 TIME_WAIT 状态后启动
        - listitem [ref=e10149]: 等待 2MSL 后转移到 CLOSED
        - listitem [ref=e10150]: 确保最后一个 ACK 能到达，且旧连接报文全部消散
