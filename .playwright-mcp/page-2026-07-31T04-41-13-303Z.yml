          - row [ref=e12595]:
            - cell "数学基础" [ref=e12596]
            - cell "置换、代换" [ref=e12597]
            - cell "大数分解、离散对数" [ref=e12598]
      - heading "5.4 混合加密" [level=4] [ref=e12599]
      - paragraph [ref=e12600]: 实际应用中，两者结合使用：
      - list [ref=e12601]:
        - listitem [ref=e12602]: 用非对称加密（RSA/ECC）安全传输"对称密钥"
        - listitem [ref=e12603]: 之后用对称加密（AES）加密实际数据
        - listitem [ref=e12604]: HTTPS 就是典型的混合加密：RSA/ECDH 交换密钥 + AES 加密数据
      - blockquote [ref=e12605]:
        - paragraph [ref=e12606]: 类比：非对称加密是"保险箱"（安全但容量小），把钥匙（对称密钥）放进去；对称加密是"大卡车"（快但钥匙需要安全传递），真正运货。
      - heading "5.5 Diffie-Hellman 密钥交换" [level=4] [ref=e12607]
      - paragraph [ref=e12608]: 不直接传输密钥，而是双方各自生成公私钥对，通过公开交换部分信息，各自计算出相同的共享密钥。
      - list [ref=e12609]:
        - listitem [ref=e12610]: 原理：基于离散对数问题
        - listitem [ref=e12611]: 过程：A 选 a，发送 g^a mod p；B 选 b，发送 g^b mod p；双方各自计算 (g^b)^a 和 (g^a)^b，结果相同
        - listitem [ref=e12612]: 缺点：DH 本身不认证身份，需配合数字签名防中间人攻击（ECDHE 中的 E 是临时密钥）
      - separator [ref=e12613]
      - heading "六、数字签名与消息认证" [level=3] [ref=e12614]
      - heading "6.1 哈希函数" [level=4] [ref=e12615]
      - paragraph [ref=e12616]: 把任意长度的消息压缩成固定长度的"指纹"（摘要），不可逆。
      - table [ref=e12617]:
        - rowgroup [ref=e12618]:
          - row [ref=e12619]:
            - columnheader "算法" [ref=e12620]
            - columnheader "输出长度" [ref=e12621]
            - columnheader "安全性" [ref=e12622]
            - columnheader "现状" [ref=e12623]
        - rowgroup [ref=e12624]:
          - row [ref=e12625]:
            - cell "MD5" [ref=e12626]
            - cell "128 位" [ref=e12627]
            - cell "已破解（2004 年王小云找到碰撞）" [ref=e12628]
            - cell "禁止用于安全领域" [ref=e12629]
          - row [ref=e12630]:
