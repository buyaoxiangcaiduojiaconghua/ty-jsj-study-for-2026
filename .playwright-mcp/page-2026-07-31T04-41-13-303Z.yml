      - heading "HTTP 缓存机制" [level=4] [ref=e11012]
      - paragraph [ref=e11013]:
        - strong [ref=e11014]: 为什么需要缓存？
        - text: 减少重复请求，加快页面加载，减轻服务器压力。
      - paragraph [ref=e11015]:
        - strong [ref=e11016]: 强缓存（不向服务器发请求）
        - text: ：
      - table [ref=e11017]:
        - rowgroup [ref=e11018]:
          - row [ref=e11019]:
            - columnheader "字段" [ref=e11020]
            - columnheader "含义" [ref=e11021]
            - columnheader "示例" [ref=e11022]
        - rowgroup [ref=e11023]:
          - row [ref=e11024]:
            - cell [ref=e11025]:
              - strong [ref=e11026]: Expires
              - text: （HTTP/1.0）
            - cell "资源过期时间（绝对时间）" [ref=e11027]
            - cell [ref=e11028]:
              - code [ref=e11029]: "Expires: Wed, 21 Oct 2026 07:28:00 GMT"
          - row [ref=e11030]:
            - cell [ref=e11031]:
              - strong [ref=e11032]: Cache-Control
              - text: （HTTP/1.1）
            - cell "缓存控制（相对时间，优先级更高）" [ref=e11033]
            - cell [ref=e11034]:
              - code [ref=e11035]: "Cache-Control: max-age=3600"
              - text: （3600 秒内直接使用缓存）
      - blockquote [ref=e11036]:
        - paragraph [ref=e11037]:
          - code [ref=e11038]: Cache-Control
          - text: 常用值：
          - code [ref=e11039]: max-age=N
          - text: （N 秒内用缓存）、
          - code [ref=e11040]: no-cache
          - text: （需要协商缓存验证）、
          - code [ref=e11041]: no-store
          - text: （完全不缓存）、
          - code [ref=e11042]: public
          - text: （可被中间代理缓存）、
          - code [ref=e11043]: private
          - text: （只能被浏览器缓存）
      - paragraph [ref=e11044]:
        - strong [ref=e11045]: 协商缓存（向服务器确认是否可用缓存）
        - text: ：
      - table [ref=e11046]:
        - rowgroup [ref=e11047]:
