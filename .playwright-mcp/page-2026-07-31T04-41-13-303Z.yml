      - blockquote [ref=e14973]:
        - paragraph [ref=e14974]:
          - strong [ref=e14975]: WPA2 个人版 vs 企业版
          - text: ：个人版用 PSK（预共享密钥，即 Wi-Fi 密码），所有人用同一个密码；企业版用 802.1X + RADIUS 服务器，每个人有自己的账号密码。
      - paragraph [ref=e14976]:
        - strong [ref=e14977]: WPA/WPA2 四步握手过程
        - text: ：
      - list [ref=e14978]:
        - listitem [ref=e14979]: AP 发送随机数 ANonce 给客户端
        - listitem [ref=e14980]: 客户端根据 ANonce + 自己的 SNonce + PMK（由密码生成）计算出 PTK（成对临时密钥），回复 SNonce
        - listitem [ref=e14981]: AP 同样计算 PTK，验证一致后回复确认
        - listitem [ref=e14982]: 客户端确认，双方安装 PTK 开始加密通信
      - blockquote [ref=e14983]:
        - paragraph [ref=e14984]: PMK = PBKDF2(密码, SSID, 4096 次迭代)，这就是为什么 Wi-Fi 密码不要太简单——暴力破解就是不断尝试不同密码计算 PMK 来匹配。
      - heading "WPA3（最新标准）" [level=4] [ref=e14985]
      - table [ref=e14986]:
        - rowgroup [ref=e14987]:
          - row [ref=e14988]:
            - columnheader "特性" [ref=e14989]
            - columnheader "说明" [ref=e14990]
        - rowgroup [ref=e14991]:
          - row [ref=e14992]:
