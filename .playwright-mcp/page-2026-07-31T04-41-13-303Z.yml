      - blockquote [ref=e10684]:
        - paragraph [ref=e10685]:
          - strong [ref=e10686]: CNAME vs A 记录
          - text: ：CNAME 是"别名"——
          - link "www.example.com" [ref=e10687] [cursor=pointer]:
            - /url: http://www.example.com
          - text: 指向 example.com，然后 example.com 再通过 A 记录找到 IP。一个域名不能同时有 CNAME 和 A 记录。CNAME 好处是修改 IP 时只改 A 记录就行，所有别名自动跟着变。
      - heading "DNS 缓存机制和 TTL" [level=4] [ref=e10688]
      - list [ref=e10689]:
        - listitem [ref=e10690]:
          - strong [ref=e10691]: TTL（Time to Live）
          - text: ：每条 DNS 记录都有一个存活时间（秒），告诉别人"这条记录你可以缓存多久"。
        - listitem [ref=e10692]: 缓存位置：浏览器缓存 → 操作系统缓存 → 本地 DNS 服务器缓存 → 各级 DNS 服务器缓存
        - listitem [ref=e10693]: TTL 长 → 缓存久 → 查询快，但 IP 变了要等很久才能生效
        - listitem [ref=e10694]: TTL 短 → 缓存短 → 查询慢，但 IP 变更能快速生效
      - blockquote [ref=e10695]:
        - paragraph [ref=e10696]:
          - strong [ref=e10697]: 实际经验
          - text: ：网站迁移时，运营商会提前把 TTL 调短（如 300 秒），迁移完成后立刻改 IP，等一段时间再调回正常 TTL（如 86400 秒 = 1 天）。
