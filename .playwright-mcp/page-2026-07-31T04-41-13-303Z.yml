            - columnheader "工作方式" [ref=e11051]
        - rowgroup [ref=e11052]:
          - row [ref=e11053]:
            - cell [ref=e11054]:
              - code [ref=e11055]: If-Modified-Since
            - cell [ref=e11056]:
              - code [ref=e11057]: Last-Modified
            - cell "浏览器问\"这个资源从 X 时间之后改过吗？\"——没改返回 304，改了返回 200 + 新内容" [ref=e11058]
          - row [ref=e11059]:
            - cell [ref=e11060]:
              - code [ref=e11061]: If-None-Match
            - cell [ref=e11062]:
              - code [ref=e11063]: ETag
            - cell "浏览器问\"资源的版本号还是 ABC 吗？\"——没变返回 304，变了返回 200 + 新内容" [ref=e11064]
      - blockquote [ref=e11065]:
        - paragraph [ref=e11066]:
          - strong [ref=e11067]: ETag vs Last-Modified
          - text: ：ETag 更精确（版本号），Last-Modified 只能精确到秒。如果一秒内改两次，Last-Modified 检测不出来，ETag 可以。ETag 优先级高于 Last-Modified。
      - paragraph [ref=e11068]:
        - strong [ref=e11069]: 完整缓存流程
        - text: ：
      - code [ref=e11071]: 浏览器请求资源 ↓ 查强缓存（Cache-Control / Expires） ├── 命中 → 直接用缓存（200 from disk cache） └── 未命中 → 发请求到服务器 ↓ 协商缓存（If-None-Match / If-Modified-Since） ├── 304 Not Modified → 用本地缓存 └── 200 OK → 下载新资源，更新缓存
