      - paragraph [ref=e8120]:
        - strong [ref=e8121]: RIP 核心
        - text: ：
      - list [ref=e8122]:
        - listitem [ref=e8123]: 每 30 秒广播一次路由表
        - listitem [ref=e8124]: 距离矢量算法（Bellman-Ford）
        - listitem [ref=e8125]:
          - strong [ref=e8126]: 慢收敛
          - text: 问题：好消息传得快，坏消息传得慢
        - listitem [ref=e8127]: 限制跳数 15 防止无穷计数
      - paragraph [ref=e8128]:
        - strong [ref=e8129]: OSPF 核心
        - text: ：
      - list [ref=e8130]:
        - listitem [ref=e8131]: 洪泛链路状态（LSA），每个路由器构建相同的拓扑图
        - listitem [ref=e8132]: 用 Dijkstra（SPF）算法计算最短路径
        - listitem [ref=e8133]: 分区域（Area），Area 0 是骨干区域
        - listitem [ref=e8134]: 收敛快，支持负载均衡
      - blockquote [ref=e8135]:
        - paragraph [ref=e8136]:
          - strong [ref=e8137]: RIP vs OSPF
          - text: ：RIP 像"邻居口耳相传"，信息只要知道方向就行；OSPF 像"人手一张地图"，全局视野。
