      - heading "5.4 完整封装示意图（含各层头部/尾部大小）" [level=3] [ref=e4857]
      - code [ref=e4859]: 发送端主机 A（封装过程，从上到下，每层加头）： ═══════════════════════════════════════════════════════════════════ 应用层： ┌──────────────────────────────────────┐ │ 应用数据 (Data) │ ← 原始数据，无固定大小 └──────────────────────────────────────┘ ↓ 传给传输层（作为传输层 SDU） 传输层： ┌────────────┬─────────────────────────┐ │ TCP/UDP 头 │ 应用数据 │ ← TCP 段 (Segment) │ (20~60 B) │ │ TCP 头最小 20 字节 └────────────┴─────────────────────────┘ ↓ 传给网络层（作为网络层 SDU） 网络层： ┌──────────┬────────────┬──────────────┐ │ IP 头 │ TCP/UDP 头 │ 应用数据 │ ← IP 包 (Packet) │ (20~60 B) │ │ │ IP 头通常 20 字节 └──────────┴────────────┴──────────────┘ ↓ 传给数据链路层（作为链路层 SDU） 数据链路层： ┌──────┬──────┬──────┬──────────┬────────────┬──────────────┬──────┐ │前导码 │目的MAC│源MAC │类型/长度 │ IP 头 │ TCP/UDP头+数据│ FCS │ │ 8 B │ 6 B │ 6 B │ 2 B │ (20~60 B) │ (可变) │ 4 B │ └──────┴──────┴──────┴──────────┴────────────┴──────────────┴──────┘ ← 帧头 18 B（不含前导码）→ ← FCS 尾 4 B → ← 以太网帧 (Frame) 最小 64 B，最大 1518 B → ↓ 传给物理层 物理层： 101100101011010010101110010010101... ← 比特流 (Bits) ═══════════════════════════════════════════════════════════════════
      - paragraph [ref=e4860]:
        - strong [ref=e4861]: 各层头部/尾部字节大小汇总：
