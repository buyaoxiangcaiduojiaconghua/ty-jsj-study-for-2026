      - heading "⚠️ 常见易错陷阱 12 条" [level=2] [ref=e13595]
      - heading "十四、常见易错陷阱总结" [level=2] [ref=e13596]
      - list [ref=e13597]:
        - listitem [ref=e13598]:
          - strong [ref=e13599]: OSI 模型不是协议，是参考模型
          - text: ；TCP/IP 才是协议栈
        - listitem [ref=e13600]:
          - strong [ref=e13601]: 交换机工作在数据链路层
          - text: （看 MAC），
          - strong [ref=e13602]: 路由器工作在网络层
          - text: （看 IP），不要搞混
        - listitem [ref=e13603]:
          - strong [ref=e13604]: 子网可用主机数 = 2^n - 2
          - text: ，减去的 2 是网络地址和广播地址，千万别忘
        - listitem [ref=e13605]:
          - strong [ref=e13606]: TCP 三次握手不是四次，是三次
          - text: （服务器把 SYN+ACK 合并了）
        - listitem [ref=e13607]:
          - strong [ref=e13608]: 四次挥手是四次，因为全双工，ACK 和 FIN 必须分开
        - listitem [ref=e13609]:
          - strong [ref=e13610]: TIME_WAIT 在主动关闭方
          - text: ，持续 2MSL
        - listitem [ref=e13611]:
          - strong [ref=e13612]: DNS 默认用 UDP 53 端口
          - text: （不是 TCP）
        - listitem [ref=e13613]:
          - strong [ref=e13614]: HTTP 是明文，HTTPS 是加密
          - text: （HTTPS = HTTP + SSL/TLS）
        - listitem [ref=e13615]:
          - strong [ref=e13616]: DHCP 是 UDP 协议
          - text: （67/68 端口），不是 TCP
        - listitem [ref=e13617]:
          - strong [ref=e13618]: 私有 IP 地址
          - text: ：10.x.x.x、172.16-31.x.x、192.168.x.x
        - listitem [ref=e13619]:
          - strong [ref=e13620]: RIP 最大跳数 15
          - text: ，16 跳视为不可达
        - listitem [ref=e13621]:
          - strong [ref=e13622]: 集线器是物理层设备
          - text: （不识别地址），交换机是数据链路层设备（识别 MAC）
      - separator [ref=e13623]
      - heading "知识点 23：无线网络与移动网络" [level=2] [ref=e13624]
      - blockquote [ref=e13625]:
