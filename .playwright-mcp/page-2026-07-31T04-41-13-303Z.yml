      - heading "例题 1：三次握手状态题" [level=4] [ref=e10336]
      - paragraph [ref=e10337]:
        - strong [ref=e10338]: 题目
        - text: ：以下关于 TCP 三次握手的说法，正确的是？（多选）
      - paragraph [ref=e10339]: A. 第一次握手时，SYN=1，ACK=0，seq=x B. 第二次握手时，SYN=1，ACK=1，seq=y，ack=x+1 C. 第三次握手时，SYN=0，ACK=1，seq=x+1，ack=y+1 D. 连接建立后，所有报文的 SYN 标志位都为 1
      - paragraph [ref=e10340]:
        - strong [ref=e10341]: 答案
        - text: ：A、B、C
      - paragraph [ref=e10342]:
        - strong [ref=e10343]: 解析
        - text: ：
      - list [ref=e10344]:
        - listitem [ref=e10345]: A 正确：第一次握手只有 SYN 标志，ACK=0
        - listitem [ref=e10346]: B 正确：第二次握手 SYN+ACK 合并，ack=x+1 确认收到客户端的 SYN
        - listitem [ref=e10347]: C 正确：第三次握手只有 ACK，seq=x+1（客户端序号从 x+1 开始），ack=y+1 确认收到服务端的 SYN
        - listitem [ref=e10348]:
          - text: D 错误：连接建立后 SYN=0，
          - strong [ref=e10349]: ACK=1
          - text: （连接建立后所有报文段 ACK 都置 1）
