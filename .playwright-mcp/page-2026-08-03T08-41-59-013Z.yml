            - cell "✅（部分）" [ref=e2438]
            - cell "a 用范围查询，b 用不上索引" [ref=e2439]
      - paragraph [ref=e2440]:
        - strong [ref=e2441]: 最左前缀匹配原理
        - text: ：复合索引按 (a, b, c) 的顺序构建 B+ 树——先按 a 排序，a 相同时按 b 排序，b 相同时按 c 排序。所以必须从 a 开始才能利用这个排序。
