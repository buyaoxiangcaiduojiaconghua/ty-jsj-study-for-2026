      - separator [ref=e1595]
      - heading "11.5 例题（5道选择题）" [level=3] [ref=e1596]
      - blockquote [ref=e1597]:
        - paragraph [ref=e1598]:
          - strong [ref=e1599]: 例题 1
          - text: ：关系数据库中的"关系"指的是 ______。 A. 数据之间的关联 B. 一张二维表 C. 字段之间的对应关系 D. E-R 图中的联系
        - paragraph [ref=e1600]:
          - strong [ref=e1601]: 答案
          - text: ：B。在关系模型中，"关系"正式定义是域的笛卡尔积的子集，直观上对应一张二维表。
      - blockquote [ref=e1602]:
        - paragraph [ref=e1603]:
          - strong [ref=e1604]: 例题 2
          - text: ：设关系 R 有 3 个属性 4 个元组，关系 S 有 2 个属性 5 个元组，则 R × S 有 ___ 个属性，___ 个元组。 A. 5, 9 B. 5, 20 C. 6, 20 D. 6, 9
        - paragraph [ref=e1605]:
          - strong [ref=e1606]: 答案
          - text: ：B。5 个属性（3 + 2）、20 个元组（4 × 5）。笛卡尔积属性相加、元组相乘。
      - blockquote [ref=e1607]:
        - paragraph [ref=e1608]:
          - strong [ref=e1609]: 例题 3
          - text: ：自然连接中，当两个关系没有公共属性时，自然连接退化为 ______。 A. 等值连接 B. 外连接 C. 笛卡尔积 D. θ 连接
        - paragraph [ref=e1610]:
          - strong [ref=e1611]: 答案
          - text: ：C。因为没有公共属性就无法做属性相等匹配，只能是全组合（笛卡尔积）。
      - blockquote [ref=e1612]:
        - paragraph [ref=e1613]:
          - strong [ref=e1614]: 例题 4
          - text: ：关系代数的五种基本运算是 ______。 A. 并、差、交、选择、投影 B. 并、差、笛卡尔积、选择、投影 C. 并、交、笛卡尔积、连接、除 D. 并、差、选择、投影、连接
        - paragraph [ref=e1615]:
          - strong [ref=e1616]: 答案
          - text: ：B。五种基本运算：并、差、笛卡尔积、选择、投影。交（∩）可以用差（−）表示：R∩S = R−(R−S)，所以交不是基本运算。连接和除也都是可由基本运算组合而成的。
      - blockquote [ref=e1617]:
        - paragraph [ref=e1618]:
          - strong [ref=e1619]: 例题 5
          - text: ：在关系数据库中，当外码 F 是关系 R 的属性，且 F 引用关系 S 的主码 K 时，F 的值 ______。 A. 可以为空 B. 不能为空 C. 为空或等于 S 中某个 K 值 D. 必须等于 S 中某个 K 值
        - paragraph [ref=e1620]:
          - strong [ref=e1621]: 答案
          - text: ：C。参照完整性规定：外码要么为空（NULL），要么等于被引用关系中某个主码值。注意与实体完整性（主码不能为空）区分。
      - heading "11.6 易错陷阱" [level=3] [ref=e1622]
