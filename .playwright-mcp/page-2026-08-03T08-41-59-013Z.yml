            - cell "以为 2NF 一定满足" [ref=e5294]
            - cell "对！单属性候选码不存在\"部分依赖\"问题，自动满足 2NF" [ref=e5295]
          - row [ref=e5296]:
            - cell "1NF 是默认满足的" [ref=e5297]
            - cell "忽略检查" [ref=e5298]
            - cell "考试中默认关系都满足 1NF，除非题目明确说某个属性不原子" [ref=e5299]
          - row [ref=e5300]:
            - cell "3NF 比 BCNF 宽松" [ref=e5301]
            - cell "混淆关系" [ref=e5302]
            - cell "BCNF ⊂ 3NF ⊂ 2NF ⊂ 1NF（BCNF 最严格）" [ref=e5303]
          - row [ref=e5304]:
            - cell "认为 NULL 影响范式判断" [ref=e5305]
            - cell "混入无关概念" [ref=e5306]
            - cell "范式判断只看函数依赖，跟 NULL 和具体数据无关" [ref=e5307]
          - row [ref=e5308]:
            - cell "混淆\"传递依赖\"和\"间接依赖\"" [ref=e5309]
            - cell "把任何间接关系都叫传递依赖" [ref=e5310]
            - cell "传递依赖特指：非主属性 A → 非主属性 B。如果 A 是主属性则不叫传递依赖（那是 BCNF 的范畴）" [ref=e5311]
      - separator [ref=e5312]
      - heading "六、ER图转关系模式真题" [level=3] [ref=e5313]
      - heading "真题 1：M:N 联系转换规则" [level=4] [ref=e5314]
      - paragraph [ref=e5315]: 在 ER 图中，一个学生和课程之间存在 M:N 的"选课"联系。将其转换为关系模式时，正确的是（ ）
      - paragraph [ref=e5316]: A. 在"学生"表中增加"课程号"字段 B. 在"课程"表中增加"学号"字段 C. 单独建立一个"选课"表，包含学号和课程号 D. 将 M:N 联系合并到学生表或课程表中任意一端
      - blockquote [ref=e5317]:
        - paragraph [ref=e5318]:
          - strong [ref=e5319]: 解析
          - text: ：M:N 联系
          - strong [ref=e5320]: 必须单独建表
          - text: ，新表的主键由两端实体主键的组合构成。如果联系还有自己属性（如"成绩"），也放在这个新表里。1:1 可合并到任意一端，1:N 合并到 N 端。
          - strong [ref=e5321]: 答案：C。
      - heading "真题 2：1:N 联系转换规则" [level=4] [ref=e5322]
      - paragraph [ref=e5323]: 一个班级有多个学生，一个学生只属于一个班级。这种 1:N 联系转换为关系模式时，正确做法是（ ）
      - paragraph [ref=e5324]: A. 在"班级"表中增加"学号"字段，作为外键 B. 在"学生"表中增加"班级编号"字段，作为外键 C. 单独建立一个"属于"表 D. 不进行任何处理
      - blockquote [ref=e5325]:
        - paragraph [ref=e5326]:
          - strong [ref=e5327]: 解析
          - text: ：1:N 联系
          - strong [ref=e5328]: 必须合并到 N 端
          - text: ，即把 1 端的主键放到 N 端作为外键。这里 N 端是"学生"（多个学生属于一个班级），所以在"学生"表加"班级编号"外键。
          - strong [ref=e5329]: 答案：B。
      - heading "真题 3：SQL GROUP BY + HAVING" [level=4] [ref=e5330]
      - paragraph [ref=e5331]:
        - text: 有学生表
        - code [ref=e5332]: S(sid, sname, dept)
        - text: 和选课表
        - code [ref=e5333]: SC(sid, cid, score)
        - text: 。查询"平均成绩大于等于 80 分的学生学号和平均成绩"，按学号降序排列。正确的 SQL 语句是（ ）
      - paragraph [ref=e5334]:
        - text: A. 正确答案的 SQL 结构包含：
        - code [ref=e5335]: GROUP BY sid
        - text: （按学生分组）→
        - code [ref=e5336]: HAVING AVG(score) >= 80
        - text: （筛选分组后的结果）→
        - code [ref=e5337]: ORDER BY sid DESC
        - text: （降序排列）
      - code [ref=e5339]: SELECT sid, AVG(score) AS avg_score FROM SC GROUP BY sid HAVING AVG(score) >= 80 ORDER BY sid DESC;
      - paragraph [ref=e5340]:
        - strong [ref=e5341]: 考点拆解
        - text: ：
      - list [ref=e5342]:
        - listitem [ref=e5343]:
          - code [ref=e5344]: WHERE
          - text: 和
          - code [ref=e5345]: HAVING
          - text: 的区别：WHERE 在分组前过滤行，HAVING 在分组后过滤组
        - listitem [ref=e5346]:
          - code [ref=e5347]: WHERE
          - text: 中不能使用聚合函数（如
          - code [ref=e5348]: AVG
          - text: 、
          - code [ref=e5349]: COUNT
          - text: ）
        - listitem [ref=e5350]:
          - code [ref=e5351]: ORDER BY
          - text: 中可以使用 SELECT 中定义的别名（因为 ORDER BY 在 SELECT 之后执行）
      - paragraph [ref=e5352]:
        - strong [ref=e5353]: 易错陷阱
        - text: ：如果写成
        - code [ref=e5354]: WHERE AVG(score) >= 80
        - text: 或
        - code [ref=e5355]: WHERE avg_score >= 80
        - text: 都是错误的。
      - heading "真题 4：事务隔离级别判断题" [level=4] [ref=e5356]
      - paragraph [ref=e5357]: "\"读已提交（Read Committed）\"隔离级别可以防止的问题是（ ）"
      - paragraph [ref=e5358]: A. 丢失修改和脏读 B. 脏读和不可重复读 C. 丢失修改、脏读和不可重复读 D. 所有并发问题
      - blockquote [ref=e5359]:
        - paragraph [ref=e5360]:
          - strong [ref=e5361]: 解析
          - text: ：所有隔离级别都防止丢失修改（通过写锁实现）。"读已提交"在前者的基础上额外防止脏读（不读未提交的数据），但不能防止不可重复读和幻读。
          - strong [ref=e5362]: 答案：A。
      - heading "真题 5：事务 ACID 特性判断" [level=4] [ref=e5363]
      - paragraph [ref=e5364]: 银行转账操作中：A 账户扣款 100 元，B 账户加款 100 元。若在 A 扣款成功后系统突然断电，B 未加款，恢复后 A 的扣款被撤销。这体现了事务的（ ）特性；恢复后 A 和 B 的金额在扣款和加款都成功的前提下数据保持正确，体现了事务的（ ）特性
      - paragraph [ref=e5365]: A. 原子性、一致性 B. 一致性、隔离性 C. 持久性、原子性 D. 隔离性、持久性
      - blockquote [ref=e5366]:
        - paragraph [ref=e5367]:
          - strong [ref=e5368]: 解析
          - text: ："要么都做、要么都不做"是原子性。A 扣款成功但 B 未加款，恢复后 A 撤销扣款（全部不做），体现
          - strong [ref=e5369]: 原子性
          - text: 。A 和 B 总金额在转账前后保持不变，数据从一种正确状态变到另一种正确状态，体现
          - strong [ref=e5370]: 一致性
          - text: 。
          - strong [ref=e5371]: 答案：A。
      - paragraph [ref=e5372]:
        - strong [ref=e5373]: ACID 辨析技巧
        - text: （高频考点）：
      - table [ref=e5374]:
        - rowgroup [ref=e5375]:
          - row [ref=e5376]:
            - columnheader "关键词" [ref=e5377]
            - columnheader "对应特性" [ref=e5378]
        - rowgroup [ref=e5379]:
          - row [ref=e5380]:
            - cell "\"要么全做，要么全不做\"" [ref=e5381]
            - cell [ref=e5382]:
              - strong [ref=e5383]: 原子性（Atomicity）
          - row [ref=e5384]:
            - cell "\"转账前后总金额不变\"" [ref=e5385]
            - cell [ref=e5386]:
              - strong [ref=e5387]: 一致性（Consistency）
          - row [ref=e5388]:
            - cell "\"并发操作互不干扰\"" [ref=e5389]
            - cell [ref=e5390]:
              - strong [ref=e5391]: 隔离性（Isolation）
          - row [ref=e5392]:
            - cell "\"提交后数据永不丢失\"" [ref=e5393]
            - cell [ref=e5394]:
              - strong [ref=e5395]: 持久性（Durability）
      - heading "真题 6：范式判断——综合题" [level=4] [ref=e5396]
      - paragraph [ref=e5397]: "关系模式 R(学号, 课程号, 成绩, 教师姓名, 教师职称)，函数依赖集为： F = { (学号,课程号)→成绩, (学号,课程号)→教师姓名, 课程号→教师姓名, 教师姓名→教师职称 }，候选码为 (学号, 课程号)。R 最高满足第几范式？"
      - paragraph [ref=e5398]: A. 1NF B. 2NF C. 3NF D. BCNF
      - blockquote [ref=e5399]:
        - paragraph [ref=e5400]:
          - strong [ref=e5401]: 解析
          - text: ：第一步：所有属性都是原子的，满足 1NF。第二步：检查非主属性是否完全函数依赖于候选码。(学号,课程号)→成绩 是完全依赖，但 课程号→教师姓名 说明教师姓名只依赖于候选码的一部分（课程号），存在
          - strong [ref=e5402]: 部分函数依赖
          - text: ，违反 2NF。所以最高满足 1NF。
          - strong [ref=e5403]: 答案：A。
      - paragraph [ref=e5404]:
        - strong [ref=e5405]: 关键判定
        - text: ：判断 2NF 时重点看有没有"单属性→非主属性"这种情况。如果候选码是复合的，且有一个非主属性只依赖于候选码的一部分，就违反 2NF。
      - heading "真题 7：范式判断——传递依赖" [level=4] [ref=e5406]
      - paragraph [ref=e5407]: "关系模式 R(学号, 姓名, 系号, 系主任)，F = { 学号→姓名, 学号→系号, 系号→系主任 }，候选码为 学号。R 最高满足第几范式？"
      - paragraph [ref=e5408]: A. 1NF B. 2NF C. 3NF D. BCNF
      - blockquote [ref=e5409]:
        - paragraph [ref=e5410]:
          - strong [ref=e5411]: 解析
          - text: ：第一步：满足 1NF。第二步：候选码是单属性，不存在部分依赖问题，自动满足 2NF。第三步：检查是否存在传递依赖。学号→系号→系主任，系主任通过系号传递依赖于学号，且系号和系主任都是非主属性，存在
          - strong [ref=e5412]: 传递函数依赖
          - text: ，违反 3NF。所以最高满足 2NF。
          - strong [ref=e5413]: 答案：B。
      - paragraph [ref=e5414]:
        - strong [ref=e5415]: 关键判定
        - text: ：单属性候选码自动满足 2NF。传递依赖的特征是"主键→非主属性A→非主属性B"这样的链条。
      - separator [ref=e5416]
      - heading "七、题型分布" [level=3] [ref=e5417]
      - blockquote [ref=e5418]:
        - paragraph [ref=e5419]: 基于近五年国网计算机类笔试数据库模块真题统计
      - table [ref=e5420]:
        - rowgroup [ref=e5421]:
          - row [ref=e5422]:
            - columnheader "题型" [ref=e5423]
            - columnheader "占比" [ref=e5424]
            - columnheader "题量（约）" [ref=e5425]
            - columnheader "典型考法" [ref=e5426]
        - rowgroup [ref=e5427]:
          - row [ref=e5428]:
            - cell [ref=e5429]:
              - strong [ref=e5430]: 单选题
            - cell "约 50%" [ref=e5431]
            - cell "6~10 题" [ref=e5432]
            - cell "SQL 执行顺序、事务隔离级别、范式判断、锁兼容性、ACID 定义、故障恢复策略" [ref=e5433]
          - row [ref=e5434]:
            - cell [ref=e5435]:
              - strong [ref=e5436]: 多选题
            - cell "约 25%" [ref=e5437]
            - cell "3~5 题" [ref=e5438]
            - cell "\"以下属于事务ACID特性的有\"、\"视图可更新的条件有哪些\"、\"关于B+树索引正确的有\"" [ref=e5439]
          - row [ref=e5440]:
            - cell [ref=e5441]:
              - strong [ref=e5442]: 判断题
            - cell "约 15%" [ref=e5443]
            - cell "2~4 题" [ref=e5444]
            - cell "\"索引一定能加速查询\"、\"视图是实际存储数据的表\"、\"GRANT 属于 DDL\"" [ref=e5445]
          - row [ref=e5446]:
            - cell [ref=e5447]:
              - strong [ref=e5448]: 大题/设计题
            - cell "约 10%" [ref=e5449]
            - cell "1~2 题" [ref=e5450]
            - cell "ER 图转关系模式、范式判断（给关系模式判断最高范式）、SQL 语句书写" [ref=e5451]
      - paragraph [ref=e5452]:
        - strong [ref=e5453]: 命题特点
        - text: ：
      - list [ref=e5454]:
        - listitem [ref=e5455]: 数据库在专业知识中约占 15%-20%
        - listitem [ref=e5456]:
          - strong [ref=e5457]: 事务 ACID 和隔离级别
          - text: 是数据库模块的"送分题"，每年必出，背熟就能拿分
        - listitem [ref=e5458]:
          - strong [ref=e5459]: 范式判断
          - text: 往往以"给一个关系模式和函数依赖集，判断最高满足第几范式"的形式出现
        - listitem [ref=e5460]: SQL 大题固定套路：GROUP BY + HAVING + ORDER BY 顺序、JOIN 条件、聚合函数位置
        - listitem [ref=e5461]: 多选题容易在"锁的兼容性"、"视图可更新条件"、"事务并发问题"上出题
        - listitem [ref=e5462]:
          - strong [ref=e5463]: 事务并发控制
          - text: 是最高频的知识点区，ACID、隔离级别、封锁、死锁四个子考点轮流出题
      - separator [ref=e5464]
      - paragraph [ref=e5465]:
        - strong [ref=e5466]: 最后叮咛
        - text: ：数据库模块的送分题集中在事务 ACID（背四个单词和含义）、隔离级别（记四个级别对应的防范能力）、范式判断（按三步法系统判断）。SQL 大题多练手写（重点是 JOIN + GROUP BY + HAVING 的组合）。范式判断多画函数依赖图，熟练了就是机械操作。ER 转关系模式记住口诀"1:1 随便加，1:N 加 N 端，M:N 单独建"。
      - separator [ref=e5467]
      - heading "八、SQL 选择题专项训练（3道）" [level=3] [ref=e5468]
      - heading "SQL-1：多表连接查询" [level=4] [ref=e5469]
      - paragraph [ref=e5470]:
        - strong [ref=e5471]: "[题目]"
        - text: 设有三个关系表：
      - list [ref=e5472]:
        - listitem [ref=e5473]: 学生表 S（学号 Sno, 姓名 Sname, 性别 Sex, 年龄 Age）
        - listitem [ref=e5474]: 课程表 C（课程号 Cno, 课程名 Cname, 学分 Credit）
        - listitem [ref=e5475]: 选课表 SC（学号 Sno, 课程号 Cno, 成绩 Grade）
      - paragraph [ref=e5476]: 查询"选修了全部课程的学生姓名"，下列 SQL 语句正确的是（ ）。
      - paragraph [ref=e5477]: A.
      - code [ref=e5479]: SELECT Sname FROM S WHERE Sno IN ( SELECT Sno FROM SC GROUP BY Sno HAVING COUNT(*) = (SELECT COUNT(*) FROM C) )
      - paragraph [ref=e5480]: B.
      - code [ref=e5482]: SELECT Sname FROM S WHERE Sno = ( SELECT Sno FROM SC GROUP BY Sno HAVING COUNT(*) = (SELECT COUNT(*) FROM C) )
      - paragraph [ref=e5483]: C.
      - code [ref=e5485]: SELECT Sname FROM S, SC WHERE S.Sno = SC.Sno GROUP BY Sname HAVING COUNT(*) = (SELECT COUNT(*) FROM C)
      - paragraph [ref=e5486]: D.
      - code [ref=e5488]: SELECT Sname FROM S WHERE Sno IN ( SELECT Sno FROM SC WHERE COUNT(*) = (SELECT COUNT(*) FROM C) GROUP BY Sno )
      - paragraph [ref=e5489]:
        - strong [ref=e5490]: "[答案]"
        - text: A
      - paragraph [ref=e5491]:
        - strong [ref=e5492]: "[解析]"
      - list [ref=e5493]:
        - listitem [ref=e5494]: 核心思路：先找出"选修课程数 = 总课程数"的学生学号，再查姓名。
        - listitem [ref=e5495]:
          - text: 选项 A 正确：子查询中按 Sno 分组，用
          - code [ref=e5496]: HAVING COUNT(*) = (子查询查总课程数)
          - text: 筛选出选了全部课程的学生，外层用 IN 匹配。
        - listitem [ref=e5497]:
          - text: 选项 B 错误：子查询可能返回多行，单用
          - code [ref=e5498]: =
          - text: 会报错，必须用
          - code [ref=e5499]: IN
          - text: 。
        - listitem [ref=e5500]:
          - text: 选项 C 错误：
          - code [ref=e5501]: GROUP BY Sname
          - text: 如果学生同名会导致计数错误，应按
          - code [ref=e5502]: Sno
          - text: 分组；且缺少对未选课学生的处理。
        - listitem [ref=e5503]:
          - text: 选项 D 错误：
          - code [ref=e5504]: WHERE
          - text: 子句中不能使用聚合函数
          - code [ref=e5505]: COUNT(*)
          - text: ，
          - code [ref=e5506]: HAVING
          - text: 专用于分组后过滤。
      - separator [ref=e5507]
      - heading "SQL-2：子查询" [level=4] [ref=e5508]
      - paragraph [ref=e5509]:
        - strong [ref=e5510]: "[题目]"
        - text: 在 S-SC-C 关系模式中，查询"没有选修'数据库'课程的学生姓名"，下列 SQL 正确的是（ ）。
      - paragraph [ref=e5511]: A.
      - code [ref=e5513]: SELECT Sname FROM S WHERE Sno NOT IN ( SELECT Sno FROM SC WHERE Cno = ( SELECT Cno FROM C WHERE Cname = '数据库' ) )
      - paragraph [ref=e5514]: B.
      - code [ref=e5516]: SELECT Sname FROM S WHERE Sno IN ( SELECT Sno FROM SC, C WHERE SC.Cno = C.Cno AND Cname != '数据库' )
      - paragraph [ref=e5517]: C.
      - code [ref=e5519]: SELECT Sname FROM S WHERE NOT EXISTS ( SELECT Sno FROM SC WHERE Cno = '数据库' )
      - paragraph [ref=e5520]: D.
      - code [ref=e5522]: SELECT Sname FROM S WHERE Sno NOT IN ( SELECT Sno FROM SC WHERE Cno IN ( SELECT Cno FROM C WHERE Cname = '数据库' ) ) OR Sno NOT IN (SELECT Sno FROM SC)
      - paragraph [ref=e5523]:
        - strong [ref=e5524]: "[答案]"
        - text: A
      - paragraph [ref=e5525]:
        - strong [ref=e5526]: "[解析]"
      - list [ref=e5527]:
        - listitem [ref=e5528]:
          - text: 选项 A 正确：双层嵌套子查询，内层先查到"数据库"课程的 Cno，中间层查出选了该课程的学生学号，外层用
          - code [ref=e5529]: NOT IN
          - text: 排除这些学生。
        - listitem [ref=e5530]:
          - text: 选项 B 错误：
          - code [ref=e5531]: Cname != '数据库'
          - text: 表示选了非数据库课程的学生也会被包括，没有排除"只选了数据库但没选其他课"的学生，逻辑有漏洞。
        - listitem [ref=e5532]:
          - text: 选项 C 错误：
          - code [ref=e5533]: NOT EXISTS
          - text: 子查询中
          - code [ref=e5534]: WHERE Cno = '数据库'
          - text: 缺少与外表 S 的关联条件（应为
          - code [ref=e5535]: WHERE SC.Sno = S.Sno AND ...
          - text: ），且 Cno 是编号不是名称。
        - listitem [ref=e5536]:
          - text: 选项 D 错误：存在逻辑冗余，
          - code [ref=e5537]: OR
          - text: 后面的条件已经是
          - code [ref=e5538]: NOT IN
          - text: 的超集，而且表述不够简洁。
      - separator [ref=e5539]
      - heading "SQL-3：GROUP BY + HAVING 聚合查询" [level=4] [ref=e5540]
      - paragraph [ref=e5541]:
        - strong [ref=e5542]: "[题目]"
        - text: 在 SC（学号, 课程号, 成绩）表中，查询"平均成绩大于 80 分且至少选修了 3 门课程的学生学号"，正确的 SQL 是（ ）。
      - paragraph [ref=e5543]: A.
      - code [ref=e5545]: SELECT Sno FROM SC WHERE AVG(Grade) > 80 AND COUNT(*) >= 3 GROUP BY Sno
      - paragraph [ref=e5546]: B.
      - code [ref=e5548]: SELECT Sno FROM SC GROUP BY Sno HAVING AVG(Grade) > 80 OR COUNT(*) >= 3
      - paragraph [ref=e5549]: C.
      - code [ref=e5551]: SELECT Sno FROM SC GROUP BY Sno HAVING AVG(Grade) > 80 AND COUNT(*) >= 3
      - paragraph [ref=e5552]: D.
      - code [ref=e5554]: SELECT Sno FROM SC GROUP BY Sno WHERE AVG(Grade) > 80 HAVING COUNT(*) >= 3
      - paragraph [ref=e5555]:
        - strong [ref=e5556]: "[答案]"
        - text: C
      - paragraph [ref=e5557]:
        - strong [ref=e5558]: "[解析]"
      - list [ref=e5559]:
        - listitem [ref=e5560]:
          - text: 选项 C 正确：
          - code [ref=e5561]: GROUP BY Sno
          - text: 按学号分组，
          - code [ref=e5562]: HAVING
          - text: 子句同时用
          - code [ref=e5563]: AND
          - text: 连接两个条件（平均成绩 > 80 且 选课数 >= 3），逻辑完全正确。
        - listitem [ref=e5564]:
          - text: 选项 A 错误：
          - code [ref=e5565]: WHERE
          - text: 子句中不能使用聚合函数（AVG、COUNT），聚合函数的过滤必须放在
          - code [ref=e5566]: HAVING
          - text: 中。
        - listitem [ref=e5567]:
          - text: 选项 B 错误：用了
          - code [ref=e5568]: OR
          - text: 而非
          - code [ref=e5569]: AND
          - text: ，题目要求两个条件同时满足。
        - listitem [ref=e5570]:
          - text: 选项 D 错误：语法错误，
          - code [ref=e5571]: WHERE
          - text: 必须出现在
          - code [ref=e5572]: GROUP BY
          - text: 之前，且
          - code [ref=e5573]: WHERE
          - text: 中不能使用聚合函数。
      - separator [ref=e5574]
      - heading "九、ER 图转关系模式选择题专项训练（2道）" [level=3] [ref=e5575]
      - heading "ER-1：1:1 和 1:N 联系转换" [level=4] [ref=e5576]
      - paragraph [ref=e5577]:
        - strong [ref=e5578]: "[题目]"
        - text: 某公司 ER 图中，实体"部门"和实体"经理"之间是 1:1 联系，实体"部门"和实体"员工"之间是 1:N 联系。以下关于关系模式转换的描述中，正确的是（ ）。
      - paragraph [ref=e5579]: A. 部门和经理合并为一个关系模式，部门与员工各自独立，并在员工关系中添加部门编号作为外键
      - paragraph [ref=e5580]: B. 部门、经理、员工各自独立，在经理关系中添加部门编号作为外键，在员工关系中添加部门编号作为外键
      - paragraph [ref=e5581]: C. 部门、经理、员工各自独立，在部门关系中添加经理编号作为外键，在员工关系中添加部门编号作为外键
      - paragraph [ref=e5582]: D. 将部门、经理、员工三实体合并为一个关系模式
      - paragraph [ref=e5583]:
        - strong [ref=e5584]: "[答案]"
        - text: C
      - paragraph [ref=e5585]:
        - strong [ref=e5586]: "[解析]"
      - list [ref=e5587]:
        - listitem [ref=e5588]:
          - text: 选项 C 正确，转换规则如下：
          - list [ref=e5589]:
            - listitem [ref=e5590]:
              - strong [ref=e5591]: 1:1 联系
              - text: ：可将任意一端的主键放到另一端作为外键。通常在"部门"中添加"经理编号"作为外键（一个部门只有一个经理，一个经理管一个部门），这样更自然。
            - listitem [ref=e5592]:
              - strong [ref=e5593]: 1:N 联系
              - text: ：将"1"端（部门）的主键放入"N"端（员工）作为外键。即在员工关系中添加"部门编号"。
        - listitem [ref=e5594]: 选项 A 错误：1:1 联系不一定合并，合并会导致数据冗余和更新异常，一般建议独立建表后加外键。
        - listitem [ref=e5595]: 选项 B 错误：在经理关系中加部门编号是 1:N 的做法（N 端放外键方向反了），1:1 联系应是部门端放经理外键。
        - listitem [ref=e5596]: 选项 D 错误：三实体功能完全不同，合并违反第三范式，会产生大量冗余。
      - separator [ref=e5597]
      - heading "ER-2：M:N 联系转换" [level=4] [ref=e5598]
      - paragraph [ref=e5599]:
        - strong [ref=e5600]: "[题目]"
        - text: 学生和课程之间是 M:N 联系（一个学生可选多门课，一门课可被多个学生选），该联系还有"成绩"属性。转换成关系模式时，正确的做法是（ ）。
      - paragraph [ref=e5601]: A. 将"成绩"属性添加到学生关系中，课程关系不变
      - paragraph [ref=e5602]: B. 将"成绩"属性添加到课程关系中，学生关系不变
      - paragraph [ref=e5603]: C. 新建一个"选课"关系模式，包含学生的主键、课程的主键以及成绩属性，主键由学生主键和课程主键共同组成
      - paragraph [ref=e5604]: D. 新建一个"选课"关系模式，包含学生的主键、课程的主键以及成绩属性，再单独添加一个"选课编号"作为主键
      - paragraph [ref=e5605]:
        - strong [ref=e5606]: "[答案]"
        - text: C
      - paragraph [ref=e5607]:
        - strong [ref=e5608]: "[解析]"
      - list [ref=e5609]:
        - listitem [ref=e5610]:
          - text: 选项 C 正确，M:N 联系的转换规则：
          - list [ref=e5611]:
            - listitem [ref=e5612]:
              - text: 必须
              - strong [ref=e5613]: 新建一个独立的关系模式
              - text: （即中间表）。
            - listitem [ref=e5614]:
              - text: 包含两端实体的主键作为外键，同时作为该关系模式的
              - strong [ref=e5615]: 联合主键
              - text: 。
            - listitem [ref=e5616]: 联系自带的属性（如"成绩"）也放入该关系模式中。
        - listitem [ref=e5617]: 选项 A、B 错误：M:N 联系不能将属性放到任意一端实体中，因为一个学生有多个成绩（对应多门课），一个课程有多个学生成绩，放到任一端都会产生冗余。
        - listitem [ref=e5618]: 选项 D 错误：虽然也创建了独立关系模式，但不应随意添加自增主键。联合主键（Sno, Cno）本身就是最自然的候选键，额外添加代理键违反了 ER 图转换的标准做法。
      - separator [ref=e5619]
      - heading "十、事务并发场景判断题专项训练（3道）" [level=3] [ref=e5620]
      - heading "并发-1：脏读" [level=4] [ref=e5621]
      - paragraph [ref=e5622]:
        - strong [ref=e5623]: "[题目]"
        - text: 设有两个事务 T1 和 T2 并发执行，操作流程如下：
      - list [ref=e5624]:
        - listitem [ref=e5625]: T1：读取账户 A 的余额为 1000 元
        - listitem [ref=e5626]: T2：将账户 A 的余额修改为 2000 元（尚未提交）
        - listitem [ref=e5627]: T1：再次读取账户 A 的余额，读到 2000 元
        - listitem [ref=e5628]: T2：因某种原因回滚（ROLLBACK），A 余额恢复为 1000 元
      - paragraph [ref=e5629]: 该并发场景出现的问题是（ ）。
      - paragraph [ref=e5630]: A. 丢失修改（Lost Update） B. 脏读（Dirty Read） C. 不可重复读（Non-repeatable Read） D. 幻读（Phantom Read）
      - paragraph [ref=e5631]:
        - strong [ref=e5632]: "[答案]"
        - text: B
      - paragraph [ref=e5633]:
        - strong [ref=e5634]: "[解析]"
      - list [ref=e5635]:
        - listitem [ref=e5636]:
          - text: 脏读的定义：一个事务（T1）读取了另一个事务（T2）
          - strong [ref=e5637]: 尚未提交的修改数据
          - text: ，而 T2 后来回滚，导致 T1 读到的数据是"脏"的（不存在的、无效的）。
        - listitem [ref=e5638]: 本题中 T1 读到了 T2 未提交的 2000 元，但 T2 回滚后实际余额是 1000 元，T1 读到了"脏数据"，典型脏读。
        - listitem [ref=e5639]: A（丢失修改）：两个事务先后修改同一数据，后提交的覆盖了先提交的修改。本题没有覆盖。
        - listitem [ref=e5640]:
          - text: C（不可重复读）：同一事务内两次读取同一数据，结果不同，是因为另一个事务
          - strong [ref=e5641]: 提交了
          - text: 修改。本题 T2 没提交。
        - listitem [ref=e5642]: D（幻读）：同一事务内两次查询，第二次多出或少了一些行（INSERT/DELETE），不是同一个数据的值变化。
      - separator [ref=e5643]
      - heading "并发-2：不可重复读" [level=4] [ref=e5644]
      - paragraph [ref=e5645]:
        - strong [ref=e5646]: "[题目]"
        - text: T1 和 T2 并发执行，操作流程如下：
      - list [ref=e5647]:
        - listitem [ref=e5648]: T1：读取账户 A 的余额为 1000 元
        - listitem [ref=e5649]:
          - text: T2：将账户 A 的余额修改为 2000 元，并
          - strong [ref=e5650]: 提交（COMMIT）
        - listitem [ref=e5651]: T1：再次读取账户 A 的余额，读到 2000 元
      - paragraph [ref=e5652]: 该并发场景出现的问题是（ ）。
      - paragraph [ref=e5653]: A. 脏读 B. 丢失修改 C. 不可重复读 D. 幻读
      - paragraph [ref=e5654]:
        - strong [ref=e5655]: "[答案]"
        - text: C
      - paragraph [ref=e5656]:
        - strong [ref=e5657]: "[解析]"
      - list [ref=e5658]:
        - listitem [ref=e5659]:
          - text: 不可重复读的定义：同一事务（T1）内两次读取同一数据行，
          - strong [ref=e5660]: 结果不同
          - text: ，原因是另一个事务（T2）在两次读取之间
          - strong [ref=e5661]: 修改并提交了
          - text: 该数据。
        - listitem [ref=e5662]:
          - text: 与脏读的区别：脏读读的是未提交数据，不可重复读读的是
          - strong [ref=e5663]: 已提交
          - text: 数据——两次读到的是两次不同的已提交值。
        - listitem [ref=e5664]: 本题 T2 修改并提交后，T1 再次读取得到不同值，典型不可重复读。
        - listitem [ref=e5665]:
          - text: 不可重复读的解决办法：将隔离级别提升到
          - strong [ref=e5666]: Repeatable Read
          - text: （可重复读），MySQL 默认就是这个级别。
      - separator [ref=e5667]
      - heading "并发-3：丢失修改" [level=4] [ref=e5668]
      - paragraph [ref=e5669]:
        - strong [ref=e5670]: "[题目]"
        - text: T1 和 T2 并发执行，操作流程如下：
      - list [ref=e5671]:
        - listitem [ref=e5672]: T1：读取账户 A 的余额为 1000 元
        - listitem [ref=e5673]: T2：读取账户 A 的余额为 1000 元
        - listitem [ref=e5674]: T1：将余额减去 100 元，写入 900 元
        - listitem [ref=e5675]: T2：将余额加上 200 元，写入 1200 元
        - listitem [ref=e5676]: 最终余额为 1200 元，T1 的扣款操作被覆盖消失
      - paragraph [ref=e5677]: 该并发场景出现的问题是（ ）。
      - paragraph [ref=e5678]: A. 脏读 B. 丢失修改（Lost Update） C. 不可重复读 D. 幻读
      - paragraph [ref=e5679]:
        - strong [ref=e5680]: "[答案]"
        - text: B
      - paragraph [ref=e5681]:
        - strong [ref=e5682]: "[解析]"
      - list [ref=e5683]:
        - listitem [ref=e5684]:
          - text: 丢失修改的定义：两个事务先后读取同一数据并进行修改，
          - strong [ref=e5685]: 后提交的事务覆盖了先提交事务的修改
          - text: ，导致先提交的修改丢失。
        - listitem [ref=e5686]: 本题中 T1 的 -100 操作（结果是 900）被 T2 的 +200 操作（结果是 1200）覆盖，T1 的修改完全丢失，典型丢失修改。
        - listitem [ref=e5687]:
          - text: 丢失修改的解决办法：
          - list [ref=e5688]:
            - listitem [ref=e5689]:
              - text: 使用
              - strong [ref=e5690]: 排他锁（X锁）
              - text: ：T1 读取时加锁，T2 必须等 T1 提交后才能读取。
            - listitem [ref=e5691]:
              - text: 使用
              - strong [ref=e5692]: 乐观锁
              - text: ：加版本号字段，更新时检查版本号是否被修改。
        - listitem [ref=e5693]:
          - text: 注意：丢失修改是
          - strong [ref=e5694]: 写-写冲突
          - text: ，与脏读、不可重复读、幻读（都是读-写冲突）本质不同。
      - separator [ref=e5695]
      - heading "十一、范式判断选择题专项训练（2道）" [level=3] [ref=e5696]
      - heading "范式-1" [level=4] [ref=e5697]
      - paragraph [ref=e5698]:
        - strong [ref=e5699]: "[题目]"
        - text: "设有关系模式 R（A, B, C, D），其函数依赖集 F = {A→B, B→C, A→D}，且 A 是主键。该关系模式最高属于（ ）。"
      - paragraph [ref=e5700]: A. 1NF B. 2NF C. 3NF D. BCNF
      - paragraph [ref=e5701]:
        - strong [ref=e5702]: "[答案]"
        - text: B
      - paragraph [ref=e5703]:
        - strong [ref=e5704]: "[解析]"
      - list [ref=e5705]:
        - listitem [ref=e5706]:
          - text: 判断步骤：
          - list [ref=e5707]:
            - listitem [ref=e5708]:
              - strong [ref=e5709]: 1NF
              - text: ：所有属性都是原子值（不可再分），满足。基本都满足。
            - listitem [ref=e5710]:
              - strong [ref=e5711]: 2NF
              - text: ：检查是否存在
              - strong [ref=e5712]: 非主属性对主键的部分函数依赖
              - text: 。主键是单属性 A，不存在部分依赖（部分依赖只在主键是组合键时才可能出现），所以满足 2NF。
            - listitem [ref=e5713]:
              - strong [ref=e5714]: 3NF
              - text: ：检查是否存在
              - strong [ref=e5715]: 非主属性对主键的传递函数依赖
              - text: 。
              - list [ref=e5716]:
                - listitem [ref=e5717]: 已知 A→B, B→C，且 B 不是主键（主键是 A），C 是非主属性。
                - listitem [ref=e5718]: 存在 A→B→C 的传递链，即 C 传递依赖于主键 A。
                - listitem [ref=e5719]:
                  - text: 违反了 3NF 定义，所以
                  - strong [ref=e5720]: 最高是 2NF
                  - text: 。
        - listitem [ref=e5721]: 选项 C（3NF）错误：存在传递依赖。
        - listitem [ref=e5722]: 选项 D（BCNF）错误：BCNF 要求每个决定因素都包含候选键，B→C 中 B 不是候选键，不满足。
        - listitem [ref=e5723]: 分解方法：将 R 分解为 R1(A, B, D) 和 R2(B, C)，可达到 3NF 甚至 BCNF。
      - separator [ref=e5724]
      - heading "范式-2" [level=4] [ref=e5725]
      - paragraph [ref=e5726]:
        - strong [ref=e5727]: "[题目]"
        - text: "设有关系模式 R（学号, 课程号, 成绩, 教师名），函数依赖集 F = {（学号, 课程号）→成绩, 课程号→教师名}，主键为（学号, 课程号）。该关系模式最高属于（ ）。"
      - paragraph [ref=e5728]: A. 1NF B. 2NF C. 3NF D. BCNF
      - paragraph [ref=e5729]:
        - strong [ref=e5730]: "[答案]"
        - text: A
      - paragraph [ref=e5731]:
        - strong [ref=e5732]: "[解析]"
      - list [ref=e5733]:
        - listitem [ref=e5734]:
          - text: 判断步骤：
          - list [ref=e5735]:
            - listitem [ref=e5736]:
              - strong [ref=e5737]: 1NF
              - text: ：所有属性都是原子值，满足。
            - listitem [ref=e5738]:
              - strong [ref=e5739]: 2NF
              - text: ：检查是否存在
              - strong [ref=e5740]: 非主属性对主键的部分函数依赖
              - text: 。
              - list [ref=e5741]:
                - listitem [ref=e5742]: 主键是（学号, 课程号），是组合键。
                - listitem [ref=e5743]: 非主属性有：成绩、教师名。
                - listitem [ref=e5744]: 存在 课程号→教师名，即教师名只依赖于主键的一部分（课程号），不需要学号参与。
                - listitem [ref=e5745]:
                  - text: 这是典型的
                  - strong [ref=e5746]: 部分函数依赖
                  - text: ，违反了 2NF。
                - listitem [ref=e5747]:
                  - text: 所以
                  - strong [ref=e5748]: 最高只是 1NF
                  - text: 。
        - listitem [ref=e5749]: 部分依赖的危害：数据冗余（同一门课每选一次就要重复存教师名）、更新异常（换老师要改很多行）、插入异常（新课没学生选时无法插入教师名）、删除异常（删除最后选课学生时教师信息丢失）。
        - listitem [ref=e5750]: 分解方法：拆分为 R1（学号, 课程号, 成绩）和 R2（课程号, 教师名），消除部分依赖，达到 3NF / BCNF。
      - separator [ref=e5751]
      - heading "十二、数据库设计阶段顺序判断题" [level=3] [ref=e5752]
      - paragraph [ref=e5753]:
        - strong [ref=e5754]: "[题目]"
        - text: 数据库设计的正确步骤顺序是（ ）。
      - paragraph [ref=e5755]: A. 需求分析 → 概念结构设计 → 逻辑结构设计 → 物理结构设计 → 数据库实施 → 数据库运行和维护
      - paragraph [ref=e5756]: B. 需求分析 → 逻辑结构设计 → 概念结构设计 → 物理结构设计 → 数据库实施 → 数据库运行和维护
      - paragraph [ref=e5757]: C. 概念结构设计 → 需求分析 → 逻辑结构设计 → 物理结构设计 → 数据库实施 → 数据库运行和维护
      - paragraph [ref=e5758]: D. 需求分析 → 概念结构设计 → 物理结构设计 → 逻辑结构设计 → 数据库实施 → 数据库运行和维护
      - paragraph [ref=e5759]:
        - strong [ref=e5760]: "[答案]"
        - text: A
      - paragraph [ref=e5761]:
        - strong [ref=e5762]: "[解析]"
      - list [ref=e5763]:
        - listitem [ref=e5764]:
          - paragraph [ref=e5765]: 数据库设计六阶段（标准流程）：
          - list [ref=e5766]:
            - listitem [ref=e5767]:
              - strong [ref=e5768]: 需求分析
              - text: ：弄清用户要什么数据、什么功能，产出数据字典、数据流图。
            - listitem [ref=e5769]:
              - strong [ref=e5770]: 概念结构设计
              - text: ：将需求抽象为概念模型，典型工具是
              - strong [ref=e5771]: ER 图
              - text: （实体-联系图），与具体 DBMS 无关。
            - listitem [ref=e5772]:
              - strong [ref=e5773]: 逻辑结构设计
              - text: ：将 ER 图转换为具体 DBMS 支持的关系模式（表结构），进行
              - strong [ref=e5774]: 规范化
              - text: 处理（消除冗余、达到 3NF 等）。
            - listitem [ref=e5775]:
              - strong [ref=e5776]: 物理结构设计
              - text: ：为关系模式选择存储结构、存取方法（如索引、聚簇等），与具体 DBMS 和硬件相关。
            - listitem [ref=e5777]:
              - strong [ref=e5778]: 数据库实施
              - text: ：建表、写代码、录入数据、调试。
