            - cell [ref=e3379]:
              - strong [ref=e3380]: Record Lock
              - text: （记录锁）
            - cell "锁定索引中的某一条记录" [ref=e3381]
            - cell "防止该行被修改（不可重复读）" [ref=e3382]
          - row [ref=e3383]:
            - cell [ref=e3384]:
              - strong [ref=e3385]: Gap Lock
              - text: （间隙锁）
            - cell "锁定记录之间的\"间隙\"" [ref=e3386]
            - cell "防止在该间隙插入新数据（幻读）" [ref=e3387]
          - row [ref=e3388]:
            - cell [ref=e3389]:
              - strong [ref=e3390]: Next-Key Lock
              - text: （临键锁）
            - cell "Record Lock + Gap Lock" [ref=e3391]
            - cell "同时防止不可重复读和幻读" [ref=e3392]
      - paragraph [ref=e3393]:
        - strong [ref=e3394]: Next-Key Lock 范围
        - text: ：(上一个记录, 当前记录]，左开右闭。
      - heading "各隔离级别下的事务行为演示" [level=4] [ref=e3395]
