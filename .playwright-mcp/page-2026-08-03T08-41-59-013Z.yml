          - text: （全表扫描可能更快）
      - separator [ref=e2668]
      - heading "12.6 例题（5道选择题）" [level=3] [ref=e2669]
      - blockquote [ref=e2670]:
        - paragraph [ref=e2671]:
          - strong [ref=e2672]: 例题 1
          - text: ：SQL 的 SELECT 语句中，下列子句的执行顺序正确的是 ______。 A. SELECT → FROM → WHERE → GROUP BY → HAVING B. FROM → WHERE → GROUP BY → HAVING → SELECT C. FROM → GROUP BY → WHERE → HAVING → SELECT D. WHERE → FROM → GROUP BY → SELECT → HAVING
        - paragraph [ref=e2673]:
          - strong [ref=e2674]: 答案
          - text: ：B。执行顺序为 FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY。
      - blockquote [ref=e2675]:
        - paragraph [ref=e2676]:
          - strong [ref=e2677]: 例题 2
          - text: ：在 SQL 中，要查询"没有选任何课程的学生"，应使用 ______。 A.
          - code [ref=e2678]: SELECT * FROM 学生 WHERE 学号 NOT IN (SELECT 学号 FROM 选课)
          - text: B.
          - code [ref=e2679]: SELECT * FROM 学生 WHERE 学号 IN (SELECT 学号 FROM 选课)
          - text: C.
          - code [ref=e2680]: SELECT * FROM 学生 LEFT JOIN 选课 ON 学生.学号 = 选课.学号
          - text: D.
          - code [ref=e2681]: SELECT * FROM 学生 WHERE EXISTS (SELECT * FROM 选课 WHERE 选课.学号 = 学生.学号)
        - paragraph [ref=e2682]:
          - strong [ref=e2683]: 答案
          - text: ：A。NOT IN 找出不在选课表中的学生。注意如果选课表的学号列有 NULL，NOT IN 可能返回空，此时需要用 NOT EXISTS。
      - blockquote [ref=e2684]:
        - paragraph [ref=e2685]:
          - strong [ref=e2686]: 例题 3
          - text: ：关于视图，下列说法
          - strong [ref=e2687]: 错误
          - text: 的是 ______。 A. 视图是一个虚拟表，不存储实际数据 B. 视图可以简化复杂的查询操作 C. 包含 GROUP BY 的视图也可以进行更新操作 D. 视图是数据库三级模式中外模式的实现方式之一
        - paragraph [ref=e2688]:
          - strong [ref=e2689]: 答案
          - text: ：C。包含 GROUP BY、聚合函数、DISTINCT 等操作的视图是不可更新的。
      - blockquote [ref=e2690]:
        - paragraph [ref=e2691]:
          - strong [ref=e2692]: 例题 4
          - text: ：SQL 中，UNION 和 UNION ALL 的区别是 ______。 A. UNION 不去重，UNION ALL 去重 B. UNION 去重，UNION ALL 不去重 C. UNION 要求列名相同，UNION ALL 不要求 D. 没有区别
        - paragraph [ref=e2693]:
          - strong [ref=e2694]: 答案
          - text: ：B。UNION 自动消除重复行，UNION ALL 保留所有行（包括重复行），UNION ALL 效率更高。
      - blockquote [ref=e2695]:
        - paragraph [ref=e2696]:
          - strong [ref=e2697]: 例题 5
          - text: ：以下子查询中，属于相关子查询的是 ______。 A.
          - code [ref=e2698]: SELECT * FROM S WHERE age > (SELECT AVG(age) FROM S)
          - text: B.
          - code [ref=e2699]: SELECT * FROM S WHERE id IN (SELECT sid FROM SC WHERE score > 80)
          - text: C.
          - code [ref=e2700]: SELECT * FROM S WHERE EXISTS (SELECT * FROM SC WHERE SC.sid = S.id)
          - text: D.
          - code [ref=e2701]: SELECT * FROM S WHERE age = (SELECT MAX(age) FROM S)
        - paragraph [ref=e2702]:
          - strong [ref=e2703]: 答案
          - text: ：C。只有 C 中的子查询引用了外层 S.id，属于相关子查询。A、B、D 的子查询都可以独立执行。
      - heading "12.7 易错陷阱" [level=3] [ref=e2704]
      - table [ref=e2705]:
        - rowgroup [ref=e2706]:
          - row [ref=e2707]:
            - columnheader "陷阱" [ref=e2708]
            - columnheader "错误认知" [ref=e2709]
            - columnheader "正确认知" [ref=e2710]
        - rowgroup [ref=e2711]:
          - row [ref=e2712]:
            - cell "SELECT 执行顺序" [ref=e2713]
            - cell "\"SELECT 先执行，所以 WHERE 可以用别名\"" [ref=e2714]
            - cell "SELECT 在第5步执行，WHERE 在第2步执行，WHERE 中不能用 SELECT 定义的别名" [ref=e2715]
          - row [ref=e2716]:
            - cell "WHERE vs HAVING" [ref=e2717]
            - cell "\"WHERE count > 3\"" [ref=e2718]
            - cell "WHERE 不能跟聚合函数！聚合函数的过滤必须用 HAVING" [ref=e2719]
          - row [ref=e2720]:
            - cell "NOT IN + NULL" [ref=e2721]
            - cell "\"NOT IN 总是返回正确结果\"" [ref=e2722]
            - cell "子查询结果中含有 NULL 时，NOT IN 返回空集（NULL 比较结果是 UNKNOWN）" [ref=e2723]
          - row [ref=e2724]:
            - cell "相关子查询判断" [ref=e2725]
            - cell "\"子查询中引用了外层的表就是相关子查询\"" [ref=e2726]
            - cell "正确！关联子查询的特征是内层子查询中使用了外层表的列" [ref=e2727]
          - row [ref=e2728]:
            - cell "视图可更新" [ref=e2729]
            - cell "\"所有视图都能像表一样增删改\"" [ref=e2730]
            - cell "只有行列子集视图（单表、无聚合、无 GROUP BY）可以更新" [ref=e2731]
          - row [ref=e2732]:
            - cell "UNION vs UNION ALL" [ref=e2733]
            - cell "\"用哪个都一样\"" [ref=e2734]
            - cell "UNION 去重（额外排序开销大），UNION ALL 不去重（更快）。大多数场景用 UNION ALL 更高效" [ref=e2735]
          - row [ref=e2736]:
            - cell "交叉连接" [ref=e2737]
            - cell "\"INNER JOIN 不加 ON 报错\"" [ref=e2738]
            - cell "标准 SQL 中 INNER JOIN 必须带 ON，漏写是语法错误；MySQL 是例外允许省略" [ref=e2739]
          - row [ref=e2740]:
            - cell "DDL vs DML vs DCL" [ref=e2741]
            - cell "\"GRANT 属于 DDL\"" [ref=e2742]
            - cell "GRANT/REVOKE 属于 DCL（数据控制语言），CREATE/ALTER/DROP 才是 DDL" [ref=e2743]
      - heading "12.8 记忆口诀" [level=3] [ref=e2744]
      - code [ref=e2746]: SQL 执行有顺序： 一 FROM 来二 WHERE 选 三 GROUP BY 来分组 四 HAVING 把组筛 五 SELECT 定显示 六 ORDER BY 排好队 七 LIMIT 取前几 SQL 类别： DDL 管建表（CREATE/ALTER/DROP） DML 管数据（INSERT/UPDATE/DELETE） DQL 只查（SELECT） DCL 管权限（GRANT/REVOKE） 连接五种记心间： 交叉笛积全组合 内连只留匹配对 左外全留左、右填 NULL 右外全留右、左填 NULL 全外两边都保留 子查询分两种： 非相关独立先执行（IN） 相关关联每行跑（EXISTS）
      - heading "12.9 自测题" [level=3] [ref=e2747]
      - list [ref=e2748]:
        - listitem [ref=e2749]:
          - code [ref=e2750]: SELECT
