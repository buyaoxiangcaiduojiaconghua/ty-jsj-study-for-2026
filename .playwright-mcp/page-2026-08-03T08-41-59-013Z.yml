            - cell "✅" [ref=e2403]
            - cell "使用最左列 a" [ref=e2404]
          - row [ref=e2405]:
            - cell [ref=e2406]:
              - code [ref=e2407]: WHERE a = 1 AND b = 2
            - cell "✅" [ref=e2408]
            - cell "使用 (a, b)" [ref=e2409]
          - row [ref=e2410]:
            - cell [ref=e2411]:
              - code [ref=e2412]: WHERE a = 1 AND b = 2 AND c = 3
            - cell "✅" [ref=e2413]
            - cell "使用完整索引 (a, b, c)" [ref=e2414]
          - row [ref=e2415]:
            - cell [ref=e2416]:
              - code [ref=e2417]: WHERE a = 1 AND c = 3
            - cell "✅（部分）" [ref=e2418]
            - cell "只用到 a 列（b 被跳过，c 用不上）" [ref=e2419]
          - row [ref=e2420]:
            - cell [ref=e2421]:
              - code [ref=e2422]: WHERE b = 2
            - cell "❌" [ref=e2423]
            - cell "没从最左列 a 开始" [ref=e2424]
          - row [ref=e2425]:
