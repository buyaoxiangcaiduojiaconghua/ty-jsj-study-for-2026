      - heading "设置隔离级别的 SQL" [level=4] [ref=e3432]
      - code [ref=e3434]: "-- 查看当前隔离级别 SELECT @@transaction_isolation; -- MySQL 8.0+ SELECT @@tx_isolation; -- MySQL 5.x -- 设置隔离级别 SET SESSION TRANSACTION ISOLATION LEVEL READ COMMITTED; SET SESSION TRANSACTION ISOLATION LEVEL REPEATABLE READ; SET SESSION TRANSACTION ISOLATION LEVEL SERIALIZABLE;"
      - heading "13.5 MVCC（多版本并发控制）⭐⭐" [level=3] [ref=e3435]
      - paragraph [ref=e3436]: MVCC（Multi-Version Concurrency Control，多版本并发控制）是现代数据库（如 MySQL InnoDB、PostgreSQL）实现高并发读写的核心技术。
      - heading "MVCC 的核心思想" [level=4] [ref=e3437]
      - paragraph [ref=e3438]:
        - strong [ref=e3439]: 大白话
        - text: ：不通过"加锁"来控制并发，而是给每条数据保留多个"历史版本"。每个事务读取时，读到的是
        - strong [ref=e3440]: 数据的一个快照版本
        - text: ，而不是最新版本。这样读操作不会阻塞写操作，写操作也不会阻塞读操作。
      - paragraph [ref=e3441]:
        - strong [ref=e3442]: 类比
        - text: ：像 Git 的版本控制——每次修改都会创建新版本，你可以随时切换到某个历史版本查看，别人继续修改也不影响你看到的版本。
      - heading "MVCC 的实现机制" [level=4] [ref=e3443]
      - paragraph [ref=e3444]: 每条数据记录有两个隐藏列：
      - table [ref=e3445]:
        - rowgroup [ref=e3446]:
          - row [ref=e3447]:
            - columnheader "隐藏列" [ref=e3448]
            - columnheader "名称" [ref=e3449]
            - columnheader "含义" [ref=e3450]
            - columnheader "大小" [ref=e3451]
        - rowgroup [ref=e3452]:
          - row [ref=e3453]:
            - cell [ref=e3454]:
              - strong [ref=e3455]: trx_id
            - cell "事务 ID" [ref=e3456]
            - cell "最近修改这条记录的事务 ID" [ref=e3457]
            - cell "6 字节" [ref=e3458]
          - row [ref=e3459]:
            - cell [ref=e3460]:
              - strong [ref=e3461]: roll_pointer
            - cell "回滚指针" [ref=e3462]
            - cell "指向这条记录的上一个版本（Undo Log 中）" [ref=e3463]
            - cell "7 字节" [ref=e3464]
      - heading "ReadView（读视图/快照）⭐" [level=4] [ref=e3465]
      - paragraph [ref=e3466]:
        - text: 每个事务在执行快照读时会生成一个
        - strong [ref=e3467]: ReadView
        - text: ，包含三个关键信息：
      - table [ref=e3468]:
        - rowgroup [ref=e3469]:
          - row [ref=e3470]:
            - columnheader "字段" [ref=e3471]
            - columnheader "含义" [ref=e3472]
        - rowgroup [ref=e3473]:
          - row [ref=e3474]:
            - cell [ref=e3475]:
              - strong [ref=e3476]: m_ids
            - cell "生成 ReadView 时，当前活跃的（未提交的）事务 ID 列表" [ref=e3477]
          - row [ref=e3478]:
            - cell [ref=e3479]:
              - strong [ref=e3480]: min_trx_id
            - cell "m_ids 中的最小值" [ref=e3481]
          - row [ref=e3482]:
            - cell [ref=e3483]:
              - strong [ref=e3484]: max_trx_id
            - cell "当前系统已分配的最大事务 ID + 1" [ref=e3485]
          - row [ref=e3486]:
            - cell [ref=e3487]:
              - strong [ref=e3488]: creator_trx_id
            - cell "生成这个 ReadView 的事务自己的 ID" [ref=e3489]
      - heading "可见性判断规则" [level=4] [ref=e3490]
      - paragraph [ref=e3491]: 对于一条数据的某个版本（trx_id = data_trx_id），当前事务能否看到：
      - table [ref=e3492]:
        - rowgroup [ref=e3493]:
          - row [ref=e3494]:
            - columnheader "条件" [ref=e3495]
            - columnheader "能/不能看到" [ref=e3496]
            - columnheader "原因" [ref=e3497]
        - rowgroup [ref=e3498]:
          - row [ref=e3499]:
            - cell [ref=e3500]:
              - code [ref=e3501]: data_trx_id == creator_trx_id
            - cell "✅ 能看到" [ref=e3502]
            - cell "自己修改的当然能看" [ref=e3503]
          - row [ref=e3504]:
            - cell [ref=e3505]:
              - code [ref=e3506]: data_trx_id < min_trx_id
            - cell "✅ 能看到" [ref=e3507]
            - cell "修改这条数据的事务在 ReadView 创建前就提交了" [ref=e3508]
          - row [ref=e3509]:
            - cell [ref=e3510]:
              - code [ref=e3511]: data_trx_id >= max_trx_id
            - cell "❌ 不能看" [ref=e3512]
            - cell "修改这条数据的事务在 ReadView 创建后才开始" [ref=e3513]
          - row [ref=e3514]:
            - cell [ref=e3515]:
              - code [ref=e3516]: min_trx_id <= data_trx_id < max_trx_id
              - text: 且该事务在 m_ids 中
            - cell "❌ 不能看" [ref=e3517]
            - cell "修改这条数据的事务在 ReadView 创建时还未提交" [ref=e3518]
          - row [ref=e3519]:
            - cell [ref=e3520]:
              - code [ref=e3521]: min_trx_id <= data_trx_id < max_trx_id
              - text: 且该事务不在 m_ids 中
            - cell "✅ 能看到" [ref=e3522]
            - cell "修改这条数据的事务在 ReadView 创建时已经提交了" [ref=e3523]
      - paragraph [ref=e3524]:
        - strong [ref=e3525]: 如果当前版本不可见，就沿着 roll_pointer 找到上一个版本，继续判断，直到找到可见版本。
      - heading "READ COMMITTED vs REPEATABLE READ 在 MVCC 中的区别" [level=4] [ref=e3526]
      - table [ref=e3527]:
        - rowgroup [ref=e3528]:
          - row [ref=e3529]:
            - columnheader "对比" [ref=e3530]
            - columnheader "READ COMMITTED（读已提交）" [ref=e3531]
            - columnheader "REPEATABLE READ（可重复读）" [ref=e3532]
        - rowgroup [ref=e3533]:
          - row [ref=e3534]:
            - cell [ref=e3535]:
              - strong [ref=e3536]: ReadView 生成时机
            - cell [ref=e3537]:
              - text: 每次 SELECT 都生成一个
              - strong [ref=e3538]: 新的
              - text: ReadView
            - cell [ref=e3539]:
              - text: 只在
              - strong [ref=e3540]: 第一次 SELECT
              - text: 时生成 ReadView，后续复用同一个
          - row [ref=e3541]:
            - cell [ref=e3542]:
              - strong [ref=e3543]: 效果
            - cell "每次读都能看到最新已提交的数据" [ref=e3544]
            - cell "整个事务期间看到的都是同一个快照" [ref=e3545]
          - row [ref=e3546]:
            - cell [ref=e3547]:
              - strong [ref=e3548]: 能否防止不可重复读
            - cell "不能 ❌" [ref=e3549]
            - cell "能 ✅" [ref=e3550]
      - paragraph [ref=e3551]:
        - strong [ref=e3552]: 这解释了为什么 REPEATABLE READ 能防止不可重复读
        - text: ：ReadView 只生成一次，后续再用同一个视图去判断可见性，所以读到的数据始终一致。
      - heading "MVCC 的三大优势（vs 纯锁机制）" [level=4] [ref=e3553]
      - table [ref=e3554]:
        - rowgroup [ref=e3555]:
          - row [ref=e3556]:
            - columnheader "优势" [ref=e3557]
            - columnheader "说明" [ref=e3558]
        - rowgroup [ref=e3559]:
          - row [ref=e3560]:
            - cell [ref=e3561]:
              - strong [ref=e3562]: 读写不互斥
            - cell "读操作（快照读）不加锁，不阻塞写操作" [ref=e3563]
          - row [ref=e3564]:
            - cell [ref=e3565]:
              - strong [ref=e3566]: 高并发性能
            - cell "多个事务可以同时读取数据的不同版本" [ref=e3567]
          - row [ref=e3568]:
            - cell [ref=e3569]:
              - strong [ref=e3570]: 一致性和性能兼得
            - cell "在保证一致性的前提下，避免了大量加锁开销" [ref=e3571]
      - heading "13.6 死锁（Deadlock）⭐⭐" [level=3] [ref=e3572]
      - heading "死锁的概念" [level=4] [ref=e3573]
      - paragraph [ref=e3574]: 两个或多个事务互相等待对方释放锁，形成循环等待，导致所有事务都无法继续执行。
      - paragraph [ref=e3575]:
        - strong [ref=e3576]: 死锁例子
        - text: ：
      - table [ref=e3577]:
        - rowgroup [ref=e3578]:
          - row [ref=e3579]:
            - columnheader "时间" [ref=e3580]
            - columnheader "事务 T1" [ref=e3581]
            - columnheader "事务 T2" [ref=e3582]
        - rowgroup [ref=e3583]:
          - row [ref=e3584]:
            - cell "t1" [ref=e3585]
            - cell "给 A 加 X 锁 ✅" [ref=e3586]
            - cell [ref=e3587]
          - row [ref=e3588]:
            - cell "t2" [ref=e3589]
            - cell [ref=e3590]
            - cell "给 B 加 X 锁 ✅" [ref=e3591]
          - row [ref=e3592]:
            - cell "t3" [ref=e3593]
            - cell [ref=e3594]:
              - text: 请求给 B 加 X 锁 →
              - strong [ref=e3595]: 等待 T2 释放
            - cell [ref=e3596]
          - row [ref=e3597]:
            - cell "t4" [ref=e3598]
            - cell [ref=e3599]
            - cell [ref=e3600]:
              - text: 请求给 A 加 X 锁 →
              - strong [ref=e3601]: 等待 T1 释放
          - row [ref=e3602]:
            - cell "结果" [ref=e3603]
            - cell "T1 等 T2 放 B，T2 等 T1 放 A → 死锁！" [ref=e3604]
            - cell [ref=e3605]
      - heading "死锁的四个必要条件" [level=4] [ref=e3606]
      - table [ref=e3607]:
        - rowgroup [ref=e3608]:
          - row [ref=e3609]:
            - columnheader "条件" [ref=e3610]
            - columnheader "说明" [ref=e3611]
            - columnheader "在数据库中的体现" [ref=e3612]
        - rowgroup [ref=e3613]:
          - row [ref=e3614]:
            - cell [ref=e3615]:
              - strong [ref=e3616]: 互斥条件
            - cell "资源不能共享，一时刻只能一个事务使用" [ref=e3617]
            - cell "X 锁的排他性" [ref=e3618]
          - row [ref=e3619]:
            - cell [ref=e3620]:
              - strong [ref=e3621]: 请求保持条件
            - cell "已持有资源，又申请新资源，被拒绝后不释放已有资源" [ref=e3622]
            - cell "T1 持有 A 的锁，又申请 B 的锁" [ref=e3623]
          - row [ref=e3624]:
            - cell [ref=e3625]:
              - strong [ref=e3626]: 不可抢占条件
            - cell "不能强行夺走别人持有的资源" [ref=e3627]
            - cell "不能强行释放别人的锁" [ref=e3628]
          - row [ref=e3629]:
            - cell [ref=e3630]:
              - strong [ref=e3631]: 循环等待条件
            - cell "事务之间形成资源等待的环" [ref=e3632]
            - cell "T1 等 T2，T2 等 T1" [ref=e3633]
      - heading "死锁的预防（Prevention）" [level=4] [ref=e3634]
      - paragraph [ref=e3635]: 死锁预防的本质是"破坏四个必要条件之一"：
      - table [ref=e3636]:
        - rowgroup [ref=e3637]:
          - row [ref=e3638]:
            - columnheader "方法" [ref=e3639]
            - columnheader "原理" [ref=e3640]
            - columnheader "破坏哪个条件" [ref=e3641]
            - columnheader "优缺点" [ref=e3642]
        - rowgroup [ref=e3643]:
          - row [ref=e3644]:
            - cell [ref=e3645]:
              - strong [ref=e3646]: 一次封锁法
            - cell "事务开始时一次性申请所有需要的锁" [ref=e3647]
            - cell "破坏\"请求保持\"" [ref=e3648]
            - cell "优点：简单，无死锁；缺点：锁持有时间长，并发度低" [ref=e3649]
          - row [ref=e3650]:
            - cell [ref=e3651]:
              - strong [ref=e3652]: 顺序封锁法
            - cell "所有事务按预先规定的固定顺序申请锁" [ref=e3653]
            - cell "破坏\"循环等待\"" [ref=e3654]
            - cell "优点：无死锁；缺点：维护顺序困难，事务需求难预测" [ref=e3655]
      - blockquote [ref=e3656]:
        - paragraph [ref=e3657]:
          - text: 注意：
          - strong [ref=e3658]: 两段锁协议（2PL）不防止死锁
          - text: ！这是高频考点。
      - heading "死锁的检测（Detection）" [level=4] [ref=e3659]
      - paragraph [ref=e3660]:
        - strong [ref=e3661]: 等待图法（Wait-for Graph）
        - text: ：为每个事务画一个节点，如果 T1 等待 T2 的锁，画一条 T1→T2 的有向边。如果图中出现
        - strong [ref=e3662]: 环
        - text: ，说明存在死锁。
      - code [ref=e3664]: 等待图例： T1 ──→ T2 ↑ │ └──────┘ T1→T2→T1 形成环 → 存在死锁！
      - paragraph [ref=e3665]:
        - strong [ref=e3666]: 检测时机
        - text: ：定期检测（如每隔一定时间检查一次等待图），或在事务等待超时时检测。
      - heading "死锁的解除（Recovery）" [level=4] [ref=e3667]
      - table [ref=e3668]:
        - rowgroup [ref=e3669]:
          - row [ref=e3670]:
            - columnheader "方法" [ref=e3671]
            - columnheader "操作" [ref=e3672]
        - rowgroup [ref=e3673]:
          - row [ref=e3674]:
            - cell [ref=e3675]:
              - strong [ref=e3676]: 选一个牺牲者
              - text: （Victim Selection）
            - cell "选一个事务回滚（通常选开销最小的：修改少、运行时间短的事务）" [ref=e3677]
          - row [ref=e3678]:
            - cell [ref=e3679]:
              - strong [ref=e3680]: 回滚牺牲者
            - cell "回滚选中的事务，释放它持有的所有锁" [ref=e3681]
          - row [ref=e3682]:
            - cell [ref=e3683]:
              - strong [ref=e3684]: 防止饿死
            - cell "同一个事务不能总是被选为牺牲者，需要记录回滚次数" [ref=e3685]
      - heading "死锁预防 vs 检测 vs 解除 对比" [level=4] [ref=e3686]
      - table [ref=e3687]:
        - rowgroup [ref=e3688]:
          - row [ref=e3689]:
            - columnheader "策略" [ref=e3690]
            - columnheader "时机" [ref=e3691]
            - columnheader "方法" [ref=e3692]
            - columnheader "特点" [ref=e3693]
        - rowgroup [ref=e3694]:
          - row [ref=e3695]:
            - cell [ref=e3696]:
              - strong [ref=e3697]: 预防
            - cell "死锁发生前" [ref=e3698]
            - cell "破坏必要条件" [ref=e3699]
            - cell "预防永久消除死锁，但并发度降低" [ref=e3700]
          - row [ref=e3701]:
            - cell [ref=e3702]:
              - strong [ref=e3703]: 检测
            - cell "运行中" [ref=e3704]
            - cell "等待图找环" [ref=e3705]
            - cell "不阻止死锁发生，但能及时发现" [ref=e3706]
          - row [ref=e3707]:
            - cell [ref=e3708]:
              - strong [ref=e3709]: 解除
            - cell "死锁发生后" [ref=e3710]
            - cell "选牺牲者回滚" [ref=e3711]
            - cell "简单粗暴，回滚浪费工作" [ref=e3712]
      - separator [ref=e3713]
      - heading "13.7 活锁（Livelock）" [level=3] [ref=e3714]
      - heading "活锁的概念" [level=4] [ref=e3715]
      - paragraph [ref=e3716]:
        - strong [ref=e3717]: 活锁
        - text: 是指事务虽然没有死锁（没有被永久挂起），但因为某些原因一直在等待、重试，
        - strong [ref=e3718]: 永远得不到执行机会
        - text: 。
      - heading "活锁 vs 死锁" [level=4] [ref=e3719]
      - table [ref=e3720]:
        - rowgroup [ref=e3721]:
          - row [ref=e3722]:
            - columnheader "对比" [ref=e3723]
            - columnheader "死锁（Deadlock）" [ref=e3724]
            - columnheader "活锁（Livelock）" [ref=e3725]
        - rowgroup [ref=e3726]:
          - row [ref=e3727]:
            - cell [ref=e3728]:
              - strong [ref=e3729]: 状态
            - cell "事务完全阻塞，无法继续" [ref=e3730]
            - cell "事务一直在动（等待、重试），但无法完成" [ref=e3731]
          - row [ref=e3732]:
            - cell [ref=e3733]:
              - strong [ref=e3734]: 现象
            - cell "互相等待，僵住了" [ref=e3735]
            - cell "频繁重试，就是抢不到锁" [ref=e3736]
          - row [ref=e3737]:
            - cell [ref=e3738]:
              - strong [ref=e3739]: 类比
            - cell "两辆车在十字路口互不相让" [ref=e3740]
            - cell "一扇门前两人同时想进，同时退让、又同时上前，一直循环" [ref=e3741]
          - row [ref=e3742]:
            - cell [ref=e3743]:
              - strong [ref=e3744]: 检测
            - cell "等待图中有环" [ref=e3745]
            - cell "没有环，事务在\"活动\"但无效" [ref=e3746]
      - heading "活锁的产生场景" [level=4] [ref=e3747]
      - paragraph [ref=e3748]:
        - text: 多个事务频繁申请 S 锁读数据，写锁申请者（X 锁）一直等待，导致
        - strong [ref=e3749]: 写事务饥饿
        - text: 。
      - heading "活锁的解决方法" [level=4] [ref=e3750]
      - paragraph [ref=e3751]:
        - strong [ref=e3752]: 先来先服务（FCFS）策略
        - text: ：按申请锁的顺序排队，"先排队的事务优先获得锁"，避免某个事务总也抢不到锁。
      - heading "死锁/活锁对比表" [level=4] [ref=e3753]
      - table [ref=e3754]:
        - rowgroup [ref=e3755]:
          - row [ref=e3756]:
            - columnheader "对比维度" [ref=e3757]
            - columnheader "死锁" [ref=e3758]
            - columnheader "活锁" [ref=e3759]
        - rowgroup [ref=e3760]:
          - row [ref=e3761]:
            - cell "事务状态" [ref=e3762]
            - cell "阻塞等待" [ref=e3763]
            - cell "不断重试（在运行，但不前进）" [ref=e3764]
          - row [ref=e3765]:
            - cell "能否自行解除" [ref=e3766]
            - cell "不能，需要外力干预" [ref=e3767]
            - cell "理论上可能自行解除（偶然抢到锁）" [ref=e3768]
          - row [ref=e3769]:
            - cell "检测方法" [ref=e3770]
            - cell "等待图法（检查环）" [ref=e3771]
            - cell "超时检测（等太久就说明有问题）" [ref=e3772]
          - row [ref=e3773]:
            - cell "解决方法" [ref=e3774]
            - cell "选牺牲者回滚" [ref=e3775]
            - cell "先来先服务排队策略" [ref=e3776]
          - row [ref=e3777]:
            - cell "考试频率" [ref=e3778]
            - cell "⭐⭐⭐（高频）" [ref=e3779]
            - cell "⭐（偶尔出现）" [ref=e3780]
      - paragraph [ref=e3781]:
        - strong [ref=e3782]: 例题 1
        - text: ：事务的原子性是指（ ） A. 事务一旦提交，对数据库的改变是永久的 B. 事务中包括的所有操作要么都做，要么都不做 C. 一个事务内部的操作及使用的数据对并发的其他事务是隔离的 D. 事务必须使数据库从一个一致性状态变到另一个一致性状态
      - blockquote [ref=e3783]:
        - paragraph [ref=e3784]:
          - strong [ref=e3785]: 答案：B
          - text: 。A 是持久性，C 是隔离性，D 是一致性。口诀："原全不做，隔不干扰，一状态变，持永不变"。
      - paragraph [ref=e3786]:
        - strong [ref=e3787]: 例题 2
        - text: ：若事务 T 对数据 R 加了 S 锁，则其他事务对数据 R（ ） A. 可以加 S 锁，不能加 X 锁 B. 可以加 X 锁，不能加 S 锁 C. 可以加 S 锁，也可以加 X 锁 D. 不能加任何锁
      - blockquote [ref=e3788]:
        - paragraph [ref=e3789]:
          - strong [ref=e3790]: 答案：A
          - text: 。S 锁只允许再加 S 锁，不允许加 X 锁。口诀："S 锁让大家一起看，但不让改"。
      - paragraph [ref=e3791]:
        - strong [ref=e3792]: 例题 3
        - text: ：关于死锁，下列说法正确的是（ ） A. 死锁是操作系统中的问题，数据库操作中不存在 B. 防止死锁的方法是禁止两个用户同时操作数据库 C. 当两个用户竞争相同资源时不会发生死锁 D. 只有出现并发操作时，才有可能出现死锁
      - blockquote [ref=e3793]:
        - paragraph [ref=e3794]:
          - strong [ref=e3795]: 答案：D
          - text: 。没有并发就没有死锁。死锁的四个必要条件：互斥、请求保持、不可抢占、循环等待。
      - paragraph [ref=e3796]:
        - strong [ref=e3797]: 例题 4
        - text: ：在数据库系统中，死锁属于（ ） A. 系统故障 B. 事务故障 C. 介质故障 D. 程序故障
      - blockquote [ref=e3798]:
        - paragraph [ref=e3799]:
          - strong [ref=e3800]: 答案：B
          - text: 。死锁是事务故障的一种。事务故障还包括：运算溢出、违反完整性约束、主动回滚等。
      - heading "13.7 易错陷阱" [level=3] [ref=e3801]
      - list [ref=e3802]:
        - listitem [ref=e3803]:
          - strong [ref=e3804]: 一致性 vs 原子性
          - text: ：一致性是"状态正确"（目标），原子性是"要么全做要么全不做"（手段）。
        - listitem [ref=e3805]:
          - strong [ref=e3806]: 不可重复读 vs 幻读
          - text: ：不可重复读是 UPDATE 导致的同一行值变化，幻读是 INSERT/DELETE 导致的行数变化。
        - listitem [ref=e3807]:
          - strong [ref=e3808]: 2PL 保证可串行化但不防死锁
          - text: ：死锁需要额外的检测和解除机制。
        - listitem [ref=e3809]:
          - strong [ref=e3810]: MySQL InnoDB 的 REPEATABLE READ 可通过间隙锁解决幻读
          - text: ，这是 MySQL 特有的。
      - heading "13.8 记忆口诀" [level=3] [ref=e3811]
      - blockquote [ref=e3812]:
        - paragraph [ref=e3813]:
          - strong [ref=e3814]: ACID
          - text: ：原全做或全不做，隔并发互不扰，一状态保持对，持提交永不变。
          - strong [ref=e3815]: 并发问题
          - text: ：丢修改（覆盖写）、脏读（读未提交）、不可重复（同行值变）、幻读（行数变）。
          - strong [ref=e3816]: 锁
          - text: ：S 锁大家看，X 锁独占改；S 与 S 兼容，X 与谁都不兼容。
          - strong [ref=e3817]: 隔离级别递增
          - text: ：读未提交最宽松 → 读已提交防脏读 → 可重复读防重复 → 可串行化全防住。
      - separator [ref=e3818]
      - heading "知识点 14：数据库备份与恢复" [level=2] [ref=e3819]
      - blockquote [ref=e3820]:
        - paragraph [ref=e3821]: ⭐⭐中高频 —— 故障类型区分（事务故障/系统故障/介质故障）、恢复策略是概念辨析题常客
      - heading "14.1 故障类型 ⭐" [level=3] [ref=e3822]
