              - strong [ref=e969]: 并
              - text: （Union）
            - cell "∪" [ref=e970]
            - cell "两个表的列数和类型必须相同（并相容）" [ref=e971]
            - cell "两张表摞在一起，去重" [ref=e972]
            - cell "R ∪ S = 所有在 R 中或在 S 中的元组" [ref=e973]
          - row [ref=e974]:
            - cell [ref=e975]:
              - strong [ref=e976]: 差
              - text: （Difference）
            - cell "−" [ref=e977]
            - cell "同上" [ref=e978]
            - cell "在表 A 里但不在表 B 里的行" [ref=e979]
            - cell "R − S = 在 R 中但不在 S 中的元组" [ref=e980]
          - row [ref=e981]:
            - cell [ref=e982]:
              - strong [ref=e983]: 交
              - text: （Intersection）
            - cell "∩" [ref=e984]
            - cell "同上" [ref=e985]
            - cell "两张表都有的行" [ref=e986]
            - cell "R ∩ S = 同时在 R 和 S 中的元组" [ref=e987]
          - row [ref=e988]:
            - cell [ref=e989]:
