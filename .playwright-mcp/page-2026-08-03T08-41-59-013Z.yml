      - separator [ref=e811]
      - heading "10.8 例题（5道选择题）" [level=3] [ref=e812]
      - blockquote [ref=e813]:
        - paragraph [ref=e814]:
          - strong [ref=e815]: 例题 1
          - text: ：数据库系统的核心是 ______。 A. 数据模型 B. 数据库管理系统 C. 数据库 D. 数据库管理员
        - paragraph [ref=e816]:
          - strong [ref=e817]: 答案
          - text: ：B。DBMS 是数据库系统的核心软件，负责所有管理操作。DBMS 是位于用户和操作系统之间的一层数据管理软件。
      - blockquote [ref=e818]:
        - paragraph [ref=e819]:
          - strong [ref=e820]: 例题 2
          - text: ：在数据库的三级模式结构中，描述数据库中全体数据的全局逻辑结构和特征的是 ______。 A. 外模式 B. 内模式 C. 存储模式 D. 模式
        - paragraph [ref=e821]:
          - strong [ref=e822]: 答案
          - text: ：D。模式（也称概念模式、逻辑模式）是数据库中全体数据的逻辑结构和特征的描述，是所有用户的公共数据视图，只有一个。
      - blockquote [ref=e823]:
        - paragraph [ref=e824]:
          - strong [ref=e825]: 例题 3
          - text: ：两级映像中的"外模式/模式映像"保证了数据库的 ______。 A. 物理数据独立性 B. 逻辑数据独立性 C. 数据安全性 D. 数据完整性
        - paragraph [ref=e826]:
          - strong [ref=e827]: 答案
          - text: ：B。当模式改变时（如增加新的关系、增加新的属性等），数据库管理员修改外模式/模式映像，使外模式保持不变，从而应用程序不必修改，保证了数据与程序的逻辑独立性。
      - blockquote [ref=e828]:
        - paragraph [ref=e829]:
          - strong [ref=e830]: 例题 4
          - text: ：层次模型与网状模型相比，层次模型的特点是 ______。 A. 允许一个节点有多个父节点 B. 一个子节点只能有一个父节点 C. 用二维表表示数据 D. 数据独立性最高
        - paragraph [ref=e831]:
          - strong [ref=e832]: 答案
          - text: ：B。层次模型的核心特征是树形结构，一个子节点只能有一个父节点（除根节点外）。网状模型突破了这一限制，允许一个子节点有多个父节点。
      - blockquote [ref=e833]:
        - paragraph [ref=e834]:
          - strong [ref=e835]: 例题 5
          - text: ：关于数据库系统的数据独立性，下列说法正确的是 ______。 A. 数据独立性是指数据与程序之间互不依赖、相互独立 B. 物理独立性是指当数据的存储结构改变时，应用程序不变 C. 逻辑独立性是指当数据的逻辑结构改变时，应用程序也不变 D. 以上说法都正确
        - paragraph [ref=e836]:
          - strong [ref=e837]: 答案
          - text: ：D。数据独立性是数据库系统的重要特征，包括物理独立性（内模式改变不影响模式和应用程序）和逻辑独立性（模式改变不影响外模式和应用程序），两级映像机制是实现数据独立性的关键。
