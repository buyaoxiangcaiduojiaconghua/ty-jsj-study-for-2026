      - heading "四、范式判断技巧" [level=3] [ref=e5206]
      - heading "4.1 范式判断三步法（国网大题必考）" [level=4] [ref=e5207]
      - paragraph [ref=e5208]:
        - strong [ref=e5209]: 步骤
        - text: ：
      - list [ref=e5210]:
        - listitem [ref=e5211]:
          - strong [ref=e5212]: 先看 1NF
          - text: ：有没有列包含多个值？有 → 不满足 1NF，不用往下看
        - listitem [ref=e5213]:
          - strong [ref=e5214]: 再看 2NF
          - text: ：找候选码（主键），然后看每个非主属性是否"完全函数依赖"于候选码。如果某非主属性只依赖候选码的一部分 → 不满足 2NF
        - listitem [ref=e5215]:
          - strong [ref=e5216]: 最后看 3NF
          - text: ：非主属性之间有没有传递依赖？即 非主属性 A → 非主属性 B → 候选码 这种链？有 → 不满足 3NF
      - heading "4.2 函数依赖速查" [level=4] [ref=e5217]
      - table [ref=e5218]:
        - rowgroup [ref=e5219]:
