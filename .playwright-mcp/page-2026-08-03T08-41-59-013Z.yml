        - text: ：以上 11 道选择题覆盖了国家电网计算机类考试中数据库部分的五大核心考点——SQL 查询（多表连接、子查询、聚合）、ER 图转关系模式（1:1/1:N/M:N 三种转换规则）、事务并发四个经典问题（脏读/不可重复读/幻读/丢失修改）、范式判断（部分依赖/传递依赖两步法）、数据库设计六阶段顺序。建议把每道题的解析中的"为什么错"也仔细读一遍，这样遇到变体题也能灵活应对。
