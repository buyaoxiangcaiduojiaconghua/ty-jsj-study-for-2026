      - paragraph [ref=e1818]:
        - strong [ref=e1819]: 例子
        - text: ：
      - code [ref=e1821]: "-- 正确：别名用在 ORDER BY（在 SELECT 之后） SELECT 系名, COUNT(*) AS 人数 FROM 学生 GROUP BY 系名 ORDER BY 人数 DESC; -- 错误：别名用在 WHERE（在 SELECT 之前） SELECT 学号, 成绩*1.1 AS 加权成绩 FROM 选课 WHERE 加权成绩 > 90; -- 报错！ SELECT 学号, 成绩*1.1 AS 加权成绩 FROM 选课 WHERE 成绩*1.1 > 90; -- 正确"
      - heading "基本查询" [level=4] [ref=e1822]
      - code [ref=e1824]: "-- 最基本的查询 SELECT 学号, 姓名 FROM 学生 WHERE 年龄 >= 18; -- 去重 SELECT DISTINCT 性别 FROM 学生; -- LIKE 模糊查询 -- % 匹配任意长度字符，_ 匹配单个字符 SELECT * FROM 学生 WHERE 姓名 LIKE '张%'; -- 姓张的 SELECT * FROM 学生 WHERE 姓名 LIKE '张_'; -- 张某（单名）"
