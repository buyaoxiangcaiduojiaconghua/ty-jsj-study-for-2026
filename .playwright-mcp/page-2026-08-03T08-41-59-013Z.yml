      - heading "12.4 DQL——查询（最重要，考试占比最高）" [level=3] [ref=e1749]
      - heading "SELECT 语句的完整语法和执行顺序 ⭐⭐⭐" [level=4] [ref=e1750]
      - paragraph [ref=e1751]:
        - strong [ref=e1752]: 语法顺序
        - text: （我们写 SQL 时的顺序）：
      - code [ref=e1754]: SELECT [DISTINCT] 列名, 聚合函数 -- 第5步执行 FROM 表名 [JOIN 其他表 ON 条件] -- 第1步执行 WHERE 条件 -- 第2步执行 GROUP BY 分组列 -- 第3步执行 HAVING 分组后条件 -- 第4步执行 ORDER BY 排序列 [ASC|DESC] -- 第6步执行 LIMIT 数量; -- 第7步执行
      - paragraph [ref=e1755]:
        - strong [ref=e1756]: 执行顺序
        - text: （数据库实际处理的顺序，考试高频考点）：
      - code [ref=e1758]: FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT (1) (2) (3) (4) (5) (6) (7)
      - paragraph [ref=e1759]:
        - strong [ref=e1760]: 每一步做了什么
        - text: ：
      - table [ref=e1761]:
        - rowgroup [ref=e1762]:
