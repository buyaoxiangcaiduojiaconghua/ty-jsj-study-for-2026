      - heading "15.8" [level=3] [ref=e4813]
      - paragraph [ref=e4814]:
        - strong [ref=e4815]: 例题 9
        - text: ：在数据库设计中，ER 图产生于（ ） A. 需求分析阶段 B. 概念结构设计阶段 C. 逻辑结构设计阶段 D. 物理结构设计阶段
      - blockquote [ref=e4816]:
        - paragraph [ref=e4817]:
          - strong [ref=e4818]: 答案：B
          - text: 。ER 图是概念模型的表示方法。
      - paragraph [ref=e4819]:
        - strong [ref=e4820]: 例题 10
        - text: ：ER 图中，一个 M:N 联系转换为关系模式时，该关系模式的码是（ ） A. N 端实体的码 B. M 端实体的码 C. M 端和 N 端实体的码的组合 D. 重新选取
      - blockquote [ref=e4821]:
        - paragraph [ref=e4822]:
          - strong [ref=e4823]: 答案：C
          - text: 。M:N 联系必须单独建表，主键 = 两端主键的组合。
      - paragraph [ref=e4824]:
        - strong [ref=e4825]: 例题 11
        - text: ：R(学号, 姓名, 系号, 系主任, 课程号, 成绩)，其中学号→系号，系号→系主任，(学号,课程号)→成绩。R 属于（ ） A. 1NF B. 2NF C. 3NF D. BCNF
      - blockquote [ref=e4826]:
        - paragraph [ref=e4827]:
          - strong [ref=e4828]: 答案：A
          - text: 。候选码为(学号,课程号)。学号→姓名是部分函数依赖（姓名只依赖于学号，不依赖于整个候选码），所以不满足 2NF，最高只到 1NF。
      - paragraph [ref=e4829]:
        - strong [ref=e4830]: 例题 12
        - text: ：R(学号, 姓名, 系名, 系主任)，学号→系名→系主任，存在（ ）依赖，不满足（ ）范式。
      - blockquote [ref=e4831]:
        - paragraph [ref=e4832]:
          - strong [ref=e4833]: 答案
          - text: ：传递函数依赖，不满足 3NF。
      - paragraph [ref=e4834]:
        - strong [ref=e4835]: 例题 13
        - text: ：关于 B+ 树，下列说法正确的是（ ） A. B+ 树的非叶子节点存储数据记录 B. B+ 树只支持等值查询，不支持范围查询 C. B+ 树的所有叶子节点在同一层 D. B+ 树的叶子节点之间没有连接
      - blockquote [ref=e4836]:
        - paragraph [ref=e4837]:
          - strong [ref=e4838]: 答案：C
          - text: 。A 错（数据只在叶子），B 错（链表支持范围查询），D 错（叶子有双向链表）。
      - heading "15.8 易错陷阱" [level=3] [ref=e4839]
      - list [ref=e4840]:
        - listitem [ref=e4841]:
          - strong [ref=e4842]: 概念结构 vs 逻辑结构
          - text: ：ER 图是概念结构（独立于 DBMS），关系模式是逻辑结构（依赖关系模型）。
        - listitem [ref=e4843]:
          - strong [ref=e4844]: 1:N 联系必须合并到 N 端
          - text: ，不能合并到 1 端。
        - listitem [ref=e4845]:
          - strong [ref=e4846]: 2NF 和 3NF 的判断
          - text: ：先找候选码 → 找主属性/非主属性 → 检查依赖。部分依赖不满足 2NF，传递依赖不满足 3NF。
        - listitem [ref=e4847]:
          - strong [ref=e4848]: B+ 树 vs B 树
          - text: ：B+ 树叶子节点有链表，B 树非叶子也存数据，B+ 树更适合范围查询。
        - listitem [ref=e4849]:
          - strong [ref=e4850]: 3NF 分解一定可以同时满足无损连接和保持函数依赖，BCNF 不一定
          - text: 。
      - heading "15.9 记忆口诀" [level=3] [ref=e4851]
      - blockquote [ref=e4852]:
        - paragraph [ref=e4853]:
          - strong [ref=e4854]: 设计六阶段
          - text: ：需概逻物实维。
          - strong [ref=e4855]: ER 转关系
          - text: ：1:1 随便加，1:N 加 N 端，M:N 单独建，码取两端合。
          - strong [ref=e4856]: 范式递进
          - text: ：1NF 属性不可分，2NF 消除部分依赖，3NF 消除传递依赖，BCNF 决定因素都是码。
          - strong [ref=e4857]: B+ 树
          - text: ：数据全在叶子上，非叶只存索引键，叶子链接成链表，范围查询跑得快。
          - strong [ref=e4858]: 查询优化
          - text: ：选择先做、投影随后、连接最后，小表驱动大表，索引覆盖最优。
