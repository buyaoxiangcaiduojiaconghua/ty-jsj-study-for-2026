            - cell "❌ 防" [ref=e3342]
            - cell "❌ 防" [ref=e3343]
            - cell "允许" [ref=e3344]
            - cell "允许" [ref=e3345]
            - cell "MVCC（每次SELECT生成新ReadView）" [ref=e3346]
