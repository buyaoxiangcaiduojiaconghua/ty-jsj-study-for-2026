      - heading "子查询（嵌套查询）—— 相关子查询 vs 非相关子查询 ⭐" [level=4] [ref=e1968]
      - paragraph [ref=e1969]: 子查询就是"查询里面套查询"。按执行方式分为两类：
      - heading "非相关子查询（独立子查询）" [level=5] [ref=e1970]
      - paragraph [ref=e1971]:
        - text: 子查询
        - strong [ref=e1972]: 不依赖
        - text: 外层查询，先执行子查询得到结果，外层再使用这个结果。
      - code [ref=e1974]: "-- 查询年龄大于平均年龄的学生 SELECT * FROM 学生 WHERE 年龄 > (SELECT AVG(年龄) FROM 学生); -- 子查询只需执行一次，结果是一个数值，外层用这个数值过滤"
      - paragraph [ref=e1975]:
        - strong [ref=e1976]: 特点
        - text: ：子查询只执行一次，效率较高。
      - heading "相关子查询（关联子查询）" [level=5] [ref=e1977]
      - paragraph [ref=e1978]:
        - text: 子查询
        - strong [ref=e1979]: 依赖
        - text: 外层查询的列值，外层每处理一行，子查询就执行一次。
      - code [ref=e1981]: "-- 查询比本系平均年龄大的学生 SELECT * FROM 学生 s1 WHERE 年龄 > ( SELECT AVG(年龄) FROM 学生 s2 WHERE s2.系名 = s1.系名 -- 引用了外层的 s1.系名！ ); -- 对于外层每一行，先取出该学生的系名，再算该系的平均年龄，然后比较"
      - paragraph [ref=e1982]:
        - strong [ref=e1983]: 特点
        - text: ：子查询多次执行，不能独立运行。
