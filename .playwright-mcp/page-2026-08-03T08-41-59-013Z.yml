              - strong [ref=e4026]: 旧值
              - text: （前像）
            - cell "修改前的值（用于 UNDO）" [ref=e4027]
            - cell [ref=e4028]:
              - code [ref=e4029]: "1000"
          - row [ref=e4030]:
            - cell [ref=e4031]:
              - strong [ref=e4032]: 新值
              - text: （后像）
            - cell "修改后的值（用于 REDO）" [ref=e4033]
            - cell [ref=e4034]:
              - code [ref=e4035]: "900"
      - paragraph [ref=e4036]:
        - strong [ref=e4037]: 典型日志记录类型
        - text: ：
      - code [ref=e4039]: <T1, START> ← 事务 T1 开始 <T1, A, 1000, 900> ← T1 将 A 从 1000 改为 900 <T1, B, 500, 600> ← T1 将 B 从 500 改为 600 <T1, COMMIT> ← T1 提交
      - heading "WAL 原则（Write-Ahead Logging，先写日志）⭐⭐⭐" [level=4] [ref=e4040]
      - paragraph [ref=e4041]:
        - strong [ref=e4042]: 定义
        - text: ：在把数据修改写入数据库磁盘之前，必须先把对应的日志记录写入日志文件（磁盘）。
      - code [ref=e4044]: WAL 原则的写入顺序： 1. 先把日志记录刷到日志文件磁盘 2. 再把数据修改刷到数据库磁盘 "先写日志，后写数据"
      - paragraph [ref=e4045]:
        - strong [ref=e4046]: WAL 为什么重要
        - text: ：
      - list [ref=e4047]:
        - listitem [ref=e4048]: 假设备份过程中断电：如果先写数据、后写日志 → 数据写了但没日志记录 → 无法恢复
        - listitem [ref=e4049]: 先写日志、后写数据 → 即使数据没来得及写，日志里有记录 → 可以 REDO 重做
      - paragraph [ref=e4050]:
        - strong [ref=e4051]: WAL 的两个核心规则
        - text: ：
      - list [ref=e4052]:
        - listitem [ref=e4053]: 事务提交前，其所有日志记录必须先写入磁盘
        - listitem [ref=e4054]: 数据修改写入磁盘前，对应的日志记录必须先写入磁盘
      - paragraph [ref=e4055]:
        - strong [ref=e4056]: 考试必考点
        - text: ：
      - list [ref=e4057]:
        - listitem [ref=e4058]: "\"日志文件只记录更新操作（INSERT/UPDATE/DELETE），不记录查询操作（SELECT）\""
        - listitem [ref=e4059]: "\"WAL = Write-Ahead Logging = 先写日志，后写数据库\""
      - separator [ref=e4060]
      - heading "14.4 恢复策略 ⭐⭐⭐" [level=3] [ref=e4061]
      - paragraph [ref=e4062]: 不同故障类型对应不同的恢复策略：
      - table [ref=e4063]:
        - rowgroup [ref=e4064]:
          - row [ref=e4065]:
            - columnheader "故障类型" [ref=e4066]
            - columnheader "恢复策略" [ref=e4067]
            - columnheader "操作说明" [ref=e4068]
            - columnheader "需要的工具" [ref=e4069]
        - rowgroup [ref=e4070]:
          - row [ref=e4071]:
            - cell [ref=e4072]:
              - strong [ref=e4073]: 事务故障
            - cell [ref=e4074]:
              - strong [ref=e4075]: UNDO
            - cell "反向扫描日志，撤销该事务的所有修改操作（用旧值覆盖新值）" [ref=e4076]
            - cell "日志文件" [ref=e4077]
          - row [ref=e4078]:
            - cell [ref=e4079]:
              - strong [ref=e4080]: 系统故障
            - cell [ref=e4081]:
              - strong [ref=e4082]: UNDO + REDO
            - cell "① UNDO：撤销所有未完成（未提交）的事务；② REDO：重做所有已完成（已提交）但未写入磁盘的事务" [ref=e4083]
            - cell "日志文件" [ref=e4084]
          - row [ref=e4085]:
            - cell [ref=e4086]:
              - strong [ref=e4087]: 介质故障
            - cell [ref=e4088]:
              - strong [ref=e4089]: 后备副本 + REDO
            - cell "① 用最近的后备副本恢复数据库到备份时的状态；② 从日志文件中 REDO 备份后所有已提交的事务" [ref=e4090]
            - cell "后备副本 + 日志文件" [ref=e4091]
      - heading "恢复策略详细操作" [level=4] [ref=e4092]
      - paragraph [ref=e4093]:
        - strong [ref=e4094]: （一）事务故障恢复（只 UNDO）
      - paragraph [ref=e4095]: 步骤：
      - list [ref=e4096]:
        - listitem [ref=e4097]: 反向扫描日志文件（从日志末尾往前扫描）
        - listitem [ref=e4098]: 找到该事务的所有更新操作记录
        - listitem [ref=e4099]:
          - text: 对每条更新记录，执行
          - strong [ref=e4100]: 反向操作
          - text: （用旧值替代新值）
        - listitem [ref=e4101]: 继续反向扫描，直到读到此事务的 START 记录为止
      - paragraph [ref=e4102]:
        - strong [ref=e4103]: （二）系统故障恢复（UNDO + REDO）
      - paragraph [ref=e4104]: 步骤：
      - list [ref=e4105]:
        - listitem [ref=e4106]:
          - text: 正向扫描日志，建立两个事务列表：
          - list [ref=e4107]:
            - listitem [ref=e4108]:
              - strong [ref=e4109]: UNDO 列表
              - text: ：日志中有
              - code [ref=e4110]: <Ti, START>
              - text: 但没有
              - code [ref=e4111]: <Ti, COMMIT>
              - text: 的事务
            - listitem [ref=e4112]:
              - strong [ref=e4113]: REDO 列表
              - text: ：日志中有
              - code [ref=e4114]: <Ti, START>
              - text: 也有
              - code [ref=e4115]: <Ti, COMMIT>
              - text: 的事务
        - listitem [ref=e4116]: 反向扫描日志，对 UNDO 列表中的每个事务执行 UNDO 操作
        - listitem [ref=e4117]: 正向扫描日志，对 REDO 列表中的每个事务执行 REDO 操作
      - paragraph [ref=e4118]:
        - strong [ref=e4119]: （三）介质故障恢复（副本 + REDO）
      - paragraph [ref=e4120]: 步骤：
      - list [ref=e4121]:
        - listitem [ref=e4122]: 将最近的后备副本（数据库备份）恢复到新的磁盘上
        - listitem [ref=e4123]: 从日志文件中找出备份时间点之后的所有已提交事务
        - listitem [ref=e4124]: 按时间顺序（正向扫描）对每条日志记录执行 REDO 操作
        - listitem [ref=e4125]: 恢复完成
      - heading "恢复策略对比速查" [level=4] [ref=e4126]
      - table [ref=e4127]:
        - rowgroup [ref=e4128]:
          - row [ref=e4129]:
            - columnheader "对比维度" [ref=e4130]
            - columnheader "事务故障恢复" [ref=e4131]
            - columnheader "系统故障恢复" [ref=e4132]
            - columnheader "介质故障恢复" [ref=e4133]
        - rowgroup [ref=e4134]:
          - row [ref=e4135]:
            - cell "需要日志文件" [ref=e4136]
            - cell "✅" [ref=e4137]
            - cell "✅" [ref=e4138]
            - cell "✅" [ref=e4139]
          - row [ref=e4140]:
            - cell "需要后备副本" [ref=e4141]
            - cell "❌" [ref=e4142]
            - cell "❌" [ref=e4143]
            - cell "✅（必备）" [ref=e4144]
          - row [ref=e4145]:
            - cell "有 UNDO" [ref=e4146]
            - cell "✅" [ref=e4147]
            - cell "✅（未完成事务）" [ref=e4148]
            - cell "❌" [ref=e4149]
          - row [ref=e4150]:
            - cell "有 REDO" [ref=e4151]
            - cell "❌" [ref=e4152]
            - cell "✅（已完成但未写盘事务）" [ref=e4153]
            - cell "✅（备份后的全部已提交事务）" [ref=e4154]
          - row [ref=e4155]:
            - cell "扫描方式" [ref=e4156]
            - cell "反向扫描" [ref=e4157]
            - cell "UNDO 反向 + REDO 正向" [ref=e4158]
            - cell "正向扫描" [ref=e4159]
      - separator [ref=e4160]
      - heading "14.5 检查点机制（Checkpoint）⭐⭐" [level=3] [ref=e4161]
      - heading "检查点的作用" [level=4] [ref=e4162]
      - paragraph [ref=e4163]:
        - strong [ref=e4164]: 大白话
        - text: ：检查点是"存档点"。有了检查点，系统故障恢复时不需要从头扫描整个日志，只需要从最近的检查点开始扫描，大大缩短恢复时间。
      - heading "设置检查点的操作" [level=4] [ref=e4165]
      - table [ref=e4166]:
        - rowgroup [ref=e4167]:
          - row [ref=e4168]:
            - columnheader "步骤" [ref=e4169]
            - columnheader "操作" [ref=e4170]
            - columnheader "目的" [ref=e4171]
        - rowgroup [ref=e4172]:
          - row [ref=e4173]:
            - cell "1" [ref=e4174]
            - cell "将日志缓冲区中的所有日志记录写入磁盘" [ref=e4175]
            - cell "确保日志不丢失" [ref=e4176]
          - row [ref=e4177]:
            - cell "2" [ref=e4178]
            - cell [ref=e4179]:
              - text: 在日志文件中写入一条
              - code [ref=e4180]: <Checkpoint, L>
              - text: 记录，L 是当前所有活跃事务的列表
            - cell "标记检查点位置" [ref=e4181]
          - row [ref=e4182]:
            - cell "3" [ref=e4183]
            - cell "将数据缓冲区中的所有修改写入磁盘" [ref=e4184]
            - cell "确保数据持久化" [ref=e4185]
          - row [ref=e4186]:
            - cell "4" [ref=e4187]
            - cell "记录检查点在日志文件中的地址到\"重新启动文件\"" [ref=e4188]
            - cell "方便下次恢复定位" [ref=e4189]
      - heading "利用检查点的恢复步骤 ⭐" [level=4] [ref=e4190]
      - list [ref=e4191]:
        - listitem [ref=e4192]: 从"重新启动文件"找到最后一个检查点的日志地址
        - listitem [ref=e4193]: 从该检查点开始，正向扫描日志文件
        - listitem [ref=e4194]:
          - text: 建立 UNDO 列表和 REDO 列表：
          - list [ref=e4195]:
            - listitem [ref=e4196]: 初始时，UNDO 列表 = 检查点记录中 L 的所有事务
            - listitem [ref=e4197]: REDO 列表 = 空
            - listitem [ref=e4198]: 扫描过程中：遇到 START → 加入 UNDO 列表；遇到 COMMIT → 从 UNDO 列表移到 REDO 列表
        - listitem [ref=e4199]:
          - text: 扫描完毕后：
          - list [ref=e4200]:
            - listitem [ref=e4201]: UNDO 列表中的事务 → 反向扫描，执行 UNDO
            - listitem [ref=e4202]: REDO 列表中的事务 → 从检查点开始正向扫描，执行 REDO
      - heading "检查点的恢复优势" [level=4] [ref=e4203]
      - code [ref=e4205]: 无检查点：从日志头 ─────────────────→ 日志尾（扫描整个日志） 有检查点：从上一个 Checkpoint ──────→ 日志尾（只扫描检查点之后的部分）
      - paragraph [ref=e4206]:
        - strong [ref=e4207]: 考试重点
        - text: ：
      - list [ref=e4208]:
        - listitem [ref=e4209]:
          - text: 检查点
          - strong [ref=e4210]: 之前
          - text: 提交的事务 → 不需要 REDO（数据已经写盘了）
        - listitem [ref=e4211]:
          - text: 检查点
          - strong [ref=e4212]: 之后
          - text: 提交的事务 → 需要 REDO
        - listitem [ref=e4213]: 检查点之前未提交的事务（在 L 列表中） → 需要 UNDO
      - separator [ref=e4214]
      - heading "14.6 数据库镜像 ⭐" [level=3] [ref=e4215]
      - heading "镜像的概念" [level=4] [ref=e4216]
      - paragraph [ref=e4217]:
        - strong [ref=e4218]: 数据库镜像
        - text: 是将数据库从一个磁盘自动复制到另一个磁盘（镜像磁盘），保证一个磁盘损坏时另一个磁盘可以立刻接管。
      - paragraph [ref=e4219]:
        - strong [ref=e4220]: 大白话
        - text: ：数据库实时"影子分身术"，主数据库写一份，镜像数据库同时写一份。主库坏了，影子立马上岗。
      - heading "镜像的作用" [level=4] [ref=e4221]
      - table [ref=e4222]:
        - rowgroup [ref=e4223]:
          - row [ref=e4224]:
            - columnheader "作用" [ref=e4225]
            - columnheader "说明" [ref=e4226]
        - rowgroup [ref=e4227]:
          - row [ref=e4228]:
            - cell [ref=e4229]:
              - strong [ref=e4230]: 介质故障恢复
            - cell "镜像磁盘上有一份完整的数据副本，无需重装副本和 REDO" [ref=e4231]
          - row [ref=e4232]:
            - cell [ref=e4233]:
              - strong [ref=e4234]: 提升可用性
            - cell "主磁盘损坏可立即切换到镜像磁盘，几乎无停机时间" [ref=e4235]
          - row [ref=e4236]:
            - cell [ref=e4237]:
              - strong [ref=e4238]: 并发读取
            - cell "可以让读操作访问镜像磁盘，减轻主磁盘负担" [ref=e4239]
      - heading "镜像的方式" [level=4] [ref=e4240]
      - table [ref=e4241]:
        - rowgroup [ref=e4242]:
          - row [ref=e4243]:
            - columnheader "方式" [ref=e4244]
            - columnheader "操作" [ref=e4245]
            - columnheader "优点" [ref=e4246]
            - columnheader "缺点" [ref=e4247]
        - rowgroup [ref=e4248]:
          - row [ref=e4249]:
            - cell [ref=e4250]:
              - strong [ref=e4251]: 同步镜像
            - cell "每次修改同时写入主磁盘和镜像磁盘" [ref=e4252]
            - cell "数据一致性高" [ref=e4253]
            - cell "写入性能降低" [ref=e4254]
          - row [ref=e4255]:
            - cell [ref=e4256]:
              - strong [ref=e4257]: 异步镜像
            - cell "先写主磁盘，延迟写入镜像磁盘" [ref=e4258]
            - cell "写入性能好" [ref=e4259]
            - cell "可能有少量数据不一致（主盘已写但镜像盘未写）" [ref=e4260]
      - heading "镜像 vs 备份" [level=4] [ref=e4261]
      - table [ref=e4262]:
        - rowgroup [ref=e4263]:
          - row [ref=e4264]:
            - columnheader "对比" [ref=e4265]
            - columnheader "数据库镜像" [ref=e4266]
            - columnheader "数据库备份" [ref=e4267]
        - rowgroup [ref=e4268]:
          - row [ref=e4269]:
            - cell [ref=e4270]:
              - strong [ref=e4271]: 更新频率
            - cell "实时同步" [ref=e4272]
            - cell "定期执行" [ref=e4273]
          - row [ref=e4274]:
            - cell [ref=e4275]:
              - strong [ref=e4276]: 数据时效
            - cell "几乎实时" [ref=e4277]
            - cell "有延迟（上次备份时）" [ref=e4278]
          - row [ref=e4279]:
            - cell [ref=e4280]:
              - strong [ref=e4281]: 恢复速度
            - cell "秒级切换" [ref=e4282]
            - cell "需要较长时间还原" [ref=e4283]
          - row [ref=e4284]:
            - cell [ref=e4285]:
              - strong [ref=e4286]: 存储开销
            - cell "需要双倍磁盘" [ref=e4287]
            - cell "磁带/云存储，成本低" [ref=e4288]
          - row [ref=e4289]:
            - cell [ref=e4290]:
              - strong [ref=e4291]: 防误操作
            - cell "不能防（误删数据镜像也删了）" [ref=e4292]
            - cell "可以恢复历史版本" [ref=e4293]
          - row [ref=e4294]:
            - cell [ref=e4295]:
              - strong [ref=e4296]: 防介质故障
            - cell "✅ 能" [ref=e4297]
            - cell "✅ 能" [ref=e4298]
      - heading "14.5 例题精讲" [level=3] [ref=e4299]
      - paragraph [ref=e4300]:
        - strong [ref=e4301]: 例题 5
        - text: ：日志文件用于记录（ ） A. 程序运行过程 B. 数据操作 C. 对数据的所有更新操作 D. 对数据的所有查询操作
      - blockquote [ref=e4302]:
        - paragraph [ref=e4303]:
          - strong [ref=e4304]: 答案：C
          - text: 。日志只记录更新操作（INSERT/UPDATE/DELETE），不记录 SELECT。
      - paragraph [ref=e4305]:
        - strong [ref=e4306]: 例题 6
        - text: ：系统故障后，恢复时需要对未完成的事务执行（ ） A. REDO B. UNDO C. UNDO+REDO D. 不需要操作
      - blockquote [ref=e4307]:
        - paragraph [ref=e4308]:
          - strong [ref=e4309]: 答案：B
          - text: 。未完成的事务只需 UNDO。已完成事务才需要 REDO。
      - paragraph [ref=e4310]:
        - strong [ref=e4311]: 例题 7
        - text: ：介质故障的恢复需要（ ） A. 只需要日志文件 B. 只需要后备副本 C. 后备副本和日志文件 D. 不需要恢复
      - blockquote [ref=e4312]:
        - paragraph [ref=e4313]:
          - strong [ref=e4314]: 答案：C
          - text: 。先恢复后备副本，再根据日志 REDO 后续修改。
      - paragraph [ref=e4315]:
        - strong [ref=e4316]: 例题 8
        - text: ：以下关于检查点的说法，错误的是（ ） A. 检查点可以缩短恢复时间 B. 检查点前已提交的事务不需要 REDO C. 检查点后的事务一定需要 REDO D. 系统定期设置检查点
      - blockquote [ref=e4317]:
        - paragraph [ref=e4318]:
          - strong [ref=e4319]: 答案：C
          - text: 。检查点后
          - strong [ref=e4320]: 未完成
          - text: 的事务需要 UNDO，不是"一定需要 REDO"。
      - heading "14.6 易错陷阱" [level=3] [ref=e4321]
      - list [ref=e4322]:
        - listitem [ref=e4323]:
          - strong [ref=e4324]: 事务故障只需 UNDO
          - text: ，系统故障需要 UNDO+REDO。
        - listitem [ref=e4325]:
          - strong [ref=e4326]: 日志只记录更新操作，不记录查询操作
          - text: 。
        - listitem [ref=e4327]:
          - strong [ref=e4328]: WAL 原则
          - text: ：先写日志，后写数据库。
        - listitem [ref=e4329]:
          - strong [ref=e4330]: 介质故障恢复 = 后备副本 + 日志文件
          - text: ，两者缺一不可。
      - heading "14.7 记忆口诀" [level=3] [ref=e4331]
      - blockquote [ref=e4332]:
        - paragraph [ref=e4333]:
          - strong [ref=e4334]: 三种故障
          - text: ：事务错（死锁），系统挂（断电），介质坏（磁盘损坏）。
          - strong [ref=e4335]: 恢复技术
          - text: ：转储存副本，日志记修改。先写日志后写库（WAL）。
          - strong [ref=e4336]: 恢复策略
          - text: ：事务故障只 UNDO，系统故障 UNDO+REDO，介质故障需副本+日志。
          - strong [ref=e4337]: 检查点
          - text: ：定期设标记，恢复从此起，不扫全日志。
      - separator [ref=e4338]
      - heading "知识点 15：数据库应用设计与性能优化" [level=2] [ref=e4339]
      - blockquote [ref=e4340]:
        - paragraph [ref=e4341]: ⭐⭐⭐必考 —— ER图转关系模式（M:N单独建表）、范式判断是大题必考点
      - heading "15.1 数据库设计的 6 个阶段" [level=3] [ref=e4342]
      - table [ref=e4343]:
        - rowgroup [ref=e4344]:
          - row [ref=e4345]:
            - columnheader "阶段" [ref=e4346]
            - columnheader "主要任务" [ref=e4347]
