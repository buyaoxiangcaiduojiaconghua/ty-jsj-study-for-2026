      - heading "11.2 关系代数 ⭐" [level=3] [ref=e955]
      - paragraph [ref=e956]: 关系代数是"对表进行运算"的数学语言，SQL 就是它的具体实现。关系代数分为两大类：传统集合运算（4种）和专门的关系运算（4种），共 8 种基本运算（交可用差表示，所以基本运算实际是 5 种：并、差、笛卡尔积、选择、投影）。
      - heading "一、传统集合运算（4种）" [level=4] [ref=e957]
