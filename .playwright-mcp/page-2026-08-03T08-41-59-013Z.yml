      - code [ref=e2049]: "-- IN 子查询示例：查询选了\"数据库\"课程的学生姓名 SELECT 姓名 FROM 学生 WHERE 学号 IN ( SELECT 学号 FROM 选课 WHERE 课程号 = ( SELECT 课程号 FROM 课程 WHERE 课程名 = '数据库' ) ); -- EXISTS 示例（相关子查询）：查询至少选了一门课的学生 SELECT 姓名 FROM 学生 WHERE EXISTS ( SELECT * FROM 选课 WHERE 选课.学号 = 学生.学号 );"
      - separator [ref=e2050]
      - heading "易错点 9：EXISTS vs IN 的区别" [level=4] [ref=e2051]
      - list [ref=e2052]:
        - listitem [ref=e2053]:
          - code [ref=e2054]: IN
          - text: ：子查询先执行，返回结果集，再外层匹配
        - listitem [ref=e2055]:
          - code [ref=e2056]: EXISTS
          - text: ：外层每查一行，就拿到子查询里问一句"有没有"，关联子查询
        - listitem [ref=e2057]:
          - code [ref=e2058]: NOT IN
          - text: 有坑：如果子查询结果中有 NULL，则整条
          - code [ref=e2059]: NOT IN
          - text: 返回空（NULL 跟任何值比较结果都是 UNKNOWN）
        - listitem [ref=e2060]:
          - text: 如果子查询结果集很大，
          - code [ref=e2061]: EXISTS
          - text: 通常比
          - code [ref=e2062]: IN
          - text: 效率高（EXISTS 找到第一个匹配就返回 TRUE，不用扫描全部结果）
