          - text: ：自动去重（结果中不出现重复行）
        - listitem [ref=e2102]:
          - code [ref=e2103]: UNION ALL
          - text: ：不去重，保留所有行（效率更高）
      - code [ref=e2105]: "-- 查询选了\"数学\"或\"英语\"的学生学号（去重） SELECT 学号 FROM 选课 WHERE 课程 = '数学' UNION SELECT 学号 FROM 选课 WHERE 课程 = '英语'; -- 查询同时选了\"数学\"和\"英语\"的学生学号 SELECT 学号 FROM 选课 WHERE 课程 = '数学' INTERSECT SELECT 学号 FROM 选课 WHERE 课程 = '英语'; -- 查询选了\"数学\"但没选\"英语\"的学生学号 SELECT 学号 FROM 选课 WHERE 课程 = '数学' EXCEPT SELECT 学号 FROM 选课 WHERE 课程 = '英语';"
      - paragraph [ref=e2106]:
        - strong [ref=e2107]: 注意
        - text: ：并非所有 DBMS 都支持 INTERSECT 和 EXCEPT（MySQL 5.x 不支持，需用 JOIN 或子查询替代；MySQL 8.0+ 已支持）。
