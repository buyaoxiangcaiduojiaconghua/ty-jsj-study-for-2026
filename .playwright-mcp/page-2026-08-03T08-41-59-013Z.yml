      - separator [ref=e4935]
      - heading "真题与考点补充" [level=2] [ref=e4936]
      - blockquote [ref=e4937]:
        - paragraph [ref=e4938]: 本部分基于历年国网/事业单位/软考数据库笔试真题整理，覆盖 SQL 典型题、事务并发高频考点、范式判断技巧、常见易错陷阱。
      - separator [ref=e4939]
      - heading "一、SQL 典型真题（至少 3 道）" [level=3] [ref=e4940]
      - heading "真题 1：多表 JOIN + 聚合 + HAVING 综合题" [level=4] [ref=e4941]
      - blockquote [ref=e4942]:
        - paragraph [ref=e4943]:
          - strong [ref=e4944]: 题目
          - text: ：有学生表
          - code [ref=e4945]: S(sid, sname, age, sex)
          - text: ，选课表
          - code [ref=e4946]: SC(sid, cid, score)
          - text: ，课程表
          - code [ref=e4947]: C(cid, cname, teacher)
          - text: 。查询"平均成绩大于 80 分的学生姓名和平均成绩"，按平均成绩降序排列。
      - code [ref=e4949]: SELECT S.sname, AVG(SC.score) AS avg_score FROM S INNER JOIN SC ON S.sid = SC.sid GROUP BY S.sid, S.sname HAVING AVG(SC.score) > 80 ORDER BY avg_score DESC;
      - paragraph [ref=e4950]:
        - strong [ref=e4951]: 考点拆解
        - text: ：
      - list [ref=e4952]:
        - listitem [ref=e4953]:
          - code [ref=e4954]: INNER JOIN
          - text: ：学生表关联选课表（只取有选课记录的学生）
        - listitem [ref=e4955]:
          - code [ref=e4956]: GROUP BY
          - text: ：按学生分组，对每个学生的成绩做聚合
        - listitem [ref=e4957]:
          - code [ref=e4958]: HAVING
          - text: ：筛选分组后的聚合结果（不能用 WHERE，因为 AVG 是聚合函数）
        - listitem [ref=e4959]:
          - code [ref=e4960]: ORDER BY
          - text: ：降序排列
      - paragraph [ref=e4961]:
        - strong [ref=e4962]: 易错陷阱
        - text: ：
        - code [ref=e4963]: GROUP BY S.sid, S.sname
        - text: 中两个字段都要写——因为
        - code [ref=e4964]: sname
        - text: 在 SELECT 中出现了且不是聚合函数的参数，必须出现在 GROUP BY 中（SQL 标准要求）。
      - separator [ref=e4965]
      - heading "真题 2：NOT EXISTS 双重否定（关系除法）" [level=4] [ref=e4966]
      - blockquote [ref=e4967]:
        - paragraph [ref=e4968]:
          - strong [ref=e4969]: 题目
          - text: ：查询"选修了所有课程的学生姓名"。
      - code [ref=e4971]: SELECT sname FROM S WHERE NOT EXISTS ( SELECT * FROM C WHERE NOT EXISTS ( SELECT * FROM SC WHERE SC.sid = S.sid AND SC.cid = C.cid ) );
      - paragraph [ref=e4972]:
        - strong [ref=e4973]: 大白话翻译
        - text: ：
      - list [ref=e4974]:
        - listitem [ref=e4975]:
          - text: 内层
          - code [ref=e4976]: NOT EXISTS
          - text: ："不存在一门课程，这个学生选了它" → 这个学生选了所有课程
        - listitem [ref=e4977]:
          - text: 外层
          - code [ref=e4978]: NOT EXISTS
          - text: ："不存在一门课程，这个学生没选它" → 选了全部课程
      - paragraph [ref=e4979]:
        - strong [ref=e4980]: 考点拆解
        - text: ：
