        - listitem [ref=e2757]: 聚合函数中哪几个会忽略 NULL？
        - listitem [ref=e2758]:
          - text: 用
          - code [ref=e2759]: IN
          - text: 和
          - code [ref=e2760]: EXISTS
          - text: 都能实现"查询至少选了一门课的学生"吗？写法分别是什么？
        - listitem [ref=e2761]: SELECT 语句中 FROM 和 SELECT 谁先执行？这意味着什么？
        - listitem [ref=e2762]: 包含 GROUP BY 的视图能更新吗？为什么？
      - separator [ref=e2763]
      - heading "知识点 13：事务与并发控制" [level=2] [ref=e2764]
      - blockquote [ref=e2765]:
        - paragraph [ref=e2766]: ⭐⭐⭐必考 —— ACID 四个特性定义、四种隔离级别对应关系是数据库最高频考点，每年必出1-2题
      - heading "13.1 事务的 ACID 特性 ⭐⭐⭐" [level=3] [ref=e2767]
      - paragraph [ref=e2768]:
        - strong [ref=e2769]: 事务
        - text: 是用户定义的一个数据库操作序列，要么全做，要么全不做，是一个不可分割的工作单位。
      - paragraph [ref=e2770]:
        - strong [ref=e2771]: 事务的定义（SQL 方式）
        - text: ：
      - code [ref=e2773]: BEGIN TRANSACTION; -- 开始事务 操作1; 操作2; ... COMMIT; -- 提交（确认所有修改） -- 或 ROLLBACK; -- 回滚（撤销所有修改）
      - heading "ACID 四大特性详解" [level=4] [ref=e2774]
      - table [ref=e2775]:
        - rowgroup [ref=e2776]:
          - row [ref=e2777]:
            - columnheader "特性" [ref=e2778]
            - columnheader "全称" [ref=e2779]
            - columnheader "大白话" [ref=e2780]
            - columnheader "类比" [ref=e2781]
            - columnheader "底层实现机制" [ref=e2782]
        - rowgroup [ref=e2783]:
          - row [ref=e2784]:
            - cell [ref=e2785]:
              - strong [ref=e2786]: A
              - text: — 原子性
            - cell "Atomicity" [ref=e2787]
            - cell "要么全做，要么全不做" [ref=e2788]
            - cell "转账：A扣100+B加100，两步必须一起成或一起败" [ref=e2789]
            - cell [ref=e2790]:
              - strong [ref=e2791]: Undo Log
              - text: （回滚日志），记录旧值用于撤销
          - row [ref=e2792]:
            - cell [ref=e2793]:
              - strong [ref=e2794]: C
              - text: — 一致性
            - cell "Consistency" [ref=e2795]
            - cell "数据从一种正确状态变到另一种正确状态" [ref=e2796]
            - cell "A+B总金额转账前后不变" [ref=e2797]
            - cell [ref=e2798]:
              - strong [ref=e2799]: 程序员的业务逻辑
              - text: + DBMS 完整性约束检查
          - row [ref=e2800]:
            - cell [ref=e2801]:
              - strong [ref=e2802]: I
              - text: — 隔离性
            - cell "Isolation" [ref=e2803]
            - cell "并发事务互不干扰" [ref=e2804]
            - cell "多个窗口同时办理业务，互不影响" [ref=e2805]
            - cell [ref=e2806]:
              - strong [ref=e2807]: 锁机制
              - text: （S锁/X锁）+
              - strong [ref=e2808]: MVCC
              - text: （多版本并发控制）
          - row [ref=e2809]:
            - cell [ref=e2810]:
              - strong [ref=e2811]: D
              - text: — 持久性
            - cell "Durability" [ref=e2812]
            - cell "提交成功的数据永远不会丢" [ref=e2813]
            - cell "钱转到账就是真到账了，断电也不丢" [ref=e2814]
            - cell [ref=e2815]:
              - strong [ref=e2816]: Redo Log
              - text: （重做日志）+
              - strong [ref=e2817]: WAL原则
              - text: （先写日志后写数据）
      - heading "ACID 深入理解 ⭐" [level=4] [ref=e2818]
      - paragraph [ref=e2819]:
        - strong [ref=e2820]: （一）原子性（Atomicity）—— 靠 Undo Log 实现
      - list [ref=e2821]:
        - listitem [ref=e2822]: 事务执行过程中，每次修改前先把旧值写入 Undo Log
        - listitem [ref=e2823]: 如果事务需要回滚，就从 Undo Log 中取出旧值恢复
        - listitem [ref=e2824]:
          - strong [ref=e2825]: 注意
          - text: ：原子性是通过**撤销（UNDO）**实现的，不是"锁"实现的
      - paragraph [ref=e2826]:
        - strong [ref=e2827]: （二）一致性（Consistency）—— 是目标，不是手段
      - list [ref=e2828]:
        - listitem [ref=e2829]:
          - text: 一致性是保证原子性、隔离性、持久性的
          - strong [ref=e2830]: 最终目标
        - listitem [ref=e2831]:
          - text: 原子性、隔离性、持久性都是实现一致性的
          - strong [ref=e2832]: 手段
        - listitem [ref=e2833]: 一致性的保证来自于：数据库的完整性约束 + 程序员正确编写的事务逻辑
        - listitem [ref=e2834]: 如果程序员逻辑写错了（如转账只扣不加），DBMS 无法保证一致性
      - paragraph [ref=e2835]:
        - strong [ref=e2836]: （三）隔离性（Isolation）—— 靠锁和 MVCC 实现
      - list [ref=e2837]:
        - listitem [ref=e2838]: 锁机制：S 锁（共享读锁）、X 锁（排他写锁）
        - listitem [ref=e2839]: MVCC（多版本并发控制）：不通过加锁，而是保存数据历史版本实现并发
        - listitem [ref=e2840]: 不同隔离级别 = 隔离程度的不同层次
      - paragraph [ref=e2841]:
        - strong [ref=e2842]: （四）持久性（Durability）—— 靠 Redo Log + WAL 实现
      - list [ref=e2843]:
        - listitem [ref=e2844]: WAL（Write-Ahead Logging）原则：先写日志到磁盘，再修改数据
        - listitem [ref=e2845]: 事务提交时，先把 Redo Log 刷到磁盘（持久化），才算提交成功
        - listitem [ref=e2846]: 断电恢复时，可以通过 Redo Log 重做已提交的事务
      - heading "ACID 特性易混淆辨析" [level=4] [ref=e2847]
      - table [ref=e2848]:
        - rowgroup [ref=e2849]:
          - row [ref=e2850]:
            - columnheader "常见混淆" [ref=e2851]
            - columnheader "纠正" [ref=e2852]
        - rowgroup [ref=e2853]:
          - row [ref=e2854]:
            - cell "\"原子性就是事务不可分割\"" [ref=e2855]
            - cell "正确，但更多强调\"要么全做要么全不做\"" [ref=e2856]
          - row [ref=e2857]:
            - cell "\"一致性靠 DBMS 自动保证\"" [ref=e2858]
            - cell "不完全对，一致性也需要程序员写正确的事务逻辑" [ref=e2859]
          - row [ref=e2860]:
            - cell "\"原子性靠锁实现\"" [ref=e2861]
            - cell [ref=e2862]:
              - text: 错！原子性靠
              - strong [ref=e2863]: Undo Log
              - text: 实现，锁是用来保证隔离性的
          - row [ref=e2864]:
            - cell "\"持久性 = 数据存到磁盘\"" [ref=e2865]
            - cell [ref=e2866]:
              - text: 不完全对，持久性靠
              - strong [ref=e2867]: Redo Log + WAL
              - text: 保证，不是直接写数据到磁盘
      - paragraph [ref=e2868]:
        - strong [ref=e2869]: 类比
        - text: ：银行转账——A 扣 100 元、B 加 100 元。
      - list [ref=e2870]:
        - listitem [ref=e2871]:
          - strong [ref=e2872]: 原子性
          - text: ：A 扣款和 B 加款要么都做要么都不做（UNDO 撤消半途而废的）
        - listitem [ref=e2873]:
          - strong [ref=e2874]: 一致性
          - text: ：总金额 1000 → 转账后还是 1000（业务规则保证）
        - listitem [ref=e2875]:
          - strong [ref=e2876]: 隔离性
          - text: ：转账时别人不能同时操作 A 或 B 账号（锁 + MVCC）
        - listitem [ref=e2877]:
          - strong [ref=e2878]: 持久性
          - text: ：转账提交后，钱就真的到账了，断电也不丢（REDO 重做）
      - heading "13.2 并发操作带来的四种问题（重点）⭐⭐⭐" [level=3] [ref=e2879]
      - paragraph [ref=e2880]: 当多个事务并发执行时，如果不加以控制，会产生以下四种问题。这四种问题是数据库中最高频的考点之一。
      - heading "13.2.1 丢失修改（Lost Update）—— 写-写冲突" [level=4] [ref=e2881]
      - paragraph [ref=e2882]:
        - strong [ref=e2883]: 场景演示
        - text: ：两个事务同时读取同一行并修改，后提交的覆盖前提交的。
      - table [ref=e2884]:
        - rowgroup [ref=e2885]:
          - row [ref=e2886]:
            - columnheader "时间" [ref=e2887]
            - columnheader "事务 T1" [ref=e2888]
            - columnheader "事务 T2" [ref=e2889]
        - rowgroup [ref=e2890]:
          - row [ref=e2891]:
            - cell "t1" [ref=e2892]
            - cell [ref=e2893]:
              - code [ref=e2894]: READ(A)
              - text: → 读到 1000
            - cell [ref=e2895]
          - row [ref=e2896]:
            - cell "t2" [ref=e2897]
            - cell [ref=e2898]
            - cell [ref=e2899]:
              - code [ref=e2900]: READ(A)
              - text: → 读到 1000
          - row [ref=e2901]:
            - cell "t3" [ref=e2902]
            - cell [ref=e2903]:
              - text: A = A - 100 →
              - code [ref=e2904]: WRITE(A, 900)
            - cell [ref=e2905]
          - row [ref=e2906]:
            - cell "t4" [ref=e2907]
            - cell "COMMIT" [ref=e2908]
            - cell [ref=e2909]
          - row [ref=e2910]:
            - cell "t5" [ref=e2911]
            - cell [ref=e2912]
            - cell [ref=e2913]:
              - text: A = A - 200 →
              - code [ref=e2914]: WRITE(A, 800)
          - row [ref=e2915]:
            - cell "t6" [ref=e2916]
            - cell [ref=e2917]
            - cell "COMMIT" [ref=e2918]
      - paragraph [ref=e2919]:
        - strong [ref=e2920]: 最终
        - text: ：A = 800，但正确结果应该是 1000 - 100 - 200 = 700。T1 的 -100 被 T2 覆盖消失了！
      - paragraph [ref=e2921]:
        - strong [ref=e2922]: 本质
        - text: ：写-写冲突。两个事务改了同一数据，后面的事务不知道前面的事务修改过。
      - paragraph [ref=e2923]:
        - strong [ref=e2924]: 解决方案
        - text: ：
      - list [ref=e2925]:
        - listitem [ref=e2926]:
          - text: 加
          - strong [ref=e2927]: 排他锁（X 锁）
          - text: ：T1 读 A 时就加 X 锁，T2 必须等 T1 释放锁后才能读
        - listitem [ref=e2928]:
          - text: 或使用
          - strong [ref=e2929]: 乐观锁
          - text: （版本号机制）
      - heading "13.2.2 脏读（Dirty Read）—— 读到了未提交的\"脏\"数据" [level=4] [ref=e2930]
      - paragraph [ref=e2931]:
        - strong [ref=e2932]: 场景演示
        - text: ：T1 读到了 T2 修改但未提交的数据，后来 T2 回滚了。
      - table [ref=e2933]:
        - rowgroup [ref=e2934]:
          - row [ref=e2935]:
            - columnheader "时间" [ref=e2936]
            - columnheader "事务 T1" [ref=e2937]
            - columnheader "事务 T2" [ref=e2938]
        - rowgroup [ref=e2939]:
          - row [ref=e2940]:
            - cell "t1" [ref=e2941]
            - cell [ref=e2942]
            - cell [ref=e2943]:
              - code [ref=e2944]: READ(A)
              - text: → 读到 1000
          - row [ref=e2945]:
            - cell "t2" [ref=e2946]
            - cell [ref=e2947]
            - cell [ref=e2948]:
              - text: A = 2000 →
              - code [ref=e2949]: WRITE(A, 2000)
              - text: （未提交）
          - row [ref=e2950]:
            - cell "t3" [ref=e2951]
            - cell [ref=e2952]:
              - code [ref=e2953]: READ(A)
              - text: → 读到 2000 ← 读到脏数据！
            - cell [ref=e2954]
          - row [ref=e2955]:
            - cell "t4" [ref=e2956]
            - cell [ref=e2957]
            - cell [ref=e2958]:
              - strong [ref=e2959]: ROLLBACK
              - text: （回滚，A 恢复为 1000）
      - paragraph [ref=e2960]: T1 读到的 2000 是"脏数据"——它来自于一个后来回滚的事务，实际上 A 的值一直是 1000。
      - paragraph [ref=e2961]:
        - strong [ref=e2962]: 本质
        - text: ：读到了其他事务
        - strong [ref=e2963]: 未提交
        - text: 的修改。
      - paragraph [ref=e2964]:
        - strong [ref=e2965]: 解决方案
        - text: ：将隔离级别设为**读已提交（Read Committed）**或更高。
