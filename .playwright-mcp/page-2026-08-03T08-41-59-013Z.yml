          - text: 恢复
      - heading "14.2 数据转储（备份）⭐⭐" [level=3] [ref=e3903]
      - paragraph [ref=e3904]: 数据转储就是定期把数据库完整复制到另一个存储介质（磁带、磁盘、云存储等）上。这是数据库恢复的基础手段。
