      - paragraph [ref=e4634]:
        - strong [ref=e4635]: B+ 树索引原理
        - text: ：
      - list [ref=e4636]:
        - listitem [ref=e4637]: 数据全在叶子节点，非叶子节点只存索引键
        - listitem [ref=e4638]:
          - text: 叶子节点之间用
          - strong [ref=e4639]: 双向链表
          - text: 连接，支持高效范围查询
        - listitem [ref=e4640]: 所有叶子在同一层，查询效率稳定
        - listitem [ref=e4641]: 数据库索引几乎都用 B+ 树而不是 B 树
      - paragraph [ref=e4642]:
        - strong [ref=e4643]: 查询优化核心原则
        - text: ：
      - list [ref=e4644]:
        - listitem [ref=e4645]:
          - strong [ref=e4646]: 选择操作尽可能先做
          - text: （先过滤再连接，减少数据量）
        - listitem [ref=e4647]: 小表驱动大表
        - listitem [ref=e4648]:
          - text: 避免
          - code [ref=e4649]: SELECT *
          - text: ，只选需要的列
        - listitem [ref=e4650]: WHERE 条件中用索引列，避免在索引列上使用函数
        - listitem [ref=e4651]:
          - text: 复合索引注意
          - strong [ref=e4652]: 最左前缀原则
      - heading "15.7 数据库安全 ⭐" [level=3] [ref=e4653]
      - paragraph [ref=e4654]: 数据库安全是指保护数据库免受非授权访问、恶意破坏和意外泄露。安全保护主要包括以下四个层面：
      - heading "数据库安全的四个层面" [level=4] [ref=e4655]
      - table [ref=e4656]:
