      - heading "知识点 10：数据库基本概念" [level=2] [ref=e78]
      - blockquote [ref=e79]:
        - paragraph [ref=e80]: ⭐中频 —— 三级模式两级映像、DB/DBMS/DBS 概念辨析是基础题
      - heading "10.1 数据的四级概念——从底层到顶层" [level=3] [ref=e81]
      - paragraph [ref=e82]: 这是数据库系统中最基础也最容易混淆的四个概念，必须逐层区分清楚：
      - code [ref=e84]: 数据（Data） └── 数据库（DB, Database） └── 数据库管理系统（DBMS, Database Management System） └── 数据库系统（DBS, Database System）
      - heading "逐层解析" [level=4] [ref=e85]
      - table [ref=e86]:
        - rowgroup [ref=e87]:
          - row [ref=e88]:
            - columnheader "层级" [ref=e89]
            - columnheader "术语" [ref=e90]
            - columnheader "定义" [ref=e91]
            - columnheader "大白话" [ref=e92]
            - columnheader "类比" [ref=e93]
        - rowgroup [ref=e94]:
          - row [ref=e95]:
            - cell "第一层" [ref=e96]
            - cell [ref=e97]:
              - strong [ref=e98]: 数据（Data）
            - cell "描述事物的符号记录，是信息的载体" [ref=e99]
            - cell "最原始的数字、文字、图片等" [ref=e100]
            - cell "仓库里的一件件货物" [ref=e101]
          - row [ref=e102]:
            - cell "第二层" [ref=e103]
            - cell [ref=e104]:
              - strong [ref=e105]: 数据库（DB）
            - cell "长期存储在计算机内、有组织、可共享的大量数据的集合" [ref=e106]
            - cell "把数据按照一定结构存起来的\"大仓库\"" [ref=e107]
            - cell "整座仓库" [ref=e108]
          - row [ref=e109]:
            - cell "第三层" [ref=e110]
            - cell [ref=e111]:
              - strong [ref=e112]: 数据库管理系统（DBMS）
            - cell "位于用户与操作系统之间的一层数据管理软件，负责科学地组织和存储数据、高效地获取和维护数据" [ref=e113]
            - cell "管理仓库的\"管理员软件\"" [ref=e114]
            - cell "仓库管理员（管理软件）" [ref=e115]
          - row [ref=e116]:
            - cell "第四层" [ref=e117]
            - cell [ref=e118]:
              - strong [ref=e119]: 数据库系统（DBS）
            - cell "由数据库、DBMS、应用程序、数据库管理员（DBA）组成的整体系统" [ref=e120]
            - cell "仓库 + 管理员 + 操作手册 + 人的总和" [ref=e121]
            - cell "仓库、管理员、操作手册加在一起" [ref=e122]
      - paragraph [ref=e123]:
        - strong [ref=e124]: 易错点
        - text: ：很多人说"装了一个数据库"，严格来说装的是 DBMS（如 MySQL）。数据库（DB）是 DBMS 管理下的数据集合。考试中要注意选项的精确表述。
      - paragraph [ref=e125]:
        - strong [ref=e126]: 记忆口诀
        - text: ：数据是原材料 → DB 是仓库 → DBMS 是管理员 → DBS 是整个体系。
      - separator [ref=e127]
      - heading "10.2 DBMS 的主要功能 ⭐" [level=3] [ref=e128]
      - paragraph [ref=e129]: DBMS（数据库管理系统）是数据库系统的核心软件，它位于用户和操作系统之间，负责对数据库进行统一管理和控制。考试中常考 DBMS 的六大功能：
      - table [ref=e130]:
        - rowgroup [ref=e131]:
          - row [ref=e132]:
            - columnheader "功能" [ref=e133]
            - columnheader "大白话" [ref=e134]
            - columnheader "具体内容" [ref=e135]
            - columnheader "关键命令/机制" [ref=e136]
        - rowgroup [ref=e137]:
          - row [ref=e138]:
            - cell [ref=e139]:
              - strong [ref=e140]: 数据定义
            - cell "建表、定义结构" [ref=e141]
            - cell "提供数据定义语言（DDL），定义数据库中的各种对象" [ref=e142]
            - cell [ref=e143]:
              - code [ref=e144]: CREATE
              - text: 、
              - code [ref=e145]: ALTER
              - text: 、
              - code [ref=e146]: DROP
          - row [ref=e147]:
            - cell [ref=e148]:
              - strong [ref=e149]: 数据操纵
            - cell "增删改查" [ref=e150]
            - cell "提供数据操纵语言（DML/DQL），对数据进行增删改查" [ref=e151]
            - cell [ref=e152]:
              - code [ref=e153]: INSERT
              - text: 、
              - code [ref=e154]: UPDATE
              - text: 、
              - code [ref=e155]: DELETE
              - text: 、
              - code [ref=e156]: SELECT
          - row [ref=e157]:
            - cell [ref=e158]:
              - strong [ref=e159]: 数据库运行管理
            - cell "保证安全、稳定" [ref=e160]
            - cell "并发控制、安全性检查、完整性约束检查、日志记录" [ref=e161]
            - cell "事务管理、封锁机制、WAL" [ref=e162]
          - row [ref=e163]:
            - cell [ref=e164]:
              - strong [ref=e165]: 数据库建立和维护
            - cell "日常保养" [ref=e166]
            - cell "数据装载、转储、恢复、重组、性能监控" [ref=e167]
            - cell "备份恢复、性能调优" [ref=e168]
          - row [ref=e169]:
            - cell [ref=e170]:
              - strong [ref=e171]: 数据组织、存储和管理
            - cell "底层存储" [ref=e172]
            - cell "数据字典、索引、数据文件的组织方式" [ref=e173]
            - cell "B+树索引、聚簇、分区" [ref=e174]
          - row [ref=e175]:
            - cell [ref=e176]:
              - strong [ref=e177]: 通信功能
            - cell "与外界交互" [ref=e178]
            - cell "与操作系统联机处理、分时系统、远程作业输入" [ref=e179]
            - cell "网络协议、ODBC/JDBC" [ref=e180]
      - paragraph [ref=e181]:
        - strong [ref=e182]: 考试重点
        - text: ：DBMS 是"位于用户和操作系统之间的一层数据管理软件"，是数据库系统的
        - strong [ref=e183]: 核心
        - text: 。数据定义和操纵是最基本的两大功能。
      - paragraph [ref=e184]:
        - strong [ref=e185]: 记忆口诀
        - text: ：DBMS 六大功能——定义（DDL）、操纵（DML）、运行管理（事务/安全）、维护（备份/恢复）、存储管理（索引/字典）、通信（网络）。
      - separator [ref=e186]
      - heading "10.2b 三种数据模型详细对比（层次 vs 网状 vs 关系）⭐" [level=3] [ref=e187]
      - paragraph [ref=e188]: 数据模型是数据库系统的核心和基础。逻辑数据模型主要有三种类型，考试中常考它们的对比：
      - table [ref=e189]:
        - rowgroup [ref=e190]:
          - row [ref=e191]:
            - columnheader "对比维度" [ref=e192]
            - columnheader "层次模型（Hierarchical）" [ref=e193]
            - columnheader "网状模型（Network）" [ref=e194]
            - columnheader "关系模型（Relational）" [ref=e195]
        - rowgroup [ref=e196]:
          - row [ref=e197]:
            - cell [ref=e198]:
              - strong [ref=e199]: 数据结构
            - cell "树形结构（有根节点，一个子节点只能有一个父节点）" [ref=e200]
            - cell "图结构（有向图，一个子节点可以有多个父节点）" [ref=e201]
            - cell "二维表（行 + 列）" [ref=e202]
          - row [ref=e203]:
            - cell [ref=e204]:
              - strong [ref=e205]: 表示方式
            - cell "倒立的树，节点表示记录型" [ref=e206]
            - cell "结点 + 有向边（系，set）" [ref=e207]
            - cell "关系 = 表，元组 = 行，属性 = 列" [ref=e208]
          - row [ref=e209]:
            - cell [ref=e210]:
              - strong [ref=e211]: 数据联系
            - cell "一对多（1:N）为主" [ref=e212]
            - cell "多对多（M:N）可以直接表示" [ref=e213]
            - cell "通过外键（Foreign Key）关联" [ref=e214]
          - row [ref=e215]:
            - cell [ref=e216]:
              - strong [ref=e217]: 查询方式
            - cell "从根节点逐层向下导航" [ref=e218]
            - cell "沿着指针链路导航" [ref=e219]
            - cell "声明式 SQL（告诉系统\"要什么\"而不是\"怎么找\"）" [ref=e220]
          - row [ref=e221]:
            - cell [ref=e222]:
              - strong [ref=e223]: 数据独立性
            - cell "差（物理存储细节暴露给用户）" [ref=e224]
            - cell "较差（导航路径依赖物理存储）" [ref=e225]
            - cell "好（三级模式两级映像机制）" [ref=e226]
          - row [ref=e227]:
            - cell [ref=e228]:
              - strong [ref=e229]: 典型代表
            - cell "IMS（IBM 1968）" [ref=e230]
            - cell "DBTG（CODASYL 1971）" [ref=e231]
            - cell "Oracle、MySQL、PostgreSQL" [ref=e232]
          - row [ref=e233]:
            - cell [ref=e234]:
              - strong [ref=e235]: 优点
            - cell "结构简单清晰，查询效率高（适合1:N固定查询）" [ref=e236]
            - cell "能直接描述现实世界中多对多的复杂关系，存取效率高" [ref=e237]
            - cell "数据结构简单（表），有严格的数学理论（关系代数），数据独立性高" [ref=e238]
          - row [ref=e239]:
            - cell [ref=e240]:
              - strong [ref=e241]: 缺点
            - cell "不能直接表示 M:N 关系；插入删除异常多；查询必须从根开始" [ref=e242]
            - cell "结构复杂，DBA 和程序员负担重；编写应用程序困难" [ref=e243]
            - cell "语义表达能力有限（不如 E-R 图直观）；查询效率可能不如导航式" [ref=e244]
          - row [ref=e245]:
            - cell [ref=e246]:
              - strong [ref=e247]: 当前状态
            - cell "已淘汰" [ref=e248]
            - cell "已淘汰" [ref=e249]
            - cell [ref=e250]:
              - strong [ref=e251]: 绝对主流
      - paragraph [ref=e252]:
        - strong [ref=e253]: 易错点
        - text: ：
      - list [ref=e254]:
        - listitem [ref=e255]: 层次模型的"一个子节点只能有一个父节点"是核心限制，这导致 M:N 关系必须拆成多个树
        - listitem [ref=e256]: 网状模型突破了层次模型的限制，但复杂度太高，最终被关系模型取代
        - listitem [ref=e257]: 关系模型用的是"二维表"而非"树"或"图"，这是判断数据模型类型的速解方法
      - paragraph [ref=e258]:
        - strong [ref=e259]: 记忆口诀
        - text: ：层次像家族树（一个爹），网状像蜘蛛网（多个爹），关系像 Excel 表（二维格）。
      - separator [ref=e260]
      - heading "10.3 DB / DBMS / DBS 三者关系" [level=3] [ref=e261]
      - paragraph [ref=e262]: 这三个概念的关系就像是"仓库、仓库管理员、仓库管理系统"：
      - table [ref=e263]:
        - rowgroup [ref=e264]:
          - row [ref=e265]:
            - columnheader "术语" [ref=e266]
            - columnheader "全称" [ref=e267]
            - columnheader "大白话" [ref=e268]
            - columnheader "类比" [ref=e269]
        - rowgroup [ref=e270]:
          - row [ref=e271]:
            - cell [ref=e272]:
              - strong [ref=e273]: DB
              - text: （数据库）
            - cell "Database" [ref=e274]
            - cell "存放数据的\"大仓库\"" [ref=e275]
            - cell "仓库里的货物" [ref=e276]
          - row [ref=e277]:
            - cell [ref=e278]:
              - strong [ref=e279]: DBMS
              - text: （数据库管理系统）
            - cell "Database Management System" [ref=e280]
            - cell "管理数据的\"仓库管理员\"（软件）" [ref=e281]
            - cell "仓库管理员" [ref=e282]
          - row [ref=e283]:
            - cell [ref=e284]:
              - strong [ref=e285]: DBS
              - text: （数据库系统）
            - cell "Database System" [ref=e286]
            - cell "\"仓库 + 管理员 + 规章制度\"的整体" [ref=e287]
            - cell "仓库、管理员、操作手册加在一起" [ref=e288]
      - paragraph [ref=e289]:
        - strong [ref=e290]: 记忆口诀
        - text: ：DB 是数据本身，DBMS 是管理软件，DBS = DB + DBMS + 人 + 规则，是更大的概念。
      - separator [ref=e291]
      - heading "易错点 1：\"DBMS 就是数据库\" ❌" [level=4] [ref=e292]
      - paragraph [ref=e293]: 很多初学者把 DBMS 说成"数据库"，比如"我装了一个 MySQL 数据库"——严格说，MySQL 是 DBMS，里面管理的那个数据仓库才是 DB。考试里要注意区分。
      - separator [ref=e294]
      - heading "10.4 数据库系统 vs 文件系统 ⭐" [level=3] [ref=e295]
      - paragraph [ref=e296]: "\"为什么不直接用 Excel 存数据，非要搞数据库？\""
      - table [ref=e297]:
        - rowgroup [ref=e298]:
          - row [ref=e299]:
            - columnheader "对比维度" [ref=e300]
            - columnheader "文件系统" [ref=e301]
            - columnheader "数据库系统" [ref=e302]
        - rowgroup [ref=e303]:
          - row [ref=e304]:
            - cell [ref=e305]:
              - strong [ref=e306]: 数据冗余
            - cell "各文件各自存，同一数据多处重复存储" [ref=e307]
            - cell "集中管理，数据共享，冗余度小" [ref=e308]
          - row [ref=e309]:
            - cell [ref=e310]:
              - strong [ref=e311]: 数据一致性
            - cell "一个数据改多处容易遗漏，不一致" [ref=e312]
