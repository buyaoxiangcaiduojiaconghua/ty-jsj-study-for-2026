      - heading "15.5 模式分解 ⭐⭐" [level=3] [ref=e4494]
      - paragraph [ref=e4495]: 模式分解是将一个关系模式分解为多个关系模式，目的是消除数据冗余和操作异常。
      - heading "分解的目标" [level=4] [ref=e4496]
      - table [ref=e4497]:
        - rowgroup [ref=e4498]:
          - row [ref=e4499]:
            - columnheader "目标" [ref=e4500]
            - columnheader "含义" [ref=e4501]
            - columnheader "大白话" [ref=e4502]
        - rowgroup [ref=e4503]:
          - row [ref=e4504]:
            - cell [ref=e4505]:
              - strong [ref=e4506]: 无损连接分解
            - cell [ref=e4507]:
              - text: 分解后自然连接能
              - strong [ref=e4508]: 精确恢复
              - text: 原关系，既不丢元组也不多出元组
            - cell "\"拆开了还能拼回去，不多也不少\"" [ref=e4509]
          - row [ref=e4510]:
            - cell [ref=e4511]:
              - strong [ref=e4512]: 保持函数依赖分解
            - cell [ref=e4513]:
              - text: 分解后各子模式的函数依赖并集
              - strong [ref=e4514]: 等价于
              - text: 原函数依赖集
            - cell "\"原来有哪些约束，拆开后还能推导出来\"" [ref=e4515]
      - heading "无损连接分解的判断方法" [level=4] [ref=e4516]
      - paragraph [ref=e4517]:
        - strong [ref=e4518]: 二分解判定法
        - text: （将 R 分解为 R1 和 R2 两个子关系）：
      - paragraph [ref=e4519]:
        - text: R 被分解为 R1 和 R2，则分解是无损连接的
        - strong [ref=e4520]: 当且仅当
        - text: ：
      - list [ref=e4521]:
        - listitem [ref=e4522]:
          - strong [ref=e4523]: (R1 ∩ R2) → (R1 - R2)
          - text: 成立，
          - strong [ref=e4524]: 或者
        - listitem [ref=e4525]:
          - strong [ref=e4526]: (R1 ∩ R2) → (R2 - R1)
          - text: 成立
      - paragraph [ref=e4527]: 即：两个子关系的公共属性，能函数决定其中一个子关系的其余属性。
      - paragraph [ref=e4528]:
        - strong [ref=e4529]: 判定步骤
        - text: ：
      - list [ref=e4530]:
        - listitem [ref=e4531]: 计算公共属性集 = R1 ∩ R2
        - listitem [ref=e4532]: 计算 R1 独有属性集 = R1 - R2
        - listitem [ref=e4533]: 计算 R2 独有属性集 = R2 - R1
        - listitem [ref=e4534]: 检查公共属性是否能决定 R1 独有属性，或决定 R2 独有属性
        - listitem [ref=e4535]: 如果任何一个成立 → 无损；都不成立 → 有损
      - paragraph [ref=e4536]:
        - strong [ref=e4537]: 例子
        - text: ：
      - code [ref=e4539]: "R(学号, 姓名, 系名, 系主任)，F = {学号→姓名, 学号→系名, 系名→系主任} 分解1：R1(学号, 姓名, 系名)，R2(系名, 系主任) 公共属性 = 系名 R1独有 = {学号, 姓名} R2独有 = {系主任} 系名→系主任 ∈ F⁺？✅ 是的（已知 F 中就有） → R1 ∩ R2 → R2 - R1 成立 → 无损 ✅ 分解2：R1(学号, 姓名)，R2(系名, 系主任) 公共属性 = ∅（无公共属性） 无法判断依赖 → 有损 ❌"
      - heading "保持函数依赖的判断" [level=4] [ref=e4540]
      - paragraph [ref=e4541]:
        - text: 将 R 分解为 R1, R2, ..., Rn，投影到每个子模式的函数依赖集的
        - strong [ref=e4542]: 并集
        - text: ，如果等价于原函数依赖集 F，则保持函数依赖。
      - paragraph [ref=e4543]:
        - strong [ref=e4544]: 判断步骤
        - text: ：
      - list [ref=e4545]:
        - listitem [ref=e4546]:
          - text: 计算每个子关系 Ri 上的函数依赖投影 π
          - subscript [ref=e4547]: Fi
          - text: (F)
        - listitem [ref=e4548]:
          - text: 取所有投影的并集 G = π
          - subscript [ref=e4549]: F1
          - text: (F) ∪ π
          - subscript [ref=e4550]: F2
          - text: (F) ∪ ... ∪ π
          - subscript [ref=e4551]: Fn
          - text: (F)
        - listitem [ref=e4552]: 检查 G⁺ == F⁺（闭包等价）
      - paragraph [ref=e4553]:
        - strong [ref=e4554]: 保持函数依赖 ≠ 无损连接
        - text: ：
      - list [ref=e4555]:
        - listitem [ref=e4556]: 一个分解可能无损但不保持函数依赖
        - listitem [ref=e4557]: 一个分解可能保持函数依赖但不是无损的
        - listitem [ref=e4558]: 我们追求两者兼得
      - heading "重要结论（考试必考）⭐⭐⭐" [level=4] [ref=e4559]
      - table [ref=e4560]:
        - rowgroup [ref=e4561]:
          - row [ref=e4562]:
            - columnheader "范式" [ref=e4563]
            - columnheader "能否保证无损分解？" [ref=e4564]
            - columnheader "能否保证保持函数依赖？" [ref=e4565]
            - columnheader "能否两者兼顾？" [ref=e4566]
        - rowgroup [ref=e4567]:
          - row [ref=e4568]:
            - cell [ref=e4569]:
              - strong [ref=e4570]: 3NF
            - cell "✅ 能" [ref=e4571]
            - cell "✅ 能" [ref=e4572]
            - cell [ref=e4573]:
              - text: ✅
              - strong [ref=e4574]: 总能同时满足
          - row [ref=e4575]:
            - cell [ref=e4576]:
              - strong [ref=e4577]: BCNF
            - cell "✅ 能" [ref=e4578]
            - cell "❌ 不一定" [ref=e4579]
            - cell "❌ 两者不能同时保证" [ref=e4580]
      - paragraph [ref=e4581]:
        - strong [ref=e4582]: 考试核心结论
        - text: ：3NF 总能实现无损连接且保持函数依赖的分解，BCNF 不一定能保持函数依赖。
      - paragraph [ref=e4583]:
        - strong [ref=e4584]: BCNF 不能保持函数依赖的例子
        - text: ：
      - code [ref=e4586]: "R(城市, 街道, 邮编)，F = {(城市,街道)→邮编, 邮编→城市} 候选码：(城市, 街道) 和 (街道, 邮编) 由于 邮编→城市，而邮编不是候选码，所以不是 BCNF 分解为 R1(邮编, 城市) 和 R2(街道, 邮编) → 都是 BCNF 但是，(城市,街道)→邮编 这个依赖在两个子关系中都丢失了！无法保持函数依赖！"
      - heading "属性闭包的计算方法（求候选码必备）" [level=4] [ref=e4587]
      - paragraph [ref=e4588]:
        - strong [ref=e4589]: 属性闭包
        - text: X⁺：由属性集 X 通过 F 中的函数依赖能够推导出的所有属性的集合。
      - paragraph [ref=e4590]:
        - strong [ref=e4591]: 计算步骤
        - text: ：
      - list [ref=e4592]:
        - listitem [ref=e4593]: 初始化 result = X
        - listitem [ref=e4594]:
          - text: 重复以下步骤直到 result 不再变化：
          - list [ref=e4595]:
            - listitem [ref=e4596]: 对于 F 中每条函数依赖 Y→Z
            - listitem [ref=e4597]: 如果 Y ⊆ result，则将 Z 加入 result（result = result ∪ Z）
        - listitem [ref=e4598]: 返回 result 作为 X⁺
      - paragraph [ref=e4599]:
        - strong [ref=e4600]: 例子
        - text: ：
      - code [ref=e4602]: "R(A, B, C, D)，F = {A→B, B→C, C→D} 求 A⁺： 初始：result = {A} 第1轮：A→B，A⊆result → result = {A, B} 第2轮：B→C，B⊆result → result = {A, B, C} 第3轮：C→D，C⊆result → result = {A, B, C, D} 无变化 → A⁺ = {A, B, C, D} 所以 A 是候选码（A 能推出所有属性）"
      - paragraph [ref=e4603]:
        - strong [ref=e4604]: 用闭包法求候选码
        - text: ：
      - list [ref=e4605]:
        - listitem [ref=e4606]: 如果 X⁺ 包含了 R 的所有属性，则 X 是一个超码
        - listitem [ref=e4607]: 如果 X 的任何真子集的闭包都不包含所有属性，则 X 是候选码
      - heading "15.6 索引与查询优化" [level=3] [ref=e4608]
      - paragraph [ref=e4609]:
        - strong [ref=e4610]: 索引类型
