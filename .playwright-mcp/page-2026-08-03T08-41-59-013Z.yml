        - code [ref=e1960]: FROM A, B WHERE A.id = B.id
        - text: 等价于
        - code [ref=e1961]: INNER JOIN
        - text: ，但现代标准推荐用
        - code [ref=e1962]: JOIN ... ON
        - text: ，逻辑更清晰。考试中两种写法都认识。
