        - rowgroup [ref=e1768]:
          - row [ref=e1769]:
            - cell "1" [ref=e1770]
            - cell "FROM + JOIN" [ref=e1771]
            - cell "加载表，执行连接，生成初始行集" [ref=e1772]
            - cell "\"把要用的表都拿出来\"" [ref=e1773]
          - row [ref=e1774]:
            - cell "2" [ref=e1775]
            - cell "WHERE" [ref=e1776]
            - cell "对每一行做条件过滤" [ref=e1777]
            - cell "\"把不符合条件的行扔掉\"" [ref=e1778]
          - row [ref=e1779]:
            - cell "3" [ref=e1780]
            - cell "GROUP BY" [ref=e1781]
