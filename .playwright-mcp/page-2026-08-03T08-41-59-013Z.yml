      - heading "三层模式（自上而下）" [level=4] [ref=e671]
      - code [ref=e673]: ┌──────────────────────────────────────┐ │ 外模式（External Schema / 子模式） │ ← 用户看到的视图（View），可以有多个 │ 针对不同用户定制的"视野" │ 应用程序的接口，每个应用有自己的外模式 │ 数目：多个 │ ├──────────────────────────────────────┤ │ 模式（Conceptual Schema / 逻辑模式） │ ← 数据库的全局逻辑结构，只有一个 │ 所有数据的全局逻辑蓝图 │ 定义所有表、字段、类型、约束 │ 数目：唯一 │ ├──────────────────────────────────────┤ │ 内模式（Internal Schema / 存储模式） │ ← 数据在磁盘上怎么存的，只有一个 │ 物理存储细节 │ 定义文件组织、索引方式、数据压缩 │ 数目：唯一 │ └──────────────────────────────────────┘
