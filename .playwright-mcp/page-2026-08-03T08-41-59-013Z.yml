            - columnheader "大白话" [ref=e5223]
            - columnheader "范式关系" [ref=e5224]
        - rowgroup [ref=e5225]:
          - row [ref=e5226]:
            - cell "完全函数依赖" [ref=e5227]
            - cell "非主属性依赖整个候选码，缺任何一个属性都不行" [ref=e5228]
            - cell "必须用完整主键才能确定这个值" [ref=e5229]
            - cell "满足 2NF 的前提" [ref=e5230]
          - row [ref=e5231]:
            - cell "部分函数依赖" [ref=e5232]
            - cell [ref=e5233]:
              - text: 非主属性只依赖候选码的
              - strong [ref=e5234]: 一部分
            - cell "主键的某一部分就够确定这个值了" [ref=e5235]
            - cell "违反 2NF" [ref=e5236]
          - row [ref=e5237]:
            - cell "传递函数依赖" [ref=e5238]
            - cell "非主属性 A → 非主属性 B → 候选码 这种链" [ref=e5239]
            - cell "A 不直接依赖主键，而是通过 B 间接依赖" [ref=e5240]
            - cell "违反 3NF" [ref=e5241]
      - heading "4.3 范式判断快速模板" [level=4] [ref=e5242]
      - paragraph [ref=e5243]:
        - strong [ref=e5244]: "给定关系模式 R(A, B, C, D)，函数依赖集 F = {A→B, B→C, ...}，判断最高满足第几范式。"
      - code [ref=e5246]: 第1步：求候选码 → 闭包法 第2步：列出所有非主属性 第3步：检查非主属性是否完全函数依赖于候选码（2NF） 第4步：检查非主属性之间是否存在传递依赖（3NF）
      - heading "4.4 范式判断经典例题" [level=4] [ref=e5247]
      - blockquote [ref=e5248]:
        - paragraph [ref=e5249]:
          - strong [ref=e5250]: 例题
          - text: "：关系模式 R(学号, 课程号, 成绩, 教师姓名, 教师职称)，F = { (学号,课程号)→成绩, (学号,课程号)→教师姓名, 课程号→教师姓名, 教师姓名→教师职称 }，候选码为 (学号, 课程号)。"
        - paragraph [ref=e5251]:
          - strong [ref=e5252]: 判断
          - text: ：
        - list [ref=e5253]:
          - listitem [ref=e5254]: 1NF：✅（所有属性原子性）
          - listitem [ref=e5255]: 2NF：❌，因为"教师姓名"只依赖于"课程号"（候选码的一部分），存在部分函数依赖
          - listitem [ref=e5256]:
            - text: 最高满足
            - strong [ref=e5257]: 1NF
      - blockquote [ref=e5258]:
        - paragraph [ref=e5259]:
          - strong [ref=e5260]: 例题
          - text: "：关系模式 R(学号, 姓名, 系号, 系主任)，F = { 学号→姓名, 学号→系号, 系号→系主任 }，候选码为 学号。"
        - paragraph [ref=e5261]:
          - strong [ref=e5262]: 判断
          - text: ：
        - list [ref=e5263]:
          - listitem [ref=e5264]: 1NF：✅
          - listitem [ref=e5265]: 2NF：✅（候选码是单属性，不存在部分依赖问题）
          - listitem [ref=e5266]: 3NF：❌，因为 学号→系号→系主任，存在传递函数依赖
          - listitem [ref=e5267]:
            - text: 最高满足
            - strong [ref=e5268]: 2NF
      - heading "4.5 BCNF 判断速解" [level=4] [ref=e5269]
      - paragraph [ref=e5270]:
        - strong [ref=e5271]: BCNF 是 3NF 的加强版
        - text: ：3NF 只要求非主属性不传递依赖，BCNF 要求
        - strong [ref=e5272]: 所有决定因素都必须是候选码
        - text: 。
      - paragraph [ref=e5273]:
        - strong [ref=e5274]: 判断口诀
        - text: ：看函数依赖集的
        - strong [ref=e5275]: 左边
        - text: （决定因素）是否都是候选码。如果存在一个函数依赖
        - code [ref=e5276]: X→Y
        - text: ，其中 X 不是候选码 → 不满足 BCNF。
      - paragraph [ref=e5277]:
        - strong [ref=e5278]: 经典 BCNF 例题
        - text: "：R(S, J, T)，S=学生, J=课程, T=老师，F = { SJ→T, T→J }。候选码为 (S,J) 和 (S,T)。"
      - list [ref=e5279]:
        - listitem [ref=e5280]: 3NF：✅（没有非主属性——所有属性都是主属性）
        - listitem [ref=e5281]: BCNF：❌，因为 T→J 中 T 不是候选码
        - listitem [ref=e5282]:
          - text: 最高满足
          - strong [ref=e5283]: 3NF
      - heading "4.6 范式易错陷阱" [level=4] [ref=e5284]
      - table [ref=e5285]:
        - rowgroup [ref=e5286]:
          - row [ref=e5287]:
