            - cell "❌ 防" [ref=e3351]
            - cell "❌ 防" [ref=e3352]
            - cell "❌ 防" [ref=e3353]
            - cell "允许（标准）" [ref=e3354]
            - cell "MVCC（事务期间复用同一ReadView）" [ref=e3355]
            - cell "MySQL InnoDB 默认" [ref=e3356]
          - row [ref=e3357]:
            - cell [ref=e3358]:
              - strong [ref=e3359]: SERIALIZABLE
              - text: （可串行化）
            - cell "❌ 防" [ref=e3360]
            - cell "❌ 防" [ref=e3361]
            - cell "❌ 防" [ref=e3362]
            - cell "❌ 防" [ref=e3363]
            - cell "表锁/范围锁，所有事务串行执行" [ref=e3364]
            - cell "极少使用" [ref=e3365]
      - paragraph [ref=e3366]:
        - strong [ref=e3367]: 说明
        - text: ：丢失修改通过写锁（X 锁）在所有隔离级别都能防止，所以全部标注为"防"。
      - heading "MySQL InnoDB 的特殊之处" [level=4] [ref=e3368]
      - paragraph [ref=e3369]:
        - text: MySQL InnoDB 的
        - strong [ref=e3370]: REPEATABLE READ
        - text: 级别通过**间隙锁（Gap Lock）+ 临键锁（Next-Key Lock）**也解决了幻读，优于 SQL 标准的要求。
      - table [ref=e3371]:
        - rowgroup [ref=e3372]:
