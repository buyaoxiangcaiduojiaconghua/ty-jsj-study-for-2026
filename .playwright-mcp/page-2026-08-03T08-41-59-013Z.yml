      - paragraph [ref=e2356]:
        - strong [ref=e2357]: B+ 树的核心特点（考试必考）
        - text: ：
      - list [ref=e2358]:
        - listitem [ref=e2359]:
          - strong [ref=e2360]: 所有数据都在叶子节点
          - text: ，非叶子节点只存索引键值
        - listitem [ref=e2361]:
          - strong [ref=e2362]: 叶子节点之间用双向链表连接
          - text: ，支持高效的范围查询（
          - code [ref=e2363]: BETWEEN
          - text: 、
          - code [ref=e2364]: ">"
          - text: 、
          - code [ref=e2365]: <
          - text: ）
        - listitem [ref=e2366]:
          - strong [ref=e2367]: 所有叶子节点在同一层
          - text: ，每次查询的 IO 次数相同（稳定）
        - listitem [ref=e2368]:
          - strong [ref=e2369]: 树的高度很低
          - text: （3-4层就能存上亿数据），查询效率高
      - code [ref=e2371]: B+ 树结构示意图： [30 | 60] ← 根节点（只存索引键） / | \ [10|20] [40|50] [70|80] ← 内部节点（只存索引键） / | \ / | \ / | \ [1]→[10]→[20]→[30]→[40]→...→[80] ← 叶子节点（存全部数据，链表连接）
      - paragraph [ref=e2372]:
        - strong [ref=e2373]: B+ 树查询过程
        - text: ：从根节点出发，通过索引键值层层定位到叶子节点，在叶子节点中找到目标数据。每次查询的路径长度 = 树的高度。
      - paragraph [ref=e2374]:
        - strong [ref=e2375]: 为什么数据库索引几乎都用 B+ 树而不用 B 树？
      - list [ref=e2376]:
        - listitem [ref=e2377]: B+ 树的数据全在叶子，非叶子只存键 → 非叶子可以存更多键 → 树更矮 → IO 更少
        - listitem [ref=e2378]: B+ 树叶子有链表 → 范围查询直接扫描链表（快）
        - listitem [ref=e2379]: B+ 树查询效率稳定（每次都到叶子）
      - heading "最左前缀原则 ⭐⭐⭐（必考）" [level=4] [ref=e2380]
      - paragraph [ref=e2381]:
        - strong [ref=e2382]: 定义
        - text: ：对于复合索引（多列索引），查询条件必须从索引的最左边列开始匹配，且不能跳过中间的列，索引才会被使用。
      - paragraph [ref=e2383]:
        - strong [ref=e2384]: 示例
        - text: ：有一个复合索引
        - code [ref=e2385]: INDEX idx_abc (a, b, c)
        - text: ，相当于创建了三个索引：
      - list [ref=e2386]:
        - listitem [ref=e2387]:
          - code [ref=e2388]: (a)
        - listitem [ref=e2389]:
          - code [ref=e2390]: (a, b)
        - listitem [ref=e2391]:
          - code [ref=e2392]: (a, b, c)
