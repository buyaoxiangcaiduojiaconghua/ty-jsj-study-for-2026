      - heading "详细例子" [level=5] [ref=e1941]
      - paragraph [ref=e1942]: 假设有两张表：
      - code [ref=e1944]: "学生表 S: 选课表 SC: ┌──────┬──────┐ ┌──────┬──────┬───────┐ │ 学号 │ 姓名 │ │ 学号 │ 课程 │ 成绩 │ ├──────┼──────┤ ├──────┼──────┼───────┤ │ 001 │ 张三 │ │ 001 │ 数学 │ 85 │ │ 002 │ 李四 │ │ 001 │ 英语 │ 90 │ │ 003 │ 王五 │ │ 003 │ 数学 │ 78 │ └──────┴──────┘ └──────┴──────┴───────┘"
      - paragraph [ref=e1945]:
        - strong [ref=e1946]: 内连接结果
        - text: （INNER JOIN ON S.学号 = SC.学号）：
      - code [ref=e1948]: ┌──────┬──────┬──────┬───────┐ │ 学号 │ 姓名 │ 课程 │ 成绩 │ ├──────┼──────┼──────┼───────┤ │ 001 │ 张三 │ 数学 │ 85 │ │ 001 │ 张三 │ 英语 │ 90 │ │ 003 │ 王五 │ 数学 │ 78 │ └──────┴──────┴──────┴───────┘ -- 李四(002)没有选课记录，被丢弃了
      - paragraph [ref=e1949]:
        - strong [ref=e1950]: 左外连接结果
        - text: （LEFT JOIN ON S.学号 = SC.学号）：
      - code [ref=e1952]: ┌──────┬──────┬──────┬───────┐ │ 学号 │ 姓名 │ 课程 │ 成绩 │ ├──────┼──────┼──────┼───────┤ │ 001 │ 张三 │ 数学 │ 85 │ │ 001 │ 张三 │ 英语 │ 90 │ │ 002 │ 李四 │ NULL │ NULL │ ← 李四保留，右边填空 │ 003 │ 王五 │ 数学 │ 78 │ └──────┴──────┴──────┴───────┘
      - paragraph [ref=e1953]:
        - strong [ref=e1954]: 交叉连接结果
        - text: （CROSS JOIN）—— 3×3 = 9 行，全排列：
