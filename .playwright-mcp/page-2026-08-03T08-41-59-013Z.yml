      - paragraph [ref=e4711]:
        - text: 用户对数据对象的权限由数据的所有者自主决定。通过 SQL 的
        - code [ref=e4712]: GRANT
        - text: 和
        - code [ref=e4713]: REVOKE
        - text: 实现。
      - code [ref=e4715]: "-- 授予权限 GRANT SELECT, INSERT ON 学生 TO user1; GRANT ALL PRIVILEGES ON 学生 TO user2 WITH GRANT OPTION; -- WITH GRANT OPTION：允许 user2 将权限转授给其他人 -- 回收权限 REVOKE INSERT ON 学生 FROM user1; REVOKE SELECT ON 学生 FROM user2 CASCADE; -- CASCADE：级联回收（收回 user2 的权限，同时收回他转授出去的所有权限）"
      - paragraph [ref=e4716]:
        - strong [ref=e4717]: （二）强制存取控制（MAC, Mandatory Access Control）
      - paragraph [ref=e4718]: 系统给每个数据对象和每个用户都分配安全级别，按"上读下写"原则控制：
