<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家电网计算机类 — 备考笔记阅读器</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fa;
  --sidebar-bg: #ffffff;
  --content-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #636e72;
  --border: #e0e4e8;
  --tab-active: #2563eb;
  --tab-active-bg: #eff6ff;
  --tab-hover: #f0f4f8;
  --toc-active: #2563eb;
  --toc-active-bg: #eff6ff;
  --code-bg: #f4f5f7;
  --table-stripe: #f8fafc;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 6px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== 顶部标签栏 ========== */
#tab-bar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  overflow-x: auto;
  padding: 0 12px;
  gap: 2px;
  box-shadow: var(--shadow);
  z-index: 10;
}
#tab-bar button {
  flex-shrink: 0;
  padding: 12px 16px;
  border: none;
  background: transparent;
  font-size: 14px;
  color: var(--text-light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: inherit;
}
#tab-bar button:hover { color: var(--tab-active); background: var(--tab-hover); }
#tab-bar button.active {
  color: var(--tab-active);
  border-bottom-color: var(--tab-active);
  font-weight: 600;
}

/* ========== 主布局 ========== */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ========== 侧边栏（目录） ========== */
#sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px 0;
  flex-shrink: 0;
}
#sidebar h3 {
  padding: 12px 16px 8px;
  font-size: 13px;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--sidebar-bg);
  z-index: 1;
}
#sidebar a {
  display: block;
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text-light);
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.1s;
  line-height: 1.5;
}
#sidebar a:hover {
  color: var(--text);
  background: #f8fafc;
  border-left-color: #d0d5dd;
}
#sidebar a.active {
  color: var(--toc-active);
  background: var(--toc-active-bg);
  border-left-color: var(--toc-active);
  font-weight: 500;
}
#toggle-sidebar {
  display: none;
  position: fixed;
  top: 56px;
  left: 8px;
  z-index: 20;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}

/* ========== 内容区 ========== */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px;
  background: var(--content-bg);
}
#content-inner {
  max-width: 820px;
  margin: 0 auto;
}

/* ========== Markdown 渲染样式 ========== */
#content-inner h1 { font-size: 2em; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
#content-inner h2 { font-size: 1.5em; margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 20px; }
#content-inner h3 { font-size: 1.2em; margin: 28px 0 12px; scroll-margin-top: 20px; }
#content-inner h4 { font-size: 1.05em; margin: 20px 0 8px; }
#content-inner p { margin: 0 0 14px; line-height: 1.8; }
#content-inner strong { color: #d63031; }  /* 重点标记用红色 */
#content-inner a { color: var(--tab-active); }
#content-inner blockquote {
  margin: 12px 0;
  padding: 10px 16px;
  border-left: 4px solid #74b9ff;
  background: #f0f7ff;
  border-radius: 0 var(--radius) var(--radius) 0;
  color: #2d5a8e;
}
#content-inner blockquote p { margin: 4px 0; }
#content-inner code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.9em;
  font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  color: #e74c3c;
}
#content-inner pre {
  background: #1e293b;
  color: #e2e8f0;
  padding: 16px 20px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 14px 0;
  font-size: 0.88em;
  line-height: 1.6;
}
#content-inner pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: inherit;
}
#content-inner table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.93em;
}
#content-inner th, #content-inner td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}
#content-inner th {
  background: #f1f5f9;
  font-weight: 600;
  white-space: nowrap;
}
#content-inner tr:nth-child(even) td { background: var(--table-stripe); }
#content-inner hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
#content-inner img { max-width: 100%; }
#content-inner ul, #content-inner ol { margin: 8px 0 14px 24px; line-height: 1.8; }
#content-inner li { margin-bottom: 4px; }
#content-inner details {
  margin: 10px 0;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fafbfc;
}
#content-inner summary { cursor: pointer; font-weight: 500; padding: 4px 0; }

/* ========== 底部状态栏 ========== */
#status-bar {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 6px 16px;
  font-size: 11px;
  color: #aaa;
  display: flex;
  justify-content: space-between;
  flex-shrink: 0;
}
#status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
#status-bar .dot.green { background: #22c55e; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  #sidebar {
    display: none;
    position: fixed;
    top: 49px;
    left: 0;
    bottom: 0;
    z-index: 15;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    width: 260px;
  }
  #sidebar.open { display: block; }
  #toggle-sidebar { display: block; }
  #content { padding: 20px 16px; }
  #tab-bar button { padding: 10px 12px; font-size: 13px; }
}

/* ========== loading ========== */
.loading { display: flex; justify-content: center; align-items: center; height: 200px; color: var(--text-light); font-size: 14px; }
</style>
</head>
<body>

<!-- 顶部标签栏 -->
<div id="tab-bar"></div>

<!-- 侧边栏切换按钮（小屏用） -->
<button id="toggle-sidebar" onclick="toggleSidebar()" title="目录">☰</button>

<div id="main">
  <!-- 左侧目录 -->
  <nav id="sidebar">
    <h3>📑 目录</h3>
    <div id="toc-list"></div>
  </nav>

  <!-- 内容区 -->
  <div id="content">
    <div id="content-inner">
      <div class="loading">加载中...</div>
    </div>
  </div>
</div>

<!-- 底部状态栏 -->
<div id="status-bar">
  <span><span class="dot green"></span> 自动更新中</span>
  <span id="status-time"></span>
</div>

<script>
// ==================== 全局状态 ====================
let modules = [];
let currentModuleId = null;
let currentContent = "";
let lastVersion = "";
let contentCache = {};

// ==================== marked.js 配置 ====================
// 生成标题 ID 的函数（中英文兼容）
function makeHeadingId(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^一-龥a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/(^-|-$)/g, "");
}

marked.setOptions({
  gfm: true,
  breaks: false,
});

// ==================== API 调用 ====================
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ==================== 初始化 ====================
async function init() {
  // 1. 获取模块列表
  modules = await fetchJSON("/api/modules");

  // 2. 渲染标签栏
  renderTabs();

  // 3. 加载上次打开的模块（或第一个）
  const savedId = localStorage.getItem("reader-module");
  const defaultId = modules[0]?.id || "01";
  await switchModule(savedId || defaultId);

  // 4. 启动自动更新轮询
  startAutoReload();
}

// ==================== 标签栏 ====================
function renderTabs() {
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = modules.map(m =>
    `<button data-id="${m.id}" onclick="switchModule('${m.id}')">${m.name}</button>`
  ).join("");
}

function setActiveTab(id) {
  document.querySelectorAll("#tab-bar button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });
}

// ==================== 模块切换 ====================
async function switchModule(id) {
  if (id === currentModuleId) return;
  currentModuleId = id;
  localStorage.setItem("reader-module", id);
  setActiveTab(id);

  // 显示 loading
  document.getElementById("content-inner").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("toc-list").innerHTML = "";

  // 先从缓存读取（如果有）
  if (contentCache[id]) {
    renderContent(contentCache[id].content, contentCache[id].name);
    updateStatusTime(contentCache[id].mtime);
  }

  // 从服务器获取最新内容
  try {
    const data = await fetchJSON(`/api/content?id=${id}`);
    contentCache[id] = data;
    renderContent(data.content, data.name);
    updateStatusTime(data.mtime);
    document.title = `${data.name} — 备考笔记阅读器`;
  } catch (err) {
    document.getElementById("content-inner").innerHTML =
      `<div class="loading">加载失败: ${err.message}</div>`;
  }
}

// ==================== 内容渲染 ====================
function renderContent(mdText, moduleName) {
  currentContent = mdText;

  // 1. 渲染 Markdown 到 HTML
  const html = marked.parse(mdText);
  document.getElementById("content-inner").innerHTML = html;

  // 1.5. 给所有标题加上 id（marked.js 对中文标题不自动生成 id）
  document.querySelectorAll("#content-inner h2, #content-inner h3").forEach(h => {
    h.setAttribute("id", makeHeadingId(h.textContent));
  });

  // 2. 生成目录
  buildTOC(mdText);

  // 3. 修复链接（让外部链接在新窗口打开）
  document.querySelectorAll("#content-inner a[href^='http']").forEach(a => {
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener");
  });

  // 4. 监听滚动以高亮当前目录项
  observeScroll();

  // 5. 滚动到顶部
  document.getElementById("content").scrollTop = 0;
}

// ==================== 目录生成 ====================
function buildTOC(mdText) {
  const lines = mdText.split("\n");
  const tocItems = [];

  for (const line of lines) {
    const m = line.match(/^## (.+)/);
    if (!m) continue;
    const title = m[1].trim();
    if (title === "目录") continue;
    // 使用与 marked 自定义 renderer 相同的 id 生成函数
    const id = makeHeadingId(title);
    tocItems.push({ title, id });
  }

  const container = document.getElementById("toc-list");
  if (tocItems.length === 0) {
    container.innerHTML = '<a style="color:#aaa">暂无目录</a>';
    return;
  }

  container.innerHTML = tocItems.map(item =>
    `<a href="#${item.id}" data-id="${item.id}">${item.title}</a>`
  ).join("");

  // 点击目录项平滑滚动到对应标题
  container.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", function(e) {
      const targetId = this.getAttribute("data-id");
      const el = document.getElementById(targetId);
      if (el) {
        e.preventDefault();
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  });
}

function scrollToHeading(e, id) {
  // 先用 smooth scroll
  const el = document.getElementById(id);
  if (el) {
    e.preventDefault();
    el.scrollIntoView({ behavior: "smooth", block: "start" });
  }
  // 如果找不到元素，让浏览器默认锚点行为处理
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

// ==================== 滚动监听（高亮当前目录） ====================
let observer = null;
function observeScroll() {
  if (observer) observer.disconnect();

  const headings = document.querySelectorAll("#content-inner h2");
  if (headings.length === 0) return;

  observer = new IntersectionObserver((entries) => {
    // 找到第一个部分可见的标题
    let activeId = null;
    for (const entry of entries) {
      if (entry.isIntersecting) {
        activeId = entry.target.id;
        break;
      }
    }
    if (activeId) {
      document.querySelectorAll("#toc-list a").forEach(a => {
        a.classList.toggle("active", a.dataset.id === activeId);
      });
    }
  }, { rootMargin: "-40px 0px -60% 0px" });

  headings.forEach(h => observer.observe(h));
}

// ==================== 自动更新 ====================
async function checkVersion() {
  try {
    const data = await fetchJSON("/api/version");
    if (data.version !== lastVersion && lastVersion !== "") {
      // 文件有变动，重新加载当前模块
      const data2 = await fetchJSON(`/api/content?id=${currentModuleId}`);
      contentCache[currentModuleId] = data2;
      // 记录当前滚动位置
      const contentEl = document.getElementById("content");
      const scrollTop = contentEl.scrollTop;
      // 重新渲染
      renderContent(data2.content, data2.name);
      updateStatusTime(data2.mtime);
      // 恢复滚动位置
      setTimeout(() => { contentEl.scrollTop = Math.min(scrollTop, contentEl.scrollHeight); }, 50);
    }
    lastVersion = data.version;
  } catch (err) {
    // 静默失败
  }
}

function startAutoReload() {
  checkVersion(); // 首次获取版本
  setInterval(checkVersion, 2000); // 每 2 秒检查
}

function updateStatusTime(mtime) {
  const dt = new Date(mtime * 1000);
  document.getElementById("status-time").textContent =
    `最后更新: ${dt.toLocaleString("zh-CN")}`;
}

// ==================== 键盘快捷键 ====================
document.addEventListener("keydown", (e) => {
  // Ctrl/Cmd + 数字键切换模块
  if ((e.ctrlKey || e.metaKey) && e.key >= "1" && e.key <= "8") {
    e.preventDefault();
    const idx = parseInt(e.key) - 1;
    if (idx < modules.length) switchModule(modules[idx].id);
  }
  // Ctrl/Cmd + B 切换侧边栏
  if ((e.ctrlKey || e.metaKey) && e.key === "b") {
    e.preventDefault();
    toggleSidebar();
  }
});

// ==================== 启动 ====================
init();
</script>
</body>
</html>
