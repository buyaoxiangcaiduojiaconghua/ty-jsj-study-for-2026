<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国家电网计算机类 — 备考笔记阅读器</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
/* ========== 全局重置 ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fa;
  --sidebar-bg: #ffffff;
  --content-bg: #ffffff;
  --text: #2c3e50;
  --text-light: #636e72;
  --border: #e0e4e8;
  --tab-active: #2563eb;
  --tab-active-bg: #eff6ff;
  --tab-hover: #f0f4f8;
  --toc-active: #2563eb;
  --toc-active-bg: #eff6ff;
  --code-bg: #f4f5f7;
  --table-stripe: #f8fafc;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --radius: 6px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== 顶部标签栏 ========== */
#tab-bar {
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  overflow-x: auto;
  padding: 0 12px;
  gap: 2px;
  box-shadow: var(--shadow);
  z-index: 10;
}
#tab-bar button {
  flex-shrink: 0;
  padding: 12px 16px;
  border: none;
  background: transparent;
  font-size: 14px;
  color: var(--text-light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: inherit;
}
#tab-bar button:hover { color: var(--tab-active); background: var(--tab-hover); }
#tab-bar button.active {
  color: var(--tab-active);
  border-bottom-color: var(--tab-active);
  font-weight: 600;
}

/* ========== 主布局 ========== */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ========== 侧边栏（目录） ========== */
#sidebar {
  width: 260px;
  min-width: 260px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 8px 0;
  flex-shrink: 0;
}
#sidebar h3 {
  padding: 12px 16px 8px;
  font-size: 13px;
  color: var(--text-light);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
  position: sticky;
  top: 0;
  background: var(--sidebar-bg);
  z-index: 1;
}
#sidebar a {
  display: block;
  padding: 7px 16px;
  font-size: 13px;
  color: var(--text-light);
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.1s;
  line-height: 1.5;
}
#sidebar a:hover {
  color: var(--text);
  background: #f8fafc;
  border-left-color: #d0d5dd;
}
#sidebar a.active {
  color: var(--toc-active);
  background: var(--toc-active-bg);
  border-left-color: var(--toc-active);
  font-weight: 500;
}
/* 手风琴目录 */
.toc-parent {
  font-weight: 600;
  font-size: 13px;
  padding: 7px 16px;
  cursor: pointer;
  border-left: 3px solid transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text);
  transition: all 0.1s;
}
.toc-parent:hover { background: #f8fafc; }
.toc-parent.expanded { color: var(--toc-active); border-left-color: var(--toc-active); }
.toc-parent .arrow { font-size: 10px; transition: transform 0.2s; }
.toc-parent.expanded .arrow { transform: rotate(90deg); }
.toc-children { display: none; }
.toc-children.expanded { display: block; }
.toc-children a {
  padding-left: 32px;
  font-size: 12px;
  color: var(--text-light);
  border-left: 3px solid transparent;
}
.toc-children a.active {
  color: var(--toc-active);
  background: var(--toc-active-bg);
  border-left-color: var(--toc-active);
  font-weight: 500;
}
#toggle-sidebar {
  display: none;
  position: fixed;
  top: 56px;
  left: 8px;
  z-index: 20;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  font-size: 18px;
  cursor: pointer;
  box-shadow: var(--shadow);
}

/* ========== 内容区 ========== */
#content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px;
  background: var(--content-bg);
}
#content-inner {
  max-width: 820px;
  margin: 0 auto;
}

/* ========== Markdown 渲染样式 ========== */
#content-inner h1 { font-size: 2em; margin: 0 0 16px; padding-bottom: 8px; border-bottom: 2px solid var(--border); }
#content-inner h2 { font-size: 1.5em; margin: 40px 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); scroll-margin-top: 20px; }
#content-inner h3 { font-size: 1.2em; margin: 28px 0 12px; scroll-margin-top: 20px; }
#content-inner h4 { font-size: 1.05em; margin: 20px 0 8px; }
#content-inner p { margin: 0 0 14px; line-height: 1.8; }
#content-inner strong { color: #d63031; }  /* 重点标记用红色 */
#content-inner a { color: var(--tab-active); }
#content-inner blockquote {
  margin: 12px 0;
  padding: 10px 16px;
  border-left: 4px solid #74b9ff;
  background: #f0f7ff;
  border-radius: 0 var(--radius) var(--radius) 0;
  color: #2d5a8e;
}
#content-inner blockquote p { margin: 4px 0; }
#content-inner code {
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.9em;
  font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  color: #e74c3c;
}
#content-inner pre {
  background: #1e293b;
  color: #e2e8f0;
  padding: 16px 20px;
  border-radius: var(--radius);
  overflow-x: auto;
  margin: 14px 0;
  font-size: 0.88em;
  line-height: 1.6;
}
#content-inner pre code {
  background: none;
  color: inherit;
  padding: 0;
  font-size: inherit;
}
#content-inner table {
  width: 100%;
  border-collapse: collapse;
  margin: 14px 0;
  font-size: 0.93em;
}
#content-inner th, #content-inner td {
  border: 1px solid var(--border);
  padding: 8px 12px;
  text-align: left;
}
#content-inner th {
  background: #f1f5f9;
  font-weight: 600;
  white-space: nowrap;
}
#content-inner tr:nth-child(even) td { background: var(--table-stripe); }
#content-inner hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
#content-inner img { max-width: 100%; }
#content-inner ul, #content-inner ol { margin: 8px 0 14px 24px; line-height: 1.8; }
#content-inner li { margin-bottom: 4px; }
#content-inner details {
  margin: 10px 0;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fafbfc;
}
#content-inner summary { cursor: pointer; font-weight: 500; padding: 4px 0; }

/* ========== 底部状态栏 ========== */
#status-bar {
  background: #fff;
  border-top: 1px solid var(--border);
  padding: 6px 16px;
  font-size: 11px;
  color: #aaa;
  display: flex;
  justify-content: space-between;
  flex-shrink: 0;
}
#status-bar .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
#status-bar .dot.green { background: #22c55e; }

/* ========== 响应式 ========== */
@media (max-width: 768px) {
  #sidebar {
    display: none;
    position: fixed;
    top: 49px;
    left: 0;
    bottom: 0;
    z-index: 15;
    box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    width: 260px;
  }
  #sidebar.open { display: block; }
  #toggle-sidebar { display: block; }
  #content { padding: 20px 16px; }
  #tab-bar button { padding: 10px 12px; font-size: 13px; }
}

/* ========== loading ========== */
.loading { display: flex; justify-content: center; align-items: center; height: 200px; color: var(--text-light); font-size: 14px; }

/* ========== 刷题模式 ========== */
#quiz-panel { display: none; padding: 16px; }
#quiz-panel.visible { display: block; }
#quiz-score { text-align: center; padding: 12px; font-size: 16px; font-weight: 600; background: #f0f7ff; border-radius: var(--radius); margin-bottom: 16px; }
.quiz-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.quiz-card h4 { font-size: 15px; margin: 0 0 12px; line-height: 1.7; }
.quiz-card .option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  margin: 4px 0;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fafbfc;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.12s;
  font-family: inherit;
}
.quiz-card .option:hover { background: #eff6ff; border-color: var(--tab-active); }
.quiz-card .option.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
.quiz-card .option.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
.quiz-card .option.show-correct { background: #dcfce7; border-color: #22c55e; }
.quiz-card .explanation { display: none; margin-top: 10px; padding: 10px 14px; background: #fefce8; border-radius: 4px; font-size: 13px; line-height: 1.7; border-left: 3px solid #eab308; }
.quiz-card .explanation.visible { display: block; }
.quiz-card.answered .option { pointer-events: none; }
#quiz-reset { display: block; margin: 16px auto; padding: 10px 24px; background: var(--tab-active); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-family: inherit; }
#quiz-reset:hover { opacity: 0.9; }
.quiz-empty { text-align: center; color: var(--text-light); padding: 40px; }
</style>
</head>
<body>

<!-- 顶部标签栏 -->
<div id="tab-bar"></div>

<!-- 侧边栏切换按钮（小屏用） -->
<button id="toggle-sidebar" onclick="toggleSidebar()" title="目录">☰</button>

<div id="main">
  <!-- 左侧目录 -->
  <nav id="sidebar">
    <h3>📑 目录</h3>
    <div id="toc-list"></div>
  </nav>

  <!-- 内容区 -->
  <div id="content">
    <div id="content-inner">
      <div class="loading">加载中...</div>
    </div>
    <!-- 刷题面板 -->
    <div id="quiz-panel">
      <div id="quiz-score"></div>
      <div id="quiz-body"></div>
      <button id="quiz-reset" onclick="resetQuiz()">🔄 重新做题</button>
    </div>
  </div>
</div>

<!-- 底部状态栏 -->
<div id="status-bar">
  <span><span class="dot green"></span> 自动更新中</span>
  <span id="status-time"></span>
  <span style="margin-left: 16px; cursor: pointer;" onclick="toggleQuizMode()" id="quiz-toggle">📝 刷题模式</span>
</div>

<script>
// ==================== 全局状态 ====================
let modules = [];
let currentModuleId = null;
let currentContent = "";
let lastVersion = "";
let contentCache = {};

// ==================== marked.js 配置 ====================
// 生成标题 ID 的函数（中英文兼容）
function makeHeadingId(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/[^一-龥a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-")
    .replace(/(^-|-$)/g, "");
}

marked.setOptions({
  gfm: true,
  breaks: false,
});

// ==================== API 调用 ====================
async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ==================== 初始化 ====================
async function init() {
  // 1. 获取模块列表
  modules = await fetchJSON("/api/modules");

  // 2. 渲染标签栏
  renderTabs();

  // 3. 加载上次打开的模块（或第一个）
  const savedId = localStorage.getItem("reader-module");
  const defaultId = modules[0]?.id || "01";
  await switchModule(savedId || defaultId);

  // 4. 启动自动更新轮询
  startAutoReload();
}

// ==================== 标签栏 ====================
function renderTabs() {
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = modules.map(m =>
    `<button data-id="${m.id}" onclick="switchModule('${m.id}')">${m.name}</button>`
  ).join("");
}

function setActiveTab(id) {
  document.querySelectorAll("#tab-bar button").forEach(b => {
    b.classList.toggle("active", b.dataset.id === id);
  });
}

// ==================== 模块切换 ====================
async function switchModule(id) {
  if (id === currentModuleId) return;
  currentModuleId = id;
  localStorage.setItem("reader-module", id);
  setActiveTab(id);

  // 显示 loading
  document.getElementById("content-inner").innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById("toc-list").innerHTML = "";

  // 先从缓存读取（如果有）
  if (contentCache[id]) {
    renderContent(contentCache[id].content, contentCache[id].name);
    updateStatusTime(contentCache[id].mtime);
  }

  // 从服务器获取最新内容
  try {
    const data = await fetchJSON(`/api/content?id=${id}`);
    contentCache[id] = data;
    renderContent(data.content, data.name);
    updateStatusTime(data.mtime);
    document.title = `${data.name} — 备考笔记阅读器`;
  } catch (err) {
    document.getElementById("content-inner").innerHTML =
      `<div class="loading">加载失败: ${err.message}</div>`;
  }
}

// ==================== 内容渲染 ====================
function renderContent(mdText, moduleName) {
  currentContent = mdText;

  // 1. 渲染 Markdown 到 HTML
  const html = marked.parse(mdText);
  document.getElementById("content-inner").innerHTML = html;

  // 1.5. 给所有标题加上 id（marked.js 对中文标题不自动生成 id）
  document.querySelectorAll("#content-inner h2, #content-inner h3").forEach(h => {
    h.setAttribute("id", makeHeadingId(h.textContent));
  });

  // 2. 生成目录
  buildTOC(mdText);

  // 3. 修复链接（让外部链接在新窗口打开）
  document.querySelectorAll("#content-inner a[href^='http']").forEach(a => {
    a.setAttribute("target", "_blank");
    a.setAttribute("rel", "noopener");
  });

  // 4. 监听滚动以高亮当前目录项
  observeScroll();

  // 5. 滚动到顶部
  document.getElementById("content").scrollTop = 0;
}

// ==================== 目录生成（手风琴式） ====================
function buildTOC(mdText) {
  const lines = mdText.split("\n");
  const sections = [];

  let currentSection = null;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const h2m = line.match(/^## (.+)/);
    const h3m = line.match(/^### (.+)/);
    if (h2m) {
      const title = h2m[1].trim();
      if (title === "目录") continue;
      currentSection = { h2: { title, id: makeHeadingId(title) }, children: [] };
      sections.push(currentSection);
    } else if (h3m && currentSection) {
      const title = h3m[1].trim();
      currentSection.children.push({ title, id: makeHeadingId(title) });
    }
  }

  const container = document.getElementById("toc-list");
  if (sections.length === 0) {
    container.innerHTML = '<a style="color:#aaa">暂无目录</a>';
    return;
  }

  container.innerHTML = sections.map((sec, si) => {
    const hasChildren = sec.children.length > 0;
    return `
      <div class="toc-parent" data-section="${si}">
        <span>${sec.h2.title}</span>
        ${hasChildren ? '<span class="arrow">▶</span>' : ''}
      </div>
      <div class="toc-children">
        ${sec.children.map(c => `<a href="#${c.id}" data-id="${c.id}">${c.title}</a>`).join("")}
      </div>
    `;
  }).join("");

  // 点击父级切换展开/折叠
  container.querySelectorAll(".toc-parent").forEach(parent => {
    parent.addEventListener("click", function() {
      const si = parseInt(this.dataset.section);
      const children = container.querySelectorAll(".toc-children")[si];
      const isExpanded = this.classList.contains("expanded");
      if (isExpanded) {
        this.classList.remove("expanded");
        children.classList.remove("expanded");
      } else {
        this.classList.add("expanded");
        children.classList.add("expanded");
      }
    });
  });

  // 点击子级平滑滚动
  container.querySelectorAll(".toc-children a").forEach(a => {
    a.addEventListener("click", function(e) {
      const targetId = this.getAttribute("data-id");
      const el = document.getElementById(targetId);
      if (el) {
        e.preventDefault();
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    });
  });
}

// ==================== 滚动监听（自动展开当前章节） ====================
let observer = null;
function observeScroll() {
  if (observer) observer.disconnect();

  const h2s = document.querySelectorAll("#content-inner h2");
  if (h2s.length === 0) return;

  const parents = document.querySelectorAll(".toc-parent");
  const childrens = document.querySelectorAll(".toc-children");

  observer = new IntersectionObserver((entries) => {
    let activeIdx = -1;
    for (const entry of entries) {
      if (entry.isIntersecting) {
        activeIdx = Array.from(h2s).indexOf(entry.target);
        break;
      }
    }
    if (activeIdx < 0) return;

    parents.forEach((p, i) => {
      p.classList.toggle("expanded", i === activeIdx);
      childrens[i].classList.toggle("expanded", i === activeIdx);
    });
  }, { rootMargin: "-40px 0px -60% 0px" });

  h2s.forEach(h => observer.observe(h));
}

// ==================== 自动更新 ====================
async function checkVersion() {
  try {
    const data = await fetchJSON("/api/version");
    if (data.version !== lastVersion && lastVersion !== "") {
      // 文件有变动，重新加载当前模块
      const data2 = await fetchJSON(`/api/content?id=${currentModuleId}`);
      contentCache[currentModuleId] = data2;
      // 记录当前滚动位置
      const contentEl = document.getElementById("content");
      const scrollTop = contentEl.scrollTop;
      // 重新渲染
      renderContent(data2.content, data2.name);
      updateStatusTime(data2.mtime);
      // 恢复滚动位置
      setTimeout(() => { contentEl.scrollTop = Math.min(scrollTop, contentEl.scrollHeight); }, 50);
    }
    lastVersion = data.version;
  } catch (err) {
    // 静默失败
  }
}

function startAutoReload() {
  checkVersion(); // 首次获取版本
  setInterval(checkVersion, 2000); // 每 2 秒检查
}

function updateStatusTime(mtime) {
  const dt = new Date(mtime * 1000);
  document.getElementById("status-time").textContent =
    `最后更新: ${dt.toLocaleString("zh-CN")}`;
}

// ==================== 刷题模式 ====================
let quizMode = false;
let quizState = { total: 0, answered: 0, correct: 0 };

function toggleQuizMode() {
  quizMode = !quizMode;
  const toggle = document.getElementById("quiz-toggle");
  const content = document.getElementById("content-inner");
  const quizPanel = document.getElementById("quiz-panel");
  const tocList = document.getElementById("toc-list");

  if (quizMode) {
    toggle.textContent = "📖 阅读模式";
    content.style.display = "none";
    quizPanel.classList.add("visible");
    buildQuiz();
  } else {
    toggle.textContent = "📝 刷题模式";
    content.style.display = "";
    quizPanel.classList.remove("visible");
  }
}

function extractQuestions(mdText) {
  const questions = [];
  const lines = mdText.split("\n");
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    // 匹配 **真题 N：标题** 或 **真题 N: 标题**
    if (/^\*\*真题\s*\d+/.test(line)) {
      const title = line.replace(/^\*\*[^*]+\*\*\s*/, '').trim();
      let options = [];
      let answer = '';
      let explanation = '';
      i++;

      // 收集选项和解析，直到遇到下一个真题或分隔线
      while (i < lines.length) {
        const l = lines[i];
        if (/^\*\*真题\s*\d+/.test(l) || l === '---' || /^## /.test(l)) break;
        
        // 选项可能在一行或多行，用 A. B. C. D. 匹配
        // 支持全角空格（\u3000）和半角空格
        const opts = [...l.matchAll(/([A-D])\.\s*(.+?)(?=\s*[A-D]\.\s|$)/g)];
        if (opts) {
          opts.forEach(o => {
            options.push({ letter: o[1], text: o[2].trim() });
          });
        }
        
        // 解析行中的答案: **答案：A。** 或 **答案：A**
        const ansM = l.match(/\*\*答案[：:]\s*([A-D]+)/);
        if (ansM) {
          answer = ansM[1];
          explanation = l.replace(/^>\s*/, '').trim();
        }
        i++;
      }

      if (options.length >= 2 && answer) {
        questions.push({ title, options, answer, explanation });
      }
    } else {
      i++;
    }
  }
  return questions;
}
function buildQuiz() {
  const questions = extractQuestions(currentContent);
  const body = document.getElementById("quiz-body");
  const score = document.getElementById("quiz-score");

  if (questions.length === 0) {
    body.innerHTML = '<div class="quiz-empty">📭 当前模块未检测到真题/例题，请切换到其他模块</div>';
    score.textContent = "";
    return;
  }

  quizState = { total: questions.length, answered: 0, correct: 0 };
  updateScore();

  body.innerHTML = questions.map((q, qi) => `
    <div class="quiz-card" id="q-${qi}">
      <h4>${qi + 1}. ${q.title}</h4>
      ${q.options.map((o, oi) => `
        <button class="option" onclick="answerQ(${qi}, '${o.letter}', this)">${o.letter}. ${o.text}</button>
      `).join("")}
      <div class="explanation" id="exp-${qi}">💡 <strong>答案：${q.answer}</strong><br>${q.explanation}</div>
    </div>
  `).join("");
}

function answerQ(qi, letter, btn) {
  const card = document.getElementById("q-" + qi);
  if (card.classList.contains("answered")) return;
  card.classList.add("answered");

  const questions = extractQuestions(currentContent);
  const q = questions[qi];
  const correct = q.answer === letter;

  if (correct) {
    btn.classList.add("correct");
    quizState.correct++;
  } else {
    btn.classList.add("wrong");
    // 高亮正确答案
    card.querySelectorAll(".option").forEach(o => {
      if (o.textContent.trim().startsWith(q.answer + ".")) {
        o.classList.add("show-correct");
      }
    });
  }

  quizState.answered++;
  document.getElementById("exp-" + qi).classList.add("visible");
  updateScore();
}

function updateScore() {
  const score = document.getElementById("quiz-score");
  if (quizState.answered === 0) {
    score.innerHTML = `📝 共 ${quizState.total} 道题，点击选项开始答题`;
  } else if (quizState.answered === quizState.total) {
    const pct = Math.round(quizState.correct / quizState.total * 100);
    const emoji = pct >= 90 ? "🎉" : pct >= 70 ? "👍" : pct >= 50 ? "💪" : "📚";
    score.innerHTML = `${emoji} 完成！正确 ${quizState.correct}/${quizState.total}（${pct}%）`;
  } else {
    score.innerHTML = `📝 已答 ${quizState.answered}/${quizState.total}，正确 ${quizState.correct} 道`;
  }
}

function resetQuiz() {
  quizState = { total: 0, answered: 0, correct: 0 };
  buildQuiz();
}

// ==================== 键盘快捷键 ====================
document.addEventListener("keydown", (e) => {
  // Ctrl/Cmd + 数字键切换模块
  if ((e.ctrlKey || e.metaKey) && e.key >= "1" && e.key <= "8") {
    e.preventDefault();
    const idx = parseInt(e.key) - 1;
    if (idx < modules.length) switchModule(modules[idx].id);
  }
  // Ctrl/Cmd + B 切换侧边栏
  if ((e.ctrlKey || e.metaKey) && e.key === "b") {
    e.preventDefault();
    toggleSidebar();
  }
});

// ==================== 启动 ====================
init();
</script>
</body>
